a\",\"children\":\"$L24\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n18:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0ditdb5-g6x-v.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n19:[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0h6pid50w8_n4.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n1a:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/3siqlqjr1v4fe.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"25:I[55489,[\"/_next/static/chunks/0qufxx6nl15ij.js\",\"/_next/static/chunks/1uymn__-_z4ug.js\",\"/_next/static/chunks/2yl2c4ss1jgbl.js\",\"/_next/static/chunks/1ogvimk0-k2zc.js\",\"/_next/static/chunks/370b3yrg4tur3.js\",\"/_next/static/chunks/2_h6is8-aperz.js\",\"/_next/static/chunks/3qcoeqbx1mias.js\"],\"default\"]\n26:T19f1,"])</script><script>self.__next_f.push([1,"# 로컬 저장·설정 영속화\n\n\u003e 요약: 기기에 남길 데이터는 민감도와 수명에 따라 prefs, 보안 저장소, DB로 나눈다.\n\n---\n\n## 1. 왜 / 언제\n\n앱을 껐다 켜도 온보딩을 다시 보면 설정이 영속화되지 않은 것이다. 반대로 액세스 토큰을 일반 설정 파일에 두면 백업·루팅·공유 스토리지에서 새어 나간다.\n\n로컬 저장은 패키지 이름이 먼저가 아니다. **민감도·수명·오프라인 요구**를 나눈 다음 저장소를 고른다.\n\n서버가 진실의 원천인 데이터는 캐시다. 기기 전용 플래그는 로컬이 원천이다. 이 구분을 제품에서 합의하지 않으면 멀티 기기에서 설정이 싸운다.\n\n---\n\n## 2. 핵심\n\n| 데이터 | 후보 | 이유 |\n|--------|------|------|\n| 온보딩 완료, 테마 모드 | `shared_preferences` | 작은 키-값, 비밀 아님 |\n| 액세스·리프레시 토큰 | secure storage | 키체인/키스토어 |\n| 검색·오프라인 큐·관계 | SQLite / drift | 쿼리와 마이그레이션 |\n| 이미지·파일 캐시 | 캐시 디렉터리 | 만료·용량 제한 |\n\n일반 prefs는 XML/plist에 가깝다. 암호화가 목적이 아니다. 토큰·개인식별값을 두지 않는다.\n\n키 이름은 도메인처럼 짓는다. `done`, `flag1`은 충돌한다. `onboarding.done`, `settings.themeMode`처럼 읽히게 한다. 마이그레이션 계획이 없으면 키가 늘어나며 죽은 값이 남는다.\n\nSQLite는 스키마 버전이 앱 버전과 함께 간다. 컬럼을 추가하면 마이그레이션을 적는다. 파일을 지우고 다시 만드는 방식은 사용자 데이터를 날린다.\n\n로컬은 유실된다. 기기 변경, 앱 삭제, OS 저장소 정리다. “절대 없어지면 안 되는 값”은 서버에 둔다.\n\n읽기·쓰기는 비동기다. `build`에서 `await`하지 않는다. 로드는 `initState` 또는 앱 기동 시퀀스에서 하고, 결과는 상태에 넣는다.\n\n---\n\n## 3. 예제\n\n### shared_preferences\n\n```yaml\ndependencies:\n  shared_preferences: ^2.3.0\n```\n\n```dart\nclass SettingsStore {\n  SettingsStore(this._prefs);\n\n  static const String themeKey = 'settings.themeMode';\n\n  final SharedPreferences _prefs;\n\n  static Future\u003cSettingsStore\u003e open() async {\n    final SharedPreferences prefs = await SharedPreferences.getInstance();\n    return SettingsStore(prefs);\n  }\n\n  ThemeMode themeMode() {\n    final String? raw = _prefs.getString(themeKey);\n    return switch (raw) {\n      'dark' =\u003e ThemeMode.dark,\n      'light' =\u003e ThemeMode.light,\n      _ =\u003e ThemeMode.system,\n    };\n  }\n\n  Future\u003cvoid\u003e setThemeMode(ThemeMode mode) async {\n    final String raw = switch (mode) {\n      ThemeMode.dark =\u003e 'dark',\n      ThemeMode.light =\u003e 'light',\n      ThemeMode.system =\u003e 'system',\n    };\n    await _prefs.setString(themeKey, raw);\n  }\n}\n```\n\n불리언 플래그도 같다.\n\n```dart\nconst String onboardingKey = 'onboarding.done';\n\nFuture\u003cvoid\u003e completeOnboarding(SharedPreferences prefs) async {\n  await prefs.setBool(onboardingKey, true);\n}\n\nbool isOnboardingDone(SharedPreferences prefs) {\n  return prefs.getBool(onboardingKey) ?? false;\n}\n```\n\n없는 키는 `null`이다. `?? false`로 기본값을 명시한다. “없음”과 `false`를 구분해야 하면 별도 키 또는 버전을 둔다.\n\n### 비밀은 보안 저장소\n\n```yaml\ndependencies:\n  flutter_secure_storage: ^9.2.0\n```\n\n```dart\nclass TokenStore {\n  TokenStore(this._storage);\n\n  static const String accessKey = 'auth.accessToken';\n\n  final FlutterSecureStorage _storage;\n\n  Future\u003cvoid\u003e saveAccessToken(String token) async {\n    await _storage.write(key: accessKey, value: token);\n  }\n\n  Future\u003cString?\u003e readAccessToken() {\n    return _storage.read(key: accessKey);\n  }\n\n  Future\u003cvoid\u003e clear() async {\n    await _storage.delete(key: accessKey);\n  }\n}\n```\n\n로그아웃은 메모리뿐 아니라 저장소도 지운다. prefs에 토큰을 미러링하지 않는다.\n\n### 기동 시 로드\n\n```dart\nclass AppScope extends StatefulWidget {\n  const AppScope({super.key, required this.child});\n\n  final Widget child;\n\n  @override\n  State\u003cAppScope\u003e createState() =\u003e _AppScopeState();\n}\n\nclass _AppScopeState extends State\u003cAppScope\u003e {\n  late final Future\u003cSettingsStore\u003e _settings;\n\n  @override\n  void initState() {\n    super.initState();\n    _settings = SettingsStore.open();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return FutureBuilder\u003cSettingsStore\u003e(\n      future: _settings,\n      builder: (BuildContext context, AsyncSnapshot\u003cSettingsStore\u003e snap) {\n        if (!snap.hasData) {\n          return const MaterialApp(\n            home: Scaffold(\n              body: Center(child: CircularProgressIndicator()),\n            ),\n          );\n        }\n        return MyApp(settings: snap.data!);\n      },\n    );\n  }\n}\n```\n\n설정이 준비되기 전에 본문을 그리지 않는다. 테마가 깜빡이며 바뀌는 것을 줄인다.\n\n### SQLite가 맞을 때\n\n오프라인 초안, 전문 검색, 관계(글-댓글)가 있으면 키-값으로 직렬화하지 않는다. drift 또는 sqflite로 테이블을 둔다. 스키마 버전을 올리고, 마이그레이션에 `ALTER TABLE`을 적는다. 릴리스 노트에 마이그레이션을 포함한다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| prefs에 토큰 | 유출·백업 노출 | secure storage |\n| 키 이름 `flag` | 충돌·폐기 불가 | 도메인.키 + 버전 |\n| `build`에서 getInstance | 리빌드마다 비동기 깜빡임 | 기동 시 한 번 |\n| JSON 문자열을 prefs에 대형 목록 | 파싱·용량 한계 | SQLite |\n| 마이그레이션 없이 컬럼 추가 | 업데이트 후 크래시 | 스키마 버전 |\n| 로컬만 진실 | 기기 변경 시 데이터 상실 | 서버 원천 여부 합의 |\n\n멀티 프로세스(위젯·백그라운드)에서 prefs 타이밍이 어긋날 수 있다. 단순 설정은 괜찮다. 카운터처럼 자주 쓰는 값은 충돌을 가정한다.\n\n캐시 디렉터리 파일은 언제든 지워질 수 있다. 사용자 문서처럼 다루지 않는다.\n\n---\n\n## 정리\n\n영속화는 패키지 선택이 아니다. **민감도·수명·오프라인 요구**를 표로 나눈 다음 prefs, 보안 저장소, DB를 고른다. 비밀은 일반 설정에 두지 않는다.\n\n---\n\n## 연습\n\n1. 테마 모드를 prefs에 저장하고 재실행 뒤 복원한다.\n2. 온보딩 플래그 키를 `onboarding.done`으로 고정한다.\n3. 토큰 저장을 secure storage로 옮기고 로그아웃 때 삭제한다.\n4. 앱이 지워지면 사라져도 되는 값과 서버에 있어야 하는 값을 표로 나눈다."])</script><script>self.__next_f.push([1,"1c:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"로컬 저장·설정 영속화\\\",\\\"description\\\":\\\"기기에 남길 데이터는 민감도와 수명에 따라 prefs, 보안 저장소, DB로 나눈다.\\\",\\\"datePublished\\\":\\\"2026-07-06\\\",\\\"url\\\":\\\"https://kaisa.co.kr/posts/flutter-09/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\",\\\"url\\\":\\\"https://kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"flutter\\\",\\\"keywords\\\":\\\"flutter\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa\\\",\\\"item\\\":\\\"https://kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"로컬 저장·설정 영속화\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/flutter-09/\\\"}]}]}\"}}],[\"$\",\"main\",null,{\"className\":\"blog-main\",\"children\":[\"$\",\"div\",null,{\"className\":\"site-shell\",\"children\":[\"$\",\"article\",null,{\"className\":\"blog-post site-shell__inner\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/posts/\",\"className\":\"blog-post__back\",\"children\":\"← 목록으로\"}],[\"$\",\"div\",null,{\"className\":\"blog-post__meta\",\"children\":[\"$\",\"span\",null,{\"children\":\"2026-07-06\"}]}],[\"$\",\"h1\",null,{\"className\":\"blog-post__title\",\"children\":\"로컬 저장·설정 영속화\"}],[\"$\",\"$L25\",null,{\"content\":\"$26\"}],\"$L27\",\"$L28\"]}]}]}]]\n"])</script><script>self.__next_f.push([1,"29:I[44398,[\"/_next/static/chunks/0qufxx6nl15ij.js\",\"/_next/static/chunks/1uymn__-_z4ug.js\",\"/_next/static/chunks/2yl2c4ss1jgbl.js\",\"/_next/static/chunks/1ogvimk0-k2zc.js\",\"/
