n\":[\"$\",\"$L23\",null,{\"children\":[\"$\",\"$1e\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L24\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n18:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0ditdb5-g6x-v.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n19:[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0h6pid50w8_n4.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n1a:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/3siqlqjr1v4fe.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"25:I[55489,[\"/_next/static/chunks/0qufxx6nl15ij.js\",\"/_next/static/chunks/1uymn__-_z4ug.js\",\"/_next/static/chunks/2yl2c4ss1jgbl.js\",\"/_next/static/chunks/1ogvimk0-k2zc.js\",\"/_next/static/chunks/370b3yrg4tur3.js\",\"/_next/static/chunks/2_h6is8-aperz.js\",\"/_next/static/chunks/3qcoeqbx1mias.js\"],\"default\"]\n26:T181b,"])</script><script>self.__next_f.push([1,"# Vue Router와 Pinia로 화면·상태 구성\n\n\u003e 요약: URL과 화면을 라우터로 맞추고, 여러 화면이 공유하는 상태는 Pinia 스토어에 두는 SPA 구성 방법을 정리한다.\n\n---\n\n## 1. 왜 둘을 나누는가\n\nSPA(단일 페이지 애플리케이션)는 페이지를 통째로 새로고침하지 않고 화면만 바꾼다.\n\n- **Vue Router** — URL ↔ 화면. 주소가 북마크·뒤로 가기의 진실이다.\n- **Pinia** — 여러 화면이 공유하는 클라이언트 상태 창고. 로그인 사용자, UI 설정처럼 서버에 없는 값.\n\n폼 입력, 모달 열림처럼 **한 화면만** 아는 값은 컴포넌트 `ref`에 둔다. 목록 캐시처럼 서버 데이터는 나중 단계에서 TanStack Query 등을 검토한다. 모든 것을 Pinia에 넣지 않는다.\n\n---\n\n## 2. 핵심 개념\n\n| 개념 | 한 줄 |\n|------|--------|\n| `routes` | `path`와 컴포넌트를 짝짓는다 |\n| lazy import | 해당 화면 JS를 필요할 때 받는다 |\n| `beforeEach` | 이동 전에 로그인·권한을 검사하는 가드 |\n| Pinia 스토어 | `defineStore`로 만든 공유 상태. setup 함수와 같은 모양 |\n| `useRoute` / `useRouter` | 현재 URL, 프로그래밍 방식 이동 |\n\nVue 3의 상태 라이브러리는 Vuex가 아니라 **Pinia**가 기본 권장이다.\n\n---\n\n## 3. 동작하는 예: 라우터 + 인증 스토어\n\n`src/stores/auth.ts`:\n\n```ts\nimport { defineStore } from 'pinia'\nimport { computed, ref } from 'vue'\n\nexport const useAuthStore = defineStore('auth', () =\u003e {\n  const user = ref\u003cstring | null\u003e(null)\n  const isLoggedIn = computed(() =\u003e user.value !== null)\n\n  function login(name: string) {\n    user.value = name\n  }\n\n  function logout() {\n    user.value = null\n  }\n\n  return { user, isLoggedIn, login, logout }\n})\n```\n\nsetup 스토어는 Composition API와 같다. `return`한 것만 바깥에서 쓴다.\n\n`src/router/index.ts`:\n\n```ts\nimport { createRouter, createWebHistory } from 'vue-router'\nimport { useAuthStore } from '../stores/auth'\n\nconst router = createRouter({\n  history: createWebHistory(import.meta.env.BASE_URL),\n  routes: [\n    {\n      path: '/',\n      name: 'home',\n      component: () =\u003e import('../pages/HomeView.vue'),\n    },\n    {\n      path: '/login',\n      name: 'login',\n      component: () =\u003e import('../pages/LoginView.vue'),\n    },\n    {\n      path: '/posts/:id',\n      name: 'post',\n      component: () =\u003e import('../pages/PostView.vue'),\n      props: true,\n      meta: { requiresAuth: true },\n    },\n  ],\n})\n\nrouter.beforeEach((to) =\u003e {\n  const auth = useAuthStore()\n  if (to.meta.requiresAuth \u0026\u0026 !auth.isLoggedIn) {\n    return { name: 'login', query: { redirect: to.fullPath } }\n  }\n})\n\nexport default router\n```\n\n`props: true`면 `:id`가 컴포넌트 props `id`로 들어간다.\n\n`src/main.ts`:\n\n```ts\nimport { createApp } from 'vue'\nimport { createPinia } from 'pinia'\nimport App from './App.vue'\nimport router from './router'\n\nconst app = createApp(App)\napp.use(createPinia())\napp.use(router)\napp.mount('#app')\n```\n\nPinia를 라우터보다 먼저 `use`한다. 가드에서 스토어를 쓰기 때문이다.\n\n`src/App.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\nimport { RouterLink, RouterView } from 'vue-router'\nimport { useAuthStore } from './stores/auth'\n\nconst auth = useAuthStore()\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003cheader\u003e\n    \u003cnav\u003e\n      \u003cRouterLink to=\"/\"\u003e홈\u003c/RouterLink\u003e\n      \u003cRouterLink to=\"/posts/42\"\u003e글 42\u003c/RouterLink\u003e\n    \u003c/nav\u003e\n    \u003cspan v-if=\"auth.isLoggedIn\"\u003e{{ auth.user }}\u003c/span\u003e\n    \u003cbutton v-else type=\"button\" @click=\"auth.login('demo')\"\u003e로그인\u003c/button\u003e\n  \u003c/header\u003e\n  \u003cRouterView /\u003e\n\u003c/template\u003e\n```\n\n`src/pages/PostView.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\ndefineProps\u003c{ id: string }\u003e()\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003carticle\u003e\n    \u003ch1\u003e글 {{ id }}\u003c/h1\u003e\n  \u003c/article\u003e\n\u003c/template\u003e\n```\n\n`src/pages/LoginView.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\nimport { useRoute, useRouter } from 'vue-router'\nimport { useAuthStore } from '../stores/auth'\n\nconst route = useRoute()\nconst router = useRouter()\nconst auth = useAuthStore()\n\nfunction submit() {\n  auth.login('demo')\n  const redirect = typeof route.query.redirect === 'string' ? route.query.redirect : '/'\n  router.replace(redirect)\n}\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003cform @submit.prevent=\"submit\"\u003e\n    \u003cbutton type=\"submit\"\u003e데모 로그인\u003c/button\u003e\n  \u003c/form\u003e\n\u003c/template\u003e\n```\n\n가드에서 무거운 API를 매 이동마다 호출하면 전환이 느려진다. 토큰 존재 여부처럼 최소 정보만 본다.\n\n---\n\n## 4. 상태를 어디에 둘 것인가\n\n| 상태 | 위치 |\n|------|------|\n| 입력 중인 검색어 | 페이지 컴포넌트 `ref` |\n| 로그인 세션 | Pinia (+ httpOnly 쿠키는 서버) |\n| 현재 글 id | URL `params` (스토어 복제 금지) |\n| 서버 목록 캐시 | 페칭 라이브러리 검토. Pinia에 수동 복사하지 않음 |\n\nURL에 있는 값을 스토어에 또 넣으면 둘이 어긋난다. `id`는 라우트만 진실로 둔다.\n\n---\n\n## 5. 주의 / 흔한 실수\n\n- **라우터보다 Pinia를 늦게 등록.** `beforeEach`에서 `useAuthStore()`가 실패한다.\n- **가드에서 `next()` (Vue Router 3).** Vue Router 4는 `return { name: 'login' }` 또는 아무것도 반환하지 않으면 통과다.\n- **모든 페이지를 한 번에 import.** `() =\u003e import(...)` lazy가 초기 번들을 줄인다.\n- **스토어에서 컴포넌트 `useRouter()`로 화면을 바꾸기.** 스토어는 데이터. 이동은 뷰/가드.\n- **Pinia에 서버 리스트를 미러링.** 중복·만료·페이지네이션이 한 창고에 섞인다.\n\n---\n\n## 정리\n\nRouter는 **주소와 화면**, Pinia는 **공유 클라이언트 상태**다. 경계를 지키면 SPA가 단순해진다.\n\n- 화면 전환 → `routes` + `RouterView`\n- 인증 문 → `meta` + `beforeEach`\n- 공유 상태 → setup 스토어 `return { ... }`\n\n---\n\n## 연습\n\n1. `/about` 라우트를 lazy 컴포넌트로 추가하고 홈에서 `RouterLink`로 이동한다.\n2. `requiresAuth` 메타를 홈에도 걸고, 로그아웃 후 홈 진입이 로그인으로 리다이렉트되는지 확인한다.\n3. `useCounterStore`를 만들어 홈과 다른 페이지에서 같은 `count`가 보이는지 확인한다."])</script><script>self.__next_f.push([1,"1c:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"Vue Router와 Pinia로 화면·상태 구성\\\",\\\"description\\\":\\\"URL과 화면을 라우터로 맞추고, 여러 화면이 공유하는 상태는 Pinia 스토어에 두는 SPA 구성 방법을 정리한다.\\\",\\\"datePublished\\\":\\\"2024-09-23\\\",\\\"url\\\":\\\"https://kaisa.co.kr/posts/vue-04/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\",\\\"url\\\":\\\"https://kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"vue\\\",\\\"keywords\\\":\\\"vue\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa\\\",\\\"item\\\":\\\"https://kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"Vue Router와 Pinia로 화면·상태 구성\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/vue-04/\\\"}]}]}\"}}],[\"$\",\"main\",null,{\"className\":\"blog-main\",\"children\":[\"$\",\"div\",null,{\"className\":\"site-shell\",\"children\":[\"$\",\"article\",null,{\"className\":\"blog-post site-shell__inner\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/posts/\",\"className\":\"blog-post__back\",\"children\":\"← 목록으로\"}],[\"$\",\"div\
