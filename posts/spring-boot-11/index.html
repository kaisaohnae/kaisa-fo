"script-1\",{\"src\":\"/_next/static/chunks/41kc-ofjiogtv.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L1e\",null,{\"children\":[\"$\",\"$1f\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@20\"}]}]]}]\n21:[]\n16:\"$W21\"\n17:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L22\",null,{\"children\":\"$L23\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L24\",null,{\"children\":[\"$\",\"$1f\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L25\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n19:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/1zfx1jx7y3rwx.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n1a:[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0h6pid50w8_n4.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n1b:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/1ssbrdd0ls_ca.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"26:I[55489,[\"/_next/static/chunks/0qufxx6nl15ij.js\",\"/_next/static/chunks/1uymn__-_z4ug.js\",\"/_next/static/chunks/41j3z4ql-jtq2.js\",\"/_next/static/chunks/1ogvimk0-k2zc.js\",\"/_next/static/chunks/0ffbtj1adztt5.js\",\"/_next/static/chunks/32gau8cvvk9co.js\",\"/_next/static/chunks/41kc-ofjiogtv.js\"],\"default\"]\n27:T2d5f,"])</script><script>self.__next_f.push([1,"# Spring AOP — 횡단 관심사와 프록시 쉽게 이해하기\n\n\u003e 요약: 공통 관심사(로깅, 트랜잭션 등)를 핵심 로직에서 분리하는 AOP의 원리와 실무 프록시 동작 방식을 친절하게 정리한다.\n\n---\n\n## 1. AOP란 무엇인가? (쉬운 비유로 시작하기)\n\n식당에서 주문을 받고 요리하는 상황을 떠올려 보자.\n\n- **주방장의 본업(핵심 로직)**: 주문받은 요리 맛있게 만들기 (주문 생성, 결제 승인, 회원 가입 등)\n- **공통 부가 작업(횡단 관심사)**:\n  - 주방에 들어갈 때 손 소독하기 (인증/권한 검사)\n  - 요리 시작 시간과 끝난 시간 기록하기 (성능 측정 / 로깅)\n  - 재료가 상했으면 작업 취소하고 폐기하기 (트랜잭션 롤백 / 예외 처리)\n\n만약 100가지 메뉴를 만들 때마다 주방장이 일일이 손 소독 코드를 넣고, 스톱워치를 켜고 끄는 코드를 모든 요리 메서드에 직접 적는다면 어떻게 될까?\n\n```java\n// AOP 없이 작성한 비즈니스 코드의 비극\npublic void orderMenu(OrderRequest req) {\n    // 1. 공통 부가 작업: 권한 검사\n    authService.checkAdmin();\n    // 2. 공통 부가 작업: 시간 측정 시작\n    long start = System.currentTimeMillis();\n\n    try {\n        // === [진짜 하고 싶었던 핵심 비즈니스 로직 2줄] ===\n        Order order = orderRepository.save(new Order(req));\n        paymentGateway.pay(order);\n        // ============================================\n    } catch (Exception e) {\n        // 3. 공통 부가 작업: 에러 로깅 \u0026 알림\n        slackNotifier.sendError(e);\n        throw e;\n    } finally {\n        // 4. 공통 부가 작업: 실행 시간 로깅\n        long end = System.currentTimeMillis();\n        log.info(\"orderMenu 실행 시간: {}ms\", (end - start));\n    }\n}\n```\n\n진짜 중요한 **주문과 결제 로직은 2줄**뿐인데, 부가 작업 코드가 앞뒤를 덮어버린다. 게다가 이런 메서드가 100개라면 시간 측정 방식을 바꿀 때 100개 메서드를 전부 수정해야 한다.\n\n이 문제를 해결하기 위해 등장한 것이 바로 **AOP(Aspect-Oriented Programming, 관점 지향 프로그래밍)** 다. 부가 기능(횡단 관심사)을 한곳으로 쏙 뽑아내어 모듈화하고, 핵심 비즈니스 로직은 본연의 역할에만 집중하게 만든다.\n\n---\n\n## 2. AOP 핵심 용어 5분 만에 마스터하기\n\n용어가 다소 낯설지만, 일상적인 개념에 대입하면 아주 단순하다.\n\n| 용어 | 쉬운 설명 | 일상 비유 | 스프링 코드 예시 |\n|------|-----------|-----------|------------------|\n| **Aspect (관점/부가기능 팩)** | 부가 기능들을 모아놓은 모듈 클래스 | '보안/위생 관리 규정집' | `@Aspect @Component class LoggingAspect` |\n| **Advice (언제 + 무엇을 할지)** | 실제로 실행될 부가 기능 코드 | '요리 전 손 씻기', '요리 후 뒷정리' | `@Before`, `@After`, `@Around` 메서드 |\n| **Join Point (끼어들 수 있는 지점)** | 부가 기능을 끼워 넣을 수 있는 모든 위치 | 레시피의 각 단계 (재료 손질 전, 불 켜기 전 등) | 스프링에서는 **메서드 실행 시점** |\n| **Pointcut (어디에 끼워 넣을지)** | 수많은 메서드 중 실제로 적용할 타깃을 고르는 필터 | '불을 쓰는 모든 요리'만 선택 | `@annotation(MeasureTime)` |\n| **Target (대상 객체)** | 부가 기능을 적용받는 순수 비즈니스 객체 | 순수 요리 레시피 | `OrderService`, `MemberService` |\n| **Proxy (대리자/가짜 객체)** | 타깃 앞에서 부가 기능을 먼저 가로채 실행해 주는 비서 | 주방장 앞에 서서 스톱워치 재주는 보조 요리사 | 스프링이 자동 생성하는 CGLIB 프록시 객체 |\n\n---\n\n## 3. 스프링 AOP의 비밀: '프록시(Proxy)'란?\n\n스프링 AOP는 마법이 아니다. **대리인(Proxy) 객체**를 중간에 세워서 작동한다.\n\n우리가 `@Autowired OrderService orderService`로 주입받는 객체는 실제 `OrderService`가 아니라, 스프링이 감싸서 만든 **가짜 껍데기(Proxy 객체)** 다.\n\n```\n[클라이언트(Controller)] \n       │ \n       ▼ (1) orderService.order() 호출\n[OrderService 프록시 (가짜 객체)] \n       │  ├─▶ [시간 측정 시작!] (Advice 실행)\n       │  ▼ (2) 진짜 메서드 실행 위임\n[OrderService 원본 (진짜 타깃 객체)] \n       │  ├─▶ 핵심 주문 로직 실행\n       │  ▼ (3) 결과 반환\n[OrderService 프록시 (가짜 객체)] \n       │  ├─▶ [시간 측정 종료 \u0026 로그 출력!] (Advice 실행)\n       ▼ (4) 최종 반환\n[클라이언트(Controller)]\n```\n\n### 프록시 생성 방식 (CGLIB)\nSpring Boot는 기본적으로 **CGLIB**라는 바이트코드 조작 기술을 사용한다. 타깃 클래스를 상속받아 자식 클래스 프록시를 만들기 때문에, 인터페이스가 없어도 일반 클래스에 AOP를 바로 적용할 수 있다.\n\n---\n\n## 4. Advice 종류 5가지 한눈에 보기\n\n| Advice 어노테이션 | 실행 타이밍 | 주로 사용하는 곳 |\n|-------------------|-------------|------------------|\n| `@Before` | 타깃 메서드가 실행되기 **직전** | 권한 체크, 요청 파라미터 유효성 사전 검사 |\n| `@AfterReturning` | 타깃 메서드가 **정상적으로 끝난 직후** | 반환값 로깅, 성공 감사 로그 기록 |\n| `@AfterThrowing` | 타깃 메서드에서 **예외가 터졌을 때** | 에러 슬랙 알림, 예외 변환 |\n| `@After` | 성공/예외 상관없이 **메서드가 끝날 때** (finally) | 사용했던 리소스 정리 |\n| **`@Around`** | **메서드 실행 전 + 후 전체를 감쌈** | **실행 시간 측정, 트랜잭션, 캐싱, 재시도 로직 (가장 많이 씀)** |\n\n---\n\n## 5. 실전 예제: 내 손으로 직접 만드는 `@MeasureTime` (시간 측정 AOP)\n\n실무에서 가장 유용하게 쓰이는 **커스텀 어노테이션 기반 시간 측정 AOP**를 단계별로 만들어 보자.\n\n### Step 1. 커스텀 어노테이션 만들기\n메서드 위에 붙일 스티커 같은 어노테이션을 정의한다.\n\n```java\npackage com.example.annotation;\n\nimport java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\n@Target(ElementType.METHOD) // 메서드에 붙이겠다고 선언\n@Retention(RetentionPolicy.RUNTIME) // 런타임까지 유지\npublic @interface MeasureTime {\n    String value() default \"\"; // 작업 이름 (옵션)\n}\n```\n\n### Step 2. Aspect(부가기능 처리기) 만들기\n\n```java\npackage com.example.aop;\n\nimport com.example.annotation.MeasureTime;\nimport lombok.extern.slf4j.Slf4j;\nimport org.aspectj.lang.ProceedingJoinPoint;\nimport org.aspectj.lang.annotation.Around;\nimport org.aspectj.lang.annotation.Aspect;\nimport org.springframework.stereotype.Component;\n\n@Slf4j\n@Aspect      // 1. AOP 설정 클래스임을 명시\n@Component   // 2. 스프링 빈으로 등록\npublic class ExecutionTimeAspect {\n\n    // @MeasureTime 어노테이션이 붙은 메서드 전후(@Around)에 이 로직을 끼워넣음\n    @Around(\"@annotation(measureTime)\")\n    public Object measureExecutionTime(ProceedingJoinPoint joinPoint, MeasureTime measureTime) throws Throwable {\n        String taskName = measureTime.value().isBlank() \n                ? joinPoint.getSignature().toShortString() \n                : measureTime.value();\n\n        long startTime = System.currentTimeMillis();\n        log.info(\"[시작] {}\", taskName);\n\n        try {\n            // 진짜 타깃 메서드를 실행하는 핵심 코드!\n            Object result = joinPoint.proceed();\n            return result;\n        } finally {\n            long totalTime = System.currentTimeMillis() - startTime;\n            if (totalTime \u003e 1000) {\n                log.warn(\"[경고: 느린 작업] {} 완료! 소요시간: {}ms\", taskName, totalTime);\n            } else {\n                log.info(\"[완료] {} 완료! 소요시간: {}ms\", taskName, totalTime);\n            }\n        }\n    }\n}\n```\n\n### Step 3. 서비스 코드에 스티커처럼 붙이기\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class OrderService {\n\n    private final OrderRepository orderRepository;\n\n    @MeasureTime(\"전체 주문 통계 집계\")\n    public List\u003cOrderSummary\u003e calculateMonthlyReport(int year, int month) {\n        // 복잡하고 오래 걸리는 비즈니스 쿼리 실행...\n        return orderRepository.getMonthlyReport(year, month);\n    }\n}\n```\n\n비즈니스 코드는 시간 측정 관련 코드가 1줄도 없이 순수하게 유지된다.\n\n---\n\n## 6. 실무 주의사항: 내부 호출(Self-Invocation)의 덫\n\nAOP를 처음 쓸 때 가장 많이 겪는 미스터리한 버그가 바로 **같은 클래스 내부 호출 문제**다.\n\n### 왜 내부 호출은 AOP가 안 먹힐까?\n\n```java\n@Service\npublic class OrderService {\n\n    public void createOrder() {\n        System.out.println(\"1. 주문 생성 로직\");\n        \n        // 같은 클래스 안의 메서드를 호출함 (this.sendEmail())\n        this.sendEmail(); \n    }\n\n    @MeasureTime(\"이메일 발송 시간 측정\") // \u003c- 동작하지 않음!\n    public void sendEmail() {\n        System.out.println(\"2. 이메일 발송 로직\");\n    }\n}\n```\n\n**이유:**\n외부(`Controller`)에서 `createOrder()`를 호출할 때는 **프록시(대리인)** 를 거친다. 하지만 `createOrder()` 내부에서 `sendEmail()`을 부를 때는 프록시가 아니라 **자기 자신(`this`)의 원본 메서드를 직접 호출**해 버리기 때문에 AOP 부가기능이 완전히 무시된다.\n\n```\n[외부 호출] ──▶ [OrderService Proxy] ──▶ [OrderService 원본: createOrder()]\n                                                     │\n                                            (this.sendEmail 직접 호출)\n                                                     ▼\n                                          [OrderService 원본: sendEmail()] \n                                          ※ Proxy를 거치지 않아 AOP 동작 안 함!\n```\n\n### 해결책: 가장 깔끔한 방법은 '클래스 분리'\n역할에 맞게 메일 발송 로직을 별도의 `NotificationService` 클래스로 분리하고 주입받아 호출하면 자연스럽게 프록시를 거치게 된다.\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class OrderService {\n    private final NotificationService notificationService; // 별도 빈 주입\n\n    public void createOrder() {\n        System.out.println(\"1. 주문 생성\");\n        notificationService.sendEmail(); // 프록시를 통해 호출되므로 AOP 정상 작동!\n    }\n}\n```\n\n---\n\n## 7. 핵심 요약 및 팁\n\n1. **AOP는 횡단 관심사(로깅, 트랜잭션, 보안 등)를 깔끔하게 분리**해 주는 기술이다.\n2. 스프링은 **프록시(대리 객체)** 를 통해 타깃 메서드 앞뒤에 Advice를 끼워 넣는다.\n3. 실무에서는 복잡한 Pointcut 표현식보다 **커스텀 어노테이션(`@annotation`)** 을 만들어 필요한 곳에 명시적으로 붙이는 방식이 훨씬 안전하다.\n4. `private` 메서드나 같은 클래스 내부 호출(`this.method()`)은 프록시를 거치지 않으므로 AOP가 적용되지 않는다.\n\n---\n\n## 연습\n\n1. Controller 메서드 진입 시 요청 파라미터를 예쁘게 출력해 주는 `@RequestLog` AOP를 구현해 본다.\n2. 실행 중 예외가 발생하면 콘솔에 에러 메시지와 함께 실행 메서드명을 출력하는 `@AfterThrowing` Advice를 작성해 본다."])</script><script>self.__next_f.push([1,"1d:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"Spring AOP — 횡단 관심사와 프록시 쉽게 이해하기\\\",\\\"description\\\":\\\"공통 관심사(로깅, 트랜잭션 등)를 핵심 로직에서 분리하는 AOP의 원리와 실무 프록시 동작 방식을 친절하게 정리한다.\\\",\\\"datePublished\\\":\\\"2024-01-15\\\",\\\"url\\\":\\\"https://kaisa.co.kr/p
