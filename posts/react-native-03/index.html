\n\n---\n\n## 3. 예제\n\n로그인 필드 두 개:\n\n```tsx\nimport { useState } from 'react';\nimport { TextInput, Text, View, Pressable, ActivityIndicator } from 'react-native';\n\nexport function LoginForm({\n  onSubmit,\n}: {\n  onSubmit: (email: string, password: string) =\u003e Promise\u003cvoid\u003e;\n}) {\n  const [email, setEmail] = useState('');\n  const [password, setPassword] = useState('');\n  const [error, setError] = useState\u003cstring | null\u003e(null);\n  const [loading, setLoading] = useState(false);\n\n  const handleSubmit = async () =\u003e {\n    if (!email.includes('@')) {\n      setError('이메일 형식을 확인하세요');\n      return;\n    }\n    setError(null);\n    setLoading(true);\n    try {\n      await onSubmit(email.trim(), password);\n    } finally {\n      setLoading(false);\n    }\n  };\n\n  return (\n    \u003cView style={{ gap: 12 }}\u003e\n      \u003cTextInput\n        value={email}\n        onChangeText={setEmail}\n        placeholder=\"email\"\n        autoCapitalize=\"none\"\n        keyboardType=\"email-address\"\n        textContentType=\"emailAddress\"\n        returnKeyType=\"next\"\n      /\u003e\n      \u003cTextInput\n        value={password}\n        onChangeText={setPassword}\n        placeholder=\"password\"\n        secureTextEntry\n        textContentType=\"password\"\n        returnKeyType=\"done\"\n        onSubmitEditing={handleSubmit}\n      /\u003e\n      {error ? \u003cText style={{ color: 'tomato' }}\u003e{error}\u003c/Text\u003e : null}\n      \u003cPressable onPress={handleSubmit} disabled={loading}\u003e\n        {loading ? \u003cActivityIndicator /\u003e : \u003cText\u003e로그인\u003c/Text\u003e}\n      \u003c/Pressable\u003e\n    \u003c/View\u003e\n  );\n}\n```\n\n`textContentType` / `autoComplete`는 비밀번호 매니저 대응에 도움이 된다.\n\n다음 필드로 포커스:\n\n```tsx\nconst passwordRef = useRef\u003cTextInput\u003e(null);\n\n\u003cTextInput\n  returnKeyType=\"next\"\n  onSubmitEditing={() =\u003e passwordRef.current?.focus()}\n/\u003e\n\u003cTextInput ref={passwordRef} secureTextEntry /\u003e\n```\n\n검증이 커지면 스키마를 한곳으로 모은다.\n\n```bash\nnpx expo install react-hook-form zod @hookform/resolvers\n```\n\n```tsx\nimport { useForm, Controller } from 'react-hook-form';\nimport { z } from 'zod';\nimport { zodResolver } from '@hookform/resolvers/zod';\n\nconst schema = z.object({\n  email: z.string().email(),\n  password: z.string().min(8),\n});\n\ntype FormValues = z.infer\u003ctypeof schema\u003e;\n\nexport function SignupForm() {\n  const { control, handleSubmit, formState: { errors } } = useForm\u003cFormValues\u003e({\n    resolver: zodResolver(schema),\n    defaultValues: { email: '', password: '' },\n  });\n\n  return (\n    \u003c\u003e\n      \u003cController\n        control={control}\n        name=\"email\"\n        render={({ field: { onChange, onBlur, value } }) =\u003e (\n          \u003cTextInput value={value} onBlur={onBlur} onChangeText={onChange} /\u003e\n        )}\n      /\u003e\n      {errors.email ? \u003cText\u003e{errors.email.message}\u003c/Text\u003e : null}\n      \u003cPressable onPress={handleSubmit((data) =\u003e console.log(data))} /\u003e\n    \u003c/\u003e\n  );\n}\n```\n\n키보드 UX 체크:\n\n- `returnKeyType=\"next\" | \"done\"`\n- `onSubmitEditing`으로 다음 포커스\n- `Keyboard.dismiss()`\n- `ScrollView`에 `keyboardShouldPersistTaps=\"handled\"`\n- 제출 중 버튼 비활성\n\n반복 UI 로직만 훅으로 뺀다.\n\n```tsx\nfunction useToggle(initial = false) {\n  const [on, setOn] = useState(initial);\n  const toggle = useCallback(() =\u003e setOn((v) =\u003e !v), []);\n  return { on, toggle, setOn };\n}\n```\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 서버 목록을 `useEffect` + `setState` | React Query |\n| 파생 값을 또 `useState` | 렌더 중 계산 |\n| `onChange` (웹) | `onChangeText` |\n| 로딩 중에도 제출 가능 | `disabled` + 스피너 |\n| 모든 필드를 전역 스토어 | 폼은 로컬. 제출 결과만 공유 |\n| `useEffect`로 입력값을 다른 state에 복사 | 한 곳만 진실로 둔다 |\n\n구독은 정리 함수를 같이 둔다.\n\n```tsx\nuseEffect(() =\u003e {\n  const sub = AppState.addEventListener('change', onChange);\n  return () =\u003e sub.remove();\n}, []);\n```\n\n---\n\n## 5. 정리\n\n상태는 **누가 소유하는가**가 먼저다. 입력은 화면, 서버 데이터는 Query, 세션만 전역에 가깝게 둔다.\n\n- 작은 폼: `useState` + 에러 메시지.\n- 큰 폼: `react-hook-form` + zod.\n- 키보드는 `returnKeyType`, 포커스, AvoidingView가 한 세트다.\n\n## 연습\n\n1. 이메일·비밀번호·에러·로딩이 있는 로그인 폼을 만든다.\n2. zod + react-hook-form으로 회원가입 검증을 붙인다.\n3. `useRef`로 비밀번호 필드 자동 포커스를 구현한다.\n4. `useToggle`로 비밀번호 표시/숨김을 만든다."])</script><script>self.__next_f.push([1,"1d:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"상태·훅·폼 — 사용자 입력과 데이터 흐름\\\",\\\"description\\\":\\\"화면 상태는 훅에 두고, 폼 입력은 검증과 키보드 UX까지 한 흐름으로 만든다.\\\",\\\"datePublished\\\":\\\"2024-03-13\\\",\\\"url\\\":\\\"https://kaisa.co.kr/posts/react-native-03/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\",\\\"url\\\":\\\"https://kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"react-native\\\",\\\"keywords\\\":\\\"react-native\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa\\\",\\\"item\\\":\\\"https://kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"상태·훅·폼 — 사용자 입력과 데이터 흐름\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/react-native-03/\\\"}]}]}\"}}],[\"$\",\"main\",null,{\"className\":\"blog-main\",\"children\":[\"$\",\"div\",null,{\"className\":\"site-shell\",\"children\":[\"$\",\"article\",null,{\"className\":\"blog-post site-shell__inner\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/posts/\",\"className\":\"blog-post__back\",\"children\":\"← 목록으로\"}],[\"$\",\"div\",null,{\"className\":\"blog-post__meta\",\"children
