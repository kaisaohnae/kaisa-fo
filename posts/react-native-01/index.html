\"/_next/static/chunks/0g93akm33ce_n.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n19:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0l7zbvjzypglv.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"24:I[55489,[\"/_next/static/chunks/3t-_5l233af4w.js\",\"/_next/static/chunks/1uymn__-_z4ug.js\",\"/_next/static/chunks/23u3jdspf1pgv.js\",\"/_next/static/chunks/1hr7-4fb6m83q.js\",\"/_next/static/chunks/2_h6is8-aperz.js\",\"/_next/static/chunks/3qcoeqbx1mias.js\"],\"default\"]\n25:T1350,"])</script><script>self.__next_f.push([1,"# React Native와 Expo로 시작하기\n\n\u003e 요약: Expo와 TypeScript로 React Native 프로젝트를 만들고, 첫 화면이 뜨기까지의 기본 지도를 잡는다.\n\n---\n\n## 1. 왜 Expo로 시작하나\n\nReact Native는 JavaScript/TypeScript로 **iOS·Android 네이티브 UI**를 만드는 프레임워크다. 웹의 DOM 대신 네이티브 뷰를 그린다. 컴포넌트·훅·상태 모델은 React와 같다.\n\n**Expo**는 그 위에 올라가는 개발·빌드·배포 툴체인이다. 네이티브 프로젝트를 직접 만지지 않고도 앱을 만들고, 나중에 스토어 빌드까지 이어갈 수 있다.\n\n지금은 Expo가 “토이 전용”이 아니다. 학습과 프로덕션 모두 **Expo + TypeScript**를 기본선으로 둔다.\n\n| 구분 | React (웹) | React Native |\n|------|------------|--------------|\n| 렌더 | HTML/CSS | 네이티브 뷰 |\n| 스타일 | CSS | StyleSheet + Flex |\n| 라우팅 | react-router 등 | Expo Router |\n| 번들 | Vite/Webpack | Metro |\n\n---\n\n## 2. 핵심 개념\n\n**Managed Expo**가 기본이다. 네이티브 폴더(`ios/`, `android/`)를 직접 관리하지 않는다. 커스텀 네이티브가 필요하면 config plugin과 prebuild로 확장한다.\n\n| 항목 | Expo | Bare CLI |\n|------|------|----------|\n| 시작 | 빠르다 | 느리다 |\n| 스토어 빌드 | EAS Build | Xcode/Gradle 직접 |\n| JS 핫픽스 | EAS Update | 직접 구성 |\n| 네이티브 모듈 | config plugin | 수동 연동 |\n\n**EAS**(Expo Application Services)는 Expo의 클라우드 빌드·제출·업데이트 서비스다. 지금은 “나중에 쓴다” 정도만 기억하면 된다. 배포 문에서 다룬다.\n\nNew Architecture는 최근 Expo SDK에서 기본/권장이다.\n\n- **Fabric**: 새 렌더러\n- **TurboModules**: 네이티브 모듈 호출\n- **JSI**: JS와 네이티브의 저수준 연결\n\n브릿지 병목이 줄었다는 점만 알면 시작에는 충분하다.\n\n---\n\n## 3. 예제\n\n환경: Node.js LTS(20+), Git, Android Studio 또는 Xcode(macOS). 실기기는 **Expo Go** 앱으로 바로 실행할 수 있다.\n\n```bash\nnpx create-expo-app@latest my-app --template tabs\ncd my-app\nnpx expo start\n```\n\nTypeScript + Expo Router 템플릿을 고른다. `tabs`가 그 조합이다.\n\n```\napp/                 # 파일 기반 라우팅\n├── _layout.tsx\n├── index.tsx\n├── (tabs)/\n└── +not-found.tsx\ncomponents/\nhooks/\nassets/\napp.json\n```\n\n`app.json`의 핵심만 맞춘다.\n\n```json\n{\n  \"expo\": {\n    \"name\": \"MyApp\",\n    \"slug\": \"my-app\",\n    \"scheme\": \"myapp\",\n    \"version\": \"1.0.0\",\n    \"orientation\": \"portrait\",\n    \"platforms\": [\"ios\", \"android\"]\n  }\n}\n```\n\n첫 화면은 `View`와 `Text`다. 웹의 `div`/`span`에 가깝다. `className`은 기본이 아니다.\n\n```tsx\n// app/index.tsx\nimport { Text, View, StyleSheet } from 'react-native';\n\nexport default function HomeScreen() {\n  return (\n    \u003cView style={styles.container}\u003e\n      \u003cText style={styles.title}\u003eHello, React Native\u003c/Text\u003e\n    \u003c/View\u003e\n  );\n}\n\nconst styles = StyleSheet.create({\n  container: {\n    flex: 1,\n    alignItems: 'center',\n    justifyContent: 'center',\n    backgroundColor: '#0f172a',\n  },\n  title: {\n    fontSize: 24,\n    fontWeight: '700',\n    color: '#f8fafc',\n  },\n});\n```\n\n개발 루프:\n\n```bash\nnpx expo start\n# a: Android / i: iOS / w: web\n# r: reload\n```\n\n저장하면 Fast Refresh가 반영한다. 실기기는 같은 Wi-Fi, 안 되면 tunnel 모드를 쓴다.\n\nTypeScript는 props·API·라우트 파라미터에 타입을 거는 용도다.\n\n```tsx\ntype User = {\n  id: string;\n  name: string;\n};\n\nfunction greet(user: User): string {\n  return `Hi, ${user.name}`;\n}\n```\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| Bare CLI부터 시작 | 먼저 Expo. 막힐 때만 prebuild |\n| 웹처럼 `div`/`span` | `View`/`Text`. 문자열은 반드시 `Text` 안 |\n| CSS 파일·className | `StyleSheet`. NativeWind는 팀 합의 후 |\n| `ios/`/`android/`를 바로 커밋 | managed를 유지. 필요 시 CNG/prebuild |\n| 시크릿을 `app.json`에 넣기 | `EXPO_PUBLIC_*`만 클라이언트. 비밀은 서버 |\n\n웹 CSS 감각을 그대로 가져오면 레이아웃이 깨진다. Flex 기본 방향이 **세로(`column`)** 인 점부터 다시 익힌다. 다음 글에서 다룬다.\n\n---\n\n## 5. 정리\n\nReact Native 시작은 네이티브 프로젝트 생성이 아니다. **Expo + TypeScript + Expo Router**로 실행 루프를 고정하는 일이다.\n\n- Expo는 RN 툴체인이다. 나중에 EAS로 빌드·OTA를 붙인다.\n- 화면은 네이티브 뷰다. HTML/CSS가 아니다.\n- New Architecture는 켜 두고, 세부 API는 필요할 때 본다.\n\n## 연습\n\n1. Expo 프로젝트를 만들고 에뮬레이터 또는 실기기에서 실행한다.\n2. 홈 화면에 앱 이름과 버전 텍스트를 표시한다.\n3. `app.json`의 `name`, `scheme`을 바꾸고 반영을 확인한다.\n4. `User` 타입과 그 값을 그리는 작은 컴포넌트를 만든다."])</script><script>self.__next_f.push([1,"1b:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"React Native와 Expo로 시작하기\\\",\\\"description\\\":\\\"Expo와 TypeScript로 React Native 프로젝트를 만들고, 첫 화면이 뜨기까지의 기본 지도를 잡는다.\\\",\\\"datePublished\\\":\\\"2023-05-30\\\",\\\"url\\\":\\\"https://kaisa.co.kr/posts/react-native-01/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\",\\\"url\\\":\\\"https://kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"react-native\\\",\\\"keywords\\\":\\\"react-native\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa\\\",\\\"item\\\":\\\"https://kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"React Native와 Expo로 시작하기\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/react-native-01/\\\"}]}]}\"}}],[\"$\",\"main\",null,{\"className\":\"blog-main\",\"children\":[\"$\",\"div\",null,{\"className\":\"site-shell\",\"children\":[\"$\",\"article\",null,{\"className\":\"blog-post site-shell__inner\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/posts/\",\"className\":\"blog-post__back\",\"children\":\"← 목록으로\"}],[\"$\",\"div\",null,{\"className\":\"blog-post__meta\",\"children\":[\
