l,{\"children\":[\"$\",\"$1f\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L25\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n19:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0ditdb5-g6x-v.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n1a:[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0h6pid50w8_n4.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n1b:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/3siqlqjr1v4fe.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"26:I[55489,[\"/_next/static/chunks/0qufxx6nl15ij.js\",\"/_next/static/chunks/1uymn__-_z4ug.js\",\"/_next/static/chunks/2yl2c4ss1jgbl.js\",\"/_next/static/chunks/1ogvimk0-k2zc.js\",\"/_next/static/chunks/370b3yrg4tur3.js\",\"/_next/static/chunks/2_h6is8-aperz.js\",\"/_next/static/chunks/3qcoeqbx1mias.js\"],\"default\"]\n27:T17cf,"])</script><script>self.__next_f.push([1,"# 인증·보안 저장소·디바이스 권한\n\n\u003e 요약: 로그인 토큰은 SecureStore에 두고, 카메라·앨범·알림 권한은 필요할 때만 요청한다.\n\n---\n\n## 1. 왜 지금 권한과 저장소를 나누나\n\n웹은 쿠키·httpOnly로 세션을 숨길 여지가 있다. 앱은 토큰을 기기에 둬야 자동 로그인이 된다. 일반 저장소에 넣으면 백업·루팅·로그에 노출되기 쉽다.\n\n**SecureStore**는 운영체제 보안 저장소에 작은 비밀 값을 넣는 Expo 모듈이다. iOS는 Keychain, Android는 Keystore 계열이다. access token처럼 짧은 비밀에 쓴다.\n\n권한(카메라, 앨범, 알림)은 앱 시작 시 한꺼번에 묻지 않는다. **쓰는 화면에서** 이유를 말한 뒤 시스템 다이얼로그를 띄운다.\n\n---\n\n## 2. 핵심 개념\n\n| 금지 | 권장 |\n|------|------|\n| AsyncStorage에 access token | SecureStore |\n| 소스에 API 시크릿 | 백엔드만 |\n| 로그에 토큰·개인정보 | 마스킹 |\n| 실행 직후 모든 권한 | 필요 시점 요청 |\n\n세션은 Provider 한 곳이 소유한다. 시작 시 SecureStore에서 토큰을 읽고 `/me`로 복구한다. 실패하면 지운다.\n\n생체 인증은 **로컬 잠금**이다. 서버 로그인을 대체하지 않는다. 지문 성공이 곧 API 인증은 아니다.\n\n웹 타깃이면 SecureStore가 없다. `Platform` 분기 또는 쿠키 세션이 필요하다.\n\n권한 거부 후에는 설정 앱으로 보내는 UI가 필요하다. 시스템 다이얼로그는 한 번 거절되면 다시 안 뜨는 경우가 많다.\n\n---\n\n## 3. 예제\n\n```bash\nnpx expo install expo-secure-store\n```\n\n```tsx\nimport * as SecureStore from 'expo-secure-store';\n\nconst TOKEN_KEY = 'access_token';\n\nexport async function saveToken(token: string) {\n  await SecureStore.setItemAsync(TOKEN_KEY, token);\n}\n\nexport async function loadToken() {\n  return SecureStore.getItemAsync(TOKEN_KEY);\n}\n\nexport async function clearToken() {\n  await SecureStore.deleteItemAsync(TOKEN_KEY);\n}\n```\n\n큰 JSON을 SecureStore에 넣지 않는다. 토큰 문자열만 둔다.\n\n```tsx\ntype AuthState = {\n  user: User | null;\n  token: string | null;\n  isLoading: boolean;\n  signIn: (email: string, password: string) =\u003e Promise\u003cvoid\u003e;\n  signOut: () =\u003e Promise\u003cvoid\u003e;\n};\n\nexport function AuthProvider({ children }: { children: React.ReactNode }) {\n  const [token, setToken] = useState\u003cstring | null\u003e(null);\n  const [user, setUser] = useState\u003cUser | null\u003e(null);\n  const [isLoading, setIsLoading] = useState(true);\n\n  useEffect(() =\u003e {\n    (async () =\u003e {\n      const t = await loadToken();\n      if (t) {\n        setToken(t);\n        try {\n          setUser(await api\u003cUser\u003e('/me', { token: t }));\n        } catch {\n          await clearToken();\n          setToken(null);\n        }\n      }\n      setIsLoading(false);\n    })();\n  }, []);\n\n  const signIn = async (email: string, password: string) =\u003e {\n    const res = await api\u003c{ token: string; user: User }\u003e('/auth/login', {\n      method: 'POST',\n      body: JSON.stringify({ email, password }),\n    });\n    await saveToken(res.token);\n    setToken(res.token);\n    setUser(res.user);\n  };\n\n  const signOut = async () =\u003e {\n    await clearToken();\n    queryClient.clear();\n    setToken(null);\n    setUser(null);\n  };\n\n  return (\n    \u003cAuthContext.Provider value={{ user, token, isLoading, signIn, signOut }}\u003e\n      {children}\n    \u003c/AuthContext.Provider\u003e\n  );\n}\n```\n\n`isLoading` 동안 라우트를 바꾸지 않는다. 로그인 화면이 깜빡인다. `expo-splash-screen`으로 네이티브 스플래시를 유지할 수 있다.\n\n소셜 로그인은 인가 코드를 **서버에 넘겨** 토큰을 받는다. 클라이언트에 장기 시크릿을 두지 않는다.\n\n```bash\nnpx expo install expo-auth-session expo-web-browser expo-crypto\n```\n\n생체 잠금(선택):\n\n```bash\nnpx expo install expo-local-authentication\n```\n\n```tsx\nconst ok = await LocalAuthentication.authenticateAsync({\n  promptMessage: '잠금 해제',\n});\nif (ok.success) {\n  // 앱 잠금만 해제. 서버 세션과는 별개\n}\n```\n\n앨범은 쓰는 순간에 요청한다.\n\n```bash\nnpx expo install expo-image-picker\n```\n\n```tsx\nconst perm = await ImagePicker.requestMediaLibraryPermissionsAsync();\nif (!perm.granted) {\n  // 왜 필요한지 안내 후 Linking.openSettings()\n  return;\n}\n\nconst result = await ImagePicker.launchImageLibraryAsync({\n  mediaTypes: ['images'],\n  quality: 0.8,\n});\n```\n\n흐름: 사전 설명 → 시스템 다이얼로그 → 거부 시 설정 이동.\n\n`app.json`에 용도 문구가 없으면 스토어에서 거절된다.\n\n```json\n{\n  \"expo\": {\n    \"plugins\": [\n      [\n        \"expo-image-picker\",\n        {\n          \"photosPermission\": \"프로필 사진을 올리려면 사진첩이 필요합니다.\"\n        }\n      ]\n    ],\n    \"ios\": {\n      \"infoPlist\": {\n        \"NSCameraUsageDescription\": \"게시글에 사진을 찍기 위해 카메라가 필요합니다.\"\n      }\n    }\n  }\n}\n```\n\n푸시 토큰은 실기기에서 테스트한다. 에뮬레이터 제약이 있다. 탭 시 딥링크는 라우터와 맞춘다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| AsyncStorage에 토큰 | SecureStore |\n| 시작 시 카메라·알림 한꺼번에 | 해당 버튼/화면에서 |\n| 권한 거부 후 아무 안내 없음 | 설정 이동 CTA |\n| 생체를 서버 로그인으로 착각 | 로컬 잠금만 |\n| 로그아웃 후 Query 캐시 잔류 | `queryClient.clear()` |\n| usage description 없이 플러그인 | `app.json` 문구 필수 |\n\n---\n\n## 5. 정리\n\n인증은 **토큰 위치 + 세션 복구 + 권한 시점**이다. UI보다 이 세 가지가 먼저다.\n\n- 비밀은 SecureStore. 장바구니는 AsyncStorage도 된다.\n- 스플래시가 끝날 때까지 가드를 보류한다.\n- 권한 문구는 코드와 `app.json`에 같이 있다.\n\n## 연습\n\n1. SecureStore로 로그인·자동 로그인·로그아웃을 구현한다.\n2. `AuthProvider`와 라우터 가드를 연결한다.\n3. 이미지 피커 거절 시 설정 안내를 만든다.\n4. (선택) 포그라운드 복귀 시 생체 잠금을 붙인다."])</script><script>self.__next_f.push([1,"1d:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"_
