g | 1024px | 넓은 본문, 다열 대시보드 |\n\n값은 프로젝트마다 달라도 된다. 중요한 것은 이름과 값을 한곳에 모아 두는 일이다. 컴포넌트마다 737px, 769px처럼 비슷한 숫자를 흩뿌리지 않는다.\n\n---\n\n## 폭에 따라 커지는 단위\n\n미디어 쿼리 없이도 폭에 맞춰지는 값이 있다. 컨테이너 너비와 제목 크기가 대표이다.\n\n```css\n.container {\n  width: min(100% - 2rem, 72rem);\n  margin-inline: auto;\n}\n\n.title {\n  font-size: clamp(1.5rem, 1rem + 2vw, 2.5rem);\n}\n```\n\n`min(100% - 2rem, 72rem)`은 양쪽 1rem 여백을 남기되, 72rem을 넘지 않는다. 가운데 정렬은 `margin-inline: auto`이다.\n\n`clamp(최소, 선호, 최대)`는 글자 크기를 화면 폭에 따라 움직이되 한계를 넘지 않는다. `2vw`만 쓰면 큰 모니터에서 제목이 과하게 커진다.\n\n| 단위 | 기준 |\n|------|------|\n| `%` | 부모 너비 |\n| `vw` | 뷰포트 가로의 1% |\n| `rem` | 루트 글자 크기. 사용자 확대에 따라 변한다 |\n| `clamp()` | 최소·선호·최대를 한 값으로 |\n\n고정 `px`를 남발하면 확대와 좁은 화면에서 깨진다. 한계가 있는 유동 값이 더 안전하다.\n\n---\n\n## 이미지와 터치\n\n큰 히어로를 모든 기기에 같은 파일로 주지 않는다. `srcset`과 `sizes`로 폭에 맞는 파일을 고른다.\n\n```html\n\u003cimg\n  src=\"/hero-800.webp\"\n  srcset=\"/hero-800.webp 800w, /hero-1600.webp 1600w\"\n  sizes=\"(min-width: 72rem) 72rem, 100vw\"\n  alt=\"작업 공간 전경\"\n  width=\"1600\"\n  height=\"900\"\n/\u003e\n```\n\n터치 대상은 대략 44px 전후가 필요하다. 작은 아이콘만 있는 버튼은 padding을 늘린다.\n\n호버로만 열리는 정보는 터치에서 도달할 수 없다. 호버 효과는 마우스가 있는 환경에만 둔다.\n\n```css\n@media (hover: hover) and (pointer: fine) {\n  .card:hover {\n    transform: translateY(-2px);\n  }\n}\n```\n\n---\n\n## 흔한 실수\n\n- 데스크톱 레이아웃을 기본으로 두고 `max-width`로 모바일만 예외 처리한다. 기본을 좁은 화면으로 뒤집는다.\n- 브레이크포인트를 기기 이름에 맞춘다. 레이아웃이 깨지는 폭에 둔다.\n- `font-size: 3vw`처럼 상한 없이 키운다. `clamp`로 최대를 둔다.\n- 컨테이너를 `width: 100%`만 주고 좌우 여백이 없다. `min(100% - gutter, max)`를 쓴다.\n- 호버 툴팁만으로 설명을 제공한다. 클릭이나 항상 보이는 텍스트를 남긴다.\n\n---\n\n## 정리\n\n반응형은 미디어 쿼리 개수가 아니다. 좁은 화면을 기본으로 두고, 레이아웃이 실제로 바뀌는 지점만 확장하면 된다. 컨테이너와 글자 크기는 `min`·`clamp`로 한계를 정한 뒤, 쿼리로는 내비·열 수처럼 구조가 바뀌는 것만 다룬다.\n\n---\n\n## 연습\n\n1. 좁은 화면에서 세로로 쌓인 카드를 `min-width: 640px`에서 2열 Grid로 바꾸되, 기본 CSS에는 1열만 둔다.\n2. `.container`를 `min(100% - 2rem, 72rem)`으로 두고 창을 넓혀 72rem에서 멈추는지 확인한다.\n3. 제목에 `clamp`를 적용하고, 브라우저 최소·최대 폭에서 글자 크기가 한계를 넘지 않는지 본다."])</script><script>self.__next_f.push([1,"1c:[[\"$\",\"scri
