",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0g93akm33ce_n.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n19:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0l7zbvjzypglv.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"24:I[55489,[\"/_next/static/chunks/3t-_5l233af4w.js\",\"/_next/static/chunks/1uymn__-_z4ug.js\",\"/_next/static/chunks/23u3jdspf1pgv.js\",\"/_next/static/chunks/1hr7-4fb6m83q.js\",\"/_next/static/chunks/2_h6is8-aperz.js\",\"/_next/static/chunks/3qcoeqbx1mias.js\"],\"default\"]\n25:T1627,"])</script><script>self.__next_f.push([1,"# 운영 배포 — Docker, 설정, Native Image, 프로덕션 체크리스트\n\n\u003e 요약: 환경변수와 컨테이너로 배포하고, 헬스 프로브·그레이스풀 종료·Native Image를 운영 기본선에 맞춘다.\n\n---\n\n## 1. 왜 설정과 프로세스를 나누는가\n\n앱은 코드와 설정을 분리하고, 로그는 stdout으로 보내며, 종료 신호를 받으면 요청을 비운 뒤 죽는다. Boot에서는 프로파일·환경변수와 **graceful shutdown**이 그 기본선이다.\n\n한 줄 정의: graceful shutdown은 새 요청을 끊고, 진행 중 요청이 끝날 때까지 기다린 다음 프로세스를 종료하는 것이다.\n\n```yaml\nserver:\n  shutdown: graceful\n\nspring:\n  lifecycle:\n    timeout-per-shutdown-phase: 30s\n```\n\n로드밸런서가 인스턴스를 빼는 시간보다 `timeout-per-shutdown-phase`가 짧으면 요청이 잘린다.\n\n---\n\n## 2. 시크릿\n\n`application-prod.yml`에 DB 비밀번호를 커밋하거나 이미지에 굽지 않는다. `SPRING_PROFILES_ACTIVE=prod`, 값은 환경변수·K8s Secret·Secrets Manager·Vault다. 필수 시크릿이 없으면 **기동 실패**가 기본값으로 떠서 잘못된 DB에 붙는 것보다 낫다.\n\n```yaml\nspring:\n  datasource:\n    url: ${DB_URL}\n    username: ${DB_USER}\n    password: ${DB_PASSWORD}\n```\n\n---\n\n## 3. Dockerfile\n\nJava 21 런타임, non-root, 컨테이너 메모리의 일부만 힙으로 쓴다.\n\n```dockerfile\nFROM eclipse-temurin:21-jdk-alpine AS build\nWORKDIR /workspace\nCOPY . .\nRUN ./mvnw -q -DskipTests package\n\nFROM eclipse-temurin:21-jre-alpine\nWORKDIR /app\nRUN adduser -D spring\nUSER spring\nCOPY --from=build /workspace/target/demo-*.jar app.jar\nEXPOSE 8080\nENTRYPOINT [\"java\",\"-XX:MaxRAMPercentage=75.0\",\"-jar\",\"/app/app.jar\"]\n```\n\n의존성이 안 바뀌면 레이어를 재사용하도록 **Layered JAR**를 쓴다.\n\n```bash\njava -Djarmode=layertools -jar app.jar extract\n```\n\nDockerfile에서 `dependencies` → `spring-boot-loader` → `application` 순으로 COPY한다. distroless/chiseled 이미지는 공격면을 줄인다. 빌드에 `.mvn`·wrapper가 없으면 CI의 `./mvnw`가 실패한다.\n\n---\n\n## 4. Compose (로컬)\n\nDB가 healthy일 때까지 앱을 기다린다.\n\n```yaml\nservices:\n  app:\n    build: .\n    ports:\n      - \"8080:8080\"\n    environment:\n      SPRING_PROFILES_ACTIVE: local\n      DB_URL: jdbc:postgresql://db:5432/demo\n      DB_USER: demo\n      DB_PASSWORD: demo\n    depends_on:\n      db:\n        condition: service_healthy\n  db:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_DB: demo\n      POSTGRES_USER: demo\n      POSTGRES_PASSWORD: demo\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U demo\"]\n      interval: 5s\n      timeout: 5s\n      retries: 5\n```\n\n---\n\n## 5. Kubernetes 프로브\n\n**liveness**는 프로세스가 죽었으면 재시작하고, **readiness**는 준비가 안 됐으면 트래픽을 빼는 검사다. 둘을 같은 URL로 묶으면, 의존성 장애 때 재시작 루프가 난다. Actuator probes를 켜고 관리 포트(예: 8081)를 가리킨다.\n\n```yaml\nlivenessProbe:\n  httpGet:\n    path: /actuator/health/liveness\n    port: 8081\nreadinessProbe:\n  httpGet:\n    path: /actuator/health/readiness\n    port: 8081\nresources:\n  requests:\n    cpu: \"250m\"\n    memory: \"512Mi\"\n  limits:\n    memory: \"768Mi\"\n```\n\n메모리 limit 없이 JVM만 올리면 노드 OOMKill이 난다. CPU limit은 스로틀이 커질 수 있어 request와 함께 본다.\n\n---\n\n## 6. CI/CD\n\n1. 단위 + Testcontainers IT\n2. 포맷·정적 분석\n3. 의존성 취약점(Trivy 등)\n4. 이미지 빌드·스캔\n5. 스테이징 스모크\n6. 카나리 또는 블루그린\n\n`main` 직접 푸시보다 PR 필수 체크가 안전하다. Flyway는 배포 파이프라인에서 한 방향으로만 적용한다.\n\n---\n\n## 7. GraalVM Native Image\n\n한 줄 정의: 미리 AOT 컴파일한 **네이티브 실행 파일**이다. 기동이 빠르고 RSS가 낮다. Boot 3에서 정식이다.\n\n```bash\n./mvnw -Pnative native:compile\n```\n\n빌드 시간이 길고, 리플렉션·프록시 힌트가 필요할 수 있다. 서버리스·스케일-to-zero에 잘 맞는다. 상시 트래픽 큰 서비스는 JVM + 컨테이너 메모리 튜닝으로도 충분한 경우가 많다. 라이브러리가 네이티브를 지원하는지 먼저 본다.\n\n---\n\n## 8. 로그·시간대\n\n액세스/감사 로그를 애플리케이션 로그와 나누고 PII를 마스킹한다. 서버 시각은 UTC, 표시만 로컬이다.\n\n---\n\n## 9. 프로덕션 체크리스트\n\n### 보안\n\n- [ ] 패치된 JRE 베이스 이미지\n- [ ] Actuator·Swagger 최소 노출 + 인증\n- [ ] 시크릿 미커밋\n- [ ] HTTPS, 명시적 CORS origin\n- [ ] 의존성 스캔\n\n### 신뢰성\n\n- [ ] graceful shutdown과 LB drain 시간 일치\n- [ ] Flyway 자동화\n- [ ] 타임아웃·재시도·서킷 브레이커\n- [ ] liveness / readiness 분리\n- [ ] DB 백업·복구 훈련\n\n### 관측·성능\n\n- [ ] 5xx·p99·풀 대기 알람\n- [ ] 트레이스 샘플링, 로그 `traceId`\n- [ ] 부하 테스트 결과\n- [ ] 풀 크기 × 레플리카 ≤ DB 한도\n\n---\n\n## 10. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 이미지에 비밀번호 | 런타임 시크릿 |\n| liveness = readiness | 프로브 분리 |\n| root 유저 | `USER spring` |\n| heap이 컨테이너 limit보다 큼 | `MaxRAMPercentage` |\n| 종료 타임아웃 \u003c drain | 둘을 맞춤 |\n\n---\n\n## 연습\n\n1. 샘플 API를 멀티스테이지 이미지로 만든다.\n2. Compose로 app + Postgres를 띄운다.\n3. `/actuator/health`가 UP인지 확인한다.\n4. 위 체크리스트를 통과/미통과로 표시한다.\n5. (선택) Native 기동 시간을 JVM jar와 비교한다."])</script><script>self.__next_f.push([1,"1b:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"운영 배포 — Docker, 설정, Native Image, 프로덕션 체크리스트\\\",\\\"description\\\":\\\"환경변수와 컨테이너로 배포하고, 헬스 프로브·그레이스풀 종료·Native Image를 운영 기본선에 맞춘다.\\\",\\\"datePublished\\\":\\\"2026-07-27\\\",\\\"url\\\":\\\"https://kaisa.co.kr/posts/spring-boot-10/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\",\\\"url\\\":\\\"https://kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"spring-boot\\\",\\\"keywords\\\":\\\"spring-boot\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa\\\",\\\"item\\\":\\\"https://kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":
