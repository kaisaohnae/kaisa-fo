max_body_size`를 앱·스토리지 한도와 같게 둔다. 기본 1m이면 큰 폼이 413으로 거절된다.\n- [ ] WebSocket이면 `Upgrade`와 `Connection`을 넘긴다. 빼면 핸드셰이크가 HTTP로 남는다.\n- [ ] 업스트림 다운 시 재시도·에러 페이지를 정한다. 무한 재시도는 장애를 키운다.\n\n```nginx\nproxy_connect_timeout 5s;\nproxy_read_timeout 60s;\nclient_max_body_size 20m;\n\n# WebSocket location 예\nproxy_http_version 1.1;\nproxy_set_header Upgrade $http_upgrade;\nproxy_set_header Connection \"upgrade\";\n```\n\n---\n\n## 2. 보안 헤더\n\n브라우저에 “이 응답을 어떻게 다룰지”를 알려 주는 헤더이다. 앱이 이미 같은 헤더를 내면 중복·충돌을 먼저 본다.\n\n```nginx\nadd_header X-Content-Type-Options nosniff always;\nadd_header X-Frame-Options SAMEORIGIN always;\nadd_header Referrer-Policy strict-origin-when-cross-origin always;\n```\n\n- [ ] `X-Content-Type-Options: nosniff`를 둔다. MIME을 추측해 스크립트로 실행하는 길을 줄인다.\n- [ ] 클릭재킹이 문제면 `X-Frame-Options` 또는 CSP(콘텐츠 보안 정책)의 `frame-ancestors`를 둔다. iframe으로 넣을 사이트가 있으면 `SAMEORIGIN`이 막는다.\n- [ ] `Referrer-Policy`를 정한다. 기본값이면 외부 사이트로 경로가 과도하게 새어 나갈 수 있다.\n- [ ] `server_tokens off`로 버전 문자열을 줄인다. 정찰을 완전히 막지는 못하지만 노출은 줄어든다.\n- [ ] CSP는 앱의 스크립트·스타일·폰트 출처와 맞춰 단계적으로 넣는다. 한 번에 `default-src 'self'`만 넣으면 화면이 한꺼번에 깨진다.\n- [ ] HTTPS가 안정된 뒤에만 HSTS(HTTP 엄격 전송 보안)를 켠다. 인증서 문제가 남은 상태에서는 넣지 않는다.\n\n`add_header`는 일부 오류 응답에서 빠질 수 있다. `always`를 붙인 이유를 주석으로 남긴다. `if` 안에서 `add_header`를 쓰면 부모 헤더가 사라지는 함정이 있다.\n\n---\n\n## 3. 로그·관측\n\n장애 때 요청이 Nginx에서 멈췄는지 앱에서 멈췄는지 나뉘어야 한다.\n\n- [ ] `access_log`와 `error_log` 경로가 디스크 용량·로테이션 대상이다. 안 돌리면 파티션이 찬다.\n- [ ] 로그 포맷에 `$request_time`과 `$upstream_response_time`을 넣는다. 앞은 전체, 뒤는 앱 시간이다.\n- [ ] 헬스체크 URL은 `access_log off`를 검토한다. 로드밸런서 폴링이 액세스 로그를 덮는다.\n- [ ] 5xx가 늘면 에러 로그의 upstream 메시지를 먼저 본다. 타임아웃·연결 거부가 여기에 찍힌다.\n\n```nginx\nlog_format main '$remote_addr $status $request_time $upstream_response_time '\n                '\"$request\"';\naccess_log /var/log/nginx/access.log main;\n```\n\n---\n\n## 4. 성능\n\n미세 `worker` 튜닝보다 불필요한 프록시와 큰 바디를 먼저 줄인다.\n\n| 항목 | 확인 이유 |\n|------|-----------|\n| gzip / brotli | HTML·JSON·CSS·JS는 압축 이득이 크다. 이미 압축된 이미지는 제외한다 |\n| `sendfile` | 정적 파일을 커널이 바로 보낼 때 복사 비용이 줄어든다 |\n| 캐시 헤더 | 해시가 붙은 자산은 장기 `expires`. HTML은 짧게 둔다 |\n| `worker_connections` | 동시 연결 상한. 부족하면 대기열만 늘고 원인 로그가 빈약하다 |\n\n- [ ] 텍스트 응답에 gzip(또는 brotli)이 켜져 있다. `gzip_types`에 `application/json`이 빠지기 쉽다.\n- [ ] `/assets/app.abc123.js`처럼 파일명에 해시가 있으면 긴 캐시를 준다. 배포마다 URL이 바뀌므로 구버전을 붙잡지 않는다.\n- [ ] HTML·API는 짧게 캐시하거나 `private`로 둔다. 로그인 페이지를 공용 캐시하면 내용이 섞인다.\n- [ ] 정적 location이 앱 `proxy_pass`로 안 새는지 본다. 정적인데 앱 로그가 찍히면 location 우선순위 문제이다.\n\n---\n\n## 5. 배포 직전\n\n설정을 바꾼 직후와 인증서 갱신 직후에 같은 목록을 탄다.\n\n- [ ] `nginx -t`가 성공한 뒤에만 reload한다. 문법 오류를 운영 프로세스에 넣지 않는다.\n- [ ] reload 후 헬스 URL과 로그인·결제 같은 핵심 경로를 `curl -I`로 본다. 프로세스는 살아 있어도 location이 틀릴 수 있다.\n- [ ] HTTP→HTTPS, www/non-www 정규 호스트가 기획과 같다. 인증서 SAN(주제 대체 이름)에 둘 다 있어야 한다.\n- [ ] 인증서 만료일과 자동 갱신 hook에 reload가 있다. 파일만 바뀌고 프로세스가 옛 키를 들고 있으면 브라우저만 실패한다.\n- [ ] `privkey` 권한이 최소이다. 백업 경로에 비밀키가 평문으로 복사되지 않았는지 본다.\n- [ ] 스테이징과 프로덕션 `server_name`·업스트림 포트가 뒤바뀌지 않았는지 한 줄로 대조한다.\n\n---\n\n## 정리\n\nNginx 운영은 옵션을 많이 켜는 일이 아니다. 앱이 끝나기 전에 프록시가 끊지 않는지, 브라우저에 필요한 헤더가 나가는지, 로그로 지연 구간을 나눌 수 있는지, 인증서가 갱신 후에도 로드되는지가 체크리스트이다. 배포 전에 위 순서로 한 바퀴 돌리면 된다."])</script><script>self.__next_f.push([1,"1c:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"Nginx 운영·보안 체크리스트\\\",\\\"description\\\":\\\"배포 전에 타임아웃, 업로드 한도, 보안 헤더, 로그, 압축, 인증서 갱신이 앱 특성에 맞는지 확인한다.\\\",\\\"datePublished\\\":\\\"2024-07-18\\\",\\\"url\\\":\\\"https://kaisa.co.kr/posts/nginx-03/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\",\\\"url\\\":\\\"https://kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"nginx\\\",\\\"keywords\\\":\\\"nginx\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa\\\",\\\"item\\\":\\\"http
