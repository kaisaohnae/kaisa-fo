03e관련 링크\u003c/p\u003e\n    \u003c/aside\u003e\n    \u003cfooter\u003e\n      \u003cp\u003e저작권 표기\u003c/p\u003e\n    \u003c/footer\u003e\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n| 태그 | 역할 |\n|------|------|\n| `header` | 페이지 또는 구역의 머리글 |\n| `nav` | 주요 이동 링크 묶음 |\n| `main` | 그 페이지의 핵심 내용. 문서당 하나 |\n| `article` | 독립해서 옮겨도 의미가 남는 글 |\n| `section` | 제목이 있는 주제 구역 |\n| `aside` | 본문을 보조하는 정보 |\n| `footer` | 페이지 또는 구역의 바닥글 |\n\n`lang`은 실제 언어에 맞춘다. 한국어 페이지면 `ko`이다. 스크린 리더 발음과 SEO(검색 엔진 최적화)에 쓰인다.\n\n제목은 `h1`부터 `h6`까지 계층을 건너뛰지 않는다. `h1` 다음에 바로 `h3`을 두지 않는다. `h1`은 페이지의 주제이고, 보통 하나면 충분하다.\n\n---\n\n## 링크와 버튼\n\n이동이면 `a`를 쓴다. 그 페이지에서 동작을 실행하면 `button`을 쓴다.\n\n```html\n\u003ca href=\"/login\"\u003e로그인 페이지로 이동\u003c/a\u003e\n\u003cbutton type=\"button\"\u003e메뉴 열기\u003c/button\u003e\n\u003cbutton type=\"submit\"\u003e저장\u003c/button\u003e\n```\n\n클릭 가능한 `div`에 `onclick`을 붙이면 키보드와 스크린 리더가 버튼을 인식하지 못한다. `div`로 버튼을 만들지 않는다.\n\n`nav`에는 이동 링크만 둔다. 검색 제출 버튼은 `nav`가 아니라 `form` 안에 둔다.\n\n---\n\n## 이미지와 대체 텍스트\n\n의미 있는 이미지는 무엇을 보여 주는지 `alt`에 적는다. 장식용 이미지는 `alt=\"\"`로 비운다. 스크린 리더가 장식을 읽지 않게 하기 위함이다.\n\n```html\n\u003cimg\n  src=\"/hero.webp\"\n  alt=\"공원에서 산책하는 강아지\"\n  width=\"800\"\n  height=\"450\"\n/\u003e\n\u003cimg src=\"/divider.svg\" alt=\"\" /\u003e\n```\n\n`width`와 `height`를 넣으면 이미지가 로드되기 전에 자리를 잡는다. CLS(누적 레이아웃 이동)가 줄어든다.\n\n아이콘만 있는 링크에는 텍스트 이름을 남긴다. 보이지 않아도 된다.\n\n```html\n\u003ca href=\"/settings\"\u003e\n  \u003cimg src=\"/gear.svg\" alt=\"\" /\u003e\n  \u003cspan class=\"sr-only\"\u003e설정\u003c/span\u003e\n\u003c/a\u003e\n```\n\n---\n\n## 흔한 실수\n\n- `div`를 중첩해 헤더·본문·푸터를 표현한다. 역할 태그로 바꾼다.\n- `main`을 여러 개 둔다. 한 문서에 하나다.\n- 모든 구역을 `section`으로 감싼다. 제목이 있는 주제일 때만 쓴다.\n- 장식 이미지에 `alt=\"이미지\"`처럼 빈 정보를 넣는다. 장식이면 빈 문자열이다.\n- `span`이나 `div`로 제목만 크게 스타일한다. 제목이면 `h1`–`h6`이다.\n\n---\n\n## 정리\n\n시맨틱 HTML은 화면을 꾸미는 단계가 아니다. 문서가 무엇인지를 브라우저와 보조 기술에 선언하는 일이다. 뼈대가 맞으면 CSS와 접근성은 그 위에 얹으면 된다.\n\n---\n\n## 연습\n\n1. 블로그 글 한 편을 `header` / `nav` / `main` / `article` / `footer`만으로 마크업한다. `div`는 쓰지 않는다.\n2. 사이트 로고 이미지와 장식 아이콘 이미지에 각각 알맞은 `alt`를 넣는다.\n3. 기존 페이지에서 `h1`이 몇 개인지, 제목 계층이 건너뛰어졌는지 확인한다."])</script><script>self.__next_f.push([1,"1b:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"시맨틱 HTML로 문서 뼈대 잡기\\\",\\\"description\\\":\\\"header·main·nav 같은 시맨틱 태그로 페이지 뼈대를 잡고, 스크린 리더와 검색엔진이 읽을 수 있는 HTML을 작성한다.\\\",\\\"datePublished\\\":\\\"2023-01-24\\\",\\\"url\\\":\\\"https://kaisa.co.kr/posts/html-css-01/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\",\\\"url\\\":\\\"https://kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"html-css\\\",\\\"keywords\\\":\\\"html-css\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa\\\",\\\"item\\\":\\\"https://kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"시맨틱 HTML로 문서 뼈대 잡기\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/html-css-01/\\\"}]}]}\"}}],[\"$\",\"main\",null,{\"className\":\"blog-main\",\"children\":[\"$\",\"div\",null,{\"className\":\"site-shell\",\"children\":[\"$\",\"article\",null,{\"className\":\"blog-post site-shell__inner\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/posts/\",\"className\":\"blog-post__back\",\"children\":\"← 목록으로\"}],[\"$\",\"div\",null,{\"className\":\"blog-post__meta\",\"children\":[\"$\",\"span\",null,{\"children\":\"2023-01-24\"}]}],[\"$\",\"h1\",null,{\"className\":\"blog-post__title\",\"children\":\"시맨틱 HTML로 문서 뼈대 잡기\"}],[\"$\",\"$L24\",null,{\"content\":\"$25\"}],\"$L26\",\"$L27\"]}]}]}]]\n"])</script><script>self.__next_f.push([1,"28:I[44398,[\"/_next/
