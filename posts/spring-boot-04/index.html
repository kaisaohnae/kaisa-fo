\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n19:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/3siqlqjr1v4fe.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"24:I[55489,[\"/_next/static/chunks/0qufxx6nl15ij.js\",\"/_next/static/chunks/1uymn__-_z4ug.js\",\"/_next/static/chunks/235_kxc74hr-9.js\",\"/_next/static/chunks/1hr7-4fb6m83q.js\",\"/_next/static/chunks/2_h6is8-aperz.js\",\"/_next/static/chunks/3qcoeqbx1mias.js\"],\"default\"]\n25:T1d2a,"])</script><script>self.__next_f.push([1,"# Spring Data JPA와 영속성 계층\n\n\u003e 요약: JPA 엔티티와 트랜잭션 경계를 명확히 하고, N+1·OSIV·스키마 마이그레이션 함정을 피한다.\n\n---\n\n## 1. 왜 JPA인가\n\n**JPA(Jakarta Persistence API)** 는 객체를 테이블에 매핑하는 표준이다. Hibernate가 구현체고, Spring Data JPA는 리포지토리 인터페이스로 반복 쿼리를 줄인다.\n\n| 계층 | 책임 |\n|------|------|\n| Entity | 상태와 불변식 |\n| Repository | 영속성 추상화 |\n| Service (`@Transactional`) | 유스케이스 단위 트랜잭션 |\n| Controller | HTTP만 |\n\n컨트롤러에 `save`를 두거나, 리포지토리에 비즈니스 분기를 넣지 않는다.\n\n---\n\n## 2. 엔티티\n\n기본 생성자는 JPA용으로 `protected`, 변경은 setter 대신 도메인 메서드로 둔다.\n\n```java\n@Entity\n@Table(name = \"users\")\n@EntityListeners(AuditingEntityListener.class)\npublic class User {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, unique = true, length = 100)\n    private String email;\n\n    @Column(nullable = false, length = 50)\n    private String name;\n\n    @CreatedDate\n    @Column(nullable = false, updatable = false)\n    private Instant createdAt;\n\n    @LastModifiedDate\n    private Instant updatedAt;\n\n    protected User() {}\n\n    public static User create(String email, String name) {\n        User user = new User();\n        user.email = email;\n        user.name = name;\n        return user;\n    }\n\n    public void rename(String name) {\n        if (name == null || name.isBlank()) {\n            throw new IllegalArgumentException(\"name required\");\n        }\n        this.name = name;\n    }\n}\n```\n\n`@EnableJpaAuditing`을 켜야 `@CreatedDate`가 동작한다. `equals`/`hashCode`를 전 필드 Lombok으로 만들면 영속 전후 동등성이 깨지기 쉽다. 식별자 기준으로 신중히 구현한다.\n\n공통 시각 필드는 `@MappedSuperclass`로 빼고, 소프트 삭제는 `deletedAt` 또는 Hibernate `@SoftDelete`로 명시한다.\n\n---\n\n## 3. 리포지토리\n\n파생 메서드 → JPQL `@Query` → `Specification` / QueryDSL 순으로 복잡도를 올린다.\n\n```java\npublic interface UserRepository extends JpaRepository\u003cUser, Long\u003e {\n    Optional\u003cUser\u003e findByEmail(String email);\n    boolean existsByEmail(String email);\n\n    @Query(\"select u from User u where u.name like %:keyword%\")\n    List\u003cUser\u003e searchByName(@Param(\"keyword\") String keyword);\n\n    @Modifying(clearAutomatically = true, flushAutomatically = true)\n    @Query(\"update User u set u.name = :name where u.id = :id\")\n    int rename(@Param(\"id\") Long id, @Param(\"name\") String name);\n}\n```\n\n벌크 `@Modifying`은 영속성 컨텍스트를 건너뛴다. `clearAutomatically` 없이 같은 트랜잭션에서 엔티티를 다시 쓰면 DB와 객체가 어긋난다.\n\n---\n\n## 4. 트랜잭션\n\n한 줄 정의: 트랜잭션은 **한 유스케이스가 전부 성공하거나 전부 롤백**되는 경계다. 클래스를 `readOnly = true`로 두고 쓰기 메서드만 `@Transactional`을 연다.\n\n```java\n@Service\n@Transactional(readOnly = true)\npublic class UserService {\n\n    private final UserRepository userRepository;\n\n    public UserService(UserRepository userRepository) {\n        this.userRepository = userRepository;\n    }\n\n    public UserResponse get(Long id) {\n        return userRepository.findById(id)\n                .map(UserMapper::toResponse)\n                .orElseThrow(() -\u003e new UserNotFoundException(id));\n    }\n\n    @Transactional\n    public UserResponse create(CreateUserRequest request) {\n        if (userRepository.existsByEmail(request.email())) {\n            throw new DuplicateEmailException(request.email());\n        }\n        User saved = userRepository.save(User.create(request.email(), request.name()));\n        return UserMapper.toResponse(saved);\n    }\n}\n```\n\n전파·격리 수준은 기본값으로 대부분 충분하다. 긴 트랜잭션 안에서 외부 HTTP를 호출하면 커넥션을 붙잡은 채 대기한다.\n\n---\n\n## 5. 연관과 지연 로딩\n\n연관은 **LAZY**가 기본 전략이다. `EAGER`는 목록 조회마다 조인이 붙는 사고의 주범이다.\n\n```java\n@ManyToOne(fetch = FetchType.LAZY, optional = false)\n@JoinColumn(name = \"user_id\")\nprivate User user;\n\n@OneToMany(mappedBy = \"order\", cascade = CascadeType.ALL, orphanRemoval = true)\nprivate List\u003cOrderLine\u003e lines = new ArrayList\u003c\u003e();\n\npublic void addLine(OrderLine line) {\n    lines.add(line);\n    line.setOrder(this);\n}\n```\n\n양방향은 편의 메서드로 양쪽을 맞춘다.\n\n---\n\n## 6. N+1과 OSIV\n\n**N+1**: 목록 1번 조회 후 연관에 접근할 때마다 쿼리가 N번 더 나간다.\n\n```java\n@Query(\"select o from Order o join fetch o.user where o.id = :id\")\nOptional\u003cOrder\u003e findWithUser(@Param(\"id\") Long id);\n\n@EntityGraph(attributePaths = {\"lines\"})\nOptional\u003cOrder\u003e findWithLinesById(Long id);\n\n@Query(\"\"\"\n        select new com.example.demo.order.OrderSummary(o.id, u.email, o.totalAmount)\n        from Order o join o.user u\n        where o.status = :status\n        \"\"\")\nList\u003cOrderSummary\u003e findSummaries(OrderStatus status);\n```\n\n읽기 전용 화면에 DTO 프로젝션이 가장 싸다. fetch join은 컬렉션을 두 개 이상 동시에 끌어오면 카테시안 곱이 난다.\n\n**OSIV(Open Session In View)** 는 뷰 렌더까지 영속성 컨텍스트를 열어 두는 설정이다. Boot 기본은 `true`이고, 운영은 `false`를 권장한다. 컨트롤러에서 지연 로딩이 터지면 쿼리를 고친다.\n\n```yaml\nspring:\n  jpa:\n    open-in-view: false\n```\n\n---\n\n## 7. Flyway와 낙관적 락\n\n`ddl-auto: update`는 로컬 실험용이다. 운영 스키마의 진실은 **Flyway/Liquibase 마이그레이션 파일**이다.\n\n```yaml\nspring:\n  jpa:\n    hibernate:\n      ddl-auto: validate\n  flyway:\n    enabled: true\n```\n\n```\ndb/migration/\n  V1__create_users.sql\n```\n\n```sql\nCREATE TABLE users (\n    id BIGSERIAL PRIMARY KEY,\n    email VARCHAR(100) NOT NULL UNIQUE,\n    name VARCHAR(50) NOT NULL,\n    created_at TIMESTAMPTZ NOT NULL,\n    updated_at TIMESTAMPTZ\n);\n```\n\n동시 수정 충돌은 `@Version` 낙관적 락으로 잡는다. 실패 시 `OptimisticLockException` → 409 또는 재조회 후 재시도.\n\n```java\n@Version\nprivate Long version;\n```\n\n---\n\n## 8. 로컬에서 SQL 보기\n\n```yaml\nspring:\n  datasource:\n    hikari:\n      maximum-pool-size: 10\n      connection-timeout: 3000\n  jpa:\n    properties:\n      hibernate:\n        jdbc.batch_size: 50\n        order_inserts: true\n        order_updates: true\n\nlogging:\n  level:\n    org.hibernate.SQL: DEBUG\n    org.hibernate.orm.jdbc.bind: TRACE\n```\n\n`show-sql=true`만으로는 바인딩 파라미터가 안 보인다. Hibernate 6 로거는 `orm.jdbc.bind`다.\n\n---\n\n## 9. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 전역 `EAGER` | LAZY + 필요한 조회만 fetch/DTO |\n| OSIV에 의존 | `open-in-view: false` + 명시 조회 |\n| `ddl-auto: update` 운영 | Flyway + `validate` |\n| 트랜잭션 안에서 외부 API | 커밋 후 이벤트/아웃박스 |\n| 벌크 업데이트 후 엔티티 재사용 | clear/flush 또는 재조회 |\n\n---\n\n## 연습\n\n1. `User` 1:N `Post` 엔티티와 리포지토리를 만든다.\n2. 목록 + 작성자 이메일을 fetch join 또는 DTO로 N+1 없이 조회한다.\n3. Flyway로 테이블을 만들고 `ddl-auto: validate`로 맞춘다.\n4. `open-in-view: false`에서 지연 로딩 예외가 안 나는지 확인한다."])</script><script>self.__next_f.push([1,"1b:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"Spring Data JPA와 영속성 계층\\\",\\\"description\\\":\\\"JPA 엔티티와 트랜잭션 경계를 명확히 하고, N+1·OSIV·스키마 마이그레이션 함정을 피한다.\\\",\\\"datePublished\\\":\\\"2024-12-04\\\",\\\"url\\\":\\\"https://kaisa.co.kr/posts/spring-boot-04/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\",\\\"url\\\":\\\"https://kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"spring-boot\\\",\\\"keywords\\\":\\\"spring-boot\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa\\\",\\\"item\\\":\\\"https://kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://kaisa.co.kr/
