 마법사 단계 | `useState` / Zustand |\n\n`queryKey`가 캐시 주소다. 같은 키면 같은 데이터다. mutation이 성공하면 관련 키를 `invalidate`한다.\n\nExpo 환경변수는 `EXPO_PUBLIC_*`만 클라이언트에 노출된다. API 베이스 URL은 공개돼도 된다. 비밀키는 넣지 않는다.\n\nRN은 브라우저 탭 포커스가 없다. 앱이 다시 `active`가 될 때 Query에 알려 주면 목록이 신선해진다.\n\n401은 토큰 갱신 또는 로그아웃이다. 토큰 저장은 다음 글의 SecureStore다.\n\n---\n\n## 3. 예제\n\n```tsx\n// lib/api.ts\nconst API_URL = process.env.EXPO_PUBLIC_API_URL;\n\nexport class ApiError extends Error {\n  constructor(\n    public status: number,\n    message: string,\n    public body?: unknown,\n  ) {\n    super(message);\n  }\n}\n\nexport async function api\u003cT\u003e(\n  path: string,\n  options: RequestInit \u0026 { token?: string } = {},\n): Promise\u003cT\u003e {\n  const { token, headers, ...rest } = options;\n\n  const res = await fetch(`${API_URL}${path}`, {\n    ...rest,\n    headers: {\n      'Content-Type': 'application/json',\n      ...(token ? { Authorization: `Bearer ${token}` } : {}),\n      ...headers,\n    },\n  });\n\n  if (!res.ok) {\n    const body = await res.json().catch(() =\u003e undefined);\n    throw new ApiError(res.status, 'Request failed', body);\n  }\n\n  if (res.status === 204) return undefined as T;\n  return res.json() as Promise\u003cT\u003e;\n}\n```\n\n```env\nEXPO_PUBLIC_API_URL=https://api.example.com\n```\n\n```bash\nnpx expo install @tanstack/react-query\n```\n\n루트에 Provider를 둔다.\n\n```tsx\nimport { QueryClient, QueryClientProvider } from '@tanstack/react-query';\n\nconst queryClient = new QueryClient({\n  defaultOptions: {\n    queries: { staleTime: 30_000, retry: 1 },\n  },\n});\n\nexport default function RootLayout() {\n  return (\n    \u003cQueryClientProvider client={queryClient}\u003e\n      {/* Stack */}\n    \u003c/QueryClientProvider\u003e\n  );\n}\n```\n\n조회와 생성:\n\n```tsx\nfunction usePosts() {\n  return useQuery({\n    queryKey: ['posts'],\n    queryFn: () =\u003e api\u003cPost[]\u003e('/posts'),\n  });\n}\n\nfunction useCreatePost(token: string) {\n  const qc = useQueryClient();\n  return useMutation({\n    mutationFn: (input: CreatePostInput) =\u003e\n      api\u003cPost\u003e('/posts', {\n        method: 'POST',\n        body: JSON.stringify(input),\n        token,\n      }),\n    onSuccess: () =\u003e qc.invalidateQueries({ queryKey: ['posts'] }),\n  });\n}\n```\n\n화면은 상태별로 UI를 나눈다.\n\n```tsx\nconst { data, isPending, isError, error, refetch } = usePosts();\n\nif (isPending) return \u003cActivityIndicator /\u003e;\nif (isError) return \u003cErrorView message={error.message} onRetry={refetch} /\u003e;\nreturn \u003cPostList data={data} /\u003e;\n```\n\n무한 스크롤:\n\n```tsx\nconst {\n  data,\n  fetchNextPage,\n  hasNextPage,\n  isFetchingNextPage,\n} = useInfiniteQuery({\n  queryKey: ['posts', 'infinite'],\n  initialPageParam: 1,\n  queryFn: ({ pageParam }) =\u003e api\u003cPostPage\u003e(`/posts?page=${pageParam}`),\n  getNextPageParam: (last) =\u003e last.nextPage ?? undefined,\n});\n\nconst items = data?.pages.flatMap((p) =\u003e p.items) ?? [];\n```\n\n`FlatList`의 `onEndReached`에서 `hasNextPage`일 때만 `fetchNextPage`를 호출한다.\n\n앱 포커스:\n\n```tsx\nimport { focusManager } from '@tanstack/react-query';\nimport { AppState } from 'react-native';\n\nfocusManager.setEventListener((handleFocus) =\u003e {\n  const sub = AppState.addEventListener('change', (state) =\u003e {\n    handleFocus(state === 'active');\n  });\n  return () =\u003e sub.remove();\n});\n```\n\n토큰이 있을 때만 프로필을 가져온다.\n\n```tsx\nuseQuery({\n  queryKey: ['me'],\n  queryFn: () =\u003e api('/me', { token }),\n  enabled: !!token,\n});\n```\n\n| 상태 | UI |\n|------|----|\n| 최초 pending | 스켈레톤/스피너 |\n| error | 메시지 + 재시도 |\n| empty | 빈 화면 CTA |\n| 백그라운드 fetching | 리스트 유지 + 약한 인디케이터 |\n| mutation pending | 버튼 비활성 |\n\n에러를 `alert()`만으로 끝내지 않는다. 화면 폴백을 둔다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 화면마다 `fetch` 복사 | `api()` 한 곳 |\n| 서버 데이터를 전역 Zustand에 복제 | Query 캐시가 원본 |\n| `queryKey`를 매번 다른 객체로 | 안정적 배열 `['posts', id]` |\n| 생성 후 목록이 안 바뀜 | `invalidateQueries` |\n| 비밀키를 `EXPO_PUBLIC_` | 서버만 보유 |\n| 401을 일반 에러 메시지로만 | 세션 정리 또는 갱신 |\n\n---\n\n## 5. 정리\n\n네트워크 층은 **얇은 `api()` + Query 훅**이면 된다. 화면은 pending/error/empty만 그린다.\n\n- 서버 상태와 UI 상태를 섞지 않는다.\n- 토큰은 헤더로만. 저장 위치는 SecureStore.\n- 무한 스크롤은 `useInfiniteQuery` + `onEndReached`.\n\n## 연습\n\n1. `api()`와 `ApiError`를 만든다.\n2. 게시글 목록 `useQuery`에 로딩·에러 UI를 붙인다.\n3. 생성 `useMutation` 후 목록을 invalidate한다.\n4. `useInfiniteQuery`와 FlatList를 연결한다."])</script><script>self.__next_f.push([1,"1d:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"네트워킹 — Fetch, React Query, 에러 처리\\\",\\\"description\\\":\\\"서버 데이터는 fetch 래퍼와 React Query로 가져와 로딩·에러·재시도를 표준화한다.\\\",\\\"datePublished\\\":\\\"2025-06-12\\\",\\\"url\\\":\\\"https://kaisa.co.kr/posts/react-native-05/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa\\\",\\\"url\\\":\\\"https://kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"react-native\\\",\\\"keywords\\\":\\\"react-native\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa\\\",\\\"item\\\":\\\"https://kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"네트워킹 — Fetch, React Query, 에러 처리\\\",\\\"item\\\":\\\"https://kaisa.co.kr/posts/react-native-05/\\\"}]}]}\"}}],[\"$\",\"main\",null,{\"className\":\"blog-main\",\"children\":[\"$\",\"div\",null,{\"className\":\"site-shell\",\"children\":[\"$\",\"article\",null,{\"className\":\"blog-post site-shell__inner\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/posts/\",\"className\":\"blog-post__back\",\"children\":\"← 목록으로\"}],[\"$\",\"div\",nul
