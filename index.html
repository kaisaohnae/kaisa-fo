 한 행마다 커밋하면 디스크 동기화 비용이 반복된다.\n\n`INTEGER PRIMARY KEY`는 곧 ROWID다. 별도 UUID 문자열 PK는 인덱스가 커진다. 외부 공개 id가 필요하면 별 컬럼을 둔다.\n\n---\n\n## 3. 최소 예제 — 메모 앱\n\n로컬 메모 저장을 가정한다.\n\n```bash\nsqlite3 app.db\n```\n\n```sql\nPRAGMA foreign_keys = ON;\nPRAGMA journal_mode = WAL;\nPRAGMA busy_timeout = 5000;\n\nCREATE TABLE notes (\n  id         INTEGER PRIMARY KEY,\n  title      TEXT NOT NULL,\n  body       TEXT NOT NULL,\n  created_at TEXT NOT NULL DEFAULT (datetime('now'))\n);\n\nCREATE INDEX notes_created_at_idx ON notes (created_at);\n\nINSERT INTO notes (title, body) VALUES ('회의', '다음 주 배포 일정 확인');\n\nSELECT id, title, created_at FROM notes ORDER BY created_at DESC;\n```\n\n앱 연결 예(의사 코드):\n\n```python\nimport sqlite3\n\nconn = sqlite3.connect(\"app.db\")\nconn.execute(\"PRAGMA foreign_keys = ON\")\nconn.execute(\"PRAGMA journal_mode = WAL\")\nconn.row_factory = sqlite3.Row\n```\n\n컨테이너·서버리스라면 파일 위치를 고정한다. 이미지 레이어 안 `app.db`는 재배포 때 사라진다. 볼륨 또는 객체 스토리지 동기화(운영 난이도 상승)를 전제로 둔다.\n\n마이그레이션은 파일 스키마 버전 테이블을 두거나, Prisma·Drizzle처럼 SQLite를 지원하는 도구를 쓴다.\n\n---\n\n## 4. 운영 시 주의\n\n**연결.** 요청마다 새 연결을 열어도 부담은 작은 편이다. 다만 쓰기 경합이 있으면 `SQLITE_BUSY`가 난다. `busy_timeout`을 두고, 긴 쓰기는 짧게 나눈다. 웹 서버 워커가 많으면 쓰기가 줄을 선다. 그때가 Postgres/MySQL로 옮길 신호다.\n\n**백업.** 실행 중에 `app.db`만 복사하면 WAL과 어긋날 수 있다. `sqlite3 app.db \".backup backup.db\"` 또는 `VACUUM INTO 'backup.db'`를 쓴다. Litestream 등으로 S3에 복제하는 운영도 있다. 복원 후 `PRAGMA integrity_check`를 한 번 돌린다.\n\n**배포.** 다중 인스턴스가 같은 파일을 쓰지 않는다. 읽기 전용 레플리카를 파일 복사로 흉내 내는 패턴은 지연을 감수한다. HA가 필요하면 서버형 DB로 옮긴다.\n\n**보안.** 파일 권한이 곧 접근 권한이다. 웹 루트에 `app.db`를 두지 않는다. 다운로드되면 전체가 유출된다. 암호화가 필요하면 SQLCipher 등 확장 또는 OS 디스크 암호화를 검토한다.\n\n**디스크.** WAL이 안 체크포인트되면 파일이 커진다. 주기적 체크포인트와 디스크 용량 알람을 둔다.\n\n**이동.** 나중에 Postgres로 옮길 수 있다. 다만 타입·`datetime` 문자열·부분 인덱스 문법이 다르다. “언젠가 이전”을 가정하면 앱의 SQL을 방언에 덜 묶는 편이 낫다. 지금은 SQLite가 맞으면 맞다고 쓴다.\n\n**테스트.** 메모리 DB(`:memory:`)는 연결마다 비어 있다. 마이그레이션을 테스트마다 적용한다. 파일 DB 픽스처는 CI 워크스페이스에 남기지 않게 지운다.\n\n옮겨야 할 신호는 대체로 이렇다. 쓰기 대기 큐가 상시 있다. 서버를 두 대로 늘려야 한다. 백업·페일오버 SLA가 파일 복사로 안 된다. 그때 Postgres나 MySQL로 간다. 스키마와 쿼리가 단순하면 이전이 덜 아프다.\n\n**흔한 실수.** Docker 이미지 안에 DB 파일을 굽기, NFS 위에 SQLite, `PRAGMA foreign_keys`를 ORM이 켠 줄 알고 넘어가기. 세 가지가 데이터 유실로 이어진다.\n\n---\n\n## 5. 정리\n\nSQLite는 작은 DB가 아니라 **임베디드 관계형 엔진**이다. 경계(단일 쓰기 주체, 파일 위치, 백업 방법)만 지키면 운영이 매우 단순해진다. 서버 여러 대가 같은 파일을 쓰는 순간부터는 다른 도구다.\n\n### 체크리스트\n\n- [ ] `PRAGMA foreign_keys = ON`을 연결마다 켠다. 기본값은 꺼져 있다.\n- [ ] 동시 읽기가 있으면 WAL을 검토한다. 기본 저널은 읽기가 더 자주 막힌다.\n- [ ] 실행 중 파일 복사 대신 `.backup` / `VACUUM INTO`를 쓴다. 깨진 복사는 복구가 아니다.\n- [ ] DB 파일을 웹 공개 경로와 이미지 레이어 밖에 둔다.\n- [ ] 인스턴스가 둘 이상이면 공유 파일 SQLite를 포기한다. 잠금이 네트워크에서 깨진다.\n\n### 연습\n\n1. `notes` 테이블을 만들고 세 건을 넣은 뒤 `ORDER BY created_at` 목록을 출력한다.\n2. WAL 모드에서 `.backup`으로 복사한 파일을 열어 건수가 같은지 확인한다.\n3. 두 프로세스가 동시에 `INSERT`할 때 `busy_timeout` 유무 차이를 관찰한다.\n\n버전 테이블로 마이그레이션을 남기는 최소 예다.\n\n```sql\nCREATE TABLE schema_migrations (\n  version TEXT PRIMARY KEY,\n  applied_at TEXT NOT NULL DEFAULT (datetime('now'))\n);\n```\n\n앱이 기동할 때 `version`을 보고 `ALTER TABLE`을 순서대로 적용한다. 파일 DB라도 스키마 이력은 텍스트로 남긴다. 운영자가 `sqlite3`로 손으로만 바꾸면 다음 배포가 깨진다.\n\n동시 읽기가 많은 정적 사이트 생성기·분석 잡은 SQLite가 잘 맞는다. 쓰기를 한 프로세스에 모으면 된다. “웹 워커 8개가 같은 파일에 INSERT”는 설계가 틀린 것이다. 그때는 큐를 앞에 두거나 서버형 DB로 간다.\n"])</script><script>self.__next_f.push([1,"2c:T11b3,"])</script><script>self.__next_f.push([1,"# Flutter SDK와 프로젝트 시작하기\n\n\u003e 요약: Flutter SDK를 설치하고 프로젝트 구조를 이해한 뒤, 실제 기기에서 첫 앱을 실행한다.\n\n---\n\n## 1. 왜 / 언제\n\n한 코드베이스로 iOS·Android·웹·데스크톱 UI를 만든다. 언어는 Dart다. 화면은 위젯을 겹겹이 조합한 **위젯 트리**다.\n\n위젯은 “이렇게 그려라”는 설명이다. 버튼, 여백, 앱 전체까지 모두 위젯이다. 트리는 루트에서 잎으로 내려가며 그려진다.\n\n실무 기본 조합은 **안정 채널 SDK + VS Code 또는 Android Studio + 실제 기기 한 대**다. 에뮬레이터만 쓰면 터치·성능 감각이 어긋난다.\n\n이 글은 위젯 API를 외우기 전에, **doctor가 통과하는 환경**과 **재현 가능한 `flutter create`** 를 고정한다.\n\n---\n\n## 2. 핵심\n\n설치가 끝났는지는 IDE가 아니라 `flutter doctor`가 판단한다. 빨간 항목은 배포 전에 없앤다.\n\n| 대상 | 필요한 것 |\n|------|-----------|\n| Android | cmdline-tools, 라이선스, 에뮬레이터 또는 USB 디버깅 |\n| iOS | macOS + Xcode + CocoaPods |\n| 웹 | Chrome (선택) |\n\n프로젝트 루트의 `pubspec.yaml`이 의존성·에셋·버전 계약이다. `lib/main.dart`가 진입점이다. `main()`에서 `runApp`으로 루트 위젯을 올린다.\n\n기능 단위 폴더를 일찍 나눈다. 화면·도메인·데이터가 한 파일에 쌓이면 위젯 트리를 읽기 어려워진다.\n\n---\n\n## 3. 예제\n\n### 설치 확인\n\n```bash\nflutter doctor\nflutter devices\n```\n\n`doctor`는 체크리스트다. 라이선스 미동의, cmdline-tools 누락, 연결된 기기 없음이 흔하다.\n\n```bash\nflutter doctor --android-licenses\n```\n\n### 생성·실행\n\n```bash\nflutter create my_app\ncd my_app\nflutter pub get\nflutter run\n```\n\n기기가 여러 대면 `-d`로 고른다.\n\n```bash\nflutter devices\nflutter run -d chrome\nflutter run -d windows\n```\n\n### 진입점\n\n```dart\nimport 'package:flutter/material.dart';\n\nvoid main() {\n  runApp(const MyApp());\n}\n\nclass MyApp extends StatelessWidget {\n  const MyApp({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return const MaterialApp(\n      home: Scaffold(\n        body: Center(\n          child: Text('Hello, Flutter'),\n        ),\n      ),\n    );\n  }\n}\n```\n\n`runApp`이 루트 위젯을 붙인다. 그 아래 `MaterialApp` → `Scaffold` → `Center` → `Text`가 위젯 트리다. `const` 생성자는 변하지 않는 서브트리를 재사용한다.\n\n### 디렉터리\n\n```\nlib/\n├── main.dart\n├── app.dart\n└── features/\n    └── home/\nandroid/   ios/   web/\npubspec.yaml\ntest/\n```\n\n에셋은 파일만 두면 번들에 안 들어간다. `pubspec.yaml`에 등록한다.\n\n```yaml\nname: my_app\ndescription: A Flutter starter.\npublish_to: \"none\"\nversion: 1.0.0+1\n\nenvironment:\n  sdk: \"\u003e=3.5.0 \u003c4.0.0\"\n\ndependencies:\n  flutter:\n    sdk: flutter\n\nflutter:\n  uses-material-design: true\n  assets:\n    - assets/images/\n```\n\n버전 `1.0.0+1`에서 `+1`은 빌드 번호다. 스토어 제출 때 올린다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| `doctor`를 건너뛴다 | 기기·라이선스 오류가 첫 `run`에서 터진다 | 생성 전에 doctor 통과 |\n| 에셋을 yaml에 안 적는다 | 런타임에 이미지를 못 찾는다 | `flutter:` 아래 `assets` 등록 |\n| 모든 UI를 `main.dart`에 쌓는다 | 트리를 추적할 수 없다 | `features/`로 화면 분리 |\n| 베타 채널로 시작한다 | 플러그인·문서와 어긋난다 | 안정 채널 |\n| 에뮬레이터만 쓴다 | 제스처·성능이 실제와 다르다 | 실기기 한 대 |\n\n채널 확인:\n\n```bash\nflutter channel\nflutter channel stable\nflutter upgrade\n```\n\nHot reload는 상태 있는 화면을 유지한 채 UI만 고친다. 플러그인·엔트리 변경은 Hot restart 또는 재실행이 필요하다.\n\n---\n\n## 정리\n\nFlutter 시작은 위젯 암기가 아니다. **doctor가 통과하는 환경**과 **`lib/main.dart`에서 시작하는 위젯 트리**를 재현 가능하게 만드는 일이다.\n\n다음 글에서 Stateless와 Stateful의 차이를 같은 트리 관점으로 본다.\n\n---\n\n## 연습\n\n1. `flutter doctor`를 실행하고 빨간 항목을 없앤다.\n2. `flutter create` 후 실기기에서 `flutter run`으로 Hello 화면을 띄운다.\n3. `assets/images/`를 만들고 `pubspec.yaml`에 등록한 뒤 이미지를 화면에 넣는다.\n4. `MyApp`을 `lib/app.dart`로 옮기고 `main.dart`는 `runApp`만 남긴다.\n"])</script><script>self.__next_f.push([1,"2d:T17b6,"])</script><script>self.__next_f.push([1,"# Stateless와 Stateful 위젯\n\n\u003e 요약: 화면은 위젯 트리이고, 기억할 값이 있으면 Stateful, 없으면 Stateless다.\n\n---\n\n## 1. 왜 / 언제\n\n새 화면을 만들 때 먼저 고르는 것은 레이아웃이 아니다. **이 위젯이 스스로 기억할 값이 있는가**다.\n\n탭 횟수, 입력 중인 글자, 애니메이션 진행도처럼 시간이 지나며 바뀌는 값이 있으면 Stateful이다. 제목 텍스트처럼 부모가 준 값만 보여 주면 Stateless다.\n\n선택이 어긋나면 두 가지가 생긴다. 상태가 없는 화면을 Stateful로 만들거나, 전역 스토어에 버튼 하나 로딩을 올려 트리를 통째로 다시 그린다.\n\n---\n\n## 2. 핵심\n\n화면에 보이는 모든 것은 위젯이다. 위젯은 다른 위젯을 자식으로 담는다. 이렇게 이어진 구조를 **위젯 트리**라고 한다.\n\n위젯은 도면에 가깝다. “이렇게 그려라”는 설명이다. Flutter는 이 설명을 자주 다시 만든다. 부모가 다시 그려지면 자식 위젯 객체도 새로 생길 수 있다.\n\n실제 살아 있는 자리는 따로 있다.\n\n| 층 | 역할 |\n|----|------|\n| Widget | UI 설명. 값처럼 자주 재생성된다. |\n| Element | 트리에 꽂힌 자리. 위젯과 State를 연결한다. |\n| RenderObject | 크기·위치·그리기. |\n\n처음에는 위젯 트리만 이해해도 충분하다. 다만 **변하는 값을 위젯 필드에 두면 리빌드 때 날아간다**는 점만 기억한다. 그 값은 `State` 객체가 들고 있다.\n\n`StatelessWidget`은 `build`만 있다. 입력이 바뀌면 부모가 새 위젯을 내려 주고, 그때 다시 그린다.\n\n`StatefulWidget`은 위젯과 `State`가 한 쌍이다. 위젯은 설정값(생성자 파라미터)을 받는다. `State`가 가변 값을 들고 `setState`로 자기 `build`를 다시 돌린다.\n\n키(`Key`)는 같은 타입 위젯이 여러 개일 때 자리를 구분하는 이름표다. 리스트에서 본격적으로 다룬다. 커스텀 위젯에는 `super.key`를 받는다.\n\n---\n\n## 3. 예제\n\n### Stateless — 주어진 값만 그린다\n\n```dart\nclass TitleText extends StatelessWidget {\n  const TitleText({super.key, required this.text});\n\n  final String text;\n\n  @override\n  Widget build(BuildContext context) {\n    return Text(text);\n  }\n}\n```\n\n`text`는 이 위젯이 만들지 않는다. 부모가 준다. 부모가 다른 `text`를 넘기면 새 `TitleText`가 만들어지고 `build`가 다시 돈다.\n\n### Stateful — 이 위젯이 값을 기억한다\n\n```dart\nclass Counter extends StatefulWidget {\n  const Counter({super.key, this.step = 1});\n\n  final int step;\n\n  @override\n  State\u003cCounter\u003e createState() =\u003e _CounterState();\n}\n\nclass _CounterState extends State\u003cCounter\u003e {\n  int count = 0;\n\n  void _increment() {\n    setState(() {\n      count += widget.step;\n    });\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return TextButton(\n      onPressed: _increment,\n      child: Text('$count'),\n    );\n  }\n}\n```\n\n`widget.step`은 부모 설정값이다. `count`는 State가 기억한다. `setState`는 “값이 바뀌었으니 이 State의 `build`를 다시 돌려라”는 신호다. 앱 전체가 아니라 **그 State 아래 서브트리**가 다시 그려진다.\n\n범위를 작게 유지한다. 화면 루트에서 `setState`하면 불필요한 위젯까지 다시 돈다.\n\n### 생명주기\n\n| 메서드 | 언제 | 하는 일 |\n|--------|------|---------|\n| `initState` | State가 처음 붙을 때 한 번 | 컨트롤러 생성, 첫 구독 |\n| `didChangeDependencies` | 의존 InheritedWidget이 바뀔 때 | `of(context)` 이후 후속 작업 |\n| `didUpdateWidget` | 부모 파라미터가 바뀔 때 | 옛 `widget`과 새 `widget` 비교 |\n| `dispose` | State가 떨어질 때 | 컨트롤러·타이머·구독 해제 |\n\n```dart\nclass TickerBox extends StatefulWidget {\n  const TickerBox({super.key});\n\n  @override\n  State\u003cTickerBox\u003e createState() =\u003e _TickerBoxState();\n}\n\nclass _TickerBoxState extends State\u003cTickerBox\u003e\n    with SingleTickerProviderStateMixin {\n  late final AnimationController _controller;\n\n  @override\n  void initState() {\n    super.initState();\n    _controller = AnimationController(\n      vsync: this,\n      duration: const Duration(seconds: 1),\n    );\n  }\n\n  @override\n  void dispose() {\n    _controller.dispose();\n    super.dispose();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return FadeTransition(\n      opacity: _controller,\n      child: const Text('fade'),\n    );\n  }\n}\n```\n\n컨트롤러를 `dispose`하지 않으면 화면을 떠나도 애니메이션이 남는다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 이유 | 대안 |\n|------|------|------|\n| 모든 화면을 Stateful로 만든다 | 리빌드 범위가 커진다 | 상태가 있는 잎만 Stateful |\n| `build` 안에서 컨트롤러를 생성한다 | 리빌드마다 새 객체가 생긴다 | `initState`에서 만들고 `dispose` |\n| `setState` 없이 필드를 바꾼다 | 화면이 안 바뀐다 | 값 변경은 `setState` 안에서 |\n| unmounted 뒤 `setState` | 비동기 콜백에서 예외 | `if (!mounted) return;` |\n| 로그인·장바구니를 State에 둔다 | 화면이 바뀌면 값이 사라진다 | 공유 상태는 별도 계층 |\n\n`const`를 붙일 수 있는 위젯은 붙인다. 부모가 다시 그려져도 입력이 같으면 그 서브트리는 재사용할 수 있다.\n\n전역 상태는 이 글의 주제가 아니다. 이 위젯이 기억할 값만 Stateful로 둔다.\n\n---\n\n## 정리\n\n상태가 없으면 Stateless다. **이 위젯이 기억할 값이 있으면 Stateful**이다. 위젯은 도면이고, 기억은 `State`가 맡는다. 전역 값은 화면 State가 아니라 별도 계층으로 뺀다.\n\n---\n\n## 연습\n\n1. 제목만 받는 `TitleText`를 Stateless로 만든다.\n2. 같은 화면에 카운터를 Stateful로 두고 `setState` 범위를 카운터만으로 좁힌다.\n3. `AnimationController`를 `initState`에서 만들고 `dispose`에서 해제한다.\n4. 비동기 지연 뒤 `setState`하기 전에 `mounted`를 검사한다.\n"])</script><script>self.__next_f.push([1,"2e:T1830,"])</script><script>self.__next_f.push([1,"# Row·Column·제약으로 레이아웃 잡기\n\n\u003e 요약: 레이아웃은 위젯 이름이 아니라 부모가 내려 준 제약 상자에서 결정된다.\n\n---\n\n## 1. 왜 / 언제\n\n노란-검은 줄이 보이면 위젯을 더 감싸기 전에 멈춘다. 그 줄은 overflow다. 원인은 거의 항상 **제약을 무시한 자식**이다.\n\n웹의 흐름 레이아웃과 다르다. Flutter는 “부모가 허용한 상자 안에서 자식이 크기를 고른다”. `Row`에 긴 텍스트를 그냥 넣으면 상자가 터진다. `Column` 안에 `ListView`를 무방비로 넣으면 높이가 무한대가 된다.\n\n레이아웃을 고칠 때는 위젯 이름보다 **누가 얼마의 폭·높이를 허용했는가**를 본다.\n\n---\n\n## 2. 핵심\n\n제약은 부모가 자식에게 내리는 규칙이다. 최소 너비, 최대 너비, 최소 높이, 최대 높이다.\n\n레이아웃은 세 단계로 끝난다.\n\n1. 부모가 자식에게 제약을 내려 준다.\n2. 자식은 그 범위 안에서 자기 크기를 고른다.\n3. 부모는 그 크기를 보고 자식의 위치를 정한다.\n\n자식이 최대보다 크게 그려지려 하면 overflow다. 반대로 부모가 무한 제약을 주는데 자식이 “가능한 한 크게”를 원하면 예외가 난다. `ListView`가 대표적이다. 스크롤 뷰는 부모가 유한한 높이를 줘야 한다.\n\n| 위젯 | 주축 | 역할 |\n|------|------|------|\n| `Column` | 세로 | 위→아래 나열 |\n| `Row` | 가로 | 왼쪽→오른쪽 나열 |\n| `Stack` | 겹침 | 좌표로 포개기 |\n| `Wrap` | 줄바꿈 | 주축이 부족하면 다음 줄 |\n| `Expanded` | Flex 남은 공간 | `Row`/`Column` 자식만 |\n\n`Row`의 주축은 가로다. 자식들의 고유 너비 합이 부모 최대 너비를 넘으면 overflow다. 남는 공간을 나눠 가질 자식에게 `Expanded` 또는 `Flexible`을 준다.\n\n`Padding`은 안쪽 여백이다. `SafeArea`는 노치·시스템 바를 피한다. 간격은 `SizedBox`로 명시한다. 임의 margin을 여러 겹 쌓지 않는다.\n\n---\n\n## 3. 예제\n\n### Row에서 텍스트가 줄어들게\n\n```dart\nclass TitleRow extends StatelessWidget {\n  const TitleRow({super.key, required this.title});\n\n  final String title;\n\n  @override\n  Widget build(BuildContext context) {\n    return Row(\n      children: [\n        const Icon(Icons.star),\n        const SizedBox(width: 8),\n        Expanded(\n          child: Text(\n            title,\n            overflow: TextOverflow.ellipsis,\n            maxLines: 1,\n          ),\n        ),\n      ],\n    );\n  }\n}\n```\n\n아이콘은 고유 너비를 갖는다. `Expanded`가 남은 가로를 텍스트에 준다. 텍스트는 그 안에서 줄임표를 쓴다. `Expanded` 없이 `Text`만 두면 긴 제목이 overflow를 만든다.\n\n### Column + 스크롤 목록\n\n무한 높이(`Column`이 스크롤 없이 자식 고유 높이를 잴 때) 안에 `ListView`를 두면 실패한다. 목록은 유한한 높이를 받아야 한다.\n\n```dart\nclass FeedBody extends StatelessWidget {\n  const FeedBody({super.key, required this.children});\n\n  final List\u003cWidget\u003e children;\n\n  @override\n  Widget build(BuildContext context) {\n    return Column(\n      children: [\n        const Padding(\n          padding: EdgeInsets.all(16),\n          child: Text('피드'),\n        ),\n        Expanded(\n          child: ListView(\n            children: children,\n          ),\n        ),\n      ],\n    );\n  }\n}\n```\n\n바깥이 `Scaffold`의 `body`면 높이가 유한하다. `Expanded`가 그 남은 높이를 `ListView`에 넘긴다.\n\n`shrinkWrap: true`는 목록이 자식 높이만큼만 차지하게 한다. 긴 목록에서 가상화를 포기하므로 기본값으로 쓰지 않는다.\n\n### 정렬과 여백\n\n```dart\nclass CenterCard extends StatelessWidget {\n  const CenterCard({super.key, required this.child});\n\n  final Widget child;\n\n  @override\n  Widget build(BuildContext context) {\n    return SafeArea(\n      child: Padding(\n        padding: const EdgeInsets.all(16),\n        child: Align(\n          alignment: Alignment.topCenter,\n          child: ConstrainedBox(\n            constraints: const BoxConstraints(maxWidth: 480),\n            child: child,\n          ),\n        ),\n      ),\n    );\n  }\n}\n```\n\n`Center`는 남는 공간의 가운데다. `Align`은 위치를 고른다. `ConstrainedBox`는 자식에게 추가 최대 너비를 준다. 넓은 화면에서 본문이 늘어지는 것을 막는다.\n\n### 디버그\n\n```dart\nimport 'package:flutter/rendering.dart';\n\nvoid main() {\n  debugPaintSizeEnabled = true;\n  runApp(const MyApp());\n}\n```\n\n테두리와 여백이 보인다. overflow 줄이 보이면 위젯을 더 넣기 전에 제약부터 고친다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 일어나는 일 | 대안 |\n|------|-------------|------|\n| `Row`에 긴 `Text`만 넣는다 | 가로 overflow | `Expanded` / `Flexible` |\n| `Column` 안에 `ListView` | 세로 무한 제약 예외 | `Expanded` 또는 바깥을 스크롤 |\n| `width: double.infinity` 남발 | 부모가 무한이면 깨진다 | 제약에 맞게 `Expanded` |\n| 모든 간격을 `margin` | 누가 공간을 쓰는지 안 보인다 | `Padding` + `SizedBox` |\n| `Stack` 자식을 제약 없이 둔다 | 크기 0 또는 화면 전체 | `Positioned` + 명시 크기 |\n\n`Flexible`은 자식이 작으면 작아도 된다. `Expanded`는 `flex` 비율로 남은 공간을 채운다. 텍스트 한 줄은 보통 `Expanded`다.\n\n`Wrap`은 칩·태그처럼 줄바꿈이 자연스러울 때 쓴다. `Row` overflow의 만능 대체는 아니다. 한 줄 제목은 `Expanded`가 맞다.\n\n---\n\n## 정리\n\n레이아웃 버그는 위젯 이름에서 시작하지 않는다. **누가 얼마의 폭·높이를 허용했는가**에서 시작한다. 부모는 제약을 주고, 자식은 그 안에서 크기를 고른다.\n\n---\n\n## 연습\n\n1. 아이콘 + 긴 제목 `Row`를 만들고, `Expanded` 전후에 overflow를 비교한다.\n2. `Column` 헤더 아래 `ListView`를 `Expanded`로 넣어 스크롤되게 한다.\n3. `debugPaintSizeEnabled`로 여백과 제약 상자를 확인한다.\n4. `shrinkWrap: true` 목록을 긴 데이터로 바꿔 보고, 왜 빌더 리스트로 바꿔야 하는지 적는다.\n"])</script><script>self.__next_f.push([1,"2f:T19e6,"])</script><script>self.__next_f.push([1,"# Navigator와 라우트로 화면 전환\n\n\u003e 요약: 화면 전환은 함수 호출이 아니라 내비게이터 스택(또는 URL)의 상태다.\n\n---\n\n## 1. 왜 / 언제\n\n버튼을 누르면 상세 화면이 열린다. 뒤로 가면 목록이 그대로 있다. 이 동작의 실체는 함수 호출이 아니다. **화면 스택에 페이지를 올리고 내리는 일**이다.\n\n작은 앱은 `Navigator.push`로 충분하다. 웹 URL, 딥링크, 로그인 게이트, 탭마다 독립 스택이 필요하면 선언형 라우터를 쓴다. 실무에서는 `go_router`가 기본 후보다.\n\n화면이 늘기 전에 경로를 한곳으로 모은다. 위젯 여기저기에 `push`가 흩어지면 뒤로 가기·인증 분기·웹 주소를 맞출 수 없다.\n\n---\n\n## 2. 핵심\n\n`Navigator`는 위젯 트리 안의 스택이다. `push`는 위에 페이지를 올린다. `pop`은 맨 위를 제거한다. 아래 화면의 `State`는 보통 살아 있다. 그래서 목록 스크롤이 상세에서 돌아와도 유지된다.\n\n선언형 라우팅은 경로 문자열이 곧 상태다. `/posts/42`이면 그 화면이 맞다. 브라우저 주소, 알림 딥링크, 위젯에서 연 화면이 같은 규칙을 탄다.\n\n인자는 세 갈래다.\n\n| 방식 | 용도 | 주의 |\n|------|------|------|\n| path (`:id`) | 화면을 가리키는 id | 웹·딥링크에 강하다 |\n| query | 필터·페이지 번호 | 문자열이다 |\n| `extra` | 객체 통째 전달 | 웹 새로고침에 약하다 |\n\n모달(다이얼로그·바텀시트)은 라우트와 역할을 섞지 않는다. 짧은 확인은 다이얼로그다. 주소가 있어야 하는 화면은 라우트다.\n\n탭 앱은 탭마다 스택이 따로 필요할 수 있다. `go_router`의 `StatefulShellRoute`가 그 패턴이다. 한 전역 스택에 탭 화면을 모두 `push`하면 탭 전환이 뒤로 가기가 된다.\n\n`BuildContext`는 트리의 자리다. 위젯이 떨어진 뒤(`unmounted`) `push`하면 실패한다. 비동기 작업 다음에는 `context.mounted`를 본다.\n\n---\n\n## 3. 예제\n\n### 명령형 push\n\n```dart\nclass ListPage extends StatelessWidget {\n  const ListPage({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(title: const Text('글 목록')),\n      body: ListTile(\n        title: const Text('첫 글'),\n        onTap: () {\n          Navigator.of(context).push(\n            MaterialPageRoute\u003cvoid\u003e(\n              builder: (_) =\u003e const DetailPage(id: '1'),\n            ),\n          );\n        },\n      ),\n    );\n  }\n}\n\nclass DetailPage extends StatelessWidget {\n  const DetailPage({super.key, required this.id});\n\n  final String id;\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(title: Text('글 $id')),\n      body: Center(\n        child: TextButton(\n          onPressed: () =\u003e Navigator.of(context).pop(),\n          child: const Text('닫기'),\n        ),\n      ),\n    );\n  }\n}\n```\n\n`pop`에 값을 넘기면 이전화면이 결과를 받는다. 선택 화면·필터 시트에 쓴다.\n\n```dart\nfinal String? result = await Navigator.of(context).push\u003cString\u003e(\n  MaterialPageRoute(\n    builder: (_) =\u003e const PickPage(),\n  ),\n);\n```\n\n### go_router\n\n```yaml\ndependencies:\n  go_router: ^14.0.0\n```\n\n```dart\nfinal GoRouter router = GoRouter(\n  routes: [\n    GoRoute(\n      path: '/',\n      builder: (BuildContext context, GoRouterState state) {\n        return const HomePage();\n      },\n    ),\n    GoRoute(\n      path: '/posts/:id',\n      builder: (BuildContext context, GoRouterState state) {\n        final String id = state.pathParameters['id']!;\n        return PostPage(id: id);\n      },\n    ),\n  ],\n);\n\nclass App extends StatelessWidget {\n  const App({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return MaterialApp.router(\n      routerConfig: router,\n    );\n  }\n}\n```\n\n이동:\n\n```dart\ncontext.go('/posts/42');\ncontext.push('/posts/42');\ncontext.pop();\n```\n\n`go`는 스택을 그 경로에 맞게 맞춘다. `push`는 위에 한 장을 더 올린다. 목록→상세는 보통 `push`다. 로그인 후 홈으로 되돌릴 때는 `go`가 맞다.\n\n인증 게이트는 리다이렉트로 한곳에 둔다. 각 화면에서 토큰을 검사하지 않는다. `auth`는 세션을 들고 있는 객체다.\n\n```dart\nfinal GoRouter router = GoRouter(\n  refreshListenable: auth,\n  redirect: (BuildContext context, GoRouterState state) {\n    final bool signedIn = auth.isSignedIn;\n    final bool loggingIn = state.matchedLocation == '/login';\n    if (!signedIn \u0026\u0026 !loggingIn) {\n      return '/login';\n    }\n    if (signedIn \u0026\u0026 loggingIn) {\n      return '/';\n    }\n    return null;\n  },\n  routes: [\n    GoRoute(path: '/login', builder: (_, __) =\u003e const LoginPage()),\n    GoRoute(path: '/', builder: (_, __) =\u003e const HomePage()),\n  ],\n);\n```\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| 비동기 후 바로 `push` | unmounted context | `if (!context.mounted) return;` |\n| 큰 객체를 `extra`만으로 전달 | 웹 새로고침 시 유실 | id는 path, 객체는 화면에서 로드 |\n| 다이얼로그를 라우트처럼 쌓기 | 뒤로 가기 스택이 꼬인다 | 모달과 페이지를 분리 |\n| 화면마다 경로 문자열 하드코딩 | 오타·리팩터 비용 | 경로 상수를 한 파일에 |\n| 탭마다 `push`만 사용 | 탭이 히스토리가 된다 | 중첩 내비 / `StatefulShellRoute` |\n\n```dart\nFuture\u003cvoid\u003e openDetail(BuildContext context, String id) async {\n  await preload(id);\n  if (!context.mounted) {\n    return;\n  }\n  await Navigator.of(context).push(\n    MaterialPageRoute\u003cvoid\u003e(\n      builder: (_) =\u003e DetailPage(id: id),\n    ),\n  );\n}\n```\n\n`MaterialApp`과 `MaterialApp.router`를 섞지 않는다. 라우터를 쓰면 `home`/`routes`가 아니라 `routerConfig`다.\n\n리다이렉트의 `signedIn`은 예시의 세션 플래그다. 실제 앱에서는 보안 저장소나 `Auth` 객체를 읽는다. `GoRouter` 생성 시점에 `context`가 아직 준비되지 않을 수 있으면 `refreshListenable`으로 세션 변경을 다시 평가한다.\n\n---\n\n## 정리\n\n화면 전환은 위젯 함수 호출이 아니다. **스택 또는 URL의 상태**다. 작은 앱은 `Navigator`로 시작하고, 경로가 제품의 일부가 되면 라우터를 한곳으로 모은다.\n\n---\n\n## 연습\n\n1. 목록에서 상세로 `push`하고 `pop`으로 돌아오는 두 화면을 만든다.\n2. `pop`으로 선택한 id를 목록에 돌려 준다.\n3. 같은 흐름을 `go_router`의 `/posts/:id`로 옮긴다.\n4. 비동기 로드 뒤 `context.mounted`를 검사하고 이동한다.\n"])</script><script>self.__next_f.push([1,"30:T17d0,"])</script><script>self.__next_f.push([1,"# setState부터 Provider·Riverpod까지 상태 관리\n\n\u003e 요약: 값이 누구의 기억인지 먼저 나누고, 로컬은 setState, 공유는 Provider로 올린다.\n\n---\n\n## 1. 왜 / 언제\n\n상태 관리 패키지를 고르기 전에 질문 하나다. **이 값은 누구의 기억인가.**\n\n입력 중인 글자, 토글, 버튼 로딩은 그 위젯 근처면 된다. `setState`가 가장 싸다. 로그인 세션, 장바구니, 테마 설정은 화면이 바뀌어도 남아야 한다. 그때 공유 계층이 필요하다.\n\n모든 키 입력을 전역 스토어에 넣으면 리빌드가 늘고 코드가 길어진다. 반대로 세션을 화면 `State`에 두면 라우트가 바뀌는 순간 로그아웃과 같아진다.\n\n패키지는 그 다음이다. 팀을 하나로 고정한다. 한 앱에 Provider·Riverpod·Bloc을 섞지 않는다.\n\n---\n\n## 2. 핵심\n\nFlutter에서 화면이 바뀌는 기본 장치는 `setState`다. 값이 바뀌었다고 표시하면 그 `State`의 `build`가 다시 돈다. 위젯 트리는 위에서 아래로 다시 설명된다. `const` 자식과 분리한 위젯은 입력이 같으면 넘어갈 수 있다.\n\n위젯은 자주 다시 만들어진다. 공유 값을 위젯 필드에 두면 사라진다. 트리 위쪽에 값을 두고 아래가 읽게 하는 장치가 `InheritedWidget`이다. Provider는 그 패턴을 쓰기 쉽게 포장한 것이다.\n\n| 상태 | 위치 | 이유 |\n|------|------|------|\n| 폼 입력, 토글, 로컬 로딩 | 위젯 `setState` | 화면과 수명이 같다 |\n| 로그인 세션 | 앱 스코프 | 라우트가 바뀌어도 유지 |\n| 장바구니·설정 | 공유 레이어 | 여러 화면이 읽는다 |\n| 서버 목록 캐시 | 저장소/쿼리 계층 | UI 상태가 아니다 |\n\n읽기 범위가 곧 리빌드 범위다. `watch`는 값이 바뀔 때 그 위젯을 다시 그린다. 큰 화면 루트에서 세션을 `watch`하면 타이핑마다 전체가 흔들릴 수 있다. 필요한 잎만 구독한다.\n\n| 패키지 | 언제 |\n|--------|------|\n| Provider | 개념이 단순하고 생태계가 클 때 |\n| Riverpod | 컴파일 안전·테스트·스코프가 필요할 때 |\n| Bloc | 이벤트/상태 파이프라인을 팀이 원할 때 |\n\n하나를 팀 표준으로 둔다.\n\n---\n\n## 3. 예제\n\n### 로컬 setState\n\n```dart\nclass LikeButton extends StatefulWidget {\n  const LikeButton({super.key});\n\n  @override\n  State\u003cLikeButton\u003e createState() =\u003e _LikeButtonState();\n}\n\nclass _LikeButtonState extends State\u003cLikeButton\u003e {\n  bool liked = false;\n\n  @override\n  Widget build(BuildContext context) {\n    return IconButton(\n      onPressed: () =\u003e setState(() =\u003e liked = !liked),\n      icon: Icon(liked ? Icons.favorite : Icons.favorite_border),\n    );\n  }\n}\n```\n\n좋아요 토글은 이 버튼의 기억이다. 앱 스토어에 올리지 않는다.\n\n### Provider로 세션 공유\n\n```yaml\ndependencies:\n  provider: ^6.1.0\n```\n\n```dart\nclass Auth extends ChangeNotifier {\n  Auth();\n\n  String? userId;\n\n  bool get signedIn =\u003e userId != null;\n\n  void signIn(String id) {\n    userId = id;\n    notifyListeners();\n  }\n\n  void signOut() {\n    userId = null;\n    notifyListeners();\n  }\n}\n```\n\n루트에 올린다.\n\n```dart\nclass App extends StatelessWidget {\n  const App({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return ChangeNotifierProvider\u003cAuth\u003e(\n      create: (_) =\u003e Auth(),\n      child: const MaterialApp(\n        home: HomePage(),\n      ),\n    );\n  }\n}\n```\n\n읽는 쪽은 범위를 나눈다.\n\n```dart\nclass HomeHeader extends StatelessWidget {\n  const HomeHeader({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    final bool signedIn = context.watch\u003cAuth\u003e().signedIn;\n    return Text(signedIn ? '로그인됨' : '게스트');\n  }\n}\n\nclass SignInButton extends StatelessWidget {\n  const SignInButton({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return TextButton(\n      onPressed: () =\u003e context.read\u003cAuth\u003e().signIn('user-1'),\n      child: const Text('로그인'),\n    );\n  }\n}\n```\n\n`watch`는 구독이다. `read`는 한 번 읽고 액션만 호출한다. 버튼은 `read`가 맞다. 헤더처럼 값에 따라 그려져야 하는 곳만 `watch`한다.\n\n`select`로 필드 하나만 구독하면 리빌드가 더 줄어든다.\n\n```dart\nfinal String? userId = context.select\u003cAuth, String?\u003e((Auth a) =\u003e a.userId);\n```\n\n### 위젯 분리\n\n큰 `build` 하나에 `watch`를 여러 개 두지 않는다. 구독하는 위젯을 작게 쪼갠다. 카운터·헤더·리스트를 각각 Stateless로 빼면 상위 `setState`가 전체를 흔들지 않는다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| 모든 입력을 전역에 둔다 | 리빌드·복잡도 증가 | 로컬은 `setState` |\n| 화면 루트에서 `watch` | 타이핑마다 전체 재빌드 | 잎 위젯만 구독 |\n| `watch`로 액션 호출 | 빌드 중 부수 효과 | 콜백에서 `read` |\n| Provider를 `build`마다 생성 | 상태가 리셋된다 | 루트 `create` 한 번 |\n| 패키지를 화면마다 다르게 | 팀 온보딩 실패 | 표준 하나 |\n\n`notifyListeners`는 값이 실제로 바뀔 때만 호출한다. 같은 값으로 반복 알리면 구독 위젯이 불필요하게 다시 돈다.\n\n비동기 뒤에 `notifyListeners`를 호출할 때도 객체가 아직 쓰이는지 본다. `ChangeNotifier`를 `dispose`한 뒤 알리면 예외가 난다.\n\n전역이 필요해 보여도 먼저 위젯을 한 단계 올린다. 부모 `State`로 충분하면 Provider를 열지 않는다.\n\n---\n\n## 정리\n\n상태 관리 프레임워크보다 **“이 값이 누구의 기억인가”** 를 먼저 정한다. 로컬은 `setState`, 공유는 Provider(또는 팀 표준)다. 구독 범위가 곧 리빌드 범위다.\n\n---\n\n## 연습\n\n1. 토글 버튼을 `setState`만으로 만든다. Provider에 올리지 않는다.\n2. `Auth`를 `ChangeNotifier`로 두고 두 화면이 로그인 여부를 공유하게 한다.\n3. 헤더는 `watch`, 버튼은 `read`로 나눈다.\n4. 루트 `watch`를 잎 위젯으로 옮겨 리빌드 범위를 줄인다.\n"])</script><script>self.__next_f.push([1,"31:T1aac,"])</script><script>self.__next_f.push([1,"# 비동기·HTTP·JSON으로 서버 연동\n\n\u003e 요약: 서버 연동은 호출 성공이 아니라 로딩·실패·JSON 계약을 UI가 흡수하는 일이다.\n\n---\n\n## 1. 왜 / 언제\n\n목록 화면은 서버를 기다린다. 기다리는 동안에도 화면은 살아 있어야 한다. Dart의 `async`/`await`는 UI 스레드를 막지 않는다. `await` 지점에서 함수가 잠시 멈추고, 그동안 프레임은 그려진다.\n\n성공만 그리면 실무에서 깨진다. 네트워크는 실패한다. JSON 필드가 빠진다. 토큰이 만료된다. **로딩·성공·실패 세 상태**를 항상 화면에 대응한다.\n\n이 글은 `http` + `jsonDecode` + 모델 `fromJson`의 기본 계약이다. 복잡한 캐시·재시도는 클라이언트 래퍼나 쿼리 계층으로 나중에 올린다.\n\n---\n\n## 2. 핵심\n\n`Future`는 “나중에 값이 온다”는 약속이다. `async` 함수는 `Future`를 돌려준다. `await`는 그 약속이 끝날 때까지 다음 줄을 미룬다.\n\nHTTP는 부가 효과다. 위젯 `build` 안에서 호출하지 않는다. `build`는 여러 번 돈다. 호출은 `initState`, 버튼 콜백, 또는 상태 계층이 맡는다.\n\nJSON은 문자열이다. `jsonDecode` 결과는 `Map`/`List`/`num`/`String`/`bool`/`null`의 조합이다. 앱이 쓰는 타입으로 바꾸는 문이 `fromJson`이다. 서버 계약이 깨지면 여기서 실패해야 한다. 조용히 `null`을 심으면 화면이 틀린 데이터를 보여 준다.\n\nUI는 세 갈래다.\n\n| 상태 | 화면 |\n|------|------|\n| 로딩 | 스피너 또는 스켈레톤 |\n| 성공 | 데이터 위젯 |\n| 실패 | 메시지 + 재시도 |\n\n`FutureBuilder`는 간단한 화면에 맞다. 화면이 커지면 로딩/데이터/에러를 상태 계층에서 모델링한다.\n\n파싱이 매우 크면 `compute`로 Isolate를 검토한다. 일반 REST 한 건은 메인 isolate로 충분하다.\n\n---\n\n## 3. 예제\n\n### 의존성\n\n```yaml\ndependencies:\n  http: ^1.2.0\n```\n\n### 모델과 호출\n\n```dart\nimport 'dart:convert';\nimport 'dart:io';\n\nimport 'package:http/http.dart' as http;\n\nclass User {\n  const User({required this.id, required this.name});\n\n  final String id;\n  final String name;\n\n  factory User.fromJson(Map\u003cString, dynamic\u003e json) {\n    final Object? id = json['id'];\n    final Object? name = json['name'];\n    if (id is! String || name is! String) {\n      throw const FormatException('User JSON 계약 오류');\n    }\n    return User(id: id, name: name);\n  }\n}\n\nFuture\u003cUser\u003e fetchUser({\n  required String baseUrl,\n  required String id,\n  required http.Client client,\n}) async {\n  final Uri url = Uri.parse('$baseUrl/users/$id');\n  final http.Response res = await client\n      .get(url)\n      .timeout(const Duration(seconds: 10));\n  if (res.statusCode != 200) {\n    throw HttpException('status ${res.statusCode}', uri: url);\n  }\n  final Object decoded = jsonDecode(res.body);\n  if (decoded is! Map\u003cString, dynamic\u003e) {\n    throw const FormatException('User JSON이 객체가 아니다');\n  }\n  return User.fromJson(decoded);\n}\n```\n\n`Client`를 인자로 받으면 테스트에서 가짜 응답을 꽂기 쉽다. 타임아웃은 기본값이 아니다. 명시한다.\n\n인증 헤더는 호출마다 적지 않는다. 래퍼가 붙인다. 토큰은 소스에 하드코딩하지 않는다.\n\n### FutureBuilder로 연결\n\n```dart\nclass UserPage extends StatefulWidget {\n  const UserPage({\n    super.key,\n    required this.userId,\n    required this.client,\n  });\n\n  final String userId;\n  final http.Client client;\n\n  @override\n  State\u003cUserPage\u003e createState() =\u003e _UserPageState();\n}\n\nclass _UserPageState extends State\u003cUserPage\u003e {\n  late Future\u003cUser\u003e _future;\n\n  @override\n  void initState() {\n    super.initState();\n    _future = fetchUser(\n      baseUrl: 'https://api.example.com',\n      id: widget.userId,\n      client: widget.client,\n    );\n  }\n\n  void _retry() {\n    setState(() {\n      _future = fetchUser(\n        baseUrl: 'https://api.example.com',\n        id: widget.userId,\n        client: widget.client,\n      );\n    });\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return FutureBuilder\u003cUser\u003e(\n      future: _future,\n      builder: (BuildContext context, AsyncSnapshot\u003cUser\u003e snap) {\n        if (snap.connectionState != ConnectionState.done) {\n          return const Center(child: CircularProgressIndicator());\n        }\n        if (snap.hasError) {\n          return Center(\n            child: TextButton(\n              onPressed: _retry,\n              child: const Text('다시 시도'),\n            ),\n          );\n        }\n        final User user = snap.data!;\n        return Text(user.name);\n      },\n    );\n  }\n}\n```\n\n`FutureBuilder`에 `fetchUser()`를 `build`마다 넘기지 않는다. 새 `Future`가 생기면 요청이 반복된다. `initState`에서 만든 필드를 넘긴다.\n\n재시도는 새 `Future`를 만들어 `setState`한다.\n\n### 화면을 떠난 뒤\n\n```dart\nFuture\u003cvoid\u003e load() async {\n  try {\n    final User user = await fetchUser(\n      baseUrl: 'https://api.example.com',\n      id: widget.userId,\n      client: widget.client,\n    );\n    if (!mounted) {\n      return;\n    }\n    setState(() =\u003e _user = user);\n  } on HttpException catch (e) {\n    if (!mounted) {\n      return;\n    }\n    setState(() =\u003e _message = e.message);\n  }\n}\n```\n\n`await` 이후에는 위젯이 이미 제거됐을 수 있다. `mounted`를 본다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| `build`에서 HTTP 호출 | 리빌드마다 요청 | `initState` / 상태 계층 |\n| 200만 성공으로 본다 | 빈 바디·에러 JSON 누락 | 상태 코드 + 파싱 계약 |\n| `as Map`만 하고 필드 미검증 | 런타임 타입 오류 | `fromJson`에서 타입 확인 |\n| 토큰을 코드에 박는다 | 유출 | 보안 저장소·백엔드 |\n| 실패 UI 없음 | 무한 스피너 | 에러 + 재시도 |\n| `FutureBuilder`에 새 Future | 깜빡임·중복 호출 | Future를 필드로 고정 |\n\n`json_serializable` / freezed는 팀 합의 후 도입한다. 코드젠이 계약을 없애 주지는 않는다. 서버 필드가 바뀌면 생성 코드도 갱신한다.\n\n목록은 다음 글의 `ListView.builder`와 맞춘다. 한 번에 받은 JSON 배열을 `Column` + `map`으로 펼치지 않는다.\n\n---\n\n## 정리\n\n네트워킹은 호출이 200을 돌려주는가가 아니다. **실패·로딩·파싱 계약을 UI가 흡수하는가**다. `async`/`await`로 기다리고, 모델에서 JSON을 검증하고, 세 상태를 그린다.\n\n---\n\n## 연습\n\n1. `User.fromJson`이 필드 타입이 다를 때 예외를 내게 한다.\n2. `fetchUser`에 타임아웃과 non-200 처리를 넣는다.\n3. `FutureBuilder`로 로딩·에러·이름을 그리고, 재시도 버튼을 붙인다.\n4. `build`가 아니라 `initState`에서 Future를 만들도록 고친다.\n"])</script><script>self.__next_f.push([1,"32:T190c,"])</script><script>self.__next_f.push([1,"# 리스트·키·성능의 기본\n\n\u003e 요약: 긴 목록은 빌더로 그리고, 키로 아이템 정체성을 지키면 스크롤이 버틴다.\n\n---\n\n## 1. 왜 / 언제\n\n피드·검색 결과·채팅처럼 아이템이 많으면 `Column` + `map`은 한 번에 모든 자식을 만든다. 스크롤이 버벅이고 메모리만 는다.\n\n`ListView.builder`는 화면에 보이는 근처만 위젯으로 만든다. 이것이 기본이다.\n\n같은 타입 행이 재배열되면 또 다른 문제가 생긴다. 입력 중이던 글자가 다른 행으로 옮겨 간다. 원인은 레이아웃이 아니다. Flutter가 **누가 같은 위젯인지**를 자리로만 맞춰서다. 그때 키가 필요하다.\n\n---\n\n## 2. 핵심\n\n키는 위젯의 이름표다.\n\nFlutter는 리빌드할 때 이전 트리와 새 트리를 맞춘다. 기본 규칙은 타입과 위치다. 같은 자리의 `ListTile`은 같은 것으로 본다. 목록이 섞이면 3번 자리의 State가 새 3번 아이템에 붙는다.\n\n키를 주면 타입+키로 맞춘다. 서버 id처럼 **안 바뀌는 값**을 `ValueKey`로 붙인다. 인덱스를 키로 쓰면 재배열과 함께 키가 바뀌므로 의미가 없다.\n\n| 키 | 언제 |\n|----|------|\n| `ValueKey(id)` | 리스트 아이템, 폼 필드. 값이 안정적이어야 한다. |\n| `ObjectKey(obj)` | 동일 인스턴스로 구분할 때. |\n| `UniqueKey()` | 매번 새 위젯으로 강제해 상태를 리셋할 때. |\n| `GlobalKey` | 다른 서브트리에서 State에 접근할 때. 남용하면 비싸다. |\n\n빌더 리스트는 `itemBuilder`가 index마다 위젯을 돌려준다. 화면에 안 보이면 만들지 않는다. 타일은 가볍게 둔다. 무거운 차트·큰 이미지를 행 안에 중첩하지 않는다.\n\n상위 `setState`가 리스트 전체를 다시 돌리지 않게 행을 Stateless로 분리한다. 변하지 않는 서브트리는 `const`다.\n\n네트워크 이미지는 크기와 캐시를 지정한다. 원본 해상도를 스크롤에 그대로 넣지 않는다.\n\n---\n\n## 3. 예제\n\n### 빌더 + 안정적 키\n\n```dart\nclass Post {\n  const Post({required this.id, required this.title});\n\n  final String id;\n  final String title;\n}\n\nclass PostList extends StatelessWidget {\n  const PostList({super.key, required this.items});\n\n  final List\u003cPost\u003e items;\n\n  @override\n  Widget build(BuildContext context) {\n    return ListView.builder(\n      itemCount: items.length,\n      itemBuilder: (BuildContext context, int index) {\n        final Post item = items[index];\n        return PostTile(\n          key: ValueKey\u003cString\u003e(item.id),\n          post: item,\n        );\n      },\n    );\n  }\n}\n\nclass PostTile extends StatelessWidget {\n  const PostTile({super.key, required this.post});\n\n  final Post post;\n\n  @override\n  Widget build(BuildContext context) {\n    return ListTile(\n      title: Text(post.title),\n    );\n  }\n}\n```\n\n`key`는 리스트의 직접 자식에 둔다. `ListTile` 안쪽이 아니라 `PostTile`에 붙인다. Flutter가 맞추는 대상은 부모 `children`의 그 자리다.\n\n아이템이 매우 많으면 `ListView.separated`로 구분선을 빌더에 맡긴다. `Column`에 `Divider`를 미리 다 만들지 않는다.\n\n### 키가 없을 때 깨지는 입력\n\n```dart\nclass NamedField extends StatefulWidget {\n  const NamedField({super.key, required this.label});\n\n  final String label;\n\n  @override\n  State\u003cNamedField\u003e createState() =\u003e _NamedFieldState();\n}\n\nclass _NamedFieldState extends State\u003cNamedField\u003e {\n  final TextEditingController controller = TextEditingController();\n\n  @override\n  void dispose() {\n    controller.dispose();\n    super.dispose();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return TextField(\n      controller: controller,\n      decoration: InputDecoration(labelText: widget.label),\n    );\n  }\n}\n```\n\n이 필드를 리스트에서 순서를 바꾸면, 키가 없을 때 컨트롤러가 잘못된 행에 남는다. 각 행에 `ValueKey(label)` 또는 항목 id를 준다.\n\n### 스크롤 성능\n\n```dart\nclass AvatarTile extends StatelessWidget {\n  const AvatarTile({super.key, required this.url, required this.title});\n\n  final String url;\n  final String title;\n\n  @override\n  Widget build(BuildContext context) {\n    return ListTile(\n      leading: Image.network(\n        url,\n        width: 40,\n        height: 40,\n        fit: BoxFit.cover,\n        cacheWidth: 80,\n      ),\n      title: Text(title, maxLines: 1, overflow: TextOverflow.ellipsis),\n    );\n  }\n}\n```\n\n`cacheWidth`는 디코드 크기를 제한한다. 디스플레이 픽셀을 고려해 논리 크기의 2배 정도가 흔하다.\n\n고정 높이 행이면 `itemExtent`를 준다. 스크롤 오프셋 계산이 싸진다.\n\n```dart\nListView.builder(\n  itemExtent: 56,\n  itemCount: items.length,\n  itemBuilder: (BuildContext context, int index) {\n    return PostTile(\n      key: ValueKey\u003cString\u003e(items[index].id),\n      post: items[index],\n    );\n  },\n);\n```\n\n`RepaintBoundary`는 측정 후에 쓴다. 추측으로 모든 행에 씌우지 않는다. DevTools Performance와 rebuild 하이라이트로 먼저 본다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| `Column` + `map`으로 긴 목록 | 한 번에 전부 빌드 | `ListView.builder` |\n| `key: ValueKey(index)` | 재배열 때 상태 꼬임 | 안정적 id |\n| 행을 화면 State 안에 인라인 | 상위 setState가 전부 리빌드 | 타일 Stateless 분리 |\n| 원본 이미지를 행에 그대로 | 스크롤 드롭 | 크기·캐시 지정 |\n| `shrinkWrap` 기본값화 | 가상화 포기 | 부모가 유한 높이 |\n\n`GlobalKey`로 행을 식별하지 않는다. 리스트 길이만큼 전역 키가 생기면 비용이 크다. `ValueKey`면 충분하다.\n\n`Sliver`는 커스텀 스크롤(헤더 고정, 그리드 혼합)이 필요할 때 쓴다. 일반 목록은 `ListView.builder`로 시작한다.\n\n---\n\n## 정리\n\n리스트 성능은 마법이 아니다. **빌더 + 키 + 작은 타일**의 합이다. 키는 자리 대신 정체성을 알려 주는 이름표다.\n\n---\n\n## 연습\n\n1. 200개 항목을 `Column`과 `ListView.builder`로 각각 그려 스크롤을 비교한다.\n2. 입력 필드 리스트를 재배열하고, id 키 전후에 텍스트가 따라오는지 확인한다.\n3. 타일을 Stateless로 분리하고 `const` 생성자를 붙인다.\n4. 네트워크 이미지에 `width`/`height`/`cacheWidth`를 지정한다.\n"])</script><script>self.__next_f.push([1,"33:T175c,"])</script><script>self.__next_f.push([1,"# ThemeData로 머티리얼 디자인 토큰\n\n\u003e 요약: 색과 글자 크기는 위젯마다 박지 말고 ThemeData 한곳으로 모은다.\n\n---\n\n## 1. 왜 / 언제\n\n버튼마다 hex를 적으면 다크모드와 리브랜드가 화면 수만큼의 수정이 된다. 테마는 장식이 아니다. **앱이 공유하는 색·글자·모양 계약**이다.\n\n머티리얼은 그 계약을 `ThemeData`로 내려 준다. 위젯 트리 아래는 `Theme.of(context)`로 읽는다. 새 화면은 토큰만 쓰면 된다.\n\n이 글을 쓰는 시점은 화면을 여러 장 만들기 시작한 때다. 첫 버튼 색을 고치기 전에 루트 테마를 고정한다.\n\n---\n\n## 2. 핵심\n\n`MaterialApp`이 테마를 트리에 심는다. `theme`은 라이트, `darkTheme`은 다크다. `themeMode`가 어느 쪽을 쓸지 고른다.\n\n`ColorScheme`이 색의 역할이다. primary, surface, onSurface처럼 **역할 이름**으로 부른다. “이 버튼은 #0B6E4F”가 아니라 “이 버튼은 primary”다.\n\n`TextTheme`이 글자 단계다. 제목·본문·캡션 크기를 위젯마다 숫자로 두지 않는다. 시스템 글자 확대에 대비해 overflow를 설계한다.\n\n컴포넌트 테마(`AppBarTheme`, `FilledButtonTheme` 등)는 위젯 종류의 기본 모양이다. 한 화면만 예외가 필요하면 그 서브트리에서 `Theme`으로 덮는다. 예외를 기본값으로 올리지 않는다.\n\nCupertino는 iOS 느낌을 낼 때 쓴다. 한 앱에서 Material 내비게이션과 Cupertino 내비게이션을 섞으면 제스처·앱바가 흔들린다. **주 디자인 언어를 하나** 고른다.\n\n최근 Flutter는 Material 3가 기본인 경우가 많다. `ColorScheme.fromSeed`로 시드 색 하나에서 역할 색을 만든다.\n\n---\n\n## 3. 예제\n\n### 루트 테마\n\n```dart\nclass App extends StatelessWidget {\n  const App({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    const Color seed = Color(0xFF0B6E4F);\n    return MaterialApp(\n      theme: ThemeData(\n        colorScheme: ColorScheme.fromSeed(seedColor: seed),\n        useMaterial3: true,\n      ),\n      darkTheme: ThemeData(\n        colorScheme: ColorScheme.fromSeed(\n          seedColor: seed,\n          brightness: Brightness.dark,\n        ),\n        useMaterial3: true,\n      ),\n      themeMode: ThemeMode.system,\n      home: const HomePage(),\n    );\n  }\n}\n```\n\n시드만 공유하면 라이트·다크가 같은 브랜드를 유지한다. 시스템 설정을 따르려면 `ThemeMode.system`이다.\n\n### 토큰으로 그리기\n\n```dart\nclass StatusCard extends StatelessWidget {\n  const StatusCard({super.key, required this.label});\n\n  final String label;\n\n  @override\n  Widget build(BuildContext context) {\n    final ColorScheme colors = Theme.of(context).colorScheme;\n    final TextTheme texts = Theme.of(context).textTheme;\n\n    return Card(\n      color: colors.surfaceContainerHighest,\n      child: Padding(\n        padding: const EdgeInsets.all(16),\n        child: Text(\n          label,\n          style: texts.titleMedium?.copyWith(color: colors.onSurface),\n        ),\n      ),\n    );\n  }\n}\n```\n\nhex가 없다. 다크모드로 바뀌면 `ColorScheme`이 바뀌고 이 카드도 따라간다.\n\n### 타이포와 컴포넌트\n\n```dart\nThemeData _buildTheme(Brightness brightness) {\n  final ColorScheme scheme = ColorScheme.fromSeed(\n    seedColor: const Color(0xFF0B6E4F),\n    brightness: brightness,\n  );\n  return ThemeData(\n    colorScheme: scheme,\n    useMaterial3: true,\n    textTheme: const TextTheme(\n      titleLarge: TextStyle(fontSize: 22, fontWeight: FontWeight.w600),\n      bodyMedium: TextStyle(fontSize: 16, height: 1.4),\n    ),\n    appBarTheme: AppBarTheme(\n      backgroundColor: scheme.surface,\n      foregroundColor: scheme.onSurface,\n      elevation: 0,\n    ),\n    filledButtonTheme: FilledButtonThemeData(\n      style: FilledButton.styleFrom(\n        minimumSize: const Size.fromHeight(48),\n      ),\n    ),\n  );\n}\n```\n\n버튼 최소 높이는 터치 영역이다. 화면마다 `height: 48`을 반복하지 않는다.\n\n한 화면만 강조색을 바꾸려면 그 아래만 덮는다.\n\n```dart\nTheme(\n  data: Theme.of(context).copyWith(\n    colorScheme: Theme.of(context).colorScheme.copyWith(\n      primary: const Color(0xFFB45309),\n    ),\n  ),\n  child: const DangerActions(),\n)\n```\n\n### 접근성\n\n글자 배율이 커져도 한 줄 제목이 깨지지 않게 `overflow`와 `maxLines`를 둔다. 대비는 `onPrimary` / `onSurface` 쌍을 쓰면 시드에서 만든 역할 색이 맞춰 준다. 임의의 회색을 surface 위에 올리지 않는다.\n\n```dart\nText(\n  title,\n  maxLines: 2,\n  overflow: TextOverflow.ellipsis,\n  style: Theme.of(context).textTheme.titleLarge,\n)\n```\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| 위젯마다 hex | 다크모드·리브랜드 실패 | `colorScheme` |\n| `Colors.black`을 본문에 | 다크에서 안 보임 | `onSurface` |\n| 화면마다 `TextStyle(fontSize: 14)` | 단계가 무너짐 | `textTheme` |\n| Material/Cupertino 혼용 | 내비게이션 패턴 붕괴 | 주 언어 하나 |\n| 예외 스타일을 루트에 올림 | 전역이 오염된다 | 로컬 `Theme` |\n\n`Theme.of(context)`는 `MaterialApp` 아래에서만 안전하다. 테스트나 미리보기에서 앱 없이 위젯을 올리면 테마가 없을 수 있다. 그때는 `MaterialApp`으로 감싼다.\n\n색을 애니메이션할 때도 토큰을 읽은 뒤 보간한다. 하드코딩 두 색을 보간하면 테마와 어긋난다.\n\n---\n\n## 정리\n\n디자인은 화면 장식이 아니다. **ColorScheme + TextTheme 계약**이다. 위젯은 역할 이름만 쓰고, 값은 루트 `ThemeData`가 들고 있다.\n\n---\n\n## 연습\n\n1. `ColorScheme.fromSeed`로 라이트·다크 테마를 루트에 둔다.\n2. 카드와 제목에서 hex를 제거하고 `Theme.of`로 바꾼다.\n3. `FilledButtonTheme`으로 최소 높이를 통일한다.\n4. 시스템 글자 크기를 키운 뒤 제목 overflow를 확인한다.\n"])</script><script>self.__next_f.push([1,"34:T19f2,"])</script><script>self.__next_f.push([1,"# 로컬 저장·설정 영속화\n\n\u003e 요약: 기기에 남길 데이터는 민감도와 수명에 따라 prefs, 보안 저장소, DB로 나눈다.\n\n---\n\n## 1. 왜 / 언제\n\n앱을 껐다 켜도 온보딩을 다시 보면 설정이 영속화되지 않은 것이다. 반대로 액세스 토큰을 일반 설정 파일에 두면 백업·루팅·공유 스토리지에서 새어 나간다.\n\n로컬 저장은 패키지 이름이 먼저가 아니다. **민감도·수명·오프라인 요구**를 나눈 다음 저장소를 고른다.\n\n서버가 진실의 원천인 데이터는 캐시다. 기기 전용 플래그는 로컬이 원천이다. 이 구분을 제품에서 합의하지 않으면 멀티 기기에서 설정이 싸운다.\n\n---\n\n## 2. 핵심\n\n| 데이터 | 후보 | 이유 |\n|--------|------|------|\n| 온보딩 완료, 테마 모드 | `shared_preferences` | 작은 키-값, 비밀 아님 |\n| 액세스·리프레시 토큰 | secure storage | 키체인/키스토어 |\n| 검색·오프라인 큐·관계 | SQLite / drift | 쿼리와 마이그레이션 |\n| 이미지·파일 캐시 | 캐시 디렉터리 | 만료·용량 제한 |\n\n일반 prefs는 XML/plist에 가깝다. 암호화가 목적이 아니다. 토큰·개인식별값을 두지 않는다.\n\n키 이름은 도메인처럼 짓는다. `done`, `flag1`은 충돌한다. `onboarding.done`, `settings.themeMode`처럼 읽히게 한다. 마이그레이션 계획이 없으면 키가 늘어나며 죽은 값이 남는다.\n\nSQLite는 스키마 버전이 앱 버전과 함께 간다. 컬럼을 추가하면 마이그레이션을 적는다. 파일을 지우고 다시 만드는 방식은 사용자 데이터를 날린다.\n\n로컬은 유실된다. 기기 변경, 앱 삭제, OS 저장소 정리다. “절대 없어지면 안 되는 값”은 서버에 둔다.\n\n읽기·쓰기는 비동기다. `build`에서 `await`하지 않는다. 로드는 `initState` 또는 앱 기동 시퀀스에서 하고, 결과는 상태에 넣는다.\n\n---\n\n## 3. 예제\n\n### shared_preferences\n\n```yaml\ndependencies:\n  shared_preferences: ^2.3.0\n```\n\n```dart\nclass SettingsStore {\n  SettingsStore(this._prefs);\n\n  static const String themeKey = 'settings.themeMode';\n\n  final SharedPreferences _prefs;\n\n  static Future\u003cSettingsStore\u003e open() async {\n    final SharedPreferences prefs = await SharedPreferences.getInstance();\n    return SettingsStore(prefs);\n  }\n\n  ThemeMode themeMode() {\n    final String? raw = _prefs.getString(themeKey);\n    return switch (raw) {\n      'dark' =\u003e ThemeMode.dark,\n      'light' =\u003e ThemeMode.light,\n      _ =\u003e ThemeMode.system,\n    };\n  }\n\n  Future\u003cvoid\u003e setThemeMode(ThemeMode mode) async {\n    final String raw = switch (mode) {\n      ThemeMode.dark =\u003e 'dark',\n      ThemeMode.light =\u003e 'light',\n      ThemeMode.system =\u003e 'system',\n    };\n    await _prefs.setString(themeKey, raw);\n  }\n}\n```\n\n불리언 플래그도 같다.\n\n```dart\nconst String onboardingKey = 'onboarding.done';\n\nFuture\u003cvoid\u003e completeOnboarding(SharedPreferences prefs) async {\n  await prefs.setBool(onboardingKey, true);\n}\n\nbool isOnboardingDone(SharedPreferences prefs) {\n  return prefs.getBool(onboardingKey) ?? false;\n}\n```\n\n없는 키는 `null`이다. `?? false`로 기본값을 명시한다. “없음”과 `false`를 구분해야 하면 별도 키 또는 버전을 둔다.\n\n### 비밀은 보안 저장소\n\n```yaml\ndependencies:\n  flutter_secure_storage: ^9.2.0\n```\n\n```dart\nclass TokenStore {\n  TokenStore(this._storage);\n\n  static const String accessKey = 'auth.accessToken';\n\n  final FlutterSecureStorage _storage;\n\n  Future\u003cvoid\u003e saveAccessToken(String token) async {\n    await _storage.write(key: accessKey, value: token);\n  }\n\n  Future\u003cString?\u003e readAccessToken() {\n    return _storage.read(key: accessKey);\n  }\n\n  Future\u003cvoid\u003e clear() async {\n    await _storage.delete(key: accessKey);\n  }\n}\n```\n\n로그아웃은 메모리뿐 아니라 저장소도 지운다. prefs에 토큰을 미러링하지 않는다.\n\n### 기동 시 로드\n\n```dart\nclass AppScope extends StatefulWidget {\n  const AppScope({super.key, required this.child});\n\n  final Widget child;\n\n  @override\n  State\u003cAppScope\u003e createState() =\u003e _AppScopeState();\n}\n\nclass _AppScopeState extends State\u003cAppScope\u003e {\n  late final Future\u003cSettingsStore\u003e _settings;\n\n  @override\n  void initState() {\n    super.initState();\n    _settings = SettingsStore.open();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return FutureBuilder\u003cSettingsStore\u003e(\n      future: _settings,\n      builder: (BuildContext context, AsyncSnapshot\u003cSettingsStore\u003e snap) {\n        if (!snap.hasData) {\n          return const MaterialApp(\n            home: Scaffold(\n              body: Center(child: CircularProgressIndicator()),\n            ),\n          );\n        }\n        return MyApp(settings: snap.data!);\n      },\n    );\n  }\n}\n```\n\n설정이 준비되기 전에 본문을 그리지 않는다. 테마가 깜빡이며 바뀌는 것을 줄인다.\n\n### SQLite가 맞을 때\n\n오프라인 초안, 전문 검색, 관계(글-댓글)가 있으면 키-값으로 직렬화하지 않는다. drift 또는 sqflite로 테이블을 둔다. 스키마 버전을 올리고, 마이그레이션에 `ALTER TABLE`을 적는다. 릴리스 노트에 마이그레이션을 포함한다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| prefs에 토큰 | 유출·백업 노출 | secure storage |\n| 키 이름 `flag` | 충돌·폐기 불가 | 도메인.키 + 버전 |\n| `build`에서 getInstance | 리빌드마다 비동기 깜빡임 | 기동 시 한 번 |\n| JSON 문자열을 prefs에 대형 목록 | 파싱·용량 한계 | SQLite |\n| 마이그레이션 없이 컬럼 추가 | 업데이트 후 크래시 | 스키마 버전 |\n| 로컬만 진실 | 기기 변경 시 데이터 상실 | 서버 원천 여부 합의 |\n\n멀티 프로세스(위젯·백그라운드)에서 prefs 타이밍이 어긋날 수 있다. 단순 설정은 괜찮다. 카운터처럼 자주 쓰는 값은 충돌을 가정한다.\n\n캐시 디렉터리 파일은 언제든 지워질 수 있다. 사용자 문서처럼 다루지 않는다.\n\n---\n\n## 정리\n\n영속화는 패키지 선택이 아니다. **민감도·수명·오프라인 요구**를 표로 나눈 다음 prefs, 보안 저장소, DB를 고른다. 비밀은 일반 설정에 두지 않는다.\n\n---\n\n## 연습\n\n1. 테마 모드를 prefs에 저장하고 재실행 뒤 복원한다.\n2. 온보딩 플래그 키를 `onboarding.done`으로 고정한다.\n3. 토큰 저장을 secure storage로 옮기고 로그아웃 때 삭제한다.\n4. 앱이 지워지면 사라져도 되는 값과 서버에 있어야 하는 값을 표로 나눈다.\n"])</script><script>self.__next_f.push([1,"35:T1da9,"])</script><script>self.__next_f.push([1,"# Flutter 빌드·배포 실무 체크리스트\n\n\u003e 요약: 스토어 제출 전에 서명, 권한, 릴리스 빌드, 관측을 한 장으로 점검한다.\n\n---\n\n## 1. 왜 / 언제\n\n`flutter run`이 되는 것과 스토어 바이너리는 다르다. 디버그 빌드는 느리고, 로그가 남고, 서명이 개발용이다.\n\n이 목록은 출시 직전에 한 번 훑는 용도다. 각 항목은 **왜 막히거나 사고가 나는지**를 한 줄로 붙인다. 통과하지 않은 채 `flutter build`만 돌리지 않는다.\n\n---\n\n## 2. 품질\n\n- [ ] `flutter analyze`가 통과한다 — 분석기가 남는 오류는 스토어 빌드·CI에서 다시 막히고, null 실수는 크래시가 된다.\n- [ ] 주요 흐름에 위젯·유닛 테스트가 있다 — 로그인·결제·목록처럼 한 번 깨지면 리뷰·평점이 바로 무너진다.\n- [ ] 대비·큰 글자·스크린 리더 라벨을 확인한다 — 스토어 접근성 거절과 실제 사용자 이탈을 동시에 줄인다.\n- [ ] 가로·노치·키보드에서 overflow가 없다 — 릴리스에서만 드러나는 노란 줄은 리뷰 스크린샷을 망친다.\n- [ ] 빈 목록·네트워크 실패·권한 거절 화면이 있다 — 성공 경로만 있으면 현장 로그가 “무한 스피너”로만 남는다.\n\n```bash\nflutter analyze\nflutter test\n```\n\n`analysis_options.yaml`의 linter를 팀 표준으로 고정한다. 개인 IDE 설정에 의존하지 않는다.\n\n---\n\n## 3. 성능·용량\n\n- [ ] `flutter run --release`로 체감한다 — 디버그 jank를 최적화하면 없는 병을 고치게 된다.\n- [ ] 이미지 해상도와 포맷을 줄인다 — 번들 용량과 스크롤 디코드 비용이 스토어 다운로드를 결정한다.\n- [ ] 디버그 로그·테스트 에셋을 뺀다 — `print`와 미사용 에셋은 용량과 정보 유출을 만든다.\n- [ ] DevTools로 드롭 프레임 구간을 본다 — 첫 화면·목록 스크롤이 60fps를 못 지키면 리뷰에 “느리다”가 적힌다.\n- [ ] `const`와 빌더 리스트를 지킨다 — 불필요 리빌드는 저가 기기에서만 재현된다.\n\n```bash\nflutter run --release\nflutter build apk --analyze-size\n```\n\n아이콘·스플래시는 플랫폼 가이드 크기를 맞춘다. 임의 PNG를 늘리면 가장자리가 깨져 보인다.\n\n---\n\n## 4. Android\n\n- [ ] `applicationId`가 최종 패키지명이다 — 한 번 스토어에 올리면 바꿀 수 없다.\n- [ ] `versionName` / `versionCode`를 올린다 — 같은 코드로 재제출하면 Play가 거부한다.\n- [ ] 업로드 키스토어와 Play App Signing을 확인한다 — 키를 잃으면 앱을 업데이트할 수 없다.\n- [ ] R8 minify/shrink를 릴리스에 켠다 — 용량과 심볼 노출을 줄인다. 리플렉션 코드는 keep 규칙이 필요하다.\n- [ ] 권한을 최소로 둔다 — 쓰지 않는 위치·전화 권한은 정책 거절 사유다.\n- [ ] `minSdk`와 대상 SDK가 스토어 요구를 충족한다 — 타깃 미달은 업로드 단계에서 막힌다.\n\n```yaml\n# pubspec.yaml\nversion: 1.2.0+12\n```\n\n`+12`가 Android `versionCode`로 간다. 빌드마다 증가시킨다.\n\n```bash\nflutter build appbundle\n```\n\nPlay에 올리는 산출물은 APK보다 AAB가 기본이다. 내부 테스터에게만 APK를 쓴다.\n\n키스토어는 저장소에 커밋하지 않는다. CI 시크릿으로만 주입한다.\n\n---\n\n## 5. iOS\n\n- [ ] Bundle ID가 최종이다 — App ID·인증서·스토어 기록이 이 문자열에 묶인다.\n- [ ] 배포 인증서와 프로비저닝이 만료되지 않았다 — Archive 실패의 대부분이 여기다.\n- [ ] Info.plist 권한 설명이 실제 용도와 같다 — 문구 없는 카메라/추적 권한은 리뷰 거절이다.\n- [ ] `flutter build ipa` 또는 Xcode Archive가 통과한다 — 로컬 `run` 성공은 서명된 IPA를 보장하지 않는다.\n- [ ] 가로 지원·노치·다크모드를 스크린샷 기기에서 본다 — 리뷰어가 보는 기기와 디버그 폰이 다르다.\n\n```bash\nflutter build ipa\n```\n\n버전은 `pubspec.yaml`과 Xcode Marketing Version을 맞춘다. 어긋나면 업로드가 거절된다.\n\n---\n\n## 6. 보안·운영\n\n- [ ] API 키를 앱에 박지 않는다 — 바이너리에서 문자열이 추출된다. 가능하면 백엔드가 대리 호출한다.\n- [ ] 토큰은 보안 저장소에 둔다 — 일반 prefs는 백업에 포함될 수 있다.\n- [ ] 인증서 피닝은 팀 정책으로 결정한다 — 켜면 인증서 교체 때 앱이 전면 실패한다.\n- [ ] Crashlytics 등 크래시 리포트를 켠다 — 스토어 리뷰에는 안 나오는 기동 크래시를 볼 수단이 필요하다.\n- [ ] dev/prod 엔드포인트를 분리한다 — 프로덕션 앱이 스테이징을 치면 데이터가 섞인다.\n- [ ] 로그에 PII·토큰을 남기지 않는다 — 릴리스 로그도 수집기로 나간다.\n\n환경은 `--dart-define` 또는 flavor로 나눈다. 소스의 `const api = 'https://prod...'` 한 줄에 의존하지 않는다.\n\n```bash\nflutter build appbundle --dart-define=API_BASE=https://api.example.com\n```\n\n---\n\n## 7. Flavor와 CI\n\n- [ ] `dev` / `prod` flavor 또는 엔트리가 나뉜다 — 한 바이너리가 두 환경을 치면 실수로 운영 API를 친다.\n- [ ] CI가 `analyze` → `test` → `build` 순으로 돈다 — 로컬에서만 빌드하면 키·JDK 차이가 출시 당일에 드러난다.\n- [ ] 서명 파일은 CI 시크릿이다 — 워크스페이스에 `*.jks`가 있으면 유출과 같다.\n- [ ] 아티팩트(AAB/IPA)를 빌드 번호로 보관한다 — 롤백할 바이너리가 없으면 스토어 콘솔에만 의존하게 된다.\n\n```bash\nflutter analyze\nflutter test\nflutter build appbundle --release --dart-define=API_BASE=https://api.example.com\n```\n\n앱 아이콘·스플래시·표시 이름이 flavor마다 다르면 테스터가 어떤 빌드인지 구분한다. 같은 아이콘의 prod/dev는 설치 혼선을 만든다.\n\n---\n\n## 8. 스토어·롤백\n\n- [ ] 스토어 설명·스크린샷·개인정보 처리 방침 URL이 있다 — 메타 누락은 바이너리와 별개로 거절된다.\n- [ ] 내부 테스트 트랙을 먼저 돈다 — 서명·권한 문제는 프로덕션 직전이 아니라 내부에서 터져야 한다.\n- [ ] 롤백 방법을 적어 둔다 — Play/App Store는 이전 버전 재활성 절차가 다르다.\n- [ ] 지원 OS 버전을 공지에 적는다 — minSdk/iOS 최소가 사용자 기기와 맞는지 미리 알린다.\n\n---\n\n## 9. 흔한 실수\n\n| 실수 | 왜 막히는가 |\n|------|-------------|\n| 디버그 빌드를 스토어에 올린다 | 느리고 로그가 남으며 서명이 개발용이다 |\n| 버전 코드를 안 올린다 | Play/App Store가 같은 빌드를 거부한다 |\n| 키스토어를 Git에 둔다 | 유출 시 앱 업데이트가 공격자에게 넘어간다 |\n| 권한 설명 없이 카메라/위치 | 리뷰 거절이다 |\n| 크래시 리포트 없이 출시 | 현장 기동 실패를 알 수 없다 |\n\n---\n\n## 정리\n\nFlutter 릴리스는 `flutter build` 한 줄이 아니다. **서명·권한·스토어 메타·관측**이 위 목록을 통과하는 일이다. 각 항목의 “왜”를 건너뛴 체크는 체크가 아니다.\n\n---\n\n## 연습\n\n1. `flutter analyze`와 `flutter test`를 로컬에서 통과시킨다.\n2. `flutter run --release`로 목록 스크롤을 실기기에서 확인한다.\n3. `pubspec.yaml` 버전을 올리고 AAB 또는 IPA를 만든다.\n4. 이 글의 체크리스트를 통과/미통과로 표시하고, 미통과 항목의 “왜”를 팀에 공유한다.\n"])</script><script>self.__next_f.push([1,"36:T11a8,"])</script><script>self.__next_f.push([1,"# 시맨틱 HTML로 문서 뼈대 잡기\n\n\u003e 요약: header·main·nav 같은 시맨틱 태그로 페이지 뼈대를 잡고, 스크린 리더와 검색엔진이 읽을 수 있는 HTML을 작성한다.\n\n---\n\n## 언제 시맨틱 태그를 쓰는가\n\n화면은 `div`만으로도 만들 수 있다. 다만 태그에 역할을 넣으면 브라우저·스크린 리더·검색엔진이 같은 구조를 읽는다.\n\n새 페이지를 시작할 때 먼저 뼈대를 정한다. 사이트 머리글, 본문, 내비, 바닥글을 `div`로 감싸지 말고 역할에 맞는 태그를 고른다.\n\n선택자도 의미가 남는다. `.header` 클래스보다 `header` 태그가 의도를 더 짧게 전달한다.\n\n---\n\n## 문서의 최소 뼈대\n\n문서는 언어, 문자셋, 뷰포트, 제목을 `head`에 선언한다. `body`에는 페이지 역할을 나눈다.\n\n```html\n\u003c!doctype html\u003e\n\u003chtml lang=\"ko\"\u003e\n  \u003chead\u003e\n    \u003cmeta charset=\"utf-8\" /\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" /\u003e\n    \u003ctitle\u003e페이지 제목\u003c/title\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n    \u003cheader\u003e\n      \u003cp\u003e사이트 이름\u003c/p\u003e\n      \u003cnav aria-label=\"주요\"\u003e\n        \u003ca href=\"/\"\u003e홈\u003c/a\u003e\n        \u003ca href=\"/posts\"\u003e글\u003c/a\u003e\n      \u003c/nav\u003e\n    \u003c/header\u003e\n    \u003cmain\u003e\n      \u003carticle\u003e\n        \u003ch1\u003e글 제목\u003c/h1\u003e\n        \u003csection\u003e\n          \u003ch2\u003e소제목\u003c/h2\u003e\n          \u003cp\u003e본문 문단.\u003c/p\u003e\n        \u003c/section\u003e\n      \u003c/article\u003e\n    \u003c/main\u003e\n    \u003caside\u003e\n      \u003cp\u003e관련 링크\u003c/p\u003e\n    \u003c/aside\u003e\n    \u003cfooter\u003e\n      \u003cp\u003e저작권 표기\u003c/p\u003e\n    \u003c/footer\u003e\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n| 태그 | 역할 |\n|------|------|\n| `header` | 페이지 또는 구역의 머리글 |\n| `nav` | 주요 이동 링크 묶음 |\n| `main` | 그 페이지의 핵심 내용. 문서당 하나 |\n| `article` | 독립해서 옮겨도 의미가 남는 글 |\n| `section` | 제목이 있는 주제 구역 |\n| `aside` | 본문을 보조하는 정보 |\n| `footer` | 페이지 또는 구역의 바닥글 |\n\n`lang`은 실제 언어에 맞춘다. 한국어 페이지면 `ko`이다. 스크린 리더 발음과 SEO(검색 엔진 최적화)에 쓰인다.\n\n제목은 `h1`부터 `h6`까지 계층을 건너뛰지 않는다. `h1` 다음에 바로 `h3`을 두지 않는다. `h1`은 페이지의 주제이고, 보통 하나면 충분하다.\n\n---\n\n## 링크와 버튼\n\n이동이면 `a`를 쓴다. 그 페이지에서 동작을 실행하면 `button`을 쓴다.\n\n```html\n\u003ca href=\"/login\"\u003e로그인 페이지로 이동\u003c/a\u003e\n\u003cbutton type=\"button\"\u003e메뉴 열기\u003c/button\u003e\n\u003cbutton type=\"submit\"\u003e저장\u003c/button\u003e\n```\n\n클릭 가능한 `div`에 `onclick`을 붙이면 키보드와 스크린 리더가 버튼을 인식하지 못한다. `div`로 버튼을 만들지 않는다.\n\n`nav`에는 이동 링크만 둔다. 검색 제출 버튼은 `nav`가 아니라 `form` 안에 둔다.\n\n---\n\n## 이미지와 대체 텍스트\n\n의미 있는 이미지는 무엇을 보여 주는지 `alt`에 적는다. 장식용 이미지는 `alt=\"\"`로 비운다. 스크린 리더가 장식을 읽지 않게 하기 위함이다.\n\n```html\n\u003cimg\n  src=\"/hero.webp\"\n  alt=\"공원에서 산책하는 강아지\"\n  width=\"800\"\n  height=\"450\"\n/\u003e\n\u003cimg src=\"/divider.svg\" alt=\"\" /\u003e\n```\n\n`width`와 `height`를 넣으면 이미지가 로드되기 전에 자리를 잡는다. CLS(누적 레이아웃 이동)가 줄어든다.\n\n아이콘만 있는 링크에는 텍스트 이름을 남긴다. 보이지 않아도 된다.\n\n```html\n\u003ca href=\"/settings\"\u003e\n  \u003cimg src=\"/gear.svg\" alt=\"\" /\u003e\n  \u003cspan class=\"sr-only\"\u003e설정\u003c/span\u003e\n\u003c/a\u003e\n```\n\n---\n\n## 흔한 실수\n\n- `div`를 중첩해 헤더·본문·푸터를 표현한다. 역할 태그로 바꾼다.\n- `main`을 여러 개 둔다. 한 문서에 하나다.\n- 모든 구역을 `section`으로 감싼다. 제목이 있는 주제일 때만 쓴다.\n- 장식 이미지에 `alt=\"이미지\"`처럼 빈 정보를 넣는다. 장식이면 빈 문자열이다.\n- `span`이나 `div`로 제목만 크게 스타일한다. 제목이면 `h1`–`h6`이다.\n\n---\n\n## 정리\n\n시맨틱 HTML은 화면을 꾸미는 단계가 아니다. 문서가 무엇인지를 브라우저와 보조 기술에 선언하는 일이다. 뼈대가 맞으면 CSS와 접근성은 그 위에 얹으면 된다.\n\n---\n\n## 연습\n\n1. 블로그 글 한 편을 `header` / `nav` / `main` / `article` / `footer`만으로 마크업한다. `div`는 쓰지 않는다.\n2. 사이트 로고 이미지와 장식 아이콘 이미지에 각각 알맞은 `alt`를 넣는다.\n3. 기존 페이지에서 `h1`이 몇 개인지, 제목 계층이 건너뛰어졌는지 확인한다.\n"])</script><script>self.__next_f.push([1,"37:T13cf,"])</script><script>self.__next_f.push([1,"# CSS 박스 모델과 display 기초\n\n\u003e 요약: 박스가 content·padding·border·margin으로 어떻게 커지는지와 display가 흐름을 어떻게 바꾸는지 구분해 레이아웃을 계산한다.\n\n---\n\n## 언제 박스 모델을 먼저 보는가\n\nCSS(캐스케이딩 스타일시트)에서 모든 요소는 사각형 박스로 그려진다. 너비가 안 맞거나 간격이 겹치면 장식이 아니라 박스 계산을 의심한다.\n\n레이아웃을 잡기 전에 두 가지만 고정한다. 이 박스의 너비에 padding과 border가 포함되는가. 이 박스는 한 줄을 차지하는가, 글자처럼 흐르는가.\n\n---\n\n## 박스는 네 겹이다\n\n안에서 바깥으로 content, padding, border, margin이다.\n\n```\nmargin          ← 이웃 박스와의 바깥 간격. 배경이 없다\n  border        ← 테두리. width에 포함할지 box-sizing이 정한다\n    padding     ← 내용과 테두리 사이 안쪽 여백\n      content   ← 텍스트·이미지·자식이 들어가는 영역\n```\n\n기본값 `content-box`에서는 `width: 200px`이 content만 200px이다. padding 16px와 border 1px를 더하면 화면에 234px가 된다. 옆 박스가 밀려 난다.\n\n`border-box`면 `width`에 padding과 border가 포함된다. 200px이라고 쓰면 테두리까지 합쳐 200px이다. 계산이 예측 가능하다.\n\n```css\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n```\n\n프로젝트 전역에 이 한 줄을 둔다. 컴포넌트마다 `box-sizing`을 바꾸지 않는다.\n\n---\n\n## display가 흐름을 정한다\n\n`display`는 박스가 이웃과 어떻게 줄을 서는지를 정한다.\n\n| 값 | 동작 | 쓸 때 |\n|----|------|-------|\n| `block` | 가로를 한 줄 차지하고 위아래로 쌓인다 | 문단, 섹션, 카드 |\n| `inline` | 글자처럼 옆에 붙는다. width·height가 거의 안 먹는다 | 문장 속 강조, 링크 |\n| `inline-block` | 옆에 붙으면서 박스 크기를 지정한다 | 뱃지, 작은 버튼 나열 |\n| `none` | 그리지도 않고 자리도 없앤다 | 닫힌 메뉴, 숨긴 영역 |\n| `flex` / `grid` | 자식 배치용 컨텍스트를 연다 | 다음 글에서 다룬다 |\n\n`visibility: hidden`은 안 보이지만 자리는 남긴다. `display: none`은 자리까지 없앤다. 레이아웃이 당겨지면 `none`이고, 자리만 비워 두면 `hidden`이다.\n\n```css\n.badge {\n  display: inline-block;\n  padding: 0.25rem 0.5rem;\n  border: 1px solid #ccc;\n}\n\n.is-closed {\n  display: none;\n}\n```\n\n---\n\n## 카드 한 장으로 계산해 보기\n\n```html\n\u003carticle class=\"card\"\u003e\n  \u003ch2\u003e제목\u003c/h2\u003e\n  \u003cp\u003e본문\u003c/p\u003e\n\u003c/article\u003e\n```\n\n```css\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\n.card {\n  width: 320px;\n  padding: 16px;\n  border: 1px solid #ddd;\n  margin: 16px;\n}\n```\n\n`border-box`이므로 테두리까지 합쳐 가로 320px이다. 바깥으로 16px 간격이 더해진다. `content-box`였다면 padding·border만큼 더 넓어져 옆 카드와 줄이 안 맞는다.\n\n이미지가 부모를 넘치지 않게 하는 최소 리셋이다.\n\n```css\nhtml {\n  line-height: 1.5;\n}\n\nbody {\n  margin: 0;\n}\n\nimg,\nsvg {\n  max-width: 100%;\n  height: auto;\n  display: block;\n}\n```\n\n`body`의 기본 margin을 0으로 두지 않으면 페이지 가장자리에 예상 못 한 여백이 생긴다. `img`를 `block`으로 두면 인라인 이미지 아래 틈이 사라진다.\n\n---\n\n## 세로 margin이 합쳐지는 이유\n\n인접한 block끼리는 위아래 margin이 더해지지 않고 큰 쪽만 남는다. 이를 margin collapse(마진 병합)라고 한다.\n\n부모의 첫 자식 `margin-top`이 부모 밖으로 새어 나가기도 한다. 부모에 padding이나 border를 두면 막힌다. overflow를 `auto`로 두는 방법도 있다.\n\n컴포넌트 사이 간격은 각자 `margin`을 쌓기보다 부모의 `gap`으로 통일하는 편이 덜 겹친다. Flexbox나 Grid에서 `gap`을 쓴다.\n\n---\n\n## 흔한 실수\n\n- `width: 100%`에 padding을 더하고 가로 스크롤이 생긴다. `border-box`인지 확인한다.\n- `inline` 요소에 `width`·`height`를 준다. `inline-block`이나 `block`으로 바꾼다.\n- 숨길 때 `display: none`과 `visibility: hidden`을 혼동한다. 자리가 필요하면 `hidden`이다.\n- 세로 간격이 의도의 절반만 나온다. margin collapse를 의심한다.\n- 전체 태그 리셋으로 `ul`·`button`까지 지운다. 팀이 합의한 최소 세트만 둔다.\n\n---\n\n## 정리\n\n레이아웃 버그의 상당수는 박스 크기와 `display` 오해에서 온다. 먼저 이 박스가 몇 픽셀인지, 한 줄을 차지하는지부터 본다. `border-box`를 전역으로 두고 나면 나머지는 간격과 흐름이다.\n\n---\n\n## 연습\n\n1. 같은 카드에 `content-box`와 `border-box`를 번갈아 적용하고 개발자 도구에서 실제 너비를 비교한다.\n2. `inline` 링크 세 개에 padding을 준 뒤, `inline-block`으로 바꿨을 때 줄 높이가 어떻게 달라지는지 본다.\n3. 부모·자식에 `margin-top: 20px`을 각각 주고, 화면에 40px가 아니라 20px만 생기는지 확인한다.\n"])</script><script>self.__next_f.push([1,"38:T1284,"])</script><script>self.__next_f.push([1,"# Flexbox로 한 줄 레이아웃 잡기\n\n\u003e 요약: 한 줄 또는 한 열로 아이템을 나열할 때 Flexbox로 축·정렬·간격을 맞춰 내비·툴바·카드 액션을 배치한다.\n\n---\n\n## 언제 Flexbox를 쓰는가\n\n한 줄 또는 한 열로 아이템을 나열하고 정렬할 때 Flexbox를 쓴다. 축을 정한 뒤 정렬과 간격만 맞추면 된다.\n\n내비, 툴바, 폼 한 줄, 카드 안의 제목과 버튼이 해당한다. 행과 열을 동시에 설계해야 하면 Grid를 본다. Flex는 1차원 도구이다.\n\n---\n\n## 축을 먼저 정한다\n\n부모에 `display: flex`를 주면 자식이 flex 아이템이 된다. `flex-direction`이 주축이다. 기본값은 `row`(가로). `column`이면 세로가 주축이다.\n\n교차축은 주축에 수직인 방향이다. `row`면 교차축은 세로이다.\n\n| 속성 | 하는 일 |\n|------|---------|\n| `flex-direction` | 주축을 가로로 둘지 세로로 둘지 |\n| `justify-content` | 주축 방향 여백을 어떻게 나눌지 |\n| `align-items` | 교차축에서 아이템을 어디에 붙일지 |\n| `flex-wrap` | 공간 부족 시 다음 줄로 넘길지 |\n| `gap` | 아이템 사이 간격. margin을 아이템마다 주지 않는다 |\n\n`justify-content: space-between`은 양 끝을 붙이고 남는 가로 여백을 사이에 넣는다. `center`는 남는 여백을 양쪽에 균등히 둔다. `flex-start`는 여백을 끝으로 몰고 아이템을 시작점에 붙인다.\n\n`align-items: center`는 세로(교차축) 가운데에 맞춘다. 높이가 다른 아이콘과 텍스트를 한 줄에 둘 때 자주 쓴다.\n\n---\n\n## 툴바 예제\n\n왼쪽은 제목, 오른쪽은 버튼 두 개이다. 세로로는 가운데 맞춘다.\n\n```html\n\u003cdiv class=\"bar\"\u003e\n  \u003ch1 class=\"bar__title\"\u003e설정\u003c/h1\u003e\n  \u003cdiv class=\"bar__actions\"\u003e\n    \u003cbutton type=\"button\"\u003e취소\u003c/button\u003e\n    \u003cbutton type=\"submit\"\u003e저장\u003c/button\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n```\n\n```css\n.bar {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n}\n\n.bar__actions {\n  display: flex;\n  gap: 8px;\n}\n```\n\n아이템을 한쪽으로 몰고 나머지를 밀어내려면 `margin-left: auto`를 쓴다. `justify-content`로 전체를 나누지 않아도 된다.\n\n```css\n.bar {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n\n.bar__actions {\n  margin-left: auto;\n  display: flex;\n  gap: 8px;\n}\n```\n\n가운데 정렬 한 박스이다.\n\n```css\n.center {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  min-height: 100dvh;\n}\n```\n\n---\n\n## 아이템이 늘어나고 줄어드는 방식\n\n아이템 쪽 속성은 `flex-grow`, `flex-shrink`, `flex-basis`이다. 단축은 `flex`이다.\n\n```css\n.grow {\n  flex: 1 1 auto;\n}\n\n.fixed {\n  flex: 0 0 240px;\n}\n```\n\n| 값 | 의미 |\n|----|------|\n| `flex-grow` | 남는 공간을 얼마나 가져갈지. `1`이면 남는 폭을 나눠 가진다 |\n| `flex-shrink` | 공간이 부족할 때 얼마나 줄어들지. `0`이면 줄어들지 않는다 |\n| `flex-basis` | 배치 전 기본 크기. `240px`이면 그 너비를 먼저 잡는다 |\n\n검색창은 늘어나고 버튼은 고정인 한 줄이다.\n\n```html\n\u003cform class=\"search\"\u003e\n  \u003cinput class=\"search__input\" type=\"search\" name=\"q\" /\u003e\n  \u003cbutton type=\"submit\"\u003e검색\u003c/button\u003e\n\u003c/form\u003e\n```\n\n```css\n.search {\n  display: flex;\n  gap: 8px;\n}\n\n.search__input {\n  flex: 1 1 auto;\n  min-width: 0;\n}\n```\n\n텍스트나 입력창이 부모를 뚫고 나가면 자식에 `min-width: 0`을 준다. Flex 아이템의 최소 너비 기본값이 내용 너비라서 그렇다.\n\n---\n\n## 흔한 실수\n\n- 2차원 페이지 골격을 Flex로 짠다. 행과 열이 같이 필요하면 Grid이다.\n- `justify-content`와 `align-items`를 바꿔 쓴다. 주축 여백이 `justify`, 교차축 붙임이 `align`이다.\n- 아이템마다 `margin-right`로 간격을 준다. 부모 `gap`으로 통일한다.\n- 긴 제목이 옆 버튼을 밀어 낸다. 제목에 `min-width: 0`과 `overflow: hidden`을 검토한다.\n- `flex: 1`만 쓰고 basis를 잊는다. 고정 폭이 필요하면 `flex: 0 0 240px`처럼 명시한다.\n\n---\n\n## 정리\n\nFlex는 만능 그리드가 아니다. 한 줄 또는 한 열에서 여백을 나누는 도구이다. 주축을 정하고, `justify-content`로 그 방향 여백을 나누고, `align-items`와 `gap`으로 나머지 맞추면 된다.\n\n---\n\n## 연습\n\n1. 로고·링크 묶음·로그인 버튼이 있는 헤더를 Flex로 만든다. 링크는 왼쪽에 붙이고 버튼만 오른쪽으로 민다.\n2. `flex-direction: column`인 사이드바에서 `justify-content`를 바꿔 가며 항목이 어디에 붙는지 확인한다.\n3. Flex 행 안의 긴 파일명을 `text-overflow: ellipsis`로 자르되, 잘리지 않으면 `min-width: 0`을 추가한다.\n"])</script><script>self.__next_f.push([1,"39:T1215,"])</script><script>self.__next_f.push([1,"# CSS Grid로 행과 열 동시에 잡기\n\n\u003e 요약: 행과 열을 함께 정해야 할 때 Grid로 페이지 골격과 카드 목록을 만들고, fr·영역 이름으로 칸을 나눈다.\n\n---\n\n## 언제 Grid를 쓰는가\n\n행과 열을 동시에 제어할 때 Grid를 쓴다. 대시보드, 갤러리, 헤더·사이드·본문이 있는 페이지 골격이 해당한다.\n\n한 줄 정렬만 필요하면 Flexbox면 된다. 카드 바깥 칸은 Grid, 카드 안 제목·버튼 정렬은 Flex로 나누면 역할이 섞이지 않는다.\n\n---\n\n## 트랙이 칸의 크기이다\n\n부모에 `display: grid`를 주면 자식이 칸에 들어간다. `grid-template-columns`가 열, `grid-template-rows`가 행이다. 이 선을 트랙이라고 한다.\n\n```css\n.page {\n  display: grid;\n  grid-template-columns: 240px 1fr;\n  grid-template-rows: auto 1fr auto;\n  min-height: 100dvh;\n  gap: 1rem;\n}\n```\n\n왼쪽 열은 240px로 고정이다. 오른쪽 열은 `1fr`이라서 남은 가로를 모두 가져간다. 행은 헤더·푸터 높이만큼 `auto`, 본문 행은 남은 세로를 가져간다.\n\n| 단위 | 하는 일 |\n|------|---------|\n| `fr` | 남은 공간을 비율로 나눈다. `1fr 2fr`이면 1:2 |\n| `minmax(0, 1fr)` | fr 칸이 내용 때문에 넘치지 않게 하한을 0으로 둔다 |\n| `auto` | 내용 높이나 너비에 맞춘다 |\n| `repeat(auto-fit, minmax(16rem, 1fr))` | 폭에 따라 열 개수를 늘린다 |\n\n`minmax(0, 1fr)`을 쓰는 이유는 Flex의 `min-width: 0`과 같다. 그리드 칸의 최소 크기가 내용 너비면 가로 스크롤이 생긴다.\n\n---\n\n## 반응형 카드 그리드\n\n열 개수를 미디어 쿼리로 일일이 바꾸지 않아도 된다. 칸의 최소 너비만 정하면 브라우저가 열 수를 맞춘다.\n\n```html\n\u003cul class=\"cards\"\u003e\n  \u003cli\u003e카드 1\u003c/li\u003e\n  \u003cli\u003e카드 2\u003c/li\u003e\n  \u003cli\u003e카드 3\u003c/li\u003e\n\u003c/ul\u003e\n```\n\n```css\n.cards {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));\n  gap: 1rem;\n}\n```\n\n`auto-fit`은 빈 열을 접는다. `auto-fill`은 빈 열을 남겨 둔다. 카드가 적을 때 칸이 늘어나길 원하면 `auto-fit`이다.\n\n---\n\n## 이름 있는 영역으로 배치\n\n칸 좌표 대신 영역 이름을 붙이면 미디어 쿼리에서 재배치하기 쉽다.\n\n```html\n\u003cdiv class=\"layout\"\u003e\n  \u003cheader class=\"header\"\u003e헤더\u003c/header\u003e\n  \u003cnav class=\"nav\"\u003e내비\u003c/nav\u003e\n  \u003cmain class=\"main\"\u003e본문\u003c/main\u003e\n  \u003cfooter class=\"footer\"\u003e푸터\u003c/footer\u003e\n\u003c/div\u003e\n```\n\n```css\n.layout {\n  display: grid;\n  grid-template-columns: 12rem 1fr;\n  grid-template-areas:\n    \"header header\"\n    \"nav    main\"\n    \"footer footer\";\n  min-height: 100dvh;\n}\n\n.header { grid-area: header; }\n.nav    { grid-area: nav; }\n.main   { grid-area: main; }\n.footer { grid-area: footer; }\n\n@media (max-width: 640px) {\n  .layout {\n    grid-template-columns: 1fr;\n    grid-template-areas:\n      \"header\"\n      \"main\"\n      \"nav\"\n      \"footer\";\n  }\n}\n```\n\n좁은 화면에서 내비를 본문 아래로 내리는 변경이 문자열 한 덩어리로 끝난다. `grid-column: 1 / 3` 같은 숫자 좌표보다 읽기 쉽다.\n\n---\n\n## Flex와 나누는 기준\n\n| | Flex | Grid |\n|--|------|------|\n| 차원 | 한 방향 | 행과 열 |\n| 강점 | 주축 여백 나누기, 아이템 늘리기 | 트랙 크기, 영역, 겹침 |\n| 함께 쓰는 예 | 카드 안 헤더와 버튼 | 카드가 올라가는 바깥 칸 |\n\n페이지 골격은 Grid, 컴포넌트 내부 한 줄은 Flex이다. 둘 다 `gap`으로 간격을 준다.\n\n---\n\n## 흔한 실수\n\n- 한 줄 툴바를 Grid로 짠다. Flex가 짧다.\n- `1fr` 칸에서 긴 코드 블록이 페이지를 밀어 낸다. 그 열을 `minmax(0, 1fr)`로 바꾼다.\n- `auto-fit`과 `auto-fill`을 구분하지 않는다. 카드가 적을 때 칸이 커지길 원하면 `auto-fit`이다.\n- 자식 순서만 바꾸고 영역 이름을 안 쓴다. 반응형 재배치는 `grid-template-areas`가 덜 깨진다.\n- Grid와 Flex에 아이템 `margin`을 섞는다. 부모 `gap`으로 통일한다.\n\n---\n\n## 정리\n\nGrid는 행과 열의 선을 먼저 긋는 도구이다. 페이지 뼈대는 트랙과 영역 이름으로 두고, 칸 안의 정렬은 Flex에 맡긴다. `fr`과 `minmax(0, 1fr)`만 익혀도 넘침의 상당수는 줄어든다.\n\n---\n\n## 연습\n\n1. 헤더·사이드바·본문·푸터를 `grid-template-areas`로 만들고, 640px 이하에서 사이드바를 본문 아래로 옮긴다.\n2. 카드 목록을 `repeat(auto-fit, minmax(16rem, 1fr))`로 두고 창 폭을 줄여 열 수가 바뀌는지 확인한다.\n3. `1fr` 열 안에 긴 URL을 넣고, `minmax(0, 1fr)` 전후에 가로 스크롤이 생기는지 비교한다.\n"])</script><script>self.__next_f.push([1,"3a:T1244,"])</script><script>self.__next_f.push([1,"# 반응형 디자인과 미디어 쿼리\n\n\u003e 요약: 좁은 화면을 기본으로 두고, 레이아웃이 깨지는 폭에서만 미디어 쿼리와 clamp로 넓은 화면에 맞춘다.\n\n---\n\n## 언제 반응형을 처음부터 넣는가\n\n화면 폭이 달라져도 같은 HTML을 쓰는 페이지면 반응형이 필요하다. 폰, 태블릿, 데스크톱을 따로 만들지 않는다.\n\n좁은 화면 스타일을 기본으로 둔다. 넓어질 때만 규칙을 추가한다. 이를 모바일 우선이라고 한다. 데스크톱을 먼저 짜고 `max-width`로 깎으면 예외가 쌓인다.\n\n---\n\n## 모바일 우선 미디어 쿼리\n\n`@media`는 조건이 맞을 때만 그 안의 CSS가 적용된다. `min-width`는 “이 폭 이상이면”이다.\n\n```css\n.nav {\n  display: none;\n}\n\n.nav-toggle {\n  display: block;\n}\n\n@media (min-width: 768px) {\n  .nav {\n    display: flex;\n  }\n\n  .nav-toggle {\n    display: none;\n  }\n}\n```\n\n768px 미만에서는 햄버거만 보인다. 그 이상에서는 가로 내비가 보인다. 기본 상태가 좁은 화면이다.\n\n---\n\n## 브레이크포인트는 기기가 아니라 레이아웃이다\n\n기기 목록(아이폰, 아이패드)을 쫓지 않는다. 실제 레이아웃이 답답해지거나 한 줄이 깨지는 폭에 끊는다.\n\n팀에서 쓰는 지점은 소수면 된다.\n\n| 이름 | 예 | 이 폭에서 하는 일 |\n|------|----|-------------------|\n| sm | 640px | 카드가 2열로 서기 시작 |\n| md | 768px | 가로 내비, 사이드바 |\n| lg | 1024px | 넓은 본문, 다열 대시보드 |\n\n값은 프로젝트마다 달라도 된다. 중요한 것은 이름과 값을 한곳에 모아 두는 일이다. 컴포넌트마다 737px, 769px처럼 비슷한 숫자를 흩뿌리지 않는다.\n\n---\n\n## 폭에 따라 커지는 단위\n\n미디어 쿼리 없이도 폭에 맞춰지는 값이 있다. 컨테이너 너비와 제목 크기가 대표이다.\n\n```css\n.container {\n  width: min(100% - 2rem, 72rem);\n  margin-inline: auto;\n}\n\n.title {\n  font-size: clamp(1.5rem, 1rem + 2vw, 2.5rem);\n}\n```\n\n`min(100% - 2rem, 72rem)`은 양쪽 1rem 여백을 남기되, 72rem을 넘지 않는다. 가운데 정렬은 `margin-inline: auto`이다.\n\n`clamp(최소, 선호, 최대)`는 글자 크기를 화면 폭에 따라 움직이되 한계를 넘지 않는다. `2vw`만 쓰면 큰 모니터에서 제목이 과하게 커진다.\n\n| 단위 | 기준 |\n|------|------|\n| `%` | 부모 너비 |\n| `vw` | 뷰포트 가로의 1% |\n| `rem` | 루트 글자 크기. 사용자 확대에 따라 변한다 |\n| `clamp()` | 최소·선호·최대를 한 값으로 |\n\n고정 `px`를 남발하면 확대와 좁은 화면에서 깨진다. 한계가 있는 유동 값이 더 안전하다.\n\n---\n\n## 이미지와 터치\n\n큰 히어로를 모든 기기에 같은 파일로 주지 않는다. `srcset`과 `sizes`로 폭에 맞는 파일을 고른다.\n\n```html\n\u003cimg\n  src=\"/hero-800.webp\"\n  srcset=\"/hero-800.webp 800w, /hero-1600.webp 1600w\"\n  sizes=\"(min-width: 72rem) 72rem, 100vw\"\n  alt=\"작업 공간 전경\"\n  width=\"1600\"\n  height=\"900\"\n/\u003e\n```\n\n터치 대상은 대략 44px 전후가 필요하다. 작은 아이콘만 있는 버튼은 padding을 늘린다.\n\n호버로만 열리는 정보는 터치에서 도달할 수 없다. 호버 효과는 마우스가 있는 환경에만 둔다.\n\n```css\n@media (hover: hover) and (pointer: fine) {\n  .card:hover {\n    transform: translateY(-2px);\n  }\n}\n```\n\n---\n\n## 흔한 실수\n\n- 데스크톱 레이아웃을 기본으로 두고 `max-width`로 모바일만 예외 처리한다. 기본을 좁은 화면으로 뒤집는다.\n- 브레이크포인트를 기기 이름에 맞춘다. 레이아웃이 깨지는 폭에 둔다.\n- `font-size: 3vw`처럼 상한 없이 키운다. `clamp`로 최대를 둔다.\n- 컨테이너를 `width: 100%`만 주고 좌우 여백이 없다. `min(100% - gutter, max)`를 쓴다.\n- 호버 툴팁만으로 설명을 제공한다. 클릭이나 항상 보이는 텍스트를 남긴다.\n\n---\n\n## 정리\n\n반응형은 미디어 쿼리 개수가 아니다. 좁은 화면을 기본으로 두고, 레이아웃이 실제로 바뀌는 지점만 확장하면 된다. 컨테이너와 글자 크기는 `min`·`clamp`로 한계를 정한 뒤, 쿼리로는 내비·열 수처럼 구조가 바뀌는 것만 다룬다.\n\n---\n\n## 연습\n\n1. 좁은 화면에서 세로로 쌓인 카드를 `min-width: 640px`에서 2열 Grid로 바꾸되, 기본 CSS에는 1열만 둔다.\n2. `.container`를 `min(100% - 2rem, 72rem)`으로 두고 창을 넓혀 72rem에서 멈추는지 확인한다.\n3. 제목에 `clamp`를 적용하고, 브라우저 최소·최대 폭에서 글자 크기가 한계를 넘지 않는지 본다.\n"])</script><script>self.__next_f.push([1,"3b:T12ca,"])</script><script>self.__next_f.push([1,"# 타이포·색·CSS 변수로 디자인 토큰 잡기\n\n\u003e 요약: 글자 크기·행간·색을 CSS 변수로 이름 붙여 두고, 컴포넌트는 그 이름만 참조하여 화면을 일관되게 만든다.\n\n---\n\n## 언제 토큰을 만드는가\n\n페이지마다 `font-size: 15px`, `#333`, `margin: 13px`가 섞이면 다음 화면을 그릴 때마다 값이 흔들린다. 반복되는 값에 이름을 붙인 것이 디자인 토큰이다.\n\nCSS 변수(커스텀 프로퍼티)로 토큰을 두면 테마 전환과 간격 통일이 한곳 수정으로 끝난다. 컴포넌트 파일에 raw hex를 직접 쓰지 않는다.\n\n---\n\n## 본문이 읽히는 타이포\n\n본문은 16px 전후(`1rem`)에서 시작한다. 행간은 1.5 전후이다. 줄이 너무 길면 눈이 줄을 잃는다. 한 줄은 대략 45–75자가 읽기 쉽다.\n\n```css\n:root {\n  --font-sans: \"Pretendard\", system-ui, sans-serif;\n  --text-body: 1rem;\n  --text-sm: 0.875rem;\n  --text-lg: 1.25rem;\n  --leading: 1.6;\n}\n\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--text-body);\n  line-height: var(--leading);\n}\n\n.lead {\n  font-size: var(--text-lg);\n  max-width: 40rem;\n}\n```\n\n제목 단계를 너무 많이 두지 않는다. `h1`–`h3` 정도로 시작하고, 같은 역할이면 같은 크기를 쓴다. 본문보다 작은 글자는 캡션·보조 설명에만 쓴다.\n\n시스템 폰트 스택을 뒤에 두면 웹폰트 로드 전에도 글자가 보인다. `\"Pretendard\"`만 단독으로 두지 않는다.\n\n---\n\n## 색은 대비가 역할이다\n\n배경과 본문 글자의 밝기 차이가 커야 읽힌다. WCAG(웹 콘텐츠 접근성 지침) AA를 목표로 하면 본문은 대비율 4.5:1 전후가 필요하다. 브라우저 확장이나 개발자 도구로 한 번 잰다.\n\n브랜드 초록을 본문 색으로 쓰지 않는다. 브랜드 색은 링크·버튼 같은 강조에 둔다. 본문은 거의 검정에 가까운 중립색이다.\n\n성공·오류를 색만으로 알리지 않는다. 아이콘이나 “저장됨”, “필수 항목” 텍스트를 같이 둔다. 색각 차이와 흑백 인쇄에서도 의미가 남아야 한다.\n\n```css\n:root {\n  --color-bg: #f7f7f5;\n  --color-text: #1a1a1a;\n  --color-muted: #5c5c5c;\n  --color-accent: #0b6e4f;\n  --color-danger: #b42318;\n}\n\n.button-primary {\n  background: var(--color-accent);\n  color: #fff;\n}\n\n.error {\n  color: var(--color-danger);\n}\n```\n\n`.error` 옆에는 반드시 문구가 있다. 빨간 테두리만으로 끝내지 않는다.\n\n---\n\n## 변수로 테마를 바꾼다\n\n`:root`에 토큰을 모은다. 다크 모드는 같은 이름에 값만 바꾼다. 컴포넌트는 `var(--color-bg)`만 보면 된다.\n\n```css\n:root {\n  --color-bg: #f7f7f5;\n  --color-text: #1a1a1a;\n  --color-accent: #0b6e4f;\n  --space-2: 0.5rem;\n  --space-4: 1rem;\n  --space-6: 1.5rem;\n  --radius: 8px;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root {\n    --color-bg: #121212;\n    --color-text: #f2f2f2;\n  }\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n}\n\n.card {\n  padding: var(--space-4);\n  border-radius: var(--radius);\n}\n```\n\n컴포넌트에 `#121212`를 다시 적으면 다크 모드가 빠지기 쉽다. 색이 필요하면 토큰을 추가하고 이름만 참조한다.\n\n인라인 스타일이나 유틸 클래스에 hex를 흩뿌리는 것도 같은 문제이다. 토큰 이름과 유틸 이름을 대응시킨다.\n\n---\n\n## 간격도 스케일로 제한한다\n\n`4 / 8 / 12 / 16 / 24 / 32`(px)처럼 쓸 수 있는 칸을 정해 둔다. `--space-2`, `--space-4`가 그 칸이다.\n\n임의 `13px`, `17px`가 늘수록 카드마다 숨이 달라 보인다. 새 간격이 필요하면 스케일에 단계를 추가할지 먼저 정한다.\n\n---\n\n## 흔한 실수\n\n- 본문 색을 브랜드 색으로 둔다. 본문은 중립, 강조만 브랜드이다.\n- 버튼마다 `#0b6e4f`를 직접 쓴다. `--color-accent`로 올린다.\n- 제목 크기를 페이지마다 다르게 잡는다. `--text-lg` 같은 단계를 재사용한다.\n- 다크 모드에서 배경만 바꾸고 테두리·muted 텍스트를 그대로 둔다. 같이 쓰는 토큰도 덮는다.\n- 오류를 빨간 테두리만으로 표시한다. 텍스트를 입력 근처에 둔다.\n\n---\n\n## 정리\n\n한 페이지를 예쁘게 만드는 값보다, 다음 페이지가 같은 이름을 쓰게 하는 값이 유지비용을 낮춘다. 글자·색·간격에 이름을 붙이고 컴포넌트는 그 이름만 참조하면 된다.\n\n---\n\n## 연습\n\n1. `:root`에 본문 색·배경·강조색·행간을 변수로 옮기고, `body`와 버튼에서 hex를 제거한다.\n2. `prefers-color-scheme: dark`에서 배경과 본문 색만 바꿔 카드가 따라오는지 확인한다.\n3. 카드 padding을 `13px` 대신 `--space-4`로 바꾸고, 다른 카드도 같은 변수를 쓰게 한다.\n"])</script><script>self.__next_f.push([1,"3c:T1395,"])</script><script>self.__next_f.push([1,"# 폼·포커스·접근성 기본\n\n\u003e 요약: label 연결, 보이는 포커스, 네이티브 컨트롤로 키보드와 스크린 리더가 쓸 수 있는 폼을 만든다.\n\n---\n\n## 언제 이 기준을 적용하는가\n\n입력·버튼·메뉴가 있는 화면은 마우스만 전제로 두지 않는다. Tab으로 이동하고, Enter·Space로 실행하고, 스크린 리더가 이름을 읽어야 한다.\n\n접근성은 배포 직전 덧칠이 아니다. `label`과 `button`을 처음부터 올바르게 쓰면 대부분의 기본선은 채워진다. ARIA(접근 가능한 리치 인터넷 애플리케이션)는 네이티브 태그가 부족한 곳에만 보탠다.\n\n---\n\n## 폼의 최소 규칙\n\n모든 입력에는 보이는 레이블이 있다. `placeholder`는 힌트이지 레이블이 아니다.\n\n```html\n\u003cform action=\"/signup\" method=\"post\"\u003e\n  \u003clabel for=\"email\"\u003e이메일\u003c/label\u003e\n  \u003cinput\n    id=\"email\"\n    name=\"email\"\n    type=\"email\"\n    autocomplete=\"email\"\n    required\n  /\u003e\n  \u003cp id=\"email-error\" class=\"error\" hidden\u003e올바른 이메일을 입력한다.\u003c/p\u003e\n\n  \u003cbutton type=\"submit\"\u003e가입\u003c/button\u003e\n\u003c/form\u003e\n```\n\n`label`의 `for`와 `input`의 `id`가 같아야 클릭이 입력으로 연결된다. `name`은 서버로 나가는 필드 이름이다.\n\n에러는 입력 바로 아래에 텍스트로 둔다. 테두리 색만 바꾸면 스크린 리더와 색각 사용자에게 전달되지 않는다. 에러를 보여줄 때 `aria-describedby=\"email-error\"`로 입력과 문구를 잇는다.\n\n아이콘만 있는 버튼에는 접근 가능한 이름을 준다.\n\n```html\n\u003cbutton type=\"button\" aria-label=\"검색\"\u003e\n  \u003csvg aria-hidden=\"true\"\u003e…\u003c/svg\u003e\n\u003c/button\u003e\n```\n\n장식 아이콘은 `aria-hidden=\"true\"`이다. 스크린 리더가 아이콘 파일명을 읽지 않게 한다.\n\n`div`로 만든 가짜 체크박스는 키보드·역할·상태를 직접 구현해야 한다. 네이티브 `input type=\"checkbox\"`를 먼저 쓴다.\n\n---\n\n## 포커스가 보여야 한다\n\n키보드로 이동 중일 때 지금 어디인지 보여 줘야 한다. `outline: none`만 남기고 대체 스타일을 안 주면 Tab 사용자는 위치를 잃는다.\n\n```css\n:focus-visible {\n  outline: 2px solid var(--color-accent);\n  outline-offset: 2px;\n}\n```\n\n`:focus-visible`은 키보드 포커스에 가깝다. 마우스 클릭마다 두꺼운 테두리가 생기는 것을 피하면서, Tab 이동에는 윤곽을 남긴다.\n\n커스텀 포커스를 디자인하더라도 대비가 되는 선이나 배경이 있어야 한다. 색 차이만 2%인 테두리는 포커스가 아니다.\n\n---\n\n## 상태와 오버레이\n\n네이티브로 부족한 위젯에만 ARIA를 붙인다.\n\n| 상황 | 하는 일 |\n|------|---------|\n| 펼침 메뉴 | 트리거 버튼에 `aria-expanded=\"true\\|false\"` |\n| 모달 | 열릴 때 포커스를 모달로 옮기고, `Esc`로 닫고, 바깥은 클릭·Tab으로 빠져나가지 못하게 한다 |\n| 필수 | `required`와 시각 표시(별표+텍스트)를 같이 둔다 |\n| 로딩 버튼 | `disabled`와 “저장 중” 같은 상태 텍스트 |\n\n```html\n\u003cbutton type=\"button\" aria-expanded=\"false\" aria-controls=\"menu\"\u003e\n  메뉴\n\u003c/button\u003e\n\u003cul id=\"menu\" hidden\u003e\n  \u003cli\u003e\u003ca href=\"/profile\"\u003e프로필\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n```\n\n모달을 `div`로만 띄우면 뒤 페이지가 그대로 Tab 순회에 남는다. 포커스 트랩과 닫기 버튼을 같이 구현한다.\n\n---\n\n## 움직임과 대비\n\n애니메이션이 불편한 사용자를 위해 시스템 설정을 존중한다.\n\n```css\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n  *::after {\n    animation: none !important;\n    transition: none !important;\n  }\n}\n```\n\n색 대비와 텍스트 확대(200% 전후)를 실제 브라우저에서 한 번 확인한다. 확대 시 버튼이 잘리거나 가로 스크롤만 생기면 레이아웃을 고친다.\n\n---\n\n## 흔한 실수\n\n- `placeholder=\"이메일\"`만 두고 `label`을 생략한다. 값이 채워지면 이름이 사라진다.\n- `outline: none`만 넣고 포커스 대체 스타일이 없다.\n- 클릭 가능한 `div`로 체크박스·탭을 만든다. 네이티브 또는 역할·키보드를 모두 구현해야 한다.\n- 오류를 `alert()`나 토스트만으로 보여 주고 입력 옆 문구가 없다.\n- `aria-label`을 보이는 텍스트와 다르게 적어 스크린 리더와 화면이 어긋난다.\n\n---\n\n## 정리\n\n접근성의 상당수는 HTML을 역할에 맞게 쓰는 습관이다. 레이블을 연결하고, 포커스를 보이게 하고, 네이티브 컨트롤을 우선하면 된다. ARIA는 그다음에 필요한 칸만 채운다.\n\n---\n\n## 연습\n\n1. 로그인 폼을 `label for`·`id`로 연결하고, 잘못된 비밀번호 오류를 입력 아래 텍스트로 보여 준다.\n2. 사이트 전역에서 `outline: none`을 검색한 뒤, 있으면 `:focus-visible` 스타일로 대체한다.\n3. 키보드만으로 헤더 내비 → 본문 링크 → 푸터까지 이동되는지 확인하고, 막히는 커스텀 위젯을 목록으로 적는다.\n"])</script><script>self.__next_f.push([1,"3d:T1393,"])</script><script>self.__next_f.push([1,"# HTML/CSS 실무 체크리스트\n\n\u003e 요약: 페이지를 내보내기 전에 시맨틱·박스·레이아웃·반응형·토큰·포커스를 한 번씩 확인한다.\n\n---\n\n## 언제 이 목록을 보는가\n\n기능은 됐는데 모바일에서 가로 스크롤이 나거나, Tab으로 버튼을 못 찾거나, 제목이 `div`인 페이지에 쓴다. 앞 글에서 다룬 규칙을 한 화면에서 다시 통과시키려는 목록이다.\n\n새 페이지를 열기 전과 리뷰 직전에 같은 순서로 훑는다. 항목마다 “왜”가 붙어 있다. 체크만 하고 이유를 건너뛰면 다음 페이지에서 같은 실수가 반복된다.\n\n---\n\n## 1. HTML 뼈대\n\n- [ ] `html`에 `lang`을 실제 언어로 둔다. 스크린 리더 발음과 번역 힌트가 여기서 갈린다.\n- [ ] `charset`과 `viewport` 메타가 있다. 없으면 한글이 깨지거나 모바일에서 화면이 축소되지 않는다.\n- [ ] 페이지 `h1`은 하나이고 제목은 계층을 건너뛰지 않는다. 문서 목차가 스크린 리더 탐색 경로이다.\n- [ ] `main`은 문서당 하나이다. 반복 헤더·내비와 본문을 구분한다.\n- [ ] 이동은 `a`, 동작은 `button`이다. 클릭 가능한 `div`는 키보드 초점에서 빠진다.\n- [ ] 의미 있는 이미지에 구체적 `alt`를 두고, 장식은 `alt=\"\"`이다. 빈 `alt=\"이미지\"`는 소음이다.\n- [ ] `img`에 `width`·`height`(또는 동등한 aspect-ratio)를 둔다. 로드 전 자리 붕괴(CLS, 누적 레이아웃 이동)를 줄인다.\n- [ ] 폼 입력은 `label`의 `for`와 `id`가 연결된다. `placeholder`만으로는 이름이 남지 않는다.\n\n---\n\n## 2. 박스와 레이아웃\n\n- [ ] 전역 `box-sizing: border-box`이다. `width`에 padding·border가 포함되어야 칸이 안 넘친다.\n- [ ] 한 줄·한 열 정렬은 Flex, 행과 열을 함께 정할 때는 Grid이다. 역할을 섞으면 예외 CSS가 는다.\n- [ ] 아이템 간격은 부모 `gap`으로 통일한다. 자식 `margin`이 겹치면 세로 간격이 의도와 달라진다.\n- [ ] Grid 열 넘침은 `minmax(0, 1fr)`, Flex 자식 넘침은 `min-width: 0`을 검토한다. 기본 최소 너비가 내용 크기이기 때문이다.\n- [ ] 본문 폭은 `min(100% - gutter, max)`처럼 상한을 둔다. `width: 100%`만 있으면 좌우 여백이 사라진다.\n\n---\n\n## 3. 반응형·시각\n\n- [ ] 좁은 화면 스타일이 기본이고, `min-width`로만 확장한다. 데스크톱을 깎아 모바일 예외를 만들면 분기가 쌓인다.\n- [ ] 브레이크포인트는 기기 이름이 아니라 레이아웃이 깨지는 폭이다. 비슷한 px가 파일마다 흩어지지 않게 한다.\n- [ ] 제목 크기에 상한이 있는지 본다. `vw`만 쓰면 넓은 모니터에서 제목이 과해진다. `clamp`를 검토한다.\n- [ ] 색·간격·글자는 CSS 변수(토큰)를 참조한다. 컴포넌트 hex가 흩어지면 다크 모드와 리브랜딩이 빠진다.\n- [ ] 본문과 배경 대비를 확인한다. 브랜드 색을 본문 색으로 쓰지 않는다.\n- [ ] 호버 전용 정보가 터치에서도 열리는지 본다. `hover: hover` 미디어로 장식 호버만 제한한다.\n\n---\n\n## 4. 접근성·품질\n\n- [ ] `:focus-visible` 윤곽이 있다. `outline: none`만 남기면 Tab 위치를 잃는다.\n- [ ] 키보드만으로 주요 흐름(내비, 폼 제출, 모달 닫기)이 가능하다. 커스텀 위젯은 Tab·Enter·Esc를 직접 확인한다.\n- [ ] 오류·성공은 색 옆 텍스트가 있다. 스크린 리더와 색각 사용자에게 색만으로는 부족하다.\n- [ ] `prefers-reduced-motion`에서 장식 애니메이션을 끈다. 전정기관 부담과 집중 방해를 줄인다.\n- [ ] 아이콘 단독 버튼에 `aria-label`(또는 보이는 텍스트)이 있다. 장식 SVG는 `aria-hidden=\"true\"`이다.\n- [ ] 불필요한 `!important`와 과한 특이도를 줄인다. 다음 수정이 덮이지 않는 쪽이 기본선이다.\n\n---\n\n## 5. 새 CSS 기능(필요할 때만)\n\n새 문법은 지원 범위와 팀 합의 후에 넣는다. 없어도 체크리스트 1–4를 통과하면 페이지는 내보낼 수 있다.\n\n| 기능 | 쓰는 상황 |\n|------|-----------|\n| Container Queries | 뷰포트가 아니라 컴포넌트 폭에 따라 카드 레이아웃을 바꿀 때 |\n| `:has()` | 자식 상태(체크됨, 에러)에 따라 부모 카드 스타일을 바꿀 때 |\n| cascade layers | 라이브러리 CSS와 앱 CSS의 우선순위를 층으로 나눌 때 |\n| `color-mix()` | 토큰 색에서 hover·disabled 파생색을 계산할 때 |\n\n도입 전에 대상 브라우저에서 한 번씩 렌더를 확인한다. 폴백이 없으면 핵심 레이아웃에 쓰지 않는다.\n\n---\n\n## 정리\n\nHTML/CSS 기본선은 트릭 목록이 아니다. 뼈대 태그, 박스 계산, 한 방향 Flex와 두 방향 Grid, 좁은 화면 기본, 이름 붙은 토큰, 보이는 포커스가 반복해서 통과하는지가 품질이다. 위 항목을 페이지마다 같은 순서로 훑으면 된다.\n"])</script><script>self.__next_f.push([1,"3e:T185c,"])</script><script>self.__next_f.push([1,"# Laravel 11+와 PHP 시작하기\n\n\u003e 요약: Laravel 11부터는 Kernel 대신 bootstrap/app.php가 앱의 중심이고, PHP 8.2 이상으로 프로젝트를 세팅한다.\n\n---\n\n## 1. Laravel이란, 왜 11+인가\n\n**Laravel**은 PHP로 웹 앱과 API를 만드는 프레임워크다. 라우팅·DB·인증·큐처럼 반복되는 뼈대를 대신 제공해서, 도메인 코드에 시간을 쓰게 한다.\n\n11부터는 **골격은 얇게, 기능은 필요할 때 패키지로** 가는 방향이다. 예전처럼 Kernel과 설정 파일이 잔뜩 깔려 있지 않다.\n\n| 항목 | Laravel 8~10 | Laravel 11+ |\n|------|--------------|-------------|\n| 앱 구성 | `Http/Kernel`, `RouteServiceProvider` | **`bootstrap/app.php`** |\n| PHP | 8.0~8.1도 가능 | **8.2+** (8.3 권장) |\n| 미들웨어 | Kernel에 배열 등록 | `withMiddleware` / 별칭 |\n| 테스트 | PHPUnit 기본 | **Pest**를 쓰는 팀이 많음 |\n\n실무 기본선은 **PHP 8.3 + Laravel 11/12 + Composer 2**다.\n\n---\n\n## 2. 설치\n\n```bash\ncomposer create-project laravel/laravel demo\n# 또는\nlaravel new demo\n\ncd demo\ncp .env.example .env\nphp artisan key:generate\nphp artisan serve\n```\n\n필요한 것: PHP 8.2+, Composer, DB(SQLite/MySQL/PostgreSQL). 프론트를 빌드하면 Node도 필요하다.\n\n로컬을 Docker로 맞출 때는 **Sail**(공식 Docker 구성)을 쓴다. 운영 이미지로 그대로 쓰지 않는 편이 안전하다.\n\n```bash\nphp artisan sail:install\n./vendor/bin/sail up -d\n```\n\n---\n\n## 3. 슬림 스켈레톤\n\n```\napp/\n├── Http/Controllers/\n├── Models/\n└── Providers/          # 보통 AppServiceProvider만\nbootstrap/\n├── app.php             # 앱 구성의 중심\n└── providers.php\nconfig/                 # 바꿀 것만 publish\ndatabase/migrations/\nroutes/\n├── web.php\n├── console.php\n└── api.php             # install:api 등으로 추가\nresources/views/\ntests/\n```\n\n`app/Http/Kernel.php`를 찾아 헤매는 것은 Laravel 10 습관이다. 11+에서는 없다.\n\n```php\nreturn Application::configure(basePath: dirname(__DIR__))\n    -\u003ewithRouting(\n        web: __DIR__.'/../routes/web.php',\n        api: __DIR__.'/../routes/api.php',\n        commands: __DIR__.'/../routes/console.php',\n        health: '/up',\n    )\n    -\u003ewithMiddleware(function (Middleware $middleware) {\n        //\n    })\n    -\u003ewithExceptions(function (Exceptions $exceptions) {\n        //\n    })-\u003ecreate();\n```\n\n`health: '/up'`은 로드밸런서·오케스트레이터가 “살아 있는지” 묻는 경로다. 앱 로직을 넣지 않는다.\n\n---\n\n## 4. `.env`와 설정\n\n```env\nAPP_NAME=Demo\nAPP_ENV=local\nAPP_DEBUG=true\nAPP_URL=http://localhost\n\nDB_CONNECTION=sqlite\n\nCACHE_STORE=database\nQUEUE_CONNECTION=database\nSESSION_DRIVER=database\n```\n\n규칙이 세 가지다.\n\n- 비밀번호·키는 `.env`에만 두고 **커밋하지 않는다**.\n- 앱 코드에서는 `config('app.name')`을 쓴다. `env()`는 **config 파일 안에서만**.\n- 운영은 `APP_ENV=production`이면 `APP_DEBUG=false`가 필수다. 디버그가 켜지면 스택과 환경 값이 그대로 보인다.\n\n`config:cache`를 켠 뒤에는 `env()`가 코드에서 빈 값을 돌려주는 경우가 많다. 그래서 코드에 `env()`를 두면 운영에서만 깨진다.\n\n```bash\nphp artisan config:cache   # 운영 배포\nphp artisan config:clear   # 로컬에서 .env를 바꾼 뒤\n```\n\n---\n\n## 5. PHP 8.2+에서 바로 쓰는 문법\n\nLaravel의 Form Request·캐스트와 잘 맞는다.\n\n```php\nclass CreateUserData\n{\n    public function __construct(\n        public readonly string $email,\n        public readonly string $name,\n    ) {}\n}\n\nenum OrderStatus: string\n{\n    case Pending = 'pending';\n    case Paid = 'paid';\n    case Cancelled = 'cancelled';\n}\n\n$label = match ($order-\u003estatus) {\n    OrderStatus::Pending =\u003e '대기',\n    OrderStatus::Paid =\u003e '결제완료',\n    OrderStatus::Cancelled =\u003e '취소',\n};\n```\n\n상태 값을 문자열 `'paid'`로 흩뿌리면 오타가 컴파일에 안 잡힌다. Enum이면 잘못된 값이 타입에서 걸린다.\n\n---\n\n## 6. Artisan\n\n**Artisan**은 Laravel 명령줄 도구다. 모델·마이그레이션·컨트롤러를 손으로 복사하지 않는다.\n\n```bash\nphp artisan list\nphp artisan make:model Post -mfs   # model + migration + factory + seeder\nphp artisan make:controller PostController --resource\nphp artisan migrate\nphp artisan route:list\nphp artisan tinker\n```\n\n`tinker`는 컨테이너와 Eloquent(DB를 객체로 다루는 계층, 3편)를 REPL에서 만져 보는 도구다. 쿼리를 추측하기 전에 한 번 실행해 보면 학습이 빨라진다.\n\n---\n\n## 7. 첫 라우트\n\n```php\n// routes/web.php\nuse Illuminate\\Support\\Facades\\Route;\n\nRoute::get('/api/hello', function () {\n    return response()-\u003ejson(['message' =\u003e 'Hello, Laravel']);\n});\n```\n\n```bash\ncurl http://127.0.0.1:8000/api/hello\nphp artisan route:list\n```\n\n웹 세션이 필요 없는 JSON API만 만들면 `php artisan install:api`로 `routes/api.php`를 추가한다.\n\n---\n\n## 8. 패키지는 필요할 때만\n\n| 목적 | 대표 |\n|------|------|\n| 인증 UI | Breeze / Fortify |\n| API·SPA 인증 | Sanctum (토큰 또는 쿠키) |\n| 권한 | Policy (내장), Spatie Permission |\n| 관리자 | Filament |\n| 프론트 | Blade, Livewire, Inertia |\n| 큐 감시 | Horizon (Redis 큐 대시보드) |\n\n처음부터 Jetstream·Octane·Horizon을 다 깔지 않는다. API면 Sanctum, 폼 많은 내부툴이면 Blade 또는 Filament처럼 **제품에 맞는 한 줄**만 고른다.\n\n---\n\n## 9. 흔한 실수\n\n- Laravel 10 문서만 보고 `Http/Kernel.php`를 찾는다. 11+는 `bootstrap/app.php`다.\n- 컨트롤러에서 `env('APP_URL')`을 직접 읽는다. 설정 캐시 후 빈 값이 된다.\n- `.env`를 깃에 올린다. `APP_KEY`가 새면 세션·암호화 데이터가 위험해진다.\n- `APP_DEBUG=true`인 채 배포한다.\n- PHP 8.1로 11을 설치하려고 한다. 최소 8.2다.\n\n---\n\n## 연습\n\n1. 프로젝트를 만들고 `/up`과 JSON 라우트가 응답하는지 확인한다.\n2. `.env`에서 SQLite 또는 MySQL/Postgres 중 하나로 DB를 연결한다.\n3. `OrderStatus` Enum을 만들어 `tinker`에서 출력한다.\n4. `php artisan route:list`로 등록된 경로를 확인한다.\n"])</script><script>self.__next_f.push([1,"3f:T19fd,"])</script><script>self.__next_f.push([1,"# 라우팅·미들웨어·컨트롤러 — 요청 생명주기\n\n\u003e 요약: 요청은 라우트와 미들웨어를 지나 컨트롤러에 도착하며, 인증·제한·응답을 어디에 둘지는 이 흐름에서 정한다.\n\n---\n\n## 1. 한 요청이 지나가는 길\n\n브라우저나 앱이 URL을 치면 Laravel은 대략 이렇게 움직인다.\n\n1. `public/index.php`가 앱을 켠다.\n2. `bootstrap/app.php`가 라우트·미들웨어·예외를 묶는다.\n3. **미들웨어**(요청 앞뒤에서 가로채는 필터)가 인증·CSRF·속도 제한을 한다.\n4. **라우트**가 URL과 HTTP 메서드를 컨트롤러에 연결한다.\n5. **컨트롤러**가 응답(HTML, JSON, 리다이렉트)을 만든다.\n\n컨트롤러는 **얇게** 두는 편이 유지보수에 유리하다. 쿼리와 트랜잭션이 길어지면 Action이나 Service로 뺀다
