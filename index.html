-page__cta\",\"children\":\"HOME\"}]\n10:[\"$\",\"$L17\",null,{}]\n19:T1624,"])</script><script>self.__next_f.push([1,"# Angular 스탠드얼론으로 프로젝트 시작하기\n\n\u003e 요약: NgModule 없이 standalone 컴포넌트와 app.config로 Angular 앱을 띄우고, 폴더·부트스트랩 기본선을 정리한다.\n\n---\n\n## 1. 언제 Angular인가\n\nAngular는 라우팅·DI(의존성 주입)·폼·빌드를 **한 프레임워크**로 제공하는 쪽에 가깝다. 팀 규칙과 폴더 구조가 처음부터 정해져 있으면 규모가 커져도 같은 모양이 유지된다.\n\n신규 기본선은 **standalone API**다. NgModule은 옛 앱·일부 라이브러리에서만 만난다.\n\n| 항목 | NgModule 시대 | 지금 |\n|------|---------------|------|\n| 앱 시작 | `AppModule` + `bootstrapModule` | `bootstrapApplication` |\n| 컴포넌트 등록 | 모듈 `declarations` | 컴포넌트 `standalone: true` + `imports` |\n| 전역 설정 | 모듈 `providers` | `app.config.ts`의 `providers` |\n\nstandalone 컴포넌트는 **자기 파일에서 필요한 것을 `imports`로 가져오는 화면 조각**이다. 모듈 파일이 없어도 템플릿에 `RouterLink` 등을 쓸 수 있다.\n\n---\n\n## 2. 핵심 구조\n\n```\nsrc/\n├── main.ts              앱을 부트스트랩한다\n├── app/\n│   ├── app.config.ts    라우터·HTTP 등 제공자\n│   ├── app.routes.ts    URL 표\n│   ├── app.ts           루트 컴포넌트\n│   └── home/\n│       └── home.ts\n└── index.html\n```\n\n| 파일 | 역할 |\n|------|------|\n| `main.ts` | `bootstrapApplication(App, appConfig)` |\n| `app.config.ts` | `ApplicationConfig`. 앱 전역 서비스 등록 |\n| `app.routes.ts` | `Routes` 배열 |\n| 기능 폴더 | 화면 하나 = 폴더 하나. 공유 UI는 `shared/` |\n\n최신 CLI는 파일명이 `app.ts`인 경우가 많다. 구 템플릿은 `app.component.ts`다. 역할은 같다.\n\n---\n\n## 3. 생성\n\n```bash\nnpm install -g @angular/cli\nng new my-app --defaults\ncd my-app\nng serve\n```\n\n최근 CLI는 standalone가 기본이다. `--standalone` 플래그는 버전에 따라 불필요하거나 폐기됐다. `ng new --help`로 확인한다.\n\n권장: TypeScript strict, 라우팅 포함. CSS는 팀 취향이다.\n\n---\n\n## 4. 동작하는 예: 부트스트랩과 홈\n\n`src/main.ts`:\n\n```ts\nimport { bootstrapApplication } from '@angular/platform-browser';\nimport { appConfig } from './app/app.config';\nimport { App } from './app/app';\n\nbootstrapApplication(App, appConfig).catch((err) =\u003e console.error(err));\n```\n\n`src/app/app.config.ts`:\n\n```ts\nimport { ApplicationConfig, provideZoneChangeDetection } from '@angular/core';\nimport { provideRouter } from '@angular/router';\nimport { routes } from './app.routes';\n\nexport const appConfig: ApplicationConfig = {\n  providers: [\n    provideZoneChangeDetection({ eventCoalescing: true }),\n    provideRouter(routes),\n  ],\n};\n```\n\nCLI 버전에 따라 `provideBrowserGlobalErrorListeners` 등이 더 있을 수 있다. 생성 결과에서 라우터만 확인하면 된다.\n\n`src/app/app.routes.ts`:\n\n```ts\nimport { Routes } from '@angular/router';\nimport { Home } from './home/home';\n\nexport const routes: Routes = [\n  { path: '', component: Home },\n  { path: '**', redirectTo: '' },\n];\n```\n\n`src/app/home/home.ts`:\n\n```ts\nimport { Component } from '@angular/core';\n\n@Component({\n  selector: 'app-home',\n  standalone: true,\n  template: `\n    \u003csection\u003e\n      \u003ch1\u003e{{ title }}\u003c/h1\u003e\n      \u003cp\u003estandalone 홈이다.\u003c/p\u003e\n    \u003c/section\u003e\n  `,\n})\nexport class Home {\n  title = '홈';\n}\n```\n\n`src/app/app.ts`:\n\n```ts\nimport { Component } from '@angular/core';\nimport { RouterOutlet } from '@angular/router';\n\n@Component({\n  selector: 'app-root',\n  standalone: true,\n  imports: [RouterOutlet],\n  template: `\n    \u003cheader\u003e\n      \u003cstrong\u003eMyApp\u003c/strong\u003e\n    \u003c/header\u003e\n    \u003crouter-outlet /\u003e\n  `,\n})\nexport class App {}\n```\n\n루트는 셸이다. 본문은 `router-outlet`이 채운다. `Home`을 쓰려면 라우트에 등록한다. 루트 `imports`에 넣을 필요는 없다.\n\n`standalone: true`는 Angular 19+에서 기본값이라 생략할 수 있다. 이 시리즈는 의도를 드러내기 위해 적는다.\n\n---\n\n## 5. NgModule을 언제 보는가\n\n- 옛 튜토리얼의 `NgModule` / `declarations`\n- 아직 모듈만 제공하는 서드파티\n- 점진 이관 중인 대형 코드베이스\n\n신규 화면은 standalone로 만든다. 라이브러리가 모듈만 주면 그 모듈을 컴포넌트 `imports`에 넣는다. 앱 전체를 다시 `AppModule`로 묶지 않는다.\n\n---\n\n## 6. 주의 / 흔한 실수\n\n- **`declarations`를 standalone 컴포넌트에 찾기.** 그 배열은 NgModule 전용이다. 자식은 `imports`에 넣는다.\n- **루트에 모든 페이지를 `imports`.** 라우트 `component` / `loadComponent`로 연결한다.\n- **`main.ts`에서 `platformBrowserDynamic().bootstrapModule(AppModule)`.** Vue의 `new Vue`와 같이 옛 진입점이다.\n- **기능 폴더 없이 `app/`에 파일만 쌓기.** 화면이 늘면 import 순환이 생긴다.\n- **시크릿을 `environment.ts` 프론트 파일에 넣기.** 브라우저 번들에 포함된다.\n\n---\n\n## 정리\n\nAngular 시작은 모듈 미로가 아니다. **standalone 컴포넌트 + `bootstrapApplication` + `app.config.ts`** 세 점을 고정한다.\n\n- 화면 → `@Component({ standalone: true, imports: [...] })`\n- 전역 도구 → `providers` in `app.config.ts`\n- URL → `app.routes.ts`\n\n---\n\n## 연습\n\n1. `ng new`로 앱을 만들고 `Home`에 이름 문자열을 바인딩해 브라우저에서 확인한다.\n2. `about.ts` standalone 컴포넌트를 추가하고 `path: 'about'` 라우트를 연결한다.\n3. `app.config.ts`의 `providers` 목록을 읽고, 라우터가 어디서 등록되는지 한 줄로 적는다.\n"])</script><script>self.__next_f.push([1,"1a:T158d,"])</script><script>self.__next_f.push([1,"# 컴포넌트·템플릿·데이터 바인딩\n\n\u003e 요약: 템플릿에 값을 넣고 클릭을 받으며, @if/@for와 input/output으로 화면과 클래스를 연결한다.\n\n---\n\n## 1. 왜 바인딩인가\n\n템플릿은 HTML처럼 보이지만 **클래스 필드를 화면에 붙인 계약**이다. 클래스가 진실이고, 템플릿은 표시와 클릭만 담당한다.\n\n언제 어떤 문법을 쓰는가.\n\n| 문법 | 방향 | 용도 |\n|------|------|------|\n| `{{ expr }}` | 클래스 → 뷰 | 텍스트 |\n| `[attr]` / `[prop]` | 클래스 → DOM·자식 | disabled, src, 자식 input |\n| `(event)` | 뷰 → 클래스 | click, submit, 자식 output |\n| `[(ngModel)]` | 양방향 | 작은 폼. `FormsModule` 필요 |\n\n복잡한 검증은 4편 Reactive Forms를 쓴다. 여기서는 표시·클릭·자식 계약만 고정한다.\n\n---\n\n## 2. 핵심 개념\n\n| 개념 | 한 줄 |\n|------|--------|\n| 인터폴레이션 | `{{ title }}` — 값을 텍스트로 넣는다 |\n| 프로퍼티 바인딩 | `[disabled]=\"loading\"` — DOM 속성/프로퍼티에 연결한다 |\n| 이벤트 바인딩 | `(click)=\"save()\"` — 브라우저 이벤트에 메서드를 붙인다 |\n| `@if` / `@for` | 내장 제어 흐름. `*ngIf` / `*ngFor` 대신 신규 기본 |\n| `input()` | 부모가 내려주는 값. 시그널이라 읽을 때 `name()` |\n| `output()` | 자식이 부모에게 보내는 이벤트 |\n\n`track`은 리스트에서 **같은 행을 DOM에 재사용하기 위한 id**다. 없으면 배열이 바뀔 때마다 행을 다시 만든다.\n\n---\n\n## 3. 동작하는 예: 목록과 카드\n\n`src/app/user-card/user-card.ts`:\n\n```ts\nimport { Component, input, output } from '@angular/core';\n\n@Component({\n  selector: 'app-user-card',\n  standalone: true,\n  template: `\n    \u003carticle\u003e\n      \u003cp\u003e{{ name() }}\u003c/p\u003e\n      \u003cbutton type=\"button\" (click)=\"select.emit(name())\"\u003e선택\u003c/button\u003e\n    \u003c/article\u003e\n  `,\n})\nexport class UserCard {\n  name = input.required\u003cstring\u003e();\n  select = output\u003cstring\u003e();\n}\n```\n\n`input.required`는 부모가 값을 안 주면 컴파일·런타임에서 드러난다. `name()`은 시그널을 **호출해 현재 값**을 읽는다. `name`만 쓰면 시그널 함수 자체가 나온다.\n\n`src/app/home/home.ts`:\n\n```ts\nimport { Component } from '@angular/core';\nimport { UserCard } from '../user-card/user-card';\n\ntype User = { id: string; name: string };\n\n@Component({\n  selector: 'app-home',\n  standalone: true,\n  imports: [UserCard],\n  template: `\n    \u003cbutton type=\"button\" [disabled]=\"loading\" (click)=\"reload()\"\u003e\n      {{ loading ? '불러오는 중' : '다시 불러오기' }}\n    \u003c/button\u003e\n\n    @if (selected) {\n      \u003cp\u003e선택: {{ selected }}\u003c/p\u003e\n    } @else {\n      \u003cp\u003e아직 선택 없음\u003c/p\u003e\n    }\n\n    \u003cul\u003e\n      @for (user of users; track user.id) {\n        \u003cli\u003e\n          \u003capp-user-card [name]=\"user.name\" (select)=\"onSelect($event)\" /\u003e\n        \u003c/li\u003e\n      } @empty {\n        \u003cli\u003e사용자 없음\u003c/li\u003e\n      }\n    \u003c/ul\u003e\n  `,\n})\nexport class Home {\n  loading = false;\n  selected: string | null = null;\n  users: User[] = [\n    { id: '1', name: '김하늘' },\n    { id: '2', name: '이준' },\n  ];\n\n  reload() {\n    this.loading = true;\n    this.loading = false;\n  }\n\n  onSelect(name: string) {\n    this.selected = name;\n  }\n}\n```\n\n- `[name]=\"user.name\"` — 자식 input에 문자열을 넣는다\n- `(select)=\"onSelect($event)\"` — `$event`가 `output`으로 내보낸 값\n- `@empty` — 배열이 비었을 때 `@for` 전용 분기\n\n`UserCard`를 템플릿에서 쓰려면 부모 `imports`에 넣는다. standalone의 핵심이다.\n\n---\n\n## 4. 옛 문법과의 대응\n\n| 신규 | 옛 |\n|------|-----|\n| `@if (user) { }` | `*ngIf=\"user\"` |\n| `@for (x of xs; track x.id)` | `*ngFor=\"let x of xs; trackBy: trackId\"` |\n| `name = input.required\u003cstring\u003e()` | `@Input() name!: string` |\n| `select = output\u003cstring\u003e()` | `@Output() select = new EventEmitter\u003cstring\u003e()` |\n\n옛 문법도 동작한다. 신규 화면은 내장 제어 흐름과 `input()`/`output()`을 쓴다. 한 파일에 둘을 섞지 않는 편이 읽기 쉽다.\n\n`[(ngModel)]`은 `FormsModule`을 `imports`에 넣어야 한다. 필드가 늘면 Reactive Forms로 옮긴다.\n\n---\n\n## 5. 주의 / 흔한 실수\n\n- **템플릿에서 `name`만 출력.** 시그널 input은 `name()`이다. 안 부르면 `[object Function]`에 가깝게 보인다.\n- **`track` 생략.** 큰 목록에서 행 상태가 엉킨다. `track $index`는 최후 수단이다.\n- **템플릿에 구독·필터 로직 남발.** `users.filter(...)`를 템플릿에 두면 변경 감지마다 새 배열이 생긴다. 클래스의 `computed`나 메서드 캐시를 쓴다.\n- **`[innerHTML]`에 사용자 입력.** XSS다. 텍스트는 `{{ }}`다.\n- **`ChangeDetectionStrategy.OnPush`만 켜고 객체를 mutate.** OnPush는 참조가 바뀌거나 시그널이 갱신될 때 잘 맞는다. 배열 `push`만으로는 화면이 안 바뀔 수 있다.\n\n---\n\n## 정리\n\n템플릿은 뷰의 계약이다. **표시는 바인딩, 분기는 @if/@for, 부모·자식은 input/output**으로 좁힌다.\n\n- 텍스트·속성 → `{{ }}` / `[ ]`\n- 클릭 → `(click)`\n- 목록 → `@for` + `track`\n- 내려주기·올리기 → `input()` / `output()`\n\n---\n\n## 연습\n\n1. `loading`이 true일 때 버튼 문구와 `disabled`가 함께 바뀌는지 확인한다.\n2. `users`에 항목을 추가·삭제하는 버튼을 넣고 `@empty`가 보이는지 확인한다.\n3. `UserCard`에 `role = input\u003cstring\u003e('일반')`을 추가하고 부모에서 한 명만 다른 role을 넘긴다.\n"])</script><script>self.__next_f.push([1,"1b:T18d4,"])</script><script>self.__next_f.push([1,"# 시그널·서비스·의존성 주입\n\n\u003e 요약: signal로 화면 상태를 두고, providedIn 서비스와 inject로 공유 로직을 연결하는 Angular 상태·DI 패턴을 정리한다.\n\n---\n\n## 1. 왜 시그널과 서비스인가\n\n컴포넌트 필드는 그 화면만 안다. 로그인 사용자처럼 **여러 화면이 같은 값**을 보면 서비스로 올린다.\n\n시그널(signal)은 **값이 바뀌면 그 값을 읽는 템플릿만 다시 그리는 상자**다. Vue의 `ref`와 역할이 비슷하다. 읽을 때 `count()`처럼 함수로 연다.\n\nDI(의존성 주입)는 **클래스가 `new AuthService()`를 하지 않고, Angular가 인스턴스를 넣어 주는 방식**이다. 테스트에서 가짜 구현으로 갈아끼우기 쉽다.\n\n| 층 | 역할 |\n|----|------|\n| `signal` / `computed` | 이 화면 또는 서비스의 상태·파생 값 |\n| `effect` | 값이 바뀔 때 로그·연동. 남용하지 않는다 |\n| `@Injectable` 서비스 | 공유 로직·HTTP·인증 |\n| `inject()` | 생성자 대신 현재 주입 컨텍스트에서 꺼내 온다 |\n\n---\n\n## 2. 핵심 API\n\n```ts\nimport { signal, computed, effect } from '@angular/core';\n\nconst count = signal(0);\nconst double = computed(() =\u003e count() * 2);\n\neffect(() =\u003e {\n  console.log('count', count());\n});\n\ncount.set(1);\ncount.update((n) =\u003e n + 1);\n```\n\n| API | 한 줄 |\n|-----|--------|\n| `signal(init)` | 쓰기 가능한 상자. `set` / `update` |\n| `computed(() =\u003e ...)` | 다른 시그널에서 계산. 직접 `set`하지 않는다 |\n| `effect(() =\u003e ...)` | 읽은 시그널이 바뀔 때 부수 효과 |\n\n`effect`로 HTTP를 반복 호출하면 루프·중복 요청이 나기 쉽다. 데이터 로드는 이벤트·라우트 resolver·리소스 API 쪽을 검토한다.\n\n---\n\n## 3. 동작하는 예: 인증 서비스 + HTTP\n\n`src/app/auth.service.ts`:\n\n```ts\nimport { Injectable, computed, signal } from '@angular/core';\n\n@Injectable({ providedIn: 'root' })\nexport class AuthService {\n  private readonly user = signal\u003cstring | null\u003e(null);\n  readonly isLoggedIn = computed(() =\u003e this.user() !== null);\n  readonly displayName = computed(() =\u003e this.user() ?? '게스트');\n\n  login(name: string) {\n    this.user.set(name);\n  }\n\n  logout() {\n    this.user.set(null);\n  }\n}\n```\n\n`providedIn: 'root'`는 **앱에 인스턴스 하나**다. 어느 컴포넌트에서 `inject`해도 같은 상자다.\n\n`src/app/app.config.ts`에 HTTP를 등록한다.\n\n```ts\nimport { ApplicationConfig } from '@angular/core';\nimport { provideHttpClient } from '@angular/common/http';\nimport { provideRouter } from '@angular/router';\nimport { routes } from './app.routes';\n\nexport const appConfig: ApplicationConfig = {\n  providers: [provideRouter(routes), provideHttpClient()],\n};\n```\n\n`src/app/user.service.ts`:\n\n```ts\nimport { HttpClient } from '@angular/common/http';\nimport { Injectable, inject, signal } from '@angular/core';\n\nexport type UserDto = { id: number; name: string };\n\n@Injectable({ providedIn: 'root' })\nexport class UserService {\n  private readonly http = inject(HttpClient);\n  readonly users = signal\u003cUserDto[]\u003e([]);\n  readonly error = signal\u003cstring | null\u003e(null);\n\n  load() {\n    this.error.set(null);\n    this.http.get\u003cUserDto[]\u003e('https://jsonplaceholder.typicode.com/users').subscribe({\n      next: (rows) =\u003e this.users.set(rows),\n      error: () =\u003e this.error.set('목록을 불러오지 못했다'),\n    });\n  }\n}\n```\n\n`src/app/home/home.ts`:\n\n```ts\nimport { Component, inject } from '@angular/core';\nimport { AuthService } from '../auth.service';\nimport { UserService } from '../user.service';\n\n@Component({\n  selector: 'app-home',\n  standalone: true,\n  template: `\n    \u003cp\u003e{{ auth.displayName() }}\u003c/p\u003e\n    \u003cbutton type=\"button\" (click)=\"auth.login('demo')\"\u003e로그인\u003c/button\u003e\n    \u003cbutton type=\"button\" (click)=\"auth.logout()\"\u003e로그아웃\u003c/button\u003e\n    \u003cbutton type=\"button\" (click)=\"users.load()\"\u003e목록\u003c/button\u003e\n    @if (users.error()) {\n      \u003cp\u003e{{ users.error() }}\u003c/p\u003e\n    }\n    \u003cul\u003e\n      @for (row of users.users(); track row.id) {\n        \u003cli\u003e{{ row.name }}\u003c/li\u003e\n      }\n    \u003c/ul\u003e\n  `,\n})\nexport class Home {\n  readonly auth = inject(AuthService);\n  readonly users = inject(UserService);\n}\n```\n\n구독은 서비스 한곳에서 시그널로 접는다. 컴포넌트가 `subscribe`를 들고 있으면 `destroy` 때 해제를 잊기 쉽다. `async` 파이프를 쓸 때는 템플릿에서 구독 수명을 맡긴다.\n\n생성자 주입도 된다. `inject()`가 필드 초기화와 짧다. `inject`는 생성자·필드 초기화·`runInInjectionContext` 안에서만 호출한다. 임의 클릭 핸들러에서 부르면 실패한다.\n\n---\n\n## 4. 제공 범위\n\n| 범위 | 언제 |\n|------|------|\n| `providedIn: 'root'` | 앱 전역 싱글톤. 인증·HTTP 래퍼 |\n| 컴포넌트 `providers: [X]` | 그 컴포넌트 트리만. 위저드 로컬 상태 |\n| 라우트 `providers` | 그 기능 라우트만. NgModule 대체 |\n\n테스트:\n\n```ts\nTestBed.configureTestingModule({\n  providers: [{ provide: AuthService, useValue: fakeAuth }],\n});\n```\n\nDI가 있는 이유다. `new AuthService()`를 컴포넌트 안에 쓰면 테스트가 실제 네트워크를 탄다.\n\n---\n\n## 5. 주의 / 흔한 실수\n\n- **시그널을 `count`로 출력.** 템플릿도 `count()`다.\n- **`computed`에 대입.** 파생 값이다. 쓰기는 원본 `signal`.\n- **`effect`에서 다른 시그널을 `set`해 연쇄 갱신.** 순환이 난다. 이벤트 핸들러에서 갱신한다.\n- **컴포넌트에서 `HttpClient`를 직접 구독하고 해제 생략.** 라우트를 나가도 콜백이 산다.\n- **`providedIn: 'root'` 서비스를 컴포넌트 `providers`에 또 등록.** 인스턴스가 둘이라 로그인이 화면에 안 보인다.\n\n---\n\n## 정리\n\n상태는 **시그널**, 공유 로직은 **서비스**, 연결은 **DI**다.\n\n- 화면 국소 값 → 컴포넌트 `signal`\n- 앱 공유 값 → `providedIn: 'root'` + `signal`\n- 꺼내기 → `inject(AuthService)` (생성자·필드에서만)\n\n---\n\n## 연습\n\n1. `AuthService`의 `login`/`logout` 후 `isLoggedIn()`이 헤더와 홈에서 같이 바뀌는지 확인한다.\n2. `UserService.load` 실패 시 `error` 문구가 보이는지, 성공 시 목록이 바뀌는지 확인한다.\n3. `Home`에 `providers: [AuthService]`를 잠시 넣고, 헤더와 홈의 로그인 상태가 어긋나는지 본 뒤 제거한다.\n"])</script><script>self.__next_f.push([1,"1c:T1bc6,"])</script><script>self.__next_f.push([1,"# 라우팅과 리액티브 폼\n\n\u003e 요약: provideRouter와 lazy loadComponent로 화면을 나누고, 가드·FormBuilder로 진입 조건과 입력 검증을 구성하는 방법을 정리한다.\n\n---\n\n## 1. 왜 라우터와 폼인가\n\nSPA에서 주소는 화면의 이름이다. 새로고침·공유 링크가 같은 화면을 열어야 한다.\n\n폼은 입력을 클래스로 들고 검증한다. 템플릿의 `ngModel`만으로는 필드가 늘고 조건이 겹치면 추적이 어렵다. **복잡한 검증·동적 필드**는 Reactive Forms(리액티브 폼)가 맞다. 검색 한 칸은 `ngModel`로도 충분하다.\n\n| 구성 | 역할 |\n|------|------|\n| `Routes` | path ↔ 컴포넌트 |\n| `loadComponent` | 그 화면 JS를 나중에 받는다 |\n| `CanActivateFn` | 이동 전에 로그인·권한을 검사한다 |\n| `FormGroup` | 필드 묶음. 값·유효·에러를 한 객체로 본다 |\n\n---\n\n## 2. 핵심 라우팅\n\n`src/app/app.routes.ts`:\n\n```ts\nimport { Routes } from '@angular/router';\nimport { authGuard } from './auth.guard';\n\nexport const routes: Routes = [\n  {\n    path: '',\n    loadComponent: () =\u003e import('./home/home').then((m) =\u003e m.Home),\n  },\n  {\n    path: 'login',\n    loadComponent: () =\u003e import('./login/login').then((m) =\u003e m.Login),\n  },\n  {\n    path: 'posts/:id',\n    loadComponent: () =\u003e import('./post/post').then((m) =\u003e m.Post),\n    canActivate: [authGuard],\n  },\n  { path: '**', redirectTo: '' },\n];\n```\n\n`src/app/app.config.ts`:\n\n```ts\nimport { ApplicationConfig } from '@angular/core';\nimport { provideRouter, withComponentInputBinding } from '@angular/router';\nimport { provideHttpClient } from '@angular/common/http';\nimport { routes } from './app.routes';\n\nexport const appConfig: ApplicationConfig = {\n  providers: [\n    provideRouter(routes, withComponentInputBinding()),\n    provideHttpClient(),\n  ],\n};\n```\n\n`withComponentInputBinding()`은 라우트 `:id`를 컴포넌트 `input()`과 같은 이름으로 연결한다. `ActivatedRoute.snapshot.paramMap`을 직접 읽지 않아도 된다.\n\n`src/app/post/post.ts`:\n\n```ts\nimport { Component, input } from '@angular/core';\n\n@Component({\n  selector: 'app-post',\n  standalone: true,\n  template: `\u003ch1\u003e글 {{ id() }}\u003c/h1\u003e`,\n})\nexport class Post {\n  id = input.required\u003cstring\u003e();\n}\n```\n\n`src/app/auth.guard.ts`:\n\n```ts\nimport { inject } from '@angular/core';\nimport { CanActivateFn, Router } from '@angular/router';\nimport { AuthService } from './auth.service';\n\nexport const authGuard: CanActivateFn = (_route, state) =\u003e {\n  const auth = inject(AuthService);\n  const router = inject(Router);\n  if (auth.isLoggedIn()) return true;\n  return router.createUrlTree(['/login'], {\n    queryParams: { redirect: state.url },\n  });\n};\n```\n\n가드에서 목록 API를 기다리면 전환이 느려진다. 세션 존재 여부만 본다.\n\n템플릿 이동:\n\n```html\n\u003ca routerLink=\"/\"\u003e홈\u003c/a\u003e\n\u003ca [routerLink]=\"['/posts', '42']\"\u003e글 42\u003c/a\u003e\n```\n\n`RouterLink`를 해당 컴포넌트 `imports`에 넣는다.\n\n---\n\n## 3. 동작하는 예: 로그인 폼\n\n`src/app/login/login.ts`:\n\n```ts\nimport { Component, inject } from '@angular/core';\nimport { FormBuilder, ReactiveFormsModule, Validators } from '@angular/forms';\nimport { Router, RouterLink, ActivatedRoute } from '@angular/router';\nimport { AuthService } from '../auth.service';\n\n@Component({\n  selector: 'app-login',\n  standalone: true,\n  imports: [ReactiveFormsModule, RouterLink],\n  template: `\n    \u003cform [formGroup]=\"form\" (ngSubmit)=\"onSubmit()\"\u003e\n      \u003clabel for=\"email\"\u003e이메일\u003c/label\u003e\n      \u003cinput id=\"email\" type=\"email\" formControlName=\"email\" [attr.aria-describedby]=\"emailErr ? 'email-err' : null\" /\u003e\n      @if (emailErr) {\n        \u003cp id=\"email-err\"\u003e{{ emailErr }}\u003c/p\u003e\n      }\n\n      \u003clabel\u003e\n        \u003cinput type=\"checkbox\" formControlName=\"agree\" /\u003e\n        약관 동의\n      \u003c/label\u003e\n      @if (form.controls.agree.touched \u0026\u0026 form.controls.agree.invalid) {\n        \u003cp\u003e동의해야 진행한다\u003c/p\u003e\n      }\n\n      \u003cbutton type=\"submit\" [disabled]=\"form.invalid\"\u003e로그인\u003c/button\u003e\n      \u003ca routerLink=\"/\"\u003e홈\u003c/a\u003e\n    \u003c/form\u003e\n  `,\n})\nexport class Login {\n  private readonly fb = inject(FormBuilder);\n  private readonly auth = inject(AuthService);\n  private readonly router = inject(Router);\n  private readonly route = inject(ActivatedRoute);\n\n  readonly form = this.fb.nonNullable.group({\n    email: ['', [Validators.required, Validators.email]],\n    agree: [false, Validators.requiredTrue],\n  });\n\n  get emailErr(): string | null {\n    const c = this.form.controls.email;\n    if (!c.touched \u0026\u0026 !c.dirty) return null;\n    if (c.hasError('required')) return '이메일을 입력한다';\n    if (c.hasError('email')) return '이메일 형식이 아니다';\n    return null;\n  }\n\n  onSubmit() {\n    if (this.form.invalid) {\n      this.form.markAllAsTouched();\n      return;\n    }\n    this.auth.login(this.form.getRawValue().email);\n    const redirect = this.route.snapshot.queryParamMap.get('redirect') ?? '/';\n    void this.router.navigateByUrl(redirect);\n  }\n}\n```\n\n- `[formGroup]` / `formControlName` — 템플릿 필드와 모델이 같은 이름\n- `nonNullable.group` — `getRawValue()`가 `string` / `boolean`으로 남는다 (`string | null`이 아니다)\n- `disabled`만으로 제출을 막지 않는다. 엔터 제출 시 `invalid`면 `markAllAsTouched`로 문구를 연다\n\n`label`의 `for`와 `input`의 `id`를 맞춘다. 에러는 `aria-describedby`로 필드와 연결한다.\n\n---\n\n## 4. 템플릿 주도 vs 리액티브\n\n| | 템플릿 주도 | 리액티브 |\n|--|-------------|----------|\n| 모델 | `ngModel` | `FormGroup` |\n| 모듈 | `FormsModule` | `ReactiveFormsModule` |\n| 맞는 규모 | 필드 1~2개 | 검증·교차 필드·동적 배열 |\n\n둘을 한 폼에 섞지 않는다.\n\n---\n\n## 5. 주의 / 흔한 실수\n\n- **`loadComponent` 없이 모든 페이지를 정적 import.** 초기 번들에 관리자 화면이 포함된다.\n- **가드에서 `true`/`false`만 반환하고 URL을 안 바꿈.** `false`는 이동만 취소한다. 로그인 페이지로 보내려면 `UrlTree`를 반환한다.\n- **라우트 `id`와 `input()` 이름 불일치.** `withComponentInputBinding`은 이름이 같아야 한다.\n- **`form.value.email`이 `string | undefined`.** `nonNullable` 또는 `getRawValue()`를 쓴다. disabled 컨트롤은 `value`에서 빠진다.\n- **제출 버튼을 `invalid`로만 disable.** 오류 문구가 안 보여 사용자가 이유를 모른다. `touched`와 메시지를 병행한다.\n\n---\n\n## 정리\n\nURL은 라우터가, 입력은 폼 모델이 책임진다.\n\n- 화면 분할 → `loadComponent`\n- 진입 조건 → `CanActivateFn` + `createUrlTree`\n- 파라미터 → `withComponentInputBinding` + `input()`\n- 검증 → `FormBuilder` + `Validators`\n\n---\n\n## 연습\n\n1. `/posts/1`에 비로그인으로 진입해 `/login?redirect=...`로 가는지 확인한다. 로그인 후 원래 글로 돌아오게 한다.\n2. 이메일 형식이 틀릴 때 `emailErr` 문구가 필드 아래에 붙는지 확인한다.\n3. `agree`를 끄면 제출이 막히고, 체크하면 `getRawValue()`에 `true`가 들어오는지 확인한다.\n"])</script><script>self.__next_f.push([1,"1d:Tfed,"])</script><script>self.__next_f.push([1,"# Angular 앱 실무 체크리스트\n\n\u003e 요약: standalone 구조·성능·보안·테스트·배포까지, Angular 앱을 내보내기 전에 항목마다 이유를 붙여 확인하는 실무 체크리스트다.\n\n---\n\n## 1. 구조·품질\n\n- [ ] standalone + TypeScript strict를 기본선으로 둔다 — NgModule과 혼용하면 같은 기능이 두 등록 경로로 갈라진다.\n- [ ] 기능 폴더 단위로 나누고 순환 import를 없앤다 — `home`이 `post`를, `post`가 `home`을 참조하면 빌드·테스트가 깨지기 쉽다.\n- [ ] `angular-eslint`를 CI에서 돌린다 — 템플릿의 시그널 미호출·잘못된 `track`은 리뷰만으로 빠진다.\n- [ ] 환경 파일·빌드 타임 env에 시크릿을 넣지 않는다 — `environment.prod.ts`도 브라우저 번들에 들어간다.\n- [ ] 공유 UI는 `shared/`, 전역 서비스는 `providedIn: 'root'`로 경계를 지킨다 — 페이지가 HTTP·인증을 직접 들고 있으면 재사용이 끊긴다.\n\n---\n\n## 2. 성능\n\n- [ ] 라우트는 `loadComponent` / `loadChildren`으로 나눈다 — 첫 페인트에 설정 화면 JS가 따라오면 초기 비용이 커진다.\n- [ ] `@for`에 `track`으로 안정 id를 둔다 — 인덱스만 쓰면 행이 지워질 때 입력 상태가 다른 행으로 옮는다.\n- [ ] OnPush 또는 시그널로 불필요한 변경 감지를 줄인다 — 기본 Zone 감지는 이벤트마다 큰 트리를 검사한다.\n- [ ] `ng build` 번들 budgets를 확인하고 예산을 넘기면 머지를 막는다 — 개발 `ng serve` 속도는 배포 크기와 무관하다.\n- [ ] 이미지에 `NgOptimizedImage`(`ngSrc`)를 검토한다 — 큰 PNG를 그대로 넣으면 LCP가 길어진다.\n- [ ] 템플릿에서 `users.filter()`처럼 매 감지마다 새 배열을 만들지 않는다 — `computed`로 파생 목록을 둔다.\n\n---\n\n## 3. 데이터·보안\n\n- [ ] `HttpClient` 에러를 시그널·메시지로 접고 구독 누수를 막는다 — 컴포넌트가 `subscribe`만 하면 라우트 이탈 후에도 콜백이 산다.\n- [ ] interceptor로 Authorization 헤더를 한곳에서 붙인다 — 화면마다 헤더를 넣으면 누락된 호출이 생긴다.\n- [ ] `bypassSecurityTrustHtml` / `[innerHTML]`에 사용자 입력을 넣지 않는다 — Angular 살균을 우회하면 XSS가 된다.\n- [ ] CSRF·쿠키 SameSite는 백엔드와 합의한다 — SPA만으로 쿠키 정책을 끝낼 수 없다.\n- [ ] 가드는 최소 정보만 본다 — 가드 안에서 무거운 목록 API를 기다리면 화면 전환이 느려진다.\n\n---\n\n## 4. 테스트·품질\n\n- [ ] 인증·요금 계산처럼 핵심 서비스에 단위 테스트를 둔다 — UI만 눈으로 보면 회귀가 늦다.\n- [ ] 로그인·결제 등 소수 화면에 컴포넌트 테스트 또는 e2e를 둔다 — 전부 e2e는 느리고 깨지기 쉽다.\n- [ ] `ng test`가 CI에서 실패하면 머지하지 않는다 — 로컬에서만 통과하는 테스트는 테스트가 아니다.\n- [ ] `TestBed`에서 서비스를 `useValue` / `useStub`으로 갈아끼운다 — 실제 HTTP를 타면 테스트가 네트워크에 종속된다.\n\n---\n\n## 5. 배포\n\n- [ ] `ng build --configuration production` 산출물을 올린다 — development 구성은 소스맵·미최적화 번들이다.\n- [ ] `\u003cbase href\u003e`와 자산 경로가 실제 공개 URL과 같다 — 서브폴더 배포인데 `/`면 런타임 JS가 404다.\n- [ ] 서버에 SPA 폴백을 둔다 (`try_files $uri /index.html`) — `/posts/1` 새로고침이 서버 파일로 해석되면 404다.\n- [ ] 소스맵 공개 범위를 정한다 — 전체 맵은 원본 TypeScript가 그대로 내려간다.\n- [ ] 프로덕션에서 `enableProdMode`에 해당하는 최적화가 켜졌는지 빌드 로그로 확인한다 — 개발 모드 경고가 사용자에게 보이면 구성이 잘못됐다.\n\n---\n\n## 정리\n\nAngular는 기능이 많아서가 아니라 **체크리스트를 통과하는 기본선**을 지킬 때 팀 규모에서 이득이 난다. 항목을 건너뛸 때는 티켓에 이유를 남긴다.\n"])</script><script>self.__next_f.push([1,"1e:T1d02,"])</script><script>self.__next_f.push([1,"# AWS 계정·IAM·빌링 기초 잡기\n\n\u003e 요약: 루트 계정은 잠그고 IAM과 비용 알람부터 켜는, AWS를 안전하게 시작하기 위한 최소 세팅을 정리한다.\n\n---\n\n## 1. 언제 이 세팅이 먼저인가\n\nAWS는 Amazon Web Services, 클라우드 인프라 모음이다. EC2를 켜기 전에 **계정 보안과 비용 가시성**을 먼저 둔다. 권한만 열리면 비용과 데이터가 바로 열린다.\n\n이 글의 대상은 첫 계정, 사이드 프로젝트, 팀의 공유 개발 계정이다. 조직의 AWS Organizations·SSO가 이미 있으면 그 절차를 따른다. 여기서는 콘솔로 시작하는 최소선을 다룬다.\n\n하지 말아야 할 것부터 적는다.\n\n- 루트 계정으로 매일 로그인해서 인스턴스를 켜지 않는다\n- 루트 액세스 키를 발급하지 않는다\n- 알람 없이 프리 티어만 믿고 방치하지 않는다\n\n프리 티어는 일부 서비스의 제한된 무료분이다. 리전·상품·기간이 끝나면 과금된다.\n\n---\n\n## 2. 핵심 개념\n\n**루트 사용자**는 이메일로 가입한 계정 소유자다. 결제 수단 변경, 계정 닫기처럼 극히 일부 작업만 한다. 일상 개발·운영에는 쓰지 않는다.\n\n**IAM**은 Identity and Access Management, 누가 무엇을 해도 되는지 정하는 서비스다.\n\n- IAM 사용자: 사람(또는 장기 자격). 콘솔 비밀번호, 필요 시 액세스 키\n- IAM 그룹: 사용자에게 붙일 권한 묶음\n- IAM 역할: 맡으면(Assume) 임시 자격이 나오는 세트. EC2·Lambda·CI가 이걸 쓴다\n- 정책: Allow/Deny JSON 문서\n\n**최소 권한**은 필요한 행동·리소스만 허용하는 원칙이다. `AdministratorAccess`를 개인에게 상시 다는 습관은 사고 대기 상태다.\n\n**MFA**는 Multi-Factor Authentication, 비밀번호 외 일회용 코드를 더하는 장치다. 루트와 관리자 IAM에 필수다.\n\n**액세스 키**는 CLI·SDK용 장기 비밀이다. 유출되면 과금 폭탄이 난다. 깃 저장소·프론트 코드·스크린샷에 넣지 않는다. 사람용보다 역할 Assume이 기본선이다.\n\n**Billing·Budgets.** 콘솔에서 비용 탐색과 예산 알람을 켠다. 태그는 나중에 붙이기 어렵다. `Project`, `Env`, `Owner`를 처음부터 합의한다.\n\n---\n\n## 3. 최소 작업 순서\n\n1. 루트에 MFA를 켠다. 복구 코드는 비밀번호 관리기에 둔다.\n2. 루트 액세스 키가 있으면 삭제한다. 새로 만들지 않는다.\n3. 본인용 IAM 사용자를 만들고 MFA를 켠다. 관리 작업이 필요하면 그룹으로 권한을 준다.\n4. 루트는 로그아웃한다. 이후 콘솔은 IAM만 쓴다.\n5. 월 예산 알람을 두 단계로 둔다. 예: 10 USD, 50 USD. 실제 한도는 팀 합의.\n6. CLI가 필요하면 프로필을 나눈다.\n\n```bash\naws configure --profile work\naws sts get-caller-identity --profile work\n```\n\n`get-caller-identity`가 기대한 계정·사용자 ARN을 반환하는지 본다. ARN은 Amazon Resource Name, 리소스 주소다.\n\n자격 파일 예시 개념이다. 실제 키 값을 글에 넣지 않는다.\n\n```\n# ~/.aws/credentials — 값은 로컬에만, 커밋 금지\n[work]\naws_access_key_id = YOUR_ACCESS_KEY_ID\naws_secret_access_key = YOUR_SECRET_ACCESS_KEY\n```\n\n가능하면 액세스 키 대신 IAM Identity Center(SSO) 또는 역할 전환을 쓴다. CI는 GitHub OIDC처럼 **단기 자격**이 안전하다.\n\n그룹 예:\n\n- `Developers`: 읽기 + 제한된 배포\n- `Ops`: CloudWatch, 인스턴스 재시작 등 운영\n- `BillingViewers`: 비용 조회만\n\n`AdministratorAccess`가 필요하면 짧은 시간, 별도 역할, MFA 조건으로 한정한다.\n\n---\n\n## 4. 운영 시 주의\n\n**비용.** 리전을 여러 곳에 켜 두면 자원을 잊기 쉽다. 기본 리전을 하나 정한다. NAT Gateway, 퍼블릭 IPv4, 방치된 EBS 스냅샷이 조용히 돈을 먹는다. Cost Anomaly Detection(이상 비용 감지)을 켠다.\n\n**보안.** 액세스 키가 유출된 흔적이 있으면 즉시 비활성화하고 CloudTrail을 본다. CloudTrail은 API 호출 기록이다. 관리 이벤트 추적은 계정 초기에 켠다.\n\n**사람 계정.** 퇴사자 IAM 사용자와 키를 회수한다. 공유 사용자(`team` 하나)는 감사 추적이 안 된다. 사람마다 계정을 둔다.\n\n**알람 채널.** 예산 SNS 메일이 스팸함에 있으면 없는 것과 같다. SNS는 Simple Notification Service, 알림 버스다. 수신함을 확인한다.\n\n개발 계정과 프로덕션 계정을 나눌 수 있으면 나눈다. 같은 계정이면 태그·권한 경계로라도 환경을 구분한다.\n\n**CloudTrail.** 처음에는 관리 이벤트만 켜도 된다. S3 데이터 이벤트는 양이 많아 비용이 난다. 필요 버킷만 나중에 켠다. 로그 버킷은 다른 계정에 두면 계정 탈취 후에도 기록이 남는다.\n\n**흔한 과금.** 실험 EC2를 리전 두 곳에 켜 두고 잊기. Elastic IP를 인스턴스에서 떼고 보유. 프리 티어가 끝난 t2.micro. Marketplace AMI의 시간당 요금을 안 읽기. 청구서의 “처음 보는 줄”은 대부분 여기 있다.\n\n콘솔 오른쪽 위 계정 메뉴에서 IAM과 빌링이 다른 사람 계정으로 열려 있지 않은지 매일 한 번 본다. 프로필 혼선은 프로덕션을 개발로 착각하게 한다.\n\n조직이 커지면 IAM Identity Center(SSO)와 Organizations가 답이 된다. 이 글의 IAM 사용자는 그 전 단계다. 처음부터 SSO를 쓸 수 있으면 사용자 장기 키를 건너뛴다. 청구서는 여전히 루트 계정·멤버 계정 알람이 필요하다. 조직 관리 계정으로 매일 개발하지 않는다.\n\n---\n\n## 5. 정리\n\nAWS 시작의 정답은 서비스 개수가 아니다. **루트 보호, IAM, 비용 알람** 세 줄이다. 이 세 줄이 없으면 EC2·S3 튜토리얼은 위험 연습이 된다.\n\n### 체크리스트\n\n- [ ] 루트 MFA를 켠다. 루트만 있으면 계정 전체를 가져간다.\n- [ ] 루트 액세스 키가 없는지 확인한다. 장기 루트 키는 복구가 어렵다.\n- [ ] 일상 작업용 IAM(또는 SSO)과 MFA를 쓴다. 루트 일상 사용은 실수 범위가 계정 전체다.\n- [ ] 월 예산 알람을 켠다. 프리 티어는 과금 한도가 아니다.\n- [ ] `sts get-caller-identity`로 프로필이 기대한 계정인지 확인한다. 계정 혼선이 가장 흔한 사고다.\n\n### 연습\n\n1. IAM 사용자로만 콘솔에 들어가 루트 세션이 없는지 확인한다.\n2. Budgets에 작은 금액 알람을 만들고 테스트 메일이 오는지 본다.\n3. CLI 프로필을 만든 뒤 `get-caller-identity` 출력을 저장해 둔다.\n\n빌링 콘솔에서 확인할 항목:\n\n- IAM 사용자에게 `Billing` 조회가 허용돼 있는지(루트만 보이면 팀이 Blind다)\n- 결제 알림 메일이 실제 수신 주소인지\n- 리전 필터를 끄고 전 리전 비용을 한 번 보는지. 실험 리전이 청구서에 먼저 나타난다\n\n액세스 키를 만들어야 한다면 수명을 정한다. 90일 회전, 사용처 하나, 권한은 그 CLI가 하는 일만. 만든 키는 채팅에 붙여 넣지 않는다.\n\n비밀번호 정책을 IAM에 켠다. 최소 길이, 재사용 금지는 사람 계정용이다. 역할은 비밀번호가 없다. MFA 미등록 사용자가 콘솔에 못 들어가게 계정 기본값을 검토한다. 불편해도 루트 보호 다음으로 싸다.\n\n---\n"])</script><script>self.__next_f.push([1,"1f:T1e2b,"])</script><script>self.__next_f.push([1,"# VPC·서브넷·보안 그룹으로 네트워크 설계하기\n\n\u003e 요약: 가상 네트워크(VPC)에서 퍼블릭·프라이빗 서브넷과 보안 그룹으로 트래픽을 최소 허용하는 뼈대를 잡는다.\n\n---\n\n## 1. 언제 VPC를 직접 짜는가\n\nVPC는 Virtual Private Cloud, 계정 안의 **격리된 가상 네트워크**다. 기본 VPC로도 실험은 된다. 다만 앱·DB·로드밸런서를 오래 운영하려면 퍼블릭/프라이빗을 나눈 작은 설계가 필요하다.\n\n직접 짜는 경우:\n\n- 웹 앱 + 데이터베이스를 같은 계정에 둘 때\n- 인터넷에 열 것과 열지 않을 것을 구분해야 할 때\n- 보안 그룹으로 티어 간 포트를 제한해야 할 때\n\n기본 VPC에 전부 퍼블릭으로 올리는 구성은 튜토리얼용으로만 둔다. 실무 기본선은 **ALB만 퍼블릭, 앱과 DB는 프라이빗**이다. ALB는 Application Load Balancer, HTTP 로드밸런서다.\n\nCIDR이 회사 네트워크·다른 VPC와 겹치면 나중에 VPN·피어링이 고통이다. 팀 표준이 있으면 따른다. 없으면 `10.0.0.0/16`으로 시작하고 문서에 적는다. CIDR은 Classless Inter-Domain Routing, 주소 블록 표기다.\n\n---\n\n## 2. 핵심 개념\n\n**서브넷**은 VPC를 가용 영역(AZ)에 나눈 조각이다. AZ는 Availability Zone, 리전 안의 분리된 데이터센터 그룹이다. 한 AZ만 쓰면 그 AZ 장애에 전체가 멈춘다. 시작부터 서브넷을 두 AZ 이상에 둔다.\n\n| 구분 | 특징 | 예 |\n|------|------|-----|\n| 퍼블릭 서브넷 | 인터넷 게이트웨이(IGW) 경로, 공인 IP 가능 | ALB, NAT, 배스천 |\n| 프라이빗 서브넷 | 인터넷으로 직접 나가지 않음 | 앱 EC2, RDS |\n\nIGW는 Internet Gateway, VPC를 인터넷에 붙이는 문이다. 라우트 테이블에 `0.0.0.0/0 → IGW`가 있으면 그 서브넷은 퍼블릭 후보다. 인스턴스에 공인 IP가 있어야 실제로 열린다.\n\n**보안 그룹(SG)** 은 인스턴스·ENI에 붙는 방화벽이다. stateful이다. 들어온 응답은 나간다. 허용 규칙 위주로 쓴다. ENI는 Elastic Network Interface, 가상 망 카드다.\n\n**NACL**은 Network ACL, 서브넷 방화벽이다. stateless다. 실무에서는 SG를 주 통제로 두고, NACL은 기본 allow로 두는 경우가 많다. 둘 다 막으면 디버깅이 어렵다.\n\n**NAT Gateway**는 프라이빗에서 아웃바운드(패키지 설치, 외부 API)를 낼 때 쓴다. 편하지만 시간당·데이터 요금이 난다. S3·DynamoDB는 VPC 엔드포인트가 더 싸거나 더 안전한 경우가 많다.\n\n---\n\n## 3. 최소 뼈대 예\n\n리전 하나, AZ 두 개.\n\n```\nVPC  10.0.0.0/16\n  public-a   10.0.0.0/24     AZ-a   ← ALB, NAT\n  public-b   10.0.1.0/24     AZ-b\n  private-a  10.0.10.0/24    AZ-a   ← 앱, RDS\n  private-b  10.0.11.0/24    AZ-b\n```\n\n보안 그룹은 CIDR을 넓게 열지 않는다. **소스에 다른 SG ID**를 넣는다.\n\n```\nALB SG  : 0.0.0.0/0 → 443만\nApp SG  : ALB SG   → 앱 포트(예: 8080)\nDB SG   : App SG   → 5432 또는 3306\n```\n\nSSH(22)를 `0.0.0.0/0`으로 열지 않는다. 운영 접속은 SSM Session Manager를 우선한다. SSM은 AWS Systems Manager다. 꼭 SSH가 필요하면 배스천 SG만, 내 IP만 잠시 연다.\n\n확인 명령 예:\n\n```bash\naws ec2 describe-vpcs --query \"Vpcs[].{id:VpcId,cidr:CidrBlock}\"\naws ec2 describe-security-groups --group-ids sg-YOUR_APP_SG\n```\n\n기본 라우트와 IGW 연결을 콘솔에서 한 번 눈으로 본다. 서브넷이 퍼블릭인데 라우트가 없으면 ALB가 안 뜬다.\n\n---\n\n## 4. 운영 시 주의\n\n**연결.** 앱이 DB에 못 붙으면 대부분 SG·서브넷·라우트다. 포트만 열고 소스가 `0.0.0.0/0`이면 보안이 빈 것이다. 반대로 소스를 인스턴스 IP로 고정하면 스케일 때 깨진다. SG ID를 쓴다.\n\n**비용.** NAT Gateway는 AZ마다 두면 고가용과 함께 요금이 는다. 개발은 NAT 하나 또는 VPC 엔드포인트로 줄인다. 트래픽이 많은 로그 업로드는 NAT를 거치지 않게 S3 엔드포인트를 검토한다.\n\n**보안.** 퍼블릭 서브넷에 RDS를 두지 않는다. 퍼블릭 액세스 체크를 끈다. 관리형 DB·캐시도 프라이빗 서브넷 + SG.\n\n**IP 고갈.** `/24`는 251개 근처다. ENI·로드밸런서가 주소를 먹는다. 앱이 커질 것 같으면 서브넷을 넉넉히 잡는다. 나중에 바꾸기 어렵다.\n\n**피어링·PrivateLink.** 다른 VPC와 붙일 때 CIDR 겹침을 먼저 본다. 막 피어링하고 SG를 전부 열지 않는다.\n\n**기본 VPC.** 계정에 기본 VPC가 있다. 빠르게 실험할 수는 있다. CIDR이 `172.31.0.0/16`인 경우가 많고, 퍼블릭 서브넷 위주다. 팀 서비스는 커스텀 VPC를 만들고 기본 VPC는 쓰이지 않게 표시한다. 기본 보안 그룹의 `자기 자신 전체 허용`을 앱 규칙으로 오해하지 않는다.\n\n**VPC Flow Logs.** ENI 트래픽 허용/거부를 S3 또는 CloudWatch에 남긴다. 디버깅에 도움이 된다. 전 트래픽·전 서브넷을 상시 켜면 로그 비용이 난다. 의심 구간만, 보존을 짧게.\n\n**DNS.** VPC 안에서 RDS·ALB 이름은 Route 53 private hosted zone 또는 AWS 제공 DNS로 푼다. 인스턴스 IP를 앱 설정에 하드코딩하면 재시작·페일오버 때 깨진다.\n\n---\n\n## 5. 정리\n\n네트워크는 “일단 다 연다”가 아니다. **계층(퍼블릭/프라이빗) + SG 최소 허용**으로 시작한다. 두 AZ, ALB만 인터넷, DB는 앱 SG만 허용이면 초반 설계로는 충분하다.\n\n### 체크리스트\n\n- [ ] VPC CIDR과 서브넷을 문서에 남긴다. 겹치면 나중에 VPN이 실패한다.\n- [ ] 퍼블릭/프라이빗을 나누고 앱·DB는 프라이빗에 둔다. 공인 IP 앱 서버는 공격면이 넓다.\n- [ ] SG 소스에 다른 SG ID를 쓴다. `0.0.0.0/0` DB 포트는 사고다.\n- [ ] 22번을 인터넷에 상시 열지 않는다. SSM이 더 안전하다.\n- [ ] NAT·엔드포인트 비용을 알고 켠다. 개발 계정에서 NAT만으로 월 요금이 나올 수 있다.\n\n### 연습\n\n1. 위 주소 계획으로 서브넷 네 개를 그리고 어떤 자원이 어디에 가는지 적는다.\n2. ALB → 앱 → DB SG 규칙을 표로 만든다. 인터넷이 DB에 직접 닿는지 검사한다.\n3. `describe-security-groups`로 실제 인바운드가 의도한 소스인지 확인한다.\n\n라우트 테이블을 말로 적으면 실수가 줄어든다.\n\n| 서브넷 | 목적지 | 타깃 |\n|--------|--------|------|\n| public-* | 10.0.0.0/16 | local |\n| public-* | 0.0.0.0/0 | igw-… |\n| private-* | 10.0.0.0/16 | local |\n| private-* | 0.0.0.0/0 | nat-… (필요할 때만) |\n\n프라이빗에 IGW를 붙이면 그 순간 퍼블릭과 다를 바 없다. NAT 없이 프라이빗이 패키지를 못 받는 것은 정상이다. 그때 엔드포인트나 잠시 퍼블릭 실험 서브넷을 쓴다. 운영 DB는 실험 서브넷에 두지 않는다.\n\nIPv4만으로 시작해도 된다. 퍼블릭 IPv4 주소는 이제 시간당 요금이 있다. ALB·NAT가 주소를 들고 있으면 컴퓨트와 별도로 나온다. IPv6는 팀 준비가 되면 추가한다. 처음부터 듀얼 스택을 강제할 필요는 없다.\n\n보안 그룹은 인바운드만 신경 쓰다 아웃바운드 `0.0.0.0/0`을 잊는다. 기본 전 허용이면 인스턴스가 아무 곳으로나 나간다. 민감 환경은 아웃바운드도 443·DB 포트처럼 필요한 것만 연다.\n\n배스천을 둘 때 배스천 서브넷만 퍼블릭으로 두고, 배스천 SG는 내 IP 또는 VPN만 22에 허용한다. 배스천에서 앱 SG로 SSH가 열리면 앱은 여전히 인터넷에 안 열린다. 배스천 OS 패치를 앱과 같은 주기로 본다.\n\n---\n\n---\n"])</script><script>self.__next_f.push([1,"20:T1e2e,"])</script><script>self.__next_f.push([1,"# EC2 인스턴스 기초와 운영 포인트\n\n\u003e 요약: 가상 서버(EC2)를 고르고 올리는 과정과, 키·스토리지·접속 경로를 안전하게 운영하는 기본을 정리한다.\n\n---\n\n## 1. 언제 EC2인가\n\nEC2는 Elastic Compute Cloud, AWS의 가상 서버다. OS를 고르고, 패키지를 깔고, 프로세스를 직접 운영할 때 쓴다.\n\n| 맞는 경우 | 덜 맞는 경우 |\n|-----------|--------------|\n| 커스텀 런타임·에이전트가 필요할 때 | 컨테이너만으로 충분하고 ECS/Fargate가 맞을 때 |\n| 기존 VM 운영 방식이 팀에 익숙할 때 | 요청 단위 실행이면 Lambda가 더 단순할 때 |\n| GPU·특수 인스턴스 패밀리가 필요할 때 | 정적 사이트면 S3+CloudFront면 충분할 때 |\n| 장시간 프로세스, 특수 라이선스 소프트웨어 | 관리형 데이터베이스만 필요할 때 (RDS) |\n\n“서버 한 대”로 시작해도 된다. 다만 역할·보안 그룹·스토리지·접속 경로를 세트로 본다. 공인 IP에 SSH를 열어 두는 구성은 데모에서 끝낸다.\n\n---\n\n## 2. 핵심 개념\n\n**AMI**는 Amazon Machine Image, 부팅 템플릿이다. Amazon Linux 2023 또는 Ubuntu LTS가 무난하다. 출처 불명 AMI는 쓰지 않는다.\n\n**인스턴스 타입**은 CPU·메모리 묶음이다. 실험은 `t3.micro` 또는 프리 티어 해당 타입으로 시작한다. 부하는 측정 후에 키운다. 감으로 `c6i.2xlarge`를 켜지 않는다.\n\n**키 페어**는 SSH용 공개키/비밀키다. 비밀키(`.pem`)는 로컬에만 둔다. 저장소·슬랙에 올리지 않는다. 가능하면 SSH 대신 **Systems Manager Session Manager**를 쓴다. 인스턴스에 퍼블릭 22를 안 열어도 된다.\n\n**인스턴스 프로필**은 EC2에 붙인 IAM 역할이다. 액세스 키를 서버에 파일로 두지 않는다. S3 읽기가 필요하면 역할에 `s3:GetObject`만 준다.\n\n**EBS**는 Elastic Block Store, 인스턴스에 붙는 디스크다. `gp3`, 암호화 기본이 실무선이다. 인스턴스 스토어는 휘발성이다. 중요 데이터를 두지 않는다.\n\n**유저 데이터**는 최초 부팅 스크립트다. 비밀을 여기에 평문으로 넣지 않는다. 시크릿은 IAM + Secrets Manager 또는 SSM Parameter Store다.\n\n태그는 선택이 아니다. `Name`, `Env`, `Owner`, `Project`를 붙인다. 비용과 정리의 단위다.\n\n---\n\n## 3. 최소 생성 흐름\n\n1. IAM 역할: `AmazonSSMManagedInstanceCore`를 붙인 인스턴스 프로필\n2. 보안 그룹: 앱 포트는 ALB SG만. 22는 닫거나 내 IP만 임시\n3. 서브넷: 가능하면 프라이빗. 아웃바운드는 NAT 또는 엔드포인트\n4. 스토리지: gp3, 암호화, 필요한 크기만\n5. 태그: `Name=app-dev`, `Env=dev`\n6. 종료 보호는 프로덕션에서 검토\n\n```bash\naws ec2 describe-instances --filters Name=tag:Env,Values=dev \\\n  --query \"Reservations[].Instances[].{id:InstanceId,st:State.Name,az:Placement.AvailabilityZone}\"\n```\n\nSSM 접속 개념:\n\n```bash\naws ssm start-session --target i-YOUR_INSTANCE_ID\n```\n\n유저 데이터에는 패키지·에이전트만. 예시는 비밀이 없다.\n\n```bash\n#!/bin/bash\ndnf update -y\n# 앱 설치는 이미지 베이킹 또는 배포 파이프라인에서\n```\n\n이미지를 매번 손으로 고치지 않는다. 변경은 AMI를 새로 굽거나, 구성 관리로 재현한다. “프로덕션만 손 수정”은 다음 장애의 원인이다.\n\n---\n\n## 4. 운영 시 주의\n\n**접속.** 키 페어를 분실하면 기본 AMI로는 회수가 어렵다. SSM이 있으면 키 분실 영향이 작다. 배스천을 둘 거면 배스천도 패치·SG·로그를 운영 대상에 넣는다.\n\n**백업.** EBS 스냅샷을 주기적으로 뜬다. DLM(Data Lifecycle Manager)으로 수명을 정한다. 스냅샷만 쌓이면 비용이 는다. 복원 테스트를 한 번 한다. 루트 볼륨만 믿고 DB 파일을 EC2 로컬에 두면 RDS를 쓰는 편이 낫다.\n\n**비용.** 중지(Stop)는 EBS 요금이 남는다. 종료(Terminate)는 볼륨 삭제 옵션을 확인한다. 탄력적 IP를 인스턴스에 안 붙이고 들고 있으면 과금된다. 개발 인스턴스는 스케줄 중지를 검토한다.\n\n**보안.** 퍼블릭 IP + 열린 22 + 약한 사용자는 수 분 안에 스캔 대상이다. IMDSv2를 요구하는 설정이 기본에 가깝다. IMDS는 인스턴스 메타데이터 서비스다. 역할 자격이 앱 버그로 새지 않게 한다.\n\n**관측.** CPU 크레딧(T 계열), 상태 체크 실패, 디스크 사용률 알람을 단다. 메모리·디스크는 CloudWatch 에이전트가 필요할 수 있다.\n\n**패치.** 보안 업데이트를 미루지 않는다. 오토스케일 그룹이면 새 AMI로 롤링하는 편이 재현 가능하다.\n\n**IMDSv2.** 인스턴스 메타데이터는 역할 자격을 앱에 건네는 통로다. SSRF로 IMDS를 읽으면 키가 샌다. hop limit과 IMDSv2 필수 옵션을 시작 템플릿에 넣는다. 구형 에이전트가 깨지면 그때만 예외를 문서화한다.\n\n**종료 vs 중지.** 중지는 과금이 줄지만 EBS는 남는다. 종료는 실수 삭제가 난다. 프로덕션은 종료 보호. 개발은 태그 `Keep=false`면 주기 스크립트가 지우게 할 수 있다. 스크립트는 dry-run을 먼저 한다.\n\n**스팟.** 가격이 싸지만 회수된다. 상태 없는 워커·CI에만 검토한다. 데이터베이스와 세션 원본은 온디맨드다.\n\n---\n\n## 5. 정리\n\nEC2는 가상머신이 아니다. **역할·SG·스토리지·접속 경로**를 세트로 설계한 컴퓨트다. SSH를 인터넷에 상시 열지 않고, 키 대신 역할, 로컬 디스크 대신 스냅샷·관리형 DB를 기본으로 둔다.\n\n### 체크리스트\n\n- [ ] IAM 인스턴스 프로필을 붙인다. 서버에 액세스 키 파일을 두지 않는다.\n- [ ] SSM을 우선하고 22번 상시 오픈을 피한다. 공개 SSH는 무차별 대입 대상이다.\n- [ ] EBS 암호화를 켠다. 스냅샷에도 암호화가 이어지게 한다.\n- [ ] `Name`/`Env`/`Owner` 태그를 단다. 태그 없는 인스턴스는 비용 추적에서 실종된다.\n- [ ] 스냅샷 주기와 개발 인스턴스 중지 정책을 정한다. 켜 둔 채 잊으면 요금만 남는다.\n\n### 연습\n\n1. SSM 역할만으로 인스턴스를 올리고 퍼블릭 22 없이 세션이 되는지 확인한다.\n2. `describe-instances`를 태그 필터로 실행해 목록이 비지 않는지 본다.\n3. 스냅샷을 하나 뜨고, 새 볼륨으로 복원해 파일이 있는지 확인한다.\n\n시작 템플릿에 넣을 최소 IAM·스토리지 메모:\n\n- 역할: SSM + 앱이 필요한 S3 읽기만. `AmazonS3FullAccess` 금지\n- 루트 볼륨: 20–30 GiB gp3로 시작. 로그가 디스크를 먹기 전에 CloudWatch로 보낸다\n- 퍼블릭 IP: 프라이빗 서브넷이면 자동 할당 끄기\n\n인스턴스가 `running`인데 SSM이 안 되면 대부분 역할, 서브넷 아웃바운드(443), SSM 엔드포인트 세 가지다. 22를 열어서 우회하지 말고 그 셋을 고친다.\n\nCPU 크레딧이 떨어진 T 계열은 갑자기 느려진다. 개발은 참을 수 있다. 프로덕션 API에 burstable만 두고 알람이 없으면 원인 찾기가 늦다. 부하 테스트를 한 뒤에 고정 성능 패밀리로 바꿀지 정한다.\n\n키 페어를 팀 공유 폴더에 두지 않는다. 사람마다 SSM과 IAM이 있다. `.pem`이 슬랙에 올라가면 그 키로 열리는 인스턴스는 모두 오염으로 본다.\n\nCloudWatch 에이전트 설치를 유저 데이터에 넣을 수 있다. 다만 시크릿은 넣지 말고, 역할로 메트릭을 보낸다. 디스크 90% 알람이 없으면 로그가 루트를 채운 뒤에야 접속이 실패한다.\n\n---\n\n---\n"])</script><script>self.__next_f.push([1,"21:T1b46,"])</script><script>self.__next_f.push([1,"# S3 버킷·접근 제어·수명주기\n\n\u003e 요약: 객체 스토리지(S3)를 퍼블릭 차단·최소 IAM·수명주기로 안전하게 쓰는 기본선을 정리한다.\n\n---\n\n## 1. 언제 S3인가\n\nS3는 Simple Storage Service, 객체 스토리지다. 파일을 경로처럼 보이지만 실제는 버킷 + 키다. 무제한에 가깝게 늘리고, HTTP로 읽고 쓴다.\n\n| 맞는 경우 | 덜 맞는 경우 |\n|-----------|--------------|\n| 업로드 이미지, 백업, 로그, 정적 자산 | 자주 바꾸는 운영체제 디스크 (EBS) |\n| 데이터 레이크, 덤프, 산출물 보관 | 밀리초 단위 키-값 캐시 (Redis) |\n| CloudFront 앞단 정적 웹 | 관계형 조회·트랜잭션 (RDS) |\n| 다른 리전 복제로 DR | 동시에 같은 파일을 락 잡고 쓰는 공유 디스크 |\n\n기본 원칙은 한 줄이다. **버킷은 비공개로 만들고, 필요할 때만 앞단을 연다.** Block Public Access를 끄고 “일단 퍼블릭 읽기”는 유출 사고의 정석이다. 정적 웹이 필요하면 CloudFront + OAC를 검토한다. OAC는 Origin Access Control, CDN만 원본을 읽게 하는 장치다.\n\n---\n\n## 2. 핵심 개념\n\n**버킷**은 리전 단위 컨테이너다. 이름은 전역에서 유일하다. 추측하기 쉬운 이름 + 민감 파일은 스캔 대상이다.\n\n**객체 키**는 `logs/2026/08/app.json` 같은 문자열이다. 폴더처럼 보이지만 prefix일 뿐이다.\n\n**권한 세 겹.**\n\n| 방식 | 용도 |\n|------|------|\n| IAM 정책 | 누가(역할/사용자) 무엇을 |\n| 버킷 정책 | 이 버킷 리소스에 대한 정책 |\n| ACL | 레거시. 신규 버킷은 ACL 끄기가 기본 |\n\n앱은 **IAM 역할**로 `s3:GetObject` / `PutObject`만 연다. `Resource`를 `arn:aws:s3:::YOUR_BUCKET/*`처럼 버킷으로 좁힌다. `*` 버킷 와일드카드는 피한다.\n\n**암호화.** SSE-S3(S3 관리 키) 또는 SSE-KMS. KMS는 Key Management Service다. 민감하면 KMS + 키 정책으로 누가 쓰는지 남긴다.\n\n**버전 관리.** 덮어쓰기·삭제 실수에서 이전 버전을 남긴다. 용량이 늘므로 수명주기와 세트로 켠다.\n\n**수명주기(Lifecycle).** 오래된 로그를 삭제하거나 Glacier로 내린다. Glacier는 저렴한 아카이브 계층이다. 복원에 시간이 걸린다.\n\n---\n\n## 3. 최소 예제 — 비공개 업로드\n\n앱이 사용자 업로드를 받는다고 가정한다. 브라우저에 액세스 키를 심지 않는다. 서버(또는 서명 URL)가 넣는다.\n\n버킷 정책 예. 퍼블릭 허용이 아니다. CloudFront OAC 전제는 별도 문서의 ARN으로 좁힌다.\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"AllowAppRolePut\",\n      \"Effect\": \"Allow\",\n      \"Principal\": {\n        \"AWS\": \"arn:aws:iam::YOUR_ACCOUNT_ID:role/app-api-role\"\n      },\n      \"Action\": [\"s3:PutObject\", \"s3:GetObject\"],\n      \"Resource\": \"arn:aws:s3:::app-uploads-prod/*\"\n    }\n  ]\n}\n```\n\n수명주기 규칙 예:\n\n```json\n{\n  \"Rules\": [{\n    \"ID\": \"expire-old-logs\",\n    \"Status\": \"Enabled\",\n    \"Filter\": { \"Prefix\": \"logs/\" },\n    \"Expiration\": { \"Days\": 90 }\n  }]\n}\n```\n\nCLI 확인. 자격은 역할 또는 로컬 프로필. 키 값은 적지 않는다.\n\n```bash\naws s3api get-public-access-block --bucket app-uploads-prod\naws s3 ls s3://app-uploads-prod/logs/ --profile work\n```\n\n`BlockPublicAcls`·`RestrictPublicBuckets`가 true인지 본다. false면 이유가 문서에 있어야 한다.\n\n서명 URL은 만료를 짧게 둔다. 만료 없는 퍼블릭 객체로 우회하지 않는다. 서버가 SDK로 서명을 만들고, 브라우저는 그 URL로만 PUT/GET 한다. 만료는 분 단위가 안전하다.\n\n업로드 용량 상한과 Content-Type을 앱에서 검사한다. S3는 시킨 대로 저장할 뿐이다. 실행 가능한 파일을 공개 prefix에 두면 다른 사고의 시작이다.\n\n---\n\n## 4. 운영 시 주의\n\n**보안.** 개발 편의로 퍼블릭 읽기를 켜지 않는다. 액세스 키를 프론트·모바일 앱에 넣지 않는다. 오픈된 버킷은 검색 엔진과 봇이 먼저 찾는다.\n\n**비용.** 저장 단가는 낮고 요청 수·트래픽·잘못된 LIST가 비용을 만든다. 로그를 무기한 두면 용량이 선형으로 는다. 수명주기를 첫날 켠다. Intelligent-Tiering은 접근 패턴이 제각각일 때 검토한다.\n\n**백업.** 버전 관리 + 다른 리전 복제는 DR용이다. “버킷 하나 = 원본”이면 계정 사고에 같이 죽는다. 중요 백업은 별도 계정·리전을 검토한다.\n\n**실수 방지.** MFA Delete, 오브젝트 잠금은 규제 데이터에 검토한다. `aws s3 rm` recursive는 프로덕션에서 보호한다.\n\n**명명.** 환경별로 버킷을 나눈다. `app-uploads-dev`와 `app-uploads-prod`를 같은 정책으로 묶지 않는다.\n\n**접근 로그.** 서버 액세스 로그 또는 CloudTrail 데이터 이벤트로 “누가 객체를 읽었는지”를 남긴다. 전 버킷 데이터 이벤트는 비용이 난다. 민감 버킷만 켠다.\n\n**CORS.** 브라우저에서 다른 도메인이 버킷에 붙으면 CORS가 필요하다. `*` 오리진은 개발용이다. 프로덕션은 사이트 도메인만. CORS를 연 것과 퍼블릭 객체를 연 것은 다르다. CORS만으로 익명 읽기가 되지는 않는다.\n\n---\n\n## 5. 정리\n\nS3는 편하다. 그래서 **퍼블릭 차단 + 최소 IAM + 수명주기**를 기본값으로 둔다. 웹에 파일을 보여 줄 때는 버킷을 열지 말고 CDN 뒤에서 연다.\n\n### 체크리스트\n\n- [ ] Block Public Access를 켠 채로 둔다. 기본 공개는 유출이다.\n- [ ] 앱은 IAM 역할로 특정 버킷·액션만 허용한다. 키를 프론트에 심지 않는다.\n- [ ] 버전 관리 또는 수명주기 중 운영 목적을 정한다. 무한 보관은 비용이다.\n- [ ] 암호화(SSE-S3 또는 KMS)를 기본으로 둔다.\n- [ ] `get-public-access-block`으로 공개 여부를 주기적으로 확인한다.\n\n### 연습\n\n1. 비공개 버킷을 만들고 역할로만 `PutObject`가 되는지 확인한다. 브라우저 익명 GET이 거절되어야 한다.\n2. `logs/` prefix 90일 삭제 규칙을 적용하고 콘솔에서 규칙이 보이는지 본다.\n3. Block Public Access 네 항목이 모두 켜져 있는지 CLI로 출력한다.\n\n정적 사이트라도 버킷 정책을 `Principal: \"*\"` `s3:GetObject`로 여는 구성을 기본으로 두지 않는다. 옛날 튜토리얼이 많다. CloudFront OAC가 표준에 가깝다. 꼭 버킷 웹 호스팅을 쓰면 개인정보·백업 prefix는 그 버킷에 넣지 않는다. 사이트용과 업로드용을 나눈다.\n\n멀티파트 업로드가 실패하면 불완전 파트가 요금을 남긴다. 수명주기에서 미완료 업로드를 며칠 뒤 지운다. 큰 영상·덤프를 쓰는 버킷이면 특히 그렇다.\n\n객체 키에 사용자 입력을 그대로 넣지 않는다. `../`와 이상한 문자는 앱에서 걸러 키를 `uploads/{userId}/{uuid}`처럼 만든다.\n\n---\n"])</script><script>self.__next_f.push([1,"22:T1d4d,"])</script><script>self.__next_f.push([1,"# RDS로 관리형 데이터베이스 운영하기\n\n\u003e 요약: 관리형 관계형 DB(RDS)를 프라이빗 서브넷·백업·멀티 AZ로 안전하게 올리는 기준을 정리한다.\n\n---\n\n## 1. 언제 RDS인가\n\nRDS는 Relational Database Service, AWS가 패치·백업·페일오버를 대신하는 관계형 DB다. EC2에 Postgres를 직접 깔 수도 있다. 그때는 OS 패치·디스크·복제가 전부 내 일이다. 그 운영을 맡기고 싶을 때 RDS가 맞다.\n\n| 엔진 | 흔한 선택 |\n|------|-----------|\n| PostgreSQL | 일반 웹/API, JSON·제약 |\n| MySQL / MariaDB | 레거시, 워드프레스 |\n| Aurora | 읽기 확장·고가용 요구가 클 때 |\n| SQL Server 등 | 기존 라이선스·호환이 필요할 때 |\n\nAurora는 RDS 계열의 클라우드 최적화 엔진이다. 비용·호환을 보고 고른다. “일단 Aurora”가 항상 답은 아니다.\n\nEC2 자체 설치가 나은 경우도 있다. 특수한 확장, 세밀한 커널 튜닝, RDS가 지원하지 않는 버전. 그 대가는 백업과 장애 훈련이다.\n\n---\n\n## 2. 핵심 개념\n\n**DB 서브넷 그룹.** RDS ENI가 들어갈 프라이빗 서브넷 묶음이다. 두 AZ 이상을 넣는다. 퍼블릭 서브넷에 두면 실수로 공인 접근이 열리기 쉽다.\n\n**퍼블릭 액세스.** 기본은 끈다. 로컬에서 붙을 때는 배스천, SSM 포트 포워딩, VPN을 쓴다. `0.0.0.0/0`으로 3306/5432를 열지 않는다.\n\n**보안 그룹.** DB SG 인바운드는 앱 SG만. 내 노트북 CIDR을 상시 열어 두지 않는다.\n\n**파라미터 그룹.** `max_connections`, 로그 설정 등 엔진 파라미터. 기본 그룹을 직접 수정하지 말고 복사본을 문서화한다.\n\n**멀티 AZ.** 동기 대기 인스턴스가 다른 AZ에 있다. 장애 시 DNS가 넘어간다. 프로덕션 권장이다. 개발은 비용 때문에 단일 AZ가 흔하다.\n\n**자동 백업과 스냅샷.** 보존 기간을 합의한다. 백업 윈도우에 부하가 있다. 스냅샷을 수동으로만 믿고 자동 백업을 끄지 않는다.\n\n**스토리지.** gp3 + 자동 확장을 검토한다. 디스크가 가득 차면 쓰기가 멈춘다. `FreeStorageSpace` 알람은 필수에 가깝다.\n\n마스터 비밀번호는 콘솔에 한 번 넣고, 앱은 Secrets Manager에서 읽는다. 글에는 `YOUR_DB_PASSWORD`만 쓴다.\n\n---\n\n## 3. 최소 구성 예\n\n웹 API용 PostgreSQL을 가정한다.\n\n1. 프라이빗 서브넷 두 개로 서브넷 그룹 생성\n2. DB SG: 앱 SG → 5432\n3. 엔진 PostgreSQL, 작은 클래스(개발 `t4g.micro` 등). 프로덕션은 부하 측정 후\n4. 퍼블릭 액세스 끄기, 암호화 켜기\n5. 자동 백업 7일(합의), 멀티 AZ는 프로덕션만\n6. 삭제 보호는 프로덕션에서 켜기\n\n연결은 앱만. 호스트는 RDS 엔드포인트다.\n\n```\npostgresql://APP_USER:YOUR_DB_PASSWORD@app-db.REGION.rds.amazonaws.com:5432/app\n```\n\n앱 사용자는 마스터가 아니다. `APP_USER`에 해당 DB만 GRANT한다.\n\n확인:\n\n```bash\naws rds describe-db-instances \\\n  --query \"DBInstances[].{id:DBInstanceIdentifier,az:AvailabilityZone,multi:MultiAZ,pub:PubliclyAccessible}\"\n```\n\n`PubliclyAccessible`가 `true`이면 이유가 있어야 한다. 보통은 `false`다.\n\n마이그레이션은 앱 파이프라인에서 돌린다. RDS가 스키마를 대신 짜 주지 않는다. Flyway·Prisma 등은 연결만 RDS를 가리킨다.\n\n---\n\n## 4. 운영 시 주의\n\n**연결.** 앱 풀 × 인스턴스 수가 `max_connections`를 넘기면 장애다. RDS 프록시나 PgBouncer는 서버리스·다수 태스크일 때 검토한다. 유휴 연결을 너무 길게 두지 않는다.\n\n**백업.** 자동 백업 + 스냅샷 보존을 비용과 함께 본다. 스냅샷이 쌓이면 스토리지 요금이 난다. 복원을 스테이징에서 한 번 한다. 암호화된 스냅샷 복원은 키 권한도 필요하다.\n\n**비용.** 인스턴스 클래스보다 먼저 슬로우 쿼리와 인덱스를 본다. 개발은 야간 중지(가능한 엔진·구성)를 쓴다. Aurora I/O·스토리지는 모델이 다르다. 견적을 읽고 켠다. 멀티 AZ는 거의 두 대 요금이다. 가치와 같이 설명한다.\n\n**보안.** 마스터 계정을 앱에 넣지 않는다. 마이너 버전 자동 업데이트를 윈도우와 함께 켠다. 메이저 업은 호환 테스트를 한다.\n\n**성능.** CPU만 보지 않는다. IOPS, 커넥션, 레플리카 지연을 CloudWatch에 둔다. 읽기 레플리카는 비동기라 “방금 쓴 행”이 없을 수 있다.\n\n**삭제.** 종료 시 최종 스냅샷 옵션을 확인한다. 실수로 지운 DB는 백업 보존 안에만 살릴 수 있다.\n\n**메이저 업그레이드.** RDS가 블루/그린 배포를 지원하는 엔진이 있다. 그래도 앱 SQL 호환을 스테이징에서 먼저 본다. 파라미터 그룹 값이 메이저 버전과 안 맞으면 인스턴스가 안 뜬다.\n\n**로컬 접속.** 개발자가 집에서 직접 붙이려면 SSM 포트 포워딩이 안전하다. 보안 그룹에 집 IP를 매주 갈아 끼우는 운영은 구멍이 남는다. 배스천을 둘 거면 배스천도 패치 대상이다.\n\n**흔한 실수.** 퍼블릭 액세스 + 약한 마스터 암호, 스토리지 알람 없음, 개발 RDS를 멀티 AZ로 켜 두고 비용 놀람. 세 가지는 첫 달에 자주 난다.\n\n---\n\n## 5. 정리\n\nRDS는 “DB 설치”가 아니다. **프라이빗 배치 · SG · 백업 · 멀티 AZ**를 세트로 계약하는 일이다. 쿼리와 연결 수는 여전히 앱 책임이다.\n\n### 체크리스트\n\n- [ ] 퍼블릭 액세스를 끈다. 인터넷에 열린 5432/3306은 스캔 대상이다.\n- [ ] DB SG 소스는 앱 SG뿐이다. 노트북 CIDR 상시 개방은 구멍이 된다.\n- [ ] 자동 백업을 켜고 복원을 한 번 연습한다. 찍기만 한 백업은 백업이 아니다.\n- [ ] 스토리지 부족 알람을 단다. 디스크 풀은 즉시 장애다.\n- [ ] 앱은 마스터가 아닌 최소 권한 사용자로 붙는다.\n\n### 연습\n\n1. `describe-db-instances`로 `PubliclyAccessible`와 `MultiAZ`를 확인한다.\n2. 보안 그룹 인바운드가 앱 SG만인지 콘솔에서 대조한다.\n3. 스냅샷을 스테이징으로 복원해 앱이 읽기만 되는지 시험한다.\n\n읽기 레플리카는 조회를 나누려 할 때 추가한다. 쓰기는 여전히 프라이머리만. 복제 지연 메트릭을 알람에 넣는다. 레플리카를 하나 더 켜는 비용이 인덱스 하나보다 비쌀 때가 많다. 슬로우 쿼리를 먼저 고친다.\n\n개발 DB 식별자에 `dev`를 넣고, 프로덕션 스냅샷을 개발에 복원할 때 데이터를 마스킹할지 정한다. 원본 고객 이메일이 개발 계정에 그대로 있으면 그 계정의 IAM이 곧 개인정보 범위다.\n\nRDS Proxy는 연결 폭주(Lambda, 많은 ECS 태스크)에 검토한다. 프록시 자체 요금이 있다. 커넥션 10개짜리 앱 하나면 필요 없다. `too many connections`가 반복되면 그때 견적을 본다.\n\n엔진 업그레이드 알림 메일을 무시하지 않는다. 강제 마이너 패치 윈도우에 재시작이 있을 수 있다. 멀티 AZ면 페일오버로 짧아질 수 있다. 그래도 배포 캘린더에 적는다.\n\n스토리지 자동 확장은 한도를 둔다. 무한 확장은 무한 청구다. 테이블이 비대해지면 확장이 아니라 아카이브·파티션을 본다. `FreeableMemory`가 항상 바닥이면 클래스만 키우지 말고 슬로우 쿼리를 먼저 본다.\n\n---\n\n---\n"])</script><script>self.__next_f.push([1,"23:T1650,"])</script><script>self.__next_f.push([1,"# IAM 역할과 최소 권한 설계\n\n\u003e 요약: 사람·워크로드에 임시 역할만 맡기고, 정책의 Action과 Resource를 좁혀 최소 권한을 설계하는 방법을 정리한다.\n\n---\n\n## 1. 언제 역할을 쓰는가\n\nIAM은 계정 안의 출입문이다. 사용자에게 장기 키를 나눠 주는 방식은 유출과 회수가 어렵다. **역할(Role)** 을 맡으면 STS가 짧은 자격을 준다. STS는 Security Token Service다.\n\n역할을 쓰는 경우:\n\n- EC2, ECS 태스크, Lambda가 S3·RDS 시크릿에 접근할 때\n- GitHub Actions 등 CI가 배포할 때 (OIDC로 Assume)\n- 사람이 프로덕션에 들어갈 때 (SSO 또는 역할 전환 + MFA)\n\n장기 액세스 키가 남는 경우:\n\n- 로컬 실험용 IAM 사용자 키. 범위 최소, 회전, 저장소 금지\n- 레거시 도구가 역할 Assume을 못할 때. 마이그레이션 대상으로 표시\n\n루트 키는 해당 없다. 발급하지 않는다.\n\n---\n\n## 2. 핵심 개념\n\n| 용어 | 의미 |\n|------|------|\n| User | 사람 또는 장기 자격 |\n| Role | 신뢰 정책 + 권한 정책. 맡는 대상이 정해져 있다 |\n| Policy | Allow/Deny 문서. 관리형 또는 고객 관리형 |\n| Trust policy | 누가 이 역할을 맡을 수 있는지 |\n| Permissions boundary | 역할이 넘을 수 없는 상한 |\n| STS | 임시 자격 발급 |\n\n정책의 핵심은 네 칸이다. Effect, Action, Resource, Condition. 최소 권한은 **Action과 Resource를 좁히는 일**이다.\n\n관리형 `AdministratorAccess`는 학습용 계정에서도 짧게만 쓴다. `AmazonS3FullAccess`도 모든 버킷이다. 앱에는 과하다.\n\n신뢰 정책이 느슨하면 아무 계정의 역할이 우리 역할을 맡는다. `Principal`을 구체 ARN으로 둔다. `sts:ExternalId`나 OIDC `sub` 조건을 CI에 건다.\n\n---\n\n## 3. 최소 예제 — 앱이 한 버킷만 읽기\n\nEC2/ECS 역할에 붙이는 권한 정책이다. 버킷 이름은 플레이스홀더다.\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"ReadAppAssets\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\"s3:GetObject\"],\n      \"Resource\": \"arn:aws:s3:::app-assets-prod/*\"\n    },\n    {\n      \"Sid\": \"ListPrefix\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\"s3:ListBucket\"],\n      \"Resource\": \"arn:aws:s3:::app-assets-prod\",\n      \"Condition\": {\n        \"StringLike\": {\n          \"s3:prefix\": [\"public/*\"]\n        }\n      }\n    }\n  ]\n}\n```\n\n`s3:*`와 `Resource: \"*\"`를 같이 주지 않는다. `iam:PassRole`은 넘겨 줄 수 있는 역할을 좁힌다. 넓으면 권한 상승이다.\n\n사람용 역할 전환은 MFA 조건을 단다.\n\n```json\n{\n  \"Effect\": \"Allow\",\n  \"Action\": \"sts:AssumeRole\",\n  \"Resource\": \"arn:aws:iam::YOUR_ACCOUNT_ID:role/prod-readonly\",\n  \"Condition\": {\n    \"Bool\": { \"aws:MultiFactorAuthPresent\": \"true\" }\n  }\n}\n```\n\n확인:\n\n```bash\naws sts get-caller-identity\naws iam simulate-principal-policy \\\n  --policy-source-arn arn:aws:iam::YOUR_ACCOUNT_ID:role/app-api-role \\\n  --action-names s3:GetObject \\\n  --resource-arns arn:aws:s3:::app-assets-prod/public/logo.png\n```\n\n시뮬레이터가 만능은 아니다. 스테이징에서 실제 Deny를 한 번 본다.\n\n---\n\n## 4. 운영 시 주의\n\n**키.** 저장소에 `AKIA…`가 커밋되면 즉시 비활성화한다. 프론트엔드·모바일 바이너리에 키를 넣지 않는다. 브라우저가 S3에 쓰려면 서명 URL 또는 Cognito 같은 임시 자격이다.\n\n**와일드카드.** `Resource: \"*\"` + `iam:*`, `sts:*`, `s3:*` 조합은 사고 대기. 리전 제한 `aws:RequestedRegion`을 Condition으로 한 겹 더 둘 수 있다.\n\n**분석.** IAM Access Analyzer, Access Advisor로 안 쓰는 권한을 줄인다. 처음엔 관리형으로 시작하고, 트래픽이 안정되면 고객 관리형으로 축소한다.\n\n**계정 분리.** 가능하면 개발/스테이징/프로덕션 계정을 나눈다. 같은 계정이면 태그 조건과 권한 경계로 환경을 섞지 않는다.\n\n**감사.** CloudTrail로 `AssumeRole`, `CreateAccessKey`를 본다. 콘솔 로그인은 MFA가 있는지 주기적으로 확인한다.\n\n**시크릿.** IAM은 권한이 아니라 비밀번호 저장소가 아니다. DB 암호는 Secrets Manager, 회전에 역할을 묶는다.\n\n인라인 정책은 역할이 늘면 복붙이 된다. 고객 관리형 정책을 재사용하는 편이 감사에 낫다. 한 역할에 정책 10개를 쌓기보다 문서를 합친다. 제한 개수도 있다.\n\n**흔한 실수.** `AdministratorAccess`를 Lambda에 달기, `s3:*`를 `*` 리소스에 주기, GitHub PAT와 AWS 키를 같은 `.env`에 커밋하기. 발견 즉시 키를 폐기한다.\n\n---\n\n## 5. 정리\n\nIAM은 기능이 아니라 **경계**다. “일단 Admin”을 없애는 순간부터 운영이 안정된다. 워크로드는 역할, 사람은 SSO, 정책은 Action·Resource를 좁힌다.\n\n### 체크리스트\n\n- [ ] 워크로드에 인스턴스/태스크 역할을 붙인다. 박스 안 액세스 키는 유출 지점이다.\n- [ ] 정책 Resource를 버킷·ARN 단위로 좁힌다. `*`는 설명이 필요한 예외다.\n- [ ] CI는 OIDC 역할 Assume을 쓴다. 저장소 시크릿의 장기 키는 회전이 어렵다.\n- [ ] 관리자 역할에 MFA 조건을 단다. 비밀번호만으로 승격되지 않게 한다.\n- [ ] Access Advisor로 90일 미사용 권한을 줄인다. 권한은 시간이 지나면 늘어만 간다.\n\n### 연습\n\n1. 위 S3 `GetObject` 정책을 역할에 달고, 다른 버킷 GET이 거절되는지 확인한다.\n2. `get-caller-identity`로 지금 자격의 ARN이 역할인지 사용자인지 구분한다.\n3. 관리형 `AmazonS3FullAccess`와 고객 관리형 한 버킷 정책을 비교해 Action 개수를 세어 본다.\n"])</script><script>self.__next_f.push([1,"24:T1b98,"])</script><script>self.__next_f.push([1,"# CloudWatch 로그·메트릭·알람\n\n\u003e 요약: 로그·메트릭·알람으로 장애와 비용을 같은 날 알아채는 관측 기본선을 만든다.\n\n---\n\n## 1. 언제 CloudWatch를 먼저 다는가\n\nCloudWatch는 AWS의 관측 서비스다. 메트릭을 모으고, 로그를 저장하고, 임계값을 넘으면 알린다. 모니터링 없이 인스턴스만 키우면 장애는 사용자 신고로 알고, 비용은 청구서에서 안다.\n\n배포 완료 조건에 넣는다. “나중에 대시보드”는 보통 안 온다.\n\n최소 세트:\n\n| 신호 | 예 |\n|------|-----|\n| 메트릭 | CPU, 5xx, 지연, RDS 여유 스토리지 |\n| 로그 | 앱, ALB, RDS 로그 |\n| 알람 | 임계값 → SNS → 메일/슬랙 |\n| 대시보드 | 한 화면 요약 |\n\n분산 추적(X-Ray, OpenTelemetry)은 그다음이다. 메트릭+로그+알람이 없으면 추적만 화려하다.\n\n---\n\n## 2. 핵심 개념\n\n**네임스페이스·디멘션.** 메트릭은 이름과 차원(인스턴스 id, 타깃 그룹 등)으로 구분된다. 잘못된 차원은 알람이 영원히 안 울린다.\n\n**로그 그룹 / 로그 스트림.** 그룹에 보존 기간을 정한다. 무기한은 비용이다. 이름 규칙 예: `/app/dev/api`.\n\n**에이전트.** EC2면 CloudWatch 에이전트 또는 시스템 로그 연동. 컨테이너면 사이드카·FireLens. 앱이 stdout으로만 찍고 수집이 없으면 운영 로그가 아니다.\n\n**알람.** 통계(Average, Sum), 기간, 평가 횟수를 고른다. 한 번 튀고 끝나는 값에 과민하면 알람 피로가 온다. 반대로 15분 평균만 보면 장애를 놓친다.\n\n**SNS.** Simple Notification Service. 알람이 주제를 발행하고 구독이 메일·챗으로 간다. 구독 확인을 안 하면 침묵이다.\n\n**비용.** 커스텀 메트릭, 로그 수집량, Insights 쿼리가 요금이다. DEBUG를 프로덕션에 상시 켜 두지 않는다. 카드번호·토큰·비밀번호를 로그에 남기지 않는다.\n\n---\n\n## 3. 최소 예제 — 5xx와 디스크\n\nALB 5xx와 RDS 스토리지를 먼저 단다. 앱이 없어도 인프라는 말한다.\n\n알람 개념(콘솔 또는 CLI). 계정·ARN은 플레이스홀더다.\n\n```bash\naws cloudwatch put-metric-alarm \\\n  --alarm-name alb-5xx-dev \\\n  --alarm-description \"ALB target 5xx\" \\\n  --metric-name HTTPCode_Target_5XX_Count \\\n  --namespace AWS/ApplicationELB \\\n  --statistic Sum \\\n  --period 60 \\\n  --threshold 5 \\\n  --comparison-operator GreaterThanOrEqualToThreshold \\\n  --evaluation-periods 3 \\\n  --alarm-actions arn:aws:sns:REGION:YOUR_ACCOUNT_ID:ops-alerts\n```\n\n로그 그룹 보존:\n\n```bash\naws logs put-retention-policy \\\n  --log-group-name /app/dev/api \\\n  --retention-in-days 14\n```\n\n앱 로그 한 줄은 검색 가능한 JSON이 유리하다. 비밀은 마스킹한다.\n\n```json\n{\"level\":\"info\",\"msg\":\"order created\",\"orderId\":\"ord_123\",\"userId\":\"u_42\"}\n```\n\n대시보드는 위젯 네 개면 시작이다. ALB 5xx, 타깃 응답 시간, EC2/ECS CPU, RDS `FreeStorageSpace`. 예쁜 그래프보다 알람 연동이 먼저다.\n\n빌링 알람은 계정 글에서 켠 예산을 CloudWatch 결제 메트릭과 중복해도 된다. 겹치는 편이 안 울리는 것보다 낫다.\n\n---\n\n## 4. 운영 시 주의\n\n**노이즈.** 개발 환경 알람을 프로덕션 채널에 섞지 않는다. 주제 이름에 `dev`/`prod`를 넣는다. 무시하는 알람은 지워거나 임계를 고친다. 죽은 알람이 진짜 장애를 가린다.\n\n**연결.** 에이전트가 IAM 역할 없이 메트릭을 못 보낸다. 역할에 `cloudwatch:PutMetricData`, 로그면 `logs:PutLogEvents` 등 최소 액션만. 인스턴스에 키를 두지 않는다.\n\n**보존.** 규제 로그와 앱 디버그 로그의 기간을 나눈다. 개인정보(PII)는 수집 자체를 줄인다. 이미 남았으면 보존을 짧게.\n\n**비용.** 고해상도 커스텀 메트릭을 남발하지 않는다. 로그 Insights를 넓은 시간 범위로 돌리면 스캔 요금이 난다. 필터를 먼저 좁힌다.\n\n**장애 훈련.** 고의로 헬스체크를 실패시켜 알람이 오는지 본다. 안 오면 디멘션·통계·구독 확인이 잘못된 것이다.\n\nX-Ray는 API가 여러 서비스로 갈 때 붙인다. 처음부터 샘플 100%는 비용이다. 샘플링을 정한다.\n\n**로그 메트릭 필터.** “ERROR” 문자열이 분당 N회면 알람을 달 수 있다. 앱이 커스텀 메트릭을 안 보내도 시작 가능하다. 필터가 너무 넓으면 알람이 항상 켜진다. 스테이징에서 문장을 맞춘다.\n\n**합성(Canary).** 1분마다 `/health`를 밖에서 때린다. 내부 메트릭은 멀쩡한데 DNS·인증서만 죽은 경우를 잡는다. 실행 횟수가 곧 요금이다. 프로덕션 URL만, 주기를 합의한다.\n\n**대시보드 피로.** 위젯 30개는 안 본다. 서비스당 한 화면, 알람이 가리키는 메트릭만. 런북 링크를 알람 설명에 넣는다.\n\n---\n\n## 5. 정리\n\n관측은 사후 도구가 아니다. **배포 완료 조건**이다. 메트릭 세 개, 로그 보존, 알람 세 개, SNS 구독 확인이면 초반으로 충분하다.\n\n### 체크리스트\n\n- [ ] ALB 5xx 또는 앱 에러율 알람을 단다. 사용자보다 우리가 먼저 알아야 한다.\n- [ ] RDS/디스크 여유 공간 알람을 단다. 스토리지 풀은 복구가 급하다.\n- [ ] 로그 보존 일수를 정한다. 무기한 수집은 청구서다.\n- [ ] SNS 구독을 확인한다. 미확인 메일은 알람이 없는 것과 같다.\n- [ ] 토큰·PII가 로그에 없는지 샘플을 검사한다. 로그 유출은 데이터 유출이다.\n\n### 연습\n\n1. SNS 주제를 만들고 메일 구독을 확인한 뒤 테스트 알람을 보낸다.\n2. 로그 그룹 보존을 14일로 설정하고 콘솔에 반영됐는지 본다.\n3. ALB 또는 앱 메트릭 하나를 골라 디멘션이 맞는지 그래프로 확인한다.\n\n결제 메트릭 알람은 계정 루트가 아니라 운영 메일로 보낸다. `EstimatedCharges`가 전날보다 급증하면 키 유출·리전 실수·NAT 트래픽일 수 있다. 인프라 5xx와 같은 채널에 섞어도 되고, `billing-alerts` 주제로 나눠도 된다. 안 오는 쪽이 문제다.\n\n로그 그룹 생성은 Terraform/CDK에 넣는다. 콘솔에서만 만들면 앱 역할의 `CreateLogGroup`이 필요해지고, 권한이 넓어진다. 그룹을 미리 만들고 앱은 `PutLogEvents`만 하게 한다.\n\n알람 설명에 “보면 되는 대시보드, 할 일”을 한 줄 넣는다. `ALB 5xx — 타깃 헬스와 /health 확인`이면 새벽 호출이 짧아진다. 이름만 `alarm-1`이면 아무도 못 움직인다.\n\n개발 계정 알람은 슬랙 `#dev-alerts`, 프로덕션은 `#prod-alerts`로 나눈다. 한 채널에 둘 다 넣으면 결국 뮤트한다.\n\n컨테이너면 태스크 정의에 `awslogs` 드라이버와 그룹 이름만 맞으면 된다. 그룹이 없고 생성 권한이 없으면 컨테이너는 떠도 로그가 안 보인다. 배포 체크에 “로그 스트림이 1분 안에 생기는지”를 넣는다.\n\n---\n\n---\n"])</script><script>self.__next_f.push([1,"25:T1d26,"])</script><script>self.__next_f.push([1,"# ALB와 Auto Scaling으로 트래픽 받기\n\n\u003e 요약: 로드밸런서와 자동 수평 확장으로 HTTPS 트래픽을 프라이빗 앱 인스턴스에 나누는 구성을 정리한다.\n\n---\n\n## 1. 언제 ALB와 Auto Scaling인가\n\nALB는 Application Load Balancer, HTTP/HTTPS 7계층 로드밸런서다. Auto Scaling은 인스턴스(또는 컨테이너 태스크) 수를 메트릭에 따라 늘리고 줄인다.\n\n이 조합이 맞는 경우:\n\n- 사용자 트래픽이 웹·API로 들어오고, 인스턴스를 직접 인터넷에 노출하고 싶지 않을 때\n- 배포 중에도 헬스체크가 통과한 타깃만 받고 싶을 때\n- CPU·요청 수에 따라 용량을 조절하고 싶을 때\n\n맞지 않는 경우:\n\n- 정적 파일만이면 CloudFront + S3가 더 단순하다\n- TCP 비 HTTP면 NLB를 검토한다. NLB는 Network Load Balancer다\n- 단일 개발 인스턴스에 SSH로만 붙는 실험. ALB 시간당 요금이 아깝다\n\n기본 토폴로지:\n\n```\n사용자 → ALB(퍼블릭 서브넷, 443) → 타깃 그룹 → EC2/ECS(프라이빗)\n```\n\n---\n\n## 2. 핵심 개념\n\n**리스너.** 포트와 프로토콜. 443에 ACM 인증서를 붙인다. ACM은 AWS Certificate Manager, 공개 인증서 발급·갱신이다. HTTP 80은 443으로 리다이렉트한다. 인증서를 인스턴스에 직접 복사하지 않아도 된다.\n\n**타깃 그룹.** 실제 앱 포트(예: 8080)와 헬스체크 경로. `/health`는 인증 없이 가볍고, DB까지 물면 배포마다 빠질 수 있다. 의존성 검사는 내부 프로브로 나눈다.\n\n**헬스체크.** 주기, 성공 코드, 연속 실패 횟수. 실패하면 트래픽이 빠진다. 배포 때 드레인(deregistration delay)을 맞춘다. 너무 짧으면 진행 중 요청이 끊긴다.\n\n**ASG.** Auto Scaling Group. 최소·희망·최대 용량. 시작 템플릿에 AMI, 보안 그룹, IAM 역할, 유저 데이터가 들어간다. 그룹이 새 인스턴스를 켜도 설정이 같아야 한다.\n\n**스케일 정책.** CPU 60% 5분 → +1, CPU 20% 15분 → −1처럼 아웃은 빠르게, 인은 보수적으로. 요청 수(`RequestCountPerTarget`)가 웹에 더 잘 맞을 때가 있다.\n\n**상태.** 세션·업로드 파일을 인스턴스 로컬에만 두면 스케일 아웃이 사용자를 다른 박스로 보낸다. 세션은 Redis나 DB, 파일은 S3.\n\n---\n\n## 3. 최소 구성 예\n\n1. ACM에서 도메인 인증서를 발급한다. DNS 검증.\n2. ALB를 퍼블릭 서브넷 두 AZ에 둔다. SG: 443 인터넷, 80 리다이렉트.\n3. 앱 SG: ALB SG만 8080.\n4. 타깃 그룹: HTTP 8080, 헬스 `/health`.\n5. 시작 템플릿 + ASG 최소 2(프로덕션). 개발은 1도 가능하나 AZ 장애를 감수한다.\n6. 스케일 정책 하나와 CloudWatch 알람.\n\n헬스 엔드포인트 예. 비밀 없음.\n\n```\nGET /health → 200 {\"status\":\"ok\"}\n```\n\n보안 그룹 요약:\n\n```\nALB SG : 0.0.0.0/0 → 443\nApp SG : sg-ALB    → 8080\n```\n\n확인:\n\n```bash\naws elbv2 describe-load-balancers --query \"LoadBalancers[].{n:LoadBalancerName,s:State.Code}\"\naws elbv2 describe-target-health --target-group-arn arn:aws:elasticloadbalancing:REGION:YOUR_ACCOUNT_ID:targetgroup/app/YOUR_ID\n```\n\n타깃이 `unhealthy`면 보안 그룹, 포트, 앱 바인드 주소(`127.0.0.1`만 듣고 있으면 ALB가 못 붙는다), 헬스 경로를 본다.\n\nWAF는 로그인·공개 API에 검토한다. 처음부터 전체 차단 규칙을 켜면 정상 트래픽이 죽는다. 로그 모드로 시작한다.\n\n---\n\n## 4. 운영 시 주의\n\n**비용.** ALB는 시간 + LCU(처리량 단위). 개발용 ALB를 여러 개 방치하지 않는다. ASG 최대치를 높게 두면 트래픽 스파이크가 곧 청구서다. 최대 용량에 상한을 둔다. 예산 알람과 같이 본다.\n\n**보안.** 앱 SG에 인터넷 8080을 직접 열지 않는다. TLS는 ALB에서 끝내는 구성이 흔하다. 내부까지 TLS가 필요하면 별도 인증서를 운영한다. HTTP만 인터넷에 두지 않는다.\n\n**연결.** Keep-alive·유휴 타임아웃이 앱과 안 맞으면 504가 난다. ALB 타임아웃보다 앱이 긴 작업을 동기 HTTP로 하지 않는다. 큐로 보낸다.\n\n**배포.** 인플레이스 SSH 수정은 ASG가 새 박스를 켜면 사라진다. AMI 또는 사용자 데이터 + 아티팩트 배포. 롤링 또는 블루/그린을 정한다.\n\n**콜드 스타트.** 스케일 아웃 직후 헬스 통과까지 시간이 있다. 최소 용량을 0으로 두면 첫 요청이 길다. 프로덕션 최소는 1 또는 2.\n\n**스틱니스.** 세션 스티키는 예외다. 기본은 무상태 앱이다.\n\n**타임아웃.** ALB idle timeout 기본은 60초 근처다. 앱이 90초 걸리는 동기 작업을 하면 504다. 작업을 큐로 보내거나 타임아웃을 문서화한다. 클라이언트가 먼저 끊어도 앱은 계속 일할 수 있다. 취소를 전파할지 합의한다.\n\n**액세스 로그.** ALB 액세스 로그를 S3에 켜면 5xx 디버깅이 빨라진다. 수명주기를 같이 켠다. 로그 버킷도 퍼블릭이면 안 된다.\n\n**용량 예약.** 이벤트 전에 ASG 희망 용량만 올려 두는 편이 스팟·스케일 정책보다 예측 가능하다. 이벤트 후 내린다. 안 내리면 그게 고정 비용이 된다.\n\n---\n\n## 5. 정리\n\nALB + ASG는 서버를 여러 대 켜는 일이 아니다. **헬스체크가 통과하는 동일한 타깃**을 만드는 설계다. 상태는 밖으로 빼고, 인터넷은 ALB만, 용량 상한과 알람을 같이 둔다.\n\n### 체크리스트\n\n- [ ] 443 + ACM을 쓰고 80은 리다이렉트한다. 평문 HTTP 운영은 자격 유출 위험이 있다.\n- [ ] 앱은 프라이빗이고 SG 소스는 ALB뿐이다. 우회 포트는 로드밸런서를 무의미하게 한다.\n- [ ] `/health`가 빠르게 200을 반환한다. 무거운 헬스체크는 정상 배포를 실패로 만든다.\n- [ ] 세션·파일을 인스턴스 밖으로 뺀다. 로컬 상태는 스케일 때 사용자를 잃는다.\n- [ ] ASG 최댓값과 스케일 알람을 정한다. 무한 스케일 아웃은 비용 사고다.\n\n### 연습\n\n1. 타깃 헬스를 CLI로 조회해 `healthy`가 되는지 확인한다.\n2. 인스턴스 하나를 강제 unhealthy로 만들고 ALB가 트래픽을 빼는지 본다.\n3. CPU 또는 요청 수 정책의 최소/최대 용량을 표로 적어 상한이 있는지 검사한다.\n\n리스너 규칙으로 경로를 나눌 수 있다. `/api/*`는 앱 타깃, `/static/*`는 쓰지 말고 CloudFront+S3가 더 싸다. ALB에서 정적 파일을 오래 서빙하면 LCU가 는다.\n\n헬스체크 경로를 인증 뒤로 두면 ALB가 전부 unhealthy가 된다. 공개 GET이어야 한다. 내부 시크릿을 쿼리스트링으로 넣지 않는다. 로그에 남는다.\n\n시작 템플릿 버전을 올린 뒤 ASG가 새 버전을 쓰는지 확인한다. 인스턴스 새로고침(instance refresh)으로 점진 교체할 수 있다. 수동으로 한 대만 고치면 다음 스케일 아웃이 옛 AMI를 켠다.\n\n인증서 만료는 ACM 자동 갱신이 전제다. DNS 검증 레코드를 지우면 갱신이 실패한다. 만료 알람을 ACM·CloudWatch에서 한 번 더 둔다.\n\n타깃 그룹 포트와 컨테이너 호스트 포트가 어긋나면 헬스는 영원히 실패한다. ECS면 동적 포트를 ALB가 따라가게 한다. EC2면 보안 그룹 포트와 앱 `listen`이 같아야 한다. `localhost`만 바인드하면 실패한다. `0.0.0.0`이어야 ALB가 도달한다.\n\n---\n\n---\n"])</script><script>self.__next_f.push([1,"26:T1f91,"])</script><script>self.__next_f.push([1,"# AWS 배포·비용 실무 체크리스트\n\n\u003e 요약: 계정·네트워크·데이터·관측·비용까지, 프로덕션에 올리기 전에 통과할 AWS 실무 점검 목록을 모은다.\n\n---\n\n## 1. 이 목록을 언제 쓰는가\n\n새 서비스, 첫 상용 트래픽, 계정 인수인계 전에 쓴다. AWS는 기능이 많아서가 아니라 **경계를 빠뜨리면** 비용과 사고가 난다. 체크리스트를 통과한 서비스가 더 오래, 더 싸게 간다.\n\n대상은 소규모 웹/API다. Organizations·Control Tower가 있는 대기업은 내부 가드레일이 우선이다. 그래도 아래 항목은 겹친다.\n\n통과 기준은 “콘솔에 켜져 있음”이 아니다. **누가 알람을 받는지, 복원이 되는지**까지다.\n\n---\n\n## 2. 계정·권한\n\n루트와 IAM을 다시 본다. 배포 파이프라인이 Admin 키를 들고 있으면 저장소 유출이 곧 계정 탈취다.\n\n- [ ] 루트에 MFA가 있고 일상 작업은 IAM 또는 SSO다. 루트 세션은 결제·계정 변경 뿐이다.\n- [ ] 루트 액세스 키가 없다. 장기 루트 키는 회전·추적이 거의 불가능하다.\n- [ ] 프로덕션 배포 역할은 최소 권한이고, 사람 Admin과 분리되어 있다. 같은 키로 콘솔 탐색과 배포를 하지 않는다.\n- [ ] CI는 OIDC 등 임시 자격이다. 저장소 시크릿의 `AKIA…`는 유출 시 즉시 과금으로 이어진다.\n- [ ] 시크릿은 Secrets Manager 또는 SSM Parameter(SecureString)다. `.env`를 AMI에 굽지 않는다.\n- [ ] CloudTrail 관리 이벤트가 켜져 있다. 사고 후 “누가 지웠는지”를 남기려면 미리 켠다.\n\n---\n\n## 3. 네트워크·컴퓨트\n\n인터넷에 열린 면적을 최소로 둔다. SSH와 DB 포트가 세상에 열려 있으면 ALB 설계가 무의미하다.\n\n- [ ] ALB(또는 CloudFront)만 퍼블릭이고 앱·DB는 프라이빗 서브넷이다. 공인 IP 앱 서버는 스캔 대상이다.\n- [ ] 보안 그룹 소스는 SG ID 중심이다. DB·앱 포트의 `0.0.0.0/0`은 실수가 아니라 취약점이다.\n- [ ] 22번을 인터넷에 상시 열지 않는다. SSM이 있으면 키 분실과 무차별 대입 면적이 줄어든다.\n- [ ] 서브넷이 두 AZ 이상이다. 단일 AZ는 그 존 장애가 곧 전면 장애다.\n- [ ] 헬스체크와 배포 드레인이 정의되어 있다. 배포 중 5xx는 대부분 타깃이 일찍 빠지거나 늦게 붙어서다.\n- [ ] 인스턴스는 IAM 역할을 쓴다. 박스 안 액세스 키 파일은 이미지 유출과 같다.\n\nEC2 대신 ECS/Fargate여도 SG·프라이빗·역할 원칙은 같다.\n\n---\n\n## 4. 데이터\n\n데이터가 있는 서비스는 컴퓨트보다 복구가 어렵다. 백업 없는 RDS, 퍼블릭 S3가 가장 비싼 실수다.\n\n- [ ] RDS(또는 DB) 자동 백업이 켜져 있고 보존 기간이 합의되어 있다. 백업 윈도우만 있고 복원 시험이 없으면 안 된다.\n- [ ] DB 퍼블릭 액세스가 꺼져 있다. 3306/5432 인터넷 개방은 랜섬·탈취의 입구다.\n- [ ] S3 Block Public Access가 기본이다. 정적 웹은 CloudFront 뒤에서 연다. 버킷 직접 공개는 유출이다.\n- [ ] 중요 버킷은 버전 관리 또는 복제를 검토한다. 덮어쓰기 한 번에 원본이 사라진다.\n- [ ] 저장 암호화(EBS, RDS, S3)가 켜져 있다. 스냅샷이 복사되어도 키가 없으면 읽기 어렵다.\n- [ ] Redis·큐도 VPC 안에 있고 인증이 있다. 열린 6379는 데이터 유실·탈취가 쉽다.\n\n연결 문자열의 비밀번호는 `YOUR_DB_PASSWORD`처럼 시크릿에서만 주입한다. 이슈 트래커에 붙여 넣지 않는다.\n\n---\n\n## 5. 관측·운영\n\n알람이 없으면 장애는 SNS가 아니라 트위터로 온다.\n\n- [ ] 5xx 또는 에러율 알람이 SNS까지 연결된다. 그래프만 있고 구독 미확인이면 침묵이다.\n- [ ] 지연(latency) 알람이 있다. 5xx가 없어도 타임아웃은 장애다.\n- [ ] 디스크·RDS 여유 스토리지 알람이 있다. 공간 부족은 예고 없이 쓰기 실패다.\n- [ ] 로그 보존과 PII 마스킹 규칙이 있다. 무기한 로그는 비용이고, 토큰 로그는 유출이다.\n- [ ] 장애 연락 채널이 사람 한 명의 개인 메일이 아니다. 휴가에 알람이 끊긴다.\n- [ ] 인프라가 코드(Terraform/CDK/CloudFormation)로 재현된다. 콘솔 클릭만의 프로덕션은 다음 변경 때 드리프트한다.\n\n---\n\n## 6. 비용\n\n클라우드 비용은 트래픽보다 방치에서 는다. 태그 없는 자원은 아무도 못 끈다.\n\n- [ ] 예산 알람이 계정에 있다. 프리 티어·크레딧은 한도가 아니다.\n- [ ] 태그 `Project`, `Env`, `Owner`가 필수다. 비용 탐색에서 서비스 단위로 못 자르면 절감이 불가능하다.\n- [ ] 개발 자원 중지·삭제 스케줄이 있다. NAT·ALB·RDS를 주말 내내 켜 두면 실험 비용이 상품 비용이 된다.\n- [ ] NAT Gateway, ALB, 퍼블릭 IPv4 요금을 알고 켠다. 컴퓨트보다 네트워킹이 더 나올 수 있다.\n- [ ] 스냅샷·AMI·미사용 EBS·미연결 EIP를 주기적으로 지운다. 종료한 인스턴스의 디스크가 남는 경우가 많다.\n- [ ] ASG 최댓값이 예산과 맞다. 오토스케일은 가용성의 도구이자 과금의 증폭기다.\n\nCost Explorer를 월 1회라도 본다. 이상 비용 감지를 켜 두면 크립토 마이닝형 유출을 빨리 본다.\n\n---\n\n## 7. 첫 주에 할 순서\n\n한 번에 다 하지 않는다. 순서가 있다.\n\n1. 루트 MFA, 루트 키 없음, IAM/SSO, 예산 알람\n2. 커스텀 VPC, 퍼블릭/프라이빗, SG 최소\n3. 데이터(RDS·S3) 비공개·백업·암호화\n4. 앱은 역할로만 클라우드 API 호출\n5. 5xx·디스크·빌링 알람 + SNS 확인\n6. 태그 강제 후 개발 자원 스케줄\n\n이 순서를 건너뛰고 GPU 인스턴스부터 켜면 청구서와 보안이 동시에 터진다.\n\n**넘기지 말 것.** 프로덕션 데이터를 개발 계정으로 복사할 때 퍼블릭 스냅샷·퍼블릭 AMI로 만들지 않는다. 로그에 주민번호·카드가 있으면 보존을 늘리지 말고 수집을 줄인다.\n\n---\n\n## 8. 정리\n\n새 서비스를 더 켜기 전에 **이 목록을 통과한 서비스**인지 본다. AWS는 속도를 주지만, 루트·퍼블릭 버킷·알람 없음·태그 없음이 겹치면 속도가 곧 사고다.\n\n배포 당일 최소 확인:\n\n```bash\naws sts get-caller-identity\naws rds describe-db-instances --query \"DBInstances[].PubliclyAccessible\"\naws s3api get-public-access-block --bucket YOUR_BUCKET\n```\n\n세 명령의 결과가 “기대한 계정, DB 비공개, S3 퍼블릭 차단”이어야 한다.\n\n### 연습\n\n1. 위 체크리스트를 현재 계정에 적용해 미체크 항목만 이슈로 남긴다.\n2. 예산 알람 테스트와 SNS 구독 확인을 실제로 한 번 한다.\n3. RDS 또는 EBS 스냅샷을 스테이징에 복원해 앱이 읽는지 기록한다.\n\n체크리스트를 PR 템플릿에 붙여도 된다. “인프라 변경” PR이면 네트워크·IAM·비용 칸만이라도 채운다. 앱 코드 PR에 AWS 전체를 요구하지 않는다. 범위가 넓으면 아무도 안 본다.\n\n마지막으로 계정 별칭과 리전을 README 한 줄에 적는다. `work` 프로필이 프로덕션인지 개발인지 헤매는 시간이 사고보다 먼저 온다.\n\n이 시리즈 앞에서 다룬 순서로 다시 훑어도 된다. 계정(1) → VPC(2) → EC2(3) → S3(4) → RDS(5) → IAM(6) → CloudWatch(7) → ALB(8) → 이 목록. 중간을 건너뛰고 오토스케일만 켜면 상태 있는 앱이 로컬 디스크에 남는다.\n\n체크가 전부 초록이어도 복원 리허설이 없으면 재해 복구는 문서일 뿐이다. 분기 1회, 스테이징에서 스냅샷으로 앱을 올려 보는 일정을 캘린더에 넣는다.\n\n비용 이상이면 그날 Cost Explorer를 서비스·리전으로 자른다. 낯선 리전의 EC2, 낯선 Marketplace, NAT 데이터 처리가 흔한 범인이다. 키를 의심하면 액세스 키를 먼저 비활성화한다. 설명보다 차단이 먼저다.\n\n---\n\n---\n"])</script><script>self.__next_f.push([1,"27:T1d30,"])</script><script>self.__next_f.push([1,"# PostgreSQL: 관계형 DB의 실무 기본선\n\n\u003e 요약: 관계·트랜잭션·JSON을 한 엔진에서 다루는 오픈소스 관계형 DB로, 웹과 API 백엔드의 기본선이 되는 이유를 정리한다.\n\n---\n\n## 1. 언제 PostgreSQL인가\n\nPostgreSQL은 오픈소스 관계형 데이터베이스다. 표(테이블)로 데이터를 넣고, SQL로 조회한다. 웹 API, 관리자 화면, 정산·리포트처럼 **관계가 있고 틀리면 안 되는 데이터**에 잘 맞는다.\n\n| 맞는 경우 | 덜 맞는 경우 |\n|-----------|--------------|\n| 주문·회원처럼 관계가 중요할 때 | 키와 값만 초고속으로 필요할 때 (Redis) |\n| 제약·트랜잭션이 업무의 핵심일 때 | 문서 구조가 매일 바뀌고 조인이 거의 없을 때 (MongoDB) |\n| SQL로 분석·집계·리포팅을 할 때 | 극단적 수평 샤딩만 목표일 때 |\n| JSON과 관계를 한 DB에서 섞을 때 | 단일 파일·임베디드면 충분할 때 (SQLite) |\n| 확장(검색, 지리정보)을 DB 안에서 쓰고 싶을 때 | 호스팅이 MySQL만 제공하는 레거시 환경 |\n\n“그냥 SQL이 필요해서”만으로도 충분한 선택이 많다. 반대로 **캐시 전용**, **초단순 키-값**, **모바일 로컬 DB**에는 다른 도구가 더 단순하다.\n\n실무에서 기본선으로 자주 고르는 이유다. 표준 SQL에 가깝고, JSONB와 확장이 한 엔진에 들어 있다.\n\n---\n\n## 2. 핵심 개념\n\n**트랜잭션**은 여러 쓰기를 한 묶음으로 성공하거나 전부 되돌리는 장치다. PostgreSQL은 ACID를 지킨다. ACID는 원자성(Atomicity)·일관성(Consistency)·격리(Isolation)·지속성(Durability)의 약자다.\n\n```sql\nBEGIN;\nUPDATE accounts SET balance = balance - 1000 WHERE id = 1;\nUPDATE accounts SET balance = balance + 1000 WHERE id = 2;\nCOMMIT;\n-- 중간에 실패하면 ROLLBACK\n```\n\n**스키마와 제약**이 데이터의 모양을 지킨다.\n\n- PK(Primary Key, 기본키): 행을 유일하게 가리킨다\n- FK(Foreign Key, 외래키): 다른 테이블의 존재를 강제한다\n- UNIQUE, CHECK: 중복·범위 같은 규칙을 엔진이 검사한다\n\n제약을 앱에만 두면 우회 경로에서 깨진다. DB에 두는 편이 안전하다.\n\n**인덱스**는 조회를 빠르게 하는 보조 구조다. 기본은 B-tree다. `WHERE`·`JOIN`·`ORDER BY`에 자주 쓰는 컬럼에 만든다. 너무 많으면 쓰기가 느려진다.\n\n**JSONB**는 이진 JSON이다. JSON은 JavaScript Object Notation, 키-값 문서 형식이다. 관계형 테이블 안에 유연한 필드를 넣을 때 쓴다. 검색이 필요하면 GIN 인덱스를 붙인다. GIN은 Generalized Inverted Index, 문서·배열 검색용 인덱스다.\n\n**WAL**은 Write-Ahead Log, 미리 쓰기 로그다. 변경을 디스크에 남긴 뒤 데이터 파일에 반영한다. 장애 복구와 연속 백업의 기반이다.\n\n**격리 수준**은 동시에 도는 트랜잭션이 서로를 얼마나 보는지다. 기본은 `READ COMMITTED`인 경우가 많다. 재고처럼 같은 행을 두고 경쟁하면 `SELECT … FOR UPDATE`로 잠근다. 기본값을 올리는 일은 측정 후에 한다. 교착(deadlock)이 늘 수 있다.\n\n연결 문자열은 시크릿이다. 예시는 플레이스홀더만 쓴다.\n\n```\npostgresql://APP_USER:YOUR_DB_PASSWORD@db.internal:5432/app\n```\n\n---\n\n## 3. 최소 예제 — 주문과 JSON 메타\n\n회원과 주문을 가정한다. 고정 필드는 컬럼, 자주 바뀌는 옵션은 JSONB에 둔다.\n\n```sql\nCREATE TABLE users (\n  id         bigserial PRIMARY KEY,\n  email      text NOT NULL UNIQUE,\n  name       text NOT NULL,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE orders (\n  id           bigserial PRIMARY KEY,\n  user_id      bigint NOT NULL REFERENCES users(id),\n  status       text NOT NULL CHECK (status IN ('pending', 'paid', 'cancelled')),\n  payload      jsonb NOT NULL DEFAULT '{}',\n  created_at   timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX orders_user_id_idx ON orders (user_id);\nCREATE INDEX orders_payload_gin ON orders USING gin (payload);\n```\n\n```sql\nINSERT INTO users (email, name) VALUES ('ada@example.com', 'Ada');\n\nINSERT INTO orders (user_id, status, payload)\nVALUES (\n  1,\n  'paid',\n  '{\"channel\": \"web\", \"coupon\": \"WELCOME10\"}'::jsonb\n);\n\nSELECT o.id, u.email, o.status, o.payload-\u003e\u003e'coupon' AS coupon\nFROM orders o\nJOIN users u ON u.id = o.user_id\nWHERE o.payload @\u003e '{\"channel\": \"web\"}'::jsonb\nORDER BY o.created_at DESC\nLIMIT 20;\n```\n\n느린 쿼리는 감으로 고치지 않는다.\n\n```sql\nEXPLAIN (ANALYZE, BUFFERS)\nSELECT * FROM orders WHERE user_id = 1 ORDER BY created_at DESC;\n```\n\n`Seq Scan`이 대량 테이블에서 반복되면 인덱스를 검토한다. 스키마 변경은 Flyway, Prisma migrate 같은 마이그레이션 도구로 버전을 남긴다.\n\n---\n\n## 4. 운영 시 주의\n\n**연결.** PostgreSQL은 연결당 메모리를 쓴다. 앱 인스턴스 수 × 풀 크기가 곧 DB 연결 수다. 과다하면 신규 연결이 거절된다. PgBouncer 같은 풀러를 앞에 두는 구성이 흔하다.\n\n**백업.** `pg_dump`는 논리 백업이다. 소규모·개발에 충분하다. 운영 등급은 WAL을 이은 연속 백업(PITR, Point-In-Time Recovery)을 검토한다. 백업이 복원되는지는 주기적으로 확인한다. 찍기만 하고 복원을 안 해본 백업은 백업이 아니다.\n\n**보안.** 앱 계정은 `SUPERUSER`가 아니다. 필요한 스키마·테이블만 연다. 관리형이면 퍼블릭 액세스를 끄고, 앱 보안 그룹에서만 5432를 연다. 비밀번호는 코드·이미지에 넣지 않는다. `YOUR_DB_PASSWORD` 같은 플레이스홀더를 시크릿 저장소에 둔다.\n\n**성능.** 슬로우 쿼리 로그와 `EXPLAIN`을 먼저 본다. CPU를 키우기 전에 인덱스와 N+1 조회를 고친다.\n\n**마이그레이션.** 큰 테이블에 락이 긴 `ALTER`는 배포 창을 잡는다. `CREATE INDEX CONCURRENTLY`처럼 온라인에 가까운 방법을 버전별로 확인한다.\n\n**확장.** 자주 쓰는 것만 켠다. `pg_trgm`은 유사 문자열 검색, PostGIS는 지리 정보, `pgcrypto`는 해시·암호화 함수다. 확장은 백업·복원·메이저 업그레이드 체크리스트에 넣는다.\n\n**비용.** 관리형(RDS 등)은 인스턴스 클래스·스토리지·IOPS·백업 보존이 요금이다. 슬로우 쿼리를 두고 클래스만 키우면 매달 비용만 는다.\n\n---\n\n## 5. 정리\n\nPostgreSQL은 “그냥 SQL DB”가 아니다. **관계 + JSON + 확장**을 한 엔진에서 다루는 기본선이다. 제약을 DB에 두고, 인덱스는 쿼리 패턴에 맞추고, 연결·백업·권한을 운영 항목으로 본다.\n\n### 체크리스트\n\n- [ ] PK·FK·CHECK를 스키마에 넣는다. 앱만의 규칙은 우회된다.\n- [ ] `WHERE`/`JOIN` 컬럼에 인덱스를 만든다. 풀스캔은 데이터가 커지면 비용이 된다.\n- [ ] 연결 풀 크기를 인스턴스 수와 곱해 본다. 과다 연결은 장애다.\n- [ ] `pg_dump` 또는 WAL 백업을 켜고 복원을 한 번 연습한다. 복원되지 않는 백업은 없다.\n- [ ] 앱 DB 계정에서 슈퍼유저 권한을 뺀다. 최소 권한이 사고 범위를 줄인다.\n\n### 연습\n\n1. 위 `users`/`orders` 테이블을 로컬에 만들고 주문을 세 건 넣는다.\n2. `payload-\u003e\u003e'coupon'`으로 조회하는 쿼리에 `EXPLAIN`을 붙여 본다.\n3. `pg_dump`로 덤프한 뒤 빈 DB에 복원해 건수가 같은지 확인한다.\n"])</script><script>self.__next_f.push([1,"28:T1d9d,"])</script><script>self.__next_f.push([1,"# MySQL: 웹 서비스에서 가장 흔한 관계형 DB\n\n\u003e 요약: 웹에서 가장 흔히 만나는 관계형 DB로, InnoDB와 utf8mb4를 기준으로 인덱스·복제·백업을 정리한다.\n\n---\n\n## 1. 언제 MySQL인가\n\nMySQL은 웹 호스팅과 LAMP 스택에서 오래 쓰인 관계형 데이터베이스다. LAMP는 Linux, Apache, MySQL, PHP의 약자다. 워드프레스, 레거시 PHP, 단순 CRUD API에서 기본값인 경우가 많다. MariaDB는 호환 계열로 함께 언급된다. 엔진·SQL 방언은 버전마다 다르다. 운영 전에 문서를 확인한다.\n\n| 맞는 경우 | 덜 맞는 경우 |\n|-----------|--------------|\n| 워드프레스·레거시 웹, 호스팅이 MySQL만 줄 때 | 복잡한 분석 SQL·윈도 함수가 핵심일 때 |\n| 읽기 위주 단순 CRUD가 많을 때 | JSON·확장·표준 SQL을 한 엔진에서 깊게 쓸 때 (PostgreSQL) |\n| RDS MySQL 등 관리형 접근성이 중요할 때 | 키-값 캐시·세션만 필요할 때 (Redis) |\n| 팀·외주가 MySQL에 익숙할 때 | 파일 하나·임베디드면 충분할 때 (SQLite) |\n| 읽기 레플리카로 조회를 나누고 싶을 때 | 스키마 없는 문서가 매일 바뀔 때 (MongoDB) |\n\n익숙함과 생태계가 강점이다. “Postgres가 더 세다”는 이유만으로 바꾸지 않는다. 호스팅·기존 스키마·운영 경험이 MySQL이면 그대로 잘 쓰는 편이 싸다.\n\n---\n\n## 2. 핵심 개념\n\n**스토리지 엔진**이 테이블의 저장 방식을 정한다. 실무 기본은 **InnoDB**다. 트랜잭션, 외래키, 크래시 복구를 지원한다. MyISAM은 레거시다. 신규 테이블에 쓰지 않는다.\n\n**문자셋**은 글자를 바이트로 저장하는 규칙이다. **`utf8mb4`** 를 쓴다. 옛 이름 `utf8`은 3바이트라 이모지·일부 문자가 깨진다. 콜레이션은 비교·정렬 규칙이다. 팀 표준을 하나 정한다. 예: `utf8mb4_unicode_ci`. `ci`는 case-insensitive, 대소문자를 구분하지 않는다는 뜻이다.\n\n**바이너리 로그(binlog)** 는 변경 이력을 기록한다. 복제(replication)와 시점 복구의 재료다. 복제는 보통 주(primary)에 쓰고, 읽기 레플리카에서 조회를 나눈다.\n\n**인덱스**는 InnoDB에서 클러스터드 PK를 중심으로 잡힌다. PK가 길면 보조 인덱스도 커진다. `BIGINT` PK가 흔한 이유다.\n\n**온라인 DDL**은 Data Definition Language, 스키마 변경 SQL이다. 큰 테이블 `ALTER`는 락이 길 수 있다. 버전·도구(pt-online-schema-change 등) 전략을 배포 전에 정한다.\n\n연결 문자열은 시크릿이다.\n\n```\nmysql://APP_USER:YOUR_DB_PASSWORD@db.internal:3306/app\n```\n\n`sql_mode`는 느슨하면 잘못된 날짜·잘린 문자열이 조용히 들어간다. 팀 표준을 정하고 세션마다 달라지지 않게 한다.\n\n---\n\n## 3. 최소 예제 — 게시글 테이블\n\n블로그 글 목록을 가정한다. 엔진·문자셋·인덱스를 한 번에 명시한다.\n\n```sql\nCREATE TABLE posts (\n  id         BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,\n  user_id    BIGINT UNSIGNED NOT NULL,\n  title      VARCHAR(200) NOT NULL,\n  body       MEDIUMTEXT NOT NULL,\n  status     ENUM('draft', 'published') NOT NULL DEFAULT 'draft',\n  created_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),\n  KEY posts_user_id_idx (user_id),\n  KEY posts_created_at_idx (created_at)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n```\n\n```sql\nINSERT INTO posts (user_id, title, body, status)\nVALUES (1, '첫 글', '본문입니다.', 'published');\n\nSELECT id, title, created_at\nFROM posts\nWHERE status = 'published'\nORDER BY created_at DESC\nLIMIT 20;\n```\n\n쿼리가 느리면 `EXPLAIN`을 본다.\n\n```sql\nEXPLAIN SELECT id, title FROM posts WHERE user_id = 1 ORDER BY created_at DESC;\n```\n\n`type`, `rows`, `Extra`를 본다. `Using filesort`·`Using where`만 있고 인덱스가 안 타면 `WHERE`/`ORDER BY` 컬럼을 점검한다.\n\n피해야 할 습관:\n\n- `SELECT *`를 큰 테이블에서 습관적으로 쓰기\n- `WHERE YEAR(created_at) = 2026`처럼 컬럼을 함수로 감싸기. 인덱스가 무력화된다\n- PK/UK 없이 테이블을 만들기\n\n---\n\n## 4. 운영 시 주의\n\n**연결.** `max_connections`와 앱 풀 크기를 맞춰 본다. 연결이 많다고 처리량이 늘지 않는다. 대기만 늘 수 있다. InnoDB 버퍼 풀(innodb_buffer_pool_size)은 자주 읽는 데이터가 메모리에 머물게 한다. 관리형이면 인스턴스 클래스와 함께 본다.\n\n**백업.** 논리 덤프는 `mysqldump`다. 운영은 스냅샷 + binlog로 시점 복구를 검토한다. RDS면 자동 백업 보존 기간을 합의한다. 덤프만 있고 복원 테스트가 없으면 사고로 친다.\n\n**복제.** 읽기 레플리카는 지연(replication lag)이 있다. “방금 쓴 글”을 레플리카에서 바로 읽으면 빈 결과가 날 수 있다. 쓰기 직후 읽기는 주로 보낸다.\n\n**문자셋.** 연결·테이블·컬럼이 섞이면 이모지만 깨지는 사고가 난다. 클라이언트까지 `utf8mb4`로 통일한다.\n\n**보안.** 앱 계정에 `GRANT ALL`을 주지 않는다. 필요한 DB·테이블만. 3306을 `0.0.0.0/0`으로 열지 않는다. 비밀번호는 `YOUR_DB_PASSWORD`처럼 시크릿으로 주입한다.\n\n**마이그레이션.** 피크 시간에 큰 `ALTER`를 돌리지 않는다. 락·복제 지연을 배포 런북에 적는다.\n\n**비용.** 관리형은 인스턴스·스토리지·백업·읽기 레플리카가 각각 돈이다. 개발 인스턴스는 밤낮 켜 두지 않는다. 슬로우 로그를 끄지 않는다. 인덱스 없이 풀스캔하면 CPU와 IOPS가 같이 오른다.\n\n**관측.** `SHOW PROCESSLIST`로 긴 쿼리를 본다. `performance_schema` 또는 슬로우 쿼리 로그 임계값(초)을 합의한다. 잠금 대기가 길면 트랜잭션을 짧게 나눈다.\n\n앱 계정 예. 호스트는 앱이 붙는 주소만.\n\n```sql\nCREATE USER 'app_user'@'10.0.%' IDENTIFIED BY 'YOUR_DB_PASSWORD';\nGRANT SELECT, INSERT, UPDATE, DELETE ON app.* TO 'app_user'@'10.0.%';\nFLUSH PRIVILEGES;\n```\n\n`%`만으로 전 구간을 열지 않는다. RDS면 마스터로 사용자를 만들고, 보안 그룹이 나머지 경계를 맡는다.\n\n**흔한 실수.** `utf8`과 `utf8mb4` 혼용, PK 없는 테이블, `SELECT *`로 큰 TEXT를 목록에 싣기, 레플리카를 “즉시 일관”으로 가정하기. 네 가지가 장애의 대부분이다.\n\n---\n\n## 5. 정리\n\nMySQL은 익숙함과 호스팅 접근성이 강점이다. **InnoDB + utf8mb4 + 인덱스 설계**만 지켜도 실수 대부분이 줄어든다. 복제는 지연을 전제로 쓰고, 백업은 복원까지 연습한다.\n\n### 체크리스트\n\n- [ ] 테이블 엔진을 InnoDB로 둔다. 트랜잭션·복구가 기본이다.\n- [ ] 문자셋을 `utf8mb4`로 통일한다. `utf8` 3바이트는 이모지에서 깨진다.\n- [ ] `EXPLAIN`으로 목록·상세 쿼리를 한 번씩 본다. 인덱스가 안 타면 트래픽과 함께 죽는다.\n- [ ] binlog 또는 관리형 자동 백업을 켜고 복원을 연습한다.\n- [ ] 앱 계정 권한과 3306 접근 범위를 최소로 줄인다.\n\n`GRANT` 후 `SHOW GRANTS FOR 'app_user'@'10.0.%'`로 실제 권한을 확인한다. 마이그레이션 전용 사용자와 런타임 사용자를 나누면 `DROP` 실수가 줄어든다.\n\n### 연습\n\n1. 위 `posts` 테이블을 만들고 글 열 건을 넣는다.\n2. `user_id` 조건 조회에 `EXPLAIN`을 붙여 `type`을 확인한다.\n3. `mysqldump`로 덤프한 뒤 다른 스키마에 복원해 건수를 비교한다.\n"])</script><script>self.__next_f.push([1,"29:T1c9f,"])</script><script>self.__next_f.push([1,"# MongoDB: 문서형 DB로 유연한 스키마 다루기\n\n\u003e 요약: 문서 단위로 읽고 쓰는 워크로드에 맞는 문서형 DB로, 임베드·인덱스·레플리카의 실무 경계를 정리한다.\n\n---\n\n## 1. 언제 MongoDB인가\n\nMongoDB는 문서형(NoSQL) 데이터베이스다. 행이 아니라 **JSON과 비슷한 문서** 한 장을 기본 단위로 저장한다. 내부 저장은 BSON이다. BSON은 Binary JSON, JSON을 이진으로 확장한 형식이다.\n\n“SQL이 싫어서”만으로 고르면 나중에 조인·일관성에서 비용이 커진다. **함께 읽는 데이터가 한 문서에 모이는지**가 선택 기준이다.\n\n| 맞는 경우 | 덜 맞는 경우 |\n|-----------|--------------|\n| 상품·게시글처럼 문서 구조가 자주 변할 때 | 주문·재고처럼 강한 조인·정규화가 핵심일 때 |\n| 한 화면이 문서 하나면 충분할 때 | 여러 컬렉션을 매번 조인해야 할 때 |\n| 수평 확장·샤딩을 전제로 키를 설계할 때 | 단순 키-값·TTL 캐시면 충분할 때 (Redis) |\n| 이벤트·로그성 문서를 대량 적재할 때 | 복잡한 다테이블 트랜잭션이 업무의 중심일 때 |\n| 프로토타입에서 스키마를 빠르게 바꿀 때 | 리포팅 SQL·제약 엔진이 필요할 때 (PostgreSQL/MySQL) |\n\n유연함은 무기이자 부채다. 필드 이름이 문서마다 달라지면 조회·인덱스가 무너진다.\n\n---\n\n## 2. 핵심 개념\n\n**데이터베이스 → 컬렉션 → 문서.** 컬렉션은 테이블에 가깝다. 문서에는 `_id`가 있다. 기본값은 ObjectId다.\n\n**임베드 vs 참조.** 자주 함께 읽는 작은 객체는 문서 안에 넣는다(임베드). 커지거나 수명주기가 다르면 `ObjectId`로 가리킨다(참조). 배열이 끝없이 늘어나면 문서 16MB 상한과 갱신 비용이 문제가 된다.\n\n**단일 문서 갱신은 원자적**이다. 한 문서 안의 여러 필드는 같이 커밋된다. 여러 문서에 걸친 트랜잭션은 가능하다. 다만 비용·제약이 있다. 관계형처럼 쓰려고 멀티 도큐먼트 트랜잭션을 남발하면 이득이 사라진다.\n\n**레플리카 셋**이 운영 기본이다. Primary에 쓰고 Secondary가 복제한다. 노드 하나짜리 단독 프로세스는 개발용으로만 둔다.\n\n**스키마 검증(Schema Validation)** 으로 “아무 필드나”를 완화한다. 완전 자유는 운영에서 디버깅 비용이 된다.\n\n**TTL 인덱스**는 Time To Live, 만료 후 삭제다. 세션·임시 문서에 쓴다. 캐시 전용이면 Redis가 더 단순한 경우가 많다.\n\n**샤딩**은 데이터를 여러 샤드에 나누는 기법이다. 샤드 키를 잘못 고르면 한 샤드에만 쓰기가 몰린다. 트래픽이 한 노드로 충분하면 샤딩을 미룬다. 레플리카로 읽기·가용성을 먼저 확보한다.\n\n---\n\n## 3. 최소 예제 — 게시글 문서\n\n블로그 글과 작성자 스냅샷을 한 문서에 둔다. 작성자 마스터가 자주 바뀌면 참조로 나눈다. 목록 화면이 글+이름이면 임베드가 맞다.\n\n```js\n// posts 컬렉션 문서 예시\n{\n  _id: ObjectId(\"64f0a1b2c3d4e5f678901234\"),\n  title: \"문서 설계 메모\",\n  tags: [\"db\", \"mongodb\"],\n  author: { id: \"u1\", name: \"Ada\" },\n  published: true,\n  createdAt: ISODate(\"2026-08-26T00:00:00Z\")\n}\n```\n\n```js\ndb.posts.createIndex({ tags: 1, createdAt: -1 })\ndb.posts.createIndex({ \"author.id\": 1 })\n\ndb.posts.insertOne({\n  title: \"문서 설계 메모\",\n  tags: [\"db\", \"mongodb\"],\n  author: { id: \"u1\", name: \"Ada\" },\n  published: true,\n  createdAt: new Date()\n})\n\ndb.posts.find({ tags: \"mongodb\", published: true })\n  .sort({ createdAt: -1 })\n  .limit(20)\n```\n\n느린 쿼리는 실행 계획을 본다.\n\n```js\ndb.posts.find({ tags: \"mongodb\" }).sort({ createdAt: -1 }).explain(\"executionStats\")\n```\n\n`IXSCAN`이 아니라 `COLLSCAN`이면 인덱스가 안 탄다. 쿼리 패턴이 바뀌면 인덱스도 다시 짠다. 인덱스는 쓰기 비용을 올린다. “나중에 쓸지도”로 만들지 않는다.\n\n연결 문자열은 시크릿이다. 예시는 플레이스홀더만 쓴다.\n\n```\nmongodb://APP_USER:YOUR_DB_PASSWORD@db.internal:27017/app?authSource=admin\n```\n\n---\n\n## 4. 운영 시 주의\n\n**연결.** 드라이버 풀 기본값을 앱 인스턴스 수와 곱해 본다. 유휴 연결이 너무 길면 방화벽이 끊는다. `retryWrites`와 타임아웃을 드라이버 문서대로 맞춘다.\n\n**백업.** Atlas 같은 관리형은 스냅샷·PITR을 상품으로 제공한다. PITR은 Point-In-Time Recovery다. 직접 운영이면 레플리카 + 주기 스냅샷을 최소로 둔다. `mongodump`는 논리 백업이다. 큰 클러스터에서는 시간과 부하를 계산한다. 복원을 스테이징에서 한 번 돌린다.\n\n**보안.** 인증을 켠다. 앱 사용자는 해당 DB만. 27017을 인터넷에 열지 않는다. VPC 또는 프라이빗 링크 안쪽에서만 붙는다.\n\n**스키마 드리프트.** 필드명 오타가 조용히 새 필드를 만든다. 검증 규칙이나 앱 DTO로 허용 필드를 고정한다.\n\n**핫 도큐먼트.** 한 문서의 배열에 댓글을 수만 개 붙이면 갱신이 싸워진다. 커지는 관계는 컬렉션을 나눈다.\n\n**비용.** Atlas 등 관리형은 클러스터 티어·스토리지·백업이 요금이다. 인덱스와 불필요 필드가 문서를 키운다. 프로젝션으로 큰 필드를 목록 조회에서 뺀다.\n\n**관측.** 프로파일러 또는 Atlas 슬로우 쿼리로 `COLLSCAN`을 찾는다. 커넥션 수와 replication lag를 대시보드에 둔다.\n\n스키마 검증은 “완전 자유”를 한 단계 줄인다.\n\n```js\ndb.createCollection(\"posts\", {\n  validator: {\n    $jsonSchema: {\n      bsonType: \"object\",\n      required: [\"title\", \"createdAt\"],\n      properties: {\n        title: { bsonType: \"string\", minLength: 1 },\n        published: { bsonType: \"bool\" }\n      }\n    }\n  }\n})\n```\n\n규칙은 느슨하게 시작해도 된다. 필수 필드만이라도 막으면 오타 필드가 줄어든다.\n\n**흔한 실수.** 댓글 배열을 글 문서에 무한히 붙이기, 인덱스 없이 `regex` 전체 스캔, 멀티 도큐먼트 트랜잭션으로 관계형을 흉내 내기. 세 가지가 운영 비용을 키운다.\n\n---\n\n## 5. 정리\n\nMongoDB는 유연함이 무기다. **읽기 패턴에 맞는 문서 설계와 인덱스** 없이 쓰면 관계형보다 더 아프다. 임베드는 작게, 트랜잭션은 드물게, 레플리카와 백업은 기본값으로 둔다.\n\n### 체크리스트\n\n- [ ] 화면 단위로 임베드/참조를 정한다. 조인을 전제로 시작하면 모델이 무너진다.\n- [ ] 실제 `find`/`sort`에 인덱스를 맞춘다. `explain`이 COLLSCAN이면 데이터가 커질수록 죽는다.\n- [ ] 레플리카 셋을 운영 기본으로 둔다. 단일 노드는 디스크 장애에 약하다.\n- [ ] 스키마 검증 또는 앱 계약으로 필드 난립을 막는다.\n- [ ] 인증·네트워크 범위를 최소로 두고 덤프/스냅샷 복원을 연습한다.\n\n### 연습\n\n1. `posts`에 글 다섯 건을 넣고 `tags`+`createdAt` 인덱스로 목록을 조회한다.\n2. 같은 쿼리에 `explain(\"executionStats\")`를 붙여 스캔 방식을 확인한다.\n3. `mongodump` 후 다른 DB 이름에 복원해 건수가 같은지 본다.\n"])</script><script>self.__next_f.push([1,"2a:T1b5a,"])</script><script>self.__next_f.push([1,"# Redis: 인메모리 키-값으로 캐시·세션·큐\n\n\u003e 요약: 캐시·세션·카운터처럼 빠르고 만료가 자연스러운 계층에 쓰는 인메모리 저장소의 패턴과 운영 주의를 정리한다.\n\n---\n\n## 1. 언제 Redis인가\n\nRedis는 메모리 위에서 움직이는 키-값 저장소다. 디스크 DB를 대체하는 도구가 아니다. **빠르고, 만료(TTL)가 자연스럽고, 조금 유실되어도 앱이 다시 만들 수 있는 데이터**에 둔다. TTL은 Time To Live, 키의 수명이다.\n\n| 맞는 경우 | 덜 맞는 경우 |\n|-----------|--------------|\n| API 응답·핫 키 캐시 | 주문·결제처럼 유실되면 안 되는 원본 데이터 |\n| 로그인 세션 스토어 | 복잡한 조인·제약·리포팅 (PostgreSQL/MySQL) |\n| 초당 카운터, 레이트 리밋 | 문서 구조가 큰 도메인 모델 (MongoDB) |\n| 단순 큐, Streams 로그 | 파일 하나면 충분한 로컬 SQL (SQLite) |\n| 짧은 분산 락(신중히) | 영구 보관이 목적인 아카이브 |\n\n주 데이터베이스 앞에 **저지연 계층**으로 두는 그림이 정석이다. Redis만 믿고 원본을 안 남기면 재시작·퇴출(eviction) 때 데이터가 사라진다.\n\n---\n\n## 2. 핵심 개념\n\n키는 문자열이다. 값은 자료구조로 고른다.\n\n| 타입 | 용도 |\n|------|------|\n| String | 캐시 블롭, 카운터(`INCR`) |\n| Hash | 객체 필드 여러 개 |\n| List | 단순 큐(왼쪽 push, 오른쪽 pop) |\n| Set | 중복 없는 태그 |\n| Sorted Set | 점수 랭킹 |\n| Stream | 메시지 로그, 컨슈머 그룹 |\n\n**TTL**을 기본으로 설계한다. 만료 없는 키는 메모리를 영원히 먹는다.\n\n**maxmemory와 eviction.** 메모리가 가득 차면 정책을 따른다. 캐시면 `allkeys-lru`가 흔하다. LRU는 Least Recently Used, 오래 안 쓴 키부터 지운다. 세션처럼 지우면 안 되는 키와 캐시를 한 인스턴스에 섞을 때는 DB 번호나 키 prefix로 경계를 긋는다.\n\n**영속성.** RDB는 특정 시점 스냅샷이다. AOF는 Append Only File, 쓰기를 로그로 남긴다. 둘 다 “디스크 DB만큼” 안전하지 않을 수 있다. `fsync` 주기에 따라 수 초 유실이 있다. 캐시 전용이면 재시작 유실을 전제로 앱이 동작해야 한다.\n\n**핫 키.** 한 키에 트래픽이 몰리면 스케일 아웃 전에 그 노드가 병목이다. 키 설계와 로컬 캐시를 검토한다.\n\n**키 이름.** `서비스:환경:객체:id:필드`처럼 접두를 통일한다. `FLUSHDB` 사고와 키 충돌을 줄인다. 운영 명령을 앱에서 호출하지 않는다.\n\n센티널은 장애 시 프라이머리를 고른다. 클러스터는 슬롯으로 키를 나눈다. 단일 인스턴스로 충분하면 둘 다 미룬다. 운영 복잡도가 먼저 온다.\n\n---\n\n## 3. 최소 예제 — 프로필 캐시와 레이트 리밋\n\n사용자 프로필을 1시간 캐시하고, 분당 요청 수를 센다.\n\n```bash\n# 프로필 캐시 (1시간)\nSET user:42:profile '{\"name\":\"Ada\",\"plan\":\"pro\"}' EX 3600\n\nGET user:42:profile\n\n# 분당 레이트 리밋\nINCR ratelimit:42:2026082615\nEXPIRE ratelimit:42:2026082615 60\n```\n\n앱 쪽 골격은 이렇다. DB가 원본이고 Redis는 가속이다.\n\n```python\n# 의사 코드. 비밀번호는 YOUR_REDIS_PASSWORD 로 주입한다.\ndef get_profile(user_id: int) -\u003e dict:\n    key = f\"user:{user_id}:profile\"\n    cached = redis.get(key)\n    if cached:\n        return json.loads(cached)\n\n    profile = db.fetch_profile(user_id)  # PostgreSQL 등 원본\n    redis.setex(key, 3600, json.dumps(profile))\n    return profile\n```\n\n프로필이 바뀌면 캐시를 지운다. `DEL user:42:profile`. TTL만 기다리면 최대 1시간 낡은 데이터가 나간다.\n\n단순 큐는 리스트로 충분할 때가 많다.\n\n```bash\nLPUSH jobs '{\"type\":\"email\",\"to\":\"ada@example.com\"}'\nBRPOP jobs 5\n```\n\n작업이 유실되면 안 되면 Redis List만 믿지 않는다. 원본 테이블이나 전용 큐를 검토한다.\n\n연결은 인증을 켠다.\n\n```\nredis://:YOUR_REDIS_PASSWORD@redis.internal:6379/0\n```\n\n---\n\n## 4. 운영 시 주의\n\n**연결.** 앱마다 연결을 무한히 열지 않는다. 풀을 쓰고, 서버리스면 연결 폭주를 특히 조심한다. `CLIENT LIST`로 이상 연결을 본다.\n\n**메모리.** `INFO memory`로 사용량을 본다. 큰 키 하나(`LRANGE`로 수백만 건)는 조회 한 번에 서버를 멈출 수 있다. 컬렉션 크기에 상한을 둔다.\n\n**백업·유실.** 캐시면 AOF를 꺼도 된다. 세션·큐면 유실 허용 범위를 팀에 합의한다. RDB/AOF는 백업이지 원본 DB 대체가 아니다. 복원 후 앱이 캐시 미스로 원본을 채울 수 있는지 확인한다.\n\n**보안.** 기본 포트 6379를 인터넷에 열지 않는다. `protected-mode`, 비밀번호 또는 ACL, VPC 내부만. `FLUSHALL` 권한이 앱 계정에 있으면 실수 한 번에 전체가 날아간다.\n\n**비용.** 관리형 Redis는 메모리 크기가 곧 요금이다. TTL 없는 키와 개발용 인스턴스 방치가 비용을 만든다.\n\n**분산 락.** `SET key token NX EX` 패턴을 쓰더라도 만료·프로세스 일시 정지에 깨질 수 있다. 결제처럼 치명적이면 DB 제약이나 전용 잠금 서비스를 검토한다.\n\n**캐시 스탬피드.** 만료가 한순간에 겹치면 원본 DB가 맞는다. 지터(만료를 조금 흩뿌리기)나 단일 채움 락을 검토한다. 측정 없이 미리 복잡하게 만들지 않는다.\n\n**관측.** `INFO stats`의 `evicted_keys`, `keyspace_hits`/`misses`를 본다. 미스율이 높으면 TTL이 너무 짧거나 키가 난립한 것이다.\n\n캐시와 세션을 한 Redis에 둘 거면 DB 번호나 prefix로 나눈다. 캐시 eviction이 세션 키를 지우면 전원이 로그아웃된다. 트래픽이 커지면 인스턴스를 분리하는 편이 낫다.\n\n**흔한 실수.** `KEYS *`를 운영에서 실행하기(블로킹), 큰 `SMEMBERS` 한 방, 비밀번호 없는 6379 퍼블릭 오픈. 모니터링은 `SCAN`을 쓴다.\n\n---\n\n## 5. 정리\n\nRedis는 DB라기보다 **저지연 데이터 구조 서버**다. TTL·메모리·유실 허용을 먼저 합의한다. 원본은 관계형(또는 문서형)에 두고, Redis는 캐시·세션·카운터 계층으로 둔다.\n\n### 체크리스트\n\n- [ ] 모든 캐시 키에 TTL을 단다. 만료 없는 키는 메모리 누수다.\n- [ ] `maxmemory`와 eviction 정책을 정한다. 가득 차면 쓰기가 거절되거나 키가 지워진다.\n- [ ] 캐시 미스 때 원본에서 다시 채울 수 있는지 확인한다. Redis만의 데이터는 재시작에 약하다.\n- [ ] 6379를 프라이빗 네트워크와 인증 뒤로 둔다.\n- [ ] `FLUSHALL`·관리 명령을 앱 계정에서 뺀다.\n\n### 연습\n\n1. `SET`/`GET`/`EXPIRE`로 프로필 캐시를 재현하고 TTL이 0이 되는지 확인한다.\n2. `INCR`+`EXPIRE`로 분당 10회 제한을 흉내 낸다.\n3. 키를 지운 뒤 앱이 DB에서 다시 읽는지(캐시 미스) 경로를 그려 본다.\n"])</script><script>self.__next_f.push([1,"2b:T1ed2,"])</script><script>self.__next_f.push([1,"# SQLite: 파일 하나로 충분한 임베디드 SQL\n\n\u003e 요약: 서버 없이 파일 하나로 SQL을 쓰는 임베디드 DB로, 언제 충분하고 어디서 한계가 나는지를 정리한다.\n\n---\n\n## 1. 언제 SQLite인가\n\nSQLite는 별도 서버 프로세스가 없다. 라이브러리가 **파일 하나**를 데이터베이스로 연다. 설치·계정·포트가 없다. “서버 설치 없이 SQL”이 필요하면 최우선 후보다.\n\n작다는 뜻이 아니다. 임베디드 관계형 엔진이다. 모바일, 데스크톱, CLI, 테스트, 소규모 단일 서버 웹까지 실제 제품에 쓰인다.\n\n| 맞는 경우 | 아닌 경우 |\n|-----------|-----------|\n| 데스크톱·모바일·CLI 로컬 저장 | 여러 서버가 같은 DB 파일을 동시에 쓸 때 |\n| 프로토타입, 테스트 픽스처 | 높은 동시 쓰기 TPS가 필요할 때 |\n| 읽기 위주 소규모 단일 인스턴스 | 운영급 HA·자동 페일오버가 필요할 때 |\n| 엣지·임베디드, 오프라인 우선 앱 | 중앙 관리형 멀티테넌트 DB |\n| CI에서 마이그레이션을 파일로 검증할 때 | 팀 전원이 원격 접속해 같은 DB를 쓸 때 |\n\n“일단 Postgres로 시작”이 습관인 팀도 많다. 단일 노드·배포 단위가 파일과 같으면 SQLite가 운영이 더 단순하다. 반대로 **수평 확장하는 API 서버 여러 대**가 같은 파일을 마운트하면 깨진다.\n\n---\n\n## 2. 핵심 개념\n\n**파일 = 데이터베이스.** `app.db` 하나가 테이블·인덱스·WAL 친구 파일을 포함한다. 경로와 권한·백업이 곧 운영이다.\n\n**동적 타입.** 컬럼에 INTEGER를 선언해도 다른 타입을 넣을 수 있다. 엔진은 관대하다. 앱과 CHECK 제약으로 규약을 지키는 편이 안전하다.\n\n**WAL.** Write-Ahead Log, 미리 쓰기 로그다. `journal_mode=WAL`이면 읽기와 쓰기가 덜 막힌다. 기본 DELETE 저널보다 동시성에 유리한 경우가 많다. WAL 모드면 `-wal`, `-shm` 파일이 옆에 생긴다. 복사할 때 셋 다 필요하거나, 백업 API를 쓴다.\n\n**쓰기 락.** 한 시점에 쓰기 트랜잭션은 사실상 하나다. 읽기는 여러 개 가능하다. 다중 서버가 네트워크 파일 시스템(NFS 등) 위 같은 파일을 쓰면 잠금이 실패한다. 지원하지 않는다고 보는 편이 맞다.\n\n**외래키는 기본이 꺼져 있다.** 연결마다 `PRAGMA foreign_keys = ON`을 켠다. ORM이 켜 주는지도 확인한다.\n\n**트랜잭션**은 `BEGIN` / `COMMIT`이다. 여러 `INSERT`를 한 트랜잭션에 넣으면 쓰기가 훨씬 빠르다.
