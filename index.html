. 컨트롤러가 두꺼워지는 이유는 대개 “일단 여기 넣으면 된다”는 습관이다.\n\n---\n\n## 2. 라우트 기본\n\n```php\nRoute::get('/posts', [PostController::class, 'index']);\nRoute::post('/posts', [PostController::class, 'store']);\nRoute::get('/posts/{post}', [PostController::class, 'show']);\n```\n\n`{post}`가 Eloquent 모델이면 Laravel이 `Post::findOrFail($id)`처럼 찾아 주입한다. 못 찾으면 404다. 이게 **라우트 모델 바인딩**이다.\n\n```php\nRoute::get('/posts/{post:slug}', [PostController::class, 'show']);\n```\n\n슬러그로 찾고 싶으면 `{post:slug}` 또는 모델의 `getRouteKeyName()`을 쓴다. id를 URL에 드러내기 싫을 때 흔하다.\n\n리소스 라우트는 index/store/show/update/destroy를 한 줄로 연다. `apiResource`는 폼용 create/edit 뷰 경로를 빼므로 API에 맞다.\n\n```php\nRoute::resource('posts', PostController::class);\nRoute::apiResource('posts', PostController::class);\n```\n\n```bash\nphp artisan route:list --path=posts\n```\n\n이름이 겹치거나 순서가 꼬이면 `route:list`가 가장 빠른 디버기다.\n\n---\n\n## 3. 그룹 — 접두사·이름·미들웨어\n\n같은 인증·URL 접두사를 반복하지 않으려면 그룹으로 묶는다.\n\n```php\nRoute::middleware(['auth', 'verified'])\n    -\u003eprefix('dashboard')\n    -\u003ename('dashboard.')\n    -\u003egroup(function () {\n        Route::get('/', [DashboardController::class, 'index'])-\u003ename('home');\n        Route::resource('posts', PostController::class);\n    });\n```\n\n링크는 `url('/dashboard')`보다 `route('dashboard.home')`을 쓴다. URL이 바뀌어도 이름만 유지하면 된다.\n\nAPI 버전은 `/api/v1`처럼 URL로 시작하는 팀이 많다. Sanctum(API 인증, 5편)이면 그룹에 `auth:sanctum`을 건다.\n\n```php\nRoute::middleware('auth:sanctum')\n    -\u003eprefix('api/v1')\n    -\u003egroup(base_path('routes/api.php'));\n```\n\n---\n\n## 4. 컨트롤러 스타일\n\n리소스 컨트롤러는 CRUD가 한 모델에 모일 때 읽기 좋다.\n\n```php\nclass PostController extends Controller\n{\n    public function index() { /* ... */ }\n    public function store(StorePostRequest $request) { /* ... */ }\n    public function show(Post $post) { /* ... */ }\n    public function update(UpdatePostRequest $request, Post $post) { /* ... */ }\n    public function destroy(Post $post) { /* ... */ }\n}\n```\n\n유스케이스가 하나면 **invokable**(단일 `__invoke`)이 더 짧다. “발행”, “결제 확정”처럼 동사가 분명한 엔드포인트에 잘 맞는다.\n\n```php\nclass PublishPostController extends Controller\n{\n    public function __invoke(Post $post)\n    {\n        $post-\u003epublish();\n        return redirect()-\u003eroute('posts.show', $post);\n    }\n}\n\nRoute::post('/posts/{post}/publish', PublishPostController::class);\n```\n\n생성자 주입으로 서비스를 받는다. 컨트롤러 안에서 `new PostService`를 하지 않는다.\n\n```php\npublic function __construct(\n    private readonly PostService $posts,\n) {}\n```\n\n---\n\n## 5. 미들웨어\n\n내장 예: `auth`, `guest`, `throttle`, `verified`, `can`. 로그인 여부·요청 횟수·권한처럼 **여러 라우트에 같은 규칙**이 필요할 때 쓴다.\n\n```bash\nphp artisan make:middleware EnsureUserIsAdmin\n```\n\n```php\npublic function handle(Request $request, Closure $next): Response\n{\n    if (! $request-\u003euser()?-\u003eisAdmin()) {\n        abort(403);\n    }\n\n    return $next($request);\n}\n```\n\nLaravel 11+ 등록은 Kernel이 아니라 `bootstrap/app.php`다.\n\n```php\n-\u003ewithMiddleware(function (Middleware $middleware) {\n    $middleware-\u003ealias([\n        'admin' =\u003e \\App\\Http\\Middleware\\EnsureUserIsAdmin::class,\n    ]);\n})\n```\n\n```php\nRoute::middleware('admin')-\u003egroup(/* ... */);\n```\n\n로그인·결제처럼 brute-force가 무서운 곳은 throttle을 더 빡세게 둔다.\n\n```php\nRoute::middleware('throttle:10,1')-\u003epost('/login', /* ... */);\n\nRateLimiter::for('api', function (Request $request) {\n    return Limit::perMinute(60)-\u003eby($request-\u003euser()?-\u003eid ?: $request-\u003eip());\n});\n```\n\n---\n\n## 6. 응답과 CSRF\n\n```php\nreturn view('posts.show', compact('post'));\nreturn response()-\u003ejson(['data' =\u003e $post], 201);\nreturn redirect()-\u003eroute('posts.index')-\u003ewith('status', 'created');\nreturn to_route('posts.show', $post);\n```\n\nAPI는 상태 코드 계약을 먼저 정한다. 생성 201, 삭제 204, 검증 실패 422.\n\n**CSRF**는 다른 사이트가 로그인된 브라우저로 POST를 보내는 공격을 막는다. `web` 그룹의 폼에는 `@csrf`가 필요하다. SPA/API는 Sanctum 쿠키 또는 Bearer 토큰을 쓰고, `web` CSRF 규칙을 그대로 복사하면 깨진다.\n\n```html\n\u003cform method=\"POST\" action=\"/posts\"\u003e\n    @csrf\n    ...\n\u003c/form\u003e\n```\n\n---\n\n## 7. 예외\n\n```php\nabort(404);\nabort(403, '권한 없음');\nthrow ValidationException::withMessages(['email' =\u003e '이미 사용 중']);\n```\n\nAPI와 HTML이 섞이면 `bootstrap/app.php`의 `withExceptions`에서 JSON 여부를 통일한다.\n\n```php\n$exceptions-\u003eshouldRenderJsonWhen(function (Request $request, Throwable $e) {\n    return $request-\u003eis('api/*') || $request-\u003eexpectsJson();\n});\n```\n\n---\n\n## 8. 흔한 실수\n\n- 링크에 `/posts/1`을 하드코딩한다. 이름이 있는 `route()`만 쓴다.\n- 컨트롤러에 쿼리·메일·트랜잭션을 다 넣는다. 테스트와 재사용이 어려워진다.\n- 미들웨어를 `app/Http/Kernel.php`에 등록하려 한다. 11+는 `bootstrap/app.php`다.\n- 로그인 API에 throttle을 안 건다.\n- API인데 CSRF 예외를 아무 경로에나 연다. 필요한 그룹만 연다.\n\n---\n\n## 연습\n\n1. `apiResource('posts')`를 등록하고 `route:list`로 일곱 개가 아니라 API용인지 확인한다.\n2. `PublishPostController` invokable을 만든다.\n3. `admin` 미들웨어로 삭제만 막는다.\n4. 로그인 POST에 `throttle:10,1`을 건다.\n"])</script><script>self.__next_f.push([1,"40:T1b69,"])</script><script>self.__next_f.push([1,"# Eloquent ORM과 데이터베이스\n\n\u003e 요약: Eloquent는 테이블 한 행을 PHP 객체로 다루는 ORM이고, 마이그레이션·관계·N+1을 같이 잡아야 데이터가 깨지지 않는다.\n\n---\n\n## 1. Eloquent란\n\n**Eloquent**는 Laravel의 ORM(Object-Relational Mapping)이다. `posts` 테이블의 한 줄을 `Post` 객체처럼 읽고 저장한다. SQL을 매번 짜지 않아도 되지만, 결국 DB에 쿼리가 나간다. “마법”이 아니라 **쿼리를 대신 만들어 주는 계층**으로 보는 편이 안전하다.\n\n스키마의 진실은 모델 PHP가 아니라 **마이그레이션**이다. 운영 DB를 손으로 고치면 팀원·CI·다음 배포가 서로 다른 테이블을 보게 된다.\n\n```bash\nphp artisan make:model Post -m\n```\n\n```php\nSchema::create('posts', function (Blueprint $table) {\n    $table-\u003eid();\n    $table-\u003eforeignId('user_id')-\u003econstrained()-\u003ecascadeOnDelete();\n    $table-\u003estring('title');\n    $table-\u003estring('slug')-\u003eunique();\n    $table-\u003etext('body');\n    $table-\u003estring('status')-\u003edefault('draft');\n    $table-\u003etimestamp('published_at')-\u003enullable();\n    $table-\u003etimestamps();\n    $table-\u003esoftDeletes();\n    $table-\u003eindex(['status', 'published_at']);\n});\n```\n\n```bash\nphp artisan migrate\nphp artisan migrate:rollback\nphp artisan migrate:fresh --seed   # 로컬만\n```\n\n`migrate:fresh`는 테이블을 지우고 다시 만든다. 운영에서 실행하면 데이터가 사라진다. 팀과 CI는 마이그레이션 파일 리뷰를 필수화한다.\n\n---\n\n## 2. 모델\n\n```php\nclass Post extends Model\n{\n    use SoftDeletes;\n\n    protected $fillable = ['title', 'slug', 'body', 'status', 'published_at'];\n\n    protected function casts(): array\n    {\n        return [\n            'published_at' =\u003e 'datetime',\n            'status' =\u003e PostStatus::class,\n        ];\n    }\n\n    public function user(): BelongsTo\n    {\n        return $this-\u003ebelongsTo(User::class);\n    }\n\n    public function tags(): BelongsToMany\n    {\n        return $this-\u003ebelongsToMany(Tag::class);\n    }\n\n    public function publish(): void\n    {\n        $this-\u003eforceFill([\n            'status' =\u003e PostStatus::Published,\n            'published_at' =\u003e now(),\n        ])-\u003esave();\n    }\n}\n```\n\n`$fillable`은 **대량 할당**(요청 배열을 한 번에 넣는 것)이 허용된 컬럼이다. `$guarded = []`로 전면 개방하면 `is_admin` 같은 필드가 요청에 섞여 들어올 수 있다.\n\n상태 변경은 `$post-\u003estatus = 'published'`보다 `publish()`처럼 메서드로 모은다. Accessor는 `Attribute::make`를 쓴다.\n\n```php\nprotected function title(): Attribute\n{\n    return Attribute::make(\n        set: fn (string $value) =\u003e trim($value),\n    );\n}\n```\n\n---\n\n## 3. 관계\n\n| 관계 | 메서드 | 예 |\n|------|--------|-----|\n| 1:1 | `hasOne` / `belongsTo` | User–Profile |\n| 1:N | `hasMany` / `belongsTo` | User–Post |\n| N:N | `belongsToMany` | Post–Tag |\n| 다형 | `morphMany` / `morphTo` | 댓글이 글·사진에 붙을 때 |\n\n```php\n$post-\u003euser;\n$user-\u003eposts()-\u003elatest()-\u003epaginate(20);\n$post-\u003etags()-\u003esync([1, 2, 3]);\n```\n\n`sync`는 N:N 중간 테이블을 주어진 id 집합으로 맞춘다. 빼먹은 id는 끊긴다.\n\n---\n\n## 4. 쿼리\n\n```php\nPost::query()\n    -\u003ewhere('status', PostStatus::Published)\n    -\u003ewhere('published_at', '\u003c=', now())\n    -\u003elatest('published_at')\n    -\u003epaginate(20);\n\nPost::query()\n    -\u003ewhen($search, fn ($q, $search) =\u003e $q-\u003ewhere('title', 'like', \"%{$search}%\"))\n    -\u003eget();\n```\n\n`when`은 검색어가 있을 때만 조건을 붙인다. if로 쿼리 변수를 분기하는 것보다 읽기 쉽다.\n\n```php\nUser::withCount('posts')-\u003eget();\nPost::where('user_id', $id)-\u003esum('views');\n```\n\n---\n\n## 5. N+1\n\n목록에서 `$post-\u003euser-\u003ename`을 찍으면, 글 20개에 사용자 조회가 20번 더 나간다. 이게 **N+1**이다. 관계 정의를 잘못해서가 아니라, **필요할 때 따로 조회(지연 로딩)** 하기 때문이다.\n\n```php\n// 나쁨\n$posts = Post::all();\nforeach ($posts as $post) {\n    echo $post-\u003euser-\u003ename;\n}\n\n// 좋음 — 미리 한 번에\n$posts = Post::with('user', 'tags')-\u003epaginate(20);\n```\n\n로컬에서 사고를 예외로 만들 수 있다.\n\n```php\nModel::preventLazyLoading(! app()-\u003eisProduction());\n```\n\n운영까지 끄면 장애가 난다. 로컬·테스트만 켜고, 터지는 지점을 `with`로 고친다.\n\n---\n\n## 6. 스코프와 트랜잭션\n\n반복되는 where는 **로컬 스코프**로 이름을 붙인다.\n\n```php\npublic function scopePublished(Builder $query): void\n{\n    $query-\u003ewhere('status', PostStatus::Published)\n        -\u003ewhere('published_at', '\u003c=', now());\n}\n\nPost::published()-\u003elatest()-\u003eget();\n```\n\n글로벌 스코프는 “모든 쿼리에 조건이 붙는다”는 뜻이라 잊기 쉽다. `withoutGlobalScopes`를 빠뜨리면 관리자 화면에 글이 안 보인다.\n\n여러 쓰기가 한 유스케이스면 트랜잭션으로 묶는다. 커밋 전에 메일·HTTP를 넣지 않는다. 롤백돼도 메일은 이미 나갔을 수 있다.\n\n```php\nDB::transaction(function () use ($data) {\n    $order = Order::create(/* ... */);\n    $order-\u003eitems()-\u003ecreateMany($data['items']);\n    $order-\u003euser-\u003edecrement('credits', $data['cost']);\n});\n```\n\n---\n\n## 7. Factory와 인덱스\n\n테스트·시드 데이터는 Factory로 만든다. 손으로 `insert`를 나열하면 스키마가 바뀔 때마다 테스트가 깨진다.\n\n```php\npublic function definition(): array\n{\n    return [\n        'user_id' =\u003e User::factory(),\n        'title' =\u003e fake()-\u003esentence(),\n        'slug' =\u003e fake()-\u003eunique()-\u003eslug(),\n        'body' =\u003e fake()-\u003eparagraphs(3, true),\n        'status' =\u003e PostStatus::Draft,\n    ];\n}\n\npublic function published(): static\n{\n    return $this-\u003estate(fn () =\u003e [\n        'status' =\u003e PostStatus::Published,\n        'published_at' =\u003e now()-\u003esubDay(),\n    ]);\n}\n\nPost::factory()-\u003ecount(50)-\u003epublished()-\u003ecreate();\n```\n\n`where`/`orderBy`/`foreignId`에는 인덱스를 둔다. 대량 처리는 `chunkById`로 메모리를 지킨다.\n\n```php\nPost::query()-\u003ewhere('status', 'draft')-\u003echunkById(200, function ($posts) {\n    //\n});\n```\n\n---\n\n## 8. Soft delete\n\n`delete()`는 `deleted_at`만 채운다. 기본 쿼리에서 빠진다. 진짜 삭제는 `forceDelete()`, 포함 조회는 `withTrashed()`다. 유니크 슬러그를 소프트 삭제 글과 다시 쓰려면 유니크 설계를 먼저 정한다.\n\n생성 시 슬러그 자동 생성은 Observer 또는 모델 `creating` 훅에 둔다.\n\n---\n\n## 9. 흔한 실수\n\n- `$guarded = []`로 모든 컬럼을 연다.\n- `Post::all()` 뒤 루프에서 관계를 읽는다 (N+1).\n- 운영에서 `migrate:fresh`를 친다.\n- 마이그레이션 없이 운영 DB만 고친다.\n- 긴 트랜잭션 안에서 메일·외부 API를 호출한다.\n\n---\n\n## 연습\n\n1. User 1:N Post, Post N:N Tag를 마이그레이션으로 만든다.\n2. `published` 스코프와 factory state를 구현한다.\n3. `preventLazyLoading`을 켜고 N+1을 `with`로 고친다.\n4. 주문 생성 시 트랜잭션으로 order와 items를 저장한다.\n"])</script><script>self.__next_f.push([1,"41:T1b0b,"])</script><script>self.__next_f.push([1,"# Validation, Form Request, API Resource\n\n\u003e 요약: 들어오는 값은 Form Request로 검증하고, 나가는 JSON은 API Resource로 정해 두면 컨트롤러가 얇아진다.\n\n---\n\n## 1. 왜 컨트롤러에서 검증을 빼나\n\n검증 규칙이 컨트롤러에 쌓이면 유스케이스가 안 보인다. Laravel은 이 역할을 **Form Request**에 둔다. HTTP 요청 하나를 위한 클래스이며, “이 사용자가 이 동작을 해도 되는지”(`authorize`)와 “필드가 올바른지”(`rules`)를 함께 담는다.\n\n```bash\nphp artisan make:request StorePostRequest\n```\n\n```php\nclass StorePostRequest extends FormRequest\n{\n    public function authorize(): bool\n    {\n        return $this-\u003euser()?-\u003ecan('create', Post::class) ?? false;\n    }\n\n    public function rules(): array\n    {\n        return [\n            'title' =\u003e ['required', 'string', 'max:120'],\n            'slug' =\u003e ['nullable', 'alpha_dash', 'max:140', 'unique:posts,slug'],\n            'body' =\u003e ['required', 'string'],\n            'tag_ids' =\u003e ['array'],\n            'tag_ids.*' =\u003e ['integer', 'exists:tags,id'],\n        ];\n    }\n\n    public function messages(): array\n    {\n        return [\n            'title.required' =\u003e '제목을 입력하세요.',\n        ];\n    }\n}\n```\n\n```php\npublic function store(StorePostRequest $request)\n{\n    $data = $request-\u003evalidated();\n}\n```\n\n`authorize()`가 false면 403이다. Policy(모델 권한, 5편)와 연결하면 컨트롤러마다 `if`를 반복하지 않는다.\n\n컨트롤러에서는 `$request-\u003eall()`이 아니라 **`validated()`만** 쓴다. all은 검증을 우회한 필드까지 넘긴다.\n\n---\n\n## 2. 자주 쓰는 룰\n\n| 룰 | 의미 |\n|----|------|\n| `required` / `nullable` | 필수 / 빈 값 허용 |\n| `string`, `integer`, `boolean`, `array` | 타입 |\n| `email`, `url`, `uuid` | 형식 |\n| `max`, `min`, `between` | 길이·범위 |\n| `unique:posts,slug` | 유일 |\n| `exists:tags,id` | FK가 실제로 있음 |\n| `confirmed` | `password_confirmation`과 같음 |\n| `Rule::enum(PostStatus::class)` | Enum 값만 |\n| `Rule::unique(...)-\u003eignore($id)` | 수정 시 자기 행은 유일에서 제외 |\n\n```php\nuse Illuminate\\Validation\\Rule;\n\n'title' =\u003e ['required', Rule::unique('posts')-\u003eignore($this-\u003epost)],\n'status' =\u003e ['required', Rule::enum(PostStatus::class)],\n```\n\n수정 API에서 `unique`만 넣고 `ignore`를 빼면, 제목을 안 바꿔도 “이미 사용 중”이 난다. 가장 흔한 실수다.\n\n---\n\n## 3. 검증 전후 훅\n\n슬러그를 비워 두면 제목에서 만들고 싶을 때 `prepareForValidation`을 쓴다. 룰만으로 표현하기 어려운 도메인 금지는 `after`에서 메시지를 추가한다.\n\n```php\nprotected function prepareForValidation(): void\n{\n    $this-\u003emerge([\n        'slug' =\u003e $this-\u003eslug ?: Str::slug($this-\u003etitle ?? ''),\n    ]);\n}\n\npublic function after(): array\n{\n    return [\n        function (Validator $validator) {\n            if ($this-\u003econtainsBlockedPhrase()) {\n                $validator-\u003eerrors()-\u003eadd('body', '허용되지 않는 내용입니다.');\n            }\n        },\n    ];\n}\n```\n\n---\n\n## 4. 검증 실패 JSON\n\nJSON 요청의 기본은 **422**와 `message` + `errors`다. 프론트가 RFC 7807 형태를 원하면 `bootstrap/app.php`의 `withExceptions`에서 한곳에서 맞춘다. 컨트롤러마다 포맷을 바꾸지 않는다.\n\n```php\n$exceptions-\u003erender(function (ValidationException $e, Request $request) {\n    if ($request-\u003eis('api/*')) {\n        return response()-\u003ejson([\n            'title' =\u003e 'Validation Failed',\n            'status' =\u003e 422,\n            'errors' =\u003e $e-\u003eerrors(),\n        ], 422);\n    }\n});\n```\n\n---\n\n## 5. API Resource\n\n**API Resource**는 모델(또는 컬렉션)을 JSON 배열로 바꾸는 계층이다. `return $post;`로 Eloquent를 그대로 내보내면 `password` 해시, 내부 플래그, 아직 안 올린 관계가 섞일 수 있다. 응답 계약은 Resource가 지킨다.\n\n```bash\nphp artisan make:resource PostResource\n```\n\n```php\nclass PostResource extends JsonResource\n{\n    public function toArray(Request $request): array\n    {\n        return [\n            'id' =\u003e $this-\u003eid,\n            'title' =\u003e $this-\u003etitle,\n            'slug' =\u003e $this-\u003eslug,\n            'status' =\u003e $this-\u003estatus-\u003evalue,\n            'author' =\u003e new UserResource($this-\u003ewhenLoaded('user')),\n            'tags' =\u003e TagResource::collection($this-\u003ewhenLoaded('tags')),\n            'published_at' =\u003e $this-\u003epublished_at?-\u003etoIso8601String(),\n        ];\n    }\n}\n```\n\n`whenLoaded`는 `with('user')`로 이미 불러온 때만 중첩한다. 없으면 키가 빠지므로 N+1도 막고, “항상 전체 그래프”를 강제하지 않는다.\n\n```php\nreturn new PostResource($post-\u003eload('user', 'tags'));\nreturn PostResource::collection(Post::with('user')-\u003epaginate());\nreturn (new PostResource($post))-\u003eresponse()-\u003esetStatusCode(201);\n```\n\n페이지네이션을 Resource 컬렉션에 넘기면 `data`·`links`·`meta`가 붙는다. 프론트와 `meta.current_page`를 문서로 맞춰 둔다.\n\n```php\nreturn PostResource::collection(\n    Post::published()-\u003ewith('user')-\u003elatest()-\u003epaginate(20)\n);\n```\n\n무한 스크롤 피드면 오프셋보다 커서가 유리하다.\n\n```php\nPost::published()-\u003eorderBy('id')-\u003ecursorPaginate(20);\n```\n\n---\n\n## 6. DTO는 선택\n\n검증된 배열이 여러 계층을 지나면 키가 뭔지 잊힌다. 팀이 커지면 readonly DTO나 Spatie Laravel Data가 도움이 된다. 작은 API는 `validated()` 배열로도 충분하다.\n\n```php\nreadonly class StorePostData\n{\n    public function __construct(\n        public string $title,\n        public string $body,\n        public array $tagIds = [],\n    ) {}\n\n    public static function fromRequest(StorePostRequest $request): self\n    {\n        $v = $request-\u003evalidated();\n\n        return new self($v['title'], $v['body'], $v['tag_ids'] ?? []);\n    }\n}\n```\n\n---\n\n## 7. 파일 업로드\n\n```php\n'cover' =\u003e ['nullable', 'image', 'max:2048', 'dimensions:max_width=2000'],\n```\n\n```php\n$path = $request-\u003efile('cover')-\u003estore('covers', 's3');\n```\n\n`image` 룰은 MIME를 보지만, 확장자만 믿는 저장은 위험하다. 공개 디스크에 실행 가능한 파일을 두지 말고, 운영에서는 용량·MIME·저장 위치를 추가로 검토한다.\n\n---\n\n## 8. 흔한 실수\n\n- `$request-\u003eall()`을 `Post::create`에 그대로 넣는다.\n- 모델 JSON을 그대로 반환해 숨겨야 할 컬럼이 나간다.\n- 수정 시 `unique`에 `ignore`가 없다.\n- `authorize()`를 항상 true로 두고 Policy를 우회한다.\n- 생성 응답을 200으로 보낸다. 생성은 201이 계약에 맞다.\n\n---\n\n## 연습\n\n1. `StorePostRequest`와 `UpdatePostRequest`를 나눈다. 수정의 unique에는 ignore를 넣는다.\n2. show/index를 `PostResource`로 통일한다.\n3. API 검증 실패 JSON 포맷을 `withExceptions`에서 맞춘다.\n4. 이미지 필드 검증 후 `storage` 또는 S3에 저장한다.\n"])</script><script>self.__next_f.push([1,"42:T18d2,"])</script><script>self.__next_f.push([1,"# 인증·인가 — Sanctum, Policy, Gate\n\n\u003e 요약: Sanctum으로 누구인지 확인하고, Policy로 그 사용자가 이 글이나 주문을 만져도 되는지 가른다.\n\n---\n\n## 1. 인증과 인가\n\n- **인증(Authentication)**: 이 요청이 누구인가. 로그인·토큰.\n- **인가(Authorization)**: 그 사람이 이 글을 수정해도 되는가.\n\n둘을 한 `if`에 섞으면 “로그인만 되면 남의 주문을 본다”는 구멍이 생긴다. Laravel은 인증 스캐폴딩과 **Policy**(모델 단위 권한 클래스)로 이 층을 나눈다.\n\n---\n\n## 2. 무엇을 고를까\n\n| 상황 | 추천 |\n|------|------|\n| Blade 폼 사이트 | Breeze (Blade) / Fortify |\n| 같은 도메인 SPA (Vue/React) | Breeze + **Sanctum 쿠키** |\n| 모바일·외부 클라이언트 | Sanctum **Personal Access Token** |\n| 팀 초대·2FA까지 한 번에 | Jetstream |\n| 관리자 화면 | Filament (가드를 따로) |\n\n**Sanctum**은 Laravel의 가벼운 API/SPA 인증이다. 모바일에는 Bearer 토큰, 같은 사이트의 SPA에는 HttpOnly 쿠키 세션을 준다. **Passport**는 OAuth2 풀스펙(인가 코드, 서드파티 앱)이 필요할 때다. 대부분의 자사 API는 Sanctum이면 충분하다.\n\n```bash\nphp artisan install:api\n# 또는\ncomposer require laravel/breeze --dev\nphp artisan breeze:install\n```\n\n---\n\n## 3. 세션 로그인 (웹)\n\n폼 로그인은 세션 쿠키다. 성공 후 `regenerate`를 빼면 **세션 고정**(남의 세션 id를 심어 로그인하게 하는 공격)에 취약하다.\n\n```php\npublic function store(LoginRequest $request)\n{\n    if (! Auth::attempt($request-\u003eonly('email', 'password'), $request-\u003eboolean('remember'))) {\n        throw ValidationException::withMessages([\n            'email' =\u003e '이메일 또는 비밀번호가 올바르지 않습니다.',\n        ]);\n    }\n\n    $request-\u003esession()-\u003eregenerate();\n\n    return redirect()-\u003eintended('/dashboard');\n}\n```\n\n로그아웃은 `invalidate`와 `regenerateToken`을 함께 쓴다. 비밀번호 규칙은 `Password::defaults()`를 `AppServiceProvider`에서 한곳으로 강화한다.\n\n```php\n'password' =\u003e ['required', 'confirmed', Password::defaults()],\n```\n\n로그인 POST에는 throttle을 건다. 2편에서 본 `throttle:10,1`이 여기 해당한다.\n\n---\n\n## 4. Sanctum 토큰 API\n\n모바일 앱은 보통 로그인 응답의 토큰을 `Authorization: Bearer ...`로 보낸다.\n\n```php\n$user = User::where('email', $request-\u003eemail)-\u003efirst();\n\nif (! $user || ! Hash::check($request-\u003epassword, $user-\u003epassword)) {\n    throw ValidationException::withMessages(['email' =\u003e '자격 증명이 올바르지 않습니다.']);\n}\n\n$token = $user-\u003ecreateToken('mobile', ['posts:read', 'posts:write'])-\u003eplainTextToken;\n\nreturn ['token' =\u003e $token];\n```\n\n평문 비밀번호를 직접 비교하지 않는다. 저장은 `Hash` 파사드(bcrypt/argon2)만 쓴다.\n\n```php\nRoute::middleware('auth:sanctum')-\u003egroup(function () {\n    Route::apiResource('posts', PostController::class);\n    Route::get('/me', fn (Request $r) =\u003e new UserResource($r-\u003euser()));\n});\n```\n\n토큰 **ability**(이 토큰이 할 수 있는 동작의 이름)로 쓰기 권한을 좁힐 수 있다. 로그아웃은 현재 토큰만 지우면 된다.\n\n```php\nif ($request-\u003euser()-\u003etokenCan('posts:write')) {\n    //\n}\n\n$request-\u003euser()-\u003ecurrentAccessToken()-\u003edelete();\n```\n\n토큰을 localStorage에 두면 XSS 한 번에 유출된다. 모바일 네이티브 저장소나, 웹이면 쿠키 세션을 먼저 검토한다.\n\n---\n\n## 5. SPA 쿠키 + CSRF\n\n같은 부모 도메인의 SPA는 토큰 대신 쿠키 세션이 단순한 경우가 많다.\n\n1. 프론트와 API가 공유할 도메인/서브도메인을 정한다.\n2. `/sanctum/csrf-cookie`를 먼저 호출한다.\n3. 로그인 후 `auth:sanctum`이 쿠키 세션을 본다.\n\n핵심 설정은 CORS, `SANCTUM_STATEFUL_DOMAINS`, `SESSION_DOMAIN`이다. 여기가 어긋나면 “로그인은 되는데 다음 요청이 401”이 난다. HttpOnly 쿠키는 JS가 읽지 못해, XSS에 토큰을 내주는 면에서는 Bearer보다 유리한 경우가 많다.\n\n---\n\n## 6. Gate와 Policy\n\n**Gate**는 `publish-post`처럼 이름 있는 작은 권한 검사다. **Policy**는 `Post` 모델의 view/update/delete를 한 클래스에 모은다. 리소스 CRUD는 Policy가 기본이다.\n\n```bash\nphp artisan make:policy PostPolicy --model=Post\n```\n\n```php\nclass PostPolicy\n{\n    public function view(?User $user, Post $post): bool\n    {\n        return $post-\u003eisPublished() || $user?-\u003eid === $post-\u003euser_id;\n    }\n\n    public function update(User $user, Post $post): bool\n    {\n        return $user-\u003eid === $post-\u003euser_id || $user-\u003eisAdmin();\n    }\n\n    public function delete(User $user, Post $post): bool\n    {\n        return $this-\u003eupdate($user, $post);\n    }\n}\n```\n\n컨트롤러·라우트·Blade·Form Request `authorize()`가 같은 Policy를 보게 한다. 한곳만 검사하면 다른 진입점이 뚫린다.\n\n```php\n$this-\u003eauthorize('update', $post);\nGate::authorize('update', $post);\n\nRoute::put('/posts/{post}', /* ... */)-\u003emiddleware('can:update,post');\n```\n\n```blade\n@can('update', $post)\n    \u003ca href=\"{{ route('posts.edit', $post) }}\"\u003e수정\u003c/a\u003e\n@endcan\n```\n\nURL의 `{id}`만 믿고 수정하면 **IDOR**(다른 사람 자원 id를 추측해 만지는 것)가 된다. 바인딩된 `$post`에 대해 반드시 Policy를 탄다.\n\n---\n\n## 7. 역할이 늘어날 때\n\n`if ($user-\u003erole === 'admin')`가 컨트롤러에 흩어지면 나중에 고통스럽다. 역할·퍼미션이 많아지면 Spatie Laravel Permission을 검토하고, **판단은 Policy 안**에서만 하게 둔다.\n\n- role: admin, editor\n- permission: posts.publish\n\n---\n\n## 8. 흔한 실수\n\n- 인증만 하고 소유권 Policy를 생략한다 (IDOR).\n- SPA 토큰을 localStorage에 두고 XSS에 노출한다.\n- 로그인 후 `session()-\u003eregenerate()`를 빼먹는다.\n- 비밀번호를 `md5`로 직접 해시한다. `Hash`만 쓴다.\n- 운영에서 `APP_DEBUG=true`로 스택을 보여 준다.\n- Form Request `authorize`는 true, 컨트롤러 Policy는 따로 — 구멍이 생긴다.\n\n---\n\n## 연습\n\n1. Sanctum으로 로그인·토큰 발급·보호된 `/me`를 만든다.\n2. `PostPolicy`로 본인 글만 수정·삭제되게 한다.\n3. 로그인 라우트에 throttle을 건다.\n4. 다른 사용자로 수정 API를 쳐 403인지 확인한다.\n"])</script><script>self.__next_f.push([1,"43:T1787,"])</script><script>self.__next_f.push([1,"# 테스트 — PHPUnit, Pest, Feature 테스트\n\n\u003e 요약: Pest는 PHPUnit 위에 읽기 쉬운 문법을 얹은 도구이고, Feature 테스트로 API와 권한을 먼저 고정한다.\n\n---\n\n## 1. 무엇을 테스트하나\n\n| 종류 | 용도 |\n|------|------|\n| **Unit** | 프레임워크를 거의 안 타는 순수 로직 |\n| **Feature** | HTTP + DB + 인증처럼 유스케이스 한 줄 |\n| Dusk | 실제 브라우저. 핵심 경로만 |\n\nLaravel에서 가성비가 좋은 층은 Feature다. “로그인하지 않으면 401”, “남의 글은 403”, “검증 실패는 422”처럼 **밖에서 관찰되는 행동**을 잠근다. 복잡한 요금 계산만 Unit으로 뺀다.\n\n```bash\nphp artisan make:test PostApiTest\nphp artisan make:test PostServiceTest --unit\nphp artisan test\n```\n\n---\n\n## 2. Pest\n\n**Pest**는 PHPUnit 위에서 `it('...')` 문법으로 테스트를 쓰는 도구다. 러너는 PHPUnit이고, 단언(assert)도 같다. Laravel 신규 프로젝트에서 Pest를 기본으로 고르는 팀이 많다. PHPUnit 클래스 스타일과 섞어도 동작한다. 팀에서 하나만 정하면 된다.\n\n```bash\ncomposer require pestphp/pest pestphp/pest-plugin-laravel --dev\nphp artisan pest:install\n./vendor/bin/pest\n```\n\n```php\nuse App\\Models\\User;\nuse App\\Models\\Post;\nuse function Pest\\Laravel\\actingAs;\nuse function Pest\\Laravel\\getJson;\nuse function Pest\\Laravel\\putJson;\n\nit('lists published posts only', function () {\n    Post::factory()-\u003epublished()-\u003ecount(3)-\u003ecreate();\n    Post::factory()-\u003ecount(2)-\u003ecreate();\n\n    getJson('/api/posts')\n        -\u003eassertOk()\n        -\u003eassertJsonCount(3, 'data');\n});\n\nit('forbids updating another users post', function () {\n    $author = User::factory()-\u003ecreate();\n    $other = User::factory()-\u003ecreate();\n    $post = Post::factory()-\u003efor($author)-\u003ecreate();\n\n    actingAs($other)\n        -\u003eputJson(\"/api/posts/{$post-\u003eid}\", ['title' =\u003e 'Hack'])\n        -\u003eassertForbidden();\n});\n```\n\n테스트 이름은 구현이 아니라 **비즈니스 문장**이 좋다. `it('calls update on repository')`보다 `it('forbids updating another users post')`가 실패 로그에서 의미가 있다.\n\n---\n\n## 3. HTTP 단언\n\n```php\n$response-\u003eassertOk();\n$response-\u003eassertCreated();\n$response-\u003eassertNoContent();\n$response-\u003eassertUnauthorized();\n$response-\u003eassertForbidden();\n$response-\u003eassertUnprocessable();\n$response-\u003eassertJsonPath('data.email', 'a@b.com');\n$response-\u003eassertJsonStructure(['data' =\u003e [['id', 'title']]]);\n$response-\u003eassertJsonValidationErrors(['email']);\n```\n\n상태 코드만 보고 본문을 안 보면, 200이면서 빈 `data`인 회귀를 놓친다. 계약에 있는 키는 `assertJsonPath`로 한두 개만이라도 고정한다.\n\n---\n\n## 4. DB와 Factory\n\n```php\nuses(RefreshDatabase::class);\n```\n\n**RefreshDatabase**는 테스트마다 마이그레이션으로 DB를 깨끗한 상태로 돌린다. 테스트가 서로를 더럽히지 않게 하는 기본값이다. 느리면 `DatabaseTransactions`나 `php artisan test --parallel`을 검토한다.\n\n데이터는 Factory로 만든다. 테스트 안에 `User::create(['email' =\u003e 'a@b.com', ...])`를 나열하면 컬럼이 늘 때마다 전부 고친다. 3편의 `published()` state가 여기 쓰인다.\n\n운영 DB를 테스트가 건드리면 안 된다. `phpunit.xml`의 `APP_ENV=testing`과 별도 SQLite/테스트 DB를 확인한다.\n\n---\n\n## 5. 인증 헬퍼\n\n세션 가드와 Sanctum 가드를 헷갈리면 “앱에서는 되는데 테스트만 401”이 난다.\n\n```php\nactingAs($user);\nactingAs($user, 'sanctum');\n```\n\n토큰을 실제로 붙이려면:\n\n```php\n$token = $user-\u003ecreateToken('test')-\u003eplainTextToken;\n\n$this-\u003ewithToken($token)-\u003egetJson('/api/me')-\u003eassertOk();\n```\n\n---\n\n## 6. 시간·이벤트·큐·외부 HTTP\n\n시간은 `now()`에 의존하면 CI에서 가끔 실패한다. Carbon으로 고정한다.\n\n```php\nuse Illuminate\\Support\\Carbon;\nuse Illuminate\\Support\\Facades\\Event;\nuse Illuminate\\Support\\Facades\\Http;\nuse Illuminate\\Support\\Facades\\Notification;\nuse Illuminate\\Support\\Facades\\Queue;\n\nit('sets published_at when publishing', function () {\n    Carbon::setTestNow('2026-01-01 12:00:00');\n    // ...\n});\n\nEvent::fake([PostPublished::class]);\nQueue::fake();\nNotification::fake();\n\nEvent::assertDispatched(PostPublished::class);\nQueue::assertPushed(SendWelcomeEmail::class);\nNotification::assertSentTo($user, WelcomeNotification::class);\n\nHttp::fake([\n    'pay.example.com/*' =\u003e Http::response(['ok' =\u003e true], 200),\n]);\n```\n\n메일·결제 네트워크를 테스트가 치면 느리고 flaky하다. `Http::fake()` / `Queue::fake()`가 기본이다. 큐 워커까지 진짜로 돌리는 테스트는 소수만 둔다.\n\n---\n\n## 7. 인가는 네 줄이면 회귀를 막는다\n\n한 리소스에 아래만 있어도 보안 구멍이 다시 열리기 어렵다.\n\n- guest → 401\n- 다른 사용자 → 403\n- 소유자 → 200\n- 관리자 → 200 (역할이 있다면)\n\n미들웨어 `auth`만 있고 Policy 테스트가 없으면, 인증된 아무나 통과하는 코드를 머지해도 초록불이 유지된다.\n\n---\n\n## 8. 테스트 환경\n\n`phpunit.xml` 또는 `Pest.php`에서:\n\n- `APP_ENV=testing`\n- SQLite `:memory:` 또는 전용 DB\n- `MAIL_MAILER=array`\n- `QUEUE_CONNECTION=sync` (또는 테스트에서 fake)\n\n`.env.testing`을 두는 팀도 있다. 로컬 `.env`의 Redis·실메일 설정이 테스트에 새어 들면 안 된다.\n\n---\n\n## 9. 흔한 실수\n\n- private 메서드를 리플렉션으로 테스트한다. 공개 행동만 본다.\n- 한 `it`에 생성·수정·삭제·권한을 다 넣는다. 실패 지점이 안 보인다.\n- `sleep`이나 실제 시계에 의존한다.\n- Factory 없이 하드코딩 insert를 반복한다.\n- 외부 결제 URL을 테스트가 호출한다.\n\n---\n\n## 연습\n\n1. 게시글 생성 성공(201)과 검증 실패(422) Feature 테스트를 작성한다.\n2. 타인 수정 403을 고정한다.\n3. `Http::fake`로 결제 클라이언트를 고립한다.\n4. `Queue::fake`로 환영 메일 Job이 쌓이는지 확인한다.\n"])</script><script>self.__next_f.push([1,"44:T1877,"])</script><script>self.__next_f.push([1,"# 큐·Job·이벤트·스케줄링\n\n\u003e 요약: 메일·이미지처럼 느린 일은 Job 큐로 넘기고, 이벤트와 스케줄러로 후처리와 매일 할 일을 운영한다.\n\n---\n\n## 1. 왜 요청 안에서 메일을 보내지 않나\n\nHTTP 요청은 짧게 끝나야 한다. 아래는 요청 스레드에 두지 않는다.\n\n- 메일·SMS\n- 이미지 리사이즈\n- 외부 API를 여러 번 호출\n- 대량 CSV 내보내기\n\n**큐(queue)** 는 “나중에 할 일”을 저장하는 대기열이다. **Job**은 그 대기열에 넣는 작업 한 건이다. 사용자는 201을 바로 받고, 워커 프로세스가 메일을 보낸다.\n\n```env\nQUEUE_CONNECTION=database\n# 운영은 redis를 흔히 쓴다\n```\n\n```bash\nphp artisan queue:table\nphp artisan queue:failed-table\nphp artisan migrate\nphp artisan queue:work\n```\n\n`queue:work`가 안 떠 있으면 Job은 테이블에만 쌓이고 아무 일도 안 일어난다. 로컬에서 “메일이 안 간다”의 원인 1위가 이것이다.\n\n---\n\n## 2. Job\n\n```bash\nphp artisan make:job SendWelcomeEmail\n```\n\n```php\nclass SendWelcomeEmail implements ShouldQueue\n{\n    use Dispatchable, InteractsWithQueue, Queueable, SerializesModels;\n\n    public int $tries = 3;\n    public int $backoff = 10;\n\n    public function __construct(\n        public User $user,\n    ) {}\n\n    public function handle(Mailer $mailer): void\n    {\n        $mailer-\u003eto($this-\u003euser)-\u003esend(new WelcomeMail($this-\u003euser));\n    }\n\n    public function failed(?Throwable $e): void\n    {\n        logger()-\u003eerror('welcome mail failed', [\n            'user_id' =\u003e $this-\u003euser-\u003eid,\n            'error' =\u003e $e?-\u003egetMessage(),\n        ]);\n    }\n}\n```\n\n`ShouldQueue`가 있어야 비동기다. 없으면 `dispatch`해도 그 자리에서 `handle`이 돈다.\n\n```php\nSendWelcomeEmail::dispatch($user);\nSendWelcomeEmail::dispatch($user)-\u003edelay(now()-\u003eaddMinutes(5));\nSendWelcomeEmail::dispatch($user)-\u003eonQueue('mail');\n```\n\n`SerializesModels`는 모델 전체 대신 id를 큐에 넣는다. 워커가 실행할 때 다시 조회한다. 그래서 트랜잭션이 끝나기 전에 디스패치하면 **아직 없는 행**을 워커가 읽는다.\n\n---\n\n## 3. 멱등성과 중복\n\n큐는 최소 한 번이 아니라 **적어도 한 번, 가끔 두 번**이라고 가정한다. 네트워크 타임아웃 후 재시도가 겹칠 수 있다.\n\n같은 환영 메일이 두 번 나가지 않게:\n\n```php\nclass SendWelcomeEmail implements ShouldQueue, ShouldBeUnique\n{\n    public function uniqueId(): string\n    {\n        return (string) $this-\u003euser-\u003eid;\n    }\n}\n```\n\n결제·웹훅은 unique만으로 부족하다. 처리한 id를 테이블에 남기는 **idempotency key**와 함께 설계한다.\n\n---\n\n## 4. 이벤트와 리스너\n\n**이벤트**는 “주문이 접수됐다”처럼 도메인에서 일어난 일의 이름이다. 주문 서비스가 메일·재고·통계를 직접 알 필요가 없다. 리스너가 각자 구독한다.\n\n```bash\nphp artisan make:event OrderPlaced\nphp artisan make:listener SendOrderConfirmation --event=OrderPlaced\n```\n\n```php\nOrderPlaced::dispatch($order);\n```\n\n리스너에 `ShouldQueue`를 붙이면 발행은 가볍고 후처리는 워커가 한다. 서비스 클래스가 비대해지는 것을 막는 것이 목적이다. 이벤트를 남발하면 흐름이 안 보인다. **여러 관심사가 한 유스케이스에 붙을 때**만 쓴다.\n\n---\n\n## 5. 커밋 후에 디스패치\n\n```php\nDB::transaction(function () use ($data) {\n    $order = Order::create(/* ... */);\n    DB::afterCommit(fn () =\u003e OrderPlaced::dispatch($order));\n});\n```\n\n또는 Job에 `ShouldDispatchAfterCommit`을 붙인다. 커밋 전 디스패치 → 롤백됐는데 메일은 나가고, 워커는 없는 주문을 찾는 레이스가 난다.\n\n```php\nclass SendWelcomeEmail implements ShouldQueue, ShouldDispatchAfterCommit\n```\n\n---\n\n## 6. Horizon\n\n**Horizon**은 Redis 큐를 위한 대시보드이자 프로세스 관리자다. 큐별 워커 수, 대기 시간, 실패 Job을 UI로 본다. `QUEUE_CONNECTION=database`면 Horizon의 본래 가치가 없다. Redis일 때 쓴다.\n\n```bash\ncomposer require laravel/horizon\nphp artisan horizon:install\nphp artisan horizon\n```\n\n운영에서는 `queue:work`를 SSH에 띄워 두지 않는다. Supervisor(또는 컨테이너)가 Horizon/워커를 재시작한다.\n\n---\n\n## 7. 실패와 스케줄\n\n```bash\nphp artisan queue:failed\nphp artisan queue:retry all\n```\n\n```php\npublic function retryUntil(): DateTime\n{\n    return now()-\u003eaddHour();\n}\n```\n\n실패를 삼키고 `failed()`도 없으면 사용자는 “메일이 안 온다”만 본다. Slack/메일 알림 또는 Horizon 알림을 붙인다. `$timeout`을 안 주면 워커가 한 Job에 영원히 묶일 수 있다.\n\n스케줄은 Laravel 11+에서 `routes/console.php`에 둔다. 서버 cron은 **1분마다 `schedule:run` 한 줄**만 있으면 된다.\n\n```php\nuse Illuminate\\Support\\Facades\\Schedule;\n\nSchedule::command('reports:daily')-\u003edailyAt('01:00');\nSchedule::job(new PruneOldTokens)-\u003ehourly();\nSchedule::call(fn () =\u003e Cache::forget('homepage'))-\u003eeveryFiveMinutes();\n```\n\n```cron\n* * * * * cd /path \u0026\u0026 php artisan schedule:run \u003e\u003e /dev/null 2\u003e\u00261\n```\n\n겹쳐 돌면 안 되는 작업은 `withoutOverlapping()`을, 여러 서버면 `onOneServer()`를 쓴다.\n\n---\n\n## 8. 메일·알림\n\n```bash\nphp artisan make:mail WelcomeMail --markdown=mail.welcome\nphp artisan make:notification InvoicePaid\n```\n\n```php\n$user-\u003enotify(new InvoicePaid($invoice));\n```\n\n채널은 mail, database, slack 등이다. 로컬은 Mailpit 또는 `log` 드라이버로 실제 발송을 끈다.\n\n---\n\n## 9. 흔한 실수\n\n- 워커를 안 켜 두고 Job이 “먹통”이라고 한다.\n- 트랜잭션 안에서 바로 `dispatch`한다.\n- 큐 payload에 HTML·파일 전체를 넣는다. id만 넣고 워커가 읽는다.\n- `$tries` / `$timeout`이 없어 무한 재시도·무한 점유.\n- 메일·결제 Job을 우선순위 없이 `default` 한 줄에 넣는다. `mail` / `high`로 나눈다.\n\n---\n\n## 연습\n\n1. 회원가입 후 `SendWelcomeEmail`을 afterCommit으로 보낸다.\n2. `OrderPlaced` 이벤트와 큐 리스너를 만든다.\n3. Job을 실패시키고 `queue:failed`를 확인한다.\n4. 매일 자정 임시 파일 정리 스케줄을 등록한다.\n"])</script><script>self.__next_f.push([1,"45:T1679,"])</script><script>self.__next_f.push([1,"# 캐시·Redis·성능 최적화\n\n\u003e 요약: 느린 쿼리를 먼저 고친 뒤 Redis 캐시를 쓰고, 무효화 지점을 정해 두지 않으면 캐시는 낡은 화면이 된다.\n\n---\n\n## 1. 최적화 순서\n\n캐시는 느린 증상을 가릴 수 있지만, N+1을 캐시하면 **틀린 결과가 더 빨리** 나간다. 순서를 지킨다.\n\n1. 느린 쿼리·N+1 제거 (3편)\n2. 메일·리사이즈는 큐로 (7편)\n3. 읽기 많은 결과를 캐시\n4. HTTP 캐시·CDN\n5. 필요할 때만 Octane·스케일 아웃\n\n`Cache::remember`를 모든 메서드에 뿌리면 **무효화**(언제 지울지)를 아무도 모른다.\n\n---\n\n## 2. Redis와 드라이버\n\n**Redis**는 메모리 키-값 저장소다. Laravel에서는 캐시, 세션, 큐, 속도 제한, 분산 락에 같은 인스턴스를 쓰는 경우가 많다. 용도별로 DB 번호를 나누거나, 트래픽이 커지면 인스턴스를 분리한다.\n\n```env\nCACHE_STORE=redis\nREDIS_CLIENT=phpredis\n```\n\n| 드라이버 | 언제 |\n|----------|------|\n| `array` | 요청 안만. 테스트 |\n| `database` / `file` | 작은 단일 서버 |\n| `redis` | 실무 기본 |\n\n파일 캐시는 여러 웹 서버에서 공유되지 않는다. 스케일 아웃하면 Redis(또는 Memcached)가 맞다.\n\n---\n\n## 3. 기본 API\n\n```php\n$post = Cache::remember('posts.'.$id, now()-\u003eaddMinutes(10), function () use ($id) {\n    return Post::with('user')-\u003efindOrFail($id);\n});\n\nCache::put('key', $value, 600);\nCache::forget('posts.'.$id);\nCache::flush(); // 운영에서 전부 삭제 — 거의 쓰지 않는다\n```\n\n`remember`는 키가 있으면 반환하고, 없으면 클로저를 실행해 저장한다. TTL(수명) 없는 `forever`는 무효화를 반드시 코드로 해야 한다.\n\n태그(Redis/Memcached)로 게시글 묶음을 한 번에 지운다.\n\n```php\nCache::tags(['posts', 'user:'.$userId])-\u003eput($key, $value, 600);\nCache::tags(['posts'])-\u003eflush();\n```\n\ndatabase 드라이버는 태그를 지원하지 않는다. 로컬은 database, 운영은 Redis면 태그 코드가 운영에서만 동작한다. 드라이버를 맞춘다.\n\n갱신은 Observer 한곳에 모은다. 컨트롤러마다 `forget`을 흩뿌리면 빠뜨린다.\n\n```php\npublic function updated(Post $post): void\n{\n    Cache::forget('posts.'.$post-\u003eid);\n    Cache::tags(['posts'])-\u003eflush();\n}\n```\n\n목록을 `posts.published.page.'.$page`로 캐시하면 페이지마다 키가 는다. 글 하나 수정에 태그 flush가 없으면 목록이 하루 종일 옛날이다.\n\n---\n\n## 4. 프레임워크 캐시 (운영)\n\n설정·라우트·뷰를 PHP 파일로 묶어 부팅을 줄인다. **배포 파이프라인**에서 돌리고, 로컬에서 `route:cache`를 켜 두면 새 라우트가 안 보인다.\n\n```bash\nphp artisan config:cache\nphp artisan route:cache\nphp artisan view:cache\nphp artisan event:cache\n```\n\n`config:cache` 뒤에 코드의 `env()`가 비는 문제는 1편과 같다.\n\n---\n\n## 5. HTTP 캐시\n\n```php\nreturn response($content)\n    -\u003eheader('Cache-Control', 'public, max-age=60')\n    -\u003esetEtag(md5($content));\n```\n\n`public`은 CDN·공유 캐시가 응답을 저장해도 된다는 뜻이다. **로그인 사용자마다 다른 JSON**에 `public`을 붙이면 남의 이름이 캐시에 남는다. 개인화는 `private` 또는 캐시하지 않는다.\n\n---\n\n## 6. 락\n\n같은 주문에 결제 요청이 두 번 들어오면 Redis 락으로 임계 구역을 좁힌다. 락은 DB 유니크 제약을 대체하지 않는다. 둘 다 쓰는 편이 안전하다.\n\n```php\n$lock = Cache::lock('order:'.$orderId, 10);\n\nif ($lock-\u003eget()) {\n    try {\n        // 한 번에 하나만\n    } finally {\n        $lock-\u003erelease();\n    }\n}\n```\n\n락을 못 받으면 빈 200을 주면 클라이언트가 성공으로 오해한다. 409나 재시도 안내를 정한다.\n\n---\n\n## 7. 쿼리가 여전히 먼저다\n\n- `preventLazyLoading`으로 N+1을 로컬에서 터뜨린다.\n- `select`로 필요한 컬럼만. `with(['user:id,name'])`처럼 제한한다.\n- `where`/`orderBy`에 인덱스, 의심되면 `EXPLAIN`.\n- 대량은 `chunkById` / `lazyById`.\n\n```php\nPost::with([\n    'user:id,name',\n    'tags:id,name',\n    'comments' =\u003e fn ($q) =\u003e $q-\u003elatest()-\u003elimit(5),\n])-\u003eget();\n```\n\nDebugbar·Telescope는 로컬/스테이징용이다. 요청당 쿼리 개수를 숫자로 본다. 감으로 “Redis 넣자”보다 쿼리 20번이 원인인 경우가 많다.\n\n---\n\n## 8. Octane은 선택\n\n**Octane**은 Swoole/RoadRunner로 앱을 메모리에 상주시켜, 요청마다 프레임워크를 다시 켜는 비용을 줄인다. 트래픽이 크고 부트 비용이 CPU를 잡아먹을 때 이득이다.\n\n주의: static이나 싱글톤에 요청 데이터를 남기면 **다음 사용자에게 유출**된다. 일반 PHP-FPM에서는 요청이 끝나면 사라지던 습관이 Octane에서는 남는다. 도입 전에 상태 오염을 점검하고, 배포 시 워커 리로드 전략이 필요하다.\n\n```bash\ncomposer require laravel/octane\nphp artisan octane:install\n```\n\n---\n\n## 9. 흔한 실수\n\n- 측정 없이 전부 `remember`한다.\n- `Cache::flush()`로 세션·다른 앱 키까지 지운다.\n- 개인화 응답에 `Cache-Control: public`.\n- 수정 시 `forget`을 빼먹어 관리자가 “저장했는데 안 바뀐다”고 한다.\n- Redis 없이 태그 캐시를 전제한다.\n\n측정은 p95 지연, 요청당 쿼리 수, Redis hit 비율, 큐 대기 시간을 같이 본다. Telescope는 운영 전면 공개 금지.\n\n---\n\n## 연습\n\n1. 게시글 상세를 `remember`하고, 수정 Observer에서 `forget`한다.\n2. Redis lock으로 중복 결제 요청을 거절한다.\n3. 스테이징에서 `config:cache` / `route:cache` 후 앱이 뜨는지 확인한다.\n4. 목록 API 쿼리 수를 `with` 전후로 비교한다.\n"])</script><script>self.__next_f.push([1,"46:T1927,"])</script><script>self.__next_f.push([1,"# Blade·Livewire·Inertia와 API 프론트 전략\n\n\u003e 요약: Blade·Livewire·Inertia·순수 API 중 제품에 맞는 프론트를 고르고, 한 앱 안에서도 경계를 나누면 된다.\n\n---\n\n## 1. “전부 React”가 기본값은 아니다\n\n프론트 선택은 팀 취향보다 **누가 화면을 소유하는지**에 가깝다. Laravel이 HTML을 그리면 검증·인가·라우트가 한곳에 남는다. 별도 SPA면 그 계약을 API로 문서화해야 한다.\n\n| 상황 | 추천 |\n|------|------|\n| 관리자·내부툴·폼이 많음 | Filament 또는 Blade/Livewire |\n| 멀티페이지, SEO | **Blade** (+ 필요한 곳만 JS) |\n| SPA UX인데 Laravel 라우트·검증을 유지 | **Inertia** (Vue/React/Svelte) |\n| 모바일 앱과 웹이 따로 | Sanctum API + 별도 프론트 |\n| 위젯·부분 갱신 | Livewire 또는 Echo 방송 |\n\n한 제품에 마케팅은 Blade, 앱은 Inertia, 어드민은 Filament여도 된다. 경계를 URL이나 레이아웃으로 명확히 한다.\n\n---\n\n## 2. Blade\n\n**Blade**는 Laravel 서버가 HTML을 조립하는 템플릿이다. `{{ $var }}`는 이스케이프되어 XSS를 줄인다. `{!! $html !!}`는 신뢰한 HTML만 넣는다. 사용자 입력을 그대로 `{!! !!}`에 넣으면 스크립트가 실행된다.\n\n```blade\n\u003cx-app-layout\u003e\n    \u003cx-slot:title\u003e{{ $post-\u003etitle }}\u003c/x-slot:title\u003e\n\n    \u003carticle\u003e\n        \u003ch1\u003e{{ $post-\u003etitle }}\u003c/h1\u003e\n        \u003cp\u003e{{ $post-\u003euser-\u003ename }} · {{ $post-\u003epublished_at?-\u003ediffForHumans() }}\u003c/p\u003e\n        \u003cdiv\u003e{!! $post-\u003erendered_body !!}\u003c/div\u003e\n    \u003c/article\u003e\n\n    @can('update', $post)\n        \u003ca href=\"{{ route('posts.edit', $post) }}\"\u003e수정\u003c/a\u003e\n    @endcan\n\u003c/x-app-layout\u003e\n```\n\n컴포넌트는 반복 UI를 태그처럼 재사용한다. 폼은 `@csrf`, PUT/PATCH는 `@method('PUT')`이 필요하다. 빼먹으면 419가 난다.\n\n```bash\nphp artisan make:component Alert\n```\n\n```blade\n\u003cx-alert type=\"success\" :message=\"session('status')\" /\u003e\n```\n\n링크는 `route('posts.edit', $post)`를 쓴다. 경로 하드코딩은 2편과 같은 실수다.\n\n---\n\n## 3. Vite\n\n자산 파이프라인의 기본은 **Vite**다. Mix는 레거시다.\n\n```blade\n@vite(['resources/css/app.css', 'resources/js/app.js'])\n```\n\n```bash\nnpm install\nnpm run dev\nnpm run build\n```\n\n운영에서 `npm run build`를 빼면 CSS가 없거나 `@vite`가 개발 서버를 찾다 실패한다. 배포 스크립트에 포함한다.\n\n---\n\n## 4. Livewire\n\n**Livewire**는 PHP 컴포넌트 상태로 화면을 부분 갱신한다. 검색 박스처럼 AJAX를 직접 짜기 싫은 CRUD·필터·위자드에 맞다. 오프라인 앱이나 캔버스급 인터랙션에는 맞지 않다.\n\n```bash\ncomposer require livewire/livewire\nphp artisan make:livewire PostSearch\n```\n\n```php\nclass PostSearch extends Component\n{\n    public string $q = '';\n\n    public function render()\n    {\n        return view('livewire.post-search', [\n            'posts' =\u003e Post::query()\n                -\u003ewhen($this-\u003eq, fn ($q) =\u003e $q-\u003ewhere('title', 'like', \"%{$this-\u003eq}%\"))\n                -\u003elatest()\n                -\u003epaginate(10),\n        ]);\n    }\n}\n```\n\n```blade\n\u003cdiv\u003e\n    \u003cinput wire:model.live.debounce.300ms=\"q\" /\u003e\n    @foreach ($posts as $post)\n        \u003cdiv wire:key=\"post-{{ $post-\u003eid }}\"\u003e{{ $post-\u003etitle }}\u003c/div\u003e\n    @endforeach\n    {{ $posts-\u003elinks() }}\n\u003c/div\u003e\n```\n\n루프에 `wire:key`가 없으면 잘못된 행이 갱신된다. `wire:model.live`는 타이핑마다 서버 왕복이므로 debounce를 둔다. 권한 없는 프로퍼티를 public으로 열어 두면 클라이언트가 값을 조작할 수 있다. 민감한 결정은 서버 메서드에서 Policy로 다시 본다.\n\nLivewire 3의 islands·Volt는 팀 스타일에 맞게 선택한다. 필수는 아니다.\n\n---\n\n## 5. Inertia\n\n**Inertia**는 서버가 JSON 대신 **페이지 컴포넌트 이름 + props**를 내려 주고, 프론트가 그 페이지를 그리는 방식이다. REST API를 하나 더 운영하는 SPA가 아니다. 라우팅·세션·Form Request 검증은 Laravel이 유지한다.\n\n```bash\nphp artisan breeze:install vue\n```\n\n```php\nreturn Inertia::render('Posts/Show', [\n    'post' =\u003e new PostResource($post),\n]);\n```\n\n폼은 Inertia 헬퍼가 검증 에러를 공유 props로 돌려준다. API Resource를 props에 쓰면 JSON API와 필드 이름을 맞출 수 있다.\n\n```js\nimport { useForm } from '@inertiajs/vue3'\n\nconst form = useForm({ title: '', body: '' })\nform.post('/posts')\n```\n\n모바일 앱이 같은 백엔드를 쓰면 Inertia만으로는 부족하다. 그때는 4~5편의 API + Sanctum을 따로 연다.\n\n---\n\n## 6. 순수 API + SPA\n\nNext.js·Nuxt 등 프론트가 완전히 분리되면:\n\n- Form Request\n- API Resource\n- Sanctum (쿠키 또는 토큰)\n- OpenAPI (scribe / scramble)\n\nCORS, 쿠키 도메인, `/api/v1` 버전을 계약으로 적는다. Inertia와 순수 API를 한 컨트롤러에서 섞으면 응답 형태가 흔들린다. 진입점을 나눈다.\n\n---\n\n## 7. 실시간과 어드민\n\n**Reverb**는 Laravel 공식 WebSocket 서버다. Echo가 브라우저에서 채널을 구독한다. 알림 벨, 대시보드 숫자 갱신에 쓴다. 채팅 전체를 Reverb만으로 만들기 전에 규모를 본다.\n\n```bash\ncomposer require laravel/reverb\nphp artisan reverb:install\n```\n\n```php\nbroadcast(new OrderStatusUpdated($order))-\u003etoOthers();\n```\n\n**Filament**는 관리자 CRUD·필터·권한을 리소스 기반으로 빨리 만든다. 고객용 UI와 관리자 UI를 한 Blade 트리에 섞지 않을 때 생산성이 크다. 패널 가드와 Policy를 고객 가드와 분리한다.\n\n```bash\ncomposer require filament/filament\nphp artisan filament:install --panels\n```\n\n---\n\n## 8. 조합 예\n\n1. 마케팅 사이트: Blade + Vite\n2. SaaS 본편: Inertia + Fortify/Breeze + Policy\n3. 내부 어드민: Filament\n4. 모바일: Sanctum API\n5. 일부 위젯: Livewire 또는 Echo\n\n---\n\n## 9. 흔한 실수\n\n- 사용자 HTML을 `{!! !!}`에 넣는다.\n- Livewire public 프로퍼티로 가격·역할을 받는다.\n- Inertia와 JSON API를 한 액션에서 분기하다 계약이 갈라진다.\n- `npm run build` 없이 배포한다.\n- 어드민을 고객 `web` 가드에 그대로 연다.\n\n---\n\n## 연습\n\n1. Blade 컴포넌트로 플래시 알림을 만든다.\n2. Livewire 검색 리스트 **또는** Inertia 상세 페이지 하나를 연결한다.\n3. 상세 데이터는 `PostResource` 형태로 내려 준다.\n4. (선택) Reverb로 알림 이벤트 하나를 방송한다.\n"])</script><script>self.__next_f.push([1,"47:T1a5b,"])</script><script>self.__next_f.push([1,"# 운영 배포 — Sail, Forge/Vapor, 프로덕션 체크리스트\n\n\u003e 요약: Sail로 로컬을 맞추고 Forge나 컨테이너로 배포하며, 워커·스케줄·시크릿을 배포의 일부로 둔다.\n\n---\n\n## 1. 환경부터 가른다\n\n| ENV | DEBUG | 목적 |\n|-----|-------|------|\n| local | true | 개발 |\n| staging | false 권장 | 배포 리허설 |\n| production | **false** | 실제 사용자 |\n\n```env\nAPP_ENV=production\nAPP_DEBUG=false\nAPP_URL=https://example.com\nLOG_CHANNEL=stack\nLOG_LEVEL=info\n```\n\n`APP_DEBUG=true`인 운영은 스택 트레이스와 환경 값이 그대로 보인다. `.env`는 서버나 시크릿 매니저에만 둔다. 이미지 레이어에 키를 구우면 레지스트리만 읽어도 유출된다.\n\n---\n\n## 2. 배포가 하는 일\n\n코드만 올리는 것으로 끝나지 않는다. 의존성, 마이그레이션, 설정 캐시, 프론트 빌드, **워커·스케줄러**가 한 세트다.\n\n```bash\ncomposer install --no-dev --optimize-autoloader\nphp artisan migrate --force\nphp artisan config:cache\nphp artisan route:cache\nphp artisan view:cache\nphp artisan event:cache\nphp artisan storage:link\nnpm ci \u0026\u0026 npm run build\n```\n\n`--force`는 운영에서 마이그레이션 확인 프롬프트를 건너뛴다. CI/배포 스크립트에서만 쓰고, 로컬 습관으로 두지 않는다.\n\n무중단이면 심링크 릴리즈(Envoyer 스타일)나 `artisan down`을 검토한다. Horizon을 쓰면 배포 후 `horizon:terminate`로 워커가 새 코드를 물게 한다. 웹만 재시작하고 워커가 옛 코드를 붙잡고 있으면 Job이 옛날 버그로 돈다.\n\n큐 워커, Horizon, `schedule:run`, Reverb는 웹 PHP-FPM과 **별도 프로세스**다. 웹 컨테이너만 올리면 메일이 안 가고 cron도 안 돈다.\n\n---\n\n## 3. Sail은 로컬용\n\n**Sail**은 Laravel 공식 Docker Compose다. PHP·MySQL·Redis 버전을 팀에서 맞춘다. `./vendor/bin/sail`이 `php`/`composer`를 컨테이너 안에서 실행한다.\n\n```bash\nphp artisan sail:install\n./vendor/bin/sail up -d\n./vendor/bin/sail artisan migrate\n./vendor/bin/sail npm run dev\n```\n\n운영에 Sail 이미지를 그대로 올리지 않는 편이 일반적이다. 개발 도구·볼륨 마운트·루트에 가까운 관례가 남아 있다. 운영은 PHP-FPM + Nginx/Caddy Dockerfile을 따로 둔다.\n\n---\n\n## 4. 운영 이미지 스케치\n\n```dockerfile\nFROM serversideup/php:8.3-fpm-nginx AS base\n\nWORKDIR /var/www/html\nCOPY --chown=www-data:www-data . .\nRUN composer install --no-dev --optimize-autoloader \\\n \u0026\u0026 php artisan storage:link \\\n \u0026\u0026 npm ci \u0026\u0026 npm run build \\\n \u0026\u0026 php artisan view:cache\n```\n\n권장:\n\n- non-root 유저\n- 헬스체크 `GET /up` (Laravel 11+ `bootstrap/app.php`의 `health`)\n- 웹 / 큐 / 스케줄러를 프로세스 또는 Deployment로 분리\n- `storage`와 `bootstrap/cache`는 쓰기 가능, 코드는 읽기 전용에 가깝게\n\nKubernetes면 웹·워커·스케줄을 레플리카로 나눈다. 스케줄은 `onOneServer` 또는 단일 cron Job만 돌린다. 세 파드가 모두 `schedule:run`을 치면 일일 리포트가 세 번 나간다.\n\n---\n\n## 5. Forge, Vapor, 그 외\n\n**Laravel Forge**는 VPS에 Nginx, SSL, 배포 스크립트, 데몬(워커)을 깔아 주는 서비스다. 전통 서버 운영에 잘 맞는다.\n\n**Laravel Vapor**는 AWS Lambda 위에 Laravel을 올리는 서버리스다. 로컬 디스크가 잠깐이고, 롱런 워커 모델이 서버와 다르다. 큐·세션·파일은 AWS 서비스에 맞춰 다시 설계한다.\n\n공식 Laravel Cloud나 Railway·Render·Fly.io 같은 PaaS도 있다. 공통은 “웹만 띄우면 끝”이 아니라는 점이다.\n\n| 옵션 | 특징 |\n|------|------|\n| Forge | VPS, 데몬, SSL, 익숙한 PHP-FPM |\n| Vapor | 서버리스 스케일, 제약 이해 필요 |\n| 직접 VPS | Supervisor + Nginx를 직접 |\n| PaaS | 설정은 적고, 워커 add-on을 빼먹기 쉽다 |\n\n---\n\n## 6. Supervisor와 cron\n\n```ini\n[program:laravel-worker]\nprocess_name=%(program_name)s_%(process_num)02d\ncommand=php /home/app/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600\nautostart=true\nautorestart=true\nnumprocs=2\nuser=www-data\nredirect_stderr=true\nstdout_logfile=/home/app/storage/logs/worker.log\n```\n\n`--max-time`으로 워커를 주기적으로 죽여 메모리 누수를 끊는다. Horizon이면 `artisan horizon`을 Supervisor가 관리한다.\n\n```cron\n* * * * * www-data cd /home/app \u0026\u0026 php artisan schedule:run \u003e\u003e /dev/null 2\u003e\u00261\n```\n\ncron이 루트 홈에서 돌면 `.env`를 못 읽어 스케줄만 조용히 실패한다. `cd` 경로가 앱 루트인지 확인한다.\n\n---\n\n## 7. 파일과 로그\n\n컨테이너가 재시작되면 로컬 `storage/app`는 사라질 수 있다. 업로드는 **S3 호환 오브젝트 스토리지**, `FILESYSTEM_DISK=s3`가 기본에 가깝다. 공개 파일은 CDN, 백업은 DB 스냅샷과 버킷 버전을 같이 본다.\n\n```env\nLOG_CHANNEL=stack\nLOG_STACK=single,stderr\n```\n\n컨테이너는 stdout/stderr로 보내는 편이 수집기가 먹기 쉽다. 예외는 Sentry·Flare 같은 서비스로 보내고, Telescope는 운영 URL에 열어 두지 않는다.\n\n`/up`은 프로세스 생존만 본다. DB·Redis까지 보려면 커스텀 헬스 체크를 추가한다. 앱은 떴는데 Redis가 죽으면 큐·세션이 같이 죽는다.\n\n---\n\n## 8. 보안·운영 체크리스트\n\n- [ ] `APP_DEBUG=false`, HTTPS, HSTS\n- [ ] `APP_KEY` 유출 시 재발급하면 기존 암호화 값이 안 읽힌다는 점을 안다\n- [ ] `composer audit`, `.env`·프라이빗 버킷 권한\n- [ ] 로그인·민감 API throttle\n- [ ] CSRF / CORS / Sanctum 도메인이 스테이징과 같은 실수 없이 맞다\n- [ ] Filament·관리자 경로에 추가 보호\n- [ ] 업로드 MIME·크기 제한\n- [ ] 워커·스케줄·Horizon이 배포 후 새 코드로 재기동된다\n\n---\n\n## 9. 흔한 실수\n\n- Sail Compose를 운영에 그대로 올린다.\n- 웹만 배포하고 `queue:work` / cron을 안 켠다.\n- 이미지에 `.env`를 COPY한다.\n- `config:cache` 없이 매 요청 `env()` — 또는 반대로 로컬에서 route cache를 켠 채 개발한다.\n- `storage:link`를 빼 업로드 URL이 404가 난다.\n\n---\n\n## 연습\n\n1. Sail로 app + MySQL + Redis를 띄운다.\n2. migrate·캐시·`npm run build`를 배포 스크립트로 적는다.\n3. 워커 또는 Horizon을 켜고 Job이 소비되는지 본다.\n4. `APP_DEBUG=false`, `/up`, 로그(또는 Sentry)를 스테이징에서 확인한다.\n5. 위 체크리스트를 통과/미통과로 표시한다.\n\nLaravel은 CRUD 생성기를 넘어 검증·인가·큐·캐시·배포가 한 줄로 이어진다. 입력은 Form Request, 출력은 Resource, 권한은 Policy, 느린 일은 afterCommit Job, 워커와 스케줄은 배포의 일부다.\n"])</script><script>self.__next_f.push([1,"48:T156b,"])</script><script>self.__next_f.push([1,"# Next.js App Router로 프로젝트 시작하기\n\n\u003e 요약: App Router와 TypeScript로 Next.js 프로젝트를 만들고, 폴더·페이지·레이아웃의 역할을 구분한다.\n\n---\n\n## 1. 왜 이 주제가 필요한가\n\nNext.js는 React로 웹을 만들 때 라우팅·렌더·배포를 한 프레임워크에서 처리한다.\n\n예전에는 `pages/` 폴더가 URL이 되는 **Pages Router**를 썼다. 지금은 **App Router**가 기본이다. `app/` 폴더 구조가 URL이 되고, 레이아웃을 중첩할 수 있으며, 컴포넌트는 서버에서 먼저 돈다.\n\n신규 프로젝트는 Pages Router를 기본선으로 두지 않는다. 레거시 코드에서만 만난다.\n\n실무 기본 조합은 **Next.js 15/16 + TypeScript + App Router**다.\n\n---\n\n## 2. 한 줄 규칙\n\n폴더가 곧 URL이다. `page.tsx`가 있는 폴더만 공개 주소가 된다.\n\n호스팅을 먼저 고른다. 서버가 있는 배포(Vercel 등)와 HTML만 올리는 정적 배포는 쓸 수 있는 기능이 다르다.\n\n---\n\n## 3. 예제\n\n### 프로젝트 생성\n\n```bash\nnpx create-next-app@latest my-app\ncd my-app\nnpm run dev\n```\n\n권장 옵션: TypeScript, ESLint, App Router, Tailwind는 팀 취향.\n\n`src/` 디렉터리 여부는 팀 규칙이다. 이 글은 `src/app/` 기준으로 적는다. `app/`이 프로젝트 루트에 있어도 규칙은 같다.\n\n브라우저에서 `http://localhost:3000`이 열리면 준비된 것이다.\n\n### 디렉터리\n\n```\nsrc/app/\n├── layout.tsx       # 모든 페이지의 바깥 껍질\n├── page.tsx         # URL /\n├── about/\n│   └── page.tsx     # URL /about\n├── posts/\n│   ├── page.tsx     # URL /posts\n│   └── [slug]/\n│       └── page.tsx # URL /posts/hello 같은 동적 주소\n├── loading.tsx      # 해당 구간이 기다릴 때\n├── error.tsx        # 해당 구간에서 에러가 날 때\n├── not-found.tsx    # 404\n└── globals.css\n```\n\n| 파일 | 역할 |\n|------|------|\n| `page.tsx` | 그 URL의 화면 |\n| `layout.tsx` | 네비·푸터처럼 하위 페이지가 공유하는 셸 |\n| `loading.tsx` | 데이터 기다리는 동안의 UI |\n| `error.tsx` | 구간 에러 UI. Client Component여야 한다 |\n| `not-found.tsx` | 없는 주소 |\n\n`layout.tsx`만 있고 `page.tsx`가 없으면 그 경로는 주소가 아니다.\n\n### 루트 레이아웃과 첫 페이지\n\n```tsx\n// src/app/layout.tsx\nimport type {ReactNode} from 'react';\nimport type {Metadata} from 'next';\nimport Link from 'next/link';\nimport './globals.css';\n\nexport const metadata: Metadata = {\n  title: 'My App',\n  description: 'Next.js App Router 예제',\n};\n\nexport default function RootLayout({children}: {children: ReactNode}) {\n  return (\n    \u003chtml lang=\"ko\"\u003e\n      \u003cbody\u003e\n        \u003cheader\u003e\n          \u003cLink href=\"/\"\u003e홈\u003c/Link\u003e\n        \u003c/header\u003e\n        {children}\n      \u003c/body\u003e\n    \u003c/html\u003e\n  );\n}\n```\n\n루트 레이아웃은 `\u003chtml\u003e`과 `\u003cbody\u003e`를 가진다. 앱에 루트 레이아웃은 하나다.\n\n```tsx\n// src/app/page.tsx\nexport default function HomePage() {\n  return (\n    \u003cmain\u003e\n      \u003ch1\u003eHello, Next.js\u003c/h1\u003e\n    \u003c/main\u003e\n  );\n}\n```\n\n`app/` 아래 파일은 기본이 서버 컴포넌트다. `useState`나 `onClick`이 없으면 `'use client'`를 붙이지 않는다.\n\n### 렌더 모드를 먼저 고른다\n\n페이지가 HTML을 언제 만드는지가 배포를 가른다.\n\n| 모드 | 의미 | 언제 |\n|------|------|------|\n| 정적(SSG) | 빌드할 때 HTML을 미리 만든다 | 문서, 마케팅, 블로그 |\n| 동적(SSR) | 요청마다 서버가 HTML을 만든다 | 로그인 사용자마다 다른 화면 |\n| 혼합 | 목록은 정적, 일부만 동적 | 공개 글 + 관리자 |\n\nGitHub Pages처럼 서버 없이 HTML만 올리면 `output: 'export'`를 검토한다. 정적 내보내기는 Route Handler·미들웨어·요청마다 다시 그리는 기능이 제한된다. 호스팅과 함께 결정한다.\n\n```ts\n// next.config.ts\nimport type {NextConfig} from 'next';\n\nconst nextConfig: NextConfig = {\n  // 정적 호스팅이 필요할 때만 켠다\n  output: 'export',\n  trailingSlash: true,\n};\n\nexport default nextConfig;\n```\n\n`trailingSlash: true`면 주소 끝이 `/`다. 링크와 CDN 설정을 같은 규칙으로 맞춘다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| 페이지를 `pages/`에 만든다 | App Router가 그 주소를 모른다 | `app/` 아래 `page.tsx` |\n| `page.tsx` 없이 폴더만 만든다 | URL이 생기지 않는다 | 공개할 경로에 `page.tsx` |\n| 첫 파일부터 `'use client'` | 서버에서 데이터를 못 읽는다 | 상호작용 있는 잎만 Client |\n| 정적 호스팅인데 API Route를 넣는다 | 빌드가 깨지거나 런타임이 없다 | 호스팅을 먼저 고른다 |\n| 루트 레이아웃에서 `\u003chtml\u003e`을 뺀다 | 문서 뼈대가 깨진다 | 루트에만 `\u003chtml\u003e` / `\u003cbody\u003e` |\n\n---\n\n## 정리\n\nApp Router 시작은 폴더 이름 = URL, `page` = 화면, `layout` = 공통 셸이다.\n\n정적 HTML만 올릴지, 서버가 있는 플랫폼에 올릴지를 프로젝트 첫날에 적는다. 그 선택이 데이터 페칭·인증·API 설계를 가른다.\n\n---\n\n## 연습\n\n1. `create-next-app`으로 TypeScript + App Router 프로젝트를 만든다.\n2. `/about`용 `app/about/page.tsx`와 공통 헤더가 있는 루트 `layout.tsx`를 추가한다.\n3. 팀 호스팅이 정적 내보내기인지 서버인지 한 줄로 적고, `output: 'export'`가 필요한지 결정한다.\n"])</script><script>self.__next_f.push([1,"49:T16b1,"])</script><script>self.__next_f.push([1,"# 라우팅·레이아웃·동적 세그먼트\n\n\u003e 요약: 폴더가 URL이 되는 규칙을 익히고, 동적 주소와 중첩 레이아웃으로 화면 구조를 잡는다.\n\n---\n\n## 1. 왜 이 주제가 필요한가\n\n웹 앱은 URL이 곧 정보 구조다. `/posts/hello`가 글이고 `/about`이 소개라면, 폴더를 그렇게 나누면 된다.\n\nApp Router는 설정 파일에 라우트를 나열하지 않는다. `app/` 아래 폴더 이름이 경로가 된다. 레이아웃은 부모 폴더에서 자식으로 중첩된다.\n\n주소와 UI 껍질을 같이 설계하면 페이지마다 헤더를 복사하지 않아도 된다.\n\n---\n\n## 2. 한 줄 규칙\n\n`page.tsx`가 있는 폴더만 공개 URL이다. 대괄호 폴더(`[slug]`)는 값이 바뀌는 구간이다.\n\n레이아웃은 하위 이동 시 리마운트되지 않는다. 공통 셸은 `layout.tsx`에 둔다.\n\n---\n\n## 3. 예제\n\n### 파일과 URL\n\n| 파일 | URL |\n|------|-----|\n| `app/page.tsx` | `/` |\n| `app/posts/page.tsx` | `/posts` |\n| `app/posts/[slug]/page.tsx` | `/posts/hello` |\n| `app/docs/[...slug]/page.tsx` | `/docs/a`, `/docs/a/b` |\n| `app/shop/[[...slug]]/page.tsx` | `/shop`와 `/shop/a` 모두 |\n\n`[slug]`는 한 칸. `[...slug]`는 나머지 칸 전부(캐치올). `[[...slug]]`는 그 칸이 없어도 된다(선택 캐치올).\n\n### 동적 세그먼트\n\nNext.js 15부터 `params`는 Promise다. 서버 페이지에서 `await`로 읽는다.\n\n```tsx\n// app/posts/[slug]/page.tsx\nimport {notFound} from 'next/navigation';\n\ntype Props = {\n  params: Promise\u003c{slug: string}\u003e;\n};\n\nconst POSTS: Record\u003cstring, string\u003e = {\n  hello: '첫 글',\n  world: '둘째 글',\n};\n\nexport default async function PostPage({params}: Props) {\n  const {slug} = await params;\n  const title = POSTS[slug];\n  if (!title) notFound();\n  return (\n    \u003carticle\u003e\n      \u003ch1\u003e{title}\u003c/h1\u003e\n      \u003cp\u003eslug: {slug}\u003c/p\u003e\n    \u003c/article\u003e\n  );\n}\n```\n\n빌드 때 HTML을 미리 만들려면 `generateStaticParams`를 같이 쓴다. 정적 사이트 생성(SSG, 빌드 시 HTML을 고정하는 방식)과 충돌하지 않는다. `await params`는 Next API일 뿐, 페이지를 클라이언트 렌더로 바꾸지 않는다.\n\n```tsx\nexport function generateStaticParams() {\n  return [{slug: 'hello'}, {slug: 'world'}];\n}\n```\n\n### 중첩 레이아웃\n\n```tsx\n// app/posts/layout.tsx\nimport type {ReactNode} from 'react';\nimport Link from 'next/link';\n\nexport default function PostsLayout({children}: {children: ReactNode}) {\n  return (\n    \u003cdiv\u003e\n      \u003caside\u003e\n        \u003cnav\u003e\n          \u003cLink href=\"/posts/hello/\"\u003ehello\u003c/Link\u003e\n          \u003cLink href=\"/posts/world/\"\u003eworld\u003c/Link\u003e\n        \u003c/nav\u003e\n      \u003c/aside\u003e\n      \u003csection\u003e{children}\u003c/section\u003e\n    \u003c/div\u003e\n  );\n}\n```\n\n`/posts/hello`에서 `/posts/world`로 이동해도 이 레이아웃은 다시 마운트되지 않는다. 사이드바 스크롤·필터 상태를 유지하기 쉽다.\n\n루트 `layout.tsx`는 `\u003chtml\u003e`/`\u003cbody\u003e`를 가진다. 하위 레이아웃은 그 안의 껍질만 추가한다.\n\n### 라우트 그룹\n\n폴더 이름을 `(marketing)`처럼 괄호로 감싸면 URL에 안 들어간다. 레이아웃만 나누고 싶을 때 쓴다.\n\n```\napp/(site)/page.tsx              → /\napp/(site)/about/page.tsx        → /about\napp/(manager)/manager/page.tsx   → /manager\n```\n\n`(site)`와 `(manager)`에 서로 다른 `layout.tsx`를 둘 수 있다. 주소는 폴더 이름에서 괄호 그룹을 뺀 나머지다.\n\n### Link와 이동\n\n```tsx\nimport Link from 'next/link';\n\nexport function PostLink() {\n  return \u003cLink href=\"/posts/hello/\"\u003e글 보기\u003c/Link\u003e;\n}\n```\n\n내부 이동은 `\u003ca\u003e` 대신 `next/link`의 `Link`를 쓴다. 미리 코드를 받아 전환이 빠르다.\n\n`trailingSlash: true`면 `href`도 `/posts/hello/`처럼 맞춘다. 슬래시가 어긋나면 같은 페이지가 두 URL로 열린다.\n\n버튼을 눌러 이동할 때는 Client Component에서 라우터를 쓴다.\n\n```tsx\n'use client';\n\nimport {useRouter} from 'next/navigation';\n\nexport function GoPostsButton() {\n  const router = useRouter();\n  return (\n    \u003cbutton type=\"button\" onClick={() =\u003e router.push('/posts/')}\u003e\n      목록\n    \u003c/button\u003e\n  );\n}\n```\n\n`next/navigation`이다. Pages Router의 `next/router`가 아니다.\n\n### 병렬·인터셉트\n\n`@folder` 슬롯은 한 레이아웃에 여러 `page`를 나란히 넣을 때 쓴다. 대시보드 다중 패널이 전형적인 경우다.\n\n`(.)photo` 같은 인터셉트 라우트는 목록 위에 모달을 얹고, 새로고침하면 전용 페이지로 열 때 쓴다.\n\n입문 앱은 동적 세그먼트와 중첩 레이아웃만으로 충분한 경우가 많다. 필요할 때 문서에서 추가한다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| `params.slug`를 동기로 읽는다 | Next 15에서 타입·런타임 경고 | `const {slug} = await params` |\n| 레이아웃에서 `{children}`을 뺀다 | 하위 페이지가 안 보인다 | 레이아웃은 껍질만, 본문은 children |\n| 라우트 그룹을 URL에 기대한다 | `(site)`가 주소에 없다 | 괄호는 URL에서 빠진다 |\n| `\u003ca href=\"/posts\"\u003e`만 쓴다 | 풀 새로고침 | 내부는 `Link` |\n| trailing slash 혼용 | 중복 URL, 깨진 링크 | 설정과 `href`를 일치 |\n\n---\n\n## 정리\n\n라우팅은 폴더 이름이고, 공개 여부는 `page.tsx`다. 바뀌는 칸은 `[slug]`, 공통 셸은 `layout.tsx`다.\n\nURL을 먼저 그리고 폴더를 만든다. 레이아웃은 “이 구간에서 무엇이 유지돼야 하는가”로 나눈다.\n\n---\n\n## 연습\n\n1. `/posts/[slug]` 페이지와 `generateStaticParams` 두 개(`hello`, `world`)를 만든다.\n2. `(marketing)` / `(app)` 그룹으로 공개 사이트와 로그인 후 화면의 레이아웃을 나눈다.\n3. 내부 링크를 모두 `Link`로 바꾸고, `trailingSlash` 정책과 `href`를 맞춘다.\n"])</script><script>self.__next_f.push([1,"4a:T16ab,"])</script><script>self.__next_f.push([1,"# Server Component와 Client Component\n\n\u003e 요약: 기본은 서버 컴포넌트로 두고, 클릭·입력처럼 브라우저가 필요한 부분만 Client로 나눈다.\n\n---\n\n## 1. 왜 이 주제가 필요한가\n\nApp Router의 컴포넌트는 기본이 **RSC(React Server Component, 서버에서만 실행되는 컴포넌트)** 다.\n\n서버에서 돌면 DB·파일·비밀키에 바로 접근할 수 있다. 그 코드는 브라우저 번들에 안 실려서 JS가 줄어든다.\n\n모든 파일을 `'use client'`로 열면 이 이점이 사라진다. 반대로 서버 파일에 `onClick`을 붙이면 빌드가 실패한다. 경계를 아는 것이 App Router의 핵심이다.\n\n---\n\n## 2. 한 줄 규칙\n\n데이터와 마크업은 서버에 둔다. `useState`·이벤트·브라우저 API가 필요한 잎만 Client로 만든다.\n\n페이지 전체가 Client일 필요는 없다. Client가 Server를 import하면 그 트리도 클라이언트가 된다. 반대로 Server는 Client를 자식으로 둘 수 있다.\n\n---\n\n## 3. 예제\n\n### 서버가 할 수 있는 것 / 없는 것\n\n| | Server Component | Client Component |\n|--|------------------|------------------|\n| 기본 | `app/` 파일, 지시어 없음 | 파일 상단 `'use client'` |\n| 데이터 | `async/await`, DB, `fs` | `fetch`·훅. 시크릿·`fs` 금지 |\n| 상태 | 불가 | `useState` / `useEffect` |\n| 이벤트 | 불가 | `onClick` 등 |\n| 번들 | 클라이언트 JS에 안 실림 | 실림 |\n\n### Client는 잎에 가깝게\n\n```tsx\n// app/posts/_components/counter.tsx\n'use client';\n\nimport {useState} from 'react';\n\nexport function Counter() {\n  const [n, setN] = useState(0);\n  return (\n    \u003cbutton type=\"button\" onClick={() =\u003e setN((v) =\u003e v + 1)}\u003e\n      {n}\n    \u003c/button\u003e\n  );\n}\n```\n\n`'use client'`는 그 파일과, 그 파일이 import하는 모듈을 클라이언트 경계로 만든다. 지시어는 파일 최상단, import보다 위다.\n\n### 서버 페이지가 Client를 조합한다\n\n```tsx\n// lib/posts.ts — 서버 전용\nexport type Post = {slug: string; title: string};\n\nexport async function getPosts(): Promise\u003cPost[]\u003e {\n  return [\n    {slug: 'hello', title: '첫 글'},\n    {slug: 'world', title: '둘째 글'},\n  ];\n}\n```\n\n```tsx\n// app/posts/_components/post-filters.tsx\n'use client';\n\nimport {useState} from 'react';\n\ntype Props = {\n  titles: string[];\n};\n\nexport function PostFilters({titles}: Props) {\n  const [q, setQ] = useState('');\n  const filtered = titles.filter((t) =\u003e t.includes(q));\n\n  return (\n    \u003cdiv\u003e\n      \u003cinput\n        value={q}\n        onChange={(e) =\u003e setQ(e.target.value)}\n        placeholder=\"제목 검색\"\n      /\u003e\n      \u003cul\u003e\n        {filtered.map((t) =\u003e (\n          \u003cli key={t}\u003e{t}\u003c/li\u003e\n        ))}\n      \u003c/ul\u003e\n    \u003c/div\u003e\n  );\n}\n```\n\n```tsx\n// app/posts/page.tsx — Server Component\nimport {getPosts} from '@/lib/posts';\nimport {PostFilters} from './_components/post-filters';\nimport {Counter} from './_components/counter';\n\nexport default async function PostsPage() {\n  const posts = await getPosts();\n  const titles = posts.map((p) =\u003e p.title);\n\n  return (\n    \u003cmain\u003e\n      \u003ch1\u003e글 목록\u003c/h1\u003e\n      \u003cPostFilters titles={titles} /\u003e\n      \u003cCounter /\u003e\n    \u003c/main\u003e\n  );\n}\n```\n\n서버가 데이터를 가져와 **직렬화 가능한 props**(문자열, 숫자, 평범한 객체·배열)만 Client에 넘긴다.\n\n넘기면 안 되는 것: 함수, Class 인스턴스, `Date`를 제외한 특수 객체. 함수를 props로 넘기면 직렬화 에러가 난다.\n\n### 공유 모듈이 경계를 오염시킨다\n\nClient 파일이 `lib/format.ts`를 import하면, 그 모듈은 클라이언트 번들에 들어간다. 그 `lib/format.ts`가 `fs`를 import하면 브라우저 빌드가 실패한다.\n\n서버 전용 코드는 `server-only` 패키지로 표시할 수 있다.\n\n```ts\nimport 'server-only';\n\nexport function loadSecret() {\n  return process.env.API_SECRET;\n}\n```\n\nClient가 이 파일을 import하면 빌드 단계에서 막힌다.\n\n### 큰 라이브러리\n\n차트·에디터처럼 무거운 패키지는 그 UI를 쓰는 Client 파일에서만 import한다. 루트 레이아웃에 두면 모든 페이지 번들이 커진다.\n\n브라우저 전용 라이브러리는 동적 import로 나눈다.\n\n```tsx\n'use client';\n\nimport dynamic from 'next/dynamic';\n\nconst Chart = dynamic(() =\u003e import('./chart'), {\n  ssr: false,\n  loading: () =\u003e \u003cp\u003e차트 로딩\u003c/p\u003e,\n});\n```\n\n`ssr: false`는 정말 브라우저에서만 돌아야 할 때만 쓴다. 남용하면 첫 HTML이 비어 검색·미리보기에 불리하다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| `page.tsx` 전체에 `'use client'` | 서버 페칭·시크릿 불가 | 버튼·폼만 분리 |\n| Server에서 `window` / `document` | 빌드·렌더 에러 | Client로 이동 |\n| Client에서 `fs` / DB 클라이언트 | 번들 실패 또는 시크릿 유출 | 서버에서 읽고 props |\n| 이벤트 핸들러를 Server에서 작성 | 컴파일 에러 | Client 자식에 위임 |\n| Client가 Server 컴포넌트를 import | 그 파일도 클라이언트화 | Server가 Client를 자식으로 둔다 |\n| 훅이 있는 유틸을 서버가 import | 경계가 무너진다 | 훅 파일에 `'use client'` |\n\n---\n\n## 정리\n\n기본은 Server다. Client는 상호작용이 있는 잎이다.\n\n서버가 데이터를 가져오고, 직렬화 가능한 값만 Client에 넘긴다. 페이지를 Client로 여는 것은 최후의 수단이다.\n\n---\n\n## 연습\n\n1. 서버 페이지에서 글 목록을 읽고, Client 검색 입력으로 제목을 거른다.\n2. `'use client'`가 붙은 파일을 찾아, 상태·이벤트가 없는 파일은 지시어를 제거한다.\n3. `npm run build` 출력에서 큰 Client 번들이 들어간 라우트를 확인하고, 무거운 import를 해당 페이지로 옮긴다.\n"])</script><script>self.__next_f.push([1,"4b:T17f9,"])</script><script>self.__next_f.push([1,"# 데이터 페칭과 캐시 전략\n\n\u003e 요약: 서버 컴포넌트에서 데이터를 읽고, 캐시할지 매 요청 최신으로 둘지 옵션으로 명시한다.\n\n---\n\n## 1. 왜 이 주제가 필요한가\n\n화면이 비어 있고 브라우저가 API를 다시 치면, 검색엔진과 SNS 미리보기는 본문을 못 본다. 느리다.\n\nApp Router에서는 **Server Component**가 데이터를 먼저 읽는다. HTML에 본문이 담긴 채로 나간다.\n\n문제는 “얼마나 자주 다시 읽느냐”다. 매번 최신이면 서버·원본 API 부하가 커진다. 너무 오래 캐시하면 수정한 글이 안 보인다.\n\n---\n\n## 2. 한 줄 규칙\n\n서버에서 읽고, `fetch` 옵션을 명시한다.\n\nNext.js 15부터 `fetch` 기본값은 캐시하지 않음(`no-store`)이다. 정적 페이지를 만들 때는 `cache: 'force-cache'` 또는 `next: {revalidate: N}`을 적는다. 팀 표준을 코드에 남긴다.\n\n---\n\n## 3. 예제\n\n### 서버에서 fetch\n\n```tsx\n// lib/post.ts\nexport type Post = {\n  title: string;\n  body: string;\n};\n\nexport async function getPost(slug: string): Promise\u003cPost\u003e {\n  const res = await fetch(`https://api.example.com/posts/${slug}`, {\n    next: {revalidate: 60, tags: ['post', `post:${slug}`]},\n  });\n  if (!res.ok) {\n    throw new Error(`글 로드 실패: ${slug}`);\n  }\n  return res.json() as Promise\u003cPost\u003e;\n}\n```\n\n```tsx\n// app/posts/[slug]/page.tsx\nimport {getPost} from '@/lib/post';\n\ntype Props = {\n  params: Promise\u003c{slug: string}\u003e;\n};\n\nexport default async function PostPage({params}: Props) {\n  const {slug} = await params;\n  const post = await getPost(slug);\n  return (\n    \u003carticle\u003e\n      \u003ch1\u003e{post.title}\u003c/h1\u003e\n      \u003cp\u003e{post.body}\u003c/p\u003e\n    \u003c/article\u003e\n  );\n}\n```\n\n`revalidate: 60`은 **ISR(Incremental Static Regeneration, 만들어 둔 HTML을 N초 뒤에 다시 생성하는 방식)** 에 가깝다. 60초 안은 캐시, 이후 요청을 계기로 백그라운드에서 갱신한다.\n\n### 옵션 치트시트\n\n| 옵션 | 의미 |\n|------|------|\n| `cache: 'force-cache'` | 가능하면 캐시. 빌드 때 읽기에 가깝다 |\n| `cache: 'no-store'` | 요청마다 원본을 친다 |\n| `next: {revalidate: N}` | N초 후 재검증 |\n| `next: {tags: ['post']}` | 태그로 묶었다가 한 번에 무효화 |\n\n페이지 단위로 재검증 주기를 정할 수도 있다.\n\n```tsx\nexport const revalidate = 60;\nexport const dynamic = 'force-static';\n```\n\n`cookies()`나 `headers()`를 읽으면 그 라우트는 동적이 된다. 요청마다 달라져야 하는 값이 있을 때만 쓴다.\n\n### 태그 무효화\n\n글 저장 후 목록·상세 캐시를 깨고 싶을 때 태그를 쓴다.\n\n```ts\n// app/posts/actions.ts\n'use server';\n\nimport {revalidateTag} from 'next/cache';\n\nexport async function afterSavePost() {\n  // Next.js 15: revalidateTag('post')\n  // Next.js 16: 두 번째 인자(캐시 프로파일)가 필요하다\n  revalidateTag('post', 'max');\n}\n```\n\n정적 내보내기(`output: 'export'`)에서는 런타임 재검증이 없다. 빌드할 때 읽을 수 있는 데이터만 맞다. 로컬 마크다운, 공개 API가 그 예다.\n\n### 로컬 파일\n\n블로그·문서 사이트는 파일을 서버에서 읽는다.\n\n```ts\n// lib/markdown.ts\nimport fs from 'node:fs';\nimport path from 'node:path';\n\nexport function loadMarkdown(slug: string): string {\n  const file = path.join(process.cwd(), 'content', 'posts', `${slug}.md`);\n  return fs.readFileSync(file, 'utf8');\n}\n\nexport function listSlugs(): string[] {\n  const dir = path.join(process.cwd(), 'content', 'posts');\n  return fs\n    .readdirSync(dir)\n    .filter((name) =\u003e name.endsWith('.md'))\n    .map((name) =\u003e name.replace(/\\.md$/, ''));\n}\n```\n\n이 코드는 Server Component나 `lib`에서만 호출한다. Client에 import하지 않는다.\n\n### 클라이언트 페칭은 언제\n\n서버가 담당하기 어려운 경우만 Client에서 가져온다.\n\n- 로그인한 사용자만의 실시간 숫자\n- 무한 스크롤, 입력할 때마다 바뀌는 검색\n- `localStorage` 등 브라우저 값에 의존하는 요청\n\n초기 본문·목록·SEO에 필요한 HTML은 서버가 채운다. 그 위에 검색창만 Client로 얹는다.\n\n### 로딩·에러 구간\n\n```tsx\n// app/posts/[slug]/loading.tsx\nexport default function Loading() {\n  return \u003cp\u003e글을 불러오는 중\u003c/p\u003e;\n}\n```\n\n```tsx\n// app/posts/[slug]/error.tsx\n'use client';\n\nexport default function Error({\n  error,\n  reset,\n}: {\n  error: Error;\n  reset: () =\u003e void;\n}) {\n  return (\n    \u003cdiv\u003e\n      \u003cp\u003e글을 읽지 못했다.\u003c/p\u003e\n      \u003cbutton type=\"button\" onClick={() =\u003e reset()}\u003e\n        다시 시도\n      \u003c/button\u003e\n    \u003c/div\u003e\n  );\n}\n```\n\n`error.tsx`는 Client Component다. `reset`으로 해당 구간만 다시 렌더한다. `notFound()`는 `not-found.tsx`로 간다. 데이터 없음과 서버 실패를 구분한다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| `fetch` 옵션을 안 적는다 | Next 15에선 매번 원본. 의도와 다를 수 있다 | `cache` / `revalidate` / `tags`를 명시 |\n| 정적 내보내기인데 `no-store` | 빌드가 동적 라우트로 실패하거나 HTML이 비어 있다 | 빌드 시점에 읽히는 소스만 |\n| Client에서 시크릿 헤더 fetch | 키가 브라우저에 노출 | 서버에서 프록시·직접 호출 |\n| `loading.tsx` 없이 느린 await | 빈 화면이 길다 | 구간 `loading` / `Suspense` |\n| 파일 읽기를 Client에 둠 | `fs` 번들 에러 | 서버 `lib` + props |\n\n---\n\n## 정리\n\n데이터는 서버에서 읽는다. 캐시 여부는 추측하지 않고 옵션으로 적는다.\n\n공개 문서는 빌드 때 읽고, 개인화·검색 타이핑만 클라이언트로 남긴다. 정적 호스팅이면 “빌드 타임에 존재하는 데이터”가 유일한 소스다.\n\n---\n\n## 연습\n\n1. 같은 URL에 `revalidate: 60` fetch와 `cache: 'no-store'` fetch를 번갈아 넣고, 빌드 로그의 정적/동적 표시를 비교한다.\n2. `content/` 마크다운을 읽어 목록 페이지를 만든다.\n3. 현재 배포가 `export`면 런타임 재검증을 빼고, 데이터 소스를 “빌드 때 읽기”로만 정리한다.\n"])</script><script>self.__next_f.push([1,"4c:T14a7,"])</script><script>self.__next_f.push([1,"# SSG·generateStaticParams·정적 export\n\n\u003e 요약: 빌드할 때 HTML을 미리 만들고, 동적 주소는 generateStaticParams로 목록을 넘기며, 정적 내보내기 제약을 확인한다.\n\n---\n\n## 1. 왜 이 주제가 필요한가\n\n검색엔진과 카카오·슬랙 미리보기는 **첫 응답 HTML**을 본다. 빌드 시점에 제목과 본문이 들어 있으면 공유·SEO가 안정적이다. CDN(가까운 서버에서 파일을 나눠 주는 망)에도 올리기 쉽다.\n\n**SSG(Static Site Generation, 빌드할 때 HTML을 고정하는 방식)** 가 그 수단이다. `/posts/hello`처럼 칸이 바뀌는 주소도, 미리 어떤 slug가 있는지 알려 주면 같은 방식으로 만들 수 있다.\n\n---\n\n## 2. 한 줄 규칙\n\n공개되는 모든 slug를 `generateStaticParams`에 넣는다. 페이지에서 `await params`를 써도 정적 HTML이다.\n\n정적 내보내기(`output: 'export'`)는 서버가 없다. 빌드 때 읽을 수 있는 데이터만 쓴다.\n\n---\n\n## 3. 예제\n\n### generateStaticParams\n\n```tsx\n// lib/posts.ts\nexport type Post = {\n  slug: string;\n  title: string;\n  body: string;\n};\n\nconst POSTS: Post[] = [\n  {slug: 'hello', title: '첫 글', body: '본문 A'},\n  {slug: 'world', title: '둘째 글', body: '본문 B'},\n];\n\nexport function getAllPosts(): Post[] {\n  return POSTS;\n}\n\nexport function getPost(slug: string): Post | undefined {\n  return POSTS.find((p) =\u003e p.slug === slug);\n}\n```\n\n```tsx\n// app/posts/[slug]/page.tsx\nimport {notFound} from 'next/navigation';\nimport {getAllPosts, getPost} from '@/lib/posts';\n\ntype Props = {\n  params: Promise\u003c{slug: string}\u003e;\n};\n\nexport function generateStaticParams() {\n  return getAllPosts().map((post) =\u003e ({slug: post.slug}));\n}\n\nexport default async function PostPage({params}: Props) {\n  const {slug} = await params;\n  const post = getPost(slug);\n  if (!post) notFound();\n\n  return (\n    \u003carticle\u003e\n      \u003ch1\u003e{post.title}\u003c/h1\u003e\n      \u003cp\u003e{post.body}\u003c/p\u003e\n    \u003c/article\u003e\n  );\n}\n```\n\n`npm run build` 로그에서 `/posts/hello`가 ●(정적)으로 찍히는지 확인한다. `ƒ`는 서버가 필요한 동적 라우트다.\n\n`await params`는 Next.js 15 API다. 페이지를 CSR(브라우저에서 JS로 그리는 방식)로 바꾸지 않는다. `generateStaticParams`가 있으면 해당 slug는 미리 렌더된 HTML이 나온다.\n\n### 빌드에 없는 slug\n\n```tsx\nexport const dynamicParams = false;\n```\n\n`dynamicParams`가 `false`면 `generateStaticParams`에 없는 주소는 404다. 문서·블로그는 보통 알려진 slug만 빌드한다.\n\n기본값 `true`면 빌드에 없던 slug를 서버가 그때 만들 수 있다. 정적 내보내기에서는 서버가 없으므로 이 경로에 기대지 않는다.\n\n### 정적 내보내기\n\n```ts\n// next.config.ts\nimport type {NextConfig} from 'next';\n\nconst nextConfig: NextConfig = {\n  output: 'export',\n  trailingSlash: true,\n  images: {\n    unoptimized: true,\n  },\n};\n\nexport default nextConfig;\n```\n\n결과는 `out/` 아래 HTML·JS·CSS다. GitHub Pages, S3, 일반 웹 서버에 올린다.\n\n되는 것:\n\n- 빌드 시 마크다운·공개 API를 읽어 HTML 생성\n- `generateStaticParams`로 만든 상세 페이지\n- 클라이언트에서 외부 API를 치는 화면(SEO 본문이 필요 없을 때)\n\n안 되는 것(대표):\n\n- 요청마다 도는 Route Handler\n- 미들웨어로 세션을 검사하는 보호\n- ISR·`revalidateTag` 같은 런타임 재검증\n- 서버만 가능한 이미지 최적화(그래서 `unoptimized`)\n\n호스팅에 서버가 있으면 `output: 'export'`를 켜지 않는 편이 기능이 넓다. 정적만 필요하면 켜서 단순화한다.\n\n### notFound\n\n```tsx\nimport {notFound} from 'next/navigation';\n\nconst post = getPost(slug);\nif (!post) notFound();\n```\n\n`notFound()`는 `not-found.tsx`를 렌더한다. `throw new Error`와 다르다. 없는 글은 404, 파일 읽기 실패는 `error.tsx`로 나눈다.\n\n목록·sitemap·`generateStaticParams`에 같은 slug 집합을 쓴다. 한쪽만 빠지면 죽은 링크가 생긴다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| `generateStaticParams`를 안 넣는다 | 동적 라우트가 되거나 export 빌드 실패 | 공개 slug를 모두 반환 |\n| `await params`면 CSR이라고 생각한다 | 불필요하게 `'use client'` | 서버 페이지 + 정적 params |\n| export인데 `revalidate` / Route Handler | 빌드 에러 또는 죽은 엔드포인트 | 빌드 타임 데이터만 |\n| slug는 빌드했는데 sitemap은 빠짐 | 검색이 일부 URL만 봄 | 같은 목록 함수를 공유 |\n| `dynamicParams: true`에 export로 의존 | 새 글 URL이 404 | 글 추가 후 다시 빌드 |\n\n---\n\n## 정리\n\nSSG는 “주소 목록을 빌드에 알려 주고 HTML을 미리 굽는 것”이다. 동적 칸은 `generateStaticParams`가 그 목록이다.\n\n정적 내보내기는 서버 기능을 포기하는 선택이다. 공개 문서에 맞고, 로그인·웹훅에는 보통 맞지 않는다.\n\n---\n\n## 연습\n\n1. `[slug]` 세 개를 SSG로 빌드한 뒤 `out/posts/hello/index.html`에 제목이 있는지 연다.\n2. 페이지를 `await params`로 바꿔도 빌드 로그가 정적(●)인지 확인한다.\n3. `output: 'export'`를 켠 뒤 깨지는 API·미들웨어·이미지를 목록으로 적는다.\n"])</script><script>self.__next_f.push([1,"4d:T173c,"])</script><script>self.__next_f.push([1,"# Metadata·Open Graph·SEO 기본기\n\n\u003e 요약: metadata API로 페이지마다 제목·설명·정규 URL·공유 미리보기를 맞춘다.\n\n---\n\n## 1. 왜 이 주제가 필요한가\n\n검색 결과 제목과 SNS 카드는 HTML `\u003chead\u003e`에서 온다. React로 화면을 그려도, 크롤러가 그 값을 못 읽으면 링크는 빈 카드가 된다.\n\nApp Router는 `next/head` 대신 **metadata API**를 쓴다. 서버가 페이지를 렌더할 때 제목·설명·OG를 같이 넣는다.\n\n**SEO(검색 결과에 잘 잡히게 하는 작업)** 의 최소선은 고유한 title, 정확한 canonical, 본문이 있는 HTML이다.\n\n---\n\n## 2. 한 줄 규칙\n\n루트에 기본 title 템플릿을 두고, 글 상세는 `generateMetadata`로 그 글의 값을 넣는다.\n\n화면에 보이는 URL과 canonical·sitemap·OG `url`이 같아야 한다. 쿼리스트링 상세(`/view?slug=`)는 이 세 곳이 어긋나기 쉽다.\n\n---\n\n## 3. 예제\n\n### 정적 metadata\n\n```tsx\n// app/layout.tsx\nimport type {Metadata} from 'next';\nimport type {ReactNode} from 'react';\n\nexport const metadata: Metadata = {\n  metadataBase: new URL('https://blog.example.com'),\n  title: {\n    default: 'Kaisa Blog',\n    template: '%s · Kaisa Blog',\n  },\n  description: '웹 기술 노트',\n};\n\nexport default function RootLayout({children}: {children: ReactNode}) {\n  return (\n    \u003chtml lang=\"ko\"\u003e\n      \u003cbody\u003e{children}\u003c/body\u003e\n    \u003c/html\u003e\n  );\n}\n```\n\n하위 페이지가 `title: '글 목록'`이면 탭 제목은 `글 목록 · Kaisa Blog`가 된다.\n\n`metadataBase`는 OG 이미지처럼 상대 경로를 절대 URL로 만들 때 기준이 된다. `NEXT_PUBLIC_SITE_URL`과 같은 값을 쓰는 편이 안전하다.\n\n```tsx\n// app/posts/page.tsx\nimport type {Metadata} from 'next';\n\nexport const metadata: Metadata = {\n  title: '글 목록',\n  description: '발행한 글 목록',\n};\n\nexport default function PostsPage() {\n  return \u003ch1\u003e글 목록\u003c/h1\u003e;\n}\n```\n\n### 동적 generateMetadata\n\n```tsx\n// app/posts/[slug]/page.tsx\nimport type {Metadata} from 'next';\nimport {notFound} from 'next/navigation';\nimport {getPost} from '@/lib/posts';\n\ntype Props = {\n  params: Promise\u003c{slug: string}\u003e;\n};\n\nexport async function generateMetadata({params}: Props): Promise\u003cMetadata\u003e {\n  const {slug} = await params;\n  const post = getPost(slug);\n  if (!post) return {};\n\n  const url = `https://blog.example.com/posts/${slug}/`;\n\n  return {\n    title: post.title,\n    description: post.excerpt,\n    alternates: {canonical: url},\n    openGraph: {\n      title: post.title,\n      description: post.excerpt,\n      type: 'article',\n      url,\n      images: post.ogImage ? [{url: post.ogImage}] : undefined,\n    },\n  };\n}\n\nexport default async function PostPage({params}: Props) {\n  const {slug} = await params;\n  const post = getPost(slug);\n  if (!post) notFound();\n  return (\n    \u003carticle\u003e\n      \u003ch1\u003e{post.title}\u003c/h1\u003e\n    \u003c/article\u003e\n  );\n}\n```\n\n**OG(Open Graph, 링크를 붙일 때 보이는 제목·이미지 규격)** 는 `openGraph` 필드다. 카카오·슬랙·페이스북이 이 값을 읽는다.\n\n`trailingSlash: true`면 canonical에도 끝 `/`를 붙인다.\n\n### sitemap과 robots\n\n```ts\n// app/sitemap.ts\nimport type {MetadataRoute} from 'next';\nimport {getAllSlugs} from '@/lib/posts';\n\nconst SITE = 'https://blog.example.com';\n\nexport default function sitemap(): MetadataRoute.Sitemap {\n  const posts = getAllSlugs().map((slug) =\u003e ({\n    url: `${SITE}/posts/${slug}/`,\n    lastModified: new Date(),\n    changeFrequency: 'weekly' as const,\n    priority: 0.8,\n  }));\n\n  return [\n    {url: `${SITE}/`, lastModified: new Date(), priority: 1},\n    {url: `${SITE}/posts/`, lastModified: new Date(), priority: 0.9},\n    ...posts,\n  ];\n}\n```\n\n```ts\n// app/robots.ts\nimport type {MetadataRoute} from 'next';\n\nexport default function robots(): MetadataRoute.Robots {\n  return {\n    rules: {userAgent: '*', allow: '/', disallow: ['/manager/', '/login/']},\n    sitemap: 'https://blog.example.com/sitemap.xml',\n  };\n}\n```\n\n로그인·관리자·내부 검색 결과는 색인에서 뺀다.\n\n```ts\nexport const metadata: Metadata = {\n  robots: {index: false, follow: false},\n};\n```\n\n### JSON-LD\n\n검색 결과가 글 카드로 나오길 바치면 구조화 데이터를 본문에 넣는다.\n\n```tsx\nconst jsonLd = {\n  '@context': 'https://schema.org',\n  '@type': 'Article',\n  headline: post.title,\n  datePublished: post.publishedAt,\n  url: `https://blog.example.com/posts/${post.slug}/`,\n};\n\nreturn (\n  \u003carticle\u003e\n    \u003cscript\n      type=\"application/ld+json\"\n      dangerouslySetInnerHTML={{__html: JSON.stringify(jsonLd)}}\n    /\u003e\n    \u003ch1\u003e{post.title}\u003c/h1\u003e\n  \u003c/article\u003e\n);\n```\n\n값은 화면에 보이는 제목·날짜와 같아야 한다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| 모든 페이지가 같은 title | 검색에서 구분 안 됨 | 템플릿 + 페이지별 title |\n| canonical이 www / 슬래시와 불일치 | 중복 문서로 잡힘 | `metadataBase`와 실제 URL 통일 |\n| 본문은 CSR, 메타만 정적 | 미리보기는 되는데 본문이 비어 있다 | 서버에서 본문 HTML |\n| `/view?slug=` 상세 | sitemap·OG와 주소가 다름 | `/posts/[slug]` 경로 |\n| 로그인 페이지를 sitemap에 넣음 | 불필요한 색인 | `noindex` + disallow |\n| OG 이미지 상대 경로만 | 카드 이미지 깨짐 | `metadataBase` 또는 절대 URL |\n\n---\n\n## 정리\n\nSEO 기본은 페이지마다 다른 title·description, 하나의 canonical, 본문이 있는 HTML이다.\n\n목록·상세·sitemap·OG가 같은 URL 규칙을 쓰면 된다. 인증이 필요한 화면은 색인하지 않는다.\n\n---\n\n## 연습\n\n1. 글 상세에 `generateMetadata`와 canonical을 붙인다. `trailingSlash`와 일치하는지 확인한다.\n2. sitemap에는 공개 글만 넣고, `/login`·`/manager`는 `robots`와 `noindex`로 막는다.\n3. 카카오톡이나 슬랙에 글 URL을 붙여 OG 제목·이미지가 나오는지 확인한다.\n"])</script><script>self.__next_f.push([1,"4e:T1a8d,"])</script><script>self.__next_f.push([1,"# Route Handler와 Server Actions\n\n\u003e 요약: 앱 밖 API는 Route Handler로, 같은 앱의 폼 저장은 Server Action으로 나누고, 정적 호스팅 제약을 확인한다.\n\n---\n\n## 1. 왜 이 주제가 필요한가\n\n브라우저만으로는 메일을 보내거나 DB에 쓰지 못한다. 그 작업은 서버가 한다.\n\nApp Router에는 길이 두 개다. **Route Handler**는 `app/api/.../route.ts`에 HTTP 메서드를 여는 방식이다. **Server Action**은 함수를 서버에서 실행하고, 폼의 `action`에 바로 연결한다.\n\n둘 다 Node 서버가 있는 배포에서 의미가 있다. `output: 'export'`면 이 런타임이 없다.\n\n---\n\n## 2. 한 줄 규칙\n\n외부 시스템·웹훅·다른 클라이언트가 치는 엔드포인트는 Route Handler다. 같은 Next 앱의 폼·뮤테이션은 Server Action이다.\n\n입력은 반드시 검증한다. 시크릿은 서버 파일에만 둔다.\n\n---\n\n## 3. 예제\n\n### Route Handler\n\n```ts\n// app/api/hello/route.ts\nimport {NextResponse} from 'next/server';\n\nexport async function GET() {\n  return NextResponse.json({ok: true});\n}\n\nexport async function POST(request: Request) {\n  const body = (await request.json()) as {message?: string};\n  const message = body.message?.trim() ?? '';\n  if (!message) {\n    return NextResponse.json({error: 'message가 필요하다'}, {status: 400});\n  }\n  return NextResponse.json({received: message});\n}\n```\n\n`GET` / `POST` / `PUT` / `PATCH` / `DELETE`를 함수 이름으로 export한다. URL은 폴더 경로다. 위 파일은 `/api/hello`.\n\n용도: 결제 웹훅, 모바일 앱이 치는 API, 브라우저 CORS를 피해 서버에서 외부 API를 대신 호출하는 프록시.\n\nNext.js 15부터 GET Handler도 기본적으로 캐시하지 않는다. 캐시가 필요하면 응답 헤더나 Route Segment Config를 명시한다.\n\n```ts\nexport const dynamic = 'force-dynamic';\n```\n\n정적 내보내기에서는 이 파일이 빌드 산출물에 서버로 남지 않거나 지원이 제한된다. 정적 호스팅이면 백엔드를 별도 서버(Cafe24, 클라우드 함수 등)로 둔다.\n\n### Server Actions\n\n```ts\n// app/contact/actions.ts\n'use server';\n\nimport {z} from 'zod';\n\nconst schema = z.object({\n  email: z.string().email(),\n  body: z.string().min(1).max(2000),\n});\n\nexport async function sendMessage(formData: FormData) {\n  const parsed = schema.safeParse({\n    email: formData.get('email'),\n    body: formData.get('body'),\n  });\n  if (!parsed.success) {\n    return {ok: false as const, error: '입력 형식이 맞지 않는다'};\n  }\n\n  // 메일 발송·DB 저장은 여기\n  return {ok: true as const};\n}\n```\n\n`'use server'`는 이 파일의 export 함수가 서버에서만 실행된다는 표시다. 클라이언트는 네트워크 호출로 이 함수를 부른다. 함수 본문은 브라우저에 안 실리는 것이 정상이다.\n\n```tsx\n// app/contact/page.tsx\nimport {sendMessage} from './actions';\n\nexport default function ContactPage() {\n  return (\n    \u003cform action={sendMessage}\u003e\n      \u003clabel\u003e\n        이메일\n        \u003cinput name=\"email\" type=\"email\" required /\u003e\n      \u003c/label\u003e\n      \u003clabel\u003e\n        내용\n        \u003ctextarea name=\"body\" required /\u003e\n      \u003c/label\u003e\n      \u003cbutton type=\"submit\"\u003e보내기\u003c/button\u003e\n    \u003c/form\u003e\n  );\n}\n```\n\n폼은 Server Component에 둬도 된다. `action`에 서버 함수를 넘긴다. JS가 꺼져 있어도 폼 submit은 HTML 기본 동작으로 진행되는 쪽에 가깝다.\n\n진행 상태·에러 메시지를 화면에 바로 쓰려면 Client에서 `useActionState`를 쓴다.\n\n```tsx\n'use client';\n\nimport {useActionState} from 'react';\nimport {sendMessage} from './actions';\n\nexport function ContactForm() {\n  const [state, formAction, pending] = useActionState(sendMessage, null);\n\n  return (\n    \u003cform action={formAction}\u003e\n      \u003cinput name=\"email\" type=\"email\" required /\u003e\n      \u003ctextarea name=\"body\" required /\u003e\n      \u003cbutton type=\"submit\" disabled={pending}\u003e\n        {pending ? '보내는 중' : '보내기'}\n      \u003c/button\u003e\n      {state \u0026\u0026 !state.ok ? \u003cp\u003e{state.error}\u003c/p\u003e : null}\n    \u003c/form\u003e\n  );\n}\n```\n\n이 패턴을 쓰려면 Action이 이전 state를 첫 인자로 받도록 시그니처를 맞춘다.\n\n```ts\n'use server';\n\ntype State = {ok: true} | {ok: false; error: string} | null;\n\nexport async function sendMessage(_prev: State, formData: FormData): Promise\u003cState\u003e {\n  // 검증·저장\n  return {ok: true};\n}\n```\n\n### 무엇을 고를지\n\n| 상황 | 선택 |\n|------|------|\n| 외부 앱·웹훅이 HTTP로 호출 | Route Handler 또는 별도 API |\n| 같은 Next 앱의 폼·버튼 | Server Action |\n| 순수 정적 사이트 | 외부 API + Client, 또는 빌드 타임만 |\n\n### 저장 후 화면 갱신\n\n```ts\n'use server';\n\nimport {revalidatePath} from 'next/cache';\nimport {redirect} from 'next/navigation';\n\nexport async function updatePost(id: string, formData: FormData) {\n  const title = String(formData.get('title') ?? '');\n  // DB 업데이트\n  revalidatePath(`/posts/${id}`);\n  redirect(`/posts/${id}/`);\n}\n```\n\n`revalidatePath`는 그 주소의 캐시된 HTML을 버린다. 정적 내보내기에서는 런타임 재검증이 없다. 배포 파이프라인에서 다시 빌드한다.\n\n### 보안\n\n- Action·Handler 모두 스키마로 입력 검증\n- 쿠키 세션이 있으면 핸들러·액션 안에서 다시 확인\n- **CSRF(Cross-Site Request Forgery, 다른 사이트가 사용자를 대신해 요청을 보내는 공격)** : Server Actions는 Origin 검사를 한다. 팀 정책과 SameSite 쿠키를 확인한다\n- `NEXT_PUBLIC_`이 붙은 값은 브라우저에 노출된다. API 키는 붙이지 않는다\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| export 배포에 `route.ts`를 의존 | 런타임 404 | 별도 백엔드 또는 서버 호스팅 |\n| Action에서 `formData.get`만 신뢰 | 잘못된·악의적 입력 | zod 등으로 검증 |\n| 시크릿을 Client 컴포넌트에 둠 | 키 유출 | `'use server'` / Route Handler |\n| GET Handler로 데이터를 변경 | 캐시·크롤러가 부작용 | 변경은 POST + Action/Handler |\n| 모든 API를 `/api`에 넣고 폼도 fetch | 중복 계층 | 앱 내부 뮤테이션은 Action |\n\n---\n\n## 정리\n\nRoute Handler는 HTTP 엔드포인트다. Server Action은 앱 내부 서버 함수다.\n\n서버가 있는 호스팅에서만 둘 다 살아 있다. 정적 사이트면 쓰기 작업을 외부 API로 빼고, Next는 HTML을 굽는 쪽에 둔다.\n\n---\n\n## 연습\n\n1. Node 런타임 호스팅에서 `POST /api/echo` Route Handler를 만들고 JSON을 그대로 돌려준다.\n2. 이메일 필드가 있는 Server Action 폼을 만들고, 실패 시 메시지를 보여 준다.\n3. 현재 배포가 export면 Next API 없이 연락 폼이 어디로 POST되는지 한 장으로 그린다.\n"])</script><script>self.__next_f.push([1,"4f:T1862,"])</script><script>self.__next_f.push([1,"# 미들웨어와 인증 경계\n\n\u003e 요약: 요청이 페이지에 닿기 전에 경로를 가리고, 실제 권한은 서버 레이아웃에서 다시 확인한다.\n\n---\n\n## 1. 왜 이 주제가 필요한가\n\n관리자 URL을 아는 사람만 막아도 부족하다. 주소가 열리기 전에 한 번 거르고, 페이지·API에서 세션을 다시 본다.\n\n**미들웨어**는 요청이 라우트 핸들러·페이지에 들어가기 전, 네트워크 경계에서 돌아가는 함수다. 리다이렉트·헤더·매처로 경로를 가른다. DB를 깊게 조회하는 자리가 아니다.\n\n인증 정보(세션 쿠키 vs 토큰)를 어디에 둘지가 XSS·CSRF 표면을 가른다.\n\n---\n\n## 2. 한 줄 규칙\n\n미들웨어는 거친 차단(로그인 여부, 경로 prefix)만 한다. 역할·권한은 서버 레이아웃이나 Route Handler에서 다시 검사한다.\n\n토큰은 HttpOnly 쿠키가 기본선이다. `localStorage`에 액세스 토큰만 두면 XSS에 그대로 노출된다.\n\n---\n\n## 3. 예제\n\n### middleware.ts (Next.js 15)\n\n프로젝트 루트 또는 `src/middleware.ts`다. `app/` 안이 아니다.\n\n```ts\n// middleware.ts\nimport {NextResponse} from 'next/server';\nimport type {NextRequest} from 'next/server';\n\nexport function middleware(request: NextRequest) {\n  const token = request.cookies.get('session')?.value;\n  const isManager = request.nextUrl.pathname.startsWith('/manager');\n\n  if (isManager \u0026\u0026 !token) {\n    const login = new URL('/login/', request.url);\n    login.searchParams.set('from', request.nextUrl.pathname);\n    return NextResponse.redirect(login);\n  }\n\n  return NextResponse.next();\n}\n\nexport const config = {\n  matcher: ['/manager/:path*'],\n};\n```\n\n`matcher`로 검사할 경로만 지정한다. 모든 정적 파일에 미들웨어를 태우면 비용만 는다.\n\n쿠키 존재만 본다. 서명 검증·DB 조회는 레이아웃으로 미룬다. 만료된 쿠키를 들고 온 사용자는 미들웨어를 통과한 뒤 레이아웃에서 `redirect`된다.\n\nNext.js 16은 같은 역할을 `proxy.ts`로 옮기는 방향이다. 파일 이름과 런타임 기본값이 다를 수 있다. “경로를 가르는 네트워크 경계”라는 역할은 같다. 프로젝트 버전의 파일명을 확인한다.\n\n### 인증 정보 위치\n\n| 저장 | 장점 | 주의 |\n|------|------|------|\n| HttpOnly + Secure 쿠키 | JS가 못 읽음. XSS에 상대적으로 안전 | SameSite, CSRF, 도메인 |\n| 메모리(React state) | XSS 표면이 작음 | 새로고침 시 소실. 쿠키와 조합 |\n| `localStorage` | 구현이 쉬움 | XSS 시 토큰 탈취 |\n\nNext 풀스택이면 쿠키 세션 + Server Component에서 `cookies()`로 읽는 구성이 흔하다. SPA + 별도 API면 쿠키 또는 Authorization 헤더. 헤더만 쓰면 CSRF는 줄어들고 XSS 위험은 커진다.\n\n### 레이아웃에서 가드\n\n```ts\n// lib/auth.ts\nimport {cookies} from 'next/headers';\n\nexport type Session = {userId: string; role: 'admin' | 'user'};\n\nexport async function getSession(): Promise\u003cSession | null\u003e {\n  const jar = await cookies();\n  c
