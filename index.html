구조다.\n\n```\nmy-project/\n├── settings.gradle.kts\n├── build.gradle.kts\n├── core/                # 공통 유틸, 공통 DTO, Enum, 에러 코드\n├── domain/              # JPA 엔티티, 리포지토리, 도메인 비즈니스 로직\n├── api/                 # 사용자용 REST API 서버 (실행 가능한 Spring Boot Jar)\n└── batch/               # 주기적인 대용량 정산/통계 배치 애플리케이션\n```\n\n```\n[api (실행 모듈)] ──▶ [domain (DB/엔티티)] ──▶ [core (공통)]\n[batch (실행 모듈)] ─┘\n```\n\n#### 루트 `settings.gradle.kts`\n```kotlin\nrootProject.name = \"my-project\"\n\ninclude(\"core\")\ninclude(\"domain\")\ninclude(\"api\")\ninclude(\"batch\")\n```\n\n#### 루트 `build.gradle.kts` (공통 컨벤션 주입)\n```kotlin\nplugins {\n    java\n    alias(libs.plugins.spring.boot) apply false\n    alias(libs.plugins.spring.dependency.management) apply false\n}\n\nallprojects {\n    group = \"com.example\"\n    version = \"1.0.0\"\n\n    repositories {\n        mavenCentral()\n    }\n}\n\nsubprojects {\n    apply(plugin = \"java\")\n    apply(plugin = \"org.springframework.boot\")\n    apply(plugin = \"io.spring.dependency-management\")\n\n    java {\n        toolchain {\n            languageVersion.set(JavaLanguageVersion.of(21))\n        }\n    }\n\n    dependencies {\n        // 모든 서브모듈에 공통으로 들어갈 Lombok, 테스트 라이브러리\n        compileOnly(\"org.projectlombok:lombok\")\n        annotationProcessor(\"org.projectlombok:lombok\")\n        testImplementation(\"org.springframework.boot:spring-boot-starter-test\")\n    }\n\n    tasks.withType\u003cTest\u003e {\n        useJUnitPlatform()\n    }\n}\n```\n\n#### `domain/build.gradle.kts` (라이브러리 모듈)\n`domain` 모듈은 스스로 실행되는 애플리케이션이 아니라 클래스 라이브러리다. 실행 가능한 `bootJar` 생성을 끄고 일반 `jar`를 켜야 한다.\n\n```kotlin\n// 실행 모듈이 아니므로 bootJar 비활성화\ntasks.bootJar { enabled = false }\ntasks.jar { enabled = true }\n\ndependencies {\n    implementation(project(\":core\"))\n    implementation(\"org.springframework.boot:spring-boot-starter-data-jpa\")\n    runtimeOnly(\"com.mysql:mysql-connector-j\")\n}\n```\n\n#### `api/build.gradle.kts` (실행 모듈)\n```kotlin\ntasks.bootJar { enabled = true }\ntasks.jar { enabled = false }\n\ndependencies {\n    implementation(project(\":domain\")) // domain을 참조하면 core까지 함께 사용 가능\n    implementation(\"org.springframework.boot:spring-boot-starter-web\")\n    implementation(\"org.springframework.boot:spring-boot-starter-validation\")\n    implementation(\"org.springframework.boot:spring-boot-starter-security\")\n}\n```\n\n---\n\n### 패턴 2: MSA / 독립 도메인형 멀티모듈 구조 (Microservice-Ready Multi-Module)\n\n서비스가 방대해져 회원, 주문, 결제, 정산 등의 도메인이 독자적으로 커질 때 적용하는 구조다. 향후 모놀리스에서 독립적인 MSA 서비스로 쉽게 쪼갤 수 있도록 설계한다.\n\n```\ncommerce-system/\n├── common/                      # 전역 공통 모듈\n│   ├── common-logging/\n│   └── common-security/\n├── domain/                      # 순수 도메인 모듈 (DB/Entity 캡슐화)\n│   ├── member-domain/\n│   ├── order-domain/\n│   └── payment-domain/\n├── clients/                     # 외부 통신 Feign/RestClient 어댑터\n│   └── pg-client/               # PG사 결제 연동 클라이언트\n└── apps/                        # 독립 배포 가능한 Spring Boot 서버들\n    ├── user-api/                # 고객 앱용 API 서버\n    ├── admin-api/               # 관리자 CMS 백오피스 서버\n    └── payment-worker/          # 결제 승인/대사 큐 컨슈머 서버\n```\n\n```\n[user-api] ──▶ [order-domain] ──▶ [member-domain]\n     │                 │\n     ▼                 ▼\n[common-security]  [pg-client]\n```\n\n#### `settings.gradle.kts` 계층형 네이밍\n```kotlin\nrootProject.name = \"commerce-system\"\n\n// 폴더 깊이에 맞게 모듈 포함\ninclude(\"common:common-logging\")\ninclude(\"common:common-security\")\n\ninclude(\"domain:member-domain\")\ninclude(\"domain:order-domain\")\ninclude(\"domain:payment-domain\")\n\ninclude(\"clients:pg-client\")\n\ninclude(\"apps:user-api\")\ninclude(\"apps:admin-api\")\ninclude(\"apps:payment-worker\")\n```\n\n#### `apps/user-api/build.gradle.kts`\n```kotlin\ndependencies {\n    implementation(project(\":common:common-security\"))\n    implementation(project(\":common:common-logging\"))\n    \n    // 필요한 도메인만 선별적으로 조립\n    implementation(project(\":domain:member-domain\"))\n    implementation(project(\":domain:order-domain\"))\n    implementation(project(\":clients:pg-client\"))\n\n    implementation(\"org.springframework.boot:spring-boot-starter-web\")\n}\n```\n\n**특징과 장점:**\n- `admin-api`는 `order-domain`과 `member-domain`만 필요하고 `pg-client`는 몰라도 된다. 필요한 모듈만 주입받아 빌드 용량을 줄이고 의존성을 격리한다.\n- 나중에 주문 트래픽이 폭증하면 `apps:order-api`를 만들어 `order-domain`만 들고 독립 배포 서버로 분리하기가 매우 쉽다.\n\n---\n\n### 패턴 3: 헥사고날 아키텍처 멀티모듈 구조 (Hexagonal / Ports and Adapters)\n\nDDD(도메인 주도 설계)와 헥사고날 아키텍처를 완벽하게 물리적 모듈로 강제하는 구조다. **도메인 코드가 프레임워크(Spring, JPA)에 오염되는 것을 극도로 방지**하고자 할 때 쓴다.\n\n```\norder-service/\n├── order-domain/                # 순수한 자바 도메인 (Spring/JPA 의존성 0%)\n│   ├── model/ (Order, OrderLine)\n│   └── port/ (OrderRepositoryPort, PaymentPort)\n├── order-application/           # 유스케이스 서비스 (비즈니스 흐름 조율)\n│   └── service/ (CreateOrderUseCase, OrderService)\n├── order-infrastructure/        # 어댑터 구현체 (JPA, Redis, 외부 HTTP 클라이언트)\n│   ├── persistence/ (OrderJpaRepository, OrderRepositoryAdapter)\n│   └── external/ (TossPaymentAdapter)\n└── order-bootstrap/             # 실행 진입점 (Spring Boot Main, Controller, 설정)\n    ├── controller/ (OrderApiController)\n    └── OrderApplication.java\n```\n\n```\n[order-bootstrap (Web/Main)]\n        │ (참조)\n        ▼\n[order-application (UseCase)] ──▶ [order-domain (순수 POJO Core)]\n        ▲                                     ▲\n        │ (참조)                              │ (Port 인터페이스 구현)\n[order-infrastructure (JPA/Redis/HTTP Adapter)]\n```\n\n#### `order-domain/build.gradle.kts` (순수 자바 모듈)\n```kotlin\n// 스프링 부트 플러그인도, JPA도 전혀 넣지 않음!\nplugins {\n    `java-library`\n}\n\ndependencies {\n    // 오직 순수 자바 유틸 및 테스팅 도구만 허용\n    testImplementation(\"org.junit.jupiter:junit-jupiter:5.10.2\")\n    testImplementation(\"org.assertj:assertj-core:3.25.3\")\n}\n```\n\n#### `order-infrastructure/build.gradle.kts` (기술 구현체)\n```kotlin\ntasks.bootJar { enabled = false }\ntasks.jar { enabled = true }\n\ndependencies {\n    implementation(project(\":order-domain\"))\n    \n    // JPA, QueryDSL, Redis 등 기술 스택 의존성 몰아넣기\n    implementation(\"org.springframework.boot:spring-boot-starter-data-jpa\")\n    implementation(\"org.springframework.boot:spring-boot-starter-data-redis\")\n    runtimeOnly(\"com.mysql:mysql-connector-j\")\n}\n```\n\n#### `order-bootstrap/build.gradle.kts` (최종 조립자)\n```kotlin\ntasks.bootJar { enabled = true }\n\ndependencies {\n    implementation(project(\":order-domain\"))\n    implementation(project(\":order-application\"))\n    implementation(project(\":order-infrastructure\"))\n\n    implementation(\"org.springframework.boot:spring-boot-starter-web\")\n}\n```\n\n**특징과 장점:**\n- 데이터베이스를 MySQL에서 MongoDB로 바꾸거나 JPA에서 R2DBC로 교체해도 `order-domain` 코드는 **단 1글자도 수정되지 않는다**.\n- 프레임워크가 없는 순수 자바 단위 테스트(Unit Test)를 작성할 수 있어 테스트 실행 속도가 0.1초 단위로 끝난다.\n\n---\n\n## 6. 멀티모듈 빌드 속도를 3배 빠르게 만드는 실무 최적화 팁\n\n### 1) `gradle.properties` 튜닝\n프로젝트 루트의 `gradle.properties`에 아래 옵션들을 활성화한다.\n\n```properties\n# 데몬 프로세스 재사용으로 JVM 웜업 시간 단축\norg.gradle.daemon=true\n\n# 독립적인 모듈들을 병렬로 동시 빌드 (코어 수 활용)\norg.gradle.parallel=true\n\n# 이전 빌드 결과물을 캐싱하여 변경이 없는 작업 스킵\norg.gradle.caching=true\n\n# 빌드 시 JVM 힙 메모리 넉넉히 할당\norg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m\n\n# 설정 단계 캐싱 (Gradle 8+)\norg.gradle.configuration-cache=true\n```\n\n### 2) 빌드 캐시와 증분 빌드 확인하기\n빌드 실행 시 Task 옆에 표시되는 라벨의 의미를 알고 있어야 한다:\n- `\u003e Task :core:compileJava UP-TO-DATE`: 소스 코드가 바뀌지 않아 컴파일을 스킵함.\n- `\u003e Task :core:compileJava FROM-CACHE`: 로컬 또는 원격 빌드 캐시에서 결과물을 바로 꺼내옴.\n- `\u003e Task :core:compileJava`: 실제로 재컴파일을 수행함.\n\n---\n\n## 7. 흔한 실수와 트러블슈팅\n\n| 문제 상황 | 원인 | 해결책 |\n|-----------|------|--------|\n| **`No main class specified` 에러** | 도메인이나 공통 라이브러리 서브모듈에 `bootJar`가 켜져 있어 main 메서드를 찾으려고 함 | 서브모듈의 `build.gradle.kts`에 `tasks.bootJar { enabled = false }`, `tasks.jar { enabled = true }` 설정 |\n| **순환 참조 (`Circular dependency`)** | `Module A`가 `Module B`를 참조하고, `Module B`가 `Module A`를 참조함 | 공통 인터페이스나 DTO를 제3의 `core` 모듈로 추출하여 단방향 흐름 유지 |\n| **버전 충돌 (`NoSuchMethodError`)** | 서브모듈마다 라이브러리 버전이 제각각 선언됨 | `libs.versions.toml` (Version Catalog)을 통해 버전을 단일 지점에서 통제 |\n| **불필요한 전체 재컴파일** | 하위 모듈 의존성을 `api`로 무분별하게 선언 | 기본적으로 `implementation`을 사용하여 변경 전파 격리 |\n\n---\n\n## 연습\n\n1. `settings.gradle.kts`를 작성하여 `core`, `domain`, `api` 3개 모듈을 갖는 계층형 멀티모듈 프로젝트를 구성해 본다.\n2. `domain` 모듈에서 `bootJar`를 비활성화하고 순수 `jar`로 빌드되도록 설정한 뒤, `api` 모듈에서 이를 주입받아 Spring Boot 애플리케이션을 기동해 본다.\n3. `gradle/libs.versions.toml` 파일을 생성하여 Spring Boot 및 QueryDSL 버전을 정의하고 멀티모듈 전체에서 중앙 집중식으로 참조해 본다.\n"])</script><script>self.__next_f.push([1,"6d:T12d7,"])</script><script>self.__next_f.push([1,"# Vue 3 Composition API로 시작하기\n\n\u003e 요약: 한 파일에 화면·로직·스타일을 두고, script setup으로 Vue 3 컴포넌트를 시작한다.\n\n---\n\n## 1. 언제 Vue 3인가\n\nVue는 HTML 템플릿에 상태를 연결해 화면을 그리는 프레임워크다. 값이 바뀌면 해당 부분만 다시 그린다.\n\n신규 프로젝트는 **Vue 3 + TypeScript + `\u003cscript setup\u003e`** 을 기본선으로 둔다. Vue 2는 유지보수만 한다.\n\n| 항목 | Vue 2 | Vue 3 |\n|------|-------|-------|\n| 기본 API | Options (`data`, `methods`) | Composition (`setup`, `ref`) |\n| 반응형 | `Object.defineProperty` | Proxy |\n| 파일 | Options SFC | SFC(단일 파일 컴포넌트) + script setup |\n| TypeScript | 보조 | 공식 경로 |\n\nComposition API(조합형 API)는 관련 코드를 함수 단위로 모아 재사용하기 쉽게 만든 방식이다. Options는 `data`/`methods`/`computed`로 역할이 갈라져, 한 기능이 파일 여러 곳에 흩어진다.\n\n---\n\n## 2. 핵심 구조\n\nSFC는 한 파일에 로직·마크업·스타일을 담는다.\n\n```\nCounter.vue\n├── \u003cscript setup\u003e   상태와 동작\n├── \u003ctemplate\u003e       화면\n└── \u003cstyle scoped\u003e   이 컴포넌트만의 스타일\n```\n\n| 개념 | 한 줄 |\n|------|--------|\n| `createApp` | 앱을 만들고 `#app`에 붙인다 |\n| SFC | `.vue` 한 장이 컴포넌트 하나다 |\n| `\u003cscript setup\u003e` | setup의 축약. 최상위 변수·함수가 템플릿에 노출된다 |\n| `scoped` | 스타일이 이 파일 밖으로 새지 않는다 |\n\n파일명은 `UserCard.vue`처럼 PascalCase로 둔다.\n\n---\n\n## 3. 프로젝트 생성\n\n```bash\nnpm create vue@latest my-app\ncd my-app\nnpm install\nnpm run dev\n```\n\n선택 시 TypeScript, Vue Router, Pinia는 이후 글에서 다룬다. 지금은 Vue + TS만으로도 충분하다.\n\n진입점은 `main.ts`다.\n\n```ts\nimport { createApp } from 'vue'\nimport App from './App.vue'\n\ncreateApp(App).mount('#app')\n```\n\n`index.html`의 `\u003cdiv id=\"app\"\u003e\u003c/div\u003e`가 마운트 지점이다.\n\n---\n\n## 4. 동작하는 예: 카운터\n\n`src/components/Counter.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\nimport { ref, computed } from 'vue'\n\nconst count = ref(0)\nconst label = computed(() =\u003e (count.value === 0 ? '시작' : `${count.value}회`))\n\nfunction increment() {\n  count.value += 1\n}\n\nfunction reset() {\n  count.value = 0\n}\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003csection\u003e\n    \u003cp\u003e{{ label }}\u003c/p\u003e\n    \u003cbutton type=\"button\" @click=\"increment\"\u003e증가\u003c/button\u003e\n    \u003cbutton type=\"button\" @click=\"reset\"\u003e초기화\u003c/button\u003e\n  \u003c/section\u003e\n\u003c/template\u003e\n\n\u003cstyle scoped\u003e\nsection {\n  display: flex;\n  gap: 8px;\n  align-items: center;\n}\n\u003c/style\u003e\n```\n\n`src/App.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\nimport Counter from './components/Counter.vue'\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003cmain\u003e\n    \u003ch1\u003e카운터\u003c/h1\u003e\n    \u003cCounter /\u003e\n  \u003c/main\u003e\n\u003c/template\u003e\n```\n\n`ref(0)`은 **값이 바뀌면 화면을 다시 그릴 상자**다. script에서는 `count.value`로 열고, 템플릿에서는 `{{ count }}`로 쓴다. Vue가 템플릿에서 상자를 자동으로 연다(언래핑).\n\n`\u003cscript setup\u003e`은 `setup()` 함수의 문법 설탕이다. `export` 없이 선언한 이름만 템플릿이 본다.\n\n---\n\n## 5. Options와 무엇을 다르게 쓰는가\n\nOptions API 예:\n\n```vue\n\u003cscript lang=\"ts\"\u003e\nexport default {\n  data() {\n    return { count: 0 }\n  },\n  methods: {\n    increment() {\n      this.count += 1\n    },\n  },\n}\n\u003c/script\u003e\n```\n\n동작은 같다. 다만 기능이 커지면 `data`와 `methods`가 멀어진다. Composition은 카운터 관련 코드를 한 블록에 둔다. 기존 Options 코드는 점진 이관하면 된다. 신규는 script setup만 쓴다.\n\n---\n\n## 6. 주의 / 흔한 실수\n\n- **Vue 2 문법으로 시작하기.** `new Vue()`는 Vue 3가 아니다. `createApp`을 쓴다.\n- **script에서 `count`만 쓰기.** `ref`는 `.value`가 실제 값이다. `count++`는 상자를 증가시키지 않는다.\n- **`\u003cscript setup\u003e`과 `export default`를 섞기.** setup 블록은 컴포넌트 옵션 객체가 아니다.\n- **전역 CSS로 컴포넌트 스타일 잡기.** `scoped`를 기본으로 둔다. 테마만 전역에 둔다.\n- **한 SFC에 화면 여러 개를 넣기.** 파일 하나 = 책임 하나.\n\n---\n\n## 정리\n\nVue 3 시작은 버전 비교가 아니다. **SFC + `\u003cscript setup\u003e` + `ref`** 세 가지를 고정하면 나머지는 이 위에 쌓인다.\n\n- 화면 조각 → `.vue` 파일\n- 변하는 값 → `ref` / `computed`\n- 앱 시작 → `createApp(App).mount('#app')`\n\n---\n\n## 연습\n\n1. `npm create vue@latest`로 프로젝트를 만들고 `Counter.vue`를 붙여 증가·초기화가 동작하는지 확인한다.\n2. `label` computed를 바꿔 10 이상이면 문구를 `많음`으로 표시한다.\n3. `HelloName.vue`를 만들어 입력한 이름을 `\u003cp\u003e`에 출력한다. 상태는 `ref('')` 하나로 둔다.\n"])</script><script>self.__next_f.push([1,"6e:T15a1,"])</script><script>self.__next_f.push([1,"# ref와 reactive로 반응형 상태 다루기\n\n\u003e 요약: 값이 바뀌면 화면이 다시 그려지도록 ref로 상태를 두고, 계산 값과 감시 로직을 나눈다.\n\n---\n\n## 1. 왜 반응형인가\n\n일반 변수 `let n = 0`은 값이 바뀌어도 화면이 모른다. Vue의 반응형은 **값이 바뀌면 그 값을 쓰는 템플릿을 다시 그리게** 만든다.\n\n언제 무엇을 쓰는가.\n\n| 상황 | 선택 |\n|------|------|\n| 숫자, 문자열, 불리언, 한 객체 참조 | `ref` |\n| 서로 붙어 다니는 필드 묶음 | `reactive` 또는 `ref({ ... })` |\n| 다른 상태에서 계산만 하는 값 | `computed` |\n| 값이 바뀔 때 API 호출 등 | `watch` / `watchEffect` |\n\n실무 기본선은 **거의 모든 상태를 `ref`로 두고**, 필드가 많은 폼만 `reactive`를 검토한다.\n\n---\n\n## 2. 핵심 개념\n\n| API | 한 줄 |\n|-----|--------|\n| `ref` | 값이 바뀌면 화면을 다시 그릴 상자. script에서는 `.value` |\n| `reactive` | 객체 전체에 Proxy를 씌운다. 프로퍼티는 바로 읽는다 |\n| 언래핑 | 템플릿은 `ref` 상자를 자동으로 연다 |\n| `computed` | 다른 상태에 의존하는 캐시된 파생 값 |\n| `watch` | 특정 상자가 바뀔 때 부수 효과를 실행한다 |\n\n`ref`로 객체를 담아도 된다. `user.value.name = 'a'`처럼 연 뒤 필드를 바꾼다. Vue 3는 객체 `ref`의 안쪽도 반응형이다.\n\n---\n\n## 3. 동작하는 예: 프로필 폼\n\n`src/components/ProfileForm.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\nimport { ref, reactive, computed, watch } from 'vue'\n\nconst count = ref(0)\n\nconst form = reactive({\n  name: '',\n  age: 0,\n})\n\nconst summary = computed(() =\u003e {\n  if (!form.name) return '이름을 입력한다'\n  return `${form.name} (${form.age}세), 저장 ${count.value}회`\n})\n\nwatch(\n  () =\u003e form.name,\n  (next, prev) =\u003e {\n    if (prev \u0026\u0026 next !== prev) {\n      count.value = 0\n    }\n  },\n)\n\nfunction save() {\n  if (!form.name.trim()) return\n  count.value += 1\n}\n\nfunction reset() {\n  form.name = ''\n  form.age = 0\n  count.value = 0\n}\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003cform @submit.prevent=\"save\"\u003e\n    \u003clabel\u003e\n      이름\n      \u003cinput v-model=\"form.name\" type=\"text\" autocomplete=\"name\" /\u003e\n    \u003c/label\u003e\n    \u003clabel\u003e\n      나이\n      \u003cinput v-model.number=\"form.age\" type=\"number\" min=\"0\" /\u003e\n    \u003c/label\u003e\n    \u003cp\u003e{{ summary }}\u003c/p\u003e\n    \u003cbutton type=\"submit\"\u003e저장\u003c/button\u003e\n    \u003cbutton type=\"button\" @click=\"reset\"\u003e초기화\u003c/button\u003e\n  \u003c/form\u003e\n\u003c/template\u003e\n```\n\n- `count`는 단일 숫자 → `ref`\n- `form`은 이름·나이가 함께 움직임 → `reactive`\n- `summary`는 둘을 읽어 문장을 만든다 → `computed` (직접 할당하지 않는다)\n- 이름이 바뀌면 저장 횟수를 0으로 → `watch`\n\n템플릿의 `v-model=\"form.name\"`은 `form.name`에 직접 붙는다. `v-model=\"count\"`는 템플릿 언래핑 덕분에 `.value` 없이 동작한다.\n\n---\n\n## 4. 구조 분해와 교체\n\n`reactive` 객체를 구조 분해하면 반응형이 끊긴다.\n\n```ts\nconst form = reactive({ name: '', age: 0 })\nconst { name } = form // name은 일반 문자열. 이후 form.name 변경이 이 변수에 안 온다\n```\n\n필드를 따로 쓰려면 `toRefs`를 쓴다.\n\n```ts\nimport { reactive, toRefs } from 'vue'\n\nconst form = reactive({ name: '', age: 0 })\nconst { name, age } = toRefs(form) // name.value, age.value\n```\n\n객체 통째 교체도 `reactive`의 약점이다.\n\n```ts\nlet state = reactive({ name: 'a' })\nstate = reactive({ name: 'b' }) // 새 객체. 템플릿이 옛 Proxy를 보고 있을 수 있다\n```\n\n통째 교체가 필요하면 `ref`로 담는다.\n\n```ts\nconst state = ref({ name: 'a' })\nstate.value = { name: 'b' } // 상자 안만 갈아끼운다\n```\n\n---\n\n## 5. computed와 watch 구분\n\n```ts\nimport { ref, computed, watch, watchEffect } from 'vue'\n\nconst price = ref(1000)\nconst qty = ref(2)\nconst total = computed(() =\u003e price.value * qty.value)\n\nwatch(qty, (n) =\u003e {\n  if (n \u003c 1) qty.value = 1\n})\n\nwatchEffect(() =\u003e {\n  console.log('합계', total.value)\n})\n```\n\n| | `computed` | `watch` |\n|--|------------|---------|\n| 목적 | 파생 **값** | 부수 **효과** |\n| 캐시 | 의존이 같으면 재계산 안 함 | 매번 콜백 |\n| 쓰기 | 기본은 읽기 전용 | 값 변경·API·로그 |\n\n화면 표시용 계산은 `computed`다. 저장 API, `localStorage`, 포커스 이동은 `watch`다.\n\n---\n\n## 6. 주의 / 흔한 실수\n\n- **script에서 `.value` 누락.** `count = 1`은 `ref` 상자를 숫자로 덮어 반응형이 죽는다. `count.value = 1`이다.\n- **`reactive`에 원시값.** `reactive(0)`은 객체가 아니라서 기대한 추적이 안 된다. 원시는 `ref`.\n- **`reactive` 변수 재할당.** 위 4절. 교체가 필요하면 `ref`.\n- **deep `watch` 남용.** `{ deep: true }`는 큰 객체에서 비용이 크다. 경로를 좁힌다.\n- **`computed` 안에서 상태 변경.** 파생만 한다. 쓰기는 `watch`나 이벤트 핸들러.\n\n---\n\n## 정리\n\n상태를 만들 때 질문 하나는 이것이다. **값 하나인가, 필드 묶음인가.**\n\n- 하나 → `ref`\n- 묶음 → `reactive` 또는 `ref({ ... })`\n- 파생 → `computed`\n- 부수 효과 → `watch`\n\n거의 모든 신규 코드는 `ref`만으로도 충분하다.\n\n---\n\n## 연습\n\n1. `ref`로 `score`를 두고, `computed`로 60 이상이면 `통과` 아니면 `재시험`을 표시한다.\n2. `reactive` 주소 객체 `{ city, street }`를 만들고 `toRefs`로 템플릿에 나눠 바인딩한다.\n3. `watch`로 `score`가 100이 되면 `console.log('만점')`을 한 번 출력한다.\n"])</script><script>self.__next_f.push([1,"6f:T17a0,"])</script><script>self.__next_f.push([1,"# 컴포넌트 props·emits·슬롯\n\n\u003e 요약: 부모는 props로 값을 내리고 자식은 이벤트로 알리며, 슬롯으로 자리를 열어 컴포넌트를 조립한다.\n\n---\n\n## 1. 왜 계약을 좁히는가\n\n화면을 한 파일에 두면 수정이 한곳에 몰린다. 카드·검색창·모달처럼 **같은 UI를 여러 곳에서** 쓸 때 컴포넌트로 나눈다.\n\n데이터는 한 방향으로만 흐른다.\n\n| 방향 | 이름 | 한 줄 |\n|------|------|--------|\n| 부모 → 자식 | props | 부모가 자식에게 내려주는 값. 자식은 읽기만 한다 |\n| 자식 → 부모 | emits | 자식이 부모에게 보내는 알림. 값은 이벤트로 올린다 |\n| 부모 → 자식 UI | slots | 자식 템플릿의 구멍. 부모가 마크업을 채운다 |\n\n자식이 `props`를 직접 바꾸면 부모가 가진 진실과 어긋난다. 바꿀 일이 있으면 이벤트를 올려 부모가 상태를 고친다.\n\n---\n\n## 2. 핵심 문법 (script setup)\n\n`\u003cscript setup\u003e`에서는 컴파일러 매크로를 쓴다. import 하지 않는다.\n\n```ts\nconst props = defineProps\u003c{\n  title: string\n  count?: number\n}\u003e()\n\nconst emit = defineEmits\u003c{\n  select: [id: string]\n  close: []\n}\u003e()\n```\n\n- `title`은 필수, `count`는 선택\n- `select`는 문자열 인자 하나, `close`는 인자 없음\n- 매크로 결과는 런타임에 컴포넌트 옵션으로 옮겨진다\n\nVue 3.5+에서는 `defineProps`에 기본값을 `withDefaults`로 붙인다.\n\n```ts\nconst props = withDefaults(\n  defineProps\u003c{ title: string; count?: number }\u003e(),\n  { count: 0 },\n)\n```\n\n---\n\n## 3. 동작하는 예: 사용자 카드\n\n`src/components/UserCard.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\nexport type User = { id: string; name: string; role: string }\n\ndefineProps\u003c{\n  user: User\n  selected?: boolean\n}\u003e()\n\nconst emit = defineEmits\u003c{\n  select: [id: string]\n  remove: [id: string]\n}\u003e()\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003carticle :class=\"{ selected }\"\u003e\n    \u003ch2\u003e{{ user.name }}\u003c/h2\u003e\n    \u003cp\u003e{{ user.role }}\u003c/p\u003e\n    \u003cslot name=\"actions\"\u003e\n      \u003cbutton type=\"button\" @click=\"emit('select', user.id)\"\u003e선택\u003c/button\u003e\n    \u003c/slot\u003e\n    \u003cbutton type=\"button\" @click=\"emit('remove', user.id)\"\u003e삭제\u003c/button\u003e\n  \u003c/article\u003e\n\u003c/template\u003e\n\n\u003cstyle scoped\u003e\n.selected {\n  outline: 2px solid #2563eb;\n}\n\u003c/style\u003e\n```\n\n`src/App.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\nimport { ref } from 'vue'\nimport UserCard, { type User } from './components/UserCard.vue'\n\nconst users = ref\u003cUser[]\u003e([\n  { id: '1', name: '김하늘', role: '편집' },\n  { id: '2', name: '이준', role: '보기' },\n])\nconst selectedId = ref\u003cstring | null\u003e(null)\n\nfunction onSelect(id: string) {\n  selectedId.value = id\n}\n\nfunction onRemove(id: string) {\n  users.value = users.value.filter((u) =\u003e u.id !== id)\n  if (selectedId.value === id) selectedId.value = null\n}\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003cUserCard\n    v-for=\"user in users\"\n    :key=\"user.id\"\n    :user=\"user\"\n    :selected=\"user.id === selectedId\"\n    @select=\"onSelect\"\n    @remove=\"onRemove\"\n  \u003e\n    \u003ctemplate #actions\u003e\n      \u003cbutton type=\"button\" @click=\"onSelect(user.id)\"\u003e이 사람 선택\u003c/button\u003e\n    \u003c/template\u003e\n  \u003c/UserCard\u003e\n\u003c/template\u003e\n```\n\n- `:user=\"user\"` — props로 객체 전달\n- `@select=\"onSelect\"` — emit 이름이 이벤트 이름\n- `#actions` — named slot. 자식이 기본 버튼을 넣었고, 부모가 덮어쓴다\n- `v-for`의 `key`는 안정적인 `id`. 인덱스는 목록이 줄면 잘못 재사용된다\n\n---\n\n## 4. v-model과 defineModel\n\n검색창처럼 **자식 입력이 부모 상태와 같아야** 하면 `v-model`을 쓴다. 실제로는 props + emit 관례다.\n\n부모:\n\n```vue\n\u003cSearchInput v-model=\"query\" /\u003e\n```\n\n자식 (Vue 3.4+):\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\nconst model = defineModel\u003cstring\u003e({ default: '' })\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003cinput :value=\"model\" @input=\"model = ($event.target as HTMLInputElement).value\" /\u003e\n\u003c/template\u003e\n```\n\n축약:\n\n```vue\n\u003ctemplate\u003e\n  \u003cinput v-model=\"model\" /\u003e\n\u003c/template\u003e\n```\n\n`defineModel`은 `modelValue` props와 `update:modelValue` emit을 대신 만든다. 팀이 Vue 3.4 미만이면 수동으로 같은 계약을 적는다.\n\n```ts\nconst props = defineProps\u003c{ modelValue: string }\u003e()\nconst emit = defineEmits\u003c{ 'update:modelValue': [value: string] }\u003e()\n```\n\n---\n\n## 5. 슬롯 세 종류\n\n| 종류 | 용도 |\n|------|------|\n| default | `\u003cslot\u003e` 한 곳. 태그 사이 내용 |\n| named | `#header`, `#actions`처럼 구역을 나눔 |\n| scoped | 자식이 슬롯에 데이터를 넘겨 부모가 마크업을 그림 |\n\nscoped 예:\n\n```vue\n\u003c!-- 자식 --\u003e\n\u003cslot name=\"item\" :row=\"row\" /\u003e\n\n\u003c!-- 부모 --\u003e\n\u003ctemplate #item=\"{ row }\"\u003e\n  \u003cstrong\u003e{{ row.name }}\u003c/strong\u003e\n\u003c/template\u003e\n```\n\n레이아웃·디자인 시스템에서 슬롯이 재사용의 핵심이다. props로 HTML을 넘기지 않는다.\n\n---\n\n## 6. 주의 / 흔한 실수\n\n- **자식에서 `props.user.name = 'x'`.** 단방향이 깨진다. emit으로 올리고 부모가 배열을 교체한다.\n- **이벤트 이름을 동사 없이.** `select`, `remove`, `update:modelValue`처럼 의도를 적는다. `change`만 있으면 무엇이 변했는지 모른다.\n- **props 객체/배열을 자식이 `push`.** 참조를 공유하므로 부모 상태를 몰래 바꾼다. 새 배열을 만들어 emit한다.\n- **`v-for`에 `key` 없음.** 슬롯·입력이 엉뚱한 행에 남는다.\n- **슬롯 대신 `v-html`로 부모 HTML 주입.** XSS(크로스 사이트 스크립팅) 위험이 크다. 슬롯을 쓴다.\n\n---\n\n## 정리\n\n컴포넌트 API는 기능 나열이 아니다. **props / emits / slots 세 계약을 좁고 분명하게** 적는 일이다.\n\n- 내려줄 값 → props (읽기 전용)\n- 올릴 일 → emits\n- 채울 UI → slots\n- 입력 동기화 → `v-model` / `defineModel`\n\n---\n\n## 연습\n\n1. `AlertBanner.vue`에 `message: string` props와 `close` emit을 넣고, 부모가 닫으면 배너를 제거한다.\n2. `SearchInput.vue`에 `defineModel\u003cstring\u003e()`을 연결해 부모 `query`와 양방향으로 맞춘다.\n3. 카드에 `#footer` named slot을 추가하고, 부모에서 수정 링크를 넣는다.\n"])</script><script>self.__next_f.push([1,"70:T181c,"])</script><script>self.__next_f.push([1,"# Vue Router와 Pinia로 화면·상태 구성\n\n\u003e 요약: URL과 화면을 라우터로 맞추고, 여러 화면이 공유하는 상태는 Pinia 스토어에 두는 SPA 구성 방법을 정리한다.\n\n---\n\n## 1. 왜 둘을 나누는가\n\nSPA(단일 페이지 애플리케이션)는 페이지를 통째로 새로고침하지 않고 화면만 바꾼다.\n\n- **Vue Router** — URL ↔ 화면. 주소가 북마크·뒤로 가기의 진실이다.\n- **Pinia** — 여러 화면이 공유하는 클라이언트 상태 창고. 로그인 사용자, UI 설정처럼 서버에 없는 값.\n\n폼 입력, 모달 열림처럼 **한 화면만** 아는 값은 컴포넌트 `ref`에 둔다. 목록 캐시처럼 서버 데이터는 나중 단계에서 TanStack Query 등을 검토한다. 모든 것을 Pinia에 넣지 않는다.\n\n---\n\n## 2. 핵심 개념\n\n| 개념 | 한 줄 |\n|------|--------|\n| `routes` | `path`와 컴포넌트를 짝짓는다 |\n| lazy import | 해당 화면 JS를 필요할 때 받는다 |\n| `beforeEach` | 이동 전에 로그인·권한을 검사하는 가드 |\n| Pinia 스토어 | `defineStore`로 만든 공유 상태. setup 함수와 같은 모양 |\n| `useRoute` / `useRouter` | 현재 URL, 프로그래밍 방식 이동 |\n\nVue 3의 상태 라이브러리는 Vuex가 아니라 **Pinia**가 기본 권장이다.\n\n---\n\n## 3. 동작하는 예: 라우터 + 인증 스토어\n\n`src/stores/auth.ts`:\n\n```ts\nimport { defineStore } from 'pinia'\nimport { computed, ref } from 'vue'\n\nexport const useAuthStore = defineStore('auth', () =\u003e {\n  const user = ref\u003cstring | null\u003e(null)\n  const isLoggedIn = computed(() =\u003e user.value !== null)\n\n  function login(name: string) {\n    user.value = name\n  }\n\n  function logout() {\n    user.value = null\n  }\n\n  return { user, isLoggedIn, login, logout }\n})\n```\n\nsetup 스토어는 Composition API와 같다. `return`한 것만 바깥에서 쓴다.\n\n`src/router/index.ts`:\n\n```ts\nimport { createRouter, createWebHistory } from 'vue-router'\nimport { useAuthStore } from '../stores/auth'\n\nconst router = createRouter({\n  history: createWebHistory(import.meta.env.BASE_URL),\n  routes: [\n    {\n      path: '/',\n      name: 'home',\n      component: () =\u003e import('../pages/HomeView.vue'),\n    },\n    {\n      path: '/login',\n      name: 'login',\n      component: () =\u003e import('../pages/LoginView.vue'),\n    },\n    {\n      path: '/posts/:id',\n      name: 'post',\n      component: () =\u003e import('../pages/PostView.vue'),\n      props: true,\n      meta: { requiresAuth: true },\n    },\n  ],\n})\n\nrouter.beforeEach((to) =\u003e {\n  const auth = useAuthStore()\n  if (to.meta.requiresAuth \u0026\u0026 !auth.isLoggedIn) {\n    return { name: 'login', query: { redirect: to.fullPath } }\n  }\n})\n\nexport default router\n```\n\n`props: true`면 `:id`가 컴포넌트 props `id`로 들어간다.\n\n`src/main.ts`:\n\n```ts\nimport { createApp } from 'vue'\nimport { createPinia } from 'pinia'\nimport App from './App.vue'\nimport router from './router'\n\nconst app = createApp(App)\napp.use(createPinia())\napp.use(router)\napp.mount('#app')\n```\n\nPinia를 라우터보다 먼저 `use`한다. 가드에서 스토어를 쓰기 때문이다.\n\n`src/App.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\nimport { RouterLink, RouterView } from 'vue-router'\nimport { useAuthStore } from './stores/auth'\n\nconst auth = useAuthStore()\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003cheader\u003e\n    \u003cnav\u003e\n      \u003cRouterLink to=\"/\"\u003e홈\u003c/RouterLink\u003e\n      \u003cRouterLink to=\"/posts/42\"\u003e글 42\u003c/RouterLink\u003e\n    \u003c/nav\u003e\n    \u003cspan v-if=\"auth.isLoggedIn\"\u003e{{ auth.user }}\u003c/span\u003e\n    \u003cbutton v-else type=\"button\" @click=\"auth.login('demo')\"\u003e로그인\u003c/button\u003e\n  \u003c/header\u003e\n  \u003cRouterView /\u003e\n\u003c/template\u003e\n```\n\n`src/pages/PostView.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\ndefineProps\u003c{ id: string }\u003e()\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003carticle\u003e\n    \u003ch1\u003e글 {{ id }}\u003c/h1\u003e\n  \u003c/article\u003e\n\u003c/template\u003e\n```\n\n`src/pages/LoginView.vue`:\n\n```vue\n\u003cscript setup lang=\"ts\"\u003e\nimport { useRoute, useRouter } from 'vue-router'\nimport { useAuthStore } from '../stores/auth'\n\nconst route = useRoute()\nconst router = useRouter()\nconst auth = useAuthStore()\n\nfunction submit() {\n  auth.login('demo')\n  const redirect = typeof route.query.redirect === 'string' ? route.query.redirect : '/'\n  router.replace(redirect)\n}\n\u003c/script\u003e\n\n\u003ctemplate\u003e\n  \u003cform @submit.prevent=\"submit\"\u003e\n    \u003cbutton type=\"submit\"\u003e데모 로그인\u003c/button\u003e\n  \u003c/form\u003e\n\u003c/template\u003e\n```\n\n가드에서 무거운 API를 매 이동마다 호출하면 전환이 느려진다. 토큰 존재 여부처럼 최소 정보만 본다.\n\n---\n\n## 4. 상태를 어디에 둘 것인가\n\n| 상태 | 위치 |\n|------|------|\n| 입력 중인 검색어 | 페이지 컴포넌트 `ref` |\n| 로그인 세션 | Pinia (+ httpOnly 쿠키는 서버) |\n| 현재 글 id | URL `params` (스토어 복제 금지) |\n| 서버 목록 캐시 | 페칭 라이브러리 검토. Pinia에 수동 복사하지 않음 |\n\nURL에 있는 값을 스토어에 또 넣으면 둘이 어긋난다. `id`는 라우트만 진실로 둔다.\n\n---\n\n## 5. 주의 / 흔한 실수\n\n- **라우터보다 Pinia를 늦게 등록.** `beforeEach`에서 `useAuthStore()`가 실패한다.\n- **가드에서 `next()` (Vue Router 3).** Vue Router 4는 `return { name: 'login' }` 또는 아무것도 반환하지 않으면 통과다.\n- **모든 페이지를 한 번에 import.** `() =\u003e import(...)` lazy가 초기 번들을 줄인다.\n- **스토어에서 컴포넌트 `useRouter()`로 화면을 바꾸기.** 스토어는 데이터. 이동은 뷰/가드.\n- **Pinia에 서버 리스트를 미러링.** 중복·만료·페이지네이션이 한 창고에 섞인다.\n\n---\n\n## 정리\n\nRouter는 **주소와 화면**, Pinia는 **공유 클라이언트 상태**다. 경계를 지키면 SPA가 단순해진다.\n\n- 화면 전환 → `routes` + `RouterView`\n- 인증 문 → `meta` + `beforeEach`\n- 공유 상태 → setup 스토어 `return { ... }`\n\n---\n\n## 연습\n\n1. `/about` 라우트를 lazy 컴포넌트로 추가하고 홈에서 `RouterLink`로 이동한다.\n2. `requiresAuth` 메타를 홈에도 걸고, 로그아웃 후 홈 진입이 로그인으로 리다이렉트되는지 확인한다.\n3. `useCounterStore`를 만들어 홈과 다른 페이지에서 같은 `count`가 보이는지 확인한다.\n"])</script><script>self.__next_f.push([1,"71:T1067,"])</script><script>self.__next_f.push([1,"# Vue 앱 실무 체크리스트\n\n\u003e 요약: 구조·성능·접근성·보안·배포까지, Vue 앱을 내보내기 전에 항목마다 이유를 붙여 확인하는 실무 체크리스트다.\n\n---\n\n## 1. 구조·품질\n\n- [ ] Vue 3 + `\u003cscript setup\u003e` + TypeScript를 기본선으로 둔다 — Options와 혼용하면 같은 기능이 두 문법으로 갈라진다.\n- [ ] 컴포넌트는 한 책임, props/emits 이름을 계약처럼 적는다 — 자식이 props를 mutate하면 부모 상태가 몰래 바뀐다.\n- [ ] ESLint(및 팀 합의된 Vitest)를 CI에서 돌린다 — 리뷰만으로는 `.value` 누락·잘못된 `key`가 빠진다.\n- [ ] 환경 변수는 `VITE_` 접두사만 클라이언트에 노출한다 — 접두사 없는 시크릿은 빌드에 들어가면 누구나 읽는다.\n- [ ] `src/components`, `pages`, `stores` 경계를 지킨다 — 페이지가 스토어·API를 한 파일에 다 넣으면 재사용이 끊긴다.\n\n---\n\n## 2. 성능\n\n- [ ] 라우트·무거운 모달은 `() =\u003e import(...)`로 나눈다 — 첫 페인트에 관리자 화면 JS가 따라오면 초기 비용이 커진다.\n- [ ] `v-for`에 안정적인 `key`(id)를 둔다 — 인덱스 `key`는 행이 지워질 때 입력·컴포넌트 상태가 다른 행으로 옮는다.\n- [ ] 수천 행 리스트는 가상 스크롤을 검토한다 — DOM 노드가 모두 붙으면 스크롤이 버벅인다.\n- [ ] `{ deep: true }` watch와 불필요한 `reactive` 큰 객체를 줄인다 — 깊은 추적은 매 키 입력마다 비용이 난다.\n- [ ] `computed`로 파생 값을 두고 템플릿에 무거운 함수를 반복 호출하지 않는다 — 렌더마다 필터·정렬이 다시 돈다.\n- [ ] 프로덕션 `vite build` 후 번들 분석으로 큰 의존성을 본다 — 개발 모드 속도는 배포 크기와 무관하다.\n\n---\n\n## 3. UX·접근성\n\n- [ ] 동작은 `button`, 이동은 `a`/`RouterLink`를 쓴다 — `div`+클릭은 키보드·스크린 리더가 버튼을 찾지 못한다.\n- [ ] `:focus-visible` 스타일을 남긴다 — 마우스만 쓰는 개발자가 포커스 링을 지우면 키보드 사용자가 길을 잃는다.\n- [ ] 비동기 화면은 로딩·에러·빈 상태를 나눈다 — 흰 화면은 실패인지 대기인지 구분할 수 없다.\n- [ ] 폼 오류는 필드 옆 문구로 보여 준다 — `alert`만 쓰면 어떤 칸이 틀렸는지 모른다.\n- [ ] 라우트 전환 후 스크롤·포커스 정책을 정한다 — SPA는 기본이 스크롤 유지라 본문이 화면 밖에 남을 수 있다.\n\n---\n\n## 4. 데이터·보안\n\n- [ ] HTTP 타임아웃·4xx/5xx를 UI 메시지로 연결한다 — 미처리 Promise는 버튼이 영원히 로딩으로 남는다.\n- [ ] `v-html`은 살균한 마크업만, 가능하면 슬롯으로 대체한다 — 사용자 문자열이 HTML로 들어가면 XSS가 된다.\n- [ ] 액세스 토큰 저장 위치를 팀과 합의한다 — `localStorage`는 XSS에 읽힌다. 세션은 httpOnly 쿠키가 기본 후보이다.\n- [ ] 쿠키 인증이면 CSRF(사이트 간 요청 위조)와 SameSite를 백엔드와 맞춘다 — 프론트만 SameSite를 바꿀 수 없다.\n- [ ] 공개 API 키·관리자 URL을 프론트 상수로 두지 않는다 — 번들에 들어간 문자열은 숨길 수 없다.\n\n---\n\n## 5. 배포\n\n- [ ] `vite build` 산출물의 `base`가 실제 공개 경로와 같다 — 서브경로 배포인데 `base: '/'`면 JS가 404다.\n- [ ] 서버에 SPA 폴백을 둔다 (`try_files $uri /index.html`) — `/posts/1` 새로고침이 서버 파일로 해석되면 404다.\n- [ ] 프로덕션 소스맵 공개 범위를 정한다 — 전체 소스맵은 원본 TS가 그대로 내려간다.\n- [ ] `console.log`·개발용 플래그가 프로덕션 번들에 남지 않게 한다 — 토큰·개인정보가 로그로 새기 쉽다.\n- [ ] 버전 문자열 또는 헬스 엔드포인트를 필요 시 백엔드와 맞춘다 — “어느 빌드가 나갔는지”를 로그와 대조할 수 있다.\n\n---\n\n## 정리\n\nVue 배포 품질은 API 암기량이 아니다. **위 목록을 통과하는 앱을 반복해 만드는 힘**이다. 항목을 건너뛸 때는 티켓에 이유를 남긴다.\n"])</script><script>self.__next_f.push([1,"72:T15ea,"])</script><script>self.__next_f.push([1,"# WPF와 XAML·MVVM 시작하기\n\n\u003e 요약: XAML로 화면을 그리고, DataContext로 ViewModel을 붙여 화면과 로직을 나눈다.\n\n---\n\n## 1. 언제 WPF인가\n\nWPF(Windows Presentation Foundation)는 .NET으로 Windows 데스크톱 UI를 만드는 프레임워크다. 화면은 XAML(마크업)로 선언하고, 동작은 C#으로 둔다.\n\nWinForms는 코드에서 컨트롤을 직접 만지는 비중이 크다. WPF는 **데이터 바인딩**이 기본이라, 화면과 상태를 분리하기 쉽다. 대상이 Windows이고 .NET을 쓰는 내부 도구·클라이언트라면 WPF가 맞다. 웹·크로스플랫폼은 다른 스택을 고른다.\n\n| 항목 | 역할 |\n|------|------|\n| XAML | 컨트롤 트리와 바인딩을 선언한다 |\n| C# | 계산·명령·서비스 호출 |\n| MVVM | View / ViewModel / Model 세 층 |\n| DataContext | 이 화면이 바라보는 데이터 소스 |\n\n실무 기본선: **.NET 8/9 + WPF + MVVM + CommunityToolkit.Mvvm**.\n\n---\n\n## 2. 핵심 개념\n\nMVVM(Model-View-ViewModel)은 화면 코드와 비즈니스 상태를 나누는 패턴이다.\n\n| 층 | 한 줄 |\n|----|--------|\n| View | `.xaml`. 컨트롤과 `{Binding}`. 가능하면 코드비하인드에 로직을 두지 않는다 |\n| ViewModel | 화면이 보여줄 값과 명령. UI 타입(`Button`, `Window`)을 참조하지 않는다 |\n| Model | 엔티티·DTO. UI를 모른다 |\n| DataContext | View가 바인딩할 객체. 보통 ViewModel 인스턴스 |\n\n코드비하인드(`MainWindow.xaml.cs`)의 `Click` 핸들러에 저장 로직을 넣으면 테스트가 창을 띄워야 한다. 명령은 ViewModel의 `ICommand`로 올린다. 3편에서 다룬다.\n\n---\n\n## 3. 생성\n\n```bash\ndotnet new wpf -n MyApp -f net9.0\ncd MyApp\ndotnet add package CommunityToolkit.Mvvm\ndotnet run\n```\n\n폴더 감각:\n\n```\nApp.xaml\nApp.xaml.cs\nViews/MainWindow.xaml\nViews/MainWindow.xaml.cs\nViewModels/MainViewModel.cs\nModels/\nServices/\n```\n\n템플릿 기본은 `MainWindow`가 프로젝트 루트에 있다. 규모가 생기면 `Views/`로 옮기고 `App.xaml`의 `StartupUri`를 맞춘다.\n\n---\n\n## 4. 동작하는 예: 제목 바인딩\n\n`ViewModels/MainViewModel.cs`:\n\n```csharp\nusing CommunityToolkit.Mvvm.ComponentModel;\n\nnamespace MyApp.ViewModels;\n\npublic partial class MainViewModel : ObservableObject\n{\n    [ObservableProperty]\n    private string title = \"Hello WPF\";\n}\n```\n\n`ObservableObject` + `[ObservableProperty]`는 속성 변경 시 UI에 “이 값이 바뀌었다”고 알리는 코드를 생성한다. 직접 `INotifyPropertyChanged`(속성 변경 알림)를 적어도 된다. 툴킷이 반복을 줄인다.\n\n`Views/MainWindow.xaml`:\n\n```xml\n\u003cWindow x:Class=\"MyApp.Views.MainWindow\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:vm=\"clr-namespace:MyApp.ViewModels\"\n        Title=\"MyApp\" Height=\"240\" Width=\"400\"\u003e\n  \u003cWindow.DataContext\u003e\n    \u003cvm:MainViewModel /\u003e\n  \u003c/Window.DataContext\u003e\n  \u003cStackPanel Margin=\"16\"\u003e\n    \u003cTextBlock Text=\"{Binding Title}\" FontSize=\"20\" /\u003e\n    \u003cTextBox Text=\"{Binding Title, UpdateSourceTrigger=PropertyChanged}\" Margin=\"0,8,0,0\" /\u003e\n  \u003c/StackPanel\u003e\n\u003c/Window\u003e\n```\n\n`TextBox`를 바꾸면 `Title`이 바뀌고 `TextBlock`이 따라간다. DataContext가 ViewModel이므로 `{Binding Title}`은 `MainViewModel.Title`이다.\n\n`Views/MainWindow.xaml.cs`는 생성자 `InitializeComponent()`만 둔다.\n\n```csharp\nusing System.Windows;\n\nnamespace MyApp.Views;\n\npublic partial class MainWindow : Window\n{\n    public MainWindow()\n    {\n        InitializeComponent();\n    }\n}\n```\n\n`App.xaml`:\n\n```xml\n\u003cApplication x:Class=\"MyApp.App\"\n             xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n             xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n             StartupUri=\"Views/MainWindow.xaml\"\u003e\n\u003c/Application\u003e\n```\n\nXAML에서 ViewModel을 `new`하는 방식은 작은 앱에 충분하다. DI 컨테이너로 주입하는 방식은 서비스가 늘 때 검토한다.\n\n---\n\n## 5. 코드비하인드와 경계\n\n허용에 가까운 것: 포커스 이동, 패스워드 박스처럼 바인딩이 약한 컨트롤 접착.\n\n피한다: 파일 저장, 메시지 박스 직접 호출, HTTP. 저장은 ViewModel 명령, 대화상자는 서비스(5편).\n\n리소스·스타일은 창마다 복사하지 않고 `App.xaml` 또는 ResourceDictionary로 뺀다. 4편.\n\n---\n\n## 6. 주의 / 흔한 실수\n\n- **DataContext를 안 넣고 `{Binding Title}`.** 출력은 비고, 출력창에 바인딩 오류가 난다. Visual Studio 출력 창을 본다.\n- **ViewModel에서 `MessageBox.Show`.** View가 테스트에 딸려 온다. 인터페이스로 감싼다.\n- **코드비하인드에서 컨트롤 이름으로 값을 읽기.** `txtName.Text`는 MVVM이 아니다. 바인딩한다.\n- **`partial class` 이름·네임스페이스가 XAML `x:Class`와 다름.** 빌드가 실패한다.\n- **.NET Framework 전용 WPF 템플릿으로 신규 시작.** 신규는 SDK 스타일 + `net8.0-windows` / `net9.0-windows`다.\n\n---\n\n## 정리\n\nWPF 시작은 컨트롤 암기가 아니다. **XAML + DataContext + ViewModel** 경계를 먼저 고정한다.\n\n- 화면 → XAML\n- 이 화면의 데이터 소스 → DataContext = ViewModel\n- 로직 → ViewModel (창 타입 없이)\n\n---\n\n## 연습\n\n1. `dotnet new wpf` 후 위 ViewModel을 붙여 TextBox와 TextBlock이 같은 `Title`을 쓰는지 확인한다.\n2. `Subtitle` 속성을 추가하고 두 번째 `TextBlock`에 바인딩한다.\n3. `StartupUri`를 `Views/MainWindow.xaml`로 옮긴 뒤 앱이 켜지는지 확인한다.\n"])</script><script>self.__next_f.push([1,"73:T19d1,"])</script><script>self.__next_f.push([1,"# 데이터 바인딩과 ObservableCollection\n\n\u003e 요약: INotifyPropertyChanged와 ObservableCollection으로 값·목록 변경을 화면에 반영하고, DataTemplate로 행 UI를 분리하는 방법을 정리한다.\n\n---\n\n## 1. 왜 바인딩인가\n\nWPF 컨트롤에 `textBlock.Text = name`을 매번 대입하면 View와 상태가 섞인다. 바인딩은 **소스 속성 ↔ 컨트롤 속성**을 XAML이 연결한다. 소스가 “바뀌었다”고 알려야 화면이 따라간다.\n\n언제 무엇을 쓰는가.\n\n| 상황 | 선택 |\n|------|------|\n| 이름·체크처럼 필드 하나 | `INotifyPropertyChanged` 속성 |\n| 추가·삭제가 있는 목록 | `ObservableCollection\u003cT\u003e` |\n| 행의 모양 | `DataTemplate` |\n| 표시 형식만 다름 (bool → 색) | `IValueConverter` |\n\n`List\u003cT\u003e`에 `Add`해도 UI는 모른다. 컬렉션 변경 알림이 있는 `ObservableCollection\u003cT\u003e`를 쓴다.\n\n---\n\n## 2. 핵심 구성\n\n| 구성 | 한 줄 |\n|------|--------|\n| DataContext | 이 화면이 바라보는 데이터 소스. 바인딩의 루트 |\n| Path | `User.Name`처럼 속성 경로 |\n| Mode | `OneWay` 표시만, `TwoWay` 입력도 소스로 |\n| UpdateSourceTrigger | `LostFocus` 기본. 타이핑마다면 `PropertyChanged` |\n| `INotifyPropertyChanged` | 속성 setter에서 UI에 변경을 알린다 |\n| `ObservableCollection\u003cT\u003e` | 항목 추가·삭제·이동을 UI에 알린다 |\n\n`TextBox.Text`의 기본 Mode는 TwoWay다. `TextBlock.Text`는 OneWay다.\n\n---\n\n## 3. 동작하는 예: 사용자 목록\n\n`ViewModels/UserItem.cs`:\n\n```csharp\nusing CommunityToolkit.Mvvm.ComponentModel;\n\nnamespace MyApp.ViewModels;\n\npublic partial class UserItem : ObservableObject\n{\n    [ObservableProperty]\n    private string name = \"\";\n\n    [ObservableProperty]\n    private bool isActive = true;\n}\n```\n\n항목 안의 `Name`이 바뀌려면 항목 자체도 알림 객체여야 한다. `record` 문자열만 바꿔서는 행 텍스트가 안 바뀐다.\n\n`ViewModels/MainViewModel.cs`:\n\n```csharp\nusing System.Collections.ObjectModel;\nusing CommunityToolkit.Mvvm.ComponentModel;\nusing CommunityToolkit.Mvvm.Input;\n\nnamespace MyApp.ViewModels;\n\npublic partial class MainViewModel : ObservableObject\n{\n    public ObservableCollection\u003cUserItem\u003e Users { get; } = new();\n\n    [ObservableProperty]\n    private UserItem? selectedUser;\n\n    [ObservableProperty]\n    private string draftName = \"\";\n\n    public MainViewModel()\n    {\n        Users.Add(new UserItem { Name = \"김하늘\", IsActive = true });\n        Users.Add(new UserItem { Name = \"이준\", IsActive = false });\n    }\n\n    [RelayCommand]\n    private void AddUser()\n    {\n        var name = DraftName.Trim();\n        if (name.Length == 0) return;\n        Users.Add(new UserItem { Name = name });\n        DraftName = \"\";\n    }\n\n    [RelayCommand]\n    private void RemoveSelected()\n    {\n        if (SelectedUser is null) return;\n        Users.Remove(SelectedUser);\n        SelectedUser = null;\n    }\n}\n```\n\n`[ObservableProperty]` private 필드 `draftName`은 생성 코드에서 `DraftName` 속성이 된다. XAML과 명령은 `DraftName`을 쓴다.\n\n`Views/MainWindow.xaml` 본문:\n\n```xml\n\u003cDockPanel Margin=\"16\"\u003e\n  \u003cStackPanel DockPanel.Dock=\"Top\" Orientation=\"Horizontal\"\u003e\n    \u003cTextBox Width=\"180\"\n             Text=\"{Binding DraftName, UpdateSourceTrigger=PropertyChanged}\" /\u003e\n    \u003cButton Content=\"추가\" Command=\"{Binding AddUserCommand}\" Margin=\"8,0,0,0\" /\u003e\n    \u003cButton Content=\"선택 삭제\" Command=\"{Binding RemoveSelectedCommand}\" /\u003e\n  \u003c/StackPanel\u003e\n  \u003cListBox ItemsSource=\"{Binding Users}\"\n           SelectedItem=\"{Binding SelectedUser}\"\u003e\n    \u003cListBox.ItemTemplate\u003e\n      \u003cDataTemplate\u003e\n        \u003cStackPanel Orientation=\"Horizontal\"\u003e\n          \u003cCheckBox IsChecked=\"{Binding IsActive}\" VerticalAlignment=\"Center\" /\u003e\n          \u003cTextBlock Text=\"{Binding Name}\" Margin=\"8,0,0,0\" /\u003e\n        \u003c/StackPanel\u003e\n      \u003c/DataTemplate\u003e\n    \u003c/ListBox.ItemTemplate\u003e\n  \u003c/ListBox\u003e\n\u003c/DockPanel\u003e\n```\n\n- `ItemsSource` — 목록 소스\n- `ItemTemplate` — 한 행이 바라보는 DataContext는 `UserItem`\n- `SelectedItem` — 현재 선택. TwoWay로 ViewModel과 맞춘다\n- `AddUserCommand` — `[RelayCommand] AddUser`가 생성하는 명령 이름\n\n툴킷 없이 알림을 직접 쓰려면:\n\n```csharp\npublic event PropertyChangedEventHandler? PropertyChanged;\n\nprivate void OnPropertyChanged([CallerMemberName] string? name = null)\n    =\u003e PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(name));\n```\n\nsetter에서 `_name = value` 뒤에 `OnPropertyChanged()`를 호출한다. 알림이 없으면 바인딩 소스는 바뀌었는데 화면은 옛 값이다.\n\n---\n\n## 4. 변환과 모드\n\n```xml\n\u003cTextBlock Text=\"{Binding Price, StringFormat={}{0:N0}원}\" /\u003e\n```\n\n형식만이면 `StringFormat`으로 충분하다. bool → Visibility는 내장 `BooleanToVisibilityConverter` 또는 작은 `IValueConverter`다. ViewModel에 UI 타입(`Visibility`, `Brush`)을 넣지 않는 편이 테스트가 쉽다.\n\n백그라운드 스레드에서 컬렉션을 바꾸면 예외가 난다. UI 스레드(`Dispatcher.Invoke`) 또는 `BindingOperations.EnableCollectionSynchronization`을 검토한다. 기본은 UI 스레드에서만 `Add`/`Remove`한다.\n\n---\n\n## 5. 주의 / 흔한 실수\n\n- **속성 알림 없이 `Name = x`.** 화면이 안 바뀐다. 툴킷 또는 `OnPropertyChanged`.\n- **`List\u003cT\u003e`를 `ItemsSource`에 넣고 나중에 `Add`.** 초기 표시만 되고 추가분이 안 붙는다.\n- **컬렉션 프로퍼티를 get-only가 아닌 채 재할당.** `Users = new ObservableCollection\u003c...\u003e()`는 새 객체라, 바인딩이 옛 컬렉션을 볼 수 있다. `Clear` 후 `Add`하거나 알림이 있는 setter로 교체한다.\n- **행 모델이 `string`뿐인데 행 내용을 바꾸고 기대.** 문자열은 알림이 없다. `UserItem`처럼 객체를 둔다.\n- **`UpdateSourceTrigger` 기본값으로 타이핑마다 검증.** `TextBox`는 포커스를 잃어야 소스가 갱신된다. 즉시면 `PropertyChanged`를 명시한다.\n\n---\n\n## 정리\n\nWPF 생산성은 컨트롤 종류가 아니라 **변경 통지 + 컬렉션 + 템플릿**이다.\n\n- 필드 → `INotifyPropertyChanged` / `[ObservableProperty]`\n- 목록 → `ObservableCollection\u003cT\u003e`\n- 행 UI → `DataTemplate` (행의 DataContext = 항목)\n\n---\n\n## 연습\n\n1. 추가 버튼으로 이름이 목록에 붙는지, 선택 삭제로 빠지는지 확인한다.\n2. 행의 `CheckBox`를 토글해 `IsActive`가 유지되는지 확인한다.\n3. `Users`를 `List\u003cUserItem\u003e`으로 바꿔 `Add`한 뒤 화면이 안 바뀌는 것을 보고 다시 `ObservableCollection`으로 되돌린다.\n"])</script><script>self.__next_f.push([1,"74:T168d,"])</script><script>self.__next_f.push([1,"# 이벤트 대신 ICommand로 액션 연결하기\n\n\u003e 요약: 버튼 클릭을 코드비하인드가 아니라 ViewModel의 ICommand로 연결하고, CanExecute로 활성 상태를 맞추는 방법을 정리한다.\n\n---\n\n## 1. 왜 Command인가\n\n`Button.Click`을 `.xaml.cs`에 두면 저장·검증이 View에 붙는다. 창을 띄우지 않고 로직을 시험하기 어렵다.\n\n`ICommand`는 **버튼이 실행할 일을 ViewModel에 맡기는 계약**이다. XAML은 `Command=\"{Binding SaveCommand}\"`만 안다. 실행 가능 여부는 `CanExecute`가 버튼 `IsEnabled`와 연결된다.\n\n언제 이벤트가 남나: 마우스 좌표, 드래그, 패스워드 박스처럼 바인딩이 약한 접착. 저장·검색·삭제 같은 도메인 동작은 명령이다.\n\n---\n\n## 2. 핵심 개념\n\n| 구성 | 한 줄 |\n|------|--------|\n| `ICommand.Execute` | 클릭 시 할 일 |\n| `ICommand.CanExecute` | 지금 실행 가능한지. false면 버튼 비활성 |\n| `CanExecuteChanged` | 가능 여부가 바뀌었다고 UI에 알린다 |\n| `CommandParameter` | 목록 행 등 추가 인자를 명령에 넘긴다 |\n| `[RelayCommand]` | CommunityToolkit.Mvvm이 위 구현을 생성한다 |\n\n`ICommand`는 WPF 네임스페이스 `System.Windows.Input`에 있다. ViewModel 프로젝트가 WPF를 참조하기 싫으면 툴킷의 `IRelayCommand`를 쓴다. 단일 프로젝트면 `ICommand`로 충분하다.\n\n---\n\n## 3. 동작하는 예: 저장 명령\n\n`ViewModels/MainViewModel.cs`:\n\n```csharp\nusing CommunityToolkit.Mvvm.ComponentModel;\nusing CommunityToolkit.Mvvm.Input;\n\nnamespace MyApp.ViewModels;\n\npublic partial class MainViewModel : ObservableObject\n{\n    [ObservableProperty]\n    [NotifyCanExecuteChangedFor(nameof(SaveCommand))]\n    private string title = \"\";\n\n    [ObservableProperty]\n    private string status = \"대기\";\n\n    [RelayCommand(CanExecute = nameof(CanSave))]\n    private void Save()\n    {\n        Status = $\"저장됨: {Title.Trim()}\";\n    }\n\n    private bool CanSave() =\u003e Title.Trim().Length \u003e 0;\n\n    [RelayCommand]\n    private void Clear()\n    {\n        Title = \"\";\n        Status = \"대기\";\n    }\n}\n```\n\n- `[RelayCommand]` on `Save` → `SaveCommand` 속성 생성\n- `CanExecute = nameof(CanSave)` → 비어 있으면 저장 버튼 비활성\n- `[NotifyCanExecuteChangedFor(nameof(SaveCommand))]` → `Title`이 바뀔 때 `CanExecute`를 다시 묻는다\n\nXAML:\n\n```xml\n\u003cStackPanel Margin=\"16\"\u003e\n  \u003cTextBox Text=\"{Binding Title, UpdateSourceTrigger=PropertyChanged}\" /\u003e\n  \u003cButton Content=\"저장\" Command=\"{Binding SaveCommand}\" Margin=\"0,8,0,0\" /\u003e\n  \u003cButton Content=\"지우기\" Command=\"{Binding ClearCommand}\" /\u003e\n  \u003cTextBlock Text=\"{Binding Status}\" Margin=\"0,8,0,0\" /\u003e\n\u003c/StackPanel\u003e\n```\n\n비동기:\n\n```csharp\n[RelayCommand]\nprivate async Task SaveAsync(CancellationToken cancellationToken)\n{\n    Status = \"저장 중\";\n    await Task.Delay(400, cancellationToken);\n    Status = \"저장됨\";\n}\n```\n\n생성 이름은 `SaveCommand`다 (`SaveAsyncCommand`가 아니다). UI 스레드를 막지 않으려면 `async` 명령을 쓴다. `Task.Delay` 자리는 실제 I/O다.\n\n---\n\n## 4. 파라미터와 목록\n\n행 삭제:\n\n```xml\n\u003cButton Content=\"삭제\"\n        Command=\"{Binding DataContext.RemoveCommand, RelativeSource={RelativeSource AncestorType=ListBox}}\"\n        CommandParameter=\"{Binding}\" /\u003e\n```\n\nViewModel:\n\n```csharp\n[RelayCommand]\nprivate void Remove(UserItem item) =\u003e Users.Remove(item);\n```\n\n`CommandParameter=\"{Binding}\"`은 그 행의 `UserItem`이다. 행 템플릿의 DataContext가 항목이라, 부모 ViewModel 명령은 `RelativeSource`로 올라간다.\n\n코드비하인드 최소 연결이 필요하면 `EventToCommand`(툴킷 Behaviors)를 검토한다. 신규는 가능하면 `Command` 속성만 쓴다.\n\n툴킷 없이 직접 구현하는 최소형:\n\n```csharp\npublic sealed class RelayCommand : ICommand\n{\n    private readonly Action _execute;\n    private readonly Func\u003cbool\u003e? _canExecute;\n\n    public RelayCommand(Action execute, Func\u003cbool\u003e? canExecute = null)\n    {\n        _execute = execute;\n        _canExecute = canExecute;\n    }\n\n    public bool CanExecute(object? parameter) =\u003e _canExecute?.Invoke() ?? true;\n    public void Execute(object? parameter) =\u003e _execute();\n    public event EventHandler? CanExecuteChanged;\n\n    public void RaiseCanExecuteChanged() =\u003e\n        CanExecuteChanged?.Invoke(this, EventArgs.Empty);\n}\n```\n\n직접 구현이면 `Title` setter에서 `SaveCommand.RaiseCanExecuteChanged()`를 호출해야 버튼이 살아난다. 빼먹기 쉽다. 그래서 툴킷을 기본선으로 둔다.\n\n---\n\n## 5. 주의 / 흔한 실수\n\n- **`Click`과 `Command`를 동시에.** 두 번 실행되거나 한쪽이 무시된다. 하나만 둔다.\n- **`CanExecute`를 바꿨는데 `CanExecuteChanged`를 안 올림.** 버튼이 영원히 비활성이다. `[NotifyCanExecuteChangedFor]` 또는 `NotifyCanExecuteChanged()`.\n- **`async void` 이벤트 핸들러에 저장.** 예외가 삼켜진다. `[RelayCommand] Task`를 쓴다.\n- **명령에서 `MessageBox`.** View 의존. 5편 대화상자 서비스.\n- **`RelayCommand`를 프로퍼티 get마다 `new`.** 바인딩이 매번 새 객체다. 필드에 한 번 만들거나 툴킷 생성 명령을 쓴다.\n\n---\n\n## 정리\n\nWPF 액션의 기본은 이벤트 남발이 아니라 **테스트 가능한 Command**다.\n\n- 클릭 → `{Binding XxxCommand}`\n- 활성 → `CanExecute` + 속성 변경 시 재평가\n- 행 인자 → `CommandParameter`\n\n---\n\n## 연습\n\n1. `Title`이 비어 있으면 저장 버튼이 비활성인지, 한 글자 입력 후 활성화되는지 확인한다.\n2. `ClearCommand`로 제목과 상태가 초기화되는지 확인한다.\n3. `Save`를 `async Task`로 바꾸고 저장 중 `Status`가 `저장 중`으로 보이는지 확인한다.\n"])</script><script>self.__next_f.push([1,"75:T1801,"])</script><script>self.__next_f.push([1,"# 스타일·리소스·테마 관리\n\n\u003e 요약: ResourceDictionary에 색과 스타일을 모아 StaticResource/DynamicResource로 참조하고, 파일 분리로 테마를 운영하는 방법을 정리한다.\n\n---\n\n## 1. 왜 리소스인가\n\n창마다 `Background=\"#0B6E4F\"`를 복사하면 브랜드 색을 바꿀 때 누락이 생긴다. WPF는 **키로 찾는 리소스 사전**에 브러시·스타일·템플릿을 둔다. 화면은 키만 참조한다.\n\n언제 사전을 나누는가.\n\n| 상황 | 위치 |\n|------|------|\n| 이 버튼만 | 컨트롤 `Resources` |\n| 이 창만 | `Window.Resources` |\n| 앱 전역 색·기본 버튼 | `App.xaml` 또는 병합 사전 |\n| 라이트/다크 전환 | 테마별 `ResourceDictionary` + `DynamicResource` |\n\n---\n\n## 2. 핵심 개념\n\n| 개념 | 한 줄 |\n|------|--------|\n| `x:Key` | 사전에서 리소스를 찾는 이름 |\n| `StaticResource` | 로드 시 한 번 해석. 일반 색·스타일 |\n| `DynamicResource` | 런타임에 키가 바뀌면 다시 적용. 테마 전환 |\n| `Style` | 같은 타입에 Setter로 속성을 묶는다 |\n| `TargetType` | 키 없이 그 타입 전체에 암시 스타일 |\n| `MergedDictionaries` | 여러 `.xaml` 사전을 한곳으로 합친다 |\n\n`StaticResource`가 더 싸다. 실행 중 색을 갈아끼울 때만 `DynamicResource`를 쓴다. 없는 키는 로드 시 예외(`Static`) 또는 빈 값(`Dynamic`)으로 나타난다.\n\n---\n\n## 3. 동작하는 예: 색과 버튼 스타일\n\n`Resources/Colors.xaml`:\n\n```xml\n\u003cResourceDictionary xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n                    xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\u003e\n  \u003cColor x:Key=\"PrimaryColor\"\u003e#0B6E4F\u003c/Color\u003e\n  \u003cSolidColorBrush x:Key=\"PrimaryBrush\" Color=\"{StaticResource PrimaryColor}\" /\u003e\n  \u003cSolidColorBrush x:Key=\"SurfaceBrush\" Color=\"#F4F7F6\" /\u003e\n  \u003cSolidColorBrush x:Key=\"TextBrush\" Color=\"#1A1A1A\" /\u003e\n\u003c/ResourceDictionary\u003e\n```\n\n`Resources/Controls.xaml`:\n\n```xml\n\u003cResourceDictionary xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n                    xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\u003e\n  \u003cStyle TargetType=\"Button\"\u003e\n    \u003cSetter Property=\"Padding\" Value=\"12,6\" /\u003e\n    \u003cSetter Property=\"Margin\" Value=\"4,0,0,0\" /\u003e\n    \u003cSetter Property=\"Background\" Value=\"{StaticResource PrimaryBrush}\" /\u003e\n    \u003cSetter Property=\"Foreground\" Value=\"White\" /\u003e\n    \u003cSetter Property=\"BorderThickness\" Value=\"0\" /\u003e\n  \u003c/Style\u003e\n  \u003cStyle x:Key=\"GhostButton\" TargetType=\"Button\" BasedOn=\"{StaticResource {x:Type Button}}\"\u003e\n    \u003cSetter Property=\"Background\" Value=\"Transparent\" /\u003e\n    \u003cSetter Property=\"Foreground\" Value=\"{StaticResource PrimaryBrush}\" /\u003e\n  \u003c/Style\u003e\n\u003c/ResourceDictionary\u003e\n```\n\n`BasedOn`으로 기본 버튼에서 일부만 덮는다. `GhostButton`은 키가 있으므로 명시적으로 적용한다.\n\n`App.xaml`:\n\n```xml\n\u003cApplication x:Class=\"MyApp.App\"\n             xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n             xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n             StartupUri=\"Views/MainWindow.xaml\"\u003e\n  \u003cApplication.Resources\u003e\n    \u003cResourceDictionary\u003e\n      \u003cResourceDictionary.MergedDictionaries\u003e\n        \u003cResourceDictionary Source=\"Resources/Colors.xaml\" /\u003e\n        \u003cResourceDictionary Source=\"Resources/Controls.xaml\" /\u003e\n      \u003c/ResourceDictionary.MergedDictionaries\u003e\n    \u003c/ResourceDictionary\u003e\n  \u003c/Application.Resources\u003e\n\u003c/Application\u003e\n```\n\n병합 순서가 중요하다. `Controls.xaml`이 `PrimaryBrush`를 쓰므로 **색 사전을 먼저** 넣는다.\n\n창에서:\n\n```xml\n\u003cGrid Background=\"{StaticResource SurfaceBrush}\"\u003e\n  \u003cStackPanel Margin=\"16\"\u003e\n    \u003cTextBlock Text=\"제목\" Foreground=\"{StaticResource TextBrush}\" /\u003e\n    \u003cButton Content=\"저장\" /\u003e\n    \u003cButton Content=\"취소\" Style=\"{StaticResource GhostButton}\" /\u003e\n  \u003c/StackPanel\u003e\n\u003c/Grid\u003e\n```\n\n첫 `Button`은 `TargetType=\"Button\"` 암시 스타일이 적용된다. 둘째는 `GhostButton` 키를 지정한다.\n\n---\n\n## 4. 테마 전환\n\n다크 사전 `Resources/Colors.Dark.xaml`에 같은 **키 이름**으로 다른 `Color`를 둔다. 런타임에 `MergedDictionaries`의 해당 항목을 교체한다.\n\n```csharp\nvar appDict = Application.Current.Resources.MergedDictionaries;\nvar old = appDict.First(d =\u003e d.Source?.OriginalString.Contains(\"Colors\") == true);\nappDict.Remove(old);\nappDict.Insert(0, new ResourceDictionary\n{\n    Source = new Uri(\"Resources/Colors.Dark.xaml\", UriKind.Relative),\n});\n```\n\n브러시 참조는 `DynamicResource`여야 교체가 화면에 반영된다.\n\n```xml\n\u003cTextBlock Foreground=\"{DynamicResource TextBrush}\" /\u003e\n```\n\n키 이름을 테마마다 다르게 만들면 화면 XAML을 다 고쳐야 한다. **같은 키, 다른 값**이 테마의 규칙이다.\n\n---\n\n## 5. 주의 / 흔한 실수\n\n- **병합 순서 반대로.** 스타일이 색보다 먼저면 `StaticResource PrimaryBrush`를 못 찾는다.\n- **암시 스타일(`TargetType`만)을 서드파티 컨트롤에 광역 적용.** 라이브러리 버튼까지 브랜드 색이 덮인다. 앱 컨트롤만 키 스타일로 제한하는 편이 안전하다.\n- **테마는 `StaticResource`로 색을 고정.** 사전을 갈아도 이미 해석된 값이 남는다. 전환 대상은 `DynamicResource`.\n- **`Style` 안에서 같은 사전의 키를 `DynamicResource`로 순환 참조.** 로드가 실패한다.\n- **창 `Resources`에 앱과 같은 키를 다시 정의.** 가까운 사전이 이긴다. 의도가 아니면 중복 키를 만들지 않는다.\n\n---\n\n## 정리\n\nWPF UI 일관성은 창을 하나씩 고치는 일이 아니라 **리소스 사전을 시스템으로 두는 일**이다.\n\n- 색·간격 → `Colors.xaml` 키\n- 컨트롤 기본 모습 → `Style` + `MergedDictionaries`\n- 테마 → 같은 키 + `DynamicResource` + 사전 교체\n\n---\n\n## 연습\n\n1. `PrimaryBrush` 색을 바꾸고 저장·암시 스타일 버튼이 같이 바뀌는지 확인한다.\n2. `GhostButton`만 테두리를 추가해 기본 버튼과 구분되게 한다.\n3. `Colors.Dark.xaml`을 만들고 `TextBrush`를 밝은 색으로 둔 뒤, 버튼을 눌러 사전을 교체해 본다 (`DynamicResource` 필요).\n"])</script><script>self.__next_f.push([1,"76:T1c3c,"])</script><script>self.__next_f.push([1,"# 화면 전환과 다이얼로그 패턴\n\n\u003e 요약: ContentControl과 DataTemplate로 ViewModel을 갈아 끼워 화면을 전환하고, 대화상자는 서비스로 추상화하는 방법을 정리한다.\n\n---\n\n## 1. 언제 어떤 전환인가\n\nWPF에는 웹 라우터가 없다. 화면 흐름을 초기에 고른다.\n\n| 방식 | 맞는 경우 |\n|------|-----------|\n| Window를 여러 개 | 독립 도구 창, 팝업 편집기 |\n| `Frame` + `Page` | 마법사, 뒤로 가기 스택이 필요할 때 |\n| `UserControl` + `ContentControl` | 단일 메인 셸. 메뉴만 바뀌는 업무 앱 |\n\n작은·중간 앱은 **현재 ViewModel을 바꾸고 ContentControl이 View를 고르는 방식**이 단순하다. ViewModel이 UI 타입을 몰라도 된다.\n\n대화상자(`MessageBox`, 파일 선택)를 ViewModel에서 직접 호출하면 테스트가 실제 창을 연다. **인터페이스 뒤**로 숨긴다.\n\n---\n\n## 2. 핵심 개념\n\n| 개념 | 한 줄 |\n|------|--------|\n| `CurrentViewModel` | 셸이 지금 보여줄 화면 상태 |\n| `ContentControl` | `Content`에 넣은 객체를 화면에 표시한다 |\n| DataTemplate | 그 객체의 타입 → 어떤 View XAML인지 매핑 |\n| `IDialogService` | 확인/알림을 ViewModel이 UI API 없이 요청하는 창구 |\n| `IFileDialogService` | 열기/저장 경로. 마찬가지로 추상화 |\n\n`Frame.Navigate(typeof(Page))`는 View 타입을 코드가 알게 된다. MVVM과 섞이면 책임이 흐려진다. 셸+DataTemplate을 기본선으로 둔다.\n\n---\n\n## 3. 동작하는 예: 셸 전환\n\n`ViewModels/HomeViewModel.cs`:\n\n```csharp\nusing CommunityToolkit.Mvvm.ComponentModel;\n\nnamespace MyApp.ViewModels;\n\npublic partial class HomeViewModel : ObservableObject\n{\n    public string Message { get; } = \"홈\";\n}\n```\n\n`ViewModels/SettingsViewModel.cs`:\n\n```csharp\nusing CommunityToolkit.Mvvm.ComponentModel;\n\nnamespace MyApp.ViewModels;\n\npublic partial class SettingsViewModel : ObservableObject\n{\n    [ObservableProperty]\n    private bool darkTheme;\n}\n```\n\n`ViewModels/MainViewModel.cs`:\n\n```csharp\nusing CommunityToolkit.Mvvm.ComponentModel;\nusing CommunityToolkit.Mvvm.Input;\n\nnamespace MyApp.ViewModels;\n\npublic partial class MainViewModel : ObservableObject\n{\n    [ObservableProperty]\n    private ObservableObject currentViewModel = null!;\n\n    public MainViewModel()\n    {\n        CurrentViewModel = new HomeViewModel();\n    }\n\n    [RelayCommand]\n    private void GoHome() =\u003e CurrentViewModel = new HomeViewModel();\n\n    [RelayCommand]\n    private void GoSettings() =\u003e CurrentViewModel = new SettingsViewModel();\n}\n```\n\n실제 앱은 인스턴스를 캐시할지, 매번 `new`할지 팀에서 정한다. 마법사는 단계마다 새로 만들고, 설정은 유지하는 편이 흔하다.\n\n`Views/HomeView.xaml` (UserControl):\n\n```xml\n\u003cUserControl x:Class=\"MyApp.Views.HomeView\"\n             xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n             xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\u003e\n  \u003cTextBlock Text=\"{Binding Message}\" FontSize=\"20\" Margin=\"16\" /\u003e\n\u003c/UserControl\u003e\n```\n\n`Views/MainWindow.xaml`:\n\n```xml\n\u003cWindow x:Class=\"MyApp.Views.MainWindow\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:vm=\"clr-namespace:MyApp.ViewModels\"\n        xmlns:views=\"clr-namespace:MyApp.Views\"\n        Title=\"MyApp\" Height=\"400\" Width=\"640\"\u003e\n  \u003cWindow.Resources\u003e\n    \u003cDataTemplate DataType=\"{x:Type vm:HomeViewModel}\"\u003e\n      \u003cviews:HomeView /\u003e\n    \u003c/DataTemplate\u003e\n    \u003cDataTemplate DataType=\"{x:Type vm:SettingsViewModel}\"\u003e\n      \u003cviews:SettingsView /\u003e\n    \u003c/DataTemplate\u003e\n  \u003c/Window.Resources\u003e\n  \u003cDockPanel\u003e\n    \u003cStackPanel DockPanel.Dock=\"Top\" Orientation=\"Horizontal\" Margin=\"8\"\u003e\n      \u003cButton Content=\"홈\" Command=\"{Binding GoHomeCommand}\" /\u003e\n      \u003cButton Content=\"설정\" Command=\"{Binding GoSettingsCommand}\" /\u003e\n    \u003c/StackPanel\u003e\n    \u003cContentControl Content=\"{Binding CurrentViewModel}\" /\u003e\n  \u003c/DockPanel\u003e\n\u003c/Window\u003e\n```\n\n`DataType` 템플릿은 `Content` 객체의 CLR 타입으로 View를 고른다. 셸은 `if (vm is Home)` 분기를 하지 않는다.\n\n`SettingsView.xaml`에는 `{Binding DarkTheme}` 체크박스를 두면 된다.\n\n---\n\n## 4. 다이얼로그 서비스\n\n`Services/IDialogService.cs`:\n\n```csharp\nnamespace MyApp.Services;\n\npublic interface IDialogService\n{\n    bool Confirm(string message, string caption = \"확인\");\n    void Inform(string message, string caption = \"알림\");\n}\n```\n\n`Services/WpfDialogService.cs`:\n\n```csharp\nusing System.Windows;\n\nnamespace MyApp.Services;\n\npublic sealed class WpfDialogService : IDialogService\n{\n    public bool Confirm(string message, string caption = \"확인\")\n        =\u003e MessageBox.Show(message, caption, MessageBoxButton.YesNo, MessageBoxImage.Question)\n           == MessageBoxResult.Yes;\n\n    public void Inform(string message, string caption = \"알림\")\n        =\u003e MessageBox.Show(message, caption, MessageBoxButton.OK, MessageBoxImage.Information);\n}\n```\n\nViewModel:\n\n```csharp\npublic sealed class MainViewModel : ObservableObject\n{\n    private readonly IDialogService _dialogs;\n\n    public MainViewModel(IDialogService dialogs)\n    {\n        _dialogs = dialogs;\n    }\n\n    [RelayCommand]\n    private void Delete()\n    {\n        if (!_dialogs.Confirm(\"삭제할까?\")) return;\n        // 삭제 로직\n    }\n}\n```\n\n생성자 주입이면 XAML `new MainViewModel`은 못 쓴다. `App` 또는 창 코드에서:\n\n```csharp\npublic MainWindow()\n{\n    InitializeComponent();\n    DataContext = new MainViewModel(new WpfDialogService());\n}\n```\n\n테스트는 `IDialogService`를 `Confirm`이 항상 true인 가짜로 바꾼다.\n\n파일 선택:\n\n```csharp\npublic interface IFileDialogService\n{\n    string? OpenFile(string filter);\n}\n```\n\n`OpenFileDialog`는 이 구현 클래스 안에만 둔다. ViewModel은 경로 문자열만 받는다.\n\n---\n\n## 5. 주의 / 흔한 실수\n\n- **ViewModel에서 `new SettingsView()`.** View 타입이 VM에 들어간다. DataTemplate만 View를 안다.\n- **`MessageBox.Show`를 명령 한가운데.** CI·단위 테스트가 멈춘다.\n- **Frame+Page와 ContentControl을 한 셸에 혼용.** 뒤로 가기 스택이 두 개가 된다. 하나를 고른다.\n- **전환마다 무거운 ViewModel을 무조건 `new`.** 입력 중이던 설정이 날아간다. 유지가 필요하면 필드로 들고 있는다.\n- **커스텀 다이얼로그 Window의 DataContext를 안 넘김.** 바인딩이 비고, 확인 결과를 닫힌 창에서 읽지 못한다. 결과를 서비스 반환값으로 받는다.\n\n---\n\n## 정리\n\n전환 구조는 초기에 정할수록 싸다. **CurrentViewModel + DataTemplate + DialogService**가 실무에서 단순하다.\n\n- 화면 전환 → 셸 ViewModel의 현재 VM 교체\n- View 선택 → `DataTemplate DataType`\n- 알림·파일 → 인터페이스, WPF 구현은 한곳\n\n---\n\n## 연습\n\n1. 홈/설정 버튼으로 `ContentControl` 내용이 바뀌는지 확인한다.\n2. 설정에서 `DarkTheme`를 켠 뒤 홈에 갔다 와도 값이 남게, `SettingsViewModel`을 필드로 재사용한다.\n3. 삭제 명령에 `IDialogService.Confirm`을 넣고, 취소를 누르면 목록이 그대로인지 확인한다.\n"])</script><script>self.__next_f.push([1,"77:T11cd,"])</script><script>self.__next_f.push([1,"# WPF 앱 실무 체크리스트\n\n\u003e 요약: MVVM 경계·성능·예외·배포·UX까지, WPF 앱을 내보내기 전에 항목마다 이유를 붙여 확인하는 실무 체크리스트다.\n\n---\n\n## 1. 아키텍처\n\n- [ ] ViewModel이 `Window`/`MessageBox`/`OpenFileDialog`를 직접 호출하지 않는다 — UI 타입이 섞이면 테스트를 위해 창을 띄워야 한다.\n- [ ] 액션은 `ICommand`/`[RelayCommand]`로 노출한다 — 코드비하인드 `Click`에 저장이 있으면 책임이 뷰에 붙는다.\n- [ ] 대화상자·파일·설정은 서비스 인터페이스로 감싼다 — 구현만 갈아끼우면 CI에서 확인/취소를 시뮬레이션할 수 있다.\n- [ ] `Views` / `ViewModels` / `Services` / `Models` 폴더를 일관되게 쓴다 — 창 코드에 도메인 로직이 쌓이면 찾기 어렵다.\n- [ ] DataContext는 화면당 하나의 ViewModel을 루트로 둔다 — 컨트롤마다 다른 소스를 수동 대입하면 바인딩 오류를 못 본다.\n\n---\n\n## 2. 바인딩·상태\n\n- [ ] 속성 변경에 `INotifyPropertyChanged` 또는 `[ObservableProperty]`가 있다 — 알림이 없으면 소스는 바뀌고 화면은 옛 값이다.\n- [ ] 목록은 `ObservableCollection\u003cT\u003e`다 — `List\u003cT\u003e.Add`는 UI에 추가분을 알리지 않는다.\n- [ ] 목록은 `ItemsSource` + `DataTemplate` + 알림 가능한 항목 객체다 — 행을 `string`만 쓰면 행 내용 변경이 화면에 반영되지 않는다.\n- [ ] 백그라운드 스레드에서 컬렉션을 바꾸지 않는다 — UI 스레드가 아니면 `NotSupportedException`이 난다.\n- [ ] 변환기·ViewModel에 `Visibility`/`Brush`를 남발하지 않는다 — UI 타입이 VM에 들어가면 재사용·테스트가 웹과 무관해진다.\n\n---\n\n## 3. 성능\n\n- [ ] 큰 `ListBox`/`DataGrid`에서 가상화가 켜져 있는지 확인한다 — 가상화가 꺼지면 행 DOM(비주얼)이 모두 생긴다.\n- [ ] 무거운 `IValueConverter`와 과도한 `OneWayToSource` 루프를 점검한다 — 변환이 렌더마다 파일을 읽으면 입력이 버벅인다.\n- [ ] 이미지·아이콘 해상도를 창 크기에 맞게 줄인다 — 4K PNG를 툴바에 넣으면 메모리만 커진다.\n- [ ] 디스크·HTTP는 `async` 명령으로 두고 UI 스레드를 막지 않는다 — `Thread.Sleep`/`GetAwaiter().GetResult()`는 창이 하얗게 언다.\n- [ ] `Binding` 오류를 출력 창에서 없앤다 — 잘못된 Path는 예외 없이 빈 화면만 남긴다.\n\n---\n\n## 4. 안정성\n\n- [ ] `App` 도메인 예외(`DispatcherUnhandledException` 등)를 로그로 남긴다 — 처리 안 된 예외는 프로세스만 죽고 원인은 사용자 PC에 없다.\n- [ ] 저장·로드 실패를 대화상자 서비스로 알린다 — 실패를 `catch`만 하면 사용자는 성공으로 안다.\n- [ ] 설정 파일에 버전을 두고 마이그레이션한다 — 필드가 빠지면 구버전 JSON이 역직렬화에 실패한다.\n- [ ] 종료 시 미저장 변경을 `Confirm`으로 묻는다 — OS 종료와 창 닫기를 같은 경로로 태운다.\n\n---\n\n## 5. 배포\n\n- [ ] 대상 TFM이 `net8.0-windows` / `net9.0-windows` 등 실제 설치 환경과 같다 — 프레임워크 의존 배포인데 런타임이 없으면 앱이 안 뜬다.\n- [ ] self-contained vs framework-dependent를 명시한다 — 용량과 오프라인 설치 요구가 갈린다.\n- [ ] MSIX 또는 설치 프로그램에 코드 서명을 검토한다 — 미서명 exe는 SmartScreen에 막힌다.\n- [ ] 환경별 설정(로그 경로, API 주소)을 빌드 구성으로 나눈다 — 개발 URL이 고객 PC로 나가면 장애다.\n- [ ] 자동 업데이트 정책(없음/사이드카/스토어)을 문서화한다 — 구버전 클라이언트가 API와 어긋나기 쉽다.\n\n---\n\n## 6. UX\n\n- [ ] Tab 순서가 읽기 순서와 같다 — `TabIndex`가 제각각이면 키보드만으로 저장에 못 간다.\n- [ ] `MinWidth`/`MinHeight`와 DPI 스케일을 실제 모니터에서 본다 — 125%에서 버튼이 잘리면 현장 PC와 다르다.\n- [ ] 기본 버튼(`IsDefault`)과 취소(`IsCancel`)를 폼에 둔다 — Enter/Esc가 아무 동작도 안 하면 데스크톱 습관과 어긋난다.\n- [ ] 고대비·다크 테마를 쓸 거면 브러시를 리소스 키로만 참조한다 — 하드코드 `#FFFFFF`는 다크에서 글자가 사라진다.\n\n---\n\n## 정리\n\nWPF 품질은 컨트롤 개수가 아니라 **MVVM 규율과 배포 체크리스트를 끝까지 지키는 일**이다. 항목을 건너뛸 때는 티켓에 이유를 남긴다.\n"])</script><script>self.__next_f.push([1,"11:[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"WebSite\\\",\\\"name\\\":\\\"Kaisa\\\",\\\"description\\\":\\\"Development, design, and notes from Kaisa — articles on building products and tools.\\\",\\\"url\\\":\\\"https://kaisa.co.kr/\\\"}\"}}],[\"$\",\"$L18\",null,{\"posts\":[{\"slug\":\"angular-01\",\"title\":\"Angular 스탠드얼론으로 프로젝트 시작하기\",\"excerpt\":\"NgModule 없이 standalone 컴포넌트와 app.config로 Angular 앱을 띄우고, 폴더·부트스트랩 기본선을 정리한다.\",\"content\":\"$19\",\"publishedAt\":\"2023-07-14\",\"category\":\"angular\",\"categoryLabel\":\"Angular\",\"tags\":[\"angular\"],\"readingMinutes\":5,\"order\":1,\"filePath\":\"angular/01-angular-standalone-start.md\"},{\"slug\":\"angular-02\",\"title\":\"컴포넌트·템플릿·데이터 바인딩\",\"excerpt\":\"템플릿에 값을 넣고 클릭을 받으며, @if/@for와 input/output으로 화면과 클래스를 연결한다.\",\"content\":\"$1a\",\"publishedAt\":\"2024-01-17\",\"category\":\"angular\",\"categoryLabel\":\"Angular\",\"tags\":[\"angular\"],\"readingMinutes\":5,\"order\":2,\"filePath\":\"angular/02-components-templates-binding.md\"},{\"slug\":\"angular-03\",\"title\":\"시그널·서비스·의존성 주입\",\"excerpt\":\"signal로 화면 상태를 두고, providedIn 서비스와 inject로 공유 로직을 연결하는 Angular 상태·DI 패턴을 정리한다.\",\"content\":\"$1b\",\"publishedAt\":\"2024-06-13\",\"category\":\"angular\",\"categoryLabel\":\"Angular\",\"tags\":[\"angular\"],\"readingMinutes\":6,\"order\":3,\"filePath\":\"angular/03-signals-services-di.md\"},{\"slug\":\"angular-04\",\"title\":\"라우팅과 리액티브 폼\",\"excerpt\":\"provideRouter와 lazy loadComponent로 화면을 나누고, 가드·FormBuilder로 진입 조건과 입력 검증을 구성하는 방법을 정리한다.\",\"content\":\"$1c\",\"publishedAt\":\"2024-10-07\",\"category\":\"angular\",\"categoryLabel\":\"Angular\",\"tags\":[\"angular\"],\"readingMinutes\":6,\"order\":4,\"filePath\":\"angular/04-routing-forms.md\"},{\"slug\":\"angular-05\",\"title\":\"Angular 앱 실무 체크리스트\",\"excerpt\":\"standalone 구조·성능·보안·테스트·배포까지, Angular 앱을 내보내기 전에 항목마다 이유를 붙여 확인하는 실무 체크리스트다.\",\"content\":\"$1d\",\"publishedAt\":\"2025-05-19\",\"category\":\"angular\",\"categoryLabel\":\"Angular\",\"tags\":[\"angular\"],\"readingMinutes\":3,\"order\":5,\"filePath\":\"angular/05-angular-app-checklist.md\"},{\"slug\":\"aws-01\",\"title\":\"AWS 계정·IAM·빌링 기초 잡기\",\"excerpt\":\"루트 계정은 잠그고 IAM과 비용 알람부터 켜는, AWS를 안전하게 시작하기 위한 최소 세팅을 정리한다.\",\"content\":\"$1e\",\"publishedAt\":\"2023-05-08\",\"category\":\"aws\",\"categoryLabel\":\"AWS\",\"tags\":[\"aws\"],\"readingMinutes\":5,\"order\":1,\"
