onst token = jar.get('session')?.value;\n  if (!token) return null;\n  // 서명 검증·만료 확인. 실패하면 null\n  return verifySessionToken(token);\n}\n\nasync function verifySessionToken(token: string): Promise\u003cSession | null\u003e {\n  void token;\n  return null;\n}\n```\n\nNext.js 15에서 `cookies()`는 Promise다. `await`한다.\n\n```tsx\n// app/manager/layout.tsx\nimport type {ReactNode} from 'react';\nimport {redirect} from 'next/navigation';\nimport {getSession} from '@/lib/auth';\n\nexport default async function ManagerLayout({children}: {children: ReactNode}) {\n  const session = await getSession();\n  if (!session) redirect('/login/');\n  if (session.role !== 'admin') redirect('/');\n  return \u003cdiv\u003e{children}\u003c/div\u003e;\n}\n```\n\n미들웨어(prefix 차단) + 레이아웃(정확한 권한)이 한 쌍이다. 하나만 있으면 구멍 난다.\n\n관리자 API도 같은 `getSession`을 탄다. UI만 숨기고 API가 열려 있으면 의미가 없다.\n\n```ts\n// app/api/manager/stats/route.ts\nimport {NextResponse} from 'next/server';\nimport {getSession} from '@/lib/auth';\n\nexport async function GET() {\n  const session = await getSession();\n  if (!session || session.role !== 'admin') {\n    return NextResponse.json({error: 'forbidden'}, {status: 403});\n  }\n  return NextResponse.json({ok: true});\n}\n```\n\n### 정적 내보내기와의 관계\n\n`output: 'export'`면 미들웨어·서버 세션이 제한되거나 없다.\n\n그때의 선택:\n\n- 관리자만 서버가 있는 호스팅으로 분리\n- 공개 글은 정적 HTML, 이슈·관리자는 별도 API + Client 가드\n\nClient 가드만 있으면 소스에 화면이 남아 있다. API가 401/403을 내야 데이터가 막힌다. UI 숨김은 편의일 뿐 보안이 아니다.\n\n로그인·회원가입 페이지는 `robots: {index: false}`로 색인에서 뺀다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| 미들웨어에서만 막고 API는 열어둠 | 직접 호출로 우회 | Handler·Action에서 세션 재검증 |\n| 미들웨어에서 DB 조회 | 지연·엣지 제약 | 쿠키 존재만, 검증은 서버 |\n| `localStorage` 토큰 + 공개 API | XSS 시 계정 탈취 | HttpOnly 쿠키 또는 짧은 수명 |\n| matcher를 너무 넓게 | 정적 자산까지 통과 | `/manager/:path*`처럼 제한 |\n| export인데 서버 세션을 가정 | 빌드 실패 또는 빈 보호 | 호스팅을 나누거나 API 가드 |\n| 로그아웃 후 캐시된 관리자 HTML | 뒤로 가기로 내용이 보임 | 쿠키 삭제 + Cache-Control |\n\n---\n\n## 정리\n\n미들웨어는 문을 닫는 역할이다. 열쇠가 맞는지(서명·역할)는 서버 컴포넌트와 API가 본다.\n\n공개 페이지는 정적 HTML, 관리자는 서버 또는 별도 API. 이 경계를 호스팅 선택과 같이 적는다.\n\n---\n\n## 연습\n\n1. Node 호스팅에서 `/manager/*` 미들웨어 리다이렉트를 만들고, 세션 쿠키가 없으면 `/login/`으로 보낸다.\n2. `app/manager/layout.tsx`에서 `getSession()`이 없으면 `redirect`한다. 일반 사용자 role도 막는다.\n3. 정적 내보내기 배포라면 Client 가드와 API 401 처리 순서를 문서 한 줄로 적는다.\n"])</script><script>self.__next_f.push([1,"50:T188c,"])</script><script>self.__next_f.push([1,"# 이미지·폰트·성능 최적화\n\n\u003e 요약: next/image와 next/font로 이미지·폰트를 다루고, 번들과 로딩 UI로 체감 속도를 맞춘다.\n\n---\n\n## 1. 왜 이 주제가 필요한가\n\n느린 사이트는 기능이 같아도 이탈이 많다. 측정 지표는 **Core Web Vitals**다.\n\n- **LCP(Largest Contentful Paint, 가장 큰 콘텐츠가 보이기까지 시간)**\n- **CLS(Cumulative Layout Shift, 레이아웃이 밀리는 정도)**\n- **INP(Interaction to Next Paint, 클릭 후 반응이 보이기까지 시간)**\n\n이미지가 원본 4K로 내려오거나, 웹폰트가 늦게 적용되며 글자가 튀면 LCP·CLS가 나빠진다. Client 번들이 크면 INP도 나빠진다.\n\nNext는 이미지 최적화와 폰트 내장을 기본 도구로 제공한다. 켜지 않으면 `\u003cimg\u003e`·구글 CSS 링크와 같다.\n\n---\n\n## 2. 한 줄 규칙\n\n히어로처럼 LCP 후보인 이미지만 `priority`다. 나머지는 기본 lazy.\n\n폰트는 `next/font`로 빌드에 넣는다. 런타임에 fonts.googleapis.com을 치지 않는다.\n\n---\n\n## 3. 예제\n\n### next/image\n\n```tsx\nimport Image from 'next/image';\n\nexport function Hero() {\n  return (\n    \u003cImage\n      src=\"/hero.jpg\"\n      alt=\"제품 히어로\"\n      width={1200}\n      height={630}\n      priority\n    /\u003e\n  );\n}\n```\n\n`width`와 `height`(또는 `fill` + 부모 크기)가 있어야 공간이 먼저 잡혀 CLS가 줄어든다. `alt`는 내용이 있는 이미지에 실제 설명을 쓴다. 장식 이미지면 빈 문자열.\n\n이점: 리사이즈, lazy, WebP/AVIF 같은 포맷. 서버가 있는 호스팅에서 기본 로더가 동작한다.\n\n정적 내보내기(`output: 'export'`)에는 이미지 최적화 서버가 없다.\n\n```ts\n// next.config.ts\nimport type {NextConfig} from 'next';\n\nconst nextConfig: NextConfig = {\n  output: 'export',\n  images: {\n    unoptimized: true,\n  },\n};\n\nexport default nextConfig;\n```\n\n`unoptimized: true`면 `\u003cimg\u003e`에 가깝게 원본을 그대로 보낸다. 빌드 전에 적절한 해상도로 잘라 두는 편이 낫다.\n\n원격 이미지는 도메인을 허용해야 한다.\n\n```ts\nconst nextConfig: NextConfig = {\n  images: {\n    remotePatterns: [\n      {\n        protocol: 'https',\n        hostname: 'images.example.com',\n        pathname: '/media/**',\n      },\n    ],\n  },\n};\n```\n\n허용하지 않은 호스트는 런타임 에러다. 오픈 프록시가 되지 않게 경로까지 좁힌다.\n\n### next/font\n\n```tsx\n// app/layout.tsx\nimport type {ReactNode} from 'react';\nimport {Geist, Geist_Mono} from 'next/font/google';\nimport './globals.css';\n\nconst sans = Geist({\n  subsets: ['latin'],\n  variable: '--font-sans',\n  display: 'swap',\n});\n\nconst mono = Geist_Mono({\n  subsets: ['latin'],\n  variable: '--font-mono',\n  display: 'swap',\n});\n\nexport default function RootLayout({children}: {children: ReactNode}) {\n  return (\n    \u003chtml lang=\"ko\" className={`${sans.variable} ${mono.variable}`}\u003e\n      \u003cbody\u003e{children}\u003c/body\u003e\n    \u003c/html\u003e\n  );\n}\n```\n\n```css\n/* app/globals.css */\nbody {\n  font-family: var(--font-sans), system-ui, sans-serif;\n}\n```\n\n빌드 시 폰트 파일을 받아 자체 호스트한다. 레이아웃 시프트와 외부 CSS 요청이 줄어든다. 한글은 `subsets`와 실제 쓰는 폰트 파일을 확인한다. 가변 폰트 하나가 여러 두께를 커버하면 요청 수가 줄어든다.\n\n로컬 파일은 `next/font/local`이다.\n\n```ts\nimport localFont from 'next/font/local';\n\nconst pretendard = localFont({\n  src: './fonts/PretendardVariable.woff2',\n  variable: '--font-sans',\n  display: 'swap',\n});\n```\n\n### 번들\n\n- 차트·에디터는 그 페이지의 Client 파일에서만 import\n- `dynamic(..., {ssr: false})`는 브라우저 전용일 때만\n- `components/index.ts`에서 모든 UI를 re-export하면 안 쓰는 코드까지 묶일 수 있다. 쓰는 파일에서 직접 import한다\n\n```bash\nnpm run build\n```\n\n라우트별 First Load JS를 본다. 한 페이지가 유독 크면 그 페이지의 Client 경계를 의심한다.\n\n### 스트리밍과 loading\n\n```tsx\n// app/posts/page.tsx\nimport {Suspense} from 'react';\nimport {PostList} from './post-list';\nimport {PostStats} from './post-stats';\n\nexport default function PostsPage() {\n  return (\n    \u003cmain\u003e\n      \u003ch1\u003e글\u003c/h1\u003e\n      \u003cSuspense fallback={\u003cp\u003e목록 로딩\u003c/p\u003e}\u003e\n        \u003cPostList /\u003e\n      \u003c/Suspense\u003e\n      \u003cSuspense fallback={\u003cp\u003e통계 로딩\u003c/p\u003e}\u003e\n        \u003cPostStats /\u003e\n      \u003c/Suspense\u003e\n    \u003c/main\u003e\n  );\n}\n```\n\n느린 구간만 기다린다. 셸(헤더·제목)은 먼저 나간다. `loading.tsx`는 해당 세그먼트 전체에 대한 같은 패턴이다.\n\n개인화 데이터가 아니면 서버에서 미리 읽어 HTML에 넣는 편이 LCP에 유리하다. 전부 Client fetch로 미루지 않는다.\n\n### 측정\n\n같은 URL로 전후를 비교한다.\n\n- Lighthouse / PageSpeed Insights\n- 필드 데이터: LCP, CLS, INP\n- 개발자 도구 네트워크 + 저속 쓰로틀\n\n실험실 점수만 보지 않는다. 실제 폰·3G에서 히어로가 언제 보이는지 본다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 결과 | 대안 |\n|------|------|------|\n| 모든 이미지에 `priority` | 대역 낭비, LCP 경쟁 | 뷰포트 안 히어로만 |\n| 크기 없이 `fill`만 | CLS | 부모에 비율·크기 |\n| `\u003cimg\u003e` + 구글 폰트 링크 | 레이아웃 점프, 외부 요청 | `next/image` + `next/font` |\n| export인데 기본 이미지 로더 | 빌드/런타임 실패 | `images.unoptimized` |\n| 루트 레이아웃에 차트 라이브러리 | 전 페이지 번들 증가 | 해당 페이지 Client만 |\n| `ssr: false`를 기본값처럼 사용 | 첫 HTML이 비어 있다 | 정말 브라우저 전용일 때만 |\n\n---\n\n## 정리\n\n성능은 도구를 켜는 문제다. 이미지 크기·우선순위, 폰트 자체 호스트, Client 번들 범위.\n\n측정은 같은 URL로 한다. 정적 내보내기면 이미지 서버가 없다는 전제로 파일을 미리 줄인다.\n\n---\n\n## 연습\n\n1. 홈 히어로에 `next/image`와 `priority`를 넣고, 목록 썸네일에는 `priority`를 뺀다.\n2. 루트 레이아웃의 본문 폰트를 `next/font`로 옮기고, `\u003clink href=\"fonts.googleapis.com\"\u003e`을 제거한다.\n3. `output: 'export'`면 `unoptimized`가 필요한지 빌드로 확인하고, 히어로 파일 용량을 직접 제한한다.\n"])</script><script>self.__next_f.push([1,"51:T18b5,"])</script><script>self.__next_f.push([1,"# 배포 — Vercel·정적 호스팅·체크리스트\n\n\u003e 요약: 서버가 있는 배포와 HTML만 올리는 배포를 고르고, 환경변수·SEO·롤백을 체크리스트로 통과시킨다.\n\n---\n\n## 1. 왜 이 주제가 필요한가\n\nNext.js는 어디에 올리느냐가 아키텍처다. Vercel처럼 서버가 있으면 Server Action·미들웨어·ISR을 쓸 수 있다. GitHub Pages처럼 파일만 받으면 `output: 'export'`로 HTML을 구워야 한다.\n\n기능을 나중에 넣고 호스팅을 바꾸면 데이터 페칭·인증을 다시 짠다. 배포 형태를 먼저 고르고, 아래 목록으로 빠뜨린 항목을 막는다.\n\n---\n\n## 2. 한 줄 규칙\n\n서버가 필요한 기능이 하나라도 있으면 PaaS/Node에 올린다. 공개 문서만이면 정적 내보내기로 단순화한다.\n\n시크릿은 `NEXT_PUBLIC_`을 붙이지 않는다. 사이트 URL은 환경변수 한곳으로 모은다.\n\n---\n\n## 3. 예제\n\n### 호스팅 선택\n\n| 대상 | 맞을 때 | 이유 |\n|------|---------|------|\n| Vercel / 유사 PaaS | SSR, Action, ISR, 미들웨어 | Node/엣지 런타임이 있다 |\n| GitHub Pages / S3+CDN | 블로그·문서 정적 사이트 | HTML·JS만 올리면 된다 |\n| Node / Docker | 사내 인프라, 커스텀 런타임 | 프로세스와 포트 제어가 필요할 때 |\n\n혼합도 가능하다. 공개 `/posts`는 정적 HTML, `/manager`만 서버 앱. 다만 두 배포 파이프라인을 유지할 비용이 있다.\n\n### 환경변수\n\n```env\n# .env.production 예시. 저장소에 시크릿을 커밋하지 않는다.\nNEXT_PUBLIC_SITE_URL=https://blog.example.com\nNEXT_PUBLIC_API_URL=https://api.example.com\nDATABASE_URL=postgresql://...\n```\n\n| 접두사 | 노출 | 용도 |\n|--------|------|------|\n| `NEXT_PUBLIC_*` | 브라우저 번들 | 사이트 URL, 공개 API 주소 |\n| 접두사 없음 | 서버만 | DB URL, 메일 키, 세션 시크릿 |\n\n프리뷰와 프로덕션 URL을 나눈다. OG·sitemap이 프리뷰 도메인을 가리키면 검색·공유가 꼬인다.\n\n```ts\n// lib/site.ts\nexport function getSiteUrl(): string {\n  const url = process.env.NEXT_PUBLIC_SITE_URL;\n  if (!url) throw new Error('NEXT_PUBLIC_SITE_URL이 없다');\n  return url.replace(/\\/$/, '');\n}\n```\n\n빌드 때 없으면 실패하게 두면 잘못된 배포가 나가지 않는다.\n\n### 정적 내보내기 흐름\n\n```bash\nnpm run build\n# out/ 을 S3, GitHub Pages, Nginx 루트에 업로드\n```\n\n```ts\n// next.config.ts\nimport type {NextConfig} from 'next';\n\nconst nextConfig: NextConfig = {\n  output: 'export',\n  trailingSlash: true,\n  images: {unoptimized: true},\n};\n\nexport default nextConfig;\n```\n\n- `trailingSlash`와 CDN/Nginx 디렉터리 인덱스 규칙을 맞춘다. `/posts/hello`와 `/posts/hello/`가 둘 다 200이면 중복이다.\n- SPA처럼 `/* → index.html`만 두면 상세 HTML이 없다. SEO에는 **경로별 HTML**이 맞다.\n- 커스텀 도메인 + HTTPS. `metadataBase`와 인증서를 같은 호스트로.\n\n### Vercel형 흐름\n\nGit 연동 후 프리뷰 URL로 각 PR을 본다. 프로덕션은 메인 브랜치.\n\n서버 기능(Action, `revalidateTag`, 미들웨어)이 살아 있는지 프리뷰에서 폼·로그인까지 눌러 본다. 빌드만 통과한 배포는 반쪽이다.\n\n---\n\n## 4. 프로덕션 체크리스트\n\n각 항목은 빼면 검색이 빠지거나, 키가 새거나, 장애 때 되돌리지 못한다.\n\n### SEO\n\n- [ ] 공개 글 URL이 빌드된 HTML에 제목·본문을 담는다 — 크롤러는 JS 실행 전에 본문을 찾는다\n- [ ] `sitemap.xml`과 `robots.txt`가 실제 공개 URL과 같다 — 빠진 주소는 색인이 늦다\n- [ ] canonical·OG `url`이 `NEXT_PUBLIC_SITE_URL` + trailing slash 규칙과 같다 — 중복 문서로 잡히지 않게\n- [ ] `/login`, `/manager`는 `noindex`(그리고 robots disallow) — 인증 화면이 검색에 나오지 않게\n- [ ] `\u003chtml lang=\"ko\"\u003e` — 언어가 맞아야 검색·스크린 리더가 올바르다\n\n### 신뢰성\n\n- [ ] 필수 환경변수가 없으면 빌드 또는 기동이 실패한다 — 빈 URL로 sitemap이 나가지 않게\n- [ ] `not-found` / `error` 페이지가 있다 — 없는 글과 서버 실패를 사용자가 구분한다\n- [ ] 이전 배포로 롤백하는 방법을 적었다 — Vercel이면 이전 Promotion, 정적이면 이전 `out/` 재업로드\n- [ ] 시크릿이 Git에 없다 — `.env*`는 gitignore, 플랫폼 환경변수만 사용\n- [ ] 관리자 API는 서버에서 세션을 다시 본다 — UI 숨김만으로는 부족하다\n\n### 성능\n\n- [ ] 히어로는 `next/image`(또는 export면 리사이즈된 정적 파일) — LCP 후보 용량을 제한\n- [ ] 본문 폰트는 `next/font` — 외부 폰트 CSS로 CLS가 나지 않게\n- [ ] `next build`에서 이상하게 큰 라우트가 없다 — Client 경계를 다시 본다\n- [ ] CDN/캐시 헤더가 정적 자산에 있다 — HTML은 짧게, hashed JS/CSS는 길게\n\n### 정적 내보내기만\n\n- [ ] Route Handler·미들웨어·ISR에 의존하지 않는다 — 런타임 서버가 없다\n- [ ] `images.unoptimized` 또는 커스텀 로더 — 최적화 서버가 없다\n- [ ] `generateStaticParams`가 공개 slug를 모두 반환한다 — 빠진 글은 `out/`에 파일이 없다\n\n---\n\n## 5. CI 스케치\n\n1. lint / typecheck / test — 타입·깨진 링크를 배포 전에 막는다\n2. `next build` — 정적/동적 라우트 표를 로그에서 확인한다\n3. artifact 업로드 또는 Vercel 연동 — 산출물이 곧 롤백 단위다\n4. 스모크: `/`, `/posts/`, 대표 글 URL, (서버형이면) 로그인 실패 리다이렉트\n\n---\n\n## 정리\n\n배포는 “이 앱이 서버를 필요로 하는가”에 대한 답이다. 그 답이 페칭·인증·이미지를 가른다.\n\n공개 문서는 정적 HTML, 동적 관리자는 서버 또는 별도 API. 체크리스트를 통과/미통과로 남기면 다음 배포에서 같은 구멍을 반복하지 않는다.\n\n---\n\n## 연습\n\n1. 현재 프로젝트가 Vercel형인지 `export`형인지 한 줄로 적고, 그 이유에 쓰는 기능(Action, 미들웨어 등)을 적는다.\n2. `NEXT_PUBLIC_SITE_URL`이 sitemap·canonical·OG에만 쓰이는지 검색한다. 하드코딩 도메인을 제거한다.\n3. 위 체크리스트를 통과/미통과로 표시하고, 미통과 항목의 수정 이슈를 연다.\n"])</script><script>self.__next_f.push([1,"52:T179d,"])</script><script>self.__next_f.push([1,"# Nginx 리버스 프록시 기초\n\n\u003e 요약: 브라우저와 앱 서버 사이에 Nginx를 두고, 정적 파일은 직접 주고 API는 내부 포트로 넘기는 최소 구성을 만든다.\n\n---\n\n## 언제 Nginx를 앞에 두는가\n\n브라우저가 Node·Java·PHP-FPM 같은 앱 서버에 직접 붙지 않게 할 때 Nginx를 앞단에 둔다. 바깥에는 80/443만 열고, 앱은 `127.0.0.1:3000`처럼 내부 포트만 연다.\n\n리버스 프록시는 “뒤에서 오는 요청을 대신 받아 앱에 넘기는” 역할이다. 포워드 프록시(클라이언트가 밖으로 나갈 때 거치는 프록시)와 반대 방향이다.\n\n이 구성에서 Nginx가 맡는 일은 세 가지이다. 호스트 이름과 포트를 한곳에서 받는다. CSS·이미지 같은 정적 파일은 앱을 거치지 않는다. 타임아웃과 헤더를 앞단에서 고정한다.\n\n---\n\n## 요청이 앱으로 가는 최소 블록\n\n`server`는 가상 호스트이다. `listen`과 `server_name`이 맞으면 그 블록이 요청을 받는다. `location /`는 나머지 경로를 앱으로 넘긴다.\n\n```nginx\nserver {\n    listen 80;\n    server_name example.com;\n\n    location / {\n        proxy_pass http://127.0.0.1:3000;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n}\n```\n\n`proxy_pass`만 넣고 헤더를 안 바꾸면 앱은 자기 자신을 `127.0.0.1`로 알게 된다. 리다이렉트 URL과 쿠키 도메인이 틀린다.\n\n| 헤더 | 앱이 알게 되는 값 |\n|------|-------------------|\n| `Host` | 브라우저가 요청한 호스트. 가상호스트·절대 URL 생성 |\n| `X-Real-IP` | 클라이언트 IP 한 개 |\n| `X-Forwarded-For` | 프록시를 거친 IP 목록. 맨 앞이 원 IP인 경우가 많다 |\n| `X-Forwarded-Proto` | `http` 또는 `https`. 앱이 링크 스킴을 맞출 때 쓴다 |\n\n앱이 이 헤더를 신뢰하는지는 프레임워크 설정을 확인한다. 아무 호스트나 넘기면 호스트 헤더 공격에 열린다. `server_name`을 실제 도메인으로 제한한다.\n\n---\n\n## 정적 파일과 앱을 나눈다\n\n`/assets/`는 디스크에서 바로 주고, 나머지는 앱으로 보낸다. 앱이 이미지 요청마다 깨어날 필요가 없다.\n\n```nginx\nserver {\n    listen 80;\n    server_name example.com;\n    root /var/www/app;\n\n    location /assets/ {\n        alias /var/www/app/assets/;\n        expires 7d;\n        access_log off;\n    }\n\n    location / {\n        proxy_pass http://127.0.0.1:3000;\n        proxy_set_header Host $host;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n}\n```\n\n`alias`는 location 경로를 파일 경로로 바꾼다. `root`는 location을 root 아래에 이어 붙인다. `/assets/app.css`를 `alias /var/www/app/assets/`에 매면 파일은 `/var/www/app/assets/app.css`이다. `root`와 `alias`를 같은 location에 섞지 않는다.\n\nlocation은 더 구체적인 쪽이 이긴다. `^~ /assets/`처럼 접두 우선을 주면 정규식 location에 빼앗기지 않는다. 의도치 않게 정적 요청이 앱으로 들어가면 이 우선순위를 의심한다.\n\n| 접두 | 의미 |\n|------|------|\n| `=` | 경로가 정확히 같을 때만 |\n| `^~` | 이 접두가 이긴다. 정규식보다 앞선다 |\n| 접두 문자열 | 가장 긴 접두가 후보 |\n| `~` / `~*` | 정규식. `~*`는 대소문자 무시 |\n\n앱 포트가 여러 개이면 `upstream`에 이름을 붙인다. `proxy_pass`가 주소를 반복하지 않는다.\n\n```nginx\nupstream app {\n    server 127.0.0.1:3000;\n}\n\nserver {\n    listen 80;\n    server_name example.com;\n\n    location / {\n        proxy_pass http://app;\n        proxy_set_header Host $host;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    }\n}\n```\n\n`proxy_pass http://app`처럼 변수·이름이 들어가면 URI를 그대로 넘긴다. location 경로를 잘라 붙이는 치환이 일어나지 않는다.\n\n---\n\n## 적용 전에 문법부터 본다\n\n```bash\nsudo nginx -t\nsudo systemctl reload nginx\ncurl -I http://127.0.0.1/\n```\n\n`-t`는 설정 파일 문법과 경로를 검사한다. 실패하면 reload하지 않는다. 잘못된 설정으로 reload하면 사이트가 통째로 죽을 수 있다.\n\n`curl -I`로 상태 코드와 `Server` 헤더를 본다. 앱이 아니라 Nginx가 응답하는지가 첫 확인이다. `502`면 업스트림(앱)이 꺼졌거나 포트가 틀린다. `404`면 location이 파일을 못 찾는다.\n\n---\n\n## 흔한 실수\n\n- `proxy_pass` 뒤에 경로를 붙인다. `proxy_pass http://127.0.0.1:3000/;`처럼 슬래시가 있으면 location 치환 규칙이 달라진다. 앱 루트로 통째로 넘기면 슬래시 없이 호스트만 둔다.\n- `Host`를 넘기지 않아 앱이 내부 호스트로 리다이렉트한다.\n- `alias` 끝에 `/`가 없어 파일 경로가 이어 붙는다. location과 alias의 슬래시를 짝맞춘다.\n- `nginx -t` 없이 reload한다. 문법 오류가 운영 프로세스에 들어간다.\n- `server_name`을 `_`만 두고 여러 사이트가 한 블록으로 들어온다. 도메인을 명시한다.\n\n---\n\n## 정리\n\nNginx 첫 목표는 튜닝이 아니다. 바깥 요청을 받아 Host와 Forwarded 헤더를 채우고, 정적과 동적을 갈라 앱에 넘기는 일이다. 이 세 줄이 맞으면 TLS(전송 계층 보안)와 타임아웃은 그다음에 얹으면 된다.\n\n---\n\n## 연습\n\n1. 로컬에서 앱을 3000 포트로 띄우고, 위 `server` 블록으로 80 포트에서 같은 페이지가 열리는지 `curl -I`로 확인한다.\n2. `Host` 헤더를 주석 처리한 뒤 앱이 만드는 리다이렉트 Location이 어떻게 바뀌는지 비교한다.\n3. `/assets/test.css` 파일을 디스크에 두고, 그 경로가 앱 로그에 안 찍히고 Nginx가 200을 주는지 확인한다.\n"])</script><script>self.__next_f.push([1,"53:T1698,"])</script><script>self.__next_f.push([1,"# Nginx에서 HTTPS·TLS 종단하기\n\n\u003e 요약: 인증서를 Nginx에 두고 443에서 TLS를 끝낸 뒤, 80 요청을 HTTPS로 보내고 앱에는 암호화가 끝났다는 헤더를 넘긴다.\n\n---\n\n## 언제 앞단에서 TLS를 끊는가\n\n브라우저와 서버 사이 트래픽을 암호화할 때 TLS(전송 계층 보안)를 쓴다. HTTPS는 HTTP에 TLS를 얹은 것이다.\n\n인증서를 앱마다 넣지 않고 Nginx(또는 로드밸런서)에서 끝낸다. 앱은 내부 HTTP만 받으면 된다. 인증서 갱신·프로토콜 버전·보안 헤더를 한곳에서 바꾼다.\n\n클라우드에서 로드밸런서가 이미 TLS를 끝내면 Nginx는 HTTP만 받아도 된다. 이 글은 Nginx가 인증서를 직접 들고 있는 경우이다.\n\n---\n\n## 443에서 인증서를 연다\n\nLet’s Encrypt를 썼다면 경로가 아래와 같다. 상용 인증서도 `fullchain`과 비밀키 두 파일이라는 점은 같다.\n\n```nginx\nserver {\n    listen 443 ssl;\n    http2 on;\n    server_name example.com;\n\n    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;\n    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;\n\n    ssl_protocols TLSv1.2 TLSv1.3;\n\n    location / {\n        proxy_pass http://127.0.0.1:3000;\n        proxy_set_header Host $host;\n        proxy_set_header X-Forwarded-Proto https;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    }\n}\n```\n\n`ssl_certificate`는 사이트 인증서와 중간 인증서가 이어진 체인이다. 리프만 넣으면 일부 브라우저가 체인을 못 잇는다. `privkey`는 비밀키이다. 권한이 넓으면 키 유출과 같다.\n\n`X-Forwarded-Proto`를 `https`로 고정한다. 빠지거나 `http`로 남으면 앱이 `http://` 링크를 만들고, Secure 쿠키를 안 붙인다. 리다이렉트 루프가 나기도 한다.\n\n구버전 Nginx는 `listen 443 ssl http2;` 한 줄이다. 새 버전은 `listen 443 ssl;`과 `http2 on;`을 분리한다. `nginx -V`로 문법을 확인한다.\n\n---\n\n## 80은 443으로만 보낸다\n\n암호화되지 않은 80은 같은 경로를 HTTPS로 돌린다. `return 301`이 가장 짧다.\n\n```nginx\nserver {\n    listen 80;\n    server_name example.com;\n    return 301 https://$host$request_uri;\n}\n```\n\n`$host$request_uri`는 호스트와 경로·쿼리를 유지한다. `https://example.com/`처럼 루트만 박으면 북마크 경로가 날아간다.\n\n인증서 발급이 HTTP-01(ACME, 자동 인증서 관리 환경의 HTTP 검증)이면 `/.well-known/acme-challenge/`는 리다이렉트하면 안 된다. 검증 파일은 평문으로 열려 있어야 한다.\n\n```nginx\nserver {\n    listen 80;\n    server_name example.com;\n\n    location /.well-known/acme-challenge/ {\n        root /var/www/certbot;\n    }\n\n    location / {\n        return 301 https://$host$request_uri;\n    }\n}\n```\n\n발급이 끝난 뒤에도 이 location을 남겨 두면 갱신이 같은 경로로 통과한다.\n\n---\n\n## 갱신과 HSTS\n\n| 항목 | 하는 일 |\n|------|---------|\n| 갱신 | `certbot renew`가 성공한 뒤 deploy hook에서 `nginx -t \u0026\u0026 systemctl reload nginx` |\n| 프로토콜 | TLS 1.2와 1.3만 연다. 1.0·1.1은 끈다 |\n| HSTS | 안정적으로 HTTPS만 열린 뒤에 `Strict-Transport-Security`를 넣는다 |\n| 키 권한 | `privkey.pem`은 root(또는 nginx 사용자)만 읽게 둔다 |\n\nHSTS(HTTP 엄격 전송 보안)는 브라우저에게 “이 사이트는 앞으로 HTTPS만”이라고 기억하는 헤더이다. 한 번 나가면 HTTP로 되돌리기 어렵다. 인증서 오류가 남은 상태에서는 넣지 않는다.\n\n```nginx\nadd_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;\n```\n\n`max-age`는 초 단위이다. 먼저 짧은 값으로 시험한 뒤 1년으로 늘린다. 서브도메인이 HTTP만 있으면 `includeSubDomains`를 빼다.\n\nwww와 apex(루트 도메인) 중 하나만 정규 URL로 정한다. 인증서는 둘 다 커버하거나, 한쪽에서 다른 쪽으로 301한다. 정책이 섞이면 쿠키와 SEO(검색 엔진 최적화)가 갈린다.\n\n인증서가 브라우저에 실제로 쓰이는지 확인한다.\n\n```bash\nsudo nginx -t\nsudo systemctl reload nginx\ncurl -I http://example.com/\ncurl -IIv --http1.1 https://example.com/\n```\n\n80 응답은 `301`과 `Location: https://...`이어야 한다. 443은 인증서 주체(CN/SAN)가 요청 호스트와 같아야 한다. 불일치면 `server_name`과 인증서 발급 이름을 맞춘다.\n\n---\n\n## 흔한 실수\n\n- `fullchain` 대신 `cert.pem`만 넣는다. 모바일에서 체인 오류가 난다.\n- `X-Forwarded-Proto`를 `$scheme`으로 두었는데 내부가 HTTP라서 앱이 계속 `http`를 본다. 443 블록에서는 `https`로 명시한다.\n- 80 전체를 301하면서 ACME 경로까지 막는다. 갱신이 실패한다.\n- HSTS를 인증서 만료 직전 사이트에 바로 켠다. 만료 동안 브라우저가 HTTP 폴백을 거부한다.\n- reload만 하고 인증서 파일을 안 읽게 한다. 심볼릭 링크가 바뀌었으면 프로세스 사용자 권한으로 새 파일을 읽을 수 있는지 본다.\n\n---\n\n## 정리\n\nHTTPS는 인증서 경로 두 줄을 넣는 일이 아니다. 443에서 TLS를 끝내고, 80을 안전하게 돌리고, 앱에는 `https`로 끝났다고 알리고, 갱신 후 reload가 자동이어야 한 세트가 된다.\n\n---\n\n## 연습\n\n1. 스테이징 도메인에 위 80/443 블록을 넣고 `curl -I http://도메인`이 301로 `https://`를 가리키는지 확인한다.\n2. 앱이 그리는 로그인 링크가 `https://`인지 보고, `X-Forwarded-Proto`를 빼면 스킴이 어떻게 바뀌는지 비교한다.\n3. 인증서 만료일을 `openssl x509 -in fullchain.pem -noout -enddate`로 확인하고, renew hook에 `nginx -t`와 reload가 있는지 본다.\n"])</script><script>self.__next_f.push([1,"54:T1865,"])</script><script>self.__next_f.push([1,"# Nginx 운영·보안 체크리스트\n\n\u003e 요약: 배포 전에 타임아웃, 업로드 한도, 보안 헤더, 로그, 압축, 인증서 갱신이 앱 특성에 맞는지 확인한다.\n\n---\n\n## 언제 이 목록을 보는가\n\n리버스 프록시와 TLS(전송 계층 보안)가 열린 뒤에 본다. 문법만 통과한 설정은 배포 구성이 아니다.\n\n앱이 60초 걸리는 내보내기를 쓰는데 프록시가 30초에 끊으면 사용자는 앱 버그로 느낀다. 헤더·로그·인증서 갱신은 장애 때 원인 구간을 가르는 도구이다. 아래는 옵션 나열이 아니라 배포 전에 한 번씩 통과할 항목이다.\n\n---\n\n## 1. 프록시·타임아웃\n\n앱이 느린데 Nginx가 먼저 끊으면 사용자는 502/504만 본다. 값은 앱의 실제 응답 시간에 맞춘다.\n\n- [ ] `proxy_connect_timeout`을 짧게 둔다. 업스트림이 꺼졌을 때 연결 대기만 길어진다.\n- [ ] `proxy_read_timeout`을 가장 긴 API(리포트·내보내기)보다 조금 크게 둔다. 짧으면 정상 작업이 504로 죽는다.\n- [ ] 파일 업로드가 있으면 `client_max_body_size`를 앱·스토리지 한도와 같게 둔다. 기본 1m이면 큰 폼이 413으로 거절된다.\n- [ ] WebSocket이면 `Upgrade`와 `Connection`을 넘긴다. 빼면 핸드셰이크가 HTTP로 남는다.\n- [ ] 업스트림 다운 시 재시도·에러 페이지를 정한다. 무한 재시도는 장애를 키운다.\n\n```nginx\nproxy_connect_timeout 5s;\nproxy_read_timeout 60s;\nclient_max_body_size 20m;\n\n# WebSocket location 예\nproxy_http_version 1.1;\nproxy_set_header Upgrade $http_upgrade;\nproxy_set_header Connection \"upgrade\";\n```\n\n---\n\n## 2. 보안 헤더\n\n브라우저에 “이 응답을 어떻게 다룰지”를 알려 주는 헤더이다. 앱이 이미 같은 헤더를 내면 중복·충돌을 먼저 본다.\n\n```nginx\nadd_header X-Content-Type-Options nosniff always;\nadd_header X-Frame-Options SAMEORIGIN always;\nadd_header Referrer-Policy strict-origin-when-cross-origin always;\n```\n\n- [ ] `X-Content-Type-Options: nosniff`를 둔다. MIME을 추측해 스크립트로 실행하는 길을 줄인다.\n- [ ] 클릭재킹이 문제면 `X-Frame-Options` 또는 CSP(콘텐츠 보안 정책)의 `frame-ancestors`를 둔다. iframe으로 넣을 사이트가 있으면 `SAMEORIGIN`이 막는다.\n- [ ] `Referrer-Policy`를 정한다. 기본값이면 외부 사이트로 경로가 과도하게 새어 나갈 수 있다.\n- [ ] `server_tokens off`로 버전 문자열을 줄인다. 정찰을 완전히 막지는 못하지만 노출은 줄어든다.\n- [ ] CSP는 앱의 스크립트·스타일·폰트 출처와 맞춰 단계적으로 넣는다. 한 번에 `default-src 'self'`만 넣으면 화면이 한꺼번에 깨진다.\n- [ ] HTTPS가 안정된 뒤에만 HSTS(HTTP 엄격 전송 보안)를 켠다. 인증서 문제가 남은 상태에서는 넣지 않는다.\n\n`add_header`는 일부 오류 응답에서 빠질 수 있다. `always`를 붙인 이유를 주석으로 남긴다. `if` 안에서 `add_header`를 쓰면 부모 헤더가 사라지는 함정이 있다.\n\n---\n\n## 3. 로그·관측\n\n장애 때 요청이 Nginx에서 멈췄는지 앱에서 멈췄는지 나뉘어야 한다.\n\n- [ ] `access_log`와 `error_log` 경로가 디스크 용량·로테이션 대상이다. 안 돌리면 파티션이 찬다.\n- [ ] 로그 포맷에 `$request_time`과 `$upstream_response_time`을 넣는다. 앞은 전체, 뒤는 앱 시간이다.\n- [ ] 헬스체크 URL은 `access_log off`를 검토한다. 로드밸런서 폴링이 액세스 로그를 덮는다.\n- [ ] 5xx가 늘면 에러 로그의 upstream 메시지를 먼저 본다. 타임아웃·연결 거부가 여기에 찍힌다.\n\n```nginx\nlog_format main '$remote_addr $status $request_time $upstream_response_time '\n                '\"$request\"';\naccess_log /var/log/nginx/access.log main;\n```\n\n---\n\n## 4. 성능\n\n미세 `worker` 튜닝보다 불필요한 프록시와 큰 바디를 먼저 줄인다.\n\n| 항목 | 확인 이유 |\n|------|-----------|\n| gzip / brotli | HTML·JSON·CSS·JS는 압축 이득이 크다. 이미 압축된 이미지는 제외한다 |\n| `sendfile` | 정적 파일을 커널이 바로 보낼 때 복사 비용이 줄어든다 |\n| 캐시 헤더 | 해시가 붙은 자산은 장기 `expires`. HTML은 짧게 둔다 |\n| `worker_connections` | 동시 연결 상한. 부족하면 대기열만 늘고 원인 로그가 빈약하다 |\n\n- [ ] 텍스트 응답에 gzip(또는 brotli)이 켜져 있다. `gzip_types`에 `application/json`이 빠지기 쉽다.\n- [ ] `/assets/app.abc123.js`처럼 파일명에 해시가 있으면 긴 캐시를 준다. 배포마다 URL이 바뀌므로 구버전을 붙잡지 않는다.\n- [ ] HTML·API는 짧게 캐시하거나 `private`로 둔다. 로그인 페이지를 공용 캐시하면 내용이 섞인다.\n- [ ] 정적 location이 앱 `proxy_pass`로 안 새는지 본다. 정적인데 앱 로그가 찍히면 location 우선순위 문제이다.\n\n---\n\n## 5. 배포 직전\n\n설정을 바꾼 직후와 인증서 갱신 직후에 같은 목록을 탄다.\n\n- [ ] `nginx -t`가 성공한 뒤에만 reload한다. 문법 오류를 운영 프로세스에 넣지 않는다.\n- [ ] reload 후 헬스 URL과 로그인·결제 같은 핵심 경로를 `curl -I`로 본다. 프로세스는 살아 있어도 location이 틀릴 수 있다.\n- [ ] HTTP→HTTPS, www/non-www 정규 호스트가 기획과 같다. 인증서 SAN(주제 대체 이름)에 둘 다 있어야 한다.\n- [ ] 인증서 만료일과 자동 갱신 hook에 reload가 있다. 파일만 바뀌고 프로세스가 옛 키를 들고 있으면 브라우저만 실패한다.\n- [ ] `privkey` 권한이 최소이다. 백업 경로에 비밀키가 평문으로 복사되지 않았는지 본다.\n- [ ] 스테이징과 프로덕션 `server_name`·업스트림 포트가 뒤바뀌지 않았는지 한 줄로 대조한다.\n\n---\n\n## 정리\n\nNginx 운영은 옵션을 많이 켜는 일이 아니다. 앱이 끝나기 전에 프록시가 끊지 않는지, 브라우저에 필요한 헤더가 나가는지, 로그로 지연 구간을 나눌 수 있는지, 인증서가 갱신 후에도 로드되는지가 체크리스트이다. 배포 전에 위 순서로 한 바퀴 돌리면 된다.\n"])</script><script>self.__next_f.push([1,"55:T1351,"])</script><script>self.__next_f.push([1,"# React Native와 Expo로 시작하기\n\n\u003e 요약: Expo와 TypeScript로 React Native 프로젝트를 만들고, 첫 화면이 뜨기까지의 기본 지도를 잡는다.\n\n---\n\n## 1. 왜 Expo로 시작하나\n\nReact Native는 JavaScript/TypeScript로 **iOS·Android 네이티브 UI**를 만드는 프레임워크다. 웹의 DOM 대신 네이티브 뷰를 그린다. 컴포넌트·훅·상태 모델은 React와 같다.\n\n**Expo**는 그 위에 올라가는 개발·빌드·배포 툴체인이다. 네이티브 프로젝트를 직접 만지지 않고도 앱을 만들고, 나중에 스토어 빌드까지 이어갈 수 있다.\n\n지금은 Expo가 “토이 전용”이 아니다. 학습과 프로덕션 모두 **Expo + TypeScript**를 기본선으로 둔다.\n\n| 구분 | React (웹) | React Native |\n|------|------------|--------------|\n| 렌더 | HTML/CSS | 네이티브 뷰 |\n| 스타일 | CSS | StyleSheet + Flex |\n| 라우팅 | react-router 등 | Expo Router |\n| 번들 | Vite/Webpack | Metro |\n\n---\n\n## 2. 핵심 개념\n\n**Managed Expo**가 기본이다. 네이티브 폴더(`ios/`, `android/`)를 직접 관리하지 않는다. 커스텀 네이티브가 필요하면 config plugin과 prebuild로 확장한다.\n\n| 항목 | Expo | Bare CLI |\n|------|------|----------|\n| 시작 | 빠르다 | 느리다 |\n| 스토어 빌드 | EAS Build | Xcode/Gradle 직접 |\n| JS 핫픽스 | EAS Update | 직접 구성 |\n| 네이티브 모듈 | config plugin | 수동 연동 |\n\n**EAS**(Expo Application Services)는 Expo의 클라우드 빌드·제출·업데이트 서비스다. 지금은 “나중에 쓴다” 정도만 기억하면 된다. 배포 문에서 다룬다.\n\nNew Architecture는 최근 Expo SDK에서 기본/권장이다.\n\n- **Fabric**: 새 렌더러\n- **TurboModules**: 네이티브 모듈 호출\n- **JSI**: JS와 네이티브의 저수준 연결\n\n브릿지 병목이 줄었다는 점만 알면 시작에는 충분하다.\n\n---\n\n## 3. 예제\n\n환경: Node.js LTS(20+), Git, Android Studio 또는 Xcode(macOS). 실기기는 **Expo Go** 앱으로 바로 실행할 수 있다.\n\n```bash\nnpx create-expo-app@latest my-app --template tabs\ncd my-app\nnpx expo start\n```\n\nTypeScript + Expo Router 템플릿을 고른다. `tabs`가 그 조합이다.\n\n```\napp/                 # 파일 기반 라우팅\n├── _layout.tsx\n├── index.tsx\n├── (tabs)/\n└── +not-found.tsx\ncomponents/\nhooks/\nassets/\napp.json\n```\n\n`app.json`의 핵심만 맞춘다.\n\n```json\n{\n  \"expo\": {\n    \"name\": \"MyApp\",\n    \"slug\": \"my-app\",\n    \"scheme\": \"myapp\",\n    \"version\": \"1.0.0\",\n    \"orientation\": \"portrait\",\n    \"platforms\": [\"ios\", \"android\"]\n  }\n}\n```\n\n첫 화면은 `View`와 `Text`다. 웹의 `div`/`span`에 가깝다. `className`은 기본이 아니다.\n\n```tsx\n// app/index.tsx\nimport { Text, View, StyleSheet } from 'react-native';\n\nexport default function HomeScreen() {\n  return (\n    \u003cView style={styles.container}\u003e\n      \u003cText style={styles.title}\u003eHello, React Native\u003c/Text\u003e\n    \u003c/View\u003e\n  );\n}\n\nconst styles = StyleSheet.create({\n  container: {\n    flex: 1,\n    alignItems: 'center',\n    justifyContent: 'center',\n    backgroundColor: '#0f172a',\n  },\n  title: {\n    fontSize: 24,\n    fontWeight: '700',\n    color: '#f8fafc',\n  },\n});\n```\n\n개발 루프:\n\n```bash\nnpx expo start\n# a: Android / i: iOS / w: web\n# r: reload\n```\n\n저장하면 Fast Refresh가 반영한다. 실기기는 같은 Wi-Fi, 안 되면 tunnel 모드를 쓴다.\n\nTypeScript는 props·API·라우트 파라미터에 타입을 거는 용도다.\n\n```tsx\ntype User = {\n  id: string;\n  name: string;\n};\n\nfunction greet(user: User): string {\n  return `Hi, ${user.name}`;\n}\n```\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| Bare CLI부터 시작 | 먼저 Expo. 막힐 때만 prebuild |\n| 웹처럼 `div`/`span` | `View`/`Text`. 문자열은 반드시 `Text` 안 |\n| CSS 파일·className | `StyleSheet`. NativeWind는 팀 합의 후 |\n| `ios/`/`android/`를 바로 커밋 | managed를 유지. 필요 시 CNG/prebuild |\n| 시크릿을 `app.json`에 넣기 | `EXPO_PUBLIC_*`만 클라이언트. 비밀은 서버 |\n\n웹 CSS 감각을 그대로 가져오면 레이아웃이 깨진다. Flex 기본 방향이 **세로(`column`)** 인 점부터 다시 익힌다. 다음 글에서 다룬다.\n\n---\n\n## 5. 정리\n\nReact Native 시작은 네이티브 프로젝트 생성이 아니다. **Expo + TypeScript + Expo Router**로 실행 루프를 고정하는 일이다.\n\n- Expo는 RN 툴체인이다. 나중에 EAS로 빌드·OTA를 붙인다.\n- 화면은 네이티브 뷰다. HTML/CSS가 아니다.\n- New Architecture는 켜 두고, 세부 API는 필요할 때 본다.\n\n## 연습\n\n1. Expo 프로젝트를 만들고 에뮬레이터 또는 실기기에서 실행한다.\n2. 홈 화면에 앱 이름과 버전 텍스트를 표시한다.\n3. `app.json`의 `name`, `scheme`을 바꾸고 반영을 확인한다.\n4. `User` 타입과 그 값을 그리는 작은 컴포넌트를 만든다.\n"])</script><script>self.__next_f.push([1,"56:T15dc,"])</script><script>self.__next_f.push([1,"# 컴포넌트·스타일·레이아웃 — Flex와 StyleSheet\n\n\u003e 요약: View·Text·StyleSheet와 Flexbox로 화면을 배치하고, 웹 CSS와 다른 점을 기준으로 레이아웃을 익힌다.\n\n---\n\n## 1. 왜 StyleSheet인가\n\n웹은 HTML + CSS다. React Native는 **컴포넌트 + 스타일 객체**다. 선택자, 캐스케이드, 클래스 조합이 없다.\n\n그래서 레이아웃은 Flexbox가 전부라고 봐도 된다. 그리드는 기본이 아니다. `display: block`도 없다. 모든 `View`가 이미 flex 컨테이너다.\n\n이 차이를 먼저 고정해야 카드, 헤더, 하단 버튼이 기대한 자리에 간다.\n\n---\n\n## 2. 핵심 개념\n\n| 컴포넌트 | 역할 | 웹 대응 |\n|----------|------|---------|\n| `View` | 컨테이너 | `div` |\n| `Text` | 텍스트. **필수** | `span` / `p` |\n| `Image` | 이미지 | `img` |\n| `Pressable` | 터치 | `button` |\n| `ScrollView` | 짧은 스크롤 | overflow 스크롤 |\n| `TextInput` | 입력 | `input` |\n| `FlatList` | 긴 리스트 | 가상화 리스트 |\n\n문자열은 반드시 `Text` 안에 둔다. `View` 직하 텍스트는 에러다.\n\n웹 CSS와 다른 점:\n\n- 단위는 **dp**(밀도 독립 픽셀). `px` 문자열을 쓰지 않는다. 숫자만 넣는다.\n- 기본 `flexDirection`은 **`column`**. 웹의 `row`가 아니다.\n- 스타일 상속은 거의 없다. `Text`가 부모 `Text`를 일부 물려받는 정도다.\n- 배열로 합친다: `style={[styles.card, compact \u0026\u0026 styles.compact]}`.\n\n화면 가장자리(노치, 홈 인디케이터)는 `SafeAreaView`로 피한다. `react-native-safe-area-context`가 사실상 필수다.\n\n---\n\n## 3. 예제\n\n버튼은 `Button`보다 `Pressable`을 쓴다. 스타일 여지가 크다.\n\n```tsx\nimport { View, Text, Pressable, StyleSheet } from 'react-native';\n\nexport function CounterButton({\n  onPress,\n  label,\n}: {\n  onPress: () =\u003e void;\n  label: string;\n}) {\n  return (\n    \u003cPressable\n      onPress={onPress}\n      style={({ pressed }) =\u003e [styles.btn, pressed \u0026\u0026 styles.pressed]}\n      accessibilityRole=\"button\"\n      accessibilityLabel={label}\n    \u003e\n      \u003cText style={styles.label}\u003e{label}\u003c/Text\u003e\n    \u003c/Pressable\u003e\n  );\n}\n\nconst styles = StyleSheet.create({\n  btn: {\n    paddingVertical: 12,\n    paddingHorizontal: 16,\n    borderRadius: 12,\n    backgroundColor: '#38bdf8',\n  },\n  pressed: { opacity: 0.8 },\n  label: { fontSize: 16, fontWeight: '600', color: '#0f172a' },\n});\n```\n\n가로 배치는 명시적으로 `row`를 켠다.\n\n```tsx\nconst layout = StyleSheet.create({\n  row: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    justifyContent: 'space-between',\n    gap: 8,\n  },\n  grow: { flex: 1 },\n  screen: { flex: 1 },\n});\n```\n\n- `justifyContent`: 주축\n- `alignItems`: 교차축\n- `flex: 1`: 부모가 높이를 가질 때 남은 공간\n\n이미지는 크기를 정해야 한다. 원격은 width/height가 없으면 안 보인다.\n\n```tsx\nimport { Image } from 'expo-image';\n\n\u003cImage\n  source=\"https://example.com/pic.jpg\"\n  style={{ width: '100%', height: 200 }}\n  contentFit=\"cover\"\n  transition={200}\n/\u003e\n```\n\n로컬은 `require`다. 캐시·성능은 `expo-image`가 `Image`보다 낫다.\n\n```bash\nnpx expo install expo-image\n```\n\n폼이 키보드에 가리면 `KeyboardAvoidingView`를 쓴다. iOS만 `padding`이 잘 맞는 경우가 많다.\n\n```tsx\nimport { KeyboardAvoidingView, Platform, ScrollView } from 'react-native';\nimport { SafeAreaView } from 'react-native-safe-area-context';\n\n\u003cSafeAreaView style={{ flex: 1 }}\u003e\n  \u003cKeyboardAvoidingView\n    style={{ flex: 1 }}\n    behavior={Platform.OS === 'ios' ? 'padding' : undefined}\n  \u003e\n    \u003cScrollView\n      contentContainerStyle={{ padding: 16 }}\n      keyboardShouldPersistTaps=\"handled\"\n    \u003e\n      {/* TextInput */}\n    \u003c/ScrollView\u003e\n  \u003c/KeyboardAvoidingView\u003e\n\u003c/SafeAreaView\u003e\n```\n\n그림자는 플랫폼이 다르다.\n\n```tsx\nimport { Platform, StyleSheet } from 'react-native';\n\nconst shadow = StyleSheet.create({\n  box: Platform.select({\n    ios: {\n      shadowColor: '#000',\n      shadowOpacity: 0.15,\n      shadowRadius: 8,\n      shadowOffset: { width: 0, height: 4 },\n    },\n    android: { elevation: 4 },\n    default: {},\n  }),\n});\n```\n\n색과 간격은 토큰으로 모은다. 다크 모드·리브랜드가 쉬워진다.\n\n```tsx\nexport const colors = {\n  bg: '#0f172a',\n  text: '#f8fafc',\n  primary: '#38bdf8',\n} as const;\n\nexport const spacing = { sm: 8, md: 16, lg: 24 } as const;\n```\n\n터치 영역은 대략 44pt. NativeWind(Tailwind 문법)는 팀 합의 후다. 기본 학습은 StyleSheet이다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| `flexDirection`을 웹처럼 row로 가정 | 기본은 column. row는 명시 |\n| `ScrollView` + `map`으로 긴 목록 | `FlatList`. 다음 글 |\n| 원격 `Image`에 크기 없음 | width/height 또는 `expo-image` |\n| 루트에 `flex: 1` 없이 자식만 flex | 부모 높이부터 채운다 |\n| 노치를 `paddingTop: 40`으로 땜질 | `SafeAreaView` |\n| CSS처럼 자식이 폰트 상속 | 각 `Text`에 스타일을 준다 |\n\n---\n\n## 5. 정리\n\nRN 레이아웃은 CSS를 옮긴 것이 아니다. **숫자 단위 + column Flex + StyleSheet 배열**이 기본 문법이다.\n\n- `View`/`Text`/`Pressable`만으로 대부분의 화면을 만든다.\n- 화면 가득은 조상부터 `flex: 1`.\n- 플랫폼 차이는 `Platform.select`. 색은 토큰.\n\n## 연습\n\n1. 이미지·제목·가격·버튼이 있는 카드를 Flex로 만든다.\n2. `SafeAreaView`로 헤더 / 본문 / 하단 CTA를 나눈다.\n3. iOS·Android 그림자를 `Platform.select`로 맞춘다.\n4. `expo-image`로 원격 이미지를 표시한다.\n"])</script><script>self.__next_f.push([1,"57:T1703,"])</script><script>self.__next_f.push([1,"# 상태·훅·폼 — 사용자 입력과 데이터 흐름\n\n\u003e 요약: 화면 상태는 훅에 두고, 폼 입력은 검증과 키보드 UX까지 한 흐름으로 만든다.\n\n---\n\n## 1. 왜 상태를 나누나\n\n입력은 로컬 상태다. 게시글 목록은 서버 상태다. 둘을 `useState` 하나로 섞으면 로딩·동기화 버그가 난다.\n\n웹과 같은 React 훅을 쓴다. 차이는 **키보드, 자동완성, 포커스 이동**이 폼 UX의 중심이라는 점이다.\n\n필드가 두세 개면 `useState`로 충분하다. 필드가 늘고 검증이 생기면 `react-hook-form` + zod가 기본선이다.\n\n---\n\n## 2. 핵심 개념\n\n| 범위 | 수단 |\n|------|------|\n| 한 화면 UI | `useState` |\n| 부모→자식 | props |\n| 멀리 공유 | Context, Zustand |\n| 서버 데이터 | React Query (다음 글) |\n| 다필드 폼 | `react-hook-form` |\n\n계산으로 나오는 값은 state로 두지 않는다.\n\n```tsx\nconst [count, setCount] = useState(0);\nconst doubled = count * 2;\n```\n\n객체는 이전 값을 펼친다.\n\n```tsx\nsetUser((prev) =\u003e ({ ...prev, name }));\n```\n\n`useRef`는 DOM이 아니라 **컴포넌트 인스턴스**다. `TextInput`에 포커스를 옮길 때 쓴다. 렌더와 무관한 이전 값 보관에도 쓴다.\n\n`useEffect`는 구독과 정리용이다. 마운트마다 `fetch` + `setState`로 서버를 따라가는 패턴은 지양한다.\n\n---\n\n## 3. 예제\n\n로그인 필드 두 개:\n\n```tsx\nimport { useState } from 'react';\nimport { TextInput, Text, View, Pressable, ActivityIndicator } from 'react-native';\n\nexport function LoginForm({\n  onSubmit,\n}: {\n  onSubmit: (email: string, password: string) =\u003e Promise\u003cvoid\u003e;\n}) {\n  const [email, setEmail] = useState('');\n  const [password, setPassword] = useState('');\n  const [error, setError] = useState\u003cstring | null\u003e(null);\n  const [loading, setLoading] = useState(false);\n\n  const handleSubmit = async () =\u003e {\n    if (!email.includes('@')) {\n      setError('이메일 형식을 확인하세요');\n      return;\n    }\n    setError(null);\n    setLoading(true);\n    try {\n      await onSubmit(email.trim(), password);\n    } finally {\n      setLoading(false);\n    }\n  };\n\n  return (\n    \u003cView style={{ gap: 12 }}\u003e\n      \u003cTextInput\n        value={email}\n        onChangeText={setEmail}\n        placeholder=\"email\"\n        autoCapitalize=\"none\"\n        keyboardType=\"email-address\"\n        textContentType=\"emailAddress\"\n        returnKeyType=\"next\"\n      /\u003e\n      \u003cTextInput\n        value={password}\n        onChangeText={setPassword}\n        placeholder=\"password\"\n        secureTextEntry\n        textContentType=\"password\"\n        returnKeyType=\"done\"\n        onSubmitEditing={handleSubmit}\n      /\u003e\n      {error ? \u003cText style={{ color: 'tomato' }}\u003e{error}\u003c/Text\u003e : null}\n      \u003cPressable onPress={handleSubmit} disabled={loading}\u003e\n        {loading ? \u003cActivityIndicator /\u003e : \u003cText\u003e로그인\u003c/Text\u003e}\n      \u003c/Pressable\u003e\n    \u003c/View\u003e\n  );\n}\n```\n\n`textContentType` / `autoComplete`는 비밀번호 매니저 대응에 도움이 된다.\n\n다음 필드로 포커스:\n\n```tsx\nconst passwordRef = useRef\u003cTextInput\u003e(null);\n\n\u003cTextInput\n  returnKeyType=\"next\"\n  onSubmitEditing={() =\u003e passwordRef.current?.focus()}\n/\u003e\n\u003cTextInput ref={passwordRef} secureTextEntry /\u003e\n```\n\n검증이 커지면 스키마를 한곳으로 모은다.\n\n```bash\nnpx expo install react-hook-form zod @hookform/resolvers\n```\n\n```tsx\nimport { useForm, Controller } from 'react-hook-form';\nimport { z } from 'zod';\nimport { zodResolver } from '@hookform/resolvers/zod';\n\nconst schema = z.object({\n  email: z.string().email(),\n  password: z.string().min(8),\n});\n\ntype FormValues = z.infer\u003ctypeof schema\u003e;\n\nexport function SignupForm() {\n  const { control, handleSubmit, formState: { errors } } = useForm\u003cFormValues\u003e({\n    resolver: zodResolver(schema),\n    defaultValues: { email: '', password: '' },\n  });\n\n  return (\n    \u003c\u003e\n      \u003cController\n        control={control}\n        name=\"email\"\n        render={({ field: { onChange, onBlur, value } }) =\u003e (\n          \u003cTextInput value={value} onBlur={onBlur} onChangeText={onChange} /\u003e\n        )}\n      /\u003e\n      {errors.email ? \u003cText\u003e{errors.email.message}\u003c/Text\u003e : null}\n      \u003cPressable onPress={handleSubmit((data) =\u003e console.log(data))} /\u003e\n    \u003c/\u003e\n  );\n}\n```\n\n키보드 UX 체크:\n\n- `returnKeyType=\"next\" | \"done\"`\n- `onSubmitEditing`으로 다음 포커스\n- `Keyboard.dismiss()`\n- `ScrollView`에 `keyboardShouldPersistTaps=\"handled\"`\n- 제출 중 버튼 비활성\n\n반복 UI 로직만 훅으로 뺀다.\n\n```tsx\nfunction useToggle(initial = false) {\n  const [on, setOn] = useState(initial);\n  const toggle = useCallback(() =\u003e setOn((v) =\u003e !v), []);\n  return { on, toggle, setOn };\n}\n```\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 서버 목록을 `useEffect` + `setState` | React Query |\n| 파생 값을 또 `useState` | 렌더 중 계산 |\n| `onChange` (웹) | `onChangeText` |\n| 로딩 중에도 제출 가능 | `disabled` + 스피너 |\n| 모든 필드를 전역 스토어 | 폼은 로컬. 제출 결과만 공유 |\n| `useEffect`로 입력값을 다른 state에 복사 | 한 곳만 진실로 둔다 |\n\n구독은 정리 함수를 같이 둔다.\n\n```tsx\nuseEffect(() =\u003e {\n  const sub = AppState.addEventListener('change', onChange);\n  return () =\u003e sub.remove();\n}, []);\n```\n\n---\n\n## 5. 정리\n\n상태는 **누가 소유하는가**가 먼저다. 입력은 화면, 서버 데이터는 Query, 세션만 전역에 가깝게 둔다.\n\n- 작은 폼: `useState` + 에러 메시지.\n- 큰 폼: `react-hook-form` + zod.\n- 키보드는 `returnKeyType`, 포커스, AvoidingView가 한 세트다.\n\n## 연습\n\n1. 이메일·비밀번호·에러·로딩이 있는 로그인 폼을 만든다.\n2. zod + react-hook-form으로 회원가입 검증을 붙인다.\n3. `useRef`로 비밀번호 필드 자동 포커스를 구현한다.\n4. `useToggle`로 비밀번호 표시/숨김을 만든다.\n"])</script><script>self.__next_f.push([1,"58:T1515,"])</script><script>self.__next_f.push([1,"# 리스트·네비게이션 — FlatList와 Expo Router\n\n\u003e 요약: 긴 목록은 FlatList로 가상화하고, 화면 이동은 Expo Router의 파일 기반 라우팅으로 구성한다.\n\n---\n\n## 1. 왜 FlatList와 파일 라우팅인가\n\n목록이 길어지면 웹처럼 `map`으로 전부 그리면 안 된다. 화면에 안 보이는 행까지 마운트되어 스크롤이 끊긴다. **FlatList**는 보이는 근처만 렌더한다.\n\n화면 이동은 **Expo Router**가 기본이다. `app/` 폴더가 URL이 된다. Next.js App Router와 감각이 비슷하다. React Navigation을 직접 짜는 것보다 파일 구조가 문서가 된다.\n\n둘을 같이 익혀야 “목록에서 상세로”가 한 흐름이 된다.\n\n---\n\n## 2. 핵심 개념\n\n| 컴포넌트 | 언제 |\n|----------|------|\n| `ScrollView` | 짧은 고정 콘텐츠 |\n| `FlatList` | 긴 동종 리스트. **기본** |\n| `SectionList` | 섹션 헤더가 있는 목록 |\n| `FlashList` | 더 공격적인 가상화 (Shopify) |\n\n라우트는 파일이 경로다. 괄호 폴더 `(tabs)`는 URL에 안 나온다. `[id]`는 동적 세그먼트다.\n\n이동은 `Link` 또는 `router.push`. 큰 객체를 params에 넣지 않는다. id만 넘기고 상세는 캐시나 fetch로 채운다.\n\n인증 분기는 레이아웃에서 한다. 각 화면마다 `if (!user)`를 반복하지 않는다.\n\n딥링크는 `app.json`의 `scheme`이다. `myapp://posts/1`처럼 연다. HTTPS 유니버설 링크는 스토어·도메인 검증이 필요하다.\n\n---\n\n## 3. 예제\n\n```tsx\nimport { FlatList, Text, View } from 'react-native';\n\ntype Item = { id: string; title: string };\n\nexport function PostList({ data }: { data: Item[] }) {\n  return (\n    \u003cFlatList\n      data={data}\n      keyExtractor={(item) =\u003e item.id}\n      renderItem={({ item }) =\u003e (\n        \u003cView style={{ padding: 16 }}\u003e\n          \u003cText\u003e{item.title}\u003c/Text\u003e\n        \u003c/View\u003e\n      )}\n      ItemSeparatorComponent={() =\u003e (\n        \u003cView style={{ height: 1, backgroundColor: '#e2e8f0' }} /\u003e\n      )}\n      ListEmptyComponent={\u003cText style={{ padding: 24 }}\u003e게시글이 없습니다\u003c/Text\u003e}\n      contentContainerStyle={{ flexGrow: 1 }}\n    /\u003e\n  );\n}\n```\n\n행 높이가 고정이면 `getItemLayout`으로 스크롤 측정 비용을 줄인다. 행 컴포넌트는 `memo`를 검토한다.\n\n```tsx\n\u003cFlatList\n  initialNumToRender={10}\n  windowSize={7}\n  removeClippedSubviews\n  getItemLayout={(_, index) =\u003e ({\n    length: ROW_HEIGHT,\n    offset: ROW_HEIGHT * index,\n    index,\n  })}\n/\u003e\n```\n\n당겨서 새로고침과 무한 스크롤:\n\n```tsx\n\u003cFlatList\n  refreshing={refreshing}\n  onRefresh={onRefresh}\n  onEndReached={loadMore}\n  onEndReachedThreshold={0.3}\n  ListFooterComponent={isFetchingNextPage ? \u003cActivityIndicator /\u003e : null}\n/\u003e\n```\n\n페이지 데이터는 React Query `useInfiniteQuery`와 맞는다.\n\n폴더 예시:\n\n```\napp/\n├── _layout.tsx\n├── index.tsx\n├── (auth)/\n│   ├── _layout.tsx\n│   └── login.tsx\n├── (tabs)/\n│   ├── _layout.tsx\n│   ├── index.tsx\n│   └── settings.tsx\n└── posts/\n    ├── index.tsx\n    └── [id].tsx\n```\n\n```tsx\n// app/_layout.tsx\nimport { Stack } from 'expo-router';\n\nexport default function RootLayout() {\n  return (\n    \u003cStack screenOptions={{ headerShown: false }}\u003e\n      \u003cStack.Screen name=\"(tabs)\" /\u003e\n      \u003cStack.Screen name=\"(auth)\" /\u003e\n      \u003cStack.Screen name=\"posts/[id]\" options={{ headerShown: true, title: 'Post' }} /\u003e\n    \u003c/Stack\u003e\n  );\n}\n```\n\n```tsx\n// app/(tabs)/_layout.tsx\nimport { Tabs } from 'expo-router';\n\nexport default function TabsLayout() {\n  return (\n    \u003cTabs\u003e\n      \u003cTabs.Screen name=\"index\" options={{ title: 'Home' }} /\u003e\n      \u003cTabs.Screen name=\"settings\" options={{ title: 'Settings' }} /\u003e\n    \u003c/Tabs\u003e\n  );\n}\n```\n\n이동과 파라미터:\n\n```tsx\nimport { Link, router, useLocalSearchParams } from 'expo-router';\n\n\u003cLink href={`/posts/${id}`}\u003e열기\u003c/Link\u003e\nrouter.push(`/posts/${id}`);\nrouter.replace('/login');\nrouter.back();\n```\n\n```tsx\n// app/posts/[id].tsx\nexport default function PostDetail() {\n  const { id } = useLocalSearchParams\u003c{ id: string }\u003e();\n  return \u003cText\u003ePost {id}\u003c/Text\u003e;\n}\n```\n\n로그인 전후 분기(버전별 API는 `Redirect`로도 가능):\n\n```tsx\nimport { Redirect } from 'expo-router';\n\nif (isLoading) return \u003cSplash /\u003e;\nif (!user) return \u003cRedirect href=\"/login\" /\u003e;\n```\n\ntyped routes 옵션을 켜면 `href` 자동완성이 좋아진다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| `ScrollView` + 수천 개 `map` | `FlatList` / `FlashList` |\n| `keyExtractor`를 index로만 | 안정적 `id` |\n| 상세에 객체 전체 params | `id` + Query 캐시 |\n| 모든 화면에 로그인 가드 | 루트/그룹 레이아웃 |\n| 인라인 `renderItem` + 인라인 style 과다 | 행 컴포넌트 분리, `memo` |\n| 빈 목록에 높이 0 | `contentContainerStyle={{ flexGrow: 1 }}` |\n\n---\n\n## 5. 정리\n\n목록은 가상화, 화면은 파일이다. 이 두 규칙이면 피드·상세·탭의 뼈대가 끝난다.\n\n- 짧은 스크롤만 `ScrollView`.\n- 탭은 `(tabs)`, 인가는 `(auth)`, 상세는 `[id]`.\n- params는 식별자만. 데이터는 fetch.\n\n## 연습\n\n1. `FlatList`로 50개 이상 아이템 리스트를 만든다.\n2. pull-to-refresh와 empty 상태를 구현한다.\n3. 탭 + `posts/[id]` 상세를 Expo Router로 연결한다.\n4. 로그인 여부에 따라 `(auth)` / `(tabs)`로 보낸다.\n"])</script><script>self.__next_f.push([1,"59:T1632,"])</script><script>self.__next_f.push([1,"# 네트워킹 — Fetch, React Query, 에러 처리\n\n\u003e 요약: 서버 데이터는 fetch 래퍼와 React Query로 가져와 로딩·에러·재시도를 표준화한다.\n\n---\n\n## 1. 왜 React Query인가\n\n게시글 목록·프로필은 **서버가 원본**이다. 모달 열림·토글은 **클라이언트가 원본**이다.\n\n서버 상태를 `useState` + `useEffect`로 따라가면 캐시, 재시도, 화면 복귀 시 갱신을 직접 짜게 된다. **TanStack Query**(React Query)가 그 층을 표준화한다.\n\n앱에는 `fetch` 한 곳이 있으면 된다. 상태 코드, JSON, 토큰 헤더를 화면마다 반복하지 않는다.\n\n---\n\n## 2. 핵심 개념\n\n| 종류 | 예 | 도구 |\n|------|----|------|\n| 서버 상태 | 목록, 프로필 | `useQuery` / `useMutation` |\n| 클라이언트 상태 | 모달, 마법사 단계 | `useState` / Zustand |\n\n`queryKey`가 캐시 주소다. 같은 키면 같은 데이터다. mutation이 성공하면 관련 키를 `invalidate`한다.\n\nExpo 환경변수는 `EXPO_PUBLIC_*`만 클라이언트에 노출된다. API 베이스 URL은 공개돼도 된다. 비밀키는 넣지 않는다.\n\nRN은 브라우저 탭 포커스가 없다. 앱이 다시 `active`가 될 때 Query에 알려 주면 목록이 신선해진다.\n\n401은 토큰 갱신 또는 로그아웃이다. 토큰 저장은 다음 글의 SecureStore다.\n\n---\n\n## 3. 예제\n\n```tsx\n// lib/api.ts\nconst API_URL = process.env.EXPO_PUBLIC_API_URL;\n\nexport class ApiError extends Error {\n  constructor(\n    public status: number,\n    message: string,\n    public body?: unknown,\n  ) {\n    super(message);\n  }\n}\n\nexport async function api\u003cT\u003e(\n  path: string,\n  options: RequestInit \u0026 { token?: string } = {},\n): Promise\u003cT\u003e {\n  const { token, headers, ...rest } = options;\n\n  const res = await fetch(`${API_URL}${path}`, {\n    ...rest,\n    headers: {\n      'Content-Type': 'application/json',\n      ...(token ? { Authorization: `Bearer ${token}` } : {}),\n      ...headers,\n    },\n  });\n\n  if (!res.ok) {\n    const body = await res.json().catch(() =\u003e undefined);\n    throw new ApiError(res.status, 'Request failed', body);\n  }\n\n  if (res.status === 204) return undefined as T;\n  return res.json() as Promise\u003cT\u003e;\n}\n```\n\n```env\nEXPO_PUBLIC_API_URL=https://api.example.com\n```\n\n```bash\nnpx expo install @tanstack/react-query\n```\n\n루트에 Provider를 둔다.\n\n```tsx\nimport { QueryClient, QueryClientProvider } from '@tanstack/react-query';\n\nconst queryClient = new QueryClient({\n  defaultOptions: {\n    queries: { staleTime: 30_000, retry: 1 },\n  },\n});\n\nexport default function RootLayout() {\n  return (\n    \u003cQueryClientProvider client={queryClient}\u003e\n      {/* Stack */}\n    \u003c/QueryClientProvider\u003e\n  );\n}\n```\n\n조회와 생성:\n\n```tsx\nfunction usePosts() {\n  return useQuery({\n    queryKey: ['posts'],\n    queryFn: () =\u003e api\u003cPost[]\u003e('/posts'),\n  });\n}\n\nfunction useCreatePost(token: string) {\n  const qc = useQueryClient();\n  return useMutation({\n    mutationFn: (input: CreatePostInput) =\u003e\n      api\u003cPost\u003e('/posts', {\n        method: 'POST',\n        body: JSON.stringify(input),\n        token,\n      }),\n    onSuccess: () =\u003e qc.invalidateQueries({ queryKey: ['posts'] }),\n  });\n}\n```\n\n화면은 상태별로 UI를 나눈다.\n\n```tsx\nconst { data, isPending, isError, error, refetch } = usePosts();\n\nif (isPending) return \u003cActivityIndicator /\u003e;\nif (isError) return \u003cErrorView message={error.message} onRetry={refetch} /\u003e;\nreturn \u003cPostList data={data} /\u003e;\n```\n\n무한 스크롤:\n\n```tsx\nconst {\n  data,\n  fetchNextPage,\n  hasNextPage,\n  isFetchingNextPage,\n} = useInfiniteQuery({\n  queryKey: ['posts', 'infinite'],\n  initialPageParam: 1,\n  queryFn: ({ pageParam }) =\u003e api\u003cPostPage\u003e(`/posts?page=${pageParam}`),\n  getNextPageParam: (last) =\u003e last.nextPage ?? undefined,\n});\n\nconst items = data?.pages.flatMap((p) =\u003e p.items) ?? [];\n```\n\n`FlatList`의 `onEndReached`에서 `hasNextPage`일 때만 `fetchNextPage`를 호출한다.\n\n앱 포커스:\n\n```tsx\nimport { focusManager } from '@tanstack/react-query';\nimport { AppState } from 'react-native';\n\nfocusManager.setEventListener((handleFocus) =\u003e {\n  const sub = AppState.addEventListener('change', (state) =\u003e {\n    handleFocus(state === 'active');\n  });\n  return () =\u003e sub.remove();\n});\n```\n\n토큰이 있을 때만 프로필을 가져온다.\n\n```tsx\nuseQuery({\n  queryKey: ['me'],\n  queryFn: () =\u003e api('/me', { token }),\n  enabled: !!token,\n});\n```\n\n| 상태 | UI |\n|------|----|\n| 최초 pending | 스켈레톤/스피너 |\n| error | 메시지 + 재시도 |\n| empty | 빈 화면 CTA |\n| 백그라운드 fetching | 리스트 유지 + 약한 인디케이터 |\n| mutation pending | 버튼 비활성 |\n\n에러를 `alert()`만으로 끝내지 않는다. 화면 폴백을 둔다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 화면마다 `fetch` 복사 | `api()` 한 곳 |\n| 서버 데이터를 전역 Zustand에 복제 | Query 캐시가 원본 |\n| `queryKey`를 매번 다른 객체로 | 안정적 배열 `['posts', id]` |\n| 생성 후 목록이 안 바뀜 | `invalidateQueries` |\n| 비밀키를 `EXPO_PUBLIC_` | 서버만 보유 |\n| 401을 일반 에러 메시지로만 | 세션 정리 또는 갱신 |\n\n---\n\n## 5. 정리\n\n네트워크 층은 **얇은 `api()` + Query 훅**이면 된다. 화면은 pending/error/empty만 그린다.\n\n- 서버 상태와 UI 상태를 섞지 않는다.\n- 토큰은 헤더로만. 저장 위치는 SecureStore.\n- 무한 스크롤은 `useInfiniteQuery` + `onEndReached`.\n\n## 연습\n\n1. `api()`와 `ApiError`를 만든다.\n2. 게시글 목록 `useQuery`에 로딩·에러 UI를 붙인다.\n3. 생성 `useMutation` 후 목록을 invalidate한다.\n4. `useInfiniteQuery`와 FlatList를 연결한다.\n"])</script><script>self.__next_f.push([1,"5a:T17d0,"])</script><script>self.__next_f.push([1,"# 인증·보안 저장소·디바이스 권한\n\n\u003e 요약: 로그인 토큰은 SecureStore에 두고, 카메라·앨범·알림 권한은 필요할 때만 요청한다.\n\n---\n\n## 1. 왜 지금 권한과 저장소를 나누나\n\n웹은 쿠키·httpOnly로 세션을 숨길 여지가 있다. 앱은 토큰을 기기에 둬야 자동 로그인이 된다. 일반 저장소에 넣으면 백업·루팅·로그에 노출되기 쉽다.\n\n**SecureStore**는 운영체제 보안 저장소에 작은 비밀 값을 넣는 Expo 모듈이다. iOS는 Keychain, Android는 Keystore 계열이다. access token처럼 짧은 비밀에 쓴다.\n\n권한(카메라, 앨범, 알림)은 앱 시작 시 한꺼번에 묻지 않는다. **쓰는 화면에서** 이유를 말한 뒤 시스템 다이얼로그를 띄운다.\n\n---\n\n## 2. 핵심 개념\n\n| 금지 | 권장 |\n|------|------|\n| AsyncStorage에 access token | SecureStore |\n| 소스에 API 시크릿 | 백엔드만 |\n| 로그에 토큰·개인정보 | 마스킹 |\n| 실행 직후 모든 권한 | 필요 시점 요청 |\n\n세션은 Provider 한 곳이 소유한다. 시작 시 SecureStore에서 토큰을 읽고 `/me`로 복구한다. 실패하면 지운다.\n\n생체 인증은 **로컬 잠금**이다. 서버 로그인을 대체하지 않는다. 지문 성공이 곧 API 인증은 아니다.\n\n웹 타깃이면 SecureStore가 없다. `Platform` 분기 또는 쿠키 세션이 필요하다.\n\n권한 거부 후에는 설정 앱으로 보내는 UI가 필요하다. 시스템 다이얼로그는 한 번 거절되면 다시 안 뜨는 경우가 많다.\n\n---\n\n## 3. 예제\n\n```bash\nnpx expo install expo-secure-store\n```\n\n```tsx\nimport * as SecureStore from 'expo-secure-store';\n\nconst TOKEN_KEY = 'access_token';\n\nexport async function saveToken(token: string) {\n  await SecureStore.setItemAsync(TOKEN_KEY, token);\n}\n\nexport async function loadToken() {\n  return SecureStore.getItemAsync(TOKEN_KEY);\n}\n\nexport async function clearToken() {\n  await SecureStore.deleteItemAsync(TOKEN_KEY);\n}\n```\n\n큰 JSON을 SecureStore에 넣지 않는다. 토큰 문자열만 둔다.\n\n```tsx\ntype AuthState = {\n  user: User | null;\n  token: string | null;\n  isLoading: boolean;\n  signIn: (email: string, password: string) =\u003e Promise\u003cvoid\u003e;\n  signOut: () =\u003e Promise\u003cvoid\u003e;\n};\n\nexport function AuthProvider({ children }: { children: React.ReactNode }) {\n  const [token, setToken] = useState\u003cstring | null\u003e(null);\n  const [user, setUser] = useState\u003cUser | null\u003e(null);\n  const [isLoading, setIsLoading] = useState(true);\n\n  useEffect(() =\u003e {\n    (async () =\u003e {\n      const t = await loadToken();\n      if (t) {\n        setToken(t);\n        try {\n          setUser(await api\u003cUser\u003e('/me', { token: t }));\n        } catch {\n          await clearToken();\n          setToken(null);\n        }\n      }\n      setIsLoading(false);\n    })();\n  }, []);\n\n  const signIn = async (email: string, password: string) =\u003e {\n    const res = await api\u003c{ token: string; user: User }\u003e('/auth/login', {\n      method: 'POST',\n      body: JSON.stringify({ email, password }),\n    });\n    await saveToken(res.token);\n    setToken(res.token);\n    setUser(res.user);\n  };\n\n  const signOut = async () =\u003e {\n    await clearToken();\n    queryClient.clear();\n    setToken(null);\n    setUser(null);\n  };\n\n  return (\n    \u003cAuthContext.Provider value={{ user, token, isLoading, signIn, signOut }}\u003e\n      {children}\n    \u003c/AuthContext.Provider\u003e\n  );\n}\n```\n\n`isLoading` 동안 라우트를 바꾸지 않는다. 로그인 화면이 깜빡인다. `expo-splash-screen`으로 네이티브 스플래시를 유지할 수 있다.\n\n소셜 로그인은 인가 코드를 **서버에 넘겨** 토큰을 받는다. 클라이언트에 장기 시크릿을 두지 않는다.\n\n```bash\nnpx expo install expo-auth-session expo-web-browser expo-crypto\n```\n\n생체 잠금(선택):\n\n```bash\nnpx expo install expo-local-authentication\n```\n\n```tsx\nconst ok = await LocalAuthentication.authenticateAsync({\n  promptMessage: '잠금 해제',\n});\nif (ok.success) {\n  // 앱 잠금만 해제. 서버 세션과는 별개\n}\n```\n\n앨범은 쓰는 순간에 요청한다.\n\n```bash\nnpx expo install expo-image-picker\n```\n\n```tsx\nconst perm = await ImagePicker.requestMediaLibraryPermissionsAsync();\nif (!perm.granted) {\n  // 왜 필요한지 안내 후 Linking.openSettings()\n  return;\n}\n\nconst result = await ImagePicker.launchImageLibraryAsync({\n  mediaTypes: ['images'],\n  quality: 0.8,\n});\n```\n\n흐름: 사전 설명 → 시스템 다이얼로그 → 거부 시 설정 이동.\n\n`app.json`에 용도 문구가 없으면 스토어에서 거절된다.\n\n```json\n{\n  \"expo\": {\n    \"plugins\": [\n      [\n        \"expo-image-picker\",\n        {\n          \"photosPermission\": \"프로필 사진을 올리려면 사진첩이 필요합니다.\"\n        }\n      ]\n    ],\n    \"ios\": {\n      \"infoPlist\": {\n        \"NSCameraUsageDescription\": \"게시글에 사진을 찍기 위해 카메라가 필요합니다.\"\n      }\n    }\n  }\n}\n```\n\n푸시 토큰은 실기기에서 테스트한다. 에뮬레이터 제약이 있다. 탭 시 딥링크는 라우터와 맞춘다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| AsyncStorage에 토큰 | SecureStore |\n| 시작 시 카메라·알림 한꺼번에 | 해당 버튼/화면에서 |\n| 권한 거부 후 아무 안내 없음 | 설정 이동 CTA |\n| 생체를 서버 로그인으로 착각 | 로컬 잠금만 |\n| 로그아웃 후 Query 캐시 잔류 | `queryClient.clear()` |\n| usage description 없이 플러그인 | `app.json` 문구 필수 |\n\n---\n\n## 5. 정리\n\n인증은 **토큰 위치 + 세션 복구 + 권한 시점**이다. UI보다 이 세 가지가 먼저다.\n\n- 비밀은 SecureStore. 장바구니는 AsyncStorage도 된다.\n- 스플래시가 끝날 때까지 가드를 보류한다.\n- 권한 문구는 코드와 `app.json`에 같이 있다.\n\n## 연습\n\n1. SecureStore로 로그인·자동 로그인·로그아웃을 구현한다.\n2. `AuthProvider`와 라우터 가드를 연결한다.\n3. 이미지 피커 거절 시 설정 안내를 만든다.\n4. (선택) 포그라운드 복귀 시 생체 잠금을 붙인다.\n"])</script><script>self.__next_f.push([1,"5b:T151f,"])</script><script>self.__next_f.push([1,"# 애니메이션·제스처·사용자 경험\n\n\u003e 요약: Reanimated와 Gesture Handler로 터치 피드백을 만들고, 햅틱·접근성까지 맞춘다.\n\n---\n\n## 1. 왜 Reanimated인가\n\n웹은 CSS transition과 메인 스레드가 가깝다. RN에서 `setState`로 매 프레임 위치를 바꾸면 JS 스레드가 막혀 터치가 늦다.\n\n복잡한 제스처와 60fps 애니메이션은 **react-native-reanimated**와 **react-native-gesture-handler**가 표준이다. 값을 UI 스레드에서 읽는다. Expo 템플릿에 이미 들어 있는 경우가 많다.\n\n모든 화면에 모션을 넣지 않는다. 누르기, 스와이프 삭제, 모달처럼 **의미가 있는 피드백**만 남긴다.\n\n---\n\n## 2. 핵심 개념\n\n- `useSharedValue`: UI 스레드가 읽는 값\n- `useAnimatedStyle`: 그 값 → 스타일\n- `withSpring` / `withTiming`: 목표까지 보간\n- worklet: UI 스레드에서 도는 함수\n\n제스처는 `GestureDetector`에 제스처 객체를 넘긴다. `Pan`, `Pinch`, `Tap`을 `Simultaneous` / `Exclusive`로 조합한다.\n\n레이아웃 애니메이션(`entering`/`exiting`)은 리스트 추가·삭제에 쓰면 이해가 된다. 매 화면 페이드는 피로하다.\n\nExpo Router의 native stack 전환은 기본으로 충분하다. 커스텀 트랜지션은 필요할 때만.\n\nOS “동작 줄이기”가 켜져 있으면 큰 애니메이션을 건너뛴다.\n\n---\n\n## 3. 예제\n\n```bash\nnpx expo install react-native-reanimated react-native-gesture-handler\n```\n\nBabel의 `reanimated/plugin`은 **마지막**에 둔다. 루트는 `GestureHandlerRootView`로 감싼다.\n\n```tsx\nimport { GestureHandlerRootView } from 'react-native-gesture-handler';\n\nexport default function Root() {\n  return (\n    \u003cGestureHandlerRootView style={{ flex: 1 }}\u003e\n      {/* app */}\n    \u003c/GestureHandlerRootView\u003e\n  );\n}\n```\n\n누르는 동안 살짝 줄어드는 버튼:\n\n```tsx\nimport Animated, {\n  useSharedValue,\n  useAnimatedStyle,\n  withSpring,\n} from 'react-native-reanimated';\nimport { Pressable } from 'react-native';\n\nexport function BounceButton({ children }: { children: React.ReactNode }) {\n  const scale = useSharedValue(1);\n  const style = useAnimatedStyle(() =\u003e ({\n    transform: [{ scale: scale.value }],\n  }));\n\n  return (\n    \u003cPressable\n      onPressIn={() =\u003e {\n        scale.value = withSpring(0.96);\n      }}\n      onPressOut={() =\u003e {\n        scale.value = withSpring(1);\n      }}\n    \u003e\n      \u003cAnimated.View style={style}\u003e{children}\u003c/Animated.View\u003e\n    \u003c/Pressable\u003e\n  );\n}\n```\n\n드래그:\n\n```tsx\nimport { Gesture, GestureDetector } from 'react-native-gesture-handler';\n\nexport function Draggable() {\n  const x = useSharedValue(0);\n  const y = useSharedValue(0);\n\n  const pan = Gesture.Pan().onChange((e) =\u003e {\n    x.value += e.changeX;\n    y.value += e.changeY;\n  });\n\n  const style = useAnimatedStyle(() =\u003e ({\n    transform: [{ translateX: x.value }, { translateY: y.value }],\n  }));\n\n  return (\n    \u003cGestureDetector gesture={pan}\u003e\n      \u003cAnimated.View\n        style={[{ width: 80, height: 80, backgroundColor: '#38bdf8' }, style]}\n      /\u003e\n    \u003c/GestureDetector\u003e\n  );\n}\n```\n\n실무에서 자주 쓰는 조합: 하단 시트, 스와이프 삭제, 핀치 줌.\n\n```tsx\nGesture.Simultaneous(pan, pinch);\nGesture.Exclusive(native, swipe);\n```\n\n리스트 행이 들어올 때:\n\n```tsx\nimport Animated, { LinearTransition, FadeIn, FadeOut } from 'react-native-reanimated';\n\n\u003cAnimated.View entering={FadeIn} exiting={FadeOut} layout={LinearTransition}\u003e\n  ...\n\u003c/Animated.View\u003e\n```\n\n모달 화면:\n\n```tsx\n\u003cStack.Screen name=\"compose\" options={{ presentation: 'modal' }} /\u003e\n```\n\n약한 햅틱:\n\n```bash\nnpx expo install expo-haptics\n```\n\n```tsx\nimport * as Haptics from 'expo-haptics';\n\nawait Haptics.impactAsync(Haptics.ImpactFeedbackStyle.Light);\nawait Haptics.notificationAsync(Haptics.NotificationFeedbackType.Success);\n```\n\n성공·삭제·토글에만 쓴다. 스크롤마다 울리면 방해다.\n\n로딩은 스피너보다 스켈레톤이 목록에서 체감이 낫다. mutation은 낙관적 업데이트 후 실패 시 롤백한다.\n\n최소 피드백은 opacity만으로도 된다.\n\n```tsx\nstyle={({ pressed }) =\u003e [{ opacity: pressed ? 0.7 : 1 }]}\n```\n\n접근성: `accessibilityLabel`, 포커스 순서, 동작 줄이기.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| `setState`로 매 프레임 좌표 | `useSharedValue` |\n| 루트에 GestureHandlerRootView 없음 | `_layout`에서 감싼다 |\n| Reanimated 플러그인 순서 | Babel 마지막 |\n| 모든 화면에 FadeIn | CTA·제스처만 |\n| worklet 안에서 `console.log` 남발 | 디버그 때만 |\n| 햅틱 남용 | 의미 있는 한두 곳 |\n\n애니메이션 중 무거운 JS(JSON 파싱, 큰 리스트 필터)는 버벅임의 원인이다. 이미지·그림자 과다도 같다. 리스트 행은 `memo`로 보호한다.\n\n---\n\n## 5. 정리\n\n모션은 장식이 아니라 **터치가 먹혔다는 신호**다. UI 스레드에서 돌리고, 접근성과 햅틱을 같이 본다.\n\n- Reanimated + Gesture Handler가 기본 조합이다.\n- 내비 전환은 native stack, 화면은 `presentation: 'modal'`.\n- 동작 줄이기가 켜져 있으면 큰 스프링을 끈다.\n\n## 연습\n\n1. Pressable 스프링 스케일 버튼을 만든다.\n2. 스와이프로 지울 수 있는 리스트 행을 구현한다.\n3. `presentation: 'modal'` 화면을 추가한다.\n4. 주요 CTA에 약한 햅틱을 붙인다.\n"])</script><script>self.__next_f.push([1,"5c:T1451,"])</script><script>self.__next_f.push([1,"# 상태 관리·아키텍처·모듈화\n\n\u003e 요약: 전역 상태를 최소화하고, 기능 단위 폴더와 Context·Zustand 선택 기준을 정리한다.\n\n---\n\n## 1. 왜 전역을 늦게 쓰나\n\n앱이 커지면 “일단 Redux”로 가기 쉽다. RN 신규 프로젝트에서 가장 흔한 실수다. 대부분은 로컬 상태와 서버 캐시면 된다.\n\n전역은 **멀리 떨어진 화면이 같은 클라이언트 값을 써야 할 때**만 연다. 장바구니, 테마, 세션이 그 예다. 게시글 목록은 Query에 두고 복제하지 않는다.\n\n폴더를 기능 단위로 나누면 화면 파일이 얇아진다. 라우트는 조립만 한다.\n\n---\n\n## 2. 핵심 개념\n\n상태 배치 순서:\n\n1. 로컬 `useState`\n2. 라우트 파라미터 (공유·복원 가능한 UI)\n3. React Query (서버 상태)\n4. Context (드물고 천천히 바뀌는 값: theme, auth)\n5. Zustand (클라이언트 전역이 명확할 때)\n6. Redux Toolkit (팀 표준이거나 복잡한 클라이언트 워크플로)\n\nContext는 value가 바뀔 때마다 구독 컴포넌트가 다시 그린다. 스크롤 위치, 매 키입력은 넣지 않는다.\n\nZustand는 셀렉터로 필요한 조각만 구독한다. persist는 AsyncStorage로 충분하다. **토큰은 persist 금지.** SecureStore + Auth 흐름이다.\n\n에러 경계는 라우트 단위로 나눈다. 한 화면 크래시가 앱 전체 흰 화면이 되지 않게 한다.\n\n환경은 `app.config.ts`와 EAS 프로파일로 나눈다. 번들 ID와 API URL을 섞지 않는다.\n\n---\n\n## 3. 예제\n\n테마처럼 저빈도 값:\n\n```tsx\nconst ThemeContext = createContext\u003c{\n  mode: 'light' | 'dark';\n  toggle: () =\u003e void;\n} | null\u003e(null);\n\nexport function ThemeProvider({ children }: { children: React.ReactNode }) {\n  const [mode, setMode] = useState\u003c'light' | 'dark'\u003e('light');\n  const value = useMemo(\n    () =\u003e ({ mode, toggle: () =\u003e setMode((m) =\u003e (m === 'light' ? 'dark' : 'light')) }),\n    [mode],\n  );\n  return \u003cThemeContext.Provider value={value}\u003e{children}\u003c/ThemeContext.Provider\u003e;\n}\n```\n\n장바구니처럼 여러 화면이 같은 클라이언트 데이터:\n\n```bash\nnpx expo install zustand @react-native-async-storage/async-storage\n```\n\n```tsx\nimport { create } from 'zustand';\nimport { persist, createJSONStorage } from 'zustand/middleware';\nimport AsyncStorage from '@react-native-async-storage/async-storage';\n\ntype CartState = {\n  items: Record\u003cstring, number\u003e;\n  add: (id: string) =\u003e void;\n  clear: () =\u003e void;\n};\n\nexport const useCart = create\u003cCartState\u003e()(\n  persist(\n    (set) =\u003e ({\n      items: {},\n      add: (id) =\u003e\n        set((s) =\u003e ({ items: { ...s.items, [id]: (s.items[id] ?? 0) + 1 } })),\n      clear: () =\u003e set({ items: {} }),\n    }),\n    {\n      name: 'cart',\n      storage: createJSONStorage(() =\u003e AsyncStorage),\n    },\n  ),\n);\n```\n\n```tsx\nconst count = useCart((s) =\u003e s.items[id] ?? 0);\n```\n\n기능 단위 폴더:\n\n```\nsrc/\n├── app/                 # expo-router (또는 루트 app/)\n├── features/\n│   ├── auth/\n│   │   ├── api.ts\n│   │   ├── hooks.ts\n│   │   ├── screens/\n│   │   └── components/\n│   ├── posts/\n│   └── cart/\n├── components/          # 공용 UI\n├── lib/                 # api, storage\n└── constants/\n```\n\n화면은 훅만 호출한다.\n\n```tsx\nexport function usePost(id: string) {\n  return useQuery({\n    queryKey: ['posts', id],\n    queryFn: () =\u003e api\u003cPost\u003e(`/posts/${id}`),\n  });\n}\n```\n\n날짜·가격 포맷은 `lib/format.ts` 한곳. props가 세 단을 넘으면 합성이나 작은 store를 검토한다. Presentational/Container를 기계적으로 나누기보다 훅으로 로직을 뺀다.\n\n```tsx\nimport { ErrorBoundary } from 'react-error-boundary';\n\n\u003cErrorBoundary FallbackComponent={ScreenError} onReset={resetApp}\u003e\n  \u003cApp /\u003e\n\u003c/ErrorBoundary\u003e\n```\n\n```ts\n// app.config.ts\nimport { ExpoConfig, ConfigContext } from 'expo/config';\n\nexport default ({ config }: ConfigContext): ExpoConfig =\u003e ({\n  ...config,\n  name: 'MyApp',\n  slug: 'my-app',\n  extra: {\n    appEnv: process.env.APP_ENV ?? 'development',\n    eas: { projectId: '...' },\n  },\n});\n```\n\n품질 기본선: TypeScript `strict`, ESLint, `@/` import. 팀이면 lint-staged.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 모든 값을 Redux/Zustand | 로컬 → Query → 전역 순 |\n| 서버 목록을 스토어에 복제 | Query가 원본 |\n| Context에 고빈도 값 | 셀렉터 있는 store 또는 로컬 |\n| 토큰을 AsyncStorage persist | SecureStore |\n| 화면 파일에 API+UI 혼재 | `features/*/hooks.ts` |\n| 루트만 ErrorBoundary | 라우트 단위로 나눈다 |\n\n---\n\n## 5. 정리\n\n아키텍처는 라이브러리 선택이 아니다. **상태의 원본을 어디에 둘지**를 먼저 정하는 일이다.\n\n- 전역은 최소. Feature 폴더가 경계다.\n- Context는 테마·세션. Zustand는 장바구니류.\n- dev/staging/prod는 설정과 번들 ID로 분리한다.\n\n## 연습\n\n1. `posts`를 Feature 폴더로 옮긴다.\n2. Zustand로 장바구니 또는 최근 검색어를 persist한다.\n3. Theme Context로 라이트/다크를 토글한다.\n4. 라우트 단위 ErrorBoundary를 추가한다.\n"])</script><script>self.__next_f.push([1,"5d:T16e2,"])</script><script>self.__next_f.push([1,"# 테스트·디버깅·성능\n\n\u003e 요약: 테스트·디버깅·성능 점검을 체크리스트로 두고, 각 항목이 필요한 이유를 한 줄로 적는다.\n\n---\n\n## 1. 왜 측정과 테스트가 먼저인가\n\n버벅임은 느낌으로 고치면 잘못된 곳을 `memo`하게 된다. 크래시는 스토어 리뷰로 드러난다. 로그인·결제처럼 돈과 세션이 걸린 흐름은 자동화하지 않으면 회귀한다.\n\nRN은 단위 테스트(Jest)와 사용자 관점 컴포넌트 테스트(Testing Library), 기기 E2E(Maestro 등)를 나눈다. 전부 같은 비중일 필요는 없다. **핵심 폼과 리스트**부터 둔다.\n\n---\n\n## 2. 핵심 개념\n\n| 종류 | 도구 | 왜 |\n|------|------|----|\n| 단위 | Jest + Testing Library | 포맷터·훅·검증 로직이 깨져도 화면을 안 켠다 |\n| 컴포넌트 | `@testing-library/react-native` | 사용자가 보는 라벨·버튼 기준으로 회귀를 잡는다 |\n| E2E | Maestro / Detox | 로그인→홈처럼 OS와 네이티브가 섞인 길을 확인한다 |\n\n쿼리는 접근성 역할/라벨이 먼저다. `testID`는 최후다. 접근성 라벨이 테스트와 스크린 리더를 동시에 받쳐 준다.\n\nQuery 테스트는 `retry: false`인 전용 `QueryClient`로 감싼다. SecureStore와 `fetch`는 mock한다. 실제 키체인을 치면 CI가 실패한다.\n\n성능은 JS FPS / UI FPS를 본 다음 리스트 가상화, 이미지 크기, 리렌더 순으로 간다.\n\n---\n\n## 3. 예제\n\n```bash\nnpx expo install jest-expo @testing-library/react-native --dev\n```\n\n```tsx\nimport { render, screen, userEvent } from '@testing-library/react-native';\nimport { LoginForm } from '../LoginForm';\n\ntest('validates email', async () =\u003e {\n  const user = userEvent.setup();\n  const onSubmit = jest.fn();\n\n  render(\u003cLoginForm onSubmit={onSubmit} /\u003e);\n\n  await user.type(screen.getByPlaceholderText('email'), 'not-an-email');\n  await user.type(screen.getByPlaceholderText('password'), 'password123');\n  await user.press(screen.getByText('로그인'));\n\n  expect(screen.getByText(/이메일/i)).toBeTruthy();\n  expect(onSubmit).not.toHaveBeenCalled();\n});\n```\n\n```tsx\n\u003cPressable accessibilityRole=\"button\" accessibilityLabel=\"장바구니 담기\" /\u003e\n```\n\n```tsx\njest.mock('expo-secure-store', () =\u003e ({\n  getItemAsync: jest.fn(),\n  setItemAsync: jest.fn(),\n  deleteItemAsync: jest.fn(),\n}));\n```\n\nMaestro 스케치:\n\n```yaml\nappId: com.example.myapp\n---\n- launchApp\n- tapOn: '로그인'\n- inputText: 'user@example.com'\n- tapOn: '제출'\n- assertVisible: '홈'\n```\n\n디버깅은 React Native DevTools가 기본이다. `console.log` 남발 대신 개발 전용 API 로거. 크래시는 Sentry. minified 스택이면 소스맵이 있는 빌드 프로파일을 쓴다.\n\n셀렉터로 구독 범위를 줄인다.\n\n```tsx\nconst count = useCart((s) =\u003e s.items[id] ?? 0);\n```\n\n```bash\nnpx expo export --dump-sourcemap\nnpx expo install @sentry/react-native\n```\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 왜 문제인가 |\n|------|-------------|\n| 구현 디테일에 묶인 testID만 | 라벨이 바뀌면 사용자는 못 누르는데 테스트는 통과한다 |\n| 의심부터 `React.memo` | 병목이 리스트·이미지인데 렌더만 감싼다 |\n| `ScrollView` + map을 성능 이슈로 안 봄 | 아이템 수에 비례해 JS/네이티브 뷰가 늘어 스크롤이 끊긴다 |\n| 프로덕션에 토큰 로그 | 리뷰·인시던트 때 비밀이 유출된다 |\n| E2E만 있고 단위 테스트 없음 | 실패 위치가 기기·네트워크·UI 중 어디인지 안 갈린다 |\n\n---\n\n## 5. 정리 — 체크리스트\n\n각 항목은 **한 줄 이유**다. 통과/미통과만 표시한다.\n\n### 테스트\n\n- [ ] LoginForm 성공/실패 테스트 — 인증 진입점이 깨지면 앱 전체가 막힌다\n- [ ] 쿼리를 역할·라벨로 작성 — 스크린 리더와 테스트가 같은 이름을 쓴다\n- [ ] SecureStore·fetch mock — CI가 실기기 키체인에 의존하지 않는다\n- [ ] QueryClient `retry: false` — 실패한 테스트가 재시도로 느려지지 않는다\n- [ ] 핵심 플로우 E2E 하나 — 로그인→홈은 단위 테스트가 못 대신한다\n\n### 디버깅·관측\n\n- [ ] RN DevTools로 재현 — 추측 로그보다 컴포넌트 트리가 빠르다\n- [ ] 개발만 네트워크 로그 — 프로덕션 로그에 헤더·바디가 남으면 사고다\n- [ ] Sentry + 릴리즈 매핑 — 스토어 빌드 크래시를 버전과 연결해야 고친다\n- [ ] 브레드크럼에 화면·API 실패 — 크래시 직전 사용자 길을 복원한다\n- [ ] PII 스크러빙 — 이메일·토큰이 이슈 트래커에 쌓이면 규정 문제가 된다\n\n### 성능\n\n- [ ] 먼저 FPS를 본다 — 최적화 대상이 JS인지 UI 스레드인지 갈린다\n- [ ] FlatList/FlashList — 긴 목록을 한 번에 마운트하지 않는다\n- [ ] `keyExtractor`에 안정 id — index 키는 삽입 시 행을 잘못 재사용한다\n- [ ] 행 `memo` — 부모 리렌더가 보이는 행까지 흔들지 않게 한다\n- [ ] `expo-image` + 크기 — 원본 해상도 디코드가 스크롤을 끊는다\n- [ ] Reanimated는 UI 스레드 — `setState` 애니메이션은 JS를 막는다\n- [ ] barrel `index.ts` 과다 금지 — 쓰지도 않는 모듈이 기동 번들에 들어간다\n- [ ] 스플래시에 필수 데이터만 — 기동 때 전부 fetch하면 첫 화면이 늦다\n- [ ] `useCallback`/`memo`는 측정 후 — 모든 콜백을 감싸면 읽기만 어려워진다\n\nHermes는 Expo 기본에 가깝다. 끄지 않는다.\n\n## 연습\n\n1. LoginForm 단위 테스트 2개(성공/실패)를 작성한다.\n2. SecureStore·fetch를 mock한 Auth 훅 테스트를 만든다.\n3. 리스트 행을 `memo`하고 스크롤을 비교한다.\n4. (선택) Maestro로 로그인→홈을 자동화한다.\n5. 위 체크리스트를 통과/미통과로 표시한다.\n"])</script><script>self.__next_f.push([1,"5e:T1917,"])</script><script>self.__next_f.push([1,"# EAS 빌드·스토어 배포·OTA\n\n\u003e 요약: EAS로 스토어 빌드와 OTA 업데이트를 나누고, 출시 전에 볼 점검 목록을 정리한다.\n\n---\n\n## 1. 왜 EAS인가\n\n로컬 Xcode/Gradle만으로도 IPA/AAB는 나온다. 다만 인증서, 시뮬레이터, CI 머신을 팀마다 맞추기 어렵다.\n\n**EAS**(Expo Application Services)는 Expo의 클라우드 빌드·스토어 제출·JS 업데이트 서비스다. 실무 기본은 **EAS Build로 바이너리를 만들고**, 카피·버그 수정은 가능하면 스토어 없이 내린다.\n\n**OTA**(Over-The-Air)는 스토어 심사 없이 JavaScript와 에셋을 기기에 보내는 방식이다. Expo에서는 **EAS Update**가 담당한다. 네이티브 모듈·권한·SDK를 바꾸면 OTA로 안 된다. 새 스토어 빌드가 필요하다.\n\n---\n\n## 2. 핵심 개념\n\n| 방식 | 왜 쓰는가 |\n|------|-----------|\n| Expo Go | 프로토타입. 커스텀 네이티브가 없으면 가장 빠르다 |\n| Development Build | 팀 네이티브 모듈을 실기기에 넣고 JS는 Metro로 돌린다 |\n| EAS Build | CI와 같은 환경에서 IPA/AAB를 만든다 |\n| 로컬 prebuild | `ios/`/`android/`를 열어 네이티브를 직접 볼 때 |\n\n프로파일로 환경을 나눈다. development는 내부 개발 클라이언트, preview는 테스터 APK, production은 스토어다.\n\n`version`은 사용자가 본다. 스토어 빌드 번호는 `autoIncrement`가 안전하다. 번들 ID / applicationId는 나중에 바꾸기 어렵다.\n\nOTA는 `runtimeVersion`이 맞는 바이너리에만 들어간다. 너무 오래된 앱에는 강제 업데이트 UI가 필요하다.\n\n---\n\n## 3. 예제\n\n```bash\nnpm i -g eas-cli\neas login\neas build:configure\n```\n\n```bash\nnpx expo install expo-dev-client\neas build --profile development --platform android\n```\n\n```json\n{\n  \"cli\": { \"version\": \"\u003e= 12.0.0\" },\n  \"build\": {\n    \"development\": {\n      \"developmentClient\": true,\n      \"distribution\": \"internal\"\n    },\n    \"preview\": {\n      \"distribution\": \"internal\",\n      \"android\": { \"buildType\": \"apk\" }\n    },\n    \"production\": {\n      \"autoIncrement\": true\n    }\n  },\n  \"submit\": {\n    \"production\": {}\n  }\n}\n```\n\n`EXPO_PUBLIC_API_URL`은 프로파일별 시크릿/환경으로 나눈다. `eas secret:create` 또는 EAS env.\n\n```bash\neas build --platform ios --profile production\neas build --platform android --profile production\neas submit --platform ios\neas submit --platform android\n```\n\n```json\n{\n  \"expo\": {\n    \"ios\": { \"bundleIdentifier\": \"com.example.myapp\" },\n    \"android\": { \"package\": \"com.example.myapp\", \"versionCode\": 1 },\n    \"version\": \"1.0.0\",\n    \"runtimeVersion\": { \"policy\": \"appVersion\" },\n    \"updates\": { \"url\": \"https://u.expo.dev/...\" }\n  }\n}\n```\n\n```bash\nnpx expo install expo-updates\neas update --branch production --message \"Fix checkout crash\"\n```\n\nCI 스케치: PR은 lint·typecheck·test. `main`은 preview. 태그는 production build + submit. 핫픽스는 `eas update`. 시크릿은 `EXPO_TOKEN`과 스토어 키.\n\n딥링크: `myapp://` 스킴 + HTTPS App Links / Universal Links. 알림·매직링크가 심사에서 자주 막힌다.\n\nPlay는 AAB. 불필요 권한은 심사 리스크다. iOS Privacy Manifest, 계정 삭제, 암호화 질문도 체크한다.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 왜 문제인가 |\n|------|-------------|\n| 네이티브 변경을 OTA로 배포 | 모듈·권한이 없는 옛 바이너리에서는 크래시한다 |\n| runtimeVersion 없이 업데이트 | 호환 안 되는 JS가 깔려 기동이 실패한다 |\n| 번들 ID를 출시 직전 변경 | 스토어 앱이 새 앱이 되어 리뷰·구매가 끊긴다 |\n| 모든 테스터에게 production 서명 | 내부 배포와 스토어 트랙이 섞여 롤백이 어렵다 |\n| 롤백 절차 없음 | 잘못된 OTA를 이전 업데이트로 되돌릴 수 있어야 한다 |\n\n---\n\n## 5. 정리 — 프로덕션 체크리스트\n\n각 항목은 **한 줄 이유**다. 통과/미통과로 표시한다.\n\n### 제품\n\n- [ ] 빈·로딩·에러·오프라인 UI — 네트워크가 기본인 앱에서 흰 화면은 이탈이다\n- [ ] 인증 만료·토큰 갱신 — 재설치 없이 세션이 죽으면 리뷰가 쌓인다\n- [ ] 딥링크·푸시 진입점 — 알림을 열었는데 홈만 뜨면 캠페인이 무의미하다\n- [ ] 주요 CTA 접근성 라벨 — 심사와 스크린 리더가 버튼을 못 찾는다\n\n### 기술\n\n- [ ] API 환경 분리 — prod 앱이 staging을 치면 데이터가 섞인다\n- [ ] 토큰은 SecureStore — 백업·로그에 access token이 남으면 탈취 경로다\n- [ ] Sentry + 소스맵 — 스토어 크래시를 파일·줄로 못 보면 고칠 수 없다\n- [ ] 프로덕션 로그에 시크릿 없음 — 토큰이 관측 도구에 쌓인다\n- [ ] Hermes / New Architecture 확인 — 끄고 빌드하면 성능·호환이 문서와 달라진다\n- [ ] 권한 문구가 `app.json`에 있음 — usage description 없으면 iOS 제출이 거절된다\n\n### 배포\n\n- [ ] EAS production 빌드 성공 — 로컬에서만 되는 빌드는 CI에서 깨진다\n- [ ] 내부 테스트 트랙 — 스토어 공개 전에 테스터 바이너리로 회귀를 본다\n- [ ] OTA 브랜치 전략 문서 — production 핫픽스와 preview 실험이 섞이면 사고다\n- [ ] 롤백 방법 — 이전 `eas update` 또는 스토어 이전 빌드로 되돌린다\n- [ ] version + 빌드 번호 autoIncrement — 같은 번호 재업로드는 스토어가 거절한다\n- [ ] 아이콘·스플래시·개인정보 고지 — 메타 누락은 바이너리보다 심사를 오래 끈다\n- [ ] Play AAB / 불필요 권한 제거 — APK 직접 업로드·과잉 권한은 정책 위반이다\n- [ ] 계정 삭제(해당 시) — 로그인 앱은 스토어가 삭제 경로를 요구한다\n\n기본 조합은 **Expo + TypeScript + Expo Router + React Query + EAS**다.\n\n- UI: Flex와 명확한 컴포넌트\n- 서버 상태: Query. 클라이언트 전역: 최소\n- 토큰: SecureStore. 권한: 필요 시점\n- 애니메이션: UI 스레드\n- 출시: EAS 빌드. 핫픽스: OTA. 네이티브 변경: 스토어\n\n## 연습\n\n1. EAS 프로젝트를 연결하고 preview 내부 배포를 만든다.\n2. production 프로파일에서 빌드 번호가 증가하는지 확인한다.\n3. 카피 수정만 `eas update`로 배포한다.\n4. 위 체크리스트를 통과/미통과로 표시한다.\n5. (선택) PR에 typecheck + test를 건다.\n"])</script><script>self.__next_f.push([1,"5f:T172c,"])</script><script>self.__next_f.push([1,"# Spring Boot 3와 Java 21 시작하기\n\n\u003e 요약: Java 21과 Spring Boot 3.x로 프로젝트를 세팅하고, 자동 구성·프로파일·record 같은 기본선을 잡는다.\n\n---\n\n## 1. 왜 지금 Spring Boot인가\n\nSpring Boot는 **관례 기반(Convention over Configuration)** 으로 기동한다. 자주 쓰는 기능은 starter 의존성으로 붙이고, 나머지는 기본값을 따른다.\n\nBoot 3의 전제:\n\n| 항목 | Boot 2.x | Boot 3.x |\n|------|----------|----------|\n| Java | 8+ | **17 필수, 21이 실무 기본선** |\n| 패키지 | `javax.*` | **`jakarta.*`** |\n| 서블릿 | 4 | 5/6 |\n| Native | 실험 | GraalVM Native 정식 |\n| 관측 | Micrometer 1.x | Observation API + OpenTelemetry |\n\nJakarta는 Java EE가 Eclipse 재단으로 옮기며 패키지 이름이 바뀐 것이다. Boot 3 코드와 의존성은 `jakarta.validation`, `jakarta.persistence`처럼 **`jakarta.*`만** 쓴다.\n\n실무 기본선은 **Java 21 LTS + Spring Boot 3.4+** 다.\n\n---\n\n## 2. 프로젝트 생성\n\n[start.spring.io](https://start.spring.io)에서 Java 21, Jar, 최신 3.x를 고른다. 최소 의존성은 Spring Web, Validation, Actuator면 충분하다. JPA·DB 드라이버는 영속성이 필요할 때 추가한다.\n\n```bash\ncurl https://start.spring.io/starter.zip \\\n  -d type=maven-project \\\n  -d language=java \\\n  -d bootVersion=3.4.5 \\\n  -d javaVersion=21 \\\n  -d dependencies=web,validation,actuator \\\n  -o demo.zip\n```\n\nLombok은 팀 합의 후에만 넣는다. record와 생성자 주입이면 없어도 된다.\n\n---\n\n## 3. 디렉터리\n\n패키지를 `controller/service/repository`로만 나누면 기능이 커질수록 파일이 흩어진다. **도메인과 어댑터**를 기준으로 두는 편이 유지보수에 유리하다.\n\n```\nsrc/main/java/com/example/demo/\n├── DemoApplication.java\n├── config/\n├── domain/\n├── application/\n├── adapter/web/\n├── adapter/persistence/\n└── common/\nsrc/main/resources/\n├── application.yml\n├── application-local.yml\n├── application-prod.yml\n└── db/migration/\n```\n\n---\n\n## 4. `@SpringBootApplication`\n\n한 줄 정의: **설정 클래스 + 자동 구성 + 컴포넌트 스캔**을 한 어노테이션으로 묶은 진입점이다.\n\n```java\n@SpringBootApplication\npublic class DemoApplication {\n    public static void main(String[] args) {\n        SpringApplication.run(DemoApplication.class, args);\n    }\n}\n```\n\n- `@SpringBootConfiguration` — 이 클래스가 설정이다\n- `@EnableAutoConfiguration` — classpath에 있는 starter를 조건에 맞게 켠다\n- `@ComponentScan` — 이 패키지 이하만 스캔한다\n\n자동 구성 목록은 `META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports`에 있다. 메인 클래스를 `com.example.demo` 밖에 두면 스캔 범위가 비는 것이 흔한 실수다.\n\n---\n\n## 5. `application.yml`\n\n설정은 YAML + 프로파일 + 환경변수로 나눈다. 시크릿은 파일에 넣지 않는다.\n\n```yaml\nspring:\n  application:\n    name: demo\n  profiles:\n    active: local\n\nserver:\n  port: 8080\n\nmanagement:\n  endpoints:\n    web:\n      exposure:\n        include: health,info\n  endpoint:\n    health:\n      probes:\n        enabled: true\n\nlogging:\n  level:\n    root: INFO\n    com.example.demo: DEBUG\n```\n\nActuator는 운영 상태(헬스·메트릭)를 HTTP로 노출하는 모듈이다. 로컬에서 `health`만 열고, 운영 노출 범위는 나중에 줄인다.\n\n| 파일 | 용도 |\n|------|------|\n| `application.yml` | 공통 |\n| `application-local.yml` | 로컬 DB, 상세 로그 |\n| `application-test.yml` | 테스트 |\n| `application-prod.yml` | 운영. 비밀번호는 `${DB_PASSWORD}` |\n\n---\n\n## 6. Java 21에서 바로 쓰는 문법\n\n### Record\n\nDTO·설정값처럼 **불변 데이터**에 맞다. getter·`equals`를 직접 만들지 않는다.\n\n```java\npublic record CreateUserRequest(String email, String name) {}\npublic record UserResponse(Long id, String email, String name) {}\n```\n\n### Sealed + pattern matching\n\n결과가 몇 가지로 닫혀 있으면 컴파일러가 분기를 검사한다.\n\n```java\npublic sealed interface PaymentResult\n        permits PaymentResult.Success, PaymentResult.Failed {\n    record Success(String transactionId) implements PaymentResult {}\n    record Failed(String reason) implements PaymentResult {}\n}\n\nString message = switch (result) {\n    case PaymentResult.Success s -\u003e \"OK: \" + s.transactionId();\n    case PaymentResult.Failed f -\u003e \"FAIL: \" + f.reason();\n};\n```\n\n### Virtual Threads\n\n한 줄 정의: OS 스레드에 1:1로 묶이지 않는 **가벼운 스레드**로, JDBC·HTTP처럼 기다리는 I/O 비용을 낮춘다.\n\n```yaml\nspring:\n  threads:\n    virtual:\n      enabled: true\n```\n\nBoot 3.2+에서 Tomcat 요청 처리에 붙는다. CPU 연산이 병목인 작업은 기적이 없고, DB 커넥션 풀 한도는 그대로다.\n\n---\n\n## 7. 첫 API\n\n```java\n@RestController\n@RequestMapping(\"/api/hello\")\npublic class HelloController {\n\n    @GetMapping\n    public Map\u003cString, String\u003e hello() {\n        return Map.of(\"message\", \"Hello, Spring Boot 3\");\n    }\n}\n```\n\n```bash\n./mvnw spring-boot:run\ncurl http://localhost:8080/api/hello\n```\n\nGradle은 `./gradlew bootRun`, 패키징은 `bootJar` 후 `java -jar`다.\n\n---\n\n## 8. 흔한 실수\n\n| 실수 | 결과 |\n|------|------|\n| `javax.*` import | 컴파일·런타임 불일치 |\n| 메인 클래스를 루트 패키지 밖에 둠 | Bean 스캔 누락 |\n| 운영 yml에 DB 비밀번호 | 저장소 유출 |\n| `show-sql`만 켜고 끝 | 바인딩 값·N+1을 못 봄 |\n| Virtual Threads만 켜고 풀 크기 무시 | DB가 먼저 죽는다 |\n\n---\n\n## 연습\n\n1. start.spring.io로 Web + Validation + Actuator 프로젝트를 만든다.\n2. `GET /api/health-demo`를 record 응답으로 추가한다.\n3. `local` / `prod` 프로파일을 나누고, prod 로그는 INFO로 둔다.\n4. `/actuator/health`가 200인지 확인한다.\n"])</script><script>self.__next_f.push([1,"60:T186d,"])</script><script>self.__next_f.push([1,"# IoC, Bean, Configuration — 의존성 주입\n\n\u003e 요약: IoC 컨테이너가 Bean을 조립하는 방식을 이해하고, 생성자 주입과 타입 세이프 설정으로 의존성을 구성한다.\n\n---\n\n## 1. 왜 IoC인가\n\n**IoC(Inversion of Control)** 는 객체 생성과 생명주기 제어권을 프레임워크가 갖는 것이다. **DI(Dependency Injection)** 는 그 구현 방식으로, 필요한 의존성을 외부에서 넣어 준다.\n\n직접 `new`로 조립하면 테스트에서 구현을 바꾸기 어렵다. Spring은 **Bean**—컨테이너가 만들고 주입하는 객체—으로 그래프를 짠다.\n\n---\n\n## 2. Bean이 되는 방법\n\n직접 만든 클래스는 스테레오타입, 외부 라이브러리 객체는 `@Bean`이 기본이다.\n\n| 방식 | 언제 |\n|------|------|\n| `@Component` / `@Service` / `@Repository` / `@Controller` | 우리가 작성한 클래스 |\n| `@Bean` + `@Configuration` | 생성 과정이 있거나 남이 만든 타입 |\n| `@ConfigurationProperties` | 설정값을 타입으로 바인딩 |\n| Auto-configuration | starter가 조건에 맞으면 등록 |\n\n```java\n@Service\npublic class OrderService {\n    private final OrderRepository orderRepository;\n    private final PaymentClient paymentClient;\n\n    public OrderService(OrderRepository orderRepository, PaymentClient paymentClient) {\n        this.orderRepository = orderRepository;\n        this.paymentClient = paymentClient;\n    }\n}\n```\n\n생성자가 하나면 `@Autowired`는 생략한다.\n\n---\n\n## 3. 주입 방식\n\n생성자 주입이 기본선이다. `final`로 불변이고, 순환 의존성은 기동 시점에 드러나며, 테스트에서 목을 넣기 쉽다.\n\n```java\n@Service\npublic class UserService {\n    private final UserRepository userRepository;\n\n    public UserService(UserRepository userRepository) {\n        this.userRepository = userRepository;\n    }\n}\n```\n\n`@Autowired` 필드 주입은 테스트와 불변성이 약하다. Setter는 정말 선택적 의존성일 때만 쓴다.\n\n---\n\n## 4. `@Configuration`과 `@Bean`\n\n한 줄 정의: 설정 클래스는 **조립 공장**이고, `@Bean` 메서드 반환값이 컨테이너에 등록된다.\n\n```java\n@Configuration\npublic class AppConfig {\n\n    @Bean\n    Clock clock() {\n        return Clock.systemUTC();\n    }\n\n    @Bean\n    ObjectMapper objectMapper() {\n        return JsonMapper.builder()\n                .addModule(new JavaTimeModule())\n                .disable(SerializationFeature.WRITE_DATES_AS_TIMESTAMPS)\n                .build();\n    }\n}\n```\n\n기본 `@Configuration`은 CGLIB 프록시로 `@Bean` 메서드 간 호출을 싱글톤으로 맞춘다. `@Bean`끼리 서로 호출하지 않으면 `@Configuration(proxyBeanMethods = false)`(Lite)가 기동에 유리하다.\n\n---\n\n## 5. 스코프\n\n| Scope | 의미 |\n|-------|------|\n| `singleton` (기본) | 컨테이너당 하나 |\n| `prototype` | 조회마다 새 인스턴스 |\n| `request` / `session` | HTTP 요청·세션당 하나 |\n\n서비스·리포지토리는 거의 항상 singleton이다. **요청 상태를 필드로 두지 않는다.** 두면 스레드끼리 데이터가 섞인다.\n\n```java\n@Bean\n@Scope(\"prototype\")\nReportBuilder reportBuilder() {\n    return new ReportBuilder();\n}\n```\n\n---\n\n## 6. 조건부 Bean\n\n환경마다 구현을 바꾸려면 조건 어노테이션을 쓴다. 로컬에서만 가짜 클라이언트를 쓰는 전형적인 패턴이다.\n\n```java\n@Bean\n@ConditionalOnProperty(name = \"app.mail.enabled\", havingValue = \"true\")\nMailSender mailSender(MailProperties props) {\n    return new SmtpMailSender(props);\n}\n\n@Bean\n@ConditionalOnMissingBean(MailSender.class)\nMailSender noopMailSender() {\n    return new NoopMailSender();\n}\n```\n\n`@Profile(\"!prod\")`, `@ConditionalOnClass`, `@ConditionalOnWebApplication`도 같은 계열이다.\n\n```java\n@Service\n@Profile(\"!prod\")\npublic class FakePaymentClient implements PaymentClient { }\n```\n\n---\n\n## 7. `@ConfigurationProperties`\n\nURL·타임아웃을 코드에 쓰지 않는다. Boot 3에서는 **record + `@ConfigurationProperties`** 가 맞다.\n\n```java\n@ConfigurationProperties(prefix = \"app.payment\")\npublic record PaymentProperties(\n        String baseUrl,\n        Duration timeout,\n        int maxRetries\n) {}\n```\n\n```yaml\napp:\n  payment:\n    base-url: https://pay.example.com\n    timeout: 3s\n    max-retries: 2\n```\n\n```java\n@Configuration\n@EnableConfigurationProperties(PaymentProperties.class)\npublic class PaymentConfig {\n\n    @Bean\n    PaymentClient paymentClient(PaymentProperties props, RestClient.Builder builder) {\n        return new HttpPaymentClient(builder.baseUrl(props.baseUrl()).build(), props);\n    }\n}\n```\n\nIDE 자동완성은 `spring-boot-configuration-processor`를 annotation processor로 넣으면 된다.\n\n---\n\n## 8. 포트로 의존성 끊기\n\n구현체가 아니라 **인터페이스(포트)** 에 의존하면 테스트에서 구현만 바꾸면 된다.\n\n```java\npublic interface NotificationPort {\n    void send(String to, String message);\n}\n\n@Service\npublic class EmailNotificationAdapter implements NotificationPort { }\n```\n\n---\n\n## 9. 순환 의존성과 생명주기\n\nBoot 3는 순환 참조를 기본적으로 허용하지 않는다. 공통 로직을 제3 서비스로 빼거나 `ApplicationEventPublisher`로 결합을 낮춘다. `@Lazy`는 최후 수단이다.\n\n기동·종료 훅은 `@PostConstruct` / `@PreDestroy` 또는 `@Bean(initMethod, destroyMethod)`다. 파일·스레드 풀처럼 닫을 자원이 있으면 destroy를 빠뜨리지 않는다.\n\n```java\n@Bean(initMethod = \"start\", destroyMethod = \"stop\")\nMyWorker myWorker() {\n    return new MyWorker();\n}\n```\n\n---\n\n## 10. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 필드 `@Autowired` | 생성자 + `final` |\n| yml 값을 `@Value`로 흩뿌리기 | `@ConfigurationProperties` |\n| 서비스에 요청 상태 필드 | 메서드 인자·요청 스코프 |\n| 순환을 `@Lazy`로 숨기기 | 설계 분리 |\n| `@Component`와 `@Bean`으로 같은 타입을 두 번 등록 | 하나만 |\n\n---\n\n## 연습\n\n1. `AppProperties` record로 `app.greeting`을 읽어 API로 반환한다.\n2. `Clock` Bean을 등록하고, 테스트에서는 고정 `Clock`으로 교체한다.\n3. `local` 프로필에서만 동작하는 `DevBanner`를 만든다.\n"])</script><script>self.__next_f.push([1,"61:T1bfa,"])</script><script>self.__next_f.push([1,"# REST API 설계 — Validation, Problem Details, RestClient\n\n\u003e 요약: 검증·Problem Details·RestClient로 REST API의 계약과 에러 응답, 외부 호출을 일관되게 만든다.\n\n---\n\n## 1. 컨트롤러는 HTTP 어댑터다\n\n컨트롤러는 요청을 파싱·검증하고 애플리케이션 서비스를 호출한 뒤, 상태 코드와 본문만 매핑한다. 비즈니스 규칙은 서비스에 둔다.\n\n```java\n@RestController\n@RequestMapping(\"/api/users\")\npublic class UserController {\n\n    private final UserService userService;\n\n    public UserController(UserService userService) {\n        this.userService = userService;\n    }\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public UserResponse create(@Valid @RequestBody CreateUserRequest request) {\n        return userService.create(request);\n    }\n\n    @GetMapping(\"/{id}\")\n    public UserResponse get(@PathVariable Long id) {\n        return userService.get(id);\n    }\n}\n```\n\n엔티티를 그대로 응답하지 않는다. 영속성 모델과 API 계약은 별개다.\n\n```java\npublic record CreateUserRequest(\n        @NotBlank @Email String email,\n        @NotBlank @Size(max = 50) String name\n) {}\n\npublic record UserResponse(Long id, String email, String name) {}\n```\n\n---\n\n## 2. Bean Validation\n\n한 줄 정의: **`jakarta.validation` 제약으로 입력 형태를 선언**하고, `@Valid`가 붙은 시점에 검사한다. 의존성은 `spring-boot-starter-validation`이다.\n\n| 어노테이션 | 용도 |\n|-----------|------|\n| `@NotNull` / `@NotBlank` | 필수 |\n| `@Email` | 이메일 |\n| `@Size` / `@Min` / `@Max` | 길이·범위 |\n| `@Pattern` | 정규식 |\n| `@Valid` | 중첩 객체 |\n| `@Validated` | 그룹·메서드 파라미터 |\n\n쿼리 파라미터 검증은 클래스에 `@Validated`가 있어야 동작한다.\n\n```java\n@Validated\n@RestController\npublic class UserController {\n\n    @GetMapping\n    public Page\u003cUserResponse\u003e search(\n            @RequestParam @Min(0) int page,\n            @RequestParam @Min(1) @Max(100) int size) {\n        return userService.search(page, size);\n    }\n}\
