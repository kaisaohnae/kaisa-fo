n```\n\n`@NotNull`은 공백 문자열을 통과시킨다. 문자열 필수는 `@NotBlank`다.\n\n---\n\n## 3. 상태 코드\n\n| 상황 | 코드 |\n|------|------|\n| 조회 성공 | 200 |\n| 생성 | 201 + `Location` |\n| 본문 없는 성공 | 204 |\n| 검증 실패 | 400 |\n| 인증 필요 | 401 |\n| 권한 없음 | 403 |\n| 없음 | 404 |\n| 중복 등 충돌 | 409 |\n| 서버 오류 | 500 |\n\n```java\n@PostMapping\npublic ResponseEntity\u003cUserResponse\u003e create(@Valid @RequestBody CreateUserRequest request) {\n    UserResponse created = userService.create(request);\n    URI location = URI.create(\"/api/users/\" + created.id());\n    return ResponseEntity.created(location).body(created);\n}\n```\n\n---\n\n## 4. Problem Details\n\n한 줄 정의: **RFC 7807** 형식의 에러 본문이다. `type`, `title`, `status`, `detail`과 확장 필드로 클라이언트가 분기한다. Boot 3 / Framework 6의 `ProblemDetail`이 이 계약이다.\n\n```java\n@RestControllerAdvice\npublic class GlobalExceptionHandler {\n\n    @ExceptionHandler(UserNotFoundException.class)\n    ResponseEntity\u003cProblemDetail\u003e handleNotFound(UserNotFoundException ex) {\n        ProblemDetail problem = ProblemDetail.forStatusAndDetail(\n                HttpStatus.NOT_FOUND, ex.getMessage());\n        problem.setTitle(\"User Not Found\");\n        problem.setProperty(\"userId\", ex.getUserId());\n        return ResponseEntity.status(HttpStatus.NOT_FOUND).body(problem);\n    }\n\n    @ExceptionHandler(MethodArgumentNotValidException.class)\n    ResponseEntity\u003cProblemDetail\u003e handleValidation(MethodArgumentNotValidException ex) {\n        ProblemDetail problem = ProblemDetail.forStatus(HttpStatus.BAD_REQUEST);\n        problem.setTitle(\"Validation Failed\");\n        problem.setProperty(\"errors\", ex.getBindingResult().getFieldErrors().stream()\n                .map(fe -\u003e Map.of(\"field\", fe.getField(), \"message\", fe.getDefaultMessage()))\n                .toList());\n        return ResponseEntity.badRequest().body(problem);\n    }\n}\n```\n\n```json\n{\n  \"type\": \"about:blank\",\n  \"title\": \"Validation Failed\",\n  \"status\": 400,\n  \"errors\": [\n    { \"field\": \"email\", \"message\": \"must be a well-formed email address\" }\n  ]\n}\n```\n\n메시지 문자열만 제각각 내려주면 프론트가 필드 단위로 표시하기 어렵다.\n\n---\n\n## 5. 버전·페이지네이션\n\n중소규모는 URL 버전(`/api/v1/users`)이 운영하기 쉽다. 필드 추가만 하고, 깨지는 변경은 새 버전으로 둔다.\n\n```java\n@GetMapping\npublic Page\u003cUserResponse\u003e list(Pageable pageable) {\n    return userService.list(pageable);\n}\n```\n\n```\nGET /api/users?page=0\u0026size=20\u0026sort=createdAt,desc\n```\n\n외부 공개 API는 `items` / `page` / `total`처럼 팀 봉투를 따로 정하는 경우가 많다. `size` 상한을 두지 않으면 한 번에 전체를 끌어가는 요청이 나온다.\n\n---\n\n## 6. RestClient\n\n한 줄 정의: Boot 3.2+의 **동기 HTTP 클라이언트**다. `RestTemplate`은 유지보수 모드에 가깝고, 리액티브면 `WebClient`다.\n\n```java\n@Configuration\npublic class HttpClientConfig {\n\n    @Bean\n    RestClient paymentRestClient(RestClient.Builder builder, PaymentProperties props) {\n        JdkClientHttpRequestFactory factory = new JdkClientHttpRequestFactory();\n        factory.setReadTimeout(Duration.ofSeconds(3));\n        return builder\n                .baseUrl(props.baseUrl())\n                .defaultHeader(HttpHeaders.CONTENT_TYPE, MediaType.APPLICATION_JSON_VALUE)\n                .requestFactory(factory)\n                .build();\n    }\n}\n```\n\n```java\npublic PaymentResponse charge(ChargeRequest request) {\n    return paymentRestClient.post()\n            .uri(\"/charges\")\n            .body(request)\n            .retrieve()\n            .onStatus(HttpStatusCode::is4xxClientError, (req, res) -\u003e {\n                throw new PaymentRejectedException(\"payment rejected\");\n            })\n            .body(PaymentResponse.class);\n}\n```\n\n타임아웃 없는 클라이언트는 스레드와 커넥션을 붙잡는다. 재시도는 멱등한 호출에만 붙인다.\n\n---\n\n## 7. JSON·OpenAPI\n\n```yaml\nspring:\n  jackson:\n    default-property-inclusion: non_null\n    serialization:\n      write-dates-as-timestamps: false\n    time-zone: Asia/Seoul\n```\n\n날짜는 ISO-8601 (`OffsetDateTime`)을 쓴다. 문서화는 `springdoc-openapi-starter-webmvc-ui`로 `/swagger-ui.html`, `/v3/api-docs`를 연다. 운영에서는 인증 뒤에 두거나 끈다.\n\n비밀번호·토큰은 응답 DTO에 넣지 않는다. 생성·결제 API는 Idempotency-Key를 검토한다.\n\n---\n\n## 8. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 엔티티 직접 노출 | record DTO |\n| `@NotNull`로 문자열 필수 | `@NotBlank` |\n| 예외마다 다른 JSON 모양 | `ProblemDetail` |\n| RestTemplate 신규 코드 | `RestClient` |\n| 타임아웃 없음 | connect/read 명시 |\n\n---\n\n## 연습\n\n1. `POST /api/products`에 Bean Validation과 201 Created를 붙인다.\n2. 없는 상품은 `ProblemDetail` 404로 반환한다.\n3. `RestClient`로 공개 API를 호출하는 서비스를 만든다.\n4. springdoc으로 계약을 확인한다.\n"])</script><script>self.__next_f.push([1,"62:T1d2b,"])</script><script>self.__next_f.push([1,"# Spring Data JPA와 영속성 계층\n\n\u003e 요약: JPA 엔티티와 트랜잭션 경계를 명확히 하고, N+1·OSIV·스키마 마이그레이션 함정을 피한다.\n\n---\n\n## 1. 왜 JPA인가\n\n**JPA(Jakarta Persistence API)** 는 객체를 테이블에 매핑하는 표준이다. Hibernate가 구현체고, Spring Data JPA는 리포지토리 인터페이스로 반복 쿼리를 줄인다.\n\n| 계층 | 책임 |\n|------|------|\n| Entity | 상태와 불변식 |\n| Repository | 영속성 추상화 |\n| Service (`@Transactional`) | 유스케이스 단위 트랜잭션 |\n| Controller | HTTP만 |\n\n컨트롤러에 `save`를 두거나, 리포지토리에 비즈니스 분기를 넣지 않는다.\n\n---\n\n## 2. 엔티티\n\n기본 생성자는 JPA용으로 `protected`, 변경은 setter 대신 도메인 메서드로 둔다.\n\n```java\n@Entity\n@Table(name = \"users\")\n@EntityListeners(AuditingEntityListener.class)\npublic class User {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, unique = true, length = 100)\n    private String email;\n\n    @Column(nullable = false, length = 50)\n    private String name;\n\n    @CreatedDate\n    @Column(nullable = false, updatable = false)\n    private Instant createdAt;\n\n    @LastModifiedDate\n    private Instant updatedAt;\n\n    protected User() {}\n\n    public static User create(String email, String name) {\n        User user = new User();\n        user.email = email;\n        user.name = name;\n        return user;\n    }\n\n    public void rename(String name) {\n        if (name == null || name.isBlank()) {\n            throw new IllegalArgumentException(\"name required\");\n        }\n        this.name = name;\n    }\n}\n```\n\n`@EnableJpaAuditing`을 켜야 `@CreatedDate`가 동작한다. `equals`/`hashCode`를 전 필드 Lombok으로 만들면 영속 전후 동등성이 깨지기 쉽다. 식별자 기준으로 신중히 구현한다.\n\n공통 시각 필드는 `@MappedSuperclass`로 빼고, 소프트 삭제는 `deletedAt` 또는 Hibernate `@SoftDelete`로 명시한다.\n\n---\n\n## 3. 리포지토리\n\n파생 메서드 → JPQL `@Query` → `Specification` / QueryDSL 순으로 복잡도를 올린다.\n\n```java\npublic interface UserRepository extends JpaRepository\u003cUser, Long\u003e {\n    Optional\u003cUser\u003e findByEmail(String email);\n    boolean existsByEmail(String email);\n\n    @Query(\"select u from User u where u.name like %:keyword%\")\n    List\u003cUser\u003e searchByName(@Param(\"keyword\") String keyword);\n\n    @Modifying(clearAutomatically = true, flushAutomatically = true)\n    @Query(\"update User u set u.name = :name where u.id = :id\")\n    int rename(@Param(\"id\") Long id, @Param(\"name\") String name);\n}\n```\n\n벌크 `@Modifying`은 영속성 컨텍스트를 건너뛴다. `clearAutomatically` 없이 같은 트랜잭션에서 엔티티를 다시 쓰면 DB와 객체가 어긋난다.\n\n---\n\n## 4. 트랜잭션\n\n한 줄 정의: 트랜잭션은 **한 유스케이스가 전부 성공하거나 전부 롤백**되는 경계다. 클래스를 `readOnly = true`로 두고 쓰기 메서드만 `@Transactional`을 연다.\n\n```java\n@Service\n@Transactional(readOnly = true)\npublic class UserService {\n\n    private final UserRepository userRepository;\n\n    public UserService(UserRepository userRepository) {\n        this.userRepository = userRepository;\n    }\n\n    public UserResponse get(Long id) {\n        return userRepository.findById(id)\n                .map(UserMapper::toResponse)\n                .orElseThrow(() -\u003e new UserNotFoundException(id));\n    }\n\n    @Transactional\n    public UserResponse create(CreateUserRequest request) {\n        if (userRepository.existsByEmail(request.email())) {\n            throw new DuplicateEmailException(request.email());\n        }\n        User saved = userRepository.save(User.create(request.email(), request.name()));\n        return UserMapper.toResponse(saved);\n    }\n}\n```\n\n전파·격리 수준은 기본값으로 대부분 충분하다. 긴 트랜잭션 안에서 외부 HTTP를 호출하면 커넥션을 붙잡은 채 대기한다.\n\n---\n\n## 5. 연관과 지연 로딩\n\n연관은 **LAZY**가 기본 전략이다. `EAGER`는 목록 조회마다 조인이 붙는 사고의 주범이다.\n\n```java\n@ManyToOne(fetch = FetchType.LAZY, optional = false)\n@JoinColumn(name = \"user_id\")\nprivate User user;\n\n@OneToMany(mappedBy = \"order\", cascade = CascadeType.ALL, orphanRemoval = true)\nprivate List\u003cOrderLine\u003e lines = new ArrayList\u003c\u003e();\n\npublic void addLine(OrderLine line) {\n    lines.add(line);\n    line.setOrder(this);\n}\n```\n\n양방향은 편의 메서드로 양쪽을 맞춘다.\n\n---\n\n## 6. N+1과 OSIV\n\n**N+1**: 목록 1번 조회 후 연관에 접근할 때마다 쿼리가 N번 더 나간다.\n\n```java\n@Query(\"select o from Order o join fetch o.user where o.id = :id\")\nOptional\u003cOrder\u003e findWithUser(@Param(\"id\") Long id);\n\n@EntityGraph(attributePaths = {\"lines\"})\nOptional\u003cOrder\u003e findWithLinesById(Long id);\n\n@Query(\"\"\"\n        select new com.example.demo.order.OrderSummary(o.id, u.email, o.totalAmount)\n        from Order o join o.user u\n        where o.status = :status\n        \"\"\")\nList\u003cOrderSummary\u003e findSummaries(OrderStatus status);\n```\n\n읽기 전용 화면에 DTO 프로젝션이 가장 싸다. fetch join은 컬렉션을 두 개 이상 동시에 끌어오면 카테시안 곱이 난다.\n\n**OSIV(Open Session In View)** 는 뷰 렌더까지 영속성 컨텍스트를 열어 두는 설정이다. Boot 기본은 `true`이고, 운영은 `false`를 권장한다. 컨트롤러에서 지연 로딩이 터지면 쿼리를 고친다.\n\n```yaml\nspring:\n  jpa:\n    open-in-view: false\n```\n\n---\n\n## 7. Flyway와 낙관적 락\n\n`ddl-auto: update`는 로컬 실험용이다. 운영 스키마의 진실은 **Flyway/Liquibase 마이그레이션 파일**이다.\n\n```yaml\nspring:\n  jpa:\n    hibernate:\n      ddl-auto: validate\n  flyway:\n    enabled: true\n```\n\n```\ndb/migration/\n  V1__create_users.sql\n```\n\n```sql\nCREATE TABLE users (\n    id BIGSERIAL PRIMARY KEY,\n    email VARCHAR(100) NOT NULL UNIQUE,\n    name VARCHAR(50) NOT NULL,\n    created_at TIMESTAMPTZ NOT NULL,\n    updated_at TIMESTAMPTZ\n);\n```\n\n동시 수정 충돌은 `@Version` 낙관적 락으로 잡는다. 실패 시 `OptimisticLockException` → 409 또는 재조회 후 재시도.\n\n```java\n@Version\nprivate Long version;\n```\n\n---\n\n## 8. 로컬에서 SQL 보기\n\n```yaml\nspring:\n  datasource:\n    hikari:\n      maximum-pool-size: 10\n      connection-timeout: 3000\n  jpa:\n    properties:\n      hibernate:\n        jdbc.batch_size: 50\n        order_inserts: true\n        order_updates: true\n\nlogging:\n  level:\n    org.hibernate.SQL: DEBUG\n    org.hibernate.orm.jdbc.bind: TRACE\n```\n\n`show-sql=true`만으로는 바인딩 파라미터가 안 보인다. Hibernate 6 로거는 `orm.jdbc.bind`다.\n\n---\n\n## 9. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 전역 `EAGER` | LAZY + 필요한 조회만 fetch/DTO |\n| OSIV에 의존 | `open-in-view: false` + 명시 조회 |\n| `ddl-auto: update` 운영 | Flyway + `validate` |\n| 트랜잭션 안에서 외부 API | 커밋 후 이벤트/아웃박스 |\n| 벌크 업데이트 후 엔티티 재사용 | clear/flush 또는 재조회 |\n\n---\n\n## 연습\n\n1. `User` 1:N `Post` 엔티티와 리포지토리를 만든다.\n2. 목록 + 작성자 이메일을 fetch join 또는 DTO로 N+1 없이 조회한다.\n3. Flyway로 테이블을 만들고 `ddl-auto: validate`로 맞춘다.\n4. `open-in-view: false`에서 지연 로딩 예외가 안 나는지 확인한다.\n"])</script><script>self.__next_f.push([1,"63:T1f85,"])</script><script>self.__next_f.push([1,"# Spring Security 6 — 인증·인가·OAuth2·JWT\n\n\u003e 요약: SecurityFilterChain으로 API 인증·인가를 구성하고, JWT와 OAuth2 Resource Server를 구분해서 쓴다.\n\n---\n\n## 1. 왜 Security 6인가\n\n**인증(Authentication)** 은 누구인지 확인하는 것이고, **인가(Authorization)** 는 그 주체가 이 요청을 해도 되는지 판단하는 것이다.\n\nSecurity 6는 `WebSecurityConfigurerAdapter`를 없애고 **`SecurityFilterChain` Bean**으로 체인을 선언한다. `antMatchers`는 `requestMatchers`로 바뀌었다. 메서드 보안은 `@EnableMethodSecurity`다.\n\nJSON API는 세션 쿠키가 기본값이 아니다. CSRF·세션 정책을 API 기준으로 다시 정한다.\n\n---\n\n## 2. 세션 없는 API 골격\n\n한 줄 정의: `SecurityFilterChain`은 요청이 컨트롤러에 닿기 전 **필터 순서와 허용 규칙**을 조립하는 설정이다.\n\n```java\n@Configuration\n@EnableWebSecurity\n@EnableMethodSecurity\npublic class SecurityConfig {\n\n    @Bean\n    SecurityFilterChain securityFilterChain(HttpSecurity http) throws Exception {\n        http\n            .csrf(csrf -\u003e csrf.disable())\n            .sessionManagement(sm -\u003e\n                sm.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n            .authorizeHttpRequests(auth -\u003e auth\n                .requestMatchers(\"/actuator/health\", \"/api/auth/**\",\n                        \"/v3/api-docs/**\", \"/swagger-ui/**\")\n                    .permitAll()\n                .requestMatchers(HttpMethod.GET, \"/api/posts/**\").permitAll()\n                .anyRequest().authenticated()\n            )\n            .httpBasic(Customizer.withDefaults());\n\n        return http.build();\n    }\n\n    @Bean\n    PasswordEncoder passwordEncoder() {\n        return new BCryptPasswordEncoder();\n    }\n}\n```\n\n**CSRF(Cross-Site Request Forgery)** 는 브라우저가 쿠키를 자동으로 보낼 때 위조 요청을 막는 보호다. 쿠키 세션이 없으면 보통 끈다. 쿠키 기반 로그인 웹앱에서 끄면 구멍이 난다.\n\n비밀번호는 `PasswordEncoder`로만 저장한다. `httpBasic`은 데모용이다.\n\n---\n\n## 3. UserDetailsService\n\n한 줄 정의: 로그인 식별자(이메일 등)로 **사용자와 권한**을 로드하는 포트다.\n\n```java\n@Service\npublic class CustomUserDetailsService implements UserDetailsService {\n\n    private final UserAccountRepository repository;\n\n    public CustomUserDetailsService(UserAccountRepository repository) {\n        this.repository = repository;\n    }\n\n    @Override\n    public UserDetails loadUserByUsername(String username) throws UsernameNotFoundException {\n        UserAccount account = repository.findByEmail(username)\n                .orElseThrow(() -\u003e new UsernameNotFoundException(username));\n        return User.builder()\n                .username(account.getEmail())\n                .password(account.getPasswordHash())\n                .roles(account.getRole().name())\n                .build();\n    }\n}\n```\n\n`.roles(...)`는 `ROLE_` 접두사를 붙인다. DB에 이미 `ROLE_USER`로 저장했다면 `.authorities(...)`를 쓴다.\n\n---\n\n## 4. JWT\n\n한 줄 정의: **JWT(JSON Web Token)** 는 서명된 JSON 클레임이다. 서버가 세션을 저장하지 않고, 클라이언트가 `Authorization: Bearer`로 보낸다.\n\n흐름: `POST /api/auth/login` → access(+ refresh) → 필터가 검증 → `SecurityContext`에 `Authentication`.\n\n```java\npublic String createAccessToken(String subject, Collection\u003cString\u003e roles) {\n    Instant now = Instant.now();\n    return Jwts.builder()\n            .subject(subject)\n            .claim(\"roles\", roles)\n            .issuedAt(Date.from(now))\n            .expiration(Date.from(now.plus(15, ChronoUnit.MINUTES)))\n            .signWith(secretKey)\n            .compact();\n}\n```\n\nAccess는 5~15분, Refresh는 HttpOnly 쿠키 또는 안전한 저장소에 두고 회전한다. 서명 키는 환경변수다. 라이브러리는 `jjwt` 또는 `spring-security-oauth2-jose`(Nimbus)다.\n\n```java\n@Component\npublic class JwtAuthFilter extends OncePerRequestFilter {\n\n    private final JwtTokenProvider tokenProvider;\n\n    public JwtAuthFilter(JwtTokenProvider tokenProvider) {\n        this.tokenProvider = tokenProvider;\n    }\n\n    @Override\n    protected void doFilterInternal(HttpServletRequest request, HttpServletResponse response,\n                                    FilterChain filterChain) throws ServletException, IOException {\n        String token = resolveBearer(request);\n        if (token != null \u0026\u0026 tokenProvider.valid(token)) {\n            Authentication auth = tokenProvider.toAuthentication(token);\n            SecurityContextHolder.getContext().setAuthentication(auth);\n        }\n        filterChain.doFilter(request, response);\n    }\n}\n```\n\n필터는 `UsernamePasswordAuthenticationFilter` 앞에 넣는다. 만료·서명 실패를 삼키고 통과시키면 익명으로 보호 자원에 닿는다.\n\n자체 파서보다 **Authorization Server가 발급한 JWT를 Resource Server로 검증**하는 편이 안전하다.\n\n---\n\n## 5. 메서드 인가\n\nURL 매처만으로는 리소스 소유권을 표현하기 어렵다.\n\n```java\n@PreAuthorize(\"hasRole('ADMIN')\")\n@DeleteMapping(\"/{id}\")\npublic void delete(@PathVariable Long id) { }\n\n@PreAuthorize(\"#email == authentication.name or hasRole('ADMIN')\")\n@GetMapping(\"/me/{email}\")\npublic UserResponse me(@PathVariable String email) { }\n```\n\n소유권 검사는 서비스에서도 한 번 더 한다. 경로 변수만 믿으면 IDOR가 난다.\n\n---\n\n## 6. OAuth2 Resource Server / Login\n\n**OAuth2 Resource Server**는 Keycloak·Auth0·Cognito·Spring Authorization Server가 준 JWT를 표준으로 검증한다.\n\n```yaml\nspring:\n  security:\n    oauth2:\n      resourceserver:\n        jwt:\n          issuer-uri: https://auth.example.com/realms/demo\n```\n\n```java\nhttp.oauth2ResourceServer(oauth2 -\u003e oauth2.jwt(Customizer.withDefaults()));\n```\n\n브라우저 소셜 로그인은 OAuth2 Login(클라이언트)이다. API 서버의 Bearer 검증과 역할이 다르다.\n\n```yaml\nspring:\n  security:\n    oauth2:\n      client:\n        registration:\n          google:\n            client-id: ${GOOGLE_CLIENT_ID}\n            client-secret: ${GOOGLE_CLIENT_SECRET}\n            scope: openid, profile, email\n```\n\n---\n\n## 7. CORS와 운영\n\nSPA가 다른 오리진이면 `CorsConfigurationSource`를 명시한다. `*` origin과 `allowCredentials`는 브라우저가 거부한다.\n\n```java\n@Bean\nCorsConfigurationSource corsConfigurationSource() {\n    CorsConfiguration config = new CorsConfiguration();\n    config.setAllowedOrigins(List.of(\"https://app.example.com\"));\n    config.setAllowedMethods(List.of(\"GET\", \"POST\", \"PUT\", \"PATCH\", \"DELETE\"));\n    config.setAllowedHeaders(List.of(\"*\"));\n    config.setAllowCredentials(true);\n    UrlBasedCorsConfigurationSource source = new UrlBasedCorsConfigurationSource();\n    source.registerCorsConfiguration(\"/api/**\", config);\n    return source;\n}\n```\n\nActuator는 `health` 외 노출을 줄이고 인증한다. 로그인에는 rate limit을 둔다.\n\n---\n\n## 8. 테스트와 흔한 실수\n\n```java\n@WebMvcTest(controllers = UserController.class)\n@Import(SecurityConfig.class)\nclass UserControllerSecurityTest {\n\n    @Autowired MockMvc mockMvc;\n\n    @Test\n    @WithMockUser(roles = \"USER\")\n    void userCannotDelete() throws Exception {\n        mockMvc.perform(delete(\"/api/users/1\"))\n                .andExpect(status().isForbidden());\n    }\n}\n```\n\n| 실수 | 대안 |\n|------|------|\n| CSRF를 쿠키 세션 웹에서 disable | 토큰/쿠키 설정 유지 |\n| JWT를 localStorage에만 장기 보관 | 짧은 TTL + refresh 회전 |\n| URL permit만 하고 소유권 미검사 | `@PreAuthorize` + 서비스 가드 |\n| Swagger·Actuator 전부 permitAll | 운영에서 제한 |\n| 평문 비밀번호 | BCrypt |\n\n---\n\n## 연습\n\n1. `/api/public/**`만 허용하고 나머지는 인증 필수로 둔다.\n2. 회원가입 시 BCrypt로 저장한다.\n3. JWT 필터 또는 Resource Server `issuer-uri`로 Bearer를 검증한다.\n4. `@PreAuthorize`로 ADMIN 전용 삭제를 만든다.\n"])</script><script>self.__next_f.push([1,"64:T174e,"])</script><script>self.__next_f.push([1,"# 테스트 — JUnit 5, MockMvc, Testcontainers\n\n\u003e 요약: 단위·슬라이스·통합 테스트 비중을 나누고, Testcontainers로 실제 DB에 가까운 검증을 한다.\n\n---\n\n## 1. 왜 피라미드를 나누는가\n\n모든 케이스를 `@SpringBootTest`로 올리면 CI가 느리고 실패 지점이 흐려진다. 빠른 테스트로 규칙을 지키고, 조립은 소수 통합으로 확인한다.\n\n| 종류 | 도구 | 목적 |\n|------|------|------|\n| 단위 | JUnit + Mockito | 도메인·서비스 규칙 |\n| 슬라이스 | `@WebMvcTest`, `@DataJpaTest` | 계층 경계 |\n| 통합 | `@SpringBootTest` + Testcontainers | 실제 조립 |\n| E2E | RestAssured 등 | 핵심 시나리오만 |\n\n**슬라이스 테스트**는 웹 또는 JPA처럼 **한 계층만** 띄우는 테스트다.\n\n---\n\n## 2. 단위 테스트\n\nSpring 컨텍스트 없이 생성자로 목을 넣는다.\n\n```java\nclass OrderServiceTest {\n\n    @Test\n    void rejectsEmptyItems() {\n        OrderRepository repo = mock(OrderRepository.class);\n        OrderService service = new OrderService(repo);\n\n        assertThatThrownBy(() -\u003e service.create(new CreateOrderRequest(List.of())))\n                .isInstanceOf(InvalidOrderException.class);\n    }\n}\n```\n\n필드 `@Autowired` 서비스는 이런 테스트가 불편해진다.\n\n---\n\n## 3. `@WebMvcTest`\n\n컨트롤러·검증·예외 핸들러만 올린다. 서비스는 목이다. Boot 3.4+는 `@MockitoBean`(`@MockBean` 후속)을 쓴다.\n\n```java\n@WebMvcTest(UserController.class)\n@Import(GlobalExceptionHandler.class)\nclass UserControllerTest {\n\n    @Autowired MockMvc mockMvc;\n    @MockitoBean UserService userService;\n\n    @Test\n    void createUser() throws Exception {\n        given(userService.create(any()))\n                .willReturn(new UserResponse(1L, \"a@b.com\", \"Ann\"));\n\n        mockMvc.perform(post(\"/api/users\")\n                        .contentType(MediaType.APPLICATION_JSON)\n                        .content(\"\"\"\n                            {\"email\":\"a@b.com\",\"name\":\"Ann\"}\n                            \"\"\"))\n                .andExpect(status().isCreated())\n                .andExpect(jsonPath(\"$.email\").value(\"a@b.com\"));\n    }\n}\n```\n\nSecurity가 켜져 있으면 `@WithMockUser` 또는 `@AutoConfigureMockMvc(addFilters = false)`를 명시한다. 필터를 끄면 인가 버그를 놓친다.\n\n---\n\n## 4. `@DataJpaTest`와 Testcontainers\n\n한 줄 정의: **Testcontainers**는 테스트 동안 Docker로 PostgreSQL 같은 실제 미들웨어를 띄운다. H2는 방언이 달라 운영에서만 깨지는 쿼리가 나온다.\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.springframework.boot\u003c/groupId\u003e\n  \u003cartifactId\u003espring-boot-testcontainers\u003c/artifactId\u003e\n  \u003cscope\u003etest\u003c/scope\u003e\n\u003c/dependency\u003e\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.testcontainers\u003c/groupId\u003e\n  \u003cartifactId\u003epostgresql\u003c/artifactId\u003e\n  \u003cscope\u003etest\u003c/scope\u003e\n\u003c/dependency\u003e\n```\n\n```java\n@TestConfiguration(proxyBeanMethods = false)\npublic class TestcontainersConfig {\n\n    @Bean\n    @ServiceConnection\n    PostgreSQLContainer\u003c?\u003e postgres() {\n        return new PostgreSQLContainer\u003c\u003e(\"postgres:16-alpine\");\n    }\n}\n```\n\n`@ServiceConnection`(Boot 3.1+)이 datasource URL을 붙인다. `@DynamicPropertySource`보다 짧다.\n\n```java\n@DataJpaTest\n@AutoConfigureTestDatabase(replace = AutoConfigureTestDatabase.Replace.NONE)\n@Import(TestcontainersConfig.class)\nclass UserRepositoryTest {\n\n    @Autowired UserRepository userRepository;\n\n    @Test\n    void findByEmail() {\n        userRepository.save(User.create(\"a@b.com\", \"Ann\"));\n        assertThat(userRepository.findByEmail(\"a@b.com\")).isPresent();\n    }\n}\n```\n\n`Replace.ANY`(기본)면 H2로 바뀌어 컨테이너를 띄운 의미가 없다.\n\n---\n\n## 5. `@SpringBootTest`\n\n전체 컨텍스트가 필요할 때만 쓴다. HTTP까지 보려면 `RANDOM_PORT` + `TestRestTemplate` 또는 MockMvc(`@AutoConfigureMockMvc`)다. Boot 3.4+에는 `RestTestClient`도 있다.\n\n```java\n@SpringBootTest\n@Import(TestcontainersConfig.class)\nclass UserServiceIT {\n\n    @Autowired UserService userService;\n\n    @Test\n    void createAndGet() {\n        UserResponse created = userService.create(new CreateUserRequest(\"a@b.com\", \"Ann\"));\n        assertThat(userService.get(created.id()).email()).isEqualTo(\"a@b.com\");\n    }\n}\n```\n\nKafka·Redis도 같은 `@ServiceConnection` 패턴이다.\n\n---\n\n## 6. 데이터·시간·외부 의존성\n\n테스트마다 독립이어야 한다. `@Transactional` 롤백, 또는 컨테이너 재사용 + 테이블 정리. `@Sql`은 데이터가 단순할 때만 쓴다.\n\n```java\nstatic User user(String email) {\n    return User.create(email, email.split(\"@\")[0]);\n}\n```\n\nAssertJ 체인이 JUnit `assertEquals`보다 실패 메시지가 읽기 쉽다.\n\n```java\nassertThat(result)\n        .extracting(UserResponse::email, UserResponse::name)\n        .containsExactly(\"a@b.com\", \"Ann\");\n```\n\n| 대상 | 기법 |\n|------|------|\n| 시간 | `Clock` Bean을 고정 |\n| 외부 HTTP | WireMock / MockWebServer |\n| 메시지 | Testcontainers Kafka |\n| 파일 | `@TempDir` |\n\n```java\n@Bean\n@Primary\nClock fixedClock() {\n    return Clock.fixed(Instant.parse(\"2026-01-01T00:00:00Z\"), ZoneOffset.UTC);\n}\n```\n\n---\n\n## 7. CI\n\n러너에 Docker가 있어야 Testcontainers가 돈다. 로컬 재사용은 `testcontainers.reuse.enable=true`. 실패한 테스트를 재시도로 통과시키지 않는다.\n\n---\n\n## 8. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 전부 `@SpringBootTest` | 단위·슬라이스 먼저 |\n| `@DataJpaTest` + H2로 복잡한 SQL | Testcontainers + `Replace.NONE` |\n| Security 필터를 항상 끔 | 인가 케이스는 `@WithMockUser` |\n| `now()` 직접 호출 | `Clock` 주입 |\n| flaky를 `@RepeatedTest`로 숨김 | 원인 제거 |\n\n---\n\n## 연습\n\n1. 서비스 단위 테스트 2개(성공/실패)를 작성한다.\n2. `@WebMvcTest`로 validation 400을 검증한다.\n3. Testcontainers PostgreSQL로 리포지토리 IT를 작성한다.\n4. `@ServiceConnection`으로 datasource가 붙는지 확인한다.\n"])</script><script>self.__next_f.push([1,"65:T169c,"])</script><script>self.__next_f.push([1,"# Observability — Actuator, Micrometer, OpenTelemetry\n\n\u003e 요약: Actuator와 OpenTelemetry로 헬스·메트릭·트레이스를 붙여, 느린 지점과 장애 지점을 관측한다.\n\n---\n\n## 1. 왜 관측인가\n\n**Observability(관측 가능성)** 는 로그·메트릭·트레이스만으로 “왜 느리고 어디서 깨졌는지”를 답할 수 있는 상태다.\n\n| 기둥 | 질문 |\n|------|------|\n| Logs | 무슨 일이 있었나 |\n| Metrics | 얼마나, 얼마나 자주 |\n| Traces | 이 요청의 시간이 어디에 쓰였나 |\n\nBoot 3는 **Micrometer Observation API**로 메트릭과 트레이스를 같은 계측에서 뽑는다. **Micrometer**는 벤더에 치우치지 않는 메트릭 파사드다.\n\n---\n\n## 2. Actuator\n\n한 줄 정의: **Actuator**는 헬스·메트릭·정보 같은 운영 엔드포인트를 HTTP로 연다.\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.springframework.boot\u003c/groupId\u003e\n  \u003cartifactId\u003espring-boot-starter-actuator\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n```yaml\nmanagement:\n  endpoints:\n    web:\n      exposure:\n        include: health,info,metrics,prometheus\n  endpoint:\n    health:\n      show-details: when_authorized\n      probes:\n        enabled: true\n  server:\n    port: 8081\n```\n\n| Path | 용도 |\n|------|------|\n| `/actuator/health` | 생존·준비 요약 |\n| `/actuator/health/liveness` | k8s liveness |\n| `/actuator/health/readiness` | k8s readiness |\n| `/actuator/prometheus` | Prometheus 스크레이프 |\n| `/actuator/info` | 빌드·앱 정보 |\n\n운영에서는 별도 포트와 인증으로 막는다. `include: '*'`는 힙덤프까지 노출하기 쉽다.\n\n---\n\n## 3. Health Indicator\n\n외부 결제망처럼 앱이 떠 있어도 트래픽을 받으면 안 되는 의존성은 readiness에 넣을지 팀 정책으로 정한다. 헬스마다 외부 ping을 치면 헬스 자체가 장애가 된다.\n\n```java\n@Component\npublic class PaymentGatewayHealthIndicator implements HealthIndicator {\n\n    private final PaymentClient client;\n\n    public PaymentGatewayHealthIndicator(PaymentClient client) {\n        this.client = client;\n    }\n\n    @Override\n    public Health health() {\n        try {\n            client.ping();\n            return Health.up().withDetail(\"payment\", \"reachable\").build();\n        } catch (Exception e) {\n            return Health.down(e).build();\n        }\n    }\n}\n```\n\n---\n\n## 4. 메트릭과 Observation\n\nPrometheus 레지스트리를 붙이면 `/actuator/prometheus`로 나간다.\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eio.micrometer\u003c/groupId\u003e\n  \u003cartifactId\u003emicrometer-registry-prometheus\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\nHTTP 서버·`RestClient`·DataSource는 Boot가 기본 계측한다. 비즈니스 카운터는 직접 심는다.\n\n```java\n@Service\npublic class CheckoutService {\n\n    private final Counter checkoutCounter;\n    private final Timer checkoutTimer;\n\n    public CheckoutService(MeterRegistry registry) {\n        this.checkoutCounter = registry.counter(\"checkout.completed\");\n        this.checkoutTimer = registry.timer(\"checkout.latency\");\n    }\n\n    public void checkout(Order order) {\n        checkoutTimer.record(() -\u003e {\n            // 유스케이스\n            checkoutCounter.increment();\n        });\n    }\n}\n```\n\nObservation은 메트릭과 트레이스를 한 구간으로 묶는다. 카디널리티가 높은 값(userId, 주문번호)을 태그로 넣으면 시계열이 폭발한다.\n\n```java\nObservation.createNotStarted(\"order.create\", observationRegistry)\n        .lowCardinalityKeyValue(\"type\", \"online\")\n        .observe(() -\u003e orderService.create(request));\n```\n\n---\n\n## 5. OpenTelemetry\n\n한 줄 정의: **OpenTelemetry(OTel)** 는 트레이스·메트릭·로그를 보내는 공개 표준이다. Micrometer Tracing이 OTel 브리지로 스팬을 내보내고, Collector가 Jaeger·Tempo 등으로 넘긴다.\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eio.micrometer\u003c/groupId\u003e\n  \u003cartifactId\u003emicrometer-tracing-bridge-otel\u003c/artifactId\u003e\n\u003c/dependency\u003e\n\u003cdependency\u003e\n  \u003cgroupId\u003eio.opentelemetry\u003c/groupId\u003e\n  \u003cartifactId\u003eopentelemetry-exporter-otlp\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n```yaml\nmanagement:\n  tracing:\n    sampling:\n      probability: 1.0\n  otlp:\n    tracing:\n      endpoint: http://localhost:4318/v1/traces\n\nlogging:\n  pattern:\n    level: \"%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]\"\n```\n\n운영 샘플링은 0.05~0.2부터 본다. 전 요청 트레이스는 비용이 크다. 로그에 `traceId`가 있으면 티켓·로그·트레이스를 같은 요청으로 잇는다.\n\n| 환경 | probability |\n|------|-------------|\n| local | 1.0 |\n| staging | 0.5~1.0 |\n| prod | 0.05~0.2 |\n\n---\n\n## 6. 구조화 로그\n\n운영 로그는 JSON이 검색·알람에 유리하다. Logback encoder 또는 Log4j2 JSON layout을 쓴다.\n\n남길 것: timestamp, level, service, env, traceId, spanId, 내부 userId, 제한된 스택.  \n남기지 말 것: 비밀번호, 토큰, 카드번호, 주민번호, 개인정보 원문.\n\n---\n\n## 7. 알람 최소선\n\n- `http.server.requests` p99 급증\n- `hikaricp.connections.pending`이 지속\n- 5xx 비율\n- readiness 실패\n- JVM GC·힙, Tomcat 큐\n\n대시보드는 RED(Rate, Errors, Duration)와 의존성 지연, 그리고 `order.created` 같은 비즈니스 카운터를 같이 본다.\n\n---\n\n## 8. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| Actuator `*` 노출 | 화이트리스트 + 별도 포트 |\n| userId를 메트릭 태그 | low cardinality만 |\n| prod 샘플링 1.0 | 트래픽에 맞게 낮춤 |\n| 로그에 토큰·PII | 마스킹 |\n| 기술 메트릭만 | 비즈니스 카운터 |\n\n---\n\n## 연습\n\n1. Actuator + Prometheus registry로 `/actuator/prometheus`를 확인한다.\n2. `order.created` 카운터를 추가한다.\n3. 로그 패턴에 `traceId`를 넣는다.\n4. (선택) OTel Collector + Jaeger로 스팬을 본다.\n"])</script><script>self.__next_f.push([1,"66:T1816,"])</script><script>self.__next_f.push([1,"# 비동기·메시징·Virtual Threads\n\n\u003e 요약: Virtual Threads와 이벤트·메시지 큐를 용도에 맞게 고르고, 커밋 이후 발행과 Outbox로 유실을 줄인다.\n\n---\n\n## 1. 왜 전부 리액티브가 아닌가\n\n요청-응답 CRUD는 동기 MVC로 충분한 경우가 많다. 팀 숙련도와 블로킹 라이브러리(JPA, JDBC)를 보고 고른다.\n\n| 요구 | 선택 |\n|------|------|\n| 단순 REST + JDBC | MVC + Virtual Threads |\n| 응답은 바로, 후처리는 나중 | 이벤트 또는 큐 |\n| 높은 동시 블로킹 I/O | Virtual Threads |\n| CPU 집약 | 플랫폼 스레드 풀 제한 |\n| 서비스 간 재시도·재생 | Kafka / RabbitMQ / SQS |\n\n---\n\n## 2. Virtual Threads\n\n한 줄 정의: Java 21의 **Virtual Thread**는 OS 스레드에 1:1로 묶이지 않는 가벼운 스레드다. 블로킹 I/O 대기 중에도 캐리어 스레드를 오래 점유하지 않는다. Boot 3.2+에서 Tomcat 요청에 붙는다.\n\n```yaml\nspring:\n  threads:\n    virtual:\n      enabled: true\n```\n\nCPU 바운드에는 효과가 작다. Java 21에서 오래 잡는 `synchronized`는 캐리어 **pinning**이 난다. 스레드 로컬을 크게 쓰는 라이브러리는 확인한다. 가상 스레드를 켜도 **Hikari 풀 크기**가 DB 동시 접속의 천장이다.\n\n---\n\n## 3. `@Async`\n\n같은 JVM 안에서 “조금 나중에” 실행할 때만 쓴다. 재시도·DLQ·순서 보장이 없고, 프로세스가 죽으면 작업이 사라진다.\n\n```java\n@Configuration\n@EnableAsync\npublic class AsyncConfig {\n\n    @Bean\n    TaskExecutor taskExecutor() {\n        return task -\u003e Thread.startVirtualThread(task);\n    }\n}\n```\n\n```java\n@Service\npublic class MailService {\n    @Async\n    public void sendWelcome(String email) {\n        // SMTP\n    }\n}\n```\n\n중요한 후처리는 브로커로 넘긴다.\n\n---\n\n## 4. 애플리케이션 이벤트\n\n같은 앱에서 결합을 낮출 때 쓴다. **`@TransactionalEventListener(AFTER_COMMIT)`** 이 핵심이다. 커밋 전에 메일을 보내면 롤백된 주문에 환영 메일이 간다.\n\n```java\npublic record OrderCreatedEvent(Long orderId, String email) {}\n\n@Service\npublic class OrderService {\n    private final ApplicationEventPublisher publisher;\n    private final OrderRepository repository;\n\n    public OrderService(ApplicationEventPublisher publisher, OrderRepository repository) {\n        this.publisher = publisher;\n        this.repository = repository;\n    }\n\n    @Transactional\n    public OrderResponse create(CreateOrderRequest request) {\n        Order order = repository.save(Order.create(request));\n        publisher.publishEvent(new OrderCreatedEvent(order.getId(), order.getEmail()));\n        return OrderResponse.from(order);\n    }\n}\n\n@Component\npublic class OrderCreatedListener {\n    private final MailService mailService;\n\n    public OrderCreatedListener(MailService mailService) {\n        this.mailService = mailService;\n    }\n\n    @TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)\n    public void on(OrderCreatedEvent event) {\n        mailService.sendWelcome(event.email());\n    }\n}\n```\n\n기본 이벤트는 발행 스레드에서 돈다. 완전 분리하려면 `@Async` 또는 큐다. AFTER_COMMIT 리스너 실패는 주문 트랜잭션을 되돌리지 않으므로, 실패를 로그·재시도 없이 삼키지 않는다.\n\n---\n\n## 5. Kafka와 Outbox\n\nKafka는 **이벤트 로그**—재생·파티션 순서·다중 소비자에 강하다. 메일·썸네일·리포트처럼 “일감 하나”를 경쟁 소비자가 나눠 가지면 RabbitMQ(또는 SQS)가 더 단순하다. 교환기·라우팅 키로 구독 대상을 나누는 작업 큐에 맞다.\n\n```yaml\nspring:\n  kafka:\n    bootstrap-servers: ${KAFKA_BROKERS}\n    consumer:\n      group-id: demo-service\n      auto-offset-reset: earliest\n    producer:\n      key-serializer: org.apache.kafka.common.serialization.StringSerializer\n      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer\n```\n\n```java\nkafkaTemplate.send(\"order.created\", event.orderId().toString(), event);\n\n@KafkaListener(topics = \"order.created\", groupId = \"mail-service\")\npublic void consume(OrderCreatedEvent event) {\n    mailService.sendWelcome(event.email());\n}\n```\n\n소비자는 멱등해야 한다. 스키마는 호환 규칙을 정하고, 실패는 재시도 후 **DLT(Dead Letter Topic)** 로 보낸다. 파티션 키가 순서 보장 범위다.\n\n**Outbox**: DB 커밋 후 Kafka 전송이 실패하면 상태가 갈라진다. 같은 트랜잭션에 비즈니스 행과 `outbox` 행을 쓰고, 별도 퍼블리셔(또는 Debezium CDC)가 브로커로 보낸 뒤 처리 완료를 표시한다.\n\n```sql\nCREATE TABLE outbox (\n    id           BIGSERIAL PRIMARY KEY,\n    aggregate_id BIGINT NOT NULL,\n    event_type   VARCHAR(100) NOT NULL,\n    payload      JSONB NOT NULL,\n    created_at   TIMESTAMPTZ NOT NULL,\n    published_at TIMESTAMPTZ\n);\n```\n\n`published_at IS NULL`인 행만 폴링한다. 전송 성공과 마킹을 한 작업으로 두고, 중복 발행에 대비해 소비자는 멱등이어야 한다.\n\n---\n\n## 6. WebFlux를 보는 시점\n\n동시 연결이 매우 많고 다운스트림이 모두 non-blocking이거나, SSE/WebSocket이 핵심이면 검토한다. JDBC/JPA 중심이고 블로킹 라이브러리가 많으면 MVC + Virtual Threads가 보통 낫다.\n\nHTTP 클라이언트는 connect/read timeout을 명시한다. 가상 스레드여도 무한 대기는 큐와 풀을 채운다. 카프카 리스너 처리 시간과 큐 적체를 메트릭으로 본다.\n\n---\n\n## 7. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| `@Async`로 결제 확정 | 브로커 + 멱등 소비자 |\n| 커밋 전 메일 발송 | `AFTER_COMMIT` 또는 Outbox |\n| Virtual Threads만 켜기 | 풀·타임아웃 함께 |\n| 비멱등 consume | 키 테이블·조건부 갱신 |\n| DB 커밋과 produce를 따로 | Outbox |\n\n---\n\n## 연습\n\n1. Virtual Threads를 켜고, 대기 있는 API의 처리량을 비교한다.\n2. `OrderCreatedEvent` + `AFTER_COMMIT`으로 메일(로그)을 보낸다.\n3. (선택) Kafka Testcontainers로 produce/consume IT를 작성한다.\n4. Outbox 테이블을 스케치한다.\n"])</script><script>self.__next_f.push([1,"67:T17bb,"])</script><script>self.__next_f.push([1,"# 캐시·Resilience·성능 최적화\n\n\u003e 요약: 측정 뒤에 캐시·재시도·서킷 브레이커·타임아웃을 넣고, 쿼리와 페이로드 병목을 줄인다.\n\n---\n\n## 1. 왜 측정이 먼저인가\n\n감으로 캐시를 켜면 잘못된 키·TTL이 더 큰 장애가 된다. 순서는 측정 → 쿼리/N+1 → 풀·타임아웃 → 캐시 → 스케일 아웃이다. 가장 싼 최적화는 **안 하는 일**을 줄이는 것이다.\n\n---\n\n## 2. Spring Cache\n\n한 줄 정의: 같은 입력의 비싼 조회 결과를 **이름 붙은 저장소**에 잠시 두는 것이다. `@EnableCaching` + `@Cacheable` / `@CacheEvict`가 선언적 API다.\n\n```java\n@Configuration\n@EnableCaching\npublic class CacheConfig {\n    @Bean\n    CacheManager cacheManager() {\n        return new ConcurrentMapCacheManager(\"products\", \"users\");\n    }\n}\n```\n\n```java\n@Cacheable(cacheNames = \"products\", key = \"#id\")\npublic ProductResponse get(Long id) { }\n\n@CacheEvict(cacheNames = \"products\", key = \"#id\")\npublic void update(Long id, UpdateProductRequest request) { }\n```\n\n`ConcurrentMap`은 프로세스 하나용이고 TTL이 없다. 단일 인스턴스에서 TTL이 필요하면 Caffeine이 기본선이다. 인스턴스가 여러 개면 Redis(`spring-boot-starter-data-redis`)다.\n\n```yaml\nspring:\n  cache:\n    type: caffeine\n    caffeine:\n      spec: maximumSize=10_000,expireAfterWrite=5m\n```\n\n캐시 키가 사용자와 무관하면 권한 데이터가 섞인다. TTL과 무효화를 같이 정한다. **캐시 스탬피드**는 만료 순간 요청이 한꺼번에 원본을 두드리는 현상이다. 락·singleflight 또는 소프트 만료로 줄인다. `@Cacheable` 메서드가 self-invocation(같은 클래스 내부 호출)이면 프록시를 안 타서 캐시가 비어 있다.\n\n---\n\n## 3. Resilience4j\n\n한 줄 정의: 원격 호출이 실패·지연할 때 **재시도·차단·격리**로 내 스레드와 의존성을 보호하는 라이브러리다. 아티팩트는 `resilience4j-spring-boot3`다.\n\n외부 호출에는 타임아웃이 필수다. 타임아웃 없는 클라이언트는 가상 스레드든 플랫폼 스레드든 풀을 고갈시킨다.\n\n```java\nJdkClientHttpRequestFactory factory = new JdkClientHttpRequestFactory();\nfactory.setReadTimeout(Duration.ofSeconds(3));\nRestClient client = RestClient.builder()\n        .requestFactory(factory)\n        .baseUrl(props.baseUrl())\n        .build();\n```\n\n### Retry\n\n멱등하지 않은 POST에 무분별한 재시도는 결제를 두 번 만든다. 네트워크·408·429·5xx만, 그리고 Idempotency-Key가 있을 때만 재시도한다.\n\n```yaml\nresilience4j:\n  retry:\n    instances:\n      payment:\n        maxAttempts: 3\n        waitDuration: 200ms\n        retryExceptions:\n          - java.io.IOException\n```\n\n```java\n@Retry(name = \"payment\", fallbackMethod = \"payFallback\")\npublic PaymentResult pay(PaymentRequest request) {\n    return paymentClient.charge(request);\n}\n```\n\n### Circuit Breaker\n\n한 줄 정의: 실패율이 임계를 넘으면 **호출을 잠시 끊고**(open) 연쇄 실패를 막은 뒤, 시험 호출(half-open)로 닫는다.\n\n```yaml\nresilience4j:\n  circuitbreaker:\n    instances:\n      payment:\n        slidingWindowSize: 20\n        failureRateThreshold: 50\n        waitDurationInOpenState: 10s\n```\n\n### Bulkhead / RateLimiter / Fallback\n\nBulkhead는 동시 실행 수를 나눠 한 의존성이 스레드를 다 먹지 못하게 한다. Fallback은 비즈니스적으로 안전할 때만 쓴다. 가짜 성공은 재고·결제에서 금지다.\n\n```java\nprivate PaymentResult payFallback(PaymentRequest request, Throwable t) {\n    return PaymentResult.failed(\"temporary unavailable\");\n}\n```\n\n---\n\n## 4. DB와 페이로드\n\n- `WHERE` / `JOIN` / `ORDER BY`에 인덱스, `EXPLAIN ANALYZE`로 확인\n- 목록은 엔티티 그래프 대신 DTO 프로젝션\n- 페이지 크기 상한, 장시간 트랜잭션 금지\n\n```yaml\nspring:\n  datasource:\n    hikari:\n      maximum-pool-size: 10\n      connection-timeout: 3000\n```\n\nHikari `maximum-pool-size`는 인스턴스 수 × 풀이 DB `max_connections`를 넘지 않게 둔다. 풀을 키우기 전에 슬로우 쿼리와 트랜잭션 길이를 본다.\n\n오프셋 `page=100000`은 깊게 갈수록 느리다. 피드성 API는 **키셋 페이지네이션**—이미 본 마지막 id보다 작은 행만 가져오기—이 맞다.\n\n```java\nList\u003cPost\u003e findByIdLessThanOrderByIdDesc(Long cursor, Pageable pageable);\n```\n\n큰 JSON은 전용 DTO와 `@JsonIgnore`로 줄이고, 파일은 오브젝트 스토리지 + CDN으로 뺀다.\n\n---\n\n## 5. 동시성과 멱등\n\n재고 차감은 낙관적 락·DB 제약·단일 큐 중 하나를 고른다. Redis 분산 락은 만료·펜싱 토큰 없이 쓰기 쉽다.\n\n```java\n@Entity\n@Table(name = \"idempotency_keys\",\n        uniqueConstraints = @UniqueConstraint(columnNames = \"key_value\"))\npublic class IdempotencyKey {\n    @Id\n    private String keyValue;\n    private String responseHash;\n}\n```\n\n컨테이너 메모리 한도에 heap을 맞춘다(`MaxRAMPercentage`). Native Image는 기동·RSS에 유리하지만 빌드와 리플렉션 제약이 있다.\n\n---\n\n## 6. 부하 테스트\n\nk6·Gatling·JMeter로 **같은 시나리오**를 최적화 전후에 돌린다. RPS, p50/p95/p99, 에러율, CPU·힙·GC, DB 커넥션·slow query, 외부 의존성 지연을 같이 본다.\n\n---\n\n## 7. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 캐시만 넣고 evict 없음 | 갱신 경로에 `@CacheEvict` |\n| 같은 클래스 내부에서 `@Cacheable` 호출 | 별도 Bean으로 분리 |\n| 사용자별 데이터를 공용 키 | 키에 주체 포함 |\n| 비멱등 POST 재시도 | 키·안전한 상태 코드만 |\n| 서킷 없이 재시도만 | 실패 폭풍 → 브레이커 |\n| 타임아웃 0에 가까운 무한 대기 | connect/read 명시 |\n\n---\n\n## 연습\n\n1. 상품 조회에 `@Cacheable`, 수정에 evict를 붙인다.\n2. 외부 호출에 CircuitBreaker + Retry를 적용한다.\n3. RestClient read timeout을 3초로 둔다.\n4. 느린 목록을 키셋 페이지네이션으로 바꾼다.\n"])</script><script>self.__next_f.push([1,"68:T1628,"])</script><script>self.__next_f.push([1,"# 운영 배포 — Docker, 설정, Native Image, 프로덕션 체크리스트\n\n\u003e 요약: 환경변수와 컨테이너로 배포하고, 헬스 프로브·그레이스풀 종료·Native Image를 운영 기본선에 맞춘다.\n\n---\n\n## 1. 왜 설정과 프로세스를 나누는가\n\n앱은 코드와 설정을 분리하고, 로그는 stdout으로 보내며, 종료 신호를 받으면 요청을 비운 뒤 죽는다. Boot에서는 프로파일·환경변수와 **graceful shutdown**이 그 기본선이다.\n\n한 줄 정의: graceful shutdown은 새 요청을 끊고, 진행 중 요청이 끝날 때까지 기다린 다음 프로세스를 종료하는 것이다.\n\n```yaml\nserver:\n  shutdown: graceful\n\nspring:\n  lifecycle:\n    timeout-per-shutdown-phase: 30s\n```\n\n로드밸런서가 인스턴스를 빼는 시간보다 `timeout-per-shutdown-phase`가 짧으면 요청이 잘린다.\n\n---\n\n## 2. 시크릿\n\n`application-prod.yml`에 DB 비밀번호를 커밋하거나 이미지에 굽지 않는다. `SPRING_PROFILES_ACTIVE=prod`, 값은 환경변수·K8s Secret·Secrets Manager·Vault다. 필수 시크릿이 없으면 **기동 실패**가 기본값으로 떠서 잘못된 DB에 붙는 것보다 낫다.\n\n```yaml\nspring:\n  datasource:\n    url: ${DB_URL}\n    username: ${DB_USER}\n    password: ${DB_PASSWORD}\n```\n\n---\n\n## 3. Dockerfile\n\nJava 21 런타임, non-root, 컨테이너 메모리의 일부만 힙으로 쓴다.\n\n```dockerfile\nFROM eclipse-temurin:21-jdk-alpine AS build\nWORKDIR /workspace\nCOPY . .\nRUN ./mvnw -q -DskipTests package\n\nFROM eclipse-temurin:21-jre-alpine\nWORKDIR /app\nRUN adduser -D spring\nUSER spring\nCOPY --from=build /workspace/target/demo-*.jar app.jar\nEXPOSE 8080\nENTRYPOINT [\"java\",\"-XX:MaxRAMPercentage=75.0\",\"-jar\",\"/app/app.jar\"]\n```\n\n의존성이 안 바뀌면 레이어를 재사용하도록 **Layered JAR**를 쓴다.\n\n```bash\njava -Djarmode=layertools -jar app.jar extract\n```\n\nDockerfile에서 `dependencies` → `spring-boot-loader` → `application` 순으로 COPY한다. distroless/chiseled 이미지는 공격면을 줄인다. 빌드에 `.mvn`·wrapper가 없으면 CI의 `./mvnw`가 실패한다.\n\n---\n\n## 4. Compose (로컬)\n\nDB가 healthy일 때까지 앱을 기다린다.\n\n```yaml\nservices:\n  app:\n    build: .\n    ports:\n      - \"8080:8080\"\n    environment:\n      SPRING_PROFILES_ACTIVE: local\n      DB_URL: jdbc:postgresql://db:5432/demo\n      DB_USER: demo\n      DB_PASSWORD: demo\n    depends_on:\n      db:\n        condition: service_healthy\n  db:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_DB: demo\n      POSTGRES_USER: demo\n      POSTGRES_PASSWORD: demo\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U demo\"]\n      interval: 5s\n      timeout: 5s\n      retries: 5\n```\n\n---\n\n## 5. Kubernetes 프로브\n\n**liveness**는 프로세스가 죽었으면 재시작하고, **readiness**는 준비가 안 됐으면 트래픽을 빼는 검사다. 둘을 같은 URL로 묶으면, 의존성 장애 때 재시작 루프가 난다. Actuator probes를 켜고 관리 포트(예: 8081)를 가리킨다.\n\n```yaml\nlivenessProbe:\n  httpGet:\n    path: /actuator/health/liveness\n    port: 8081\nreadinessProbe:\n  httpGet:\n    path: /actuator/health/readiness\n    port: 8081\nresources:\n  requests:\n    cpu: \"250m\"\n    memory: \"512Mi\"\n  limits:\n    memory: \"768Mi\"\n```\n\n메모리 limit 없이 JVM만 올리면 노드 OOMKill이 난다. CPU limit은 스로틀이 커질 수 있어 request와 함께 본다.\n\n---\n\n## 6. CI/CD\n\n1. 단위 + Testcontainers IT\n2. 포맷·정적 분석\n3. 의존성 취약점(Trivy 등)\n4. 이미지 빌드·스캔\n5. 스테이징 스모크\n6. 카나리 또는 블루그린\n\n`main` 직접 푸시보다 PR 필수 체크가 안전하다. Flyway는 배포 파이프라인에서 한 방향으로만 적용한다.\n\n---\n\n## 7. GraalVM Native Image\n\n한 줄 정의: 미리 AOT 컴파일한 **네이티브 실행 파일**이다. 기동이 빠르고 RSS가 낮다. Boot 3에서 정식이다.\n\n```bash\n./mvnw -Pnative native:compile\n```\n\n빌드 시간이 길고, 리플렉션·프록시 힌트가 필요할 수 있다. 서버리스·스케일-to-zero에 잘 맞는다. 상시 트래픽 큰 서비스는 JVM + 컨테이너 메모리 튜닝으로도 충분한 경우가 많다. 라이브러리가 네이티브를 지원하는지 먼저 본다.\n\n---\n\n## 8. 로그·시간대\n\n액세스/감사 로그를 애플리케이션 로그와 나누고 PII를 마스킹한다. 서버 시각은 UTC, 표시만 로컬이다.\n\n---\n\n## 9. 프로덕션 체크리스트\n\n### 보안\n\n- [ ] 패치된 JRE 베이스 이미지\n- [ ] Actuator·Swagger 최소 노출 + 인증\n- [ ] 시크릿 미커밋\n- [ ] HTTPS, 명시적 CORS origin\n- [ ] 의존성 스캔\n\n### 신뢰성\n\n- [ ] graceful shutdown과 LB drain 시간 일치\n- [ ] Flyway 자동화\n- [ ] 타임아웃·재시도·서킷 브레이커\n- [ ] liveness / readiness 분리\n- [ ] DB 백업·복구 훈련\n\n### 관측·성능\n\n- [ ] 5xx·p99·풀 대기 알람\n- [ ] 트레이스 샘플링, 로그 `traceId`\n- [ ] 부하 테스트 결과\n- [ ] 풀 크기 × 레플리카 ≤ DB 한도\n\n---\n\n## 10. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 이미지에 비밀번호 | 런타임 시크릿 |\n| liveness = readiness | 프로브 분리 |\n| root 유저 | `USER spring` |\n| heap이 컨테이너 limit보다 큼 | `MaxRAMPercentage` |\n| 종료 타임아웃 \u003c drain | 둘을 맞춤 |\n\n---\n\n## 연습\n\n1. 샘플 API를 멀티스테이지 이미지로 만든다.\n2. Compose로 app + Postgres를 띄운다.\n3. `/actuator/health`가 UP인지 확인한다.\n4. 위 체크리스트를 통과/미통과로 표시한다.\n5. (선택) Native 기동 시간을 JVM jar와 비교한다.\n"])</script><script>self.__next_f.push([1,"69:T2d60,"])</script><script>self.__next_f.push([1,"# Spring AOP — 횡단 관심사와 프록시 쉽게 이해하기\n\n\u003e 요약: 공통 관심사(로깅, 트랜잭션 등)를 핵심 로직에서 분리하는 AOP의 원리와 실무 프록시 동작 방식을 친절하게 정리한다.\n\n---\n\n## 1. AOP란 무엇인가? (쉬운 비유로 시작하기)\n\n식당에서 주문을 받고 요리하는 상황을 떠올려 보자.\n\n- **주방장의 본업(핵심 로직)**: 주문받은 요리 맛있게 만들기 (주문 생성, 결제 승인, 회원 가입 등)\n- **공통 부가 작업(횡단 관심사)**:\n  - 주방에 들어갈 때 손 소독하기 (인증/권한 검사)\n  - 요리 시작 시간과 끝난 시간 기록하기 (성능 측정 / 로깅)\n  - 재료가 상했으면 작업 취소하고 폐기하기 (트랜잭션 롤백 / 예외 처리)\n\n만약 100가지 메뉴를 만들 때마다 주방장이 일일이 손 소독 코드를 넣고, 스톱워치를 켜고 끄는 코드를 모든 요리 메서드에 직접 적는다면 어떻게 될까?\n\n```java\n// AOP 없이 작성한 비즈니스 코드의 비극\npublic void orderMenu(OrderRequest req) {\n    // 1. 공통 부가 작업: 권한 검사\n    authService.checkAdmin();\n    // 2. 공통 부가 작업: 시간 측정 시작\n    long start = System.currentTimeMillis();\n\n    try {\n        // === [진짜 하고 싶었던 핵심 비즈니스 로직 2줄] ===\n        Order order = orderRepository.save(new Order(req));\n        paymentGateway.pay(order);\n        // ============================================\n    } catch (Exception e) {\n        // 3. 공통 부가 작업: 에러 로깅 \u0026 알림\n        slackNotifier.sendError(e);\n        throw e;\n    } finally {\n        // 4. 공통 부가 작업: 실행 시간 로깅\n        long end = System.currentTimeMillis();\n        log.info(\"orderMenu 실행 시간: {}ms\", (end - start));\n    }\n}\n```\n\n진짜 중요한 **주문과 결제 로직은 2줄**뿐인데, 부가 작업 코드가 앞뒤를 덮어버린다. 게다가 이런 메서드가 100개라면 시간 측정 방식을 바꿀 때 100개 메서드를 전부 수정해야 한다.\n\n이 문제를 해결하기 위해 등장한 것이 바로 **AOP(Aspect-Oriented Programming, 관점 지향 프로그래밍)** 다. 부가 기능(횡단 관심사)을 한곳으로 쏙 뽑아내어 모듈화하고, 핵심 비즈니스 로직은 본연의 역할에만 집중하게 만든다.\n\n---\n\n## 2. AOP 핵심 용어 5분 만에 마스터하기\n\n용어가 다소 낯설지만, 일상적인 개념에 대입하면 아주 단순하다.\n\n| 용어 | 쉬운 설명 | 일상 비유 | 스프링 코드 예시 |\n|------|-----------|-----------|------------------|\n| **Aspect (관점/부가기능 팩)** | 부가 기능들을 모아놓은 모듈 클래스 | '보안/위생 관리 규정집' | `@Aspect @Component class LoggingAspect` |\n| **Advice (언제 + 무엇을 할지)** | 실제로 실행될 부가 기능 코드 | '요리 전 손 씻기', '요리 후 뒷정리' | `@Before`, `@After`, `@Around` 메서드 |\n| **Join Point (끼어들 수 있는 지점)** | 부가 기능을 끼워 넣을 수 있는 모든 위치 | 레시피의 각 단계 (재료 손질 전, 불 켜기 전 등) | 스프링에서는 **메서드 실행 시점** |\n| **Pointcut (어디에 끼워 넣을지)** | 수많은 메서드 중 실제로 적용할 타깃을 고르는 필터 | '불을 쓰는 모든 요리'만 선택 | `@annotation(MeasureTime)` |\n| **Target (대상 객체)** | 부가 기능을 적용받는 순수 비즈니스 객체 | 순수 요리 레시피 | `OrderService`, `MemberService` |\n| **Proxy (대리자/가짜 객체)** | 타깃 앞에서 부가 기능을 먼저 가로채 실행해 주는 비서 | 주방장 앞에 서서 스톱워치 재주는 보조 요리사 | 스프링이 자동 생성하는 CGLIB 프록시 객체 |\n\n---\n\n## 3. 스프링 AOP의 비밀: '프록시(Proxy)'란?\n\n스프링 AOP는 마법이 아니다. **대리인(Proxy) 객체**를 중간에 세워서 작동한다.\n\n우리가 `@Autowired OrderService orderService`로 주입받는 객체는 실제 `OrderService`가 아니라, 스프링이 감싸서 만든 **가짜 껍데기(Proxy 객체)** 다.\n\n```\n[클라이언트(Controller)] \n       │ \n       ▼ (1) orderService.order() 호출\n[OrderService 프록시 (가짜 객체)] \n       │  ├─▶ [시간 측정 시작!] (Advice 실행)\n       │  ▼ (2) 진짜 메서드 실행 위임\n[OrderService 원본 (진짜 타깃 객체)] \n       │  ├─▶ 핵심 주문 로직 실행\n       │  ▼ (3) 결과 반환\n[OrderService 프록시 (가짜 객체)] \n       │  ├─▶ [시간 측정 종료 \u0026 로그 출력!] (Advice 실행)\n       ▼ (4) 최종 반환\n[클라이언트(Controller)]\n```\n\n### 프록시 생성 방식 (CGLIB)\nSpring Boot는 기본적으로 **CGLIB**라는 바이트코드 조작 기술을 사용한다. 타깃 클래스를 상속받아 자식 클래스 프록시를 만들기 때문에, 인터페이스가 없어도 일반 클래스에 AOP를 바로 적용할 수 있다.\n\n---\n\n## 4. Advice 종류 5가지 한눈에 보기\n\n| Advice 어노테이션 | 실행 타이밍 | 주로 사용하는 곳 |\n|-------------------|-------------|------------------|\n| `@Before` | 타깃 메서드가 실행되기 **직전** | 권한 체크, 요청 파라미터 유효성 사전 검사 |\n| `@AfterReturning` | 타깃 메서드가 **정상적으로 끝난 직후** | 반환값 로깅, 성공 감사 로그 기록 |\n| `@AfterThrowing` | 타깃 메서드에서 **예외가 터졌을 때** | 에러 슬랙 알림, 예외 변환 |\n| `@After` | 성공/예외 상관없이 **메서드가 끝날 때** (finally) | 사용했던 리소스 정리 |\n| **`@Around`** | **메서드 실행 전 + 후 전체를 감쌈** | **실행 시간 측정, 트랜잭션, 캐싱, 재시도 로직 (가장 많이 씀)** |\n\n---\n\n## 5. 실전 예제: 내 손으로 직접 만드는 `@MeasureTime` (시간 측정 AOP)\n\n실무에서 가장 유용하게 쓰이는 **커스텀 어노테이션 기반 시간 측정 AOP**를 단계별로 만들어 보자.\n\n### Step 1. 커스텀 어노테이션 만들기\n메서드 위에 붙일 스티커 같은 어노테이션을 정의한다.\n\n```java\npackage com.example.annotation;\n\nimport java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\n@Target(ElementType.METHOD) // 메서드에 붙이겠다고 선언\n@Retention(RetentionPolicy.RUNTIME) // 런타임까지 유지\npublic @interface MeasureTime {\n    String value() default \"\"; // 작업 이름 (옵션)\n}\n```\n\n### Step 2. Aspect(부가기능 처리기) 만들기\n\n```java\npackage com.example.aop;\n\nimport com.example.annotation.MeasureTime;\nimport lombok.extern.slf4j.Slf4j;\nimport org.aspectj.lang.ProceedingJoinPoint;\nimport org.aspectj.lang.annotation.Around;\nimport org.aspectj.lang.annotation.Aspect;\nimport org.springframework.stereotype.Component;\n\n@Slf4j\n@Aspect      // 1. AOP 설정 클래스임을 명시\n@Component   // 2. 스프링 빈으로 등록\npublic class ExecutionTimeAspect {\n\n    // @MeasureTime 어노테이션이 붙은 메서드 전후(@Around)에 이 로직을 끼워넣음\n    @Around(\"@annotation(measureTime)\")\n    public Object measureExecutionTime(ProceedingJoinPoint joinPoint, MeasureTime measureTime) throws Throwable {\n        String taskName = measureTime.value().isBlank() \n                ? joinPoint.getSignature().toShortString() \n                : measureTime.value();\n\n        long startTime = System.currentTimeMillis();\n        log.info(\"[시작] {}\", taskName);\n\n        try {\n            // 진짜 타깃 메서드를 실행하는 핵심 코드!\n            Object result = joinPoint.proceed();\n            return result;\n        } finally {\n            long totalTime = System.currentTimeMillis() - startTime;\n            if (totalTime \u003e 1000) {\n                log.warn(\"[경고: 느린 작업] {} 완료! 소요시간: {}ms\", taskName, totalTime);\n            } else {\n                log.info(\"[완료] {} 완료! 소요시간: {}ms\", taskName, totalTime);\n            }\n        }\n    }\n}\n```\n\n### Step 3. 서비스 코드에 스티커처럼 붙이기\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class OrderService {\n\n    private final OrderRepository orderRepository;\n\n    @MeasureTime(\"전체 주문 통계 집계\")\n    public List\u003cOrderSummary\u003e calculateMonthlyReport(int year, int month) {\n        // 복잡하고 오래 걸리는 비즈니스 쿼리 실행...\n        return orderRepository.getMonthlyReport(year, month);\n    }\n}\n```\n\n비즈니스 코드는 시간 측정 관련 코드가 1줄도 없이 순수하게 유지된다.\n\n---\n\n## 6. 실무 주의사항: 내부 호출(Self-Invocation)의 덫\n\nAOP를 처음 쓸 때 가장 많이 겪는 미스터리한 버그가 바로 **같은 클래스 내부 호출 문제**다.\n\n### 왜 내부 호출은 AOP가 안 먹힐까?\n\n```java\n@Service\npublic class OrderService {\n\n    public void createOrder() {\n        System.out.println(\"1. 주문 생성 로직\");\n        \n        // 같은 클래스 안의 메서드를 호출함 (this.sendEmail())\n        this.sendEmail(); \n    }\n\n    @MeasureTime(\"이메일 발송 시간 측정\") // \u003c- 동작하지 않음!\n    public void sendEmail() {\n        System.out.println(\"2. 이메일 발송 로직\");\n    }\n}\n```\n\n**이유:**\n외부(`Controller`)에서 `createOrder()`를 호출할 때는 **프록시(대리인)** 를 거친다. 하지만 `createOrder()` 내부에서 `sendEmail()`을 부를 때는 프록시가 아니라 **자기 자신(`this`)의 원본 메서드를 직접 호출**해 버리기 때문에 AOP 부가기능이 완전히 무시된다.\n\n```\n[외부 호출] ──▶ [OrderService Proxy] ──▶ [OrderService 원본: createOrder()]\n                                                     │\n                                            (this.sendEmail 직접 호출)\n                                                     ▼\n                                          [OrderService 원본: sendEmail()] \n                                          ※ Proxy를 거치지 않아 AOP 동작 안 함!\n```\n\n### 해결책: 가장 깔끔한 방법은 '클래스 분리'\n역할에 맞게 메일 발송 로직을 별도의 `NotificationService` 클래스로 분리하고 주입받아 호출하면 자연스럽게 프록시를 거치게 된다.\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class OrderService {\n    private final NotificationService notificationService; // 별도 빈 주입\n\n    public void createOrder() {\n        System.out.println(\"1. 주문 생성\");\n        notificationService.sendEmail(); // 프록시를 통해 호출되므로 AOP 정상 작동!\n    }\n}\n```\n\n---\n\n## 7. 핵심 요약 및 팁\n\n1. **AOP는 횡단 관심사(로깅, 트랜잭션, 보안 등)를 깔끔하게 분리**해 주는 기술이다.\n2. 스프링은 **프록시(대리 객체)** 를 통해 타깃 메서드 앞뒤에 Advice를 끼워 넣는다.\n3. 실무에서는 복잡한 Pointcut 표현식보다 **커스텀 어노테이션(`@annotation`)** 을 만들어 필요한 곳에 명시적으로 붙이는 방식이 훨씬 안전하다.\n4. `private` 메서드나 같은 클래스 내부 호출(`this.method()`)은 프록시를 거치지 않으므로 AOP가 적용되지 않는다.\n\n---\n\n## 연습\n\n1. Controller 메서드 진입 시 요청 파라미터를 예쁘게 출력해 주는 `@RequestLog` AOP를 구현해 본다.\n2. 실행 중 예외가 발생하면 콘솔에 에러 메시지와 함께 실행 메서드명을 출력하는 `@AfterThrowing` Advice를 작성해 본다.\n"])</script><script>self.__next_f.push([1,"6a:T3458,"])</script><script>self.__next_f.push([1,"# Spring Boot 실무 디자인 패턴 — 자주 쓰는 핵심 패턴 7가지\n\n\u003e 요약: 전략, 템플릿 콜백, 프록시, 어댑터, 옵저버 등 스프링 내부 원리와 실무 비즈니스 코드에 녹아 있는 디자인 패턴을 쉽게 풀어본다.\n\n---\n\n## 1. 디자인 패턴, 왜 알아야 할까?\n\n디자인 패턴은 과거의 뛰어난 개발자들이 수많은 삽질 끝에 발견한 **\"자주 발생하는 소프트웨어 설계 문제의 모범 정답지(Best Practice)\"** 다.\n\n특히 **Spring Framework는 디자인 패턴의 거대한 집약체**다.\n- 스프링이 왜 이렇게 만들어졌는지 내부 원리를 쉽게 이해할 수 있다.\n- 지저분한 `if-else` 분기와 강한 결합도를 없애고 깔끔하고 유지보수하기 쉬운 코드를 짤 수 있다.\n\n실무에서 가장 유용하게 쓰이는 7가지 핵심 패턴을 비유와 실제 코드로 살펴보자.\n\n---\n\n## 2. 싱글톤 패턴 (Singleton Pattern)\n\n### 쉽게 이해하기\n사무실에 100명의 직원이 있다고 해서 **프린터를 100대 살 필요는 없다**. 1대만 두고 모두가 공유해서 쓰는 것이 자원과 비용 면에서 효율적이다.\n\n### 스프링에서의 싱글톤\n스프링의 `@Service`, `@Repository`, `@Component` 등 모든 Bean은 기본적으로 **단 1개만 생성되어 모든 요청 스레드가 공유하는 싱글톤(Singleton)** 으로 관리된다.\n\n```java\n@Service\npublic class UserService {\n    // 스프링 컨테이너가 애플리케이션 실행 시 딱 1개의 인스턴스만 생성하여 관리함\n    private final UserRepository userRepository;\n\n    public UserService(UserRepository userRepository) {\n        this.userRepository = userRepository;\n    }\n}\n```\n\n### ⚠️ 실무 주의점: 상태를 가지면 안 된다 (Stateless)\n싱글톤 객체는 여러 사용자(스레드)가 동시에 사용한다. 따라서 **인스턴스 변수에 특정 사용자의 상태나 데이터를 저장하면 다른 사용자의 데이터와 섞이는 치명적인 동시성 버그가 발생**한다.\n\n```java\n// [절대 금지: 상태를 필드에 저장]\n@Service\npublic class BadOrderService {\n    private String currentUsername; // 동시 요청 시 다른 사람의 이름으로 덮어씌워짐!\n\n    public void order(String username) {\n        this.currentUsername = username;\n        // ...\n    }\n}\n\n// [올바른 방법: 지역 변수나 파라미터 사용]\n@Service\npublic class GoodOrderService {\n    public void order(String username) {\n        // 메서드 내부 로컬 변수로 안전하게 처리 (스레드별 독립 메모리 사용)\n    }\n}\n```\n\n---\n\n## 3. 전략 패턴 (Strategy Pattern)\n\n### 쉽게 이해하기\n우리가 네비게이션 앱을 쓸 때 목적지는 같지만 **길 찾기 전략**을 바꿀 수 있다:\n- '최소 시간 경로'\n- '무료 도로 우선'\n- '최단 거리 경로'\n\n상황에 따라 다른 알고리즘을 부품(전략)처럼 갈아 끼울 수 있도록 만드는 패턴이다.\n\n### 실무 예제: 다중 결제 수단 처리 (`if-else` 없애기)\n카카오페이, 토스페이, 네이버페이 등 결제 수단이 늘어날 때 `switch-case`나 `if-else`로 도배하는 대신 전략 패턴을 쓰면 코드가 매우 깔끔해진다.\n\n#### 1) 공통 전략 인터페이스 정의\n```java\npublic interface PaymentStrategy {\n    String getPaymentCode(); // \"KAKAO\", \"TOSS\" 등\n    void pay(int amount);\n}\n```\n\n#### 2) 각 결제 수단별 전략 클래스 구현\n```java\n@Component\npublic class KakaoPayStrategy implements PaymentStrategy {\n    @Override\n    public String getPaymentCode() { return \"KAKAO\"; }\n\n    @Override\n    public void pay(int amount) {\n        System.out.println(\"카카오페이로 \" + amount + \"원 결제 API 호출\");\n    }\n}\n\n@Component\npublic class TossPayStrategy implements PaymentStrategy {\n    @Override\n    public String getPaymentCode() { return \"TOSS\"; }\n\n    @Override\n    public void pay(int amount) {\n        System.out.println(\"토스페이로 \" + amount + \"원 결제 API 호출\");\n    }\n}\n```\n\n#### 3) 스프링의 마법: 모든 전략을 Map/List로 한 번에 주입받기\n스프링은 동일한 인터페이스를 구현한 모든 빈을 `List`나 `Map`으로 한꺼번에 주입해 주는 기능을 기본 제공한다.\n\n```java\n@Service\npublic class PaymentService {\n\n    private final Map\u003cString, PaymentStrategy\u003e strategyMap;\n\n    // 스프링이 모든 PaymentStrategy 빈들을 찾아서 리스트로 꽂아줌\n    public PaymentService(List\u003cPaymentStrategy\u003e strategies) {\n        this.strategyMap = strategies.stream()\n                .collect(Collectors.toMap(PaymentStrategy::getPaymentCode, s -\u003e s));\n    }\n\n    public void processPayment(String paymentCode, int amount) {\n        PaymentStrategy strategy = strategyMap.get(paymentCode);\n        if (strategy == null) {\n            throw new IllegalArgumentException(\"지원하지 않는 결제 수단: \" + paymentCode);\n        }\n        \n        // if-else 없이 런타임에 알맞은 전략 실행!\n        strategy.pay(amount);\n    }\n}\n```\n\n\u003e **장점**: 나중에 `NaverPayStrategy`가 추가되어도 `PaymentService` 코드는 1줄도 수정할 필요가 없다(**개방-폐쇄 원칙, OCP 달성**).\n\n---\n\n## 4. 템플릿 콜백 패턴 (Template Callback Pattern)\n\n### 쉽게 이해하기\n라면 끓이기의 전체 흐름(물 끓이기 ➔ 라면/스프 넣기 ➔ 익히기)은 정해져 있지만, **'중간에 넣는 토핑(계란, 치즈, 떡)'만 사용자가 원하는 대로 자유롭게 바꾸는 방식**이다.\n\n### 스프링에서의 템플릿 콜백\n- 매번 반복되는 번거로운 작업(DB 연결 열기, 트랜잭션 시작, 예외 처리, 연결 닫기)은 **스프링 템플릿**이 알아서 해준다.\n- 개발자는 **진짜 하고 싶은 비즈니스 람다(콜백 함수)** 만 넘기면 된다.\n\n대표적인 예가 `TransactionTemplate`, `JdbcTemplate`, `RedisTemplate`이다.\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class CouponService {\n\n    private final TransactionTemplate transactionTemplate;\n    private final CouponRepository couponRepository;\n\n    public void issueCouponWithManualTransaction(Long couponId) {\n        // [템플릿]: 트랜잭션 시작, 커밋, 롤백, 자원 반납 처리 자동화\n        // [콜백(람다)]: 내가 수행할 핵심 쿠폰 발급 로직만 쏙 집어넣음\n        transactionTemplate.execute(status -\u003e {\n            Coupon coupon = couponRepository.findById(couponId).orElseThrow();\n            coupon.decreaseStock();\n            return couponRepository.save(coupon);\n        });\n    }\n}\n```\n\n---\n\n## 5. 프록시 \u0026 데코레이터 패턴 (Proxy \u0026 Decorator Pattern)\n\n### 쉽게 이해하기\n비서가 사장님(원본 객체)을 대신하여:\n- 사장님이 바쁠 때 약속을 조율하고(접근 제어 ➔ **프록시 패턴**)\n- 사장님이 말한 내용을 예쁜 보고서 양식으로 포장해 준다(부가 기능 덧붙이기 ➔ **데코레이터 패턴**)\n\n### 스프링에서의 활용: `@Transactional`\n우리가 서비스 메서드 위에 `@Transactional`을 달면, 스프링은 프록시(비서) 객체를 만든다.\n\n```\n[호출자(Controller)] \n        │\n        ▼\n[Service 프록시 객체 (비서)] ───▶ (1) 트랜잭션 시작 (Begin Transaction)\n        │\n        ├────────────────────────▶ (2) 실제 Service 메서드 실행\n        │\n        ▼\n[Service 프록시 객체 (비서)] ───▶ (3) 성공 시 Commit / 예외 시 Rollback\n```\n\n비즈니스 코드에 `connection.setAutoCommit(false)` 같은 코드를 직접 쓰지 않아도 트랜잭션이 돌아가는 이유가 바로 이 프록시 패턴 덕분이다.\n\n---\n\n## 6. 어댑터 패턴 (Adapter Pattern)\n\n### 쉽게 이해하기\n해외여행 갈 때 110V 콘센트에 220V 플러그를 꽂으려면 **돼지코 변환기(어댑터)** 가 필요하다. 인터페이스 규격이 맞지 않는 두 객체를 이어주는 중간 다리 역할을 한다.\n\n### 실무 예제: 외부 SMS 알림 업체 연동\n\n우리 시스템은 `NotificationSender` 인터페이스를 표준으로 쓰는데, 외부 SMS 유료 라이브러리(`CoolSmsSdk`)의 메서드 이름과 파라미터가 완전히 다를 때 어댑터를 사용한다.\n\n```java\n// 1. 우리 시스템 표준 인터페이스\npublic interface NotificationSender {\n    void sendNotification(String target, String message);\n}\n\n// 2. 외부 업체 라이브러리 (직접 수정 불가능한 클래스)\npublic class ExternalSmsClient {\n    public void transmit(String phoneNumber, String bodyText, String authKey) {\n        // 타사 SMS 전송 로직\n    }\n}\n\n// 3. 둘을 연결해 주는 어댑터 클래스\n@Component\npublic class SmsAdapter implements NotificationSender {\n\n    private final ExternalSmsClient externalClient = new ExternalSmsClient();\n\n    @Override\n    public void sendNotification(String target, String message) {\n        // 우리 시스템의 규격을 타사 규격으로 변환해서 호출\n        externalClient.transmit(target, message, \"SECRET_KEY_123\");\n    }\n}\n```\n\n나중에 SMS 업체를 다른 곳으로 바꾸더라도 비즈니스 로직은 손대지 않고 `Adapter` 클래스만 새로 만들면 된다.\n\n---\n\n## 7. 옵저버 / 이벤트 발행-구독 패턴 (Observer Pattern)\n\n### 쉽게 이해하기\n유튜브 채널을 **구독(Subscribe)** 해 두면, 크리에이터가 새 영상을 **발행(Publish)** 했을 때 구독자들에게 자동으로 알림이 가는 구조다.\n\n### 실무 예제: 회원 가입 후 메일 발송 + 쿠폰 지급\n회원 가입 메서드 안에서 이메일 전송, 슬랙 알림, 가입 축하 쿠폰 지급을 전부 직접 호출하면 코드가 복잡해지고, 메일 서버가 다운되었을 때 회원 가입까지 실패하게 된다.\n\n이를 **이벤트(옵저버) 패턴**으로 분리하면 결합도를 깔끔하게 끊을 수 있다.\n\n#### 1) 이벤트 DTO (Record)\n```java\npublic record UserSignedUpEvent(Long userId, String email, String name) {}\n```\n\n#### 2) 이벤트 발행자 (Publisher)\n```java\n@Service\n@RequiredArgsConstructor\npublic class UserService {\n\n    private final UserRepository userRepository;\n    private final ApplicationEventPublisher eventPublisher; // 스프링 기본 이벤트 발행기\n\n    @Transactional\n    public Long signUp(SignUpRequest request) {\n        User user = userRepository.save(new User(request));\n\n        // \"회원 가입 완료됨!\"이라는 이벤트만 세상에 알리고 끝냄\n        eventPublisher.publishEvent(new UserSignedUpEvent(user.getId(), user.getEmail(), user.getName()));\n        return user.getId();\n    }\n}\n```\n\n#### 3) 이벤트 구독자 (Listeners)\n```java\n@Component\n@Slf4j\npublic class WelcomeNotificationListener {\n\n    // 회원가입 트랜잭션이 성공적으로 DB에 커밋된 직후에 비동기로 실행\n    @TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)\n    @Async\n    public void sendWelcomeEmail(UserSignedUpEvent event) {\n        log.info(\"{} 님에게 웰컴 메일 발송 완료\", event.email());\n    }\n\n    @TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)\n    @Async\n    public void issueWelcomeCoupon(UserSignedUpEvent event) {\n        log.info(\"{} 님에게 가입 축하 10,000원 쿠폰 지급 완료\", event.name());\n    }\n}\n```\n\n---\n\n## 8. 빌더 패턴 (Builder Pattern)\n\n### 쉽게 이해하기\n생성자에 파라미터가 7~8개씩 있으면 어떤 값이 나이이고 어떤 값이 전화번호인지 헷갈려서 인자 순서를 잘못 넣는 실수를 하기 쉽다. 빌더 패턴은 **각 파라미터에 이름을 붙여서 명확하고 안전하게 객체를 조립**할 수 있게 해준다.\n\n```java\n// [생성자의 위험성: 순서 헷갈림]\nnew UserDto(\"홍길동\", \"010-1234-5678\", \"hong@test.com\", 25, true);\n\n// [빌더 패턴: 가독성과 안전성 극대화]\nUserDto dto = UserDto.builder()\n        .name(\"홍길동\")\n        .phone(\"010-1234-5678\")\n        .email(\"hong@test.com\")\n        .age(25)\n        .isVerified(true)\n        .build();\n```\n\n---\n\n## 9. 핵심 요약표\n\n| 디자인 패턴 | 일상 비유 | 스프링 \u0026 실무 적용 사례 |\n|-------------|-----------|------------------------|\n| **싱글톤 (Singleton)** | 회사 공용 복합기 | Spring IoC Container Bean 기본 스코프 |\n| **전략 (Strategy)** | 네비게이션 경로 선택 | 다중 결제/알림 처리 (`Map\u003cCode, Strategy\u003e`) |\n| **템플릿 콜백 (Template Callback)** | 토핑만 바꾸는 라면 레시피 | `TransactionTemplate`, `JdbcTemplate` |\n| **프록시 (Proxy)** | 스케줄을 관리해 주는 비서 | `@Transactional`, `@Cacheable`, AOP |\n| **어댑터 (Adapter)** | 220V 돼지코 변환기 | 스프링 MVC `HandlerAdapter`, 서드파티 SDK 래핑 |\n| **옵저버 (Observer)** | 유튜브 채널 구독 알림 | `ApplicationEventPublisher`, `@EventListener` |\n| **빌더 (Builder)** | 레고 블록 조립 | Lombok `@Builder`, `RestClient.builder()` |\n\n---\n\n## 연습\n\n1. `DiscountPolicy` 인터페이스를 만들고, 정액 할인(`1000원 할인`)과 정률 할인(`10% 할인`) 전략을 구현한 뒤 주문 금액에 따라 전략을 적용해 본다.\n2. 회원 탈퇴 시 `UserDeletedEvent`를 발행하고, 탈퇴 감사 로그와 관련 파일 정리 작업을 이벤트 리스너로 분리해 본다.\n"])</script><script>self.__next_f.push([1,"6b:T56f4,"])</script><script>self.__next_f.push([1,"# JPA \u0026 Hibernate — 영속성 컨텍스트부터 실무 성능 최적화까지\n\n\u003e 요약: 영속성 컨텍스트 생명주기, 변경 감지, N+1 문제 해결(Fetch Join vs EntityGraph vs BatchSize), 컬렉션 페이징 한계, 낙관적/비관적 락, OSIV 전략을 이해한다.\n\n---\n\n## 1. ORM의 본질과 패러다임의 불일치\n\n객체지향 언어는 **추상화, 캡슐화, 상속, 다형성**을 통해 유연한 도메인 모델을 만드는 것이 목표이고, 관계형 데이터베이스(RDB)는 **데이터의 정규화와 무결성, 집합 중심의 효율적인 조회**가 목표다. 이 둘 사이에는 태생적인 **패러다임의 불일치(Paradigm Mismatch)** 가 존재한다.\n\n| 관점 | 객체지향 (Java) | 관계형 데이터베이스 (RDB) |\n|------|-----------------|---------------------------|\n| **지향점** | 추상화, 캡슐화, 다형성, 객체 간 참조 | 데이터 무결성, 정규화, 테이블 간 외래키(FK) 조인 |\n| **연관관계** | **단방향 참조** (`order.getMember()`) | **양방향 조인** (`JOIN ON order.member_id = member.id`) |\n| **식별자** | 객체 동일성 (`==`, 메모리 주소) | 기본키 (Primary Key, 테이블 레코드 고유값) |\n| **데이터 탐색** | 객체 그래프 탐색 (`order.getDelivery().getAddress()`) | SQL 쿼리로 조회된 레코드셋에 국한 |\n| **상속** | 상속 관계 지원 (`extends`) | 슈퍼타입/서브타입 모델링 (테이블 단편화) |\n\n과거에는 이 차이를 메우기 위해 SQL 매퍼(MyBatis, JdbcTemplate)를 사용하며 개발자가 객체와 테이블 간의 매핑 코드를 일일이 작성했다. \n\n**ORM(Object-Relational Mapping)** 은 이 패러다임 불일치를 프레임워크가 중간에서 해결해 주는 기술이다. 자바 진영의 표준 명세가 **JPA(Jakarta Persistence API)** 이며, 가장 널리 쓰이는 표준 구현체가 **Hibernate**다. Spring Boot 환경에서는 이를 한 번 더 편리하게 감싼 **Spring Data JPA**를 주로 사용한다.\n\n---\n\n## 2. 영속성 컨텍스트(Persistence Context)의 내부 메커니즘\n\n영속성 컨텍스트는 **\"엔티티를 영구 저장하는 환경\"** 이라는 뜻의 논리적인 개념이다. `EntityManager`를 통해 접근하며, 애플리케이션과 데이터베이스 사이에서 버퍼(Buffer) 및 캐시(Cache) 역할을 수행한다.\n\n스프링 프레임워크에서는 **트랜잭션(`@Transactional`)의 시작부터 종료까지** 영속성 컨텍스트의 생명주기가 유지된다.\n\n```\n[클라이언트 요청] ──▶ [@Transactional Service] \n                              │\n                              ▼\n                 ┌─────────────────────────────┐\n                 │    영속성 컨텍스트 (EntityManager)    │\n                 │  ┌───────────────────────┐  │\n                 │  │ 1차 캐시 (엔티티 / 스냅샷)  │  │\n                 │  ├───────────────────────┤  │\n                 │  │ 쓰기 지연 SQL 저장소       │  │\n                 │  └───────────────────────┘  │\n                 └──────────────┬──────────────┘\n                                │ flush \u0026 commit\n                                ▼\n                         [Database (RDB)]\n```\n\n### 1) 1차 캐시와 동일성(Identity) 보장\n영속성 컨텍스트 내부에는 엔티티의 `@Id`(PK) 값을 Key로, 엔티티 인스턴스를 Value로 보관하는 **1차 캐시**가 존재한다.\n\n```java\n// 동일 트랜잭션 내부\nMember member1 = memberRepository.findById(1L).orElseThrow();\nMember member2 = memberRepository.findById(1L).orElseThrow();\n\nSystem.out.println(member1 == member2); // true (메모리 주소 일치)\n```\n\n1. `findById(1L)` 최초 호출 시 1차 캐시에 없으므로 DB `SELECT` 쿼리를 실행해 엔티티를 1차 캐시에 저장하고 반환한다.\n2. 두 번째 `findById(1L)` 호출 시 DB 쿼리를 전혀 날리지 않고 **1차 캐시에서 즉시 반환**한다.\n3. 동일 트랜잭션 내에서는 `==` 비교 시 **진정한 객체 동일성(Identity)** 이 보장된다.\n\n### 2) 쓰기 지연 (Transactional Write-Behind)\n`em.persist(entity)`나 `repository.save(entity)`를 호출한다고 해서 그 즉시 DB에 `INSERT` SQL이 나가지 않는다.\n\n```java\n@Transactional\npublic void registerMembers() {\n    memberRepository.save(new Member(\"A\"));\n    memberRepository.save(new Member(\"B\"));\n    memberRepository.save(new Member(\"C\"));\n    // 여기까지 DB에 INSERT 쿼리가 아직 1건도 나가지 않음!\n    // 쿼리는 영속성 컨텍스트의 '쓰기 지연 SQL 저장소'에 차곡차곡 쌓임\n    \n    // 트랜잭션이 끝나는 시점에 모아둔 3개의 INSERT 쿼리가 DB로 한 방에 전송(flush)됨\n}\n```\n\n\u003e **주의 (IDENTITY 전략 예외)**: MySQL의 `AUTO_INCREMENT`처럼 `@GeneratedValue(strategy = GenerationType.IDENTITY)`를 쓰는 경우, PK 값을 DB에 넣기 전까지는 알 수 없다. 영속성 컨텍스트는 1차 캐시의 키로 PK가 필수이기 때문에, `IDENTITY` 전략에 한해서는 `save()` 호출 즉시 `INSERT` 쿼리가 실행되어 쓰기 지연이 발생하지 않는다.\n\n### 3) 변경 감지 (Dirty Checking)의 구체적 동작 원리\nJPA에는 엔티티를 수정하는 `update()`나 `modify()` 같은 API가 존재하지 않는다.\n\n```java\n@Transactional\npublic void updateMember(Long id, String newName) {\n    Member member = memberRepository.findById(id).orElseThrow();\n    member.changeName(newName); \n    // memberRepository.save(member); -\u003e 호출 불필요 (안티패턴)\n}\n```\n\n**내부 비교 순서:**\n1. **스냅샷 생성**: 1차 캐시에 엔티티가 최초로 로드(조회 또는 영속화)될 때, 그 시점의 상태를 그대로 복제한 **스냅샷(Snapshot)** 을 만든다.\n2. **트랜잭션 커밋 시점 `flush()` 발생**: 트랜잭션이 커밋되기 직전 영속성 컨텍스트가 자동으로 `flush()`를 실행한다.\n3. **상태 비교**: 현재 엔티티의 필드 값과 최초 스냅샷을 1:1로 대조하여 변경된 부분을 찾는다.\n4. **UPDATE 쿼리 생성**: 변경 사항이 있으면 `UPDATE` SQL을 만들어 쓰기 지연 SQL 저장소에 넣고 DB로 전송한다.\n\n#### 변경 감지 시 생성되는 쿼리 특성\n기본적으로 Hibernate는 **엔티티의 모든 컬럼을 UPDATE 대상**으로 삼는다.\n- **장점**: SQL 구문이 고정되어 데이터베이스 엔진 차원에서 쿼리를 파싱하고 캐싱(PreparedStatement 재사용)하기 유리하다.\n- **예외 처리 (`@DynamicUpdate`)**: 테이블의 컬럼 수가 30~50개 이상으로 매우 많고 빈번하게 일부 컬럼만 수정된다면, 엔티티 클래스 위에 `@DynamicUpdate`를 선언하여 실제 변경된 컬럼만 동적으로 `UPDATE` 구문을 만들도록 설정할 수 있다.\n\n### 4) Flush(플러시)의 정확한 개념\n`flush()`는 **영속성 컨텍스트의 변경 내용을 데이터베이스에 동기화(전송)하는 작업**이다.\n\n- **플러시가 일어나는 시점**:\n  1. 트랜잭션 커밋 직전 (자동)\n  2. JPQL 쿼리 실행 직전 (데이터 정합성을 위해 자동 실행)\n  3. `em.flush()` 직접 호출 시\n- **핵심**: 플러시는 DB 트랜잭션을 커밋하는 것이 아니다. 변경된 SQL들을 DB로 보내놓기만 한 상태이므로, 예외가 발생하면 **언제든지 롤백이 가능**하다.\n\n---\n\n## 3. 엔티티 생명주기 4가지 상태\n\n```\n       [ 비영속 (New) ]  ──────── em.persist() ────────▶  [ 영속 (Managed) ]\n              │                                                │\n              │                                                ├─ em.detach() / em.close() ─▶ [ 준영속 (Detached) ]\n              │                                                │\n              └──────── em.remove() ─────────────────────────▶ [ 삭제 (Removed) ]\n```\n\n| 상태 | 설명 | 특징 |\n|------|------|------|\n| **비영속 (New/Transient)** | `new` 키워드로 생성된 순수 자바 객체 | 영속성 컨텍스트 및 DB와 아무 관계 없음 |\n| **영속 (Managed)** | 영속성 컨텍스트에 의해 관리되는 상태 | 1차 캐시 등록, 변경 감지, 지연 로딩 대상 |\n| **준영속 (Detached)** | 한때 영속 상태였으나 컨텍스트에서 분리된 상태 | 1차 캐시에서 제거됨, 변경 감지 미동작 |\n| **삭제 (Removed)** | 삭제 대상으로 마킹된 상태 | 트랜잭션 커밋 시 DB `DELETE` 쿼리 실행 |\n\n### 준영속 상태를 다룰 때 주의할 점\n`em.merge(detachedEntity)`를 사용하면 준영속 엔티티의 정보로 새로운 영속 엔티티를 반환하지만, **모든 필드를 덮어쓰기 때문에 값이 없는 필드는 `null`로 갱신되는 위험**이 있다.\n\n따라서 실무에서는 `merge()` 대신 **식별자로 엔티티를 조회한 뒤 변경 감지(Dirty Checking)를 통해 필요한 필드만 직접 수정**하는 것이 원칙이다.\n\n---\n\n## 4. 연관관계 매핑과 방향성\n\n### 1) 단방향 매핑 vs 양방향 매핑\n- **단방향 매핑**: 한쪽 엔티티만 상대방을 참조하는 구조 (`Order` $\\rightarrow$ `Member`). 객체 관계가 단순하고 직관적이다.\n- **양방향 매핑**: 양쪽 엔티티가 서로를 참조하는 구조 (`Order` $\\leftrightarrow$ `Member`). 조회 편의성은 높지만 복잡도가 크게 증가한다.\n\n\u003e **실무 대원칙**: 기본적으로 모든 연관관계는 **단방향 매핑**으로 설계한다. 비즈니스 요구사항상 반대편에서의 객체 그래프 탐색이 꼭 필요한 경우에만 제한적으로 양방향 매핑을 추가한다.\n\n### 2) 연관관계의 주인(Owner)과 `mappedBy`\n테이블은 외래키(FK) 1개로 양쪽 조인이 가능하다. 하지만 객체는 참조 변수가 양쪽에 각각 존재한다. 둘 중 **\"누가 외래키를 관리(등록/수정)할 것인가\"** 를 정해야 하며, 그 주체가 **연관관계의 주인**이다.\n\n- **연관관계의 주인**: 외래키(FK) 컬럼이 존재하는 테이블의 엔티티 (`@JoinColumn` 사용)\n- **주인이 아닌 쪽**: 조회만 가능 (`mappedBy` 속성으로 주인의 필드명을 지정)\n\n```java\n// [외래키를 가진 연관관계의 주인]\n@Entity\npublic class Order {\n    @Id @GeneratedValue\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"member_id\") // orders 테이블의 member_id FK 컬럼 관리\n    private Member member;\n}\n\n// [조회만 가능한 주인이 아닌 쪽]\n@Entity\npublic class Member {\n    @Id @GeneratedValue\n    private Long id;\n\n    @OneToMany(mappedBy = \"member\") // Order 클래스의 'member' 필드에 의해 매핑됨\n    private List\u003cOrder\u003e orders = new ArrayList\u003c\u003e();\n}\n```\n\n### 3) 양방향 연관관계 편의 메서드 작성법\n양방향 매핑 시 순수 자바 객체 상태를 고려해 양쪽 모두에 값을 세팅해 주는 **편의 메서드(Convenience Method)** 를 작성해야 테스트 및 영속화 전후에 문제가 생기지 않는다.\n\n```java\npublic void addOrderItem(OrderItem item) {\n    this.orderItems.add(item);\n    item.assignOrder(this); // 양쪽 참조를 한 번에 세팅\n}\n```\n\n---\n\n## 5. 지연 로딩(LAZY)과 N+1 문제 해결하기\n\n### 1) 즉시 로딩(EAGER)의 위험성\n`@ManyToOne(fetch = FetchType.EAGER)`로 설정하면 부모 엔티티를 조회할 때 연관된 엔티티를 무조건 함께 조회한다.\n- JPQL을 실행할 때 JPQL은 SQL로 그대로 번역되어 부모만 먼저 조회(`SELECT * FROM orders`)한 뒤, 뒤늦게 EAGER 설정을 보고 연관 엔티티를 개별 조회(`SELECT * FROM member WHERE id = ?`)하는 N+1 문제가 무조건 발생한다.\n- **실무 원칙**: 모든 연관관계는 반드시 **`FetchType.LAZY`** 로 선언한다.\n\n### 2) N+1 문제란?\n1번의 쿼리로 N건의 데이터를 조회했을 때, 지연 로딩된 연관 엔티티를 사용하는 과정에서 **추가 쿼리가 N번 더 발생하는 성능 저하 현상**이다.\n\n```java\n// orders 목록 10건 조회 (쿼리 1회)\nList\u003cOrder\u003e orders = orderRepository.findAll();\n\nfor (Order order : orders) {\n    // Member는 프록시 객체 상태 -\u003e 실제 필드 접근 시마다 SELECT 쿼리 발생! (10회)\n    System.out.println(order.getMember().getName()); \n}\n// 총 실행된 쿼리: 1 + 10 = 11회\n```\n\n### 3) N+1 해결 전략 3가지 비교\n\n```\n                      ┌── 1. Fetch Join (JPQL INNER JOIN으로 한 방에 로딩)\n                      │\nN+1 해결 3대 전략 ─────┼── 2. @EntityGraph (어노테이션 기반 LEFT JOIN 로딩)\n                      │\n                      └── 3. default_batch_fetch_size (IN 쿼리로 묶어서 로딩)\n```\n\n| 해결 방식 | 코드 형태 | 장점 | 단점 및 제약 |\n|-----------|-----------|------|--------------|\n| **Fetch Join** | `select o from Order o join fetch o.member` | 한 번의 SQL 조인으로 실제 엔티티를 모두 조회 | 둘 이상의 컬렉션(`List`)을 동시 페치 조인할 수 없음 (`MultipleBagFetchException`) |\n| **`@EntityGraph`** | `@EntityGraph(attributePaths = {\"member\"})` | JPQL 없이 Spring Data JPA 인터페이스에 어노테이션으로 적용 가능 | `LEFT OUTER JOIN`이 강제되어 조인 비용이 발생할 수 있음 |\n| **`BatchSize`** | `hibernate.default_batch_fetch_size: 100` | 설정 하나로 지연 로딩 시 `IN (?, ?, ...)` 쿼리로 묶어서 처리 | 쿼리가 1개로 줄어드는 것은 아니며 `1 + (N/size)`회 실행됨 |\n\n---\n\n## 6. 컬렉션 페치 조인과 페이징(Pagination)의 한계와 해법\n\n### 문제: 1:N 컬렉션 페치 조인 시 페이징 쿼리가 실패하는 이유\n\n```java\n// [심각한 성능 장애 유발 코드]\n@Query(\"select o from Order o join fetch o.orderItems\")\nPage\u003cOrder\u003e findAllWithItems(Pageable pageable);\n```\n\n1. 데이터베이스 관점에서 1:N 조인을 실행하면 부모 데이터(`Order`)가 자식 데이터(`OrderItem`) 개수만큼 **중복으로 뻥튀기(Row 확장)** 된다.\n2. 이 상태에서 DB의 `LIMIT / OFFSET` 페이징을 적용하면 1번 주문의 데이터가 잘려 나가는 등 데이터 왜곡이 발생한다.\n3. Hibernate는 데이터 정합성을 지키기 위해 **DB 레벨 페이징을 포기하고, DB의 모든 데이터를 애플리케이션 메모리로 퍼올린 뒤 메모리에서 직접 페이징(In-Memory Paging)** 을 수행한다.\n4. 로그에 `HHH000104: firstResult/maxResults specified with collection fetch; applying in-memory!` 경고가 찍히며, 데이터가 많을 경우 즉시 **OutOfMemoryError(OOM)** 가 발생하여 서버가 다운된다.\n\n### 실무 표준 해결 공식 (2단계 접근법)\n\n```\n[1단계]: ToOne 관계(Member, Delivery)만 페치 조인하여 DB 레벨 페이징 수행\n         ▼\n[2단계]: ToMany 컬렉션(OrderItems)은 default_batch_fetch_size를 통해 IN 쿼리로 최적화 조회\n```\n\n#### Step 1. ToOne 관계만 페치 조인하여 페이징 조회\n```java\npublic interface OrderRepository extends JpaRepository\u003cOrder, Long\u003e {\n\n    @Query(value = \"select o from Order o join fetch o.member m join fetch o.delivery d\",\n           countQuery = \"select count(o) from Order o\")\n    Page\u003cOrder\u003e findAllOrdersWithPaging(Pageable pageable);\n}\n```\n`ToOne` 관계는 조인해도 데이터 Row 수가 늘어나지 않으므로 DB `LIMIT / OFFSET` 페이징이 정상 동작한다.\n\n#### Step 2. `application.yml`에 BatchSize 전역 설정\n```yaml\nspring:\n  jpa:\n    properties:\n      hibernate:\n        default_batch_fetch_size: 100 # 보통 100~500 권장\n```\n\n#### Step 3. DTO 변환 시 지연 로딩 호출\n```java\n@Transactional(readOnly = true)\npublic Page\u003cOrderResponse\u003e getOrders(Pageable pageable) {\n    Page\u003cOrder\u003e orderPage = orderRepository.findAllOrdersWithPaging(pageable);\n\n    // order.getOrderItems() 호출 시 100개 단위의 IN (?, ?, ...) 쿼리 1회로 최적화되어 조회됨\n    return orderPage.map(OrderResponse::from);\n}\n```\n\n---\n\n## 7. 동시성 제어: 낙관적 락 vs 비관적 락\n\n동시에 여러 트랜잭션이 동일한 엔티티를 수정하려 할 때 데이터 정합성을 보장하는 방법이다.\n\n### 1) 낙관적 락 (Optimistic Lock)\n- **개념**: \"데이터 충돌이 대부분 발생하지 않을 것이다\"라고 가정하고 DB 락 대신 애플리케이션 레벨에서 버전 관리로 충돌을 감지한다.\n- **적용**: 엔티티에 `@Version` 필드를 추가한다.\n\n```java\n@Entity\npublic class Article {\n    @Id @GeneratedValue\n    private Long id;\n\n    private String title;\n\n    @Version\n    private Long version; // 수정 시마다 Hibernate가 자동으로 1씩 증가시킴\n}\n```\n\n```sql\n-- 내부 실행 쿼리\nUPDATE article \nSET title = '수정된 제목', version = 2 \nWHERE id = 1 AND version = 1;\n```\n동시에 다른 트랜잭션이 먼저 수정하여 버전이 2로 올라갔다면, 조건에 맞는 레코드가 없어 업데이트 수가 0이 되고 `ObjectOptimisticLockingFailureException`이 발생한다.\n\n- **장점**: 별도의 DB 락을 잡지 않으므로 처리량(Throughput)이 높다.\n- **단점**: 충돌 발생 시 롤백 및 재시도(Retry) 로직을 개발자가 직접 작성해야 한다.\n- **추천**: 게시글 수정, 상품 설명 수정 등 동시 수정 충돌 가능성이 낮은 경우.\n\n### 2) 비관적 락 (Pessimistic Lock)\n- **개념**: \"데이터 충돌이 반드시 일어날 것이다\"라고 가정하고, 조회 시점에 DB의 배타적 락(`SELECT ... FOR UPDATE`)을 걸어 다른 트랜잭션의 접근을 대기시킨다.\n\n```java\npublic interface ProductRepository extends JpaRepository\u003cProduct, Long\u003e {\n\n    @Lock(LockModeType.PESSIMISTIC_WRITE)\n    @Query(\"select p from Product p where p.id = :id\")\n    Optional\u003cProduct\u003e findByIdWithPessimisticLock(@Param(\"id\") Long id);\n}\n```\n\n- **장점**: 트랜잭션이 끝날 때까지 다른 트랜잭션이 대기하므로 데이터 무결성이 완벽히 보장된다.\n- **단점**: 대기 시간으로 인해 동시 처리 성능이 떨어지고 데드락(Deadlock) 위험이 증가한다.\n- **추천**: 한정 수량 재고 차감, 포인트/계좌 출금 등 데이터 정합성이 최우선인 금융/결제 도메인.\n\n---\n\n## 8. OSIV (Open Session In View) 아키텍처 전략\n\n`spring.jpa.open-in-view` 설정은 애플리케이션의 커넥션 관리와 직결되는 매우 중요한 옵션이다.\n\n```yaml\nspring:\n  jpa:\n    open-in-view: false # 실무 API 서버 필수 권장\n```\n\n### OSIV 동작 비교\n\n| 구분 | OSIV ON (`true`, 기본값) | OSIV OFF (`false`, 권장) |\n|------|-------------------------|--------------------------|\n| **커넥션 유지 범위** | HTTP 요청 시작 $\\rightarrow$ 응답 반환 끝까지 | `@Transactional` 서비스 메서드 실행 구간만 |\n| **지연 로딩 가능 위치** | Controller, View 템플릿 어디서나 가능 | **`@Transactional` 트랜잭션 내부에서만 가능** |\n| **장점** | DTO 변환 시 지연 로딩이 자유로워 개발 편의성 높음 | DB 커넥션을 필요한 순간에만 쓰고 즉시 반납하므로 커넥션 풀 고갈 방지 |\n| **단점 및 위험** | 외부 API 호출이나 무거운 작업 지연 시 DB 커넥션 풀이 마르는 장애 발생 | 트랜잭션 밖에서 지연 로딩 접근 시 `LazyInitializationException` 발생 |\n\n### OSIV OFF 환경에서의 아키텍처 패턴 (CQRS 쿼리 서비스 분리)\n`open-in-view: false`를 적용하면 트랜잭션 밖에서는 지연 로딩을 쓸 수 없다. 이를 위해 복잡한 화면/API 조회의 경우 **조회 전용 서비스(QueryService)** 를 분리하여 트랜잭션 안에서 DTO로 완벽히 변환하여 반환하도록 설계한다.\n\n```java\n// [조회 전용 서비스]\n@Service\n@RequiredArgsConstructor\n@Transactional(readOnly = true) // 읽기 전용 트랜잭션 안에서 안전하게 DTO 변환\npublic class OrderQueryService {\n\n    private final OrderRepository orderRepository;\n\n    public List\u003cOrderDto\u003e getOrderDtos(Pageable pageable) {\n        return orderRepository.findAllOrdersWithPaging(pageable)\n                .map(OrderDto::from) // 트랜잭션 내부이므로 지연 로딩 호출 가능\n                .toList();\n    }\n}\n```\n\n---\n\n## 9. 실무 체크리스트 및 흔한 실수\n\n| 점검 항목 | 실수 유형 | 올바른 가이드 |\n|-----------|-----------|---------------|\n| **연관관계 매핑** | `@ManyToOne`에 즉시 로딩(`EAGER`) 방치 | 무조건 `fetch = FetchType.LAZY` 선언 |\n| **양방향 참조** | Lombok `@ToString`, `@EqualsAndHashCode` 무심코 사용 | 연관 엔티티 필드는 `@ToString.Exclude` 처리하여 무한 순환 참조 방지 |\n| **벌크 연산 후속 처리** | `@Modifying` 쿼리 실행 후 1차 캐시와 DB 데이터 불일치 | `@Modifying(clearAutomatically = true)`로 영속성 컨텍스트 초기화 |\n| **컬렉션 페이징** | `@OneToMany` 페치 조인 + `Pageable` 사용 | `ToOne`만 페치 조인 + `default_batch_fetch_size` 적용 |\n| **수정 방식** | `em.merge()`나 불필요한 `repository.save()` 호출 | 조회 후 엔티티 필드 변경 $\\rightarrow$ 변경 감지(Dirty Checking) 활용 |\n| **커넥션 관리** | 트래픽이 많은 API 서버에서 `OSIV=true` 유지 | `OSIV=false`로 끄고 조회 전용 서비스 계층 구축 |\n\n---\n\n## 연습\n\n1. `Member`와 `Team` 엔티티를 작성하고, `FetchType.EAGER`와 `FetchType.LAZY` 상태에서 `teamRepository.findAll()` 실행 시 발생하는 SQL 로그의 차이를 확인한다.\n2. `default_batch_fetch_size: 100` 설정을 추가한 후, 1:N 관계의 엔티티 컬렉션을 순회할 때 단일 `IN` 쿼리로 묶여 나가는 동작을 검증한다.\n3. `spring.jpa.open-in-view: false` 환경에서 Controller에서 지연 로딩 호출 시 발생하는 `LazyInitializationException`을 재현하고, 트랜잭션 내부 DTO 변환 방식으로 해결한다.\n"])</script><script>self.__next_f.push([1,"6c:T4d10,"])</script><script>self.__next_f.push([1,"# Gradle 빌드와 멀티모듈 아키텍처 설계\n\n\u003e 요약: Gradle 빌드 생명주기, Kotlin DSL(build.gradle.kts), 의존성 스코프 차이(implementation vs api), 플러그인 작성, 멀티모듈 프로젝트 설계 패턴(계층형, MSA/공통 도메인형, 헥사고날)을 다룬다.\n\n---\n\n## 1. Gradle이란 무엇이며 왜 Maven보다 많이 쓰일까?\n\n**Gradle**은 현대 JVM 생태계에서 가장 널리 사용되는 빌드 자동화 도구(Build Automation Tool)다. 소스 코드를 컴파일하고, 테스트를 실행하며, 의존성을 다운로드하고, 최종적으로 배포 가능한 실행 파일(Jar, War)을 패키징하는 전 과정을 관리한다.\n\n### Maven vs Gradle 핵심 비교\n\n| 비교 항목 | Apache Maven | Gradle |\n|-----------|--------------|--------|\n| **설정 언어** | XML (`pom.xml`) — 정적이고 장황함 | Kotlin DSL (`build.gradle.kts`) 또는 Groovy — 동적이며 간결함 |\n| **빌드 속도** | 기본적으로 전체 빌드 위주 | **증분 빌드(Incremental Build), 빌드 캐시, 데몬 프로세스**로 최대 10배 이상 빠름 |\n| **멀티모듈 유연성** | 상속 기반 구조로 커스텀 확장이 어려움 | 의존성 그래프 기반, 서브모듈별 자유로운 설정 및 플러그인 주입 가능 |\n| **타입 안정성** | 스키마 기반 유효성 검사 | **Kotlin DSL 사용 시 IDE 자동완성, 컴파일 타임 에러 검증, 리팩토링 지원** |\n\nSpring Boot 3.x부터는 공식 문서 및 스타터(start.spring.io)에서 **Gradle + Kotlin DSL**을 기본 권장선으로 채택하고 있다.\n\n---\n\n## 2. Gradle의 3단계 빌드 생명주기 (Build Lifecycle)\n\nGradle의 빌드가 실행될 때 내부적으로는 항상 다음 **3단계(Initialization ➔ Configuration ➔ Execution)** 를 거친다. 이 생명주기를 이해하지 못하면 빌드 스크립트 작성 시 실행 순서가 꼬이는 실수를 하게 된다.\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│ 1. Initialization (초기화 단계)                               │\n│   - settings.gradle(.kts) 파일을 읽음                         │\n│   - 어떤 프로젝트/서브모듈들이 빌드에 참여하는지 결정             │\n└──────────────────────────────┬──────────────────────────────┘\n                               │\n                               ▼\n┌─────────────────────────────────────────────────────────────┐\n│ 2. Configuration (구성/설정 단계)                            │\n│   - 참여하는 모든 프로젝트의 build.gradle(.kts) 스크립트를 실행   │\n│   - Task 객체를 메모리에 생성하고, Task 간의 의존 그래프(DAG) 구성 │\n│   - ※ 주의: Task 내부의 doFirst/doLast 밖 코드는 이때 무조건 실행됨│\n└──────────────────────────────┬──────────────────────────────┘\n                               │\n                               ▼\n┌─────────────────────────────────────────────────────────────┐\n│ 3. Execution (실행 단계)                                     │\n│   - 명령어로 지정한 Task들을 의존성 순서대로 실제 실행            │\n│   - doFirst / doLast 액션 블록에 정의된 실제 빌드 로직 수행      │\n└─────────────────────────────────────────────────────────────┘\n```\n\n### 흔히 하는 실수: Configuration과 Execution 혼동\n\n```kotlin\n// [잘못된 예시: Configuration 시점에 실행되어 버림]\ntasks.register(\"deployServer\") {\n    // 이 코드는 deployServer Task를 실행하지 않아도,\n    // gradle build 나 gradle test 만 돌려도 Configuration 단계에서 무조건 실행됨!\n    println(\"🚨 서버에 배포 패킷을 전송합니다!\") \n}\n\n// [올바른 예시: Execution 시점에만 실행되도록 액션 블록 작성]\ntasks.register(\"deployServer\") {\n    doLast {\n        // 실제 'gradle deployServer'를 호출했을 때만 실행 단계에서 동작함\n        println(\"✅ 서버에 배포 패킷을 전송합니다!\")\n    }\n}\n```\n\n---\n\n## 3. 의존성 스코프(Configuration) 이해하기\n\nGradle에서 라이브러리를 가져올 때 선언하는 키워드들은 라이브러리가 **컴파일 시점에 필요한지, 런타임에 필요한지, 그리고 하위 모듈로 전파되는지**를 결정한다.\n\n```\n                    ┌── compileOnly (컴파일 때만 필요, Jar 배포 시 제외 e.g. Lombok)\n                    │\n                    ├── runtimeOnly (실행 때만 필요 e.g. DB JDBC Driver)\n의존성 스코프 종류 ───┼── implementation (내부 구현용, 외부 모듈로 전파 차단 ➔ 컴파일 속도 향상)\n                    │\n                    └── api (외부 모듈로 의존성 전파 ➔ 공통 인터페이스 모듈용)\n```\n\n### `implementation` vs `api`의 결정적 차이\n\n멀티모듈을 설계할 때 가장 중요한 개념이다.\n\n```\n[Module A] ──(의존)──▶ [Module B] ──(의존)──▶ [Module C (e.g. Gson)]\n```\n\n- **`Module B`가 `api(project(\":Module-C\"))`를 사용한 경우**:\n  - `Module A`에서도 `Module C`(Gson)의 클래스를 직접 import해서 쓸 수 있다.\n  - **단점**: `Module C`의 코드가 1줄이라도 바뀌면 `Module B`뿐만 아니라 `Module A`까지 연쇄적으로 재컴파일되어 빌드 시간이 길어진다.\n- **`Module B`가 `implementation(project(\":Module-C\"))`를 사용한 경우**:\n  - `Module B` 내부에서만 `Module C`를 쓰고, `Module A`에는 `Module C`가 노출되지 않는다 (`Module A`에서 Gson import 불가).\n  - **장점**: `Module C`의 내부 구현이 바뀌어도 `Module A`는 재컴파일되지 않으므로 **빌드 속도가 비약적으로 향상**된다. 캡슐화가 잘 지켜진다.\n\n\u003e **실무 원칙**: 기본적으로 무조건 **`implementation`** 을 사용하고, 해당 라이브러리의 타입을 외부에 반환 타입이나 파라미터로 공개해야 하는 공통 API 모듈에서만 제한적으로 **`api`** 를 사용한다.\n\n---\n\n## 4. 모던 Gradle: Version Catalog (`libs.versions.toml`)\n\n과거에는 여러 모듈의 라이브러리 버전을 맞추기 위해 `ext` 블록이나 `buildSrc`를 썼지만, Gradle 7.4+부터는 표준화된 **Version Catalog (`libs.versions.toml`)** 방식을 사용한다.\n\n`gradle/libs.versions.toml` 파일에 버전과 라이브러리를 중앙 집중 관리한다.\n\n### `gradle/libs.versions.toml`\n```toml\n[versions]\nspringBoot = \"3.4.1\"\nspringDependencyManagement = \"1.1.7\"\njjwt = \"0.12.6\"\nquerydsl = \"5.1.0\"\n\n[libraries]\nspring-boot-starter-web = { module = \"org.springframework.boot:spring-boot-starter-web\" }\nspring-boot-starter-data-jpa = { module = \"org.springframework.boot:spring-boot-starter-data-jpa\" }\nspring-boot-starter-validation = { module = \"org.springframework.boot:spring-boot-starter-validation\" }\njjwt-api = { module = \"io.jsonwebtoken:jjwt-api\", version.ref = \"jjwt\" }\njjwt-impl = { module = \"io.jsonwebtoken:jjwt-impl\", version.ref = \"jjwt\" }\njjwt-jackson = { module = \"io.jsonwebtoken:jjwt-jackson\", version.ref = \"jjwt\" }\n\n[bundles]\njwt = [\"jjwt-api\", \"jjwt-impl\", \"jjwt-jackson\"]\n\n[plugins]\nspring-boot = { id = \"org.springframework.boot\", version.ref = \"springBoot\" }\nspring-dependency-management = { id = \"io.spring.dependency-management\", version.ref = \"springDependencyManagement\" }\n```\n\n### `build.gradle.kts`에서 사용\n```kotlin\ndependencies {\n    implementation(libs.spring.boot.starter.web)\n    implementation(libs.spring.boot.starter.data.jpa)\n    \n    // 번들(bundle)로 묶어서 한 줄로 주입\n    implementation(libs.bundles.jwt)\n}\n```\nIDE 자동완성이 지원되며, 버전 충돌을 원천 차단할 수 있다.\n\n---\n\n## 5. 실무 프로젝트 설계 패턴 3가지 (멀티모듈 아키텍처)\n\n실무에서 서비스가 커지면 단일 모듈(Monolith Module)의 한계에 부딪힌다. \n도메인과 계층을 분리하는 대표적인 **Gradle 멀티모듈 설계 패턴 3가지**를 살펴본다.\n\n---\n\n### 패턴 1: 계층형 멀티모듈 구조 (Layered Multi-Module)\n\n가장 직관적이고 중소규모 프로젝트에서 널리 쓰이는 표준
